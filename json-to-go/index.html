<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JsonToGo — JSON to Go Struct Generator</title>
<meta name="description" content="Paste JSON and get a typed Go struct with json tags and nested structs. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('json-to-go-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#00add8;
    --bg:#f4f7f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e6e8; --shadow:0 1px 3px rgba(0,0,0,.08); --bad:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0d1417; --card:#151f23; --fg:#eef4f6; --muted:#92a2a8; --line:#233036; --shadow:0 1px 3px rgba(0,0,0,.5); --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:900px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#0086a8);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:900px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;min-height:180px;resize:vertical;tab-size:4}
  .row{display:flex;gap:12px;align-items:end;margin-top:12px}
  input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;margin:0;white-space:pre;tab-size:4}
  .err{color:var(--bad);font-size:.85rem;min-height:1em;margin-top:6px}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#003c4a;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:900px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🐹</div>
    <div><h1>JsonToGo</h1><div class="sub">Turn JSON into a typed Go struct</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="row" style="margin:0 0 12px"><div style="flex:1"><label for="root">Struct name</label><input id="root" value="AutoGenerated" style="width:100%"></div></div>
    <div class="grid">
      <div>
        <label for="input">JSON</label>
        <textarea id="input" spellcheck="false">{
  "id": 42,
  "name": "Ada",
  "active": true,
  "score": 9.5,
  "tags": ["dev", "math"],
  "address": { "city": "London", "zip": "N1" }
}</textarea>
      </div>
      <div>
        <label>Go struct</label>
        <pre id="out"></pre>
      </div>
    </div>
    <div class="err" id="err"></div>
    <div class="btns"><button class="act" id="copy" type="button">Copy Go</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/json-to-go">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function pascal(key){
    const s = String(key).replace(/(^|[^A-Za-z0-9])([A-Za-z0-9])/g, (_, __, c) => c.toUpperCase()).replace(/[^A-Za-z0-9]/g, '');
    return s || 'Field';
  }

  function goType(value, indent){
    if(value === null) return 'interface{}';
    if(typeof value === 'string') return 'string';
    if(typeof value === 'boolean') return 'bool';
    if(typeof value === 'number') return Number.isInteger(value) ? 'int' : 'float64';
    if(Array.isArray(value)){
      if(value.length === 0) return '[]interface{}';
      return '[]' + goType(value[0], indent);
    }
    if(typeof value === 'object') return structBody(value, indent);
    return 'interface{}';
  }

  function structBody(obj, indent){
    const pad = '\t'.repeat(indent + 1);
    const keys = Object.keys(obj);
    if(keys.length === 0) return 'struct{}';
    let s = 'struct {\n';
    for(const k of keys){
      s += `${pad}${pascal(k)} ${goType(obj[k], indent + 1)} \`json:"${k}"\`\n`;
    }
    s += '\t'.repeat(indent) + '}';
    return s;
  }

  function jsonToGo(jsonStr, rootName){
    const name = pascal(rootName || 'AutoGenerated');
    let data;
    try{ data = JSON.parse(jsonStr); }
    catch(e){ throw new Error('invalid JSON: ' + e.message); }
    return `type ${name} ${goType(data, 0)}`;
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    function render(){
      try{
        $('out').textContent = jsonToGo($('input').value, $('root').value);
        $('err').textContent = '';
      }catch(e){ $('out').textContent = ''; $('err').textContent = e.message; }
    }
    ['input', 'root'].forEach(id => $(id).addEventListener('input', render));
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy Go', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('json-to-go-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { pascal, goType, jsonToGo };
</script>
</body>
</html>
