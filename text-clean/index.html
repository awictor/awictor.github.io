<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextClean — clean up messy text</title>
<meta name="description" content="Free offline text cleaner. Trim lines, collapse spaces, remove blank lines, strip HTML, normalize line endings, and straighten smart quotes — pick the operations you want. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/text-clean/">
<style>
  :root{
    --c:#92400e; --bg:#fcf9f5; --fg:#231a12; --muted:#77654f;
    --card:#ffffff; --border:#ece1d5; --code:#f6eee3;
  }
  [data-theme="dark"]{
    --bg:#171009; --fg:#f1e9df; --muted:#b49d84; --card:#231810;
    --border:#3a2c1d; --code:#2c2013;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:900px;margin:0 auto;padding:24px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#d97706);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:900px;margin:0 auto;padding:6px 20px 60px}
  .opts{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:14px;
    display:flex;gap:16px;flex-wrap:wrap}
  .opts label{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .pane .h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);
    font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:7px;padding:3px 11px;cursor:pointer;font-size:.72rem;text-transform:none;letter-spacing:0}
  .copy:hover{color:var(--c);border-color:var(--c)}
  textarea{border:none;background:none;color:var(--fg);resize:vertical;min-height:340px;padding:15px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;line-height:1.6;width:100%}
  textarea:focus{outline:none}
  .stat{color:var(--muted);font-size:.8rem;padding:0 14px 12px}
  .hint{color:var(--muted);font-size:.82rem;margin:14px 0 0}
  footer{max-width:900px;margin:0 auto;padding:8px 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('tc.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">🧹</div>
  <div>
    <h1>TextClean</h1>
    <p class="sub">Clean up messy text</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="opts" id="opts">
    <label><input type="checkbox" data-op="normalizeNewlines" checked> Normalize line endings</label>
    <label><input type="checkbox" data-op="stripHtml"> Strip HTML tags</label>
    <label><input type="checkbox" data-op="straightenQuotes"> Straighten smart quotes</label>
    <label><input type="checkbox" data-op="collapseSpaces" checked> Collapse spaces</label>
    <label><input type="checkbox" data-op="trimLines" checked> Trim line ends</label>
    <label><input type="checkbox" data-op="removeBlankLines"> Remove blank lines</label>
  </div>
  <div class="grid">
    <div class="pane">
      <div class="h">Input</div>
      <textarea id="in" spellcheck="false">  “Hello”   world
<p>Some   HTML</p>


   Trailing spaces here   </textarea>
    </div>
    <div class="pane">
      <div class="h">Cleaned <button class="copy" id="copy">Copy</button></div>
      <textarea id="out" spellcheck="false" readonly></textarea>
      <div class="stat" id="stat"></div>
    </div>
  </div>
  <p class="hint">Operations run top-to-bottom in a sensible order. Everything runs locally.</p>
</main>
<footer>
  TextClean is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/text-clean">Source</a>
</footer>

<script>
// ---- pure functions ----
function normalizeNewlines(text){ return String(text).replace(/\r\n?/g, '\n'); }
function stripHtml(text){ return String(text).replace(/<[^>]*>/g, ''); }
function straightenQuotes(text){
  return String(text)
    .replace(/[“”„‟]/g, '"')
    .replace(/[‘’‚‛]/g, "'");
}
function collapseSpaces(text){ return String(text).replace(/[ \t]+/g, ' '); }
function trimLines(text){
  return String(text).split('\n').map(function(l){ return l.replace(/[ \t]+$/, ''); }).join('\n');
}
function removeBlankLines(text){
  return String(text).split('\n').filter(function(l){ return l.trim() !== ''; }).join('\n');
}
var OPS = {
  normalizeNewlines: normalizeNewlines,
  stripHtml: stripHtml,
  straightenQuotes: straightenQuotes,
  collapseSpaces: collapseSpaces,
  trimLines: trimLines,
  removeBlankLines: removeBlankLines
};
var ORDER = ['normalizeNewlines', 'stripHtml', 'straightenQuotes', 'collapseSpaces', 'trimLines', 'removeBlankLines'];
function clean(text, opts){
  opts = opts || {};
  var result = String(text);
  ORDER.forEach(function(op){ if(opts[op]) result = OPS[op](result); });
  return result;
}

if(typeof module !== 'undefined') module.exports = {
  normalizeNewlines, stripHtml, straightenQuotes, collapseSpaces, trimLines, removeBlankLines, clean, ORDER
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  var statEl = document.getElementById('stat');
  var optsEl = document.getElementById('opts');

  function currentOpts(){
    var o = {};
    [].forEach.call(optsEl.querySelectorAll('input'), function(cb){ o[cb.getAttribute('data-op')] = cb.checked; });
    return o;
  }
  function render(){
    var o = currentOpts();
    var res = clean(inEl.value, o);
    outEl.value = res;
    statEl.textContent = inEl.value.length + ' chars → ' + res.length + ' chars (' +
      (inEl.value.length - res.length) + ' removed)';
    try{ localStorage.setItem('tc.in', inEl.value); localStorage.setItem('tc.opts', JSON.stringify(o)); }catch(e){}
  }
  inEl.addEventListener('input', render);
  optsEl.addEventListener('change', render);
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.value);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var si = localStorage.getItem('tc.in'); if(si !== null) inEl.value = si;
    var so = JSON.parse(localStorage.getItem('tc.opts') || 'null');
    if(so) [].forEach.call(optsEl.querySelectorAll('input'), function(cb){
      var k = cb.getAttribute('data-op'); if(k in so) cb.checked = so[k]; });
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('tc.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('tc.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
