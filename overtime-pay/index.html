<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtime — Overtime Pay Calculator</title>
<meta name="description" content="Calculate weekly gross pay with regular, overtime (1.5×) and double-time bands from your hours, rate, and thresholds. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('overtime-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#65a30d;
    --bg:#f6f7f2; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e5e8dd; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#12140d; --card:#1b1e13; --fg:#eff2e6; --muted:#9aa389; --line:#2b301e; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#4d7c0f);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .adv{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:14px}
  @media(max-width:520px){.adv{grid-template-columns:1fr 1fr}}
  .rows{margin-top:6px}
  .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .r span{color:var(--muted)}
  .r b{font-variant-numeric:tabular-nums}
  .total{display:flex;justify-content:space-between;padding:12px 0 0;font-size:1.3rem;font-weight:800}
  .total b{color:var(--c)}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">💰</div>
    <div><h1>Overtime</h1><div class="sub">Weekly pay with overtime &amp; double-time</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="grid">
      <div><label for="hours">Hours worked</label><input type="number" id="hours" value="45" step="any" min="0"></div>
      <div><label for="rate">Hourly rate</label><input type="number" id="rate" value="20" step="any" min="0"></div>
    </div>
    <div class="adv">
      <div><label for="ot">OT after (hrs)</label><input type="number" id="ot" value="40" step="any"></div>
      <div><label for="otm">OT ×</label><input type="number" id="otm" value="1.5" step="any"></div>
      <div><label for="dt">DT after (hrs)</label><input type="number" id="dt" placeholder="none"></div>
      <div><label for="dtm">DT ×</label><input type="number" id="dtm" value="2" step="any"></div>
    </div>
  </div>
  <div class="card">
    <div class="rows" id="rows"></div>
    <div class="total"><span>Gross pay</span><b id="gross">—</b></div>
  </div>
</main>
<footer>
  Weekly gross before taxes. Estimates only — not payroll or legal advice. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/overtime-pay">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function weeklyPay(opts = {}){
    const hours = Number(opts.hours), rate = Number(opts.rate);
    const otThreshold = opts.otThreshold == null ? 40 : Number(opts.otThreshold);
    const otMult = opts.otMultiplier == null ? 1.5 : Number(opts.otMultiplier);
    const dtThreshold = opts.dtThreshold == null ? Infinity : Number(opts.dtThreshold);
    const dtMult = opts.dtMultiplier == null ? 2 : Number(opts.dtMultiplier);
    if(!(hours >= 0)) throw new Error('hours must be non-negative');
    if(!(rate >= 0)) throw new Error('rate must be non-negative');
    const regularHours = Math.min(hours, otThreshold);
    const dtHours = Math.max(0, hours - dtThreshold);
    const otHours = Math.max(0, Math.min(hours, dtThreshold) - otThreshold);
    const regularPay = regularHours * rate;
    const otPay = otHours * rate * otMult;
    const dtPay = dtHours * rate * dtMult;
    return { regularHours, otHours, dtHours, regularPay, otPay, dtPay, gross: regularPay + otPay + dtPay };
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('rows')){
    const $ = id => document.getElementById(id);
    const money = n => n.toLocaleString(undefined, { style: 'currency', currency: 'USD' });

    function render(){
      let p;
      try{
        p = weeklyPay({
          hours: +$('hours').value, rate: +$('rate').value,
          otThreshold: +$('ot').value, otMultiplier: +$('otm').value,
          dtThreshold: $('dt').value === '' ? null : +$('dt').value, dtMultiplier: +$('dtm').value
        });
      }catch(e){ $('rows').innerHTML = `<div class="r">${e.message}</div>`; $('gross').textContent = '—'; return; }
      const rows = [
        ['Regular', p.regularHours, p.regularPay],
        ['Overtime (' + (+$('otm').value) + '×)', p.otHours, p.otPay]
      ];
      if(p.dtHours > 0) rows.push(['Double-time (' + (+$('dtm').value) + '×)', p.dtHours, p.dtPay]);
      $('rows').innerHTML = rows.map(([n, h, pay]) =>
        `<div class="r"><span>${n} — ${h.toLocaleString(undefined, { maximumFractionDigits: 2 })} hrs</span><b>${money(pay)}</b></div>`
      ).join('');
      $('gross').textContent = money(p.gross);
    }

    ['hours', 'rate', 'ot', 'otm', 'dt', 'dtm'].forEach(id => $(id).addEventListener('input', render));
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('overtime-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { weeklyPay };
</script>
</body>
</html>
