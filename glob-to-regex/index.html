<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlobToRegex — Convert a Glob Pattern to a Regular Expression</title>
<meta name="description" content="Turn a shell glob (*, **, ?, [abc], {a,b}) into an equivalent regular expression and test file paths against it live. 100% offline, nothing leaves your browser.">
<script>
  (function(){ try{
    var t = localStorage.getItem('glob-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#c026d3;
    --bg:#fbf3fb; --card:#ffffff; --fg:#211826; --muted:#6a5a6c; --line:#f0e2f0; --shadow:0 1px 3px rgba(0,0,0,.08);
    --ok:#16a34a; --no:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#150c16; --card:#1f141f; --fg:#f5ecf5; --muted:#a78ea8; --line:#2e1f2e; --shadow:0 1px 3px rgba(0,0,0,.5);
    --ok:#4ade80; --no:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#a21caf);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  input.mono,textarea.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  input.big{font-size:1.2rem}
  .out{margin-top:14px}
  .regex{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:12px;word-break:break-all;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:.95rem}
  .copy{margin-top:10px;background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}
  .opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;color:var(--muted)}
  textarea{min-height:110px;resize:vertical;font-size:.95rem;margin-top:4px}
  .tests{margin-top:12px;display:flex;flex-direction:column;gap:5px}
  .t{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem}
  .t .m{font-weight:800}
  .t.hit{border-left:3px solid var(--ok)} .t.hit .m{color:var(--ok)}
  .t.miss{border-left:3px solid var(--no)} .t.miss .m{color:var(--no)}
  .err{color:var(--no);font-size:.85rem;margin-top:10px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo mono">*</div>
    <div><h1>GlobToRegex</h1><div class="sub">Glob → regular expression</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="glob">Glob pattern</label>
    <input class="mono big" id="glob" value="src/**/*.{js,ts}" spellcheck="false">
    <div class="opt"><label style="margin:0"><input type="checkbox" id="ci" style="width:auto"> case-insensitive</label></div>
    <div class="out">
      <label>Equivalent regular expression</label>
      <div class="regex" id="regex"></div>
      <button class="copy" id="copyBtn" type="button">Copy regex</button>
      <div class="err" id="err"></div>
    </div>
  </div>
  <div class="card">
    <label for="samples">Test paths (one per line)</label>
    <textarea class="mono" id="samples" spellcheck="false">src/app.js
src/util/date.ts
src/app.css
app.js
README.md</textarea>
    <div class="tests" id="tests"></div>
  </div>
</main>
<footer>
  Supports <span class="mono">*</span> (not <span class="mono">/</span>), <span class="mono">**</span> (crosses <span class="mono">/</span>), <span class="mono">?</span>, <span class="mono">[abc]</span> / <span class="mono">[!abc]</span> ranges, <span class="mono">{a,b}</span> alternation, and <span class="mono">\\</span> escapes. Full-string match. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/glob-to-regex">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  const escapeChar = c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // Convert a glob to an anchored regex source string.
  function globToRegexSource(glob){
    const s = String(glob);
    let re = '', i = 0;
    while(i < s.length){
      const c = s[i];
      if(c === '\\'){                      // escape: next char is literal
        if(i + 1 < s.length){ re += escapeChar(s[i + 1]); i += 2; }
        else { re += '\\\\'; i++; }
      }else if(c === '*'){
        if(s[i + 1] === '*'){              // globstar: cross path separators
          re += '.*'; i += 2;
          if(s[i] === '/') i++;            // consume the slash in **/
        }else{ re += '[^/]*'; i++; }       // single star: within a path segment
      }else if(c === '?'){ re += '[^/]'; i++; }
      else if(c === '['){
        let j = i + 1, neg = false;
        if(s[j] === '!' || s[j] === '^'){ neg = true; j++; }
        let cls = '';
        if(s[j] === ']'){ cls += '\\]'; j++; }
        while(j < s.length && s[j] !== ']'){
          cls += '^]\\'.includes(s[j]) ? '\\' + s[j] : s[j];
          j++;
        }
        if(j >= s.length){ re += '\\['; i++; }   // unterminated -> literal
        else { re += '[' + (neg ? '^' : '') + cls + ']'; i = j + 1; }
      }
      else if(c === '{'){
        let j = i + 1, body = '', found = false;
        while(j < s.length){ if(s[j] === '}'){ found = true; break; } body += s[j]; j++; }
        if(found){
          re += '(?:' + body.split(',').map(escapeChar).join('|') + ')';
          i = j + 1;
        }else{ re += '\\{'; i++; }
      }
      else { re += escapeChar(c); i++; }
    }
    return '^' + re + '$';
  }

  function globToRegExp(glob, flags = ''){
    return new RegExp(globToRegexSource(glob), flags);
  }

  function match(glob, str, flags = ''){
    return globToRegExp(glob, flags).test(String(str));
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('regex')){
    const $ = id => document.getElementById(id);

    function render(){
      const flags = $('ci').checked ? 'i' : '';
      let rx;
      try{ rx = globToRegExp($('glob').value, flags); $('err').textContent = ''; }
      catch(e){ $('err').textContent = e.message; $('regex').textContent = ''; $('tests').innerHTML = ''; return; }
      $('regex').textContent = '/' + rx.source + '/' + rx.flags;
      const lines = $('samples').value.split('\n');
      $('tests').innerHTML = lines.filter(l => l.length).map(l => {
        const hit = rx.test(l);
        return `<div class="t ${hit ? 'hit' : 'miss'}"><span class="m">${hit ? '✓' : '✗'}</span><span>${l.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))}</span></div>`;
      }).join('');
    }
    ['glob', 'samples'].forEach(id => $(id).addEventListener('input', render));
    $('ci').addEventListener('change', render);
    $('copyBtn').addEventListener('click', () => {
      navigator.clipboard?.writeText($('regex').textContent);
      $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy regex', 1200);
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('glob-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { globToRegexSource, globToRegExp, match };
</script>
</body>
</html>
