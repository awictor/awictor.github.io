<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base85 — Ascii85 Encoder / Decoder</title>
<meta name="description" content="Encode and decode text with Ascii85 (base85) — the compact encoding used in PDF and PostScript. Handles the z zero shorthand and optional Adobe delimiters. 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('base85-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#5b21b6;
    --bg:#f6f4fb; --card:#ffffff; --fg:#1a1526; --muted:#615a72; --line:#e8e3f2; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0f0b16; --card:#181121; --fg:#efeaf8; --muted:#998fac; --line:#261d33; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{max-width:700px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#4c1d95);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:800}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:700px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  .modes{display:flex;gap:6px;margin-bottom:14px}
  .modes button{flex:1;padding:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer;font:inherit}
  .modes button.active{background:var(--c);color:#fff;border-color:var(--c)}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:1rem;resize:vertical;word-break:break-all}
  .opt{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;color:var(--muted)}
  .out{min-height:80px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .copy{margin-top:10px;background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}
  .err{color:#dc2626;font-size:.85rem;margin-top:8px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:700px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo mono">85</div>
    <div><h1>Base85</h1><div class="sub">Ascii85 encoder / decoder</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="modes">
      <button id="mEnc" class="active" type="button">Encode</button>
      <button id="mDec" type="button">Decode</button>
    </div>
    <label for="text" id="inLabel">Text to encode</label>
    <textarea id="text" spellcheck="false">Man is distinguished</textarea>
    <label class="opt"><input type="checkbox" id="delim" style="width:auto"> wrap with Adobe delimiters &lt;~ ~&gt;</label>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <label id="outLabel">Ascii85</label>
    <div class="out" id="out"></div>
    <button class="copy" id="copyBtn" type="button">Copy</button>
  </div>
</main>
<footer>
  Ascii85 packs 4 bytes into 5 printable characters (85⁵ &gt; 2³²), ~7% denser than Base64. Used in PDF &amp; PostScript. <span class="mono">z</span> is shorthand for four zero bytes. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/base85">Source</a>.
</footer>

<script>
  // ---------- pure logic (Ascii85 / btoa flavour) ----------
  function encode(str, delimiters = false){
    const bytes = [...new TextEncoder().encode(String(str))];
    let out = '';
    for(let i = 0; i < bytes.length; i += 4){
      const chunk = bytes.slice(i, i + 4);
      const len = chunk.length;
      while(chunk.length < 4) chunk.push(0);
      let num = chunk[0] * 16777216 + chunk[1] * 65536 + chunk[2] * 256 + chunk[3];
      if(len === 4 && num === 0){ out += 'z'; continue; }
      const digits = [];
      for(let k = 0; k < 5; k++){ digits.unshift(num % 85); num = Math.floor(num / 85); }
      out += digits.slice(0, len + 1).map(d => String.fromCharCode(d + 33)).join('');
    }
    return delimiters ? '<~' + out + '~>' : out;
  }

  function decode(str){
    let s = String(str).trim().replace(/^<~/, '').replace(/~>$/, '').replace(/\s+/g, '');
    const bytes = [];
    const group = [];
    const flush = (g, count) => {
      let num = 0;
      for(const v of g) num = num * 85 + v;
      const full = [Math.floor(num / 16777216) % 256, Math.floor(num / 65536) % 256, Math.floor(num / 256) % 256, num % 256];
      for(let k = 0; k < count; k++) bytes.push(full[k]);
    };
    for(const ch of s){
      if(ch === 'z'){
        if(group.length) throw new Error("'z' cannot appear inside a group");
        bytes.push(0, 0, 0, 0);
        continue;
      }
      const v = ch.charCodeAt(0) - 33;
      if(v < 0 || v > 84) throw new Error('invalid Ascii85 character: ' + JSON.stringify(ch));
      group.push(v);
      if(group.length === 5){ flush(group, 4); group.length = 0; }
    }
    if(group.length === 1) throw new Error('truncated Ascii85 group (single trailing char)');
    if(group.length > 1){
      const n = group.length;
      while(group.length < 5) group.push(84);   // pad with 'u'
      flush(group, n - 1);
    }
    return new TextDecoder().decode(new Uint8Array(bytes));
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    let mode = 'enc';

    function render(){
      try{
        $('out').textContent = mode === 'enc' ? encode($('text').value, $('delim').checked) : decode($('text').value);
        $('err').textContent = '';
      }catch(e){ $('out').textContent = ''; $('err').textContent = e.message; }
    }
    function setMode(m){
      mode = m;
      $('mEnc').classList.toggle('active', m === 'enc');
      $('mDec').classList.toggle('active', m === 'dec');
      $('inLabel').textContent = m === 'enc' ? 'Text to encode' : 'Ascii85 to decode';
      $('outLabel').textContent = m === 'enc' ? 'Ascii85' : 'Decoded text';
      render();
    }
    $('mEnc').addEventListener('click', () => setMode('enc'));
    $('mDec').addEventListener('click', () => setMode('dec'));
    ['text', 'delim'].forEach(id => $(id).addEventListener('input', render));
    $('copyBtn').addEventListener('click', () => {
      navigator.clipboard?.writeText($('out').textContent);
      $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy', 1200);
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('base85-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { encode, decode };
</script>
</body>
</html>
