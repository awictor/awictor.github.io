<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON to XML — convert JSON into XML</title>
<meta name="description" content="Convert JSON to clean, indented XML — arrays become repeated elements, nested objects nest, and text is escaped. Custom root name. Offline, no tracking.">
<style>
  :root{
    --c:#db2777;
    --bg:#fbf4f8; --card:#ffffff; --fg:#211320; --muted:#786070;
    --line:#efdfe9; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.05);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#170e14; --card:#22161e; --fg:#f5eaf1; --muted:#b598a8;
    --line:#382634; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{max-width:960px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;
    font-size:15px;font-weight:800;color:#fff;flex:0 0 auto;font-family:ui-monospace,monospace}
  h1{font-size:1.4rem;margin:0}
  header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
  .theme{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem}
  main{max-width:960px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  .opts{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
  .opts .f{flex:0 0 auto}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=number],select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.cols{grid-template-columns:1fr}}
  textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;padding:12px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:260px;resize:vertical;white-space:pre;overflow-wrap:normal}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .copy{margin-top:10px;background:var(--c);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
  .err{color:#dc2626;font-size:.85rem;margin-top:6px;min-height:18px}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:26px}
  .foot a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="logo">&lt;x/&gt;</div>
  <div>
    <h1>JSON to XML</h1>
    <p>Convert JSON into clean, indented XML</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="card">
    <div class="opts">
      <div class="f"><label for="root">Root element</label><input type="text" id="root" value="root" style="width:130px"></div>
      <div class="f"><label for="indent">Indent</label>
        <select id="indent"><option>2</option><option>4</option><option>0</option></select></div>
      <div class="f"><label for="decl"><input type="checkbox" id="decl"> XML declaration</label></div>
    </div>
    <div class="cols">
      <div>
        <label for="in">JSON</label>
        <textarea id="in" spellcheck="false">{
  "book": {
    "title": "JSON & XML",
    "authors": ["Ada", "Grace"],
    "year": 2026,
    "inPrint": true
  }
}</textarea>
        <div class="err" id="err"></div>
      </div>
      <div>
        <label for="out">XML</label>
        <textarea id="out" readonly></textarea>
        <button class="copy" id="copy">Copy XML</button>
      </div>
    </div>
  </div>

  <p class="foot">100% offline · nothing leaves your browser · part of the
    <a href="https://awictor.github.io/toolkit/">Toolkit</a></p>
</main>

<script>
  function typeOf(v){ if(v === null) return 'null'; if(Array.isArray(v)) return 'array'; return typeof v; }
  function escapeXml(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function sanitizeName(key){
    var name = String(key).replace(/[^A-Za-z0-9_.\-]/g, '_');
    if(name === '' || /^[^A-Za-z_]/.test(name)) name = '_' + name;
    return name;
  }
  function toXml(value, key, depth, indentStr){
    var name = sanitizeName(key);
    var pad = indentStr.repeat(depth);
    var t = typeOf(value);
    if(t === 'array'){
      if(value.length === 0) return pad + '<' + name + '/>';
      return value.map(function(item){ return toXml(item, key, depth, indentStr); }).join(indentStr ? '\n' : '');
    }
    if(t === 'object'){
      var keys = Object.keys(value);
      if(keys.length === 0) return pad + '<' + name + '/>';
      var nl = indentStr ? '\n' : '';
      var inner = keys.map(function(k){ return toXml(value[k], k, depth + 1, indentStr); }).join(nl);
      return pad + '<' + name + '>' + nl + inner + nl + pad + '</' + name + '>';
    }
    if(t === 'null' || value === undefined) return pad + '<' + name + '/>';
    return pad + '<' + name + '>' + escapeXml(value) + '</' + name + '>';
  }
  function jsonToXml(obj, options){
    options = options || {};
    var root = options.root || 'root';
    var indent = options.indent == null ? 2 : options.indent;
    var indentStr = indent > 0 ? ' '.repeat(indent) : '';
    var xml = toXml(obj, root, 0, indentStr);
    if(options.declaration) xml = '<?xml version="1.0" encoding="UTF-8"?>' + (indentStr ? '\n' : '') + xml;
    return xml;
  }

  if(typeof module !== 'undefined') module.exports = { escapeXml:escapeXml, sanitizeName:sanitizeName, jsonToXml:jsonToXml };

  // ---- UI ----
  if(typeof document !== 'undefined'){
    var inp=document.getElementById('in'), out=document.getElementById('out'), err=document.getElementById('err');
    var root=document.getElementById('root'), indent=document.getElementById('indent'), decl=document.getElementById('decl');
    function render(){
      try{
        var obj = JSON.parse(inp.value);
        err.textContent = '';
        out.value = jsonToXml(obj, { root: root.value || 'root', indent: Number(indent.value), declaration: decl.checked });
      }catch(e){ err.textContent = '✗ ' + e.message; }
    }
    [inp, root, indent, decl].forEach(function(el){ el.addEventListener('input', render); });
    decl.addEventListener('change', render);
    document.getElementById('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText(out.value); });

    var rootEl=document.documentElement, tb=document.getElementById('theme');
    function setTheme(t){ rootEl.setAttribute('data-theme',t); tb.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('j2x-theme',t);}catch(e){} }
    var saved; try{ saved=localStorage.getItem('j2x-theme'); }catch(e){}
    setTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    tb.addEventListener('click', function(){ setTheme(rootEl.getAttribute('data-theme')==='dark'?'light':'dark'); });

    render();
  }
</script>
</body>
</html>
