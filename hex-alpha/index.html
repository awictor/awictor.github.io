<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HexAlpha — Opacity ⇄ Hex Alpha (#RRGGBBAA) Converter</title>
<meta name="description" content="Convert an opacity percentage to an 8-bit hex alpha suffix for #RRGGBBAA, and build rgba() — or read the opacity back from a hex alpha. Live swatch, 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('hexalpha-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#8b5cf6;
    --bg:#f6f4fb; --card:#ffffff; --fg:#1a1626; --muted:#615a72; --line:#e8e3f2; --shadow:0 1px 3px rgba(0,0,0,.08);
    --checker:#ccc;
  }
  [data-theme="dark"]{
    --bg:#0e0b16; --card:#181320; --fg:#efeaf8; --muted:#998fac; --line:#261f33; --shadow:0 1px 3px rgba(0,0,0,.5);
    --checker:#444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{max-width:620px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#6d28d9);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:620px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  .swatch{height:100px;border-radius:12px;border:1px solid var(--line);margin-bottom:16px;
    background-image:linear-gradient(45deg,var(--checker) 25%,transparent 25%),linear-gradient(-45deg,var(--checker) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--checker) 75%),linear-gradient(-45deg,transparent 75%,var(--checker) 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;position:relative}
  .swatch > div{position:absolute;inset:0;border-radius:11px}
  .hexrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;margin-bottom:14px}
  input[type=color]{width:52px;height:42px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
  input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:1.1rem}
  input[type=range]{width:100%;accent-color:var(--c)}
  .opa{display:flex;justify-content:space-between;font-size:.85rem;margin:12px 0 4px}
  .opa b{color:var(--c)}
  .outs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .o{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .o .v{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .o button{background:none;border:0;color:var(--c);cursor:pointer;font:inherit}
  .err{color:#dc2626;font-size:.85rem;margin-top:8px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:620px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🌫️</div>
    <div><h1>HexAlpha</h1><div class="sub">Opacity ⇄ hex alpha</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="swatch"><div id="sw"></div></div>
    <div class="hexrow">
      <input type="color" id="picker" value="#8b5cf6">
      <input type="text" id="hex" value="#8b5cf6" spellcheck="false">
    </div>
    <div class="opa"><label style="margin:0">Opacity</label><b id="opaVal">100%</b></div>
    <input type="range" id="opa" min="0" max="100" value="100" step="1">
    <div class="outs" id="outs"></div>
    <div class="err" id="err"></div>
  </div>
</main>
<footer>
  Modern CSS accepts an 8-digit hex color <span class="mono">#RRGGBBAA</span>, where the last byte is opacity (00 = transparent, ff = opaque). HexAlpha converts between a percentage and that byte. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/hex-alpha">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  // Opacity percent (0–100) → 2-digit hex alpha byte.
  function opacityToHex(pct){
    const p = Number(pct);
    if(!Number.isFinite(p) || p < 0 || p > 100) throw new Error('opacity must be 0–100');
    return Math.round(p / 100 * 255).toString(16).padStart(2, '0');
  }

  // 2-digit hex alpha byte → opacity percent (0–100).
  function hexToOpacity(hh){
    if(!/^[0-9a-fA-F]{2}$/.test(String(hh).trim())) throw new Error('alpha must be 2 hex digits');
    return parseInt(hh, 16) / 255 * 100;
  }

  function normalizeHex6(hex){
    let h = String(hex).trim().replace(/^#/, '');
    if(/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(c => c + c).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('enter a 6-digit hex color');
    return '#' + h.toLowerCase();
  }

  // #RRGGBB + opacity → #RRGGBBAA.
  function withAlpha(hex6, pct){
    return normalizeHex6(hex6) + opacityToHex(pct);
  }

  // #RRGGBB + opacity → rgba(r, g, b, a).
  function toRgba(hex6, pct){
    const h = normalizeHex6(hex6).slice(1);
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const a = Math.round(Number(pct)) / 100;
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('outs')){
    const $ = id => document.getElementById(id);

    function render(){
      try{
        const hex = normalizeHex6($('hex').value);
        const pct = +$('opa').value;
        $('picker').value = hex;
        $('opaVal').textContent = pct + '%';
        const rgba = toRgba(hex, pct);
        $('sw').style.background = rgba;
        const rows = [
          ['#RRGGBBAA', withAlpha(hex, pct)],
          ['rgba()', rgba],
          ['alpha byte', opacityToHex(pct)]
        ];
        $('outs').innerHTML = rows.map(([k, v]) =>
          `<div class="o"><span>${k}</span><span class="v">${v} <button data-c="${v}" type="button">copy</button></span></div>`).join('');
        $('outs').querySelectorAll('button').forEach(b =>
          b.addEventListener('click', () => { navigator.clipboard?.writeText(b.dataset.c); b.textContent = '✓'; setTimeout(() => b.textContent = 'copy', 1000); }));
        $('err').textContent = '';
      }catch(e){ $('outs').innerHTML = ''; $('err').textContent = e.message; }
    }
    $('hex').addEventListener('input', render);
    $('picker').addEventListener('input', () => { $('hex').value = $('picker').value; render(); });
    $('opa').addEventListener('input', render);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('hexalpha-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { opacityToHex, hexToOpacity, normalizeHex6, withAlpha, toRgba };
</script>
</body>
</html>
