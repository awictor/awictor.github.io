<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FractionConvert — Decimal ↔ Fraction Converter</title>
<meta name="description" content="Convert decimals to fractions and fractions to decimals, simplified, at your chosen denominator. Parses mixed numbers like 1 1/2. 100% offline, no signup." />
<meta name="theme-color" content="#4338ca" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="FractionConvert — Decimal ↔ Fraction Converter" />
<meta property="og:description" content="Decimal to fraction and back, simplified, mixed numbers supported. Offline." />
<meta property="og:url" content="https://awictor.github.io/fraction-convert/" />
<link rel="canonical" href="https://awictor.github.io/fraction-convert/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234338ca'/%3E%3Cline x1='38' y1='20' x2='26' y2='44' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='24' r='4' fill='%23fff'/%3E%3Ccircle cx='38' cy='40' r='4' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f2f3fb; --ink:#171634; --accent:#4338ca; --accent-d:#3730a3;
    --card:#fff; --line:#dedcf2; --muted:#5a5880; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(23,22,52,.05),0 8px 24px rgba(23,22,52,.07); }
  [data-theme="dark"]{ --bg:#0b0a1a; --ink:#eae9f7; --accent:#a5b4fc; --accent-d:#c7d2fe;
    --card:#15142a; --line:#282544; --muted:#948fc0; --bad:#f0685c; --field:#0b0a1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  input[type=text]{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;font-size:18px;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(67,56,202,.15)}
  input.bad{border-color:var(--bad)}
  .out{margin-top:10px;font-size:15px;color:var(--muted);min-height:24px}
  .out b{color:var(--accent);font-size:24px}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  select{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("fraction.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Fraction</span>Convert</h1>
  <p>Decimal to fraction and back, simplified. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Decimal → fraction</h2>
    <input id="dec" type="text" inputmode="decimal" value="0.375" spellcheck="false">
    <div class="row"><span style="font-size:13px;color:var(--muted)">Round to nearest</span>
      <select id="denom"><option value="8">1/8</option><option value="16">1/16</option><option value="32">1/32</option><option value="64" selected>1/64</option><option value="100">1/100</option></select></div>
    <div class="out" id="fracOut"></div>
  </section>
  <section class="card">
    <h2>Fraction → decimal</h2>
    <input id="frac" type="text" value="1 1/2" spellcheck="false" placeholder="e.g. 3/4 or 1 1/2">
    <div class="out" id="decOut"></div>
  </section>
</div>

<footer>
  <b>FractionConvert</b> · offline decimal ↔ fraction converter · <a href="https://github.com/awictor/fraction-convert">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Accepts mixed numbers like <code>1 1/2</code>. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure fraction math ---
function gcd(a,b){ a=Math.abs(a);b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function decimalToFraction(x,maxDenom){
  maxDenom=maxDenom||64;
  const neg=x<0; x=Math.abs(x);
  const whole=Math.floor(x); let frac=x-whole;
  if(frac<1e-9) return {whole:neg?-whole:whole, num:0, den:1};
  let bestN=1,bestD=1,bestErr=Infinity;
  for(let d=1;d<=maxDenom;d++){ const nn=Math.round(frac*d); const err=Math.abs(frac-nn/d); if(err<bestErr-1e-12){ bestErr=err; bestN=nn; bestD=d; } }
  const g=gcd(bestN,bestD); bestN/=g; bestD/=g;
  return {whole:neg?-whole:whole, num:bestN, den:bestD};
}
function fractionToDecimal(num,den){ return den ? num/den : 0; }
function parseFraction(str){
  const s=String(str).trim(); let m;
  if((m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/))){ const w=+m[1],n=+m[2],d=+m[3]; if(!d) return null; return (w<0?-1:1)*(Math.abs(w)+n/d); }
  if((m=s.match(/^(-?\d+)\/(\d+)$/))){ const n=+m[1],d=+m[2]; if(!d) return null; return n/d; }
  if(/^-?\d*\.?\d+$/.test(s)&&s!==""&&s!=="-"&&s!==".") return parseFloat(s);
  return null;
}

// --- UI ---
function fmtFrac(f){
  if(f.num===0) return String(f.whole);
  if(f.whole===0) return `${f.num}/${f.den}`;
  return `${f.whole} ${f.num}/${f.den}`;
}
function renderDec(){
  const raw=$("dec").value.trim(); try{localStorage.setItem("fraction.dec",raw);localStorage.setItem("fraction.denom",$("denom").value);}catch(e){}
  const v=parseFloat(raw);
  if(raw===""||isNaN(v)){ $("dec").classList.toggle("bad",raw!=="" ); $("fracOut").textContent=""; return; }
  $("dec").classList.remove("bad");
  const f=decimalToFraction(v,+$("denom").value);
  $("fracOut").innerHTML="= <b>"+fmtFrac(f)+"</b>";
}
function renderFrac(){
  const raw=$("frac").value.trim(); try{localStorage.setItem("fraction.frac",raw);}catch(e){}
  if(raw===""){ $("decOut").textContent=""; $("frac").classList.remove("bad"); return; }
  const v=parseFraction(raw);
  if(v==null){ $("frac").classList.add("bad"); $("decOut").textContent="Not a valid fraction."; return; }
  $("frac").classList.remove("bad");
  $("decOut").innerHTML="= <b>"+(Math.round(v*1e6)/1e6)+"</b>";
}
$("dec").addEventListener("input",renderDec);
$("denom").addEventListener("change",renderDec);
$("frac").addEventListener("input",renderFrac);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("fraction.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const d=localStorage.getItem("fraction.dec");if(d!=null)$("dec").value=d;const dn=localStorage.getItem("fraction.denom");if(dn)$("denom").value=dn;const f=localStorage.getItem("fraction.frac");if(f!=null)$("frac").value=f;}catch(e){}
renderDec(); renderFrac();

if(typeof module!=="undefined") module.exports={gcd,decimalToFraction,fractionToDecimal,parseFraction};
</script>
</body>
</html>
