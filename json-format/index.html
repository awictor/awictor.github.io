<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSONFormat — JSON Formatter, Validator &amp; Minifier</title>
<meta name="description" content="Beautify, validate, and minify JSON in your browser with clear error messages and structure stats. 100% offline — your data never leaves your device." />
<meta name="theme-color" content="#ca8a04" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="JSONFormat — JSON Formatter & Validator" />
<meta property="og:description" content="Beautify, validate, and minify JSON locally with error messages and stats. Offline." />
<meta property="og:url" content="https://awictor.github.io/json-format/" />
<link rel="canonical" href="https://awictor.github.io/json-format/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ca8a04'/%3E%3Ctext x='32' y='42' font-size='24' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3E%7B%7D%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#faf7ec; --ink:#241f0c; --accent:#ca8a04; --accent-d:#a16207;
    --card:#fff; --line:#ece3c9; --muted:#6d6446; --good:#16a34a; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(36,31,12,.05),0 8px 24px rgba(36,31,12,.07); }
  [data-theme="dark"]{ --bg:#14120a; --ink:#f3efe0; --accent:#facc15; --accent-d:#fde047;
    --card:#1d1a0f; --line:#332e1a; --muted:#a59c78; --good:#34c884; --bad:#f0685c; --field:#14120a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:820px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  textarea{width:100%;min-height:180px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);resize:vertical;line-height:1.6;white-space:pre;overflow-wrap:normal}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(202,138,4,.15)}
  textarea.out{background:var(--bg)}
  .tools{display:flex;gap:8px;margin:12px 0;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  select{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font-size:14px}
  #status{font-size:13px;font-weight:600;min-height:18px}
  #status.ok{color:var(--good)} #status.bad{color:var(--bad)}
  #msg{font-size:12px;color:var(--muted)}
  .stats{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px;font-size:13px;color:var(--muted)}
  .stats b{color:var(--ink)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("jsonfmt.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">JSON</span>Format</h1>
  <p>Beautify, validate, and minify JSON. Runs 100% in your browser — your data never leaves your device.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Input</h2>
    <textarea id="input" spellcheck="false" placeholder='Paste JSON, e.g. {"hello":"world","list":[1,2,3]}'>{"hello":"world","list":[1,2,3],"nested":{"ok":true}}</textarea>
    <div class="tools">
      <button class="btn primary" id="fmtBtn">Beautify</button>
      <button class="btn" id="minBtn">Minify</button>
      <label style="font-size:13px;color:var(--muted)">Indent
        <select id="indent"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="\t">Tab</option></select>
      </label>
    </div>
    <div id="status"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card">
    <h2>Output</h2>
    <textarea id="output" class="out" spellcheck="false" readonly></textarea>
    <div class="tools"><button class="btn" id="copyBtn">Copy</button><button class="btn" id="useBtn">Use as input</button><span id="msg"></span></div>
  </section>
</div>

<footer>
  <b>JSONFormat</b> · offline JSON formatter &amp; validator · <a href="https://github.com/awictor/json-format">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure JSON logic ---
function parseJson(s){ try{ return {ok:true, value:JSON.parse(s)}; }catch(e){ return {ok:false, error:e.message}; } }
function formatJson(s,indent){ const r=parseJson(s); if(!r.ok) return {ok:false, output:null, error:r.error}; return {ok:true, output:JSON.stringify(r.value,null,indent==null?2:indent), error:null}; }
function minifyJson(s){ const r=parseJson(s); if(!r.ok) return {ok:false, output:null, error:r.error}; return {ok:true, output:JSON.stringify(r.value), error:null}; }
function jsonStats(value){
  let keys=0,arrays=0,strings=0,numbers=0,maxDepth=0;
  (function walk(v,d){ if(d>maxDepth)maxDepth=d;
    if(Array.isArray(v)){ arrays++; v.forEach(x=>walk(x,d+1)); }
    else if(v&&typeof v==="object"){ const k=Object.keys(v); keys+=k.length; k.forEach(kk=>walk(v[kk],d+1)); }
    else if(typeof v==="string") strings++;
    else if(typeof v==="number") numbers++;
  })(value,0);
  return {keys,arrays,strings,numbers,depth:maxDepth};
}

// --- UI ---
function indentVal(){ const v=$("indent").value; return v==="\t"?"\t":parseInt(v); }
function run(kind){
  const s=$("input").value;
  try{localStorage.setItem("jsonfmt.input",s);}catch(e){}
  const r = kind==="min" ? minifyJson(s) : formatJson(s,indentVal());
  if(!r.ok){
    $("status").className="bad"; $("status").textContent="✗ Invalid JSON — "+r.error;
    $("stats").innerHTML=""; return;
  }
  $("status").className="ok"; $("status").textContent="✓ Valid JSON";
  $("output").value=r.output;
  const st=jsonStats(parseJson(s).value);
  $("stats").innerHTML=`<span>Keys: <b>${st.keys}</b></span><span>Arrays: <b>${st.arrays}</b></span><span>Strings: <b>${st.strings}</b></span><span>Numbers: <b>${st.numbers}</b></span><span>Max depth: <b>${st.depth}</b></span><span>Size: <b>${r.output.length.toLocaleString()} chars</b></span>`;
}
$("fmtBtn").onclick=()=>run("fmt");
$("minBtn").onclick=()=>run("min");
$("indent").onchange=()=>run("fmt");
$("copyBtn").onclick=()=>{const v=$("output").value;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1200);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();};
$("useBtn").onclick=()=>{const v=$("output").value;if(v){$("input").value=v;run("fmt");}};
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("jsonfmt.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const s=localStorage.getItem("jsonfmt.input");if(s!=null)$("input").value=s;}catch(e){}
run("fmt");

if(typeof module!=="undefined") module.exports={parseJson,formatJson,minifyJson,jsonStats};
</script>
</body>
</html>
