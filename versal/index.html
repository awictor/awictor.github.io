<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versal — Illuminated Manuscript Initials</title>
<style>
  :root{ --parch:#f3ead4; --parch2:#e7d9b6; --ink:#3a2c17; --line:#b39b6a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #fbf6e6, transparent),
      repeating-linear-gradient(0deg,#f3ead4,#f3ead4 2px,#f0e6cd 2px,#f0e6cd 4px);
    color:var(--ink);
    display:flex; flex-direction:column; min-height:100%;
  }
  header{ text-align:center; padding:14px 10px 4px; }
  header h1{ margin:0; font-size:30px; letter-spacing:.14em; font-variant:small-caps; color:#6e3319; }
  header p{ margin:3px 0 0; font-size:13px; font-style:italic; color:#7a6a45; }
  .bar{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    padding:10px; max-width:960px; margin:6px auto;
    background:rgba(255,255,255,.35); border:1px solid var(--line); border-radius:8px;
  }
  .bar label{ font-size:12px; font-variant:small-caps; letter-spacing:.05em; display:flex; align-items:center; gap:5px; }
  input[type=text],select{
    font-family:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--line);
    background:#fffdf6; color:var(--ink); border-radius:5px;
  }
  #letter{ width:52px; text-align:center; font-size:22px; text-transform:uppercase; }
  #word{ width:120px; text-transform:uppercase; }
  button{
    font-family:inherit; font-size:13px; padding:6px 11px; cursor:pointer;
    border:1px solid #6e3319; background:linear-gradient(#f6e6b8,#e6c266); color:#3a1c0e;
    border-radius:5px; font-variant:small-caps; letter-spacing:.04em;
  }
  button:hover{ background:linear-gradient(#fff0c8,#eccd78); }
  button:active{ transform:translateY(1px); }
  .sep{ width:1px; align-self:stretch; background:var(--line); margin:0 2px; }
  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:8px 12px 24px; }
  #stage{ width:min(78vh,560px); max-width:94vw; }
  #stage svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 8px 24px rgba(60,40,10,.35)); border-radius:6px; }
  /* paragraph mode */
  #para{ display:none; max-width:820px; width:100%; background:#f7efd8; border:1px solid var(--line);
    box-shadow:0 8px 30px rgba(60,40,10,.3); padding:34px 40px 40px 30px; }
  #para.on{ display:block; }
  .pwrap{ display:flex; gap:22px; }
  .mbar{ flex:0 0 12px; align-self:stretch; border-radius:3px;
    background:repeating-linear-gradient(180deg,#d8b23d,#d8b23d 10px,#9c7a20 10px,#9c7a20 13px);
    box-shadow:inset 0 0 0 1px #6e3319; }
  #paraInit{ flex:0 0 190px; }
  #paraInit svg{ width:190px; height:auto; display:block; }
  .ptext{ flex:1; }
  .ptext h2{ margin:0 0 8px; font-variant:small-caps; letter-spacing:.1em; color:#6e3319; font-size:20px; }
  .ptext p{ margin:0; font-size:19px; line-height:1.72; text-align:justify; color:#2f2410;
    text-indent:0; }
  .drop{ float:none; }
  /* gilding reveal animation (applies to injected inline SVG) */
  @keyframes drawon{ to{ stroke-dashoffset:0; } }
  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes sheen{ 0%{ opacity:0 } 40%{ opacity:.9 } 100%{ opacity:.35 } }
  svg.reveal .vine{ stroke-dasharray:100; stroke-dashoffset:100; animation:drawon 1.5s ease forwards; }
  svg.reveal .fil{ stroke-dasharray:100; stroke-dashoffset:100; animation:drawon 1.7s ease forwards; }
  svg.reveal .foli{ opacity:0; animation:fadein .9s ease forwards; }
  svg.reveal .gold{ opacity:0; animation:fadein 1s ease forwards; }
  svg.reveal .sheen{ animation:sheen 1.8s ease forwards; }
  svg.reveal .glyph{ opacity:0; animation:fadein 1.1s ease .35s forwards; }
  svg.reveal .medal{ opacity:0; animation:fadein .8s ease .6s forwards; }
  @media (prefers-reduced-motion: reduce){
    svg.reveal .vine, svg.reveal .fil, svg.reveal .foli, svg.reveal .gold,
    svg.reveal .sheen, svg.reveal .glyph, svg.reveal .medal{
      animation:none !important; stroke-dashoffset:0 !important; opacity:1 !important;
    }
  }
  footer{ text-align:center; font-size:11px; color:#8a7a52; padding:0 0 14px; font-style:italic; }
  code{ background:rgba(0,0,0,.06); padding:1px 4px; border-radius:3px; }
</style>
</head>
<body>
<header>
  <h1>Versal</h1>
  <p>Type a letter, get an illuminated manuscript initial.</p>
</header>

<div class="bar">
  <label>Letter <input id="letter" type="text" maxlength="1" value="A" pattern="[A-Za-z]" title="A–Z only" aria-label="Initial letter (A–Z only)"></label>
  <label>Style
    <select id="style">
      <option value="gothic">Gothic · Lapis &amp; Gold</option>
      <option value="celtic">Insular · Celtic</option>
      <option value="romanesque">Romanesque · Earth</option>
      <option value="renaissance">Renaissance · Floral</option>
    </select>
  </label>
  <button id="reseed">Reseed</button>
  <button id="rand">Random Letter</button>
  <label><input id="hist" type="checkbox"> Historiated</label>
  <label><input id="pmode" type="checkbox"> Paragraph</label>
  <span class="sep"></span>
  <button id="svg">SVG</button>
  <button id="png">PNG</button>
  <button id="copy">Copy Link</button>
  <span class="sep"></span>
  <label>Sheet <input id="word" type="text" placeholder="A–Z" maxlength="14"></label>
  <button id="sheet">Contact Sheet</button>
</div>

<main>
  <div id="stage"></div>
  <div id="para">
    <div class="pwrap">
      <div class="mbar"></div>
      <div id="paraInit"></div>
      <div class="ptext">
        <h2 id="ptitle"></h2>
        <p></p>
      </div>
    </div>
  </div>
</main>
<footer>Every initial is a shareable permalink — the seed lives in the URL hash · zero dependencies</footer>

<script>
"use strict";
const PAL = {
  gothic:{name:"Gothic · Lapis & Gold", field:"#22458c", field2:"#193066", gold:"#ecc94b", gold2:"#a9791f", leafA:"#b6321f", leafB:"#2f7d4d", berry:"#e6b93a", stem:"#f2d98a", fil:"#f6ecc9", ink:"#0f1e40", frame:"#122a5c", sky:"#c7dbeb"},
  celtic:{name:"Insular · Celtic", field:"#0c6b5f", field2:"#074e45", gold:"#e0b23a", gold2:"#946614", leafA:"#c0392b", leafB:"#d9a520", berry:"#f0d060", stem:"#f4e2a0", fil:"#f7edcf", ink:"#06342e", frame:"#0a5349", sky:"#cfe6dd"},
  romanesque:{name:"Romanesque · Earth", field:"#8a4426", field2:"#5f2c17", gold:"#d0a24d", gold2:"#8a6620", leafA:"#7a7d2a", leafB:"#b5762a", berry:"#c9a24b", stem:"#e6cf9a", fil:"#f0e2c2", ink:"#3a1c0e", frame:"#6e3319", sky:"#ecdcc0"},
  renaissance:{name:"Renaissance · Floral", field:"#f2ead6", field2:"#e5dabf", gold:"#d8b23d", gold2:"#9c7a20", leafA:"#4b8b3b", leafB:"#d06a8a", berry:"#c94f6d", stem:"#6ea24d", fil:"#7a5a2a", ink:"#5a4a24", frame:"#c9b47e", sky:"#eef0dc"}
};
const LOREM = "Incipit liber generationis, in principio erat verbum, et lux fulgebat per foliata capitula. Scriptor calamo aureo pinxit litteram, dum vinea et acanthus in margine crescebant per saecula.";

// ---- seeded PRNG ----
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// ---- state ----
const S = { letter:"A", style:"gothic", seed:1, hist:false, para:false };

function parseHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h) return;
  const p = h.split("-");
  if(p[0]) S.letter = (p[0][0]||"A").toUpperCase();
  if(p[1] && PAL[p[1]]) S.style = p[1];
  if(p[2] && !isNaN(+p[2])) S.seed = +p[2];
  S.hist = p.includes("h");
  S.para = p.includes("p");
}
function writeHash(){
  let h = S.letter + "-" + S.style + "-" + S.seed;
  if(S.hist) h += "-h";
  if(S.para) h += "-p";
  history.replaceState(null,"", "#"+h);
}

// ---- ornament geometry ----
function leaf(x,y,a,s){
  const tx=x+Math.cos(a)*s, ty=y+Math.sin(a)*s, n=a+Math.PI/2, w=s*0.42;
  const c1x=x+Math.cos(n)*w, c1y=y+Math.sin(n)*w, c2x=tx+Math.cos(a-0.6)*s*0.3, c2y=ty+Math.sin(a-0.6)*s*0.3;
  return `M${x.toFixed(1)},${y.toFixed(1)} Q${c1x.toFixed(1)},${c1y.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} Q${c2x.toFixed(1)},${c2y.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)} Z`;
}
function spiral(cx,cy,a0,dir,coils,rMax){
  let d="", first=true, steps=Math.ceil(coils*14);
  for(let i=0;i<=steps;i++){ const t=i/steps, a=a0+dir*coils*6.283*t, r=rMax*(1-t)*0.92+2;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    d += (first?"M":"L")+x.toFixed(1)+","+y.toFixed(1); first=false; }
  return d;
}

// grow recursive acanthus/vine, pushing into arrays
function acanthus(x,y,ang,len,depth,rnd,P,out,side){
  if(depth<=0 || len<14) return;
  const curl = (rnd()*0.7-0.15) * side;
  const ex=x+Math.cos(ang)*len, ey=y+Math.sin(ang)*len;
  const cx=x+Math.cos(ang+curl)*len*0.55, cy=y+Math.sin(ang+curl)*len*0.55;
  out.stems.push(`M${x.toFixed(1)},${y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`);
  const nleaf = 1 + (rnd()<0.6?1:0);
  for(let i=0;i<nleaf;i++){
    const t=0.35+i*0.4, lx=x+(ex-x)*t+(cx-x)*0.2, ly=y+(ey-y)*t+(cy-y)*0.2;
    const la=ang + (i%2? -1:1)*(1.0+rnd()*0.5), ls=len*(0.4+rnd()*0.25);
    out.leaves.push({d:leaf(lx,ly,la,ls), c:(rnd()<0.5?P.leafA:P.leafB)});
  }
  if(rnd()<0.4){ // berry cluster at tip
    for(let b=0;b<3;b++) out.berries.push({x:ex+(rnd()-0.5)*10, y:ey+(rnd()-0.5)*10, r:3+rnd()*2});
  }
  acanthus(ex,ey, ang+0.55*side + (rnd()-0.5)*0.3, len*0.72, depth-1, rnd, P, out, side);
  if(rnd()<0.7) acanthus(ex,ey, ang-0.65*side + (rnd()-0.5)*0.3, len*0.62, depth-1, rnd, P, out, -side);
}

function motif(kind,cx,cy,r,rnd,P){
  let g="";
  if(kind==="sun"){
    for(let i=0;i<12;i++){ const a=i/12*6.283, r1=r*0.55, r2=r*0.92;
      g+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}" stroke="${P.gold2}" stroke-width="2.4"/>`; }
    g+=`<circle cx="${cx}" cy="${cy}" r="${(r*0.42).toFixed(1)}" fill="${P.gold}" stroke="${P.gold2}" stroke-width="2"/>`;
    for(let i=0;i<6;i++){ const a=i/6*6.283; g+=`<circle cx="${(cx+Math.cos(a)*r*0.24).toFixed(1)}" cy="${(cy+Math.sin(a)*r*0.24).toFixed(1)}" r="2" fill="${P.gold2}"/>`; }
  } else if(kind==="bird"){
    const bx=cx-r*0.15, by=cy+r*0.1;
    g+=`<path d="M${(bx-r*0.5).toFixed(1)},${by.toFixed(1)} Q${bx.toFixed(1)},${(by-r*0.55).toFixed(1)} ${(bx+r*0.5).toFixed(1)},${(by-r*0.1).toFixed(1)} Q${(bx+r*0.1).toFixed(1)},${(by+r*0.45).toFixed(1)} ${(bx-r*0.5).toFixed(1)},${by.toFixed(1)} Z" fill="${P.leafB}" stroke="${P.ink}" stroke-width="1.5"/>`;
    g+=`<path d="M${(bx+r*0.4).toFixed(1)},${(by-r*0.15).toFixed(1)} Q${(bx+r*0.75).toFixed(1)},${(by-r*0.35).toFixed(1)} ${(bx+r*0.82).toFixed(1)},${(by-r*0.05).toFixed(1)}" fill="none" stroke="${P.ink}" stroke-width="1.5"/>`;
    g+=`<circle cx="${(bx+r*0.5).toFixed(1)}" cy="${(by-r*0.22).toFixed(1)}" r="2.4" fill="${P.ink}"/>`;
    g+=`<path d="M${(bx+r*0.62).toFixed(1)},${(by-r*0.2).toFixed(1)} l${(r*0.18).toFixed(1)},-2 l-${(r*0.02).toFixed(1)},5 Z" fill="${P.gold2}"/>`;
    g+=`<path d="M${(bx-r*0.3).toFixed(1)},${(by-r*0.1).toFixed(1)} q${(r*0.3).toFixed(1)},${(r*0.2).toFixed(1)} ${(r*0.55).toFixed(1)},0" fill="none" stroke="${P.gold2}" stroke-width="1.4"/>`;
  } else { // knotwork medallion
    for(let i=0;i<4;i++){ const a=i/4*6.283;
      g+=`<circle cx="${(cx+Math.cos(a)*r*0.4).toFixed(1)}" cy="${(cy+Math.sin(a)*r*0.4).toFixed(1)}" r="${(r*0.45).toFixed(1)}" fill="none" stroke="${P.gold}" stroke-width="3"/>`;
      g+=`<circle cx="${(cx+Math.cos(a)*r*0.4).toFixed(1)}" cy="${(cy+Math.sin(a)*r*0.4).toFixed(1)}" r="${(r*0.45).toFixed(1)}" fill="none" stroke="${P.gold2}" stroke-width="1"/>`; }
    g+=`<circle cx="${cx}" cy="${cy}" r="${(r*0.16).toFixed(1)}" fill="${P.leafA}"/>`;
  }
  return g;
}

// ---- build the SVG string ----
function buildSVG(st, size, animate=false, uid="v"){
  const P = PAL[st.style];
  const rnd = mulberry32(hashStr(st.letter+"|"+st.style+"|"+st.seed));
  const W=640, gx=64, gw=W-128;
  const diaper = ["cross","lattice","dots"][Math.floor(rnd()*3)];
  let dpat;
  if(diaper==="dots") dpat = `<circle cx="10" cy="10" r="2" fill="${P.gold2}" opacity=".5"/>`;
  else if(diaper==="lattice") dpat = `<path d="M0,0 L20,20 M20,0 L0,20" stroke="${P.gold2}" stroke-width="1.2" opacity=".45"/>`;
  else dpat = `<path d="M0,10 H20 M10,0 V20" stroke="${P.gold2}" stroke-width="1" opacity=".4"/><circle cx="10" cy="10" r="1.6" fill="${P.gold2}" opacity=".55"/>`;

  // acanthus from four corners of the gold ground
  const out = {stems:[], leaves:[], berries:[]};
  const corners = [[gx,gx,0.9],[W-gx,gx,2.25],[W-gx,W-gx,3.9],[gx,W-gx,5.5]];
  for(const [cxp,cyp,base] of corners){
    const toCenter = Math.atan2(W/2-cyp, W/2-cxp);
    acanthus(cxp,cyp, base, 92, 4, rnd, P, out, 1);
    acanthus(cxp,cyp, toCenter+ (rnd()-0.5)*0.4, 78, 3, rnd, P, out, -1);
  }
  // filigree sprays from side midpoints
  const fils=[];
  const anchors=[[W/2,gx-4,-1.57],[W-gx+4,W/2,0],[W/2,W-gx+4,1.57],[gx-4,W/2,3.14]];
  for(const [ax,ay,adir] of anchors){
    const n=2+Math.floor(rnd()*2);
    for(let i=0;i<n;i++){
      const off=(i-(n-1)/2)*0.5, a=adir+Math.PI+off;
      const mx=ax+Math.cos(a)*46, my=ay+Math.sin(a)*46;
      fils.push(`M${ax.toFixed(1)},${ay.toFixed(1)} Q${(ax+Math.cos(a+0.5)*30).toFixed(1)},${(ay+Math.sin(a+0.5)*30).toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`);
      fils.push(spiral(mx,my,a,(rnd()<0.5?1:-1),1.2,16));
    }
  }

  const rc = animate ? " class=\"reveal\"" : "";
  const dl = (i)=> animate ? ` style="animation-delay:${(i*32).toFixed(0)}ms"` : "";
  let s = `<svg${rc} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${W}" width="${size}" height="${size}" font-family="'Palatino Linotype','Book Antiqua',Georgia,serif">`;
  s += `<defs>
    <linearGradient id="gold${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="${P.gold}"/><stop offset="1" stop-color="${P.gold2}"/>
    </linearGradient>
    <linearGradient id="sheen${uid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dp${uid}" width="20" height="20" patternUnits="userSpaceOnUse">${dpat}</pattern>
    <clipPath id="clip${uid}"><rect x="${gx}" y="${gx}" width="${gw}" height="${gw}" rx="14"/></clipPath>
  </defs>`;
  // frame + jewel field
  s += `<rect x="10" y="10" width="${W-20}" height="${W-20}" rx="10" fill="${P.field}" stroke="${P.frame}" stroke-width="20"/>`;
  s += `<rect x="26" y="26" width="${W-52}" height="${W-52}" rx="8" fill="none" stroke="${P.gold}" stroke-width="2.5"/>`;
  s += `<rect x="26" y="26" width="${W-52}" height="${W-52}" rx="8" fill="none" stroke="${P.gold2}" stroke-width="1" stroke-dasharray="1 7"/>`;
  // corner jewels
  for(const [jx,jy] of [[30,30],[W-30,30],[W-30,W-30],[30,W-30]])
    s += `<circle cx="${jx}" cy="${jy}" r="9" fill="${P.leafA}" stroke="${P.gold}" stroke-width="2.5"/>`;
  // gold ground with diaper + sheen
  s += `<g class="gold"><rect x="${gx}" y="${gx}" width="${gw}" height="${gw}" rx="14" fill="url(#gold${uid})"/>`;
  s += `<rect x="${gx}" y="${gx}" width="${gw}" height="${gw}" rx="14" fill="url(#dp${uid})"/>`;
  s += `<rect x="${gx}" y="${gx}" width="${gw}" height="${gw}" rx="14" fill="url(#sheen${uid})" class="sheen"/>`;
  s += `<rect x="${gx}" y="${gx}" width="${gw}" height="${gw}" rx="14" fill="none" stroke="${P.gold2}" stroke-width="3"/></g>`;
  // ornaments clipped to ground
  s += `<g clip-path="url(#clip${uid})">`;
  // filigree (behind letter)
  s += `<g fill="none" stroke="${P.fil}" stroke-width="1.3" stroke-linecap="round" opacity=".9">`;
  fils.forEach((d,i)=> s += `<path pathLength="100" class="fil" d="${d}"${dl(i)}/>`);
  s += `</g>`;
  // foliage (leaves + berries) fade in
  s += `<g class="foli">`;
  out.leaves.forEach(l=> s += `<path d="${l.d}" fill="${l.c}" stroke="${P.gold2}" stroke-width=".8" opacity=".95"/>`);
  out.berries.forEach(b=> s += `<circle cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="${b.r.toFixed(1)}" fill="${P.berry}" stroke="${P.gold2}" stroke-width=".8"/>`);
  s += `</g>`;
  // stems draw on
  s += `<g fill="none" stroke="${P.stem}" stroke-width="4.5" stroke-linecap="round">`;
  out.stems.forEach((d,i)=> s += `<path pathLength="100" class="vine" d="${d}"${dl(i)}/>`);
  s += `</g>`;
  s += `<g fill="none" stroke="${P.gold2}" stroke-width="1.4" stroke-linecap="round" opacity=".7">`;
  out.stems.forEach((d,i)=> s += `<path pathLength="100" class="vine" d="${d}"${dl(i)}/>`);
  s += `</g>`;
  s += `</g>`; // end clip
  // letter
  s += `<text class="glyph" x="${W/2}" y="${W/2+18}" text-anchor="middle" font-size="360" font-weight="bold" fill="url(#gold${uid})" stroke="${P.gold2}" stroke-width="3" paint-order="stroke" style="font-feature-settings:'smcp'">${escapeXML(st.letter)}</text>`;
  // historiated medallion
  if(st.hist){
    const kind=["sun","bird","knot"][Math.floor(rnd()*3)];
    const mcx=W/2, mcy=W/2-24, mr=78;
    s += `<clipPath id="m${uid}"><circle cx="${mcx}" cy="${mcy}" r="${mr-4}"/></clipPath>`;
    s += `<g class="medal"><circle cx="${mcx}" cy="${mcy}" r="${mr}" fill="${P.sky}"/>`;
    s += `<g clip-path="url(#m${uid})">` + motif(kind,mcx,mcy,mr-6,rnd,P) + `</g>`;
    s += `<circle cx="${mcx}" cy="${mcy}" r="${mr}" fill="none" stroke="${P.gold}" stroke-width="7"/>`;
    s += `<circle cx="${mcx}" cy="${mcy}" r="${mr}" fill="none" stroke="${P.gold2}" stroke-width="1.5"/></g>`;
  }
  s += `</svg>`;
  return s;
}
function escapeXML(c){ return c.replace(/[<>&]/g, m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m])); }

// ---- render to page ----
function render(animate=false){
  const letter = (S.letter||"A").toUpperCase();
  S.letter = /[A-Z]/.test(letter) ? letter : "A";
  writeHash();
  document.getElementById("letter").value = S.letter;
  document.getElementById("style").value = S.style;
  document.getElementById("hist").checked = S.hist;
  document.getElementById("pmode").checked = S.para;
  const stage=document.getElementById("stage"), para=document.getElementById("para");
  if(S.para){
    stage.style.display="none"; stage.innerHTML=""; para.classList.add("on");
    document.getElementById("paraInit").innerHTML = buildSVG(S,190,animate,"para");
    document.getElementById("ptitle").textContent = PAL[S.style].name;
    document.querySelector(".ptext p").innerHTML = "<b style='font-variant:small-caps;letter-spacing:.05em'>"+S.letter+"</b>"+LOREM.slice(1)+" "+LOREM;
  } else {
    para.classList.remove("on"); stage.style.display="";
    stage.innerHTML = buildSVG(S,560,animate,"stage");
  }
}

// ---- export helpers ----
function download(name,blob){ if(!blob){ alert("Export failed: the image could not be encoded (the canvas may be too large or memory is low). Try a smaller sheet or export."); return; } const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function rasterize(svg){ return new Promise((res,rej)=>{ const img=new Image(); const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"}); const url=URL.createObjectURL(blob); img.onload=()=>{ URL.revokeObjectURL(url); res(img); }; img.onerror=rej; img.src=url; }); }
async function svgToPng(svg,px){ const img=await rasterize(svg); const c=document.createElement("canvas"); c.width=px; c.height=px; const g=c.getContext("2d"); g.drawImage(img,0,0,px,px); return new Promise(r=>c.toBlob(r,"image/png")); }

async function contactSheet(){
  let word = document.getElementById("word").value.toUpperCase().replace(/[^A-Z]/g,"");
  const letters = word ? word.split("") : "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const cols = Math.min(letters.length, 6);
  const rows = Math.ceil(letters.length/cols);
  const cell=300, pad=24, top=90;
  const c=document.createElement("canvas"); c.width=cols*cell+pad*2; c.height=rows*cell+top+pad;
  const g=c.getContext("2d");
  g.fillStyle="#f3ead4"; g.fillRect(0,0,c.width,c.height);
  g.fillStyle="#6e3319"; g.textAlign="center"; g.font="italic 40px 'Palatino Linotype','Book Antiqua',Georgia,serif";
  g.fillText(word?word:"Alphabet", c.width/2, 50);
  g.font="20px 'Palatino Linotype',Georgia,serif"; g.fillStyle="#7a6a45";
  g.fillText(PAL[S.style].name, c.width/2, 76);
  for(let i=0;i<letters.length;i++){
    const st={letter:letters[i], style:S.style, seed:S.seed+letters[i].charCodeAt(0), hist:S.hist, para:false};
    const img=await rasterize(buildSVG(st,cell-16,false,"cs"+i));
    const cx=pad+(i%cols)*cell, cy=top+Math.floor(i/cols)*cell;
    g.drawImage(img,cx+8,cy+8,cell-16,cell-16);
  }
  await new Promise(r=>c.toBlob(b=>{ download("versal-sheet-"+S.style+".png",b); r(); },"image/png"));
}

// ---- wire up ----
document.getElementById("letter").addEventListener("input",e=>{ const v=e.target.value.toUpperCase(); if(v===""){ return; } if(/^[A-Z]$/.test(v)){ S.letter=v; render(); } else { e.target.value=S.letter; } });
document.getElementById("style").addEventListener("change",e=>{ S.style=e.target.value; render(); });
document.getElementById("hist").addEventListener("change",e=>{ S.hist=e.target.checked; render(); });
document.getElementById("pmode").addEventListener("change",e=>{ S.para=e.target.checked; render(); });
document.getElementById("reseed").addEventListener("click",()=>{ S.seed=Math.floor(Math.random()*1e6); render(true); });
document.getElementById("rand").addEventListener("click",()=>{ S.letter="ABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(Math.random()*26)]; S.seed=Math.floor(Math.random()*1e6); render(true); });
document.getElementById("svg").addEventListener("click",()=>{ download("versal-"+S.letter+"-"+S.style+".svg", new Blob([buildSVG(S,640,false,"exp")],{type:"image/svg+xml"})); });
async function withBusy(btn,label,fn){ const t=btn.textContent; btn.disabled=true; btn.textContent=label; try{ await fn(); }catch(err){ alert("Export failed: "+(err&&err.message?err.message:err)); }finally{ btn.disabled=false; btn.textContent=t; } }
document.getElementById("png").addEventListener("click",e=>withBusy(e.currentTarget,"Rendering…",async()=>{ const b=await svgToPng(buildSVG(S,1200,false,"exp"),1200); download("versal-"+S.letter+"-"+S.style+".png",b); }));
document.getElementById("sheet").addEventListener("click",e=>withBusy(e.currentTarget,"Rendering…",contactSheet));
document.getElementById("copy").addEventListener("click",async e=>{ const b=e.currentTarget, t=b.textContent; try{ await navigator.clipboard.writeText(location.href); b.textContent="Copied!"; }catch(_){ b.textContent="Copy failed"; } setTimeout(()=>b.textContent=t,1200); });
window.addEventListener("hashchange",()=>{ parseHash(); render(true); });

parseHash();
render(true);
</script>
</body>
