<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrollbar — Custom CSS Scrollbar Generator</title>
<meta name="description" content="Style a custom scrollbar: width, track/thumb/hover colors and radius, with a live preview and cross-browser CSS (WebKit + Firefox). Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('scrollbar-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#334155;
    --bg:#f5f6f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e4e8; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#101216; --card:#191c22; --fg:#eef0f4; --muted:#98a0ac; --line:#282c34; --shadow:0 1px 3px rgba(0,0,0,.5); --c:#94a3b8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:880px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#1e293b);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:880px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
  label:first-child{margin-top:0}
  input[type=range]{width:100%;accent-color:var(--c)}
  input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  #preview{height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
  #preview p{margin:0 0 14px}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.78rem;margin:14px 0 0;white-space:pre}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;margin-top:12px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:880px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">▤</div>
    <div><h1>Scrollbar</h1><div class="sub">Custom CSS scrollbar generator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label class="row"><span>Width</span><b id="widthV">12px</b></label>
    <input type="range" id="width" min="0" max="30" value="12">
    <label class="row"><span>Thumb radius</span><b id="radiusV">6px</b></label>
    <input type="range" id="radius" min="0" max="20" value="6">
    <div class="three">
      <div><label>Track</label><input type="color" id="track" value="#f1f1f1"></div>
      <div><label>Thumb</label><input type="color" id="thumb" value="#888888"></div>
      <div><label>Hover</label><input type="color" id="hover" value="#555555"></div>
    </div>
  </div>
  <div class="card">
    <label>Live preview (scroll me)</label>
    <div id="preview"></div>
    <pre id="out"></pre>
    <button class="act" id="copy" type="button">Copy CSS</button>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/scrollbar">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function isHex(c){ return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c); }

  function scrollbarCss(o = {}){
    const width = o.width == null ? 12 : o.width;
    const track = o.track || '#f1f1f1';
    const thumb = o.thumb || '#888888';
    const thumbHover = o.thumbHover || thumb;
    const radius = o.radius == null ? 6 : o.radius;
    for(const c of [track, thumb, thumbHover]) if(!isHex(c)) throw new Error('invalid hex color: ' + c);
    if(!(width >= 0) || !(radius >= 0)) throw new Error('width and radius must be non-negative');
    return [
      '/* Chromium, Edge, Safari */',
      `::-webkit-scrollbar { width: ${width}px; height: ${width}px; }`,
      `::-webkit-scrollbar-track { background: ${track}; }`,
      `::-webkit-scrollbar-thumb { background: ${thumb}; border-radius: ${radius}px; }`,
      `::-webkit-scrollbar-thumb:hover { background: ${thumbHover}; }`,
      '',
      '/* Firefox */',
      `* { scrollbar-width: thin; scrollbar-color: ${thumb} ${track}; }`
    ].join('\n');
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('preview')){
    const $ = id => document.getElementById(id);
    $('preview').innerHTML = Array.from({ length: 12 }, (_, i) => `<p>Line ${i + 1} — scroll to see the custom scrollbar in action. The quick brown fox jumps over the lazy dog.</p>`).join('');
    const style = document.createElement('style');
    document.head.appendChild(style);

    function render(){
      const width = +$('width').value, radius = +$('radius').value;
      $('widthV').textContent = width + 'px';
      $('radiusV').textContent = radius + 'px';
      let css;
      try{ css = scrollbarCss({ width, radius, track: $('track').value, thumb: $('thumb').value, thumbHover: $('hover').value }); }catch(e){ return; }
      $('out').textContent = css;
      // scoped preview styles
      style.textContent = `
        #preview::-webkit-scrollbar { width: ${width}px; height: ${width}px; }
        #preview::-webkit-scrollbar-track { background: ${$('track').value}; }
        #preview::-webkit-scrollbar-thumb { background: ${$('thumb').value}; border-radius: ${radius}px; }
        #preview::-webkit-scrollbar-thumb:hover { background: ${$('hover').value}; }
        #preview { scrollbar-width: thin; scrollbar-color: ${$('thumb').value} ${$('track').value}; }`;
    }

    ['width', 'radius', 'track', 'thumb', 'hover'].forEach(id => $(id).addEventListener('input', render));
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy CSS', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('scrollbar-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { isHex, scrollbarCss };
</script>
</body>
</html>
