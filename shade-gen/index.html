<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadeGen — color tint &amp; shade scale generator</title>
<meta name="description" content="Free offline color scale generator. Enter one hex color and get a full 50–950 tint and shade palette, ready to copy as CSS variables or Tailwind config. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/shade-gen/">
<style>
  :root{
    --c:#8b5cf6; --bg:#faf9fd; --fg:#1c172a; --muted:#6a6280;
    --card:#ffffff; --border:#e8e4f2; --code:#f1edfb;
  }
  [data-theme="dark"]{
    --bg:#14111f; --fg:#ebe7f5; --muted:#9992b0; --card:#1d1830;
    --border:#2e2745; --code:#241d3a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;
    display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#c4b5fd);
    display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--fg);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.88rem;margin:0 0 6px}
  .row{display:flex;gap:12px;align-items:flex-end}
  .fld{flex:1}
  input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--border);
    border-radius:11px;background:var(--bg);color:var(--fg);font-size:1.1rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  input[type=text]:focus{outline:2px solid var(--c);border-color:var(--c)}
  input[type=color]{width:52px;height:48px;padding:0;border:1px solid var(--border);
    border-radius:11px;background:none;cursor:pointer}
  .err{color:#dc2626;font-size:.86rem;margin:10px 0 0;min-height:1.1em}
  .scale{margin-top:20px;border:1px solid var(--border);border-radius:13px;overflow:hidden}
  .swatch{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer}
  .chip{width:34px;height:34px;border-radius:8px;flex:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .step{font-weight:700;width:44px;font-family:ui-monospace,monospace;font-size:.9rem}
  .hex{font-family:ui-monospace,monospace;color:var(--muted);font-size:.92rem}
  .base-tag{margin-left:auto;font-size:.68rem;color:var(--c);font-weight:700;
    text-transform:uppercase;letter-spacing:.05em}
  .exp{margin-top:20px}
  .exp label{display:flex;align-items:center;gap:8px}
  .exp .copy{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--muted);border-radius:7px;padding:3px 11px;cursor:pointer;font-size:.76rem}
  .exp .copy:hover{color:var(--c);border-color:var(--c)}
  pre{background:var(--code);border-radius:11px;padding:14px 16px;margin:8px 0 0;
    overflow-x:auto;font-family:ui-monospace,monospace;font-size:.84rem;line-height:1.5}
  .hint{color:var(--muted);font-size:.82rem;margin:14px 0 0}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('shade.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">🎨</div>
  <div>
    <h1>ShadeGen</h1>
    <p class="sub">Color tint &amp; shade scale generator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="row">
      <div class="fld">
        <label for="hex">Base color</label>
        <input type="text" id="hex" value="#8b5cf6" spellcheck="false" autocomplete="off" placeholder="#8b5cf6">
      </div>
      <input type="color" id="picker" value="#8b5cf6" title="Pick a color">
    </div>
    <p class="err" id="err"></p>
    <div class="scale" id="scale"></div>
    <div class="exp">
      <label>CSS variables
        <button class="copy" id="copyCss">Copy</button>
      </label>
      <pre id="css"></pre>
    </div>
    <p class="hint">The scale is built by mixing your color toward white (tints) and
      black (shades). Click any swatch to copy its hex. Everything runs locally.</p>
  </div>
</main>
<footer>
  ShadeGen is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/shade-gen">Source</a>
</footer>

<script>
// ---- pure functions ----
function hexToRgb(hex){
  var s = String(hex).trim().replace(/^#/, '');
  if(/^[0-9a-fA-F]{3}$/.test(s)){
    s = s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  }
  if(!/^[0-9a-fA-F]{6}$/.test(s)) return null;
  return {
    r: parseInt(s.slice(0,2),16),
    g: parseInt(s.slice(2,4),16),
    b: parseInt(s.slice(4,6),16)
  };
}
function clampByte(n){ n = Math.round(n); return n < 0 ? 0 : n > 255 ? 255 : n; }
function rgbToHex(rgb){
  function h(n){ return ('0'+clampByte(n).toString(16)).slice(-2); }
  return '#' + h(rgb.r) + h(rgb.g) + h(rgb.b);
}
function mix(hexA, hexB, weight){ // weight = share of hexB (0..1)
  var a = hexToRgb(hexA), b = hexToRgb(hexB);
  if(!a || !b) return null;
  var w = Math.max(0, Math.min(1, weight));
  return rgbToHex({
    r: a.r * (1 - w) + b.r * w,
    g: a.g * (1 - w) + b.g * w,
    b: a.b * (1 - w) + b.b * w
  });
}
function tint(hex, weight){ return mix(hex, '#ffffff', weight); }
function shade(hex, weight){ return mix(hex, '#000000', weight); }

// relative luminance (0 = black, 1 = white), sRGB weighted
function luminance(hex){
  var c = hexToRgb(hex);
  if(!c) return null;
  return (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) / 255;
}

var TINT_STEPS  = { 50:0.95, 100:0.9, 200:0.75, 300:0.55, 400:0.3 };
var SHADE_STEPS = { 600:0.13, 700:0.28, 800:0.43, 900:0.58, 950:0.72 };

function scale(hex){
  if(!hexToRgb(hex)) return null;
  var out = {};
  for(var k in TINT_STEPS) out[k] = tint(hex, TINT_STEPS[k]);
  out[500] = rgbToHex(hexToRgb(hex)); // normalized base
  for(var s in SHADE_STEPS) out[s] = shade(hex, SHADE_STEPS[s]);
  return out;
}

function toCssVars(hex, name){
  var sc = scale(hex);
  if(!sc) return null;
  var pre = '--' + (name || 'color');
  var keys = Object.keys(sc).map(Number).sort(function(a,b){ return a-b; });
  var lines = keys.map(function(k){ return '  ' + pre + '-' + k + ': ' + sc[k] + ';'; });
  return ':root {\n' + lines.join('\n') + '\n}';
}

if(typeof module !== 'undefined') module.exports = {
  hexToRgb, rgbToHex, clampByte, mix, tint, shade, luminance, scale, toCssVars
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var hexEl = document.getElementById('hex');
  var picker = document.getElementById('picker');
  var errEl = document.getElementById('err');
  var scaleEl = document.getElementById('scale');
  var cssEl = document.getElementById('css');
  var STEP_ORDER = [50,100,200,300,400,500,600,700,800,900,950];

  function render(){
    var hex = hexEl.value.trim();
    var rgb = hexToRgb(hex);
    if(!rgb){
      errEl.textContent = 'Enter a valid hex color, e.g. #8b5cf6 or #f80.';
      scaleEl.innerHTML = ''; cssEl.textContent = '';
      return;
    }
    errEl.textContent = '';
    var norm = rgbToHex(rgb);
    picker.value = norm;
    var sc = scale(hex);
    scaleEl.innerHTML = STEP_ORDER.map(function(k){
      var col = sc[k];
      var textDark = luminance(col) > 0.55;
      return '<div class="swatch" data-hex="'+col+'" style="background:'+col+
        ';color:'+(textDark?'#111':'#fff')+'">'+
        '<span class="chip" style="background:'+col+'"></span>'+
        '<span class="step">'+k+'</span>'+
        '<span class="hex" style="color:inherit;opacity:.85">'+col+'</span>'+
        (k===500?'<span class="base-tag" style="color:inherit">base</span>':'')+
        '</div>';
    }).join('');
    cssEl.textContent = toCssVars(hex, 'brand');
    try{ localStorage.setItem('shade.hex', hex); }catch(e){}
  }
  scaleEl.addEventListener('click', function(e){
    var sw = e.target.closest ? e.target.closest('.swatch') : null;
    if(!sw) return;
    var h = sw.getAttribute('data-hex');
    if(navigator.clipboard) navigator.clipboard.writeText(h);
  });
  document.getElementById('copyCss').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(cssEl.textContent);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  picker.addEventListener('input', function(){ hexEl.value = picker.value; render(); });
  hexEl.addEventListener('input', render);
  try{ var saved = localStorage.getItem('shade.hex'); if(saved) hexEl.value = saved; }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('shade.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('shade.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
