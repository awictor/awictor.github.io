<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OneRepMax — 1RM Calculator (Epley &amp; Brzycki)</title>
<meta name="description" content="Estimate your one-rep max from a weight and reps using the Epley and Brzycki formulas, with a training-percentage table. 100% offline, no signup." />
<meta name="theme-color" content="#e11d48" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="OneRepMax — 1RM Calculator" />
<meta property="og:description" content="Estimate your 1RM (Epley & Brzycki) with a training % table. Offline." />
<meta property="og:url" content="https://awictor.github.io/one-rep-max/" />
<link rel="canonical" href="https://awictor.github.io/one-rep-max/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e11d48'/%3E%3Crect x='12' y='28' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='44' y='28' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='20' y='30' width='24' height='4' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fbf1f3; --ink:#2a1017; --accent:#e11d48; --accent-d:#be123c;
    --card:#fff; --line:#f0dbe1; --muted:#7a5460; --field:#fff;
    --shadow:0 1px 2px rgba(42,16,23,.05),0 8px 24px rgba(42,16,23,.07); }
  [data-theme="dark"]{ --bg:#160810; --ink:#f5e8ec; --accent:#fb7185; --accent-d:#fda4af;
    --card:#20111a; --line:#341f29; --muted:#a9869a; --field:#160810;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  input[type=number]{width:110px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,72,.15)}
  .result{text-align:center}
  .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1}
  .sub{color:var(--muted);font-size:14px}
  .sub b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  td{padding:7px 8px;border-top:1px solid var(--line);font-size:15px}
  td:first-child{color:var(--muted)} td:last-child{text-align:right;font-weight:600}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("orm.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">One</span>RepMax</h1>
  <p>Estimate your 1RM and training percentages. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Weight lifted</label><div><input id="weight" type="number" step="1" value="100"> <select id="unit"><option>kg</option><option>lb</option></select></div></div>
    <div class="row"><label>Reps</label><input id="reps" type="number" min="1" max="20" value="5"></div>
  </section>

  <section class="card result">
    <div class="sub">Estimated 1-rep max</div>
    <div class="big" id="orm">—</div>
    <div class="sub" id="detail"></div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Training percentages</h2>
    <table><tbody id="pct"></tbody></table>
  </section>
</div>

<footer>
  <b>OneRepMax</b> · offline 1RM calculator · <a href="https://github.com/awictor/one-rep-max">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Estimates — lift safely and use a spotter. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const r2=n=>Math.round(n*100)/100;

// --- Pure 1RM math ---
function epley(weight,reps){ return reps<=1 ? weight : weight*(1+reps/30); }
function brzycki(weight,reps){ if(reps<1) return weight; if(reps>=37) return Infinity; return weight*36/(37-reps); }
function oneRepMax(weight,reps){ return (epley(weight,reps)+brzycki(weight,reps))/2; }
function percentOfMax(orm,pct){ return orm*pct/100; }

// --- UI ---
function render(){
  const w=num("weight"), reps=Math.max(1,Math.min(20,num("reps")));
  try{["weight","unit","reps"].forEach(k=>localStorage.setItem("orm."+k,$(k).value));}catch(e){}
  const e=epley(w,reps), b=brzycki(w,reps), avg=oneRepMax(w,reps), u=$("unit").value;
  if(!w){ $("orm").textContent="—"; $("detail").textContent=""; $("pct").innerHTML=""; return; }
  $("orm").textContent=r2(avg)+" "+u;
  $("detail").innerHTML=`Epley <b>${r2(e)}</b> · Brzycki <b>${isFinite(b)?r2(b):"—"}</b>`;
  const PCTS=[100,95,90,85,80,75,70,65,60,55,50];
  $("pct").innerHTML=PCTS.map(p=>`<tr><td>${p}%</td><td>${r2(percentOfMax(avg,p))} ${u}</td></tr>`).join("");
}
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("orm.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["weight","unit","reps"].forEach(k=>{const v=localStorage.getItem("orm."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={epley,brzycki,oneRepMax,percentOfMax};
</script>
</body>
</html>
