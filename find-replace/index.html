<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FindReplace — bulk find &amp; replace with regex</title>
<meta name="description" content="Free offline find and replace tool. Bulk-replace text with plain strings or regular expressions, group backreferences, whole-word and case-insensitive options, and a live match count. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/find-replace/">
<style>
  :root{
    --c:#831843; --bg:#fcf7f9; --fg:#22131a; --muted:#7c5a68;
    --card:#ffffff; --border:#eeddE4; --border:#eedde4; --code:#faedf1;
  }
  [data-theme="dark"]{
    --bg:#190f13; --fg:#f2e5ea; --muted:#b5949f; --card:#25151c;
    --border:#3a2530; --code:#2d1922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#db2777);display:grid;place-items:center;color:#fff;font-size:19px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:820px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  textarea{width:100%;min-height:130px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;
    background:var(--bg);color:var(--fg);font-size:.92rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    resize:vertical;line-height:1.55}
  input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;
    background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;font-size:.95rem}
  textarea:focus,input:focus{outline:2px solid var(--c);border-color:var(--c)}
  .fr{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
  .fr .fld{flex:1;min-width:200px}
  .opts{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}
  .opts label{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;cursor:pointer;margin:0}
  .count{font-size:.9rem;color:var(--muted);margin:6px 0 0}
  .count b{color:var(--c);font-family:ui-monospace,monospace}
  .count.err b{color:#dc2626}
  .out-head{display:flex;align-items:center;margin-top:16px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  .hint{color:var(--muted);font-size:.82rem;margin:14px 0 0}
  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('fr.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">⇄</div>
  <div>
    <h1>FindReplace</h1>
    <p class="sub">Bulk find &amp; replace with regex</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <label for="in">Text</label>
    <textarea id="in" spellcheck="false" placeholder="Paste your text here…">The quick brown fox. The quick brown dog.</textarea>
    <div class="fr">
      <div class="fld">
        <label for="find">Find</label>
        <input type="text" id="find" spellcheck="false" value="quick">
      </div>
      <div class="fld">
        <label for="rep">Replace with</label>
        <input type="text" id="rep" spellcheck="false" value="slow">
      </div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="regex"> Regex</label>
      <label><input type="checkbox" id="ci"> Ignore case</label>
      <label><input type="checkbox" id="ww"> Whole word</label>
    </div>
    <p class="count" id="count"></p>
    <div class="out-head">
      <label style="margin:0">Result</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <textarea id="out" spellcheck="false" readonly></textarea>
    <p class="hint">In regex mode, use capture groups and <code>$1</code>, <code>$2</code> in the
      replacement. In plain mode the replacement is inserted literally. Everything runs locally.</p>
  </div>
</main>
<footer>
  FindReplace is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/find-replace">Source</a>
</footer>

<script>
// ---- pure functions ----
function escapeRegex(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function buildRegex(find, opts){
  opts = opts || {};
  if(find === '' || find == null) return null;
  var src = opts.regex ? String(find) : escapeRegex(find);
  if(opts.wholeWord) src = '\\b(?:' + src + ')\\b';
  var flags = 'g' + (opts.caseInsensitive ? 'i' : '');
  try{ return new RegExp(src, flags); }
  catch(e){ return null; }
}
function countMatches(text, find, opts){
  var re = buildRegex(find, opts);
  if(!re) return 0;
  var m = String(text).match(re);
  return m ? m.length : 0;
}
function replaceAll(text, find, replacement, opts){
  opts = opts || {};
  text = String(text);
  replacement = (replacement == null) ? '' : String(replacement);
  if(find === '' || find == null) return { result: text, count: 0, error: null };
  var re = buildRegex(find, opts);
  if(!re) return { result: text, count: 0, error: 'invalid-regex' };
  var count = countMatches(text, find, opts);
  var result = opts.regex
    ? text.replace(re, replacement)              // $1 group refs honored
    : text.replace(re, function(){ return replacement; }); // literal insert
  return { result: result, count: count, error: null };
}

if(typeof module !== 'undefined') module.exports = {
  escapeRegex, buildRegex, countMatches, replaceAll
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var findEl = document.getElementById('find');
  var repEl = document.getElementById('rep');
  var outEl = document.getElementById('out');
  var countEl = document.getElementById('count');
  var opt = {
    regex: document.getElementById('regex'),
    ci: document.getElementById('ci'),
    ww: document.getElementById('ww')
  };
  function opts(){ return { regex: opt.regex.checked, caseInsensitive: opt.ci.checked, wholeWord: opt.ww.checked }; }
  function render(){
    var o = opts();
    var r = replaceAll(inEl.value, findEl.value, repEl.value, o);
    outEl.value = r.result;
    if(r.error === 'invalid-regex'){
      countEl.className = 'count err';
      countEl.innerHTML = '<b>Invalid regular expression</b>';
    } else if(findEl.value === ''){
      countEl.className = 'count';
      countEl.textContent = '';
    } else {
      countEl.className = 'count';
      countEl.innerHTML = '<b>' + r.count + '</b> match' + (r.count === 1 ? '' : 'es') + ' replaced';
    }
    try{
      localStorage.setItem('fr.in', inEl.value);
      localStorage.setItem('fr.find', findEl.value);
      localStorage.setItem('fr.rep', repEl.value);
      localStorage.setItem('fr.opts', JSON.stringify(o));
    }catch(e){}
  }
  [inEl, findEl, repEl].forEach(function(e){ e.addEventListener('input', render); });
  Object.keys(opt).forEach(function(k){ opt[k].addEventListener('change', render); });
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.value);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var si = localStorage.getItem('fr.in'); if(si !== null) inEl.value = si;
    var sf = localStorage.getItem('fr.find'); if(sf !== null) findEl.value = sf;
    var sr = localStorage.getItem('fr.rep'); if(sr !== null) repEl.value = sr;
    var so = JSON.parse(localStorage.getItem('fr.opts') || 'null');
    if(so){ opt.regex.checked = !!so.regex; opt.ci.checked = !!so.caseInsensitive; opt.ww.checked = !!so.wholeWord; }
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('fr.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('fr.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
