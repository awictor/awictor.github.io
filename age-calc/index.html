<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgeCalc — Age Calculator &amp; Next Birthday Countdown</title>
<meta name="description" content="Calculate your exact age in years, months, and days, plus total days lived and the countdown to your next birthday. 100% offline, no signup." />
<meta name="theme-color" content="#9333ea" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="AgeCalc — Age Calculator" />
<meta property="og:description" content="Exact age (y/m/d), total days lived, and next-birthday countdown. Offline." />
<meta property="og:url" content="https://awictor.github.io/age-calc/" />
<link rel="canonical" href="https://awictor.github.io/age-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239333ea'/%3E%3Crect x='16' y='30' width='32' height='18' rx='3' fill='%23fff'/%3E%3Crect x='28' y='20' width='8' height='10' fill='%23fff'/%3E%3Ccircle cx='32' cy='17' r='3' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f7f2fc; --ink:#1c1030; --accent:#9333ea; --accent-d:#7e22ce;
    --card:#fff; --line:#e8ddf3; --muted:#655a80; --field:#fff;
    --shadow:0 1px 2px rgba(28,16,48,.05),0 8px 24px rgba(28,16,48,.07); }
  [data-theme="dark"]{ --bg:#0f0a1a; --ink:#ece7f7; --accent:#c084fc; --accent-d:#d8b4fe;
    --card:#18122a; --line:#2a2244; --muted:#968bbb; --field:#0f0a1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .row label{font-size:14px}
  input[type=date]{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(147,51,234,.15)}
  .result{text-align:center}
  .big{font-size:38px;font-weight:800;color:var(--accent);line-height:1.1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
  .stat .v{font-size:18px;font-weight:700} .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .bday{margin-top:14px;font-size:15px;color:var(--muted)} .bday b{color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("agecalc.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Age</span>Calc</h1>
  <p>Your exact age and the countdown to your next birthday. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Date of birth</label><input type="date" id="dob" value="2000-01-15"></div>
  </section>
  <section class="card result">
    <div style="color:var(--muted);font-size:14px">You are</div>
    <div class="big" id="age">—</div>
    <div class="grid">
      <div class="stat"><div class="v" id="days">—</div><div class="k">Days lived</div></div>
      <div class="stat"><div class="v" id="weeks">—</div><div class="k">Weeks</div></div>
      <div class="stat"><div class="v" id="months">—</div><div class="k">Months</div></div>
      <div class="stat"><div class="v" id="hours">—</div><div class="k">Hours</div></div>
    </div>
    <div class="bday" id="bday"></div>
  </section>
</div>

<footer>
  <b>AgeCalc</b> · offline age calculator · <a href="https://github.com/awictor/age-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Calculated in UTC. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const two=n=>String(n).padStart(2,"0");

// --- Pure age math (UTC; today injectable) ---
function toUTC(str){ const d=new Date(String(str)+"T00:00:00Z"); return isNaN(d.getTime())?null:d; }
function isoDate(d){ return d.getUTCFullYear()+"-"+two(d.getUTCMonth()+1)+"-"+two(d.getUTCDate()); }
function ageParts(birthStr,todayStr){
  const a=toUTC(birthStr), b=toUTC(todayStr); if(!a||!b||b<a) return null;
  let y=b.getUTCFullYear()-a.getUTCFullYear(), m=b.getUTCMonth()-a.getUTCMonth(), d=b.getUTCDate()-a.getUTCDate(), bm=b.getUTCMonth();
  while(d<0){ m--; d+=new Date(Date.UTC(b.getUTCFullYear(),bm,0)).getUTCDate(); bm--; }
  if(m<0){ y--; m+=12; }
  return {years:y,months:m,days:d};
}
function totalDays(birthStr,todayStr){ const a=toUTC(birthStr), b=toUTC(todayStr); if(!a||!b) return null; return Math.round((b-a)/86400000); }
function nextBirthday(birthStr,todayStr){
  const a=toUTC(birthStr), b=toUTC(todayStr); if(!a||!b) return null;
  let year=b.getUTCFullYear();
  let bd=new Date(Date.UTC(year,a.getUTCMonth(),a.getUTCDate()));
  if(bd<b) bd=new Date(Date.UTC(year+1,a.getUTCMonth(),a.getUTCDate()));
  return {date:isoDate(bd), daysUntil:Math.round((bd-b)/86400000)};
}

// --- UI ---
function todayISO(){ const n=new Date(); return n.getUTCFullYear()+"-"+two(n.getUTCMonth()+1)+"-"+two(n.getUTCDate()); }
function render(){
  const dob=$("dob").value, today=todayISO();
  try{localStorage.setItem("agecalc.dob",dob);}catch(e){}
  const ap=ageParts(dob,today);
  if(!ap){ $("age").textContent="—"; $("bday").textContent=""; ["days","weeks","months","hours"].forEach(i=>$(i).textContent="—"); return; }
  $("age").textContent=`${ap.years} yr ${ap.months} mo ${ap.days} d`;
  const td=totalDays(dob,today);
  $("days").textContent=td.toLocaleString();
  $("weeks").textContent=Math.floor(td/7).toLocaleString();
  $("months").textContent=(ap.years*12+ap.months).toLocaleString();
  $("hours").textContent=(td*24).toLocaleString();
  const nb=nextBirthday(dob,today);
  $("bday").innerHTML = nb.daysUntil===0 ? "🎉 <b>Happy birthday!</b> It's today." : `Next birthday: <b>${nb.date}</b> — in <b>${nb.daysUntil}</b> day${nb.daysUntil===1?"":"s"}.`;
}
$("dob").addEventListener("input",render);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("agecalc.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const d=localStorage.getItem("agecalc.dob");if(d!=null)$("dob").value=d;}catch(e){}
render();

if(typeof module!=="undefined") module.exports={ageParts,totalDays,nextBirthday,isoDate};
</script>
</body>
</html>
