<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsciiTable — ASCII Reference &amp; Lookup (dec/hex/oct/bin)</title>
<meta name="description" content="Full ASCII 0–127 reference table with decimal, hex, octal, binary and control-char names, plus a character ⇄ code lookup. 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('ascii-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#334155;
    --accent:#0ea5e9;
    --bg:#f4f6f8; --card:#ffffff; --fg:#141a22; --muted:#5a6675; --line:#e2e7ee; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --c:#94a3b8; --accent:#38bdf8;
    --bg:#0b0f14; --card:#141a22; --fg:#e8eef5; --muted:#8593a3; --line:#212a35; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#0369a1);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:800}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .look{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
  .look .b{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
  .look .b .v{font-size:1.2rem;font-weight:800;color:var(--accent);font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .look .b .k{color:var(--muted);font-size:.68rem;text-transform:uppercase}
  .err{color:#dc2626;font-size:.85rem;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
  th:last-child,td:last-child,th:nth-child(2),td:nth-child(2){text-align:left}
  th{color:var(--muted);font-weight:600;font-size:.68rem;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
  td.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .ctrl{color:var(--muted)}
  .wrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo mono">A1</div>
    <div><h1>AsciiTable</h1><div class="sub">ASCII reference &amp; lookup</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="look">Look up a character or a code (e.g. A, 65, 0x41, filter text)</label>
    <input id="look" placeholder="type a char, a number, or a filter…" spellcheck="false">
    <div class="look" id="lookOut"></div>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <div class="wrap">
      <table><thead><tr><th>Dec</th><th>Char</th><th>Hex</th><th>Oct</th><th>Binary</th><th>Name</th></tr></thead>
      <tbody id="tbody"></tbody></table>
    </div>
  </div>
</main>
<footer>
  The 128 ASCII code points: 0–31 &amp; 127 are control characters (shown by name), 32–126 are printable. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/ascii-table">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  const CONTROL = ['NUL','SOH','STX','ETX','EOT','ENQ','ACK','BEL','BS','HT','LF','VT','FF','CR','SO','SI',
    'DLE','DC1','DC2','DC3','DC4','NAK','SYN','ETB','CAN','EM','SUB','ESC','FS','GS','RS','US'];

  function charInfo(code){
    const c = Number(code);
    if(!Number.isInteger(c) || c < 0 || c > 127) throw new Error('ASCII code must be an integer 0–127');
    let char = '', name, printable = false;
    if(c < 32){ name = CONTROL[c]; }
    else if(c === 127){ name = 'DEL'; }
    else if(c === 32){ char = ' '; name = 'Space'; printable = true; }
    else { char = String.fromCharCode(c); name = char; printable = true; }
    return {
      dec: c,
      char,
      hex: c.toString(16).toUpperCase().padStart(2, '0'),
      oct: c.toString(8).padStart(3, '0'),
      bin: c.toString(2).padStart(8, '0'),
      name, printable
    };
  }

  // Character → its ASCII code (first char).
  function codeOfChar(ch){
    const s = String(ch);
    if(s.length === 0) throw new Error('empty input');
    const c = s.codePointAt(0);
    if(c > 127) throw new Error('not an ASCII character');
    return c;
  }

  // Parse a lookup string → a code (supports 'A', '65', '0x41', '0o101', '0b1000001').
  function parseLookup(input){
    const s = String(input).trim();
    if(s === '') throw new Error('empty');
    if(/^0x[0-9a-f]+$/i.test(s)) return parseInt(s, 16);
    if(/^0o[0-7]+$/i.test(s)) return parseInt(s.slice(2), 8);
    if(/^0b[01]+$/i.test(s)) return parseInt(s.slice(2), 2);
    if(/^\d+$/.test(s)) return Number(s);
    return codeOfChar(s);   // treat as a character
  }

  const ALL = Array.from({ length: 128 }, (_, i) => charInfo(i));

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('tbody')){
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

    function rowHtml(r){
      const ch = r.printable ? esc(r.char === ' ' ? '␠' : r.char) : `<span class="ctrl">·</span>`;
      return `<tr><td class="mono">${r.dec}</td><td class="mono">${ch}</td><td class="mono">${r.hex}</td><td class="mono">${r.oct}</td><td class="mono">${r.bin}</td><td>${esc(r.name)}</td></tr>`;
    }
    $('tbody').innerHTML = ALL.map(rowHtml).join('');

    function renderLookup(){
      const s = $('look').value.trim();
      if(!s){ $('lookOut').innerHTML = ''; $('err').textContent = ''; filterTable(''); return; }
      try{
        const code = parseLookup(s);
        const r = charInfo(code);
        $('lookOut').innerHTML = [
          [r.printable ? (r.char === ' ' ? '␠' : r.char) : r.name, 'Char'],
          [r.dec, 'Dec'], ['0x' + r.hex, 'Hex'], ['0o' + r.oct, 'Oct'], [r.bin, 'Binary'], [r.name, 'Name']
        ].map(([v, k]) => `<div class="b"><div class="v">${esc(v)}</div><div class="k">${k}</div></div>`).join('');
        $('err').textContent = '';
        filterTable('');
      }catch(e){
        $('lookOut').innerHTML = '';
        // if not a single lookup, use it as a name/char filter
        $('err').textContent = '';
        filterTable(s.toLowerCase());
      }
    }
    function filterTable(q){
      $('tbody').innerHTML = ALL.filter(r => !q || r.name.toLowerCase().includes(q) || r.char.toLowerCase() === q).map(rowHtml).join('');
    }
    $('look').addEventListener('input', renderLookup);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('ascii-theme', cur); }catch(e){}
    });
  }

  if(typeof module !== 'undefined') module.exports = { CONTROL, charInfo, codeOfChar, parseLookup };
</script>
</body>
</html>
