<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClampGen — CSS clamp() Fluid Size Generator</title>
<meta name="description" content="Generate a responsive CSS clamp() value for fluid type and spacing from a min/max size and viewport range. 100% offline, no signup." />
<meta name="theme-color" content="#0369a1" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="ClampGen — CSS clamp() Generator" />
<meta property="og:description" content="Fluid CSS clamp() for type & spacing from min/max size + viewport range. Offline." />
<meta property="og:url" content="https://awictor.github.io/clamp-gen/" />
<link rel="canonical" href="https://awictor.github.io/clamp-gen/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230369a1'/%3E%3Cpath d='M24 18 L18 32 L24 46 M40 18 L46 32 L40 46' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eef4fa; --ink:#0b1c28; --accent:#0369a1; --accent-d:#075985;
    --card:#fff; --line:#d4e2ee; --muted:#4f6675; --field:#fff;
    --shadow:0 1px 2px rgba(11,28,40,.05),0 8px 24px rgba(11,28,40,.07); }
  [data-theme="dark"]{ --bg:#07131c; --ink:#e6f0f7; --accent:#38bdf8; --accent-d:#7dd3fc;
    --card:#101d27; --line:#1e3340; --muted:#8aa4b1; --field:#07131c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  input[type=number]{width:110px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(3,105,161,.15)}
  .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--bg);border-radius:10px;padding:14px;word-break:break-all;cursor:pointer;line-height:1.5}
  .out .fn{color:var(--accent);font-weight:700}
  #msg{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;min-height:16px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("clamp.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Clamp</span>Gen</h1>
  <p>Fluid CSS <code>clamp()</code> for type &amp; spacing. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Min size (px)</label><input id="minPx" type="number" value="16"></div>
    <div class="row"><label>Max size (px)</label><input id="maxPx" type="number" value="24"></div>
    <div class="row"><label>Min viewport (px)</label><input id="minVw" type="number" value="320"></div>
    <div class="row"><label>Max viewport (px)</label><input id="maxVw" type="number" value="1200"></div>
  </section>
  <section class="card">
    <div class="out" id="out" title="Click to copy"></div>
    <div id="msg"></div>
  </section>
</div>

<footer>
  <b>ClampGen</b> · offline CSS clamp() generator · <a href="https://github.com/awictor/clamp-gen">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Assumes a 16px root; linear between the two viewports. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const r4=n=>Math.round(n*10000)/10000;

// --- Pure clamp math ---
function fluidClamp(minPx,maxPx,minVw,maxVw){
  if(maxVw===minVw) return null;
  const slope=(maxPx-minPx)/(maxVw-minVw);
  const interceptRem=(minPx - slope*minVw)/16;
  const slopeVw=slope*100;
  const minRem=Math.min(minPx,maxPx)/16, maxRem=Math.max(minPx,maxPx)/16;
  const css=`clamp(${r4(minRem)}rem, ${r4(interceptRem)}rem + ${r4(slopeVw)}vw, ${r4(maxRem)}rem)`;
  return {minRem:r4(minRem), maxRem:r4(maxRem), slopeVw:r4(slopeVw), interceptRem:r4(interceptRem), css};
}

// --- UI ---
function render(){
  try{["minPx","maxPx","minVw","maxVw"].forEach(k=>localStorage.setItem("clamp."+k,$(k).value));}catch(e){}
  const r=fluidClamp(num("minPx"),num("maxPx"),num("minVw"),num("maxVw"));
  if(!r){ $("out").textContent="Min and max viewport must differ."; return; }
  $("out").innerHTML=`font-size: <span class="fn">${r.css}</span>;`;
}
$("out").onclick=()=>{const r=fluidClamp(num("minPx"),num("maxPx"),num("minVw"),num("maxVw"));if(!r)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1300);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(r.css).then(done,done);else done();};
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("clamp.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["minPx","maxPx","minVw","maxVw"].forEach(k=>{const v=localStorage.getItem("clamp."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={fluidClamp};
</script>
</body>
</html>
