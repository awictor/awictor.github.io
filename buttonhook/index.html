<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttonhook</title>
<style>
  :root{ --ice:#eef4f8; --ink:#1b2733; --p:#d64545; --o:#e2b13c; --acc:#3a86c8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#0e141b; color:#dfe8f0;
    font-family:"Segoe UI",system-ui,Arial,sans-serif; overflow:hidden; }
  #wrap{ display:flex; height:100%; align-items:stretch; justify-content:center; gap:18px; padding:14px; }
  #side{ width:230px; display:flex; flex-direction:column; gap:12px; padding-top:6px; }
  h1{ font-size:26px; letter-spacing:1px; color:#fff; }
  h1 b{ color:var(--acc); }
  .card{ background:#182430; border:1px solid #24323f; border-radius:10px; padding:12px 13px; }
  .card h2{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#7d94a8; margin-bottom:7px; }
  .row{ display:flex; justify-content:space-between; font-size:14px; margin:3px 0; }
  .row .p{ color:var(--p); font-weight:700; } .row .o{ color:var(--o); font-weight:700; }
  .meter{ height:12px; border-radius:6px; background:#0e1620; overflow:hidden; border:1px solid #24323f;
    transition:border-color .1s, box-shadow .1s; }
  .meter.out{ border-color:#e05a5a; box-shadow:0 0 0 2px rgba(224,90,90,.35); }
  .meter i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,#e05a5a,#f2c14a);
    transition:width .05s linear, filter .15s linear; }
  .hint{ font-size:12px; line-height:1.55; color:#9fb2c2; }
  .hint b{ color:#dfe8f0; }
  .curl{ display:flex; gap:8px; }
  .curl button{ flex:1; background:#0e1620; color:#9fb2c2; border:1px solid #24323f; border-radius:7px;
    padding:6px; font-size:12px; cursor:pointer; }
  .curl button.on{ background:var(--acc); color:#fff; border-color:var(--acc); }
  canvas{ background:var(--ice); border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); cursor:crosshair;
    max-height:calc(100vh - 28px); max-width:100%; height:auto; width:auto; }
  #share{ background:#0e1620; border:1px solid #24323f; color:#7fa8cc; border-radius:7px; padding:7px;
    font-size:11px; cursor:pointer; width:100%; }
  #share:hover{ color:#fff; }
  @media (max-width:820px), (max-height:812px){
    html,body{ overflow:auto; }
    #wrap{ flex-direction:column; align-items:center; height:auto; min-height:100%; }
    #side{ width:min(92vw,360px); order:2; }
    canvas{ order:1; max-height:min(78vh, calc(100vw * 1.5)); }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="520" height="780"></canvas>
  <div id="side">
    <h1>Button<b>hook</b></h1>
    <div class="card">
      <h2>Score</h2>
      <div class="row"><span class="p">You</span><span id="sp" class="p">0</span></div>
      <div class="row"><span class="o">Rival</span><span id="so" class="o">0</span></div>
      <div class="row"><span>End</span><span id="end">1 / 3</span></div>
      <div class="row"><span>Hammer</span><span id="ham">—</span></div>
    </div>
    <div class="card">
      <h2>Sweep stamina</h2>
      <div class="meter"><i id="sta"></i></div>
    </div>
    <div class="card">
      <h2>Curl handle</h2>
      <div class="curl">
        <button id="cw" class="on">In-turn ↻</button>
        <button id="ccw">Out-turn ↺</button>
      </div>
    </div>
    <div class="card hint" id="tip">
      <b>Drag</b> from the hack up the sheet to aim &amp; set weight, release to throw.<br>
      <b>Hold mouse / Space</b> while it slides to <b>sweep</b> — less friction, less hook. The dotted lines preview hook vs. swept.
    </div>
    <button id="share">🔗 Copy shareable match link</button>
  </div>
</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById("cv"), g=cv.getContext("2d");
const W=520,H=780, RR=14;
const HACK={x:260,y:712}, BTN={x:260,y:150};
const RINGS=[[96,"#3a78b4"],[68,"#f4f8fb"],[42,"#c0392b"],[16,"#f4f8fb"]];
const BACKY=44, HOGY=470, SIDE=26, HOUSE=96+RR;
const DECEL=300, SWEPT=170, CURLK=0.15, DT=1/120, PER=4;
const el=id=>document.getElementById(id);
const FONT="'Segoe UI', system-ui, Arial, sans-serif";
const REDUCE=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- seeded RNG + URL hash config ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function parseHash(){const h=new URLSearchParams(location.hash.slice(1));return{
  s:+h.get("s")||((Math.random()*1e9)|0), o:Math.min(2,Math.max(0,+h.get("o")||1)),
  e:Math.min(6,Math.max(1,+h.get("e")||3)), h:(+h.get("h")===1?1:0)};}
const CFG=parseHash();
const rand=mulberry32(CFG.s);   // seeded: same URL ⇒ same opponent shots
function writeHash(){const p=new URLSearchParams();p.set("s",CFG.s);p.set("o",CFG.o);
  p.set("e",CFG.e);p.set("h",CFG.h);
  history.replaceState(null,"","#"+p.toString());}
writeHash();
const STYLE=[{n:"Sharp",noise:14},{n:"Steady",noise:26},{n:"Loose",noise:44}][CFG.o];

// ---- audio (lazy WebAudio synth) ----
let AC=null, rumbleG=null;
function audioInit(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)();
  const buf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;
  rumbleG=AC.createGain();rumbleG.gain.value=0;
  src.connect(lp);lp.connect(rumbleG);rumbleG.connect(AC.destination);src.start();
}catch(e){} }
function clack(v){ if(!AC)return; const t=AC.currentTime, gn=AC.createGain();
  gn.gain.setValueAtTime(Math.min(.5,v*.5),t); gn.gain.exponentialRampToValueAtTime(.001,t+.18);
  const o=AC.createOscillator();o.type="triangle";o.frequency.setValueAtTime(180+v*120,t);
  o.frequency.exponentialRampToValueAtTime(70,t+.15);
  const nb=AC.createBuffer(1,2205,AC.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
  const ns=AC.createBufferSource();ns.buffer=nb;const bp=AC.createBiquadFilter();
  bp.type="bandpass";bp.frequency.value=1600;ns.connect(bp);bp.connect(gn);
  o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+.18);ns.start(t); }

// ---- game state ----
let rocks=[], parts=[], phase="aim", turn=1-CFG.h, hammer=CFG.h,
    thrown=[0,0], score=[0,0], endNo=1, spin=1, live=null,
    stamina=100, sweepHeld=false, aiming=false, aimPt=null,
    shake=0, tScale=1, slowT=0, oppTimer=0, msg="", scorecard=null, everThrown=false;

function reset(){ rocks=[]; parts=[]; thrown=[0,0]; live=null; stamina=100;
  turn=1-hammer; phase="aim"; msg=""; scorecard=null; }
function newRock(team,x,y){ return {x,y,vx:0,vy:0,spin:0,team,trail:[]}; }

// ---- physics ----
function moving(r){ return r.vx*r.vx+r.vy*r.vy>4; }
function stepRock(r,swept,dt){
  let sp=Math.hypot(r.vx,r.vy); if(sp<1){r.vx=r.vy=0;return;}
  const ux=r.vx/sp, uy=r.vy/sp;
  sp=Math.max(0,sp-(swept?SWEPT:DECEL)*dt);
  // curl: rotate heading a touch each step (constant ω ⇒ hooks harder as it slows);
  // sweeping bleeds friction AND straightens the hook.
  const th=(swept?0.16:1)*CURLK*r.spin*dt;
  const c=Math.cos(th), s=Math.sin(th);
  r.vx=(ux*c-uy*s)*sp; r.vy=(ux*s+uy*c)*sp;
  r.x+=r.vx*dt; r.y+=r.vy*dt;
}
function collide(){
  for(let i=0;i<rocks.length;i++)for(let j=i+1;j<rocks.length;j++){
    const a=rocks[i],b=rocks[j], dx=b.x-a.x,dy=b.y-a.y, d=Math.hypot(dx,dy);
    if(d>0&&d<RR*2){
      const nx=dx/d,ny=dy/d, ov=RR*2-d;
      a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;
      const av=a.vx*nx+a.vy*ny, bv=b.vx*nx+b.vy*ny, imp=av-bv;
      if(imp>0){ // exchange normal component (equal mass)
        a.vx-=nx*av;a.vy-=ny*av; b.vx-=nx*bv;b.vy-=ny*bv;
        a.vx+=nx*bv;a.vy+=ny*bv; b.vx+=nx*av;b.vy+=ny*av;
        const power=Math.min(1,imp/300);
        clack(power);
        if(!REDUCE){ shake=Math.max(shake,power*14);
          if(power>.35){ slowT=Math.max(slowT,.32); }
          for(let k=0;k<8+power*14;k++){ const an=Math.random()*6.28, sp=Math.random()*power*160+20;
            parts.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:.5}); } }
      }
    }
  }
}
function offSheet(r){ return r.x<SIDE||r.x>W-SIDE||r.y<BACKY||r.y>H+40; }

// ---- ghost prediction ----
function ghost(x,y,vx,vy,sp,swept){
  const pts=[{x,y}]; let r={x,y,vx,vy,spin:sp};
  for(let i=0;i<900;i++){ stepRock(r,swept,DT);
    if(i%4===0)pts.push({x:r.x,y:r.y});
    if(Math.hypot(r.vx,r.vy)<28||r.x<SIDE||r.x>W-SIDE||r.y<BACKY)break; }
  return pts;
}

// ---- launch + turns ----
function launch(team,vx,vy,sp){ const r=newRock(team,HACK.x,HACK.y); r.vx=vx;r.vy=vy;r.spin=sp;
  rocks.push(r); live=r; phase="live"; if(team===0)everThrown=true; }
function nextThrow(){
  if(thrown[0]>=PER&&thrown[1]>=PER){ scoreEnd(); return; }
  const first=1-hammer;
  const done=thrown[0]+thrown[1];
  turn=(done%2===0)?first:hammer;
  if(turn===1){ phase="oppthink"; oppTimer=.7; } else { phase="aim"; }
}
function distB(r){ return Math.hypot(r.x-BTN.x,r.y-BTN.y); }
function oppThrow(){
  // heuristic: takeout the closest player stone in the house, else draw to button
  let inplay=rocks.filter(r=>distB(r)<HOUSE&&r.y<HOGY);
  inplay.sort((a,b)=>distB(a)-distB(b));
  let tx=BTN.x, ty=BTN.y, speed, sp=0;
  if(inplay.length&&inplay[0].team===0&&distB(inplay[0])<80){
    tx=inplay[0].x; ty=inplay[0].y; speed=705;              // takeout
  }else{
    tx=BTN.x+(rand()*40-20); ty=BTN.y+(rand()*30-10);
    const dist=Math.hypot(tx-HACK.x,ty-HACK.y);
    speed=Math.sqrt(2*DECEL*dist);                           // draw weight
    sp=(rand()<.5?1:-1)*(rand()<.4?1:0);
  }
  tx+=(rand()*2-1)*STYLE.noise; ty+=(rand()*2-1)*STYLE.noise;
  const dx=tx-HACK.x, dy=ty-HACK.y, d=Math.hypot(dx,dy);
  launch(1, dx/d*speed, dy/d*speed, sp);
}

// ---- scoring ----
function scoreEnd(){
  rocks=rocks.filter(r=>!offSheet(r)&&r.y<HOGY);
  const scored=rocks.filter(r=>distB(r)<HOUSE).sort((a,b)=>distB(a)-distB(b));
  let pts=0, who=-1;
  if(scored.length){ who=scored[0].team;
    const oppNear=scored.find(r=>r.team!==who);
    const lim=oppNear?distB(oppNear):Infinity;
    pts=scored.filter(r=>r.team===who&&distB(r)<lim).length; }
  if(who>=0){ score[who]+=pts; hammer=1-who; }
  scorecard={who,pts,rocks:scored.map(r=>({x:r.x,y:r.y,t:r.team})), lim:scored.find(r=>r.team!==who)};
  phase="scorecard";
  msg = who<0 ? "Blank end — no rock in the house." :
    (who===0?"You score "+pts:"Rival scores "+pts)+(pts>1?" points!":" point!");
  refresh();
}
function nextEnd(){
  if(endNo>=CFG.e){ phase="over";
    msg = score[0]>score[1]?"You win the match! 🥌":score[0]<score[1]?"Rival takes the match.":"Match tied.";
    refresh(); return; }
  endNo++; reset(); refresh();
}

// ---- input ----
function pos(e){ const b=cv.getBoundingClientRect();
  return {x:(e.clientX-b.left)*(W/b.width), y:(e.clientY-b.top)*(H/b.height)}; }
cv.addEventListener("pointerdown",e=>{ audioInit(); if(AC&&AC.state==="suspended")AC.resume();
  if(phase==="aim"){ aiming=true; aimPt=pos(e); }
  else if(phase==="live"&&live&&live.team===0){ sweepHeld=true; }
  else if(phase==="scorecard"){ nextEnd(); }
  else if(phase==="over"){ endNo=0; score=[0,0]; hammer=CFG.h; nextEnd(); } });
window.addEventListener("pointermove",e=>{ if(aiming)aimPt=pos(e); });
window.addEventListener("pointerup",()=>{ sweepHeld=false;
  if(aiming&&aimPt){ const a=aimVec(); if(a.speed>60){ launch(0,a.vx,a.vy,spin); } }
  aiming=false; aimPt=null; });
window.addEventListener("keydown",e=>{ if(e.code==="Space"){ e.preventDefault();
    if(phase==="live"&&live&&live.team===0)sweepHeld=true;
    else if(phase==="scorecard")nextEnd(); }
  if(e.key==="c"||e.key==="C")setSpin(-spin); });
window.addEventListener("keyup",e=>{ if(e.code==="Space")sweepHeld=false; });
function setSpin(s){ spin=s; el("cw").classList.toggle("on",s>0); el("ccw").classList.toggle("on",s<0); }
el("cw").onclick=()=>setSpin(1); el("ccw").onclick=()=>setSpin(-1);
el("share").onclick=()=>{
  const done=ok=>{ el("share").textContent = ok ? "✓ Link copied!" : "Copy the URL from your address bar";
    setTimeout(()=>el("share").textContent="🔗 Copy shareable match link",1800); };
  const fallback=()=>{ try{ const ta=document.createElement("textarea"); ta.value=location.href;
      ta.style.position="fixed"; ta.style.top="-1000px"; document.body.appendChild(ta);
      ta.focus(); ta.select(); const ok=document.execCommand("copy");
      document.body.removeChild(ta); done(ok);
    }catch(e){ done(false); } };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(location.href).then(()=>done(true)).catch(fallback);
  } else fallback();
};
function aimVec(){ const dx=aimPt.x-HACK.x, dy=aimPt.y-HACK.y, d=Math.hypot(dx,dy)||1;
  const speed=Math.min(720, d*2.35); return {vx:dx/d*speed, vy:dy/d*speed, speed}; }

// ---- HUD refresh ----
function refresh(){ el("sp").textContent=score[0]; el("so").textContent=score[1];
  el("end").textContent=endNo+" / "+CFG.e;
  el("ham").innerHTML=hammer===0?'<span style="color:var(--p)">You</span>':'<span style="color:var(--o)">Rival</span>';
  el("tip").style.opacity = phase==="live"?.5:1; }

// ---- main loop ----
let last=performance.now(), acc=0;
function frame(now){ let dt=Math.min(.05,(now-last)/1000); last=now;
  if(slowT>0){ slowT-=dt; tScale+=(0.35-tScale)*.2; } else { tScale+=(1-tScale)*.2; }
  acc+=dt*tScale;
  // sweeping / stamina
  const canSweep=phase==="live"&&live&&live.team===0;
  if(canSweep&&sweepHeld&&stamina>0){ stamina=Math.max(0,stamina-46*dt*tScale); }
  else if(phase!=="live"){ stamina=Math.min(100,stamina+70*dt); }
  const swept=canSweep&&sweepHeld&&stamina>0;
  // fixed-step physics
  while(acc>=DT){ acc-=DT;
    for(const r of rocks){ if(moving(r)) stepRock(r, r===live&&swept, DT); }
    collide();
    for(const r of rocks){ if(moving(r)){ r.trail.push({x:r.x,y:r.y});
      if(r.trail.length>26)r.trail.shift(); } }
    if(phase==="live"){
      if(live&&offSheet(live)){ thrown[live.team]++; live=null; }  // thrown-away rock still counts
      rocks=rocks.filter(r=>!offSheet(r));
      if(!rocks.some(moving)){ if(live){thrown[live.team]++;} live=null;
        stamina=Math.min(100,stamina+30); nextThrow(); refresh(); }
    }
  }
  if(phase==="oppthink"){ oppTimer-=dt; if(oppTimer<=0)oppThrow(); }
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.9; p.vy*=.9; p.life-=dt*2; }
  parts=parts.filter(p=>p.life>0);
  if(rumbleG){ let mv=0; for(const r of rocks)mv=Math.max(mv,Math.hypot(r.vx,r.vy));
    rumbleG.gain.value += (Math.min(.32,mv/700*.32)-rumbleG.gain.value)*.2; }
  const staEl=el("sta"), meter=staEl.parentElement;
  staEl.style.width=stamina+"%";
  staEl.style.filter = stamina<25 ? "saturate(.35) brightness(.85)" : "none";
  meter.classList.toggle("out", canSweep&&sweepHeld&&stamina<=0);  // held sweep but empty
  cv.style.cursor = phase==="aim" ? "crosshair"
    : (phase==="scorecard"||phase==="over") ? "pointer" : "default";
  if(shake>0)shake*=.85;
  draw(); requestAnimationFrame(frame);
}

// ---- rendering ----
function ring(x,y,rad,col){ g.beginPath();g.arc(x,y,rad,0,6.283);g.fillStyle=col;g.fill(); }
function drawRock(r,alpha){ g.globalAlpha=alpha;
  g.beginPath();g.arc(r.x,r.y,RR,0,6.283);
  g.fillStyle="#2b2b2b";g.fill();
  g.beginPath();g.arc(r.x,r.y,RR-3,0,6.283);
  g.fillStyle=r.team===0?"#d64545":"#e2b13c";g.fill();
  g.beginPath();g.arc(r.x,r.y,RR-8,0,6.283);g.fillStyle="#f2eee6";g.fill();
  g.globalAlpha=1; }
function draw(){
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H);
  if(shake>1){ g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); }
  // sheet
  g.fillStyle="#eef4f8"; g.fillRect(0,0,W,H);
  g.strokeStyle="#c3d4e0"; g.lineWidth=2;
  g.beginPath();g.moveTo(SIDE,0);g.lineTo(SIDE,H);g.moveTo(W-SIDE,0);g.lineTo(W-SIDE,H);g.stroke();
  g.beginPath();g.moveTo(260,BACKY);g.lineTo(260,H);g.stroke();           // center
  g.strokeStyle="#9fb8c8";
  g.beginPath();g.moveTo(SIDE,BACKY);g.lineTo(W-SIDE,BACKY);              // back line
  g.moveTo(SIDE,HOGY);g.lineTo(W-SIDE,HOGY);g.stroke();                   // hog line
  // house
  for(const [rad,col] of RINGS) ring(BTN.x,BTN.y,rad,col);
  g.beginPath();g.moveTo(SIDE,BTN.y);g.lineTo(W-SIDE,BTN.y);g.strokeStyle="#8aa5b8";g.stroke();
  // hack
  g.fillStyle="#33424f"; g.fillRect(HACK.x-16,HACK.y-6,32,12);
  // trails
  for(const r of rocks){ for(let i=0;i<r.trail.length;i++){ const t=r.trail[i];
    g.globalAlpha=(i/r.trail.length)*.28;
    g.beginPath();g.arc(t.x,t.y,RR*.7,0,6.283);
    g.fillStyle=r.team===0?"#d64545":"#e2b13c";g.fill(); } g.globalAlpha=1; }
  // particles
  for(const p of parts){ g.globalAlpha=Math.max(0,p.life);
    g.beginPath();g.arc(p.x,p.y,2.4,0,6.283);g.fillStyle="#fff";g.fill(); } g.globalAlpha=1;
  // aim + dual ghost preview
  if(phase==="aim"&&aiming&&aimPt){ const a=aimVec();
    g.strokeStyle="rgba(58,134,200,.35)";g.setLineDash([2,6]);g.lineWidth=2;
    const drawGhost=(swept,col)=>{ const pts=ghost(HACK.x,HACK.y,a.vx,a.vy,spin,swept);
      g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(const q of pts)g.lineTo(q.x,q.y);
      g.strokeStyle=col;g.stroke();
      const e=pts[pts.length-1]; g.setLineDash([]);
      g.beginPath();g.arc(e.x,e.y,RR,0,6.283);g.strokeStyle=col;g.lineWidth=1.5;g.stroke();
      g.setLineDash([2,6]); };
    drawGhost(false,"rgba(214,69,69,.85)");    // hook (no sweep)
    drawGhost(true,"rgba(58,134,200,.85)");    // swept straight line
    g.setLineDash([]);
    // power bar near hack
    g.fillStyle="#33424f";g.fillRect(HACK.x-40,HACK.y+16,80,7);
    g.fillStyle="#f2c14a";g.fillRect(HACK.x-40,HACK.y+16,80*a.speed/720,7);
  }
  // first-throw onboarding prompt near the hack
  if(phase==="aim"&&!everThrown&&!aiming){
    const pulse=REDUCE?.5:(Math.sin(performance.now()/350)+1)/2;
    g.beginPath();g.arc(HACK.x,HACK.y,27,0,6.283);
    g.strokeStyle=`rgba(58,134,200,${.25+.4*pulse})`;g.lineWidth=3;g.stroke();
    g.textAlign="center";g.fillStyle="rgba(27,39,51,.9)";g.font=`600 16px ${FONT}`;
    g.fillText("↑ Drag up the sheet to aim & throw",W/2,HACK.y-42);
    g.font=`13px ${FONT}`;g.fillStyle="rgba(27,39,51,.65)";
    g.fillText("then hold to sweep the live rock",W/2,HACK.y-22);
    g.textAlign="left";
  }
  // rocks
  for(const r of rocks) drawRock(r,1);
  // live sweep glow
  if(phase==="live"&&live&&live.team===0&&sweepHeld&&stamina>0){
    g.beginPath();g.arc(live.x,live.y,RR+7,0,6.283);
    g.strokeStyle="rgba(58,134,200,.8)";g.lineWidth=3;g.stroke(); }
  // out-of-sweep cue: holding sweep with an empty meter
  if(phase==="live"&&live&&live.team===0&&sweepHeld&&stamina<=0){
    g.textAlign="center";g.fillStyle="rgba(224,90,90,.95)";g.font=`700 13px ${FONT}`;
    g.fillText("Out of sweep",live.x,live.y-RR-8);g.textAlign="left"; }
  // scorecard / overlays
  if(phase==="scorecard"||phase==="over"){
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle="rgba(14,20,27,.72)";g.fillRect(0,0,W,H);
    if(scorecard&&scorecard.lim){ const d=Math.hypot(scorecard.lim.x-BTN.x,scorecard.lim.y-BTN.y);
      g.beginPath();g.arc(BTN.x,BTN.y,d,0,6.283);g.setLineDash([5,5]);
      g.strokeStyle="#fff";g.lineWidth=2;g.stroke();g.setLineDash([]); }
    g.fillStyle="#fff";g.textAlign="center";
    g.font=`700 30px ${FONT}`;g.fillText(msg,W/2,H/2-30);
    g.font=`15px ${FONT}`;g.fillStyle="#9fb2c2";
    g.fillText(phase==="over"?"Click to play again":"Click or press Space for next end",W/2,H/2+12);
    g.font=`12px ${FONT}`;
    g.fillText("Match link saved to URL — share to challenge a friend",W/2,H/2+40);
    g.textAlign="left";
  } else if(phase==="oppthink"){
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle="rgba(226,177,60,.9)";g.font=`700 16px ${FONT}`;g.textAlign="center";
    g.fillText("Rival is throwing…",W/2,30);g.textAlign="left";
  }
}
setSpin(1); refresh(); requestAnimationFrame(frame);
})();
</script>
