<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Frequency Analyzer — counts, %, English baseline</title>
<meta name="description" content="Analyze letter frequency in text: per-letter counts and percentages compared to standard English frequencies. For cryptanalysis, typography, and word games. Offline, no tracking.">
<style>
  :root{
    --c:#4338ca;
    --bg:#f5f6fb; --card:#ffffff; --fg:#151726; --muted:#616780;
    --line:#e3e5f0; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.05);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#0f1018; --card:#181a26; --fg:#eceef6; --muted:#969cb4;
    --line:#262a3a; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{max-width:860px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;
    font-size:24px;color:#fff;flex:0 0 auto}
  h1{font-size:1.4rem;margin:0}
  header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
  .theme{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem}
  main{max-width:860px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--fg);min-height:130px;resize:vertical}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .seg{display:flex;gap:6px}
  .seg button{padding:8px 14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;cursor:pointer;font-weight:600;font-size:.86rem}
  .seg button.on{background:var(--c);color:#fff;border-color:var(--c)}
  .stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:.9rem}
  .stats b{color:var(--fg);font-variant-numeric:tabular-nums}
  .bars{margin-top:8px}
  .brow{display:flex;align-items:center;gap:10px;padding:3px 0}
  .brow .lt{width:20px;font-family:ui-monospace,monospace;font-weight:700;text-transform:uppercase}
  .brow .track{flex:1;position:relative;height:18px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .brow .fill{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:5px 0 0 5px}
  .brow .eng{position:absolute;top:0;bottom:0;width:2px;background:#ef4444}
  .brow .pct{width:96px;text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem;font-family:ui-monospace,monospace}
  .legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  h2{font-size:1rem;margin:0}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:26px}
  .foot a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="logo">📊</div>
  <div>
    <h1>Letter Frequency</h1>
    <p>Counts, percentages &amp; English baseline</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="card">
    <label for="in">Your text</label>
    <textarea id="in" spellcheck="false" placeholder="Paste text — a cipher, a paragraph, anything…">The quick brown fox jumps over the lazy dog.</textarea>
    <div class="controls">
      <div>
        <label style="margin-bottom:4px">Sort</label>
        <div class="seg"><button data-sort="freq" class="on">By frequency</button><button data-sort="alpha">A–Z</button></div>
      </div>
    </div>
    <div class="stats">
      <span>Letters counted: <b id="total">0</b></span>
      <span>Most common: <b id="top">—</b></span>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Distribution</h2>
    </div>
    <div class="legend">
      <span><span class="sw" style="background:var(--c)"></span>Your text</span>
      <span><span class="sw" style="background:#ef4444"></span>English baseline</span>
    </div>
    <div class="bars" id="bars"></div>
  </div>

  <p class="foot">100% offline · nothing leaves your browser · part of the
    <a href="https://awictor.github.io/toolkit/">Toolkit</a></p>
</main>

<script>
  var ENGLISH = {
    a:8.2, b:1.5, c:2.8, d:4.3, e:12.7, f:2.2, g:2.0, h:6.1, i:7.0, j:0.15,
    k:0.77, l:4.0, m:2.4, n:6.7, o:7.5, p:1.9, q:0.095, r:6.0, s:6.3, t:9.1,
    u:2.8, v:0.98, w:2.4, x:0.15, y:2.0, z:0.074
  };
  var LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');

  function letterFrequency(text){
    var counts = {};
    LETTERS.forEach(function(l){ counts[l] = 0; });
    var total = 0;
    String(text).toLowerCase().replace(/[a-z]/g, function(ch){ counts[ch]++; total++; return ch; });
    var results = LETTERS.map(function(l){
      return { letter: l, count: counts[l], pct: total ? counts[l] / total * 100 : 0, english: ENGLISH[l] };
    });
    return { total: total, counts: counts, results: results };
  }
  function mostCommon(text){
    var f = letterFrequency(text);
    if(f.total === 0) return null;
    return f.results.reduce(function(best, r){ return r.count > best.count ? r : best; }).letter;
  }

  if(typeof module !== 'undefined') module.exports = { ENGLISH:ENGLISH, letterFrequency:letterFrequency, mostCommon:mostCommon };

  // ---- UI ----
  if(typeof document !== 'undefined'){
    var inp=document.getElementById('in'), bars=document.getElementById('bars');
    var sort='freq';
    function render(){
      var f = letterFrequency(inp.value);
      document.getElementById('total').textContent = f.total.toLocaleString();
      document.getElementById('top').textContent = f.total ? mostCommon(inp.value).toUpperCase() : '—';
      var rows = f.results.slice();
      if(sort === 'freq') rows.sort(function(a,b){ return b.count - a.count || a.letter.localeCompare(b.letter); });
      var maxPct = Math.max(1, Math.max.apply(null, rows.map(function(r){ return Math.max(r.pct, r.english); })));
      bars.innerHTML = rows.map(function(r){
        return '<div class="brow"><div class="lt">' + r.letter + '</div>'
          + '<div class="track"><div class="fill" style="width:' + (r.pct / maxPct * 100) + '%"></div>'
          + '<div class="eng" style="left:' + (r.english / maxPct * 100) + '%" title="English ' + r.english + '%"></div></div>'
          + '<div class="pct">' + r.count + ' · ' + r.pct.toFixed(1) + '%</div></div>';
      }).join('');
    }
    inp.addEventListener('input', render);
    document.querySelectorAll('.seg button').forEach(function(btn){
      btn.addEventListener('click', function(){
        sort = btn.getAttribute('data-sort');
        document.querySelectorAll('.seg button').forEach(function(x){ x.classList.remove('on'); });
        btn.classList.add('on'); render();
      });
    });

    var root=document.documentElement, tb=document.getElementById('theme');
    function setTheme(t){ root.setAttribute('data-theme',t); tb.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('lf-theme',t);}catch(e){} }
    var saved; try{ saved=localStorage.getItem('lf-theme'); }catch(e){}
    setTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    tb.addEventListener('click', function(){ setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });

    render();
  }
</script>
</body>
</html>
