<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataURI — Data URI Generator & Decoder</title>
<meta name="description" content="Convert text, SVG, or CSS into a data: URI (base64 or URL-encoded, UTF-8 safe) and decode data URIs back. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('data-uri-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#4338ca;
    --bg:#f5f5f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e3e3e8; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#111017; --card:#1a1922; --fg:#f0eff5; --muted:#9a98a6; --line:#2b2938; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#3730a3);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;min-height:100px;resize:vertical}
  select,input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:12px}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .toggle button{padding:9px 14px;border:0;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit}
  .toggle button.on{background:var(--c);color:#fff;font-weight:700}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.82rem;margin:0;white-space:pre-wrap;word-break:break-all;max-height:220px}
  .meta{color:var(--muted);font-size:.82rem;margin:8px 0}
  .btns{display:flex;gap:10px;margin-top:10px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🔗</div>
    <div><h1>DataURI</h1><div class="sub">Encode text/SVG/CSS to a data: URI — and back</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="input">Content (or paste a data: URI to decode)</label>
    <textarea id="input">&lt;svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"&gt;&lt;circle cx="12" cy="12" r="10"/&gt;&lt;/svg&gt;</textarea>
    <div class="row">
      <div>
        <label for="mime">MIME type</label>
        <select id="mime">
          <option value="text/plain">text/plain</option>
          <option value="image/svg+xml" selected>image/svg+xml</option>
          <option value="text/html">text/html</option>
          <option value="text/css">text/css</option>
          <option value="application/json">application/json</option>
          <option value="application/javascript">application/javascript</option>
        </select>
      </div>
      <div class="toggle" id="encToggle">
        <button type="button" data-e="url">URL-encoded</button>
        <button type="button" data-e="b64">Base64</button>
      </div>
    </div>
  </div>

  <div class="card">
    <label>Data URI</label>
    <pre id="out"></pre>
    <div class="meta" id="meta"></div>
    <div class="btns"><button class="act" id="copy" type="button">Copy</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/data-uri">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function toDataUri(content, opts = {}){
    const mime = opts.mime || 'text/plain';
    const s = String(content);
    if(opts.base64){
      return `data:${mime};base64,${btoa(unescape(encodeURIComponent(s)))}`;
    }
    return `data:${mime},${encodeURIComponent(s)}`;
  }

  function fromDataUri(uri){
    const m = /^data:([^;,]*)(;base64)?,([\s\S]*)$/.exec(String(uri));
    if(!m) throw new Error('not a data URI');
    const mime = m[1] || 'text/plain';
    const base64 = !!m[2];
    const content = base64
      ? decodeURIComponent(escape(atob(m[3])))
      : decodeURIComponent(m[3]);
    return { mime, base64, content };
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    let enc = 'url';

    function render(){
      const raw = $('input').value;
      // decode mode if the input already looks like a data URI
      if(/^data:/.test(raw.trim())){
        try{
          const d = fromDataUri(raw.trim());
          $('out').textContent = d.content;
          $('meta').textContent = `Decoded — ${d.mime}${d.base64 ? ' (base64)' : ' (url-encoded)'}`;
          return;
        }catch(e){ $('out').textContent = e.message; $('meta').textContent = ''; return; }
      }
      const uri = toDataUri(raw, { mime: $('mime').value, base64: enc === 'b64' });
      $('out').textContent = uri;
      $('meta').textContent = `${uri.length.toLocaleString()} characters`;
    }

    $('encToggle').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      enc = b.dataset.e;
      [...$('encToggle').children].forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('encToggle').querySelector('[data-e="url"]').classList.add('on');
    ['input', 'mime'].forEach(id => $(id).addEventListener('input', render));
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('data-uri-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { toDataUri, fromDataUri };
</script>
</body>
</html>
