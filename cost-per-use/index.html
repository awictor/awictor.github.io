<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CostPerUse — Cost-Per-Use &amp; Buy-It-For-Life Calculator</title>
<meta name="description" content="Work out the true cost per use (or per wear) of a purchase, factor in resale value, and compare a cheap item against a durable one. 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('cpu-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#047857;
    --bg:#f1f8f4; --card:#ffffff; --fg:#12201a; --muted:#566b60; --line:#dcebe2; --shadow:0 1px 3px rgba(0,0,0,.08);
    --ok:#16a34a;
  }
  [data-theme="dark"]{
    --bg:#08130d; --card:#0f1d15; --fg:#e7f4ec; --muted:#84a394; --line:#1a2c21; --shadow:0 1px 3px rgba(0,0,0,.5);
    --ok:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:680px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#065f46);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:680px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  .items{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  h2{font-size:.9rem;margin:0 0 12px}
  label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px;font-weight:600}
  .field{margin-bottom:10px}
  input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .cpu{text-align:center;margin-top:8px}
  .cpu .v{font-size:1.8rem;font-weight:800;color:var(--c)}
  .cpu .k{color:var(--muted);font-size:.72rem;text-transform:uppercase}
  .verdict{text-align:center;margin-top:6px;font-size:1.05rem;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
  .verdict b{color:var(--c)}
  .err{color:#dc2626;font-size:.85rem;margin-top:8px;text-align:center}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:680px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏷️</div>
    <div><h1>CostPerUse</h1><div class="sub">Is it worth it per use?</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="items">
      <div id="colA">
        <h2>Option A</h2>
        <div class="field"><label>Price</label><input type="number" id="pA" value="40" min="0" step="1"></div>
        <div class="field"><label>Expected uses</label><input type="number" id="uA" value="20" min="1" step="1"></div>
        <div class="field"><label>Resale value (optional)</label><input type="number" id="rA" value="0" min="0" step="1"></div>
        <div class="cpu"><div class="v" id="cpuA">—</div><div class="k">per use</div></div>
      </div>
      <div id="colB">
        <h2>Option B</h2>
        <div class="field"><label>Price</label><input type="number" id="pB" value="200" min="0" step="1"></div>
        <div class="field"><label>Expected uses</label><input type="number" id="uB" value="400" min="1" step="1"></div>
        <div class="field"><label>Resale value (optional)</label><input type="number" id="rB" value="40" min="0" step="1"></div>
        <div class="cpu"><div class="v" id="cpuB">—</div><div class="k">per use</div></div>
      </div>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <div class="verdict" id="verdict"></div>
  </div>
</main>
<footer>
  Cost per use = (price − resale) ÷ expected uses. A pricey item you'll use for years can beat a cheap one you'll toss. Estimates only. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/cost-per-use">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  // Net cost per use: (price − resale) / uses.
  function costPerUse(price, uses, resale = 0){
    const p = Number(price), u = Number(uses), r = Number(resale);
    if(![p, u, r].every(Number.isFinite)) throw new Error('enter numbers');
    if(p < 0 || r < 0) throw new Error('price and resale must be ≥ 0');
    if(u <= 0) throw new Error('uses must be > 0');
    return (p - r) / u;
  }

  // Cost per use spread over a usage rate and time.
  function costPerUseOverTime(price, usesPerYear, years, resale = 0){
    return costPerUse(price, Number(usesPerYear) * Number(years), resale);
  }

  // Compare two options → the one with the lower cost per use.
  function cheaperPerUse(a, b){
    const ca = costPerUse(a.price, a.uses, a.resale || 0);
    const cb = costPerUse(b.price, b.uses, b.resale || 0);
    return { a: ca, b: cb, winner: ca < cb ? 'a' : cb < ca ? 'b' : 'tie' };
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('cpuA')){
    const $ = id => document.getElementById(id);
    const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2);

    function render(){
      try{
        const a = { price: $('pA').value, uses: $('uA').value, resale: $('rA').value };
        const b = { price: $('pB').value, uses: $('uB').value, resale: $('rB').value };
        const cmp = cheaperPerUse(a, b);
        $('cpuA').textContent = money(cmp.a);
        $('cpuB').textContent = money(cmp.b);
        $('verdict').innerHTML = cmp.winner === 'tie'
          ? 'Both cost the same per use.'
          : `<b>Option ${cmp.winner.toUpperCase()}</b> is cheaper per use — ` +
            `${money(Math.min(cmp.a, cmp.b))} vs ${money(Math.max(cmp.a, cmp.b))} ` +
            `(${money(Math.abs(cmp.a - cmp.b))} less each time).`;
        $('err').textContent = '';
      }catch(e){ $('cpuA').textContent = '—'; $('cpuB').textContent = '—'; $('verdict').textContent = ''; $('err').textContent = e.message; }
    }
    [...document.querySelectorAll('input')].forEach(el => el.addEventListener('input', render));
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('cpu-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { costPerUse, costPerUseOverTime, cheaperPerUse };
</script>
</body>
</html>
