<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SemVer — Semantic Version Parser, Comparator & Bumper</title>
<meta name="description" content="Parse, compare, sort, and bump semantic version strings (semver 2.0.0). Prerelease-aware. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('semver-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#0284c7;
    --bg:#f5f6f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e3e6; --shadow:0 1px 3px rgba(0,0,0,.08); --ok:#16a34a; --bad:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#101318; --card:#191d24; --fg:#f0f1f4; --muted:#98a0aa; --line:#2a2f38; --shadow:0 1px 3px rgba(0,0,0,.5); --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:780px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#075985);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:780px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  h2{font-size:1rem;margin:0 0 12px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-family:"SF Mono",Menlo,Consolas,monospace}
  textarea{min-height:120px;resize:vertical}
  .parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:14px}
  .part{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .part span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .part b{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:1rem}
  .bumps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .bump{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
  .bump span{display:block;font-size:.72rem;color:var(--muted)}
  .bump b{font-family:"SF Mono",Menlo,Consolas,monospace}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.two{grid-template-columns:1fr}}
  .verdict{font-size:1.3rem;font-weight:800;text-align:center;margin-top:14px;font-family:"SF Mono",Menlo,Consolas,monospace}
  .err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1em}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;margin:12px 0 0}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:780px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏷️</div>
    <div><h1>SemVer</h1><div class="sub">Parse, compare, sort &amp; bump semantic versions</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <h2>Parse &amp; bump</h2>
    <label for="ver">Version</label>
    <input id="ver" value="1.2.3-alpha.1+build.9" spellcheck="false" autocapitalize="off">
    <div class="err" id="parseErr"></div>
    <div class="parts" id="parts"></div>
    <div class="bumps" id="bumps"></div>
  </div>

  <div class="card">
    <h2>Compare two versions</h2>
    <div class="two">
      <div><label for="a">A</label><input id="a" value="1.0.0-rc.1" spellcheck="false" autocapitalize="off"></div>
      <div><label for="b">B</label><input id="b" value="1.0.0" spellcheck="false" autocapitalize="off"></div>
    </div>
    <div class="verdict" id="verdict">—</div>
    <div class="err" id="cmpErr"></div>
  </div>

  <div class="card">
    <h2>Sort versions (one per line)</h2>
    <textarea id="list" spellcheck="false" autocapitalize="off">1.0.0
1.0.0-rc.1
1.0.0-beta.11
1.0.0-beta.2
1.0.0-alpha
2.0.0
1.9.0</textarea>
    <pre id="sorted"></pre>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/semver-tool">Source</a>.
</footer>

<script>
  // ---- pure logic (semver 2.0.0) ----
  function parse(v){
    const s = String(v).trim().replace(/^v/i, '');
    const m = s.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/);
    if(!m) throw new Error('invalid semver: ' + v);
    const [, maj, min, pat, pre, build] = m;
    for(const n of [maj, min, pat]) if(n.length > 1 && n[0] === '0') throw new Error('no leading zeros in version core: ' + v);
    const prerelease = pre ? pre.split('.') : [];
    for(const id of prerelease){
      if(id === '') throw new Error('empty prerelease identifier');
      if(/^\d+$/.test(id) && id.length > 1 && id[0] === '0') throw new Error('no leading zeros in prerelease: ' + id);
    }
    const buildmeta = build ? build.split('.') : [];
    return { major: +maj, minor: +min, patch: +pat, prerelease, build: buildmeta };
  }

  // precedence per spec; build metadata is ignored
  function compare(a, b){
    const pa = typeof a === 'string' ? parse(a) : a;
    const pb = typeof b === 'string' ? parse(b) : b;
    for(const k of ['major', 'minor', 'patch']){
      if(pa[k] !== pb[k]) return pa[k] < pb[k] ? -1 : 1;
    }
    const A = pa.prerelease, B = pb.prerelease;
    if(A.length === 0 && B.length === 0) return 0;
    if(A.length === 0) return 1;   // a release outranks a prerelease
    if(B.length === 0) return -1;
    const len = Math.min(A.length, B.length);
    for(let i = 0; i < len; i++){
      const x = A[i], y = B[i];
      const xn = /^\d+$/.test(x), yn = /^\d+$/.test(y);
      if(xn && yn){ const d = (+x) - (+y); if(d !== 0) return d < 0 ? -1 : 1; }
      else if(xn) return -1;       // numeric identifiers are lower than alphanumeric
      else if(yn) return 1;
      else if(x !== y) return x < y ? -1 : 1;
    }
    if(A.length !== B.length) return A.length < B.length ? -1 : 1;
    return 0;
  }

  function bump(v, type){
    const p = parse(v);
    switch(type){
      case 'major': return `${p.major + 1}.0.0`;
      case 'minor': return `${p.major}.${p.minor + 1}.0`;
      case 'patch': return `${p.major}.${p.minor}.${p.patch + 1}`;
      case 'prerelease': {
        if(p.prerelease.length === 0) return `${p.major}.${p.minor}.${p.patch + 1}-0`;
        const pre = p.prerelease.slice();
        const last = pre[pre.length - 1];
        if(/^\d+$/.test(last)) pre[pre.length - 1] = String(+last + 1);
        else pre.push('0');
        return `${p.major}.${p.minor}.${p.patch}-${pre.join('.')}`;
      }
      default: throw new Error('unknown bump type: ' + type);
    }
  }

  function format(p){
    let s = `${p.major}.${p.minor}.${p.patch}`;
    if(p.prerelease && p.prerelease.length) s += '-' + p.prerelease.join('.');
    if(p.build && p.build.length) s += '+' + p.build.join('.');
    return s;
  }

  function sortVersions(list){
    return list.slice().sort(compare);
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('parts')){
    const $ = id => document.getElementById(id);

    function renderParse(){
      let p;
      try{ p = parse($('ver').value); $('parseErr').textContent = ''; }
      catch(e){ $('parseErr').textContent = e.message; $('parts').innerHTML = ''; $('bumps').innerHTML = ''; return; }
      $('parts').innerHTML =
        `<div class="part"><span>major</span><b>${p.major}</b></div>` +
        `<div class="part"><span>minor</span><b>${p.minor}</b></div>` +
        `<div class="part"><span>patch</span><b>${p.patch}</b></div>` +
        `<div class="part"><span>prerelease</span><b>${p.prerelease.join('.') || '—'}</b></div>` +
        `<div class="part"><span>build</span><b>${p.build.join('.') || '—'}</b></div>`;
      const base = format({ major: p.major, minor: p.minor, patch: p.patch, prerelease: p.prerelease, build: [] });
      $('bumps').innerHTML = ['major', 'minor', 'patch', 'prerelease'].map(t =>
        `<div class="bump"><span>${t}</span><b>${bump(base, t)}</b></div>`).join('');
    }

    function renderCompare(){
      try{
        const r = compare($('a').value, $('b').value);
        $('verdict').textContent = r < 0 ? 'A < B' : r > 0 ? 'A > B' : 'A = B';
        $('cmpErr').textContent = '';
      }catch(e){ $('verdict').textContent = '—'; $('cmpErr').textContent = e.message; }
    }

    function renderSort(){
      const lines = $('list').value.split('\n').map(s => s.trim()).filter(Boolean);
      try{ $('sorted').textContent = sortVersions(lines).join('\n'); }
      catch(e){ $('sorted').textContent = e.message; }
    }

    $('ver').addEventListener('input', renderParse);
    $('a').addEventListener('input', renderCompare);
    $('b').addEventListener('input', renderCompare);
    $('list').addEventListener('input', renderSort);

    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('semver-theme', cur); }catch(e){}
    });

    renderParse(); renderCompare(); renderSort();
  }

  if(typeof module !== 'undefined') module.exports = { parse, compare, bump, format, sortVersions };
</script>
</body>
</html>
