<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaxCalc — Sales Tax &amp; VAT Calculator</title>
<meta name="description" content="Add sales tax or VAT to a price, or reverse-calculate the net and tax out of a gross total. 100% offline, no signup." />
<meta name="theme-color" content="#b45309" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="TaxCalc — Sales Tax & VAT Calculator" />
<meta property="og:description" content="Add tax to a net price or extract net + tax from a gross total. Offline." />
<meta property="og:url" content="https://awictor.github.io/tax-calc/" />
<link rel="canonical" href="https://awictor.github.io/tax-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b45309'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3E%25%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#faf5ee; --ink:#251a0b; --accent:#b45309; --accent-d:#92400e;
    --card:#fff; --line:#ecddc8; --muted:#77644a; --field:#fff;
    --shadow:0 1px 2px rgba(37,26,11,.05),0 8px 24px rgba(37,26,11,.07); }
  [data-theme="dark"]{ --bg:#150f06; --ink:#f4ece0; --accent:#f59e0b; --accent-d:#fbbf24;
    --card:#1e160b; --line:#332818; --muted:#a9947a; --field:#150f06;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
  .segbtn{flex:1;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
  .segbtn.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  .ig{position:relative}
  .ig .pre{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  input[type=number]{width:150px;padding:11px 12px 11px 24px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(180,83,9,.15)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;justify-content:flex-end}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .out .li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .out .li:last-child{border-bottom:0;font-weight:700;font-size:19px}
  .out .li b{color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("tax.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Tax</span>Calc</h1>
  <p>Add sales tax / VAT to a price, or pull the tax back out of a total. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="seg" id="modeSeg">
      <button class="segbtn on" data-m="add">Add tax (from net)</button>
      <button class="segbtn" data-m="remove">Remove tax (from gross)</button>
    </div>
    <div class="row"><label id="amtLabel">Net amount</label><div class="ig"><span class="pre cur">$</span><input id="amount" type="number" step="0.01" value="100"></div></div>
    <div class="row"><label>Tax rate</label><div class="ig"><span class="pre">%</span><input id="rate" type="number" step="0.1" value="20" style="padding-left:24px"></div></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="card out">
    <div class="li"><span>Net (excl. tax)</span><span id="net">—</span></div>
    <div class="li"><span>Tax</span><span id="tax">—</span></div>
    <div class="li"><span>Gross (incl. tax)</span><b id="gross">—</b></div>
  </section>
</div>

<footer>
  <b>TaxCalc</b> · offline sales tax &amp; VAT calculator · <a href="https://github.com/awictor/tax-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const money=n=>"$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// --- Pure tax math ---
function addTax(net,rate){ const tax=net*rate/100; return {net, tax, gross:net+tax}; }
function removeTax(gross,rate){ const net=gross/(1+rate/100); return {net, tax:gross-net, gross}; }

// --- UI ---
let MODE="add";
const RATES=[5,7,8.875,10,15,20,25];
function render(){
  const amt=num("amount"), rate=num("rate");
  try{localStorage.setItem("tax.amount",$("amount").value);localStorage.setItem("tax.rate",$("rate").value);localStorage.setItem("tax.mode",MODE);}catch(e){}
  const r = MODE==="add" ? addTax(amt,rate) : removeTax(amt,rate);
  $("net").textContent=money(r.net);
  $("tax").textContent=money(r.tax);
  $("gross").textContent=money(r.gross);
  $("amtLabel").textContent = MODE==="add" ? "Net amount" : "Gross amount";
  document.querySelectorAll("#chips .chip").forEach(c=>c.classList.toggle("on",+c.dataset.r===rate));
}
$("chips").innerHTML=RATES.map(r=>`<button class="chip" data-r="${r}">${r}%</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("rate").value=c.dataset.r;render();});
$("modeSeg").querySelectorAll(".segbtn").forEach(b=>b.onclick=()=>{MODE=b.dataset.m;$("modeSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x===b));render();});
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("tax.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const a=localStorage.getItem("tax.amount");if(a!=null)$("amount").value=a;const r=localStorage.getItem("tax.rate");if(r!=null)$("rate").value=r;const m=localStorage.getItem("tax.mode");if(m&&m!=="add"){$("modeSeg").querySelector('[data-m="'+m+'"]').click();}}catch(e){}
render();

if(typeof module!=="undefined") module.exports={addTax,removeTax};
</script>
</body>
</html>
