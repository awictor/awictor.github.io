<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PercentCalc — Percentage Calculator</title>
<meta name="description" content="Every everyday percentage in one place: X% of a number, X is what percent of Y, percentage change, and add or subtract a percent. 100% offline, no signup." />
<meta name="theme-color" content="#be185d" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="PercentCalc — Percentage Calculator" />
<meta property="og:description" content="X% of Y, X is what % of Y, percentage change, and add/subtract a percent. Offline." />
<meta property="og:url" content="https://awictor.github.io/percent-calc/" />
<link rel="canonical" href="https://awictor.github.io/percent-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23be185d'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3E%25%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fbf1f5; --ink:#280f1b; --accent:#be185d; --accent-d:#9d174d;
    --card:#fff; --line:#f0d9e2; --muted:#7a5464; --field:#fff;
    --shadow:0 1px 2px rgba(40,15,27,.05),0 8px 24px rgba(40,15,27,.07); }
  [data-theme="dark"]{ --bg:#160810; --ink:#f5e8ee; --accent:#f472b6; --accent-d:#f9a8d4;
    --card:#20111a; --line:#341f29; --muted:#a9869a; --field:#160810;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:640px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .q{font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .q input{width:82px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:16px;text-align:center;background:var(--field);color:var(--ink)}
  .q input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(190,24,93,.15)}
  .res{margin-top:12px;font-size:15px;color:var(--muted)}
  .res b{color:var(--accent);font-size:22px;font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("percent.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Percent</span>Calc</h1>
  <p>Every everyday percentage in one place. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="q">What is <input id="a1" type="number" value="20">% of <input id="a2" type="number" value="150">?</div>
    <div class="res" id="ar"></div>
  </section>
  <section class="card">
    <div class="q"><input id="b1" type="number" value="30"> is what % of <input id="b2" type="number" value="150">?</div>
    <div class="res" id="br"></div>
  </section>
  <section class="card">
    <div class="q">% change from <input id="c1" type="number" value="200"> to <input id="c2" type="number" value="250">?</div>
    <div class="res" id="cr"></div>
  </section>
  <section class="card">
    <div class="q"><input id="d1" type="number" value="100"> plus/minus <input id="d2" type="number" value="20">%</div>
    <div class="res" id="dr"></div>
  </section>
</div>

<footer>
  <b>PercentCalc</b> · offline percentage calculator · <a href="https://github.com/awictor/percent-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const round=(n,d)=>{const f=Math.pow(10,d==null?2:d);return Math.round(n*f)/f;};

// --- Pure percentage math ---
function percentOf(p,n){ return p/100*n; }
function whatPercent(x,y){ return y===0?null:x/y*100; }
function percentChange(from,to){ return from===0?null:(to-from)/from*100; }
function addPercent(n,p){ return n*(1+p/100); }
function subPercent(n,p){ return n*(1-p/100); }

// --- UI ---
function render(){
  try{["a1","a2","b1","b2","c1","c2","d1","d2"].forEach(k=>localStorage.setItem("percent."+k,$(k).value));}catch(e){}
  $("ar").innerHTML="= <b>"+round(percentOf(num("a1"),num("a2")))+"</b>";
  const wp=whatPercent(num("b1"),num("b2"));
  $("br").innerHTML= wp==null?"<b>—</b> (can't divide by zero)":"= <b>"+round(wp)+"%</b>";
  const pc=percentChange(num("c1"),num("c2"));
  $("cr").innerHTML= pc==null?"<b>—</b> (start value is zero)":"= <b>"+(pc>=0?"+":"")+round(pc)+"%</b> "+(pc>=0?"increase":"decrease");
  $("dr").innerHTML="+"+num("d2")+"% = <b>"+round(addPercent(num("d1"),num("d2")))+"</b> &nbsp;·&nbsp; −"+num("d2")+"% = <b>"+round(subPercent(num("d1"),num("d2")))+"</b>";
}
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("percent.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["a1","a2","b1","b2","c1","c2","d1","d2"].forEach(k=>{const v=localStorage.getItem("percent."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={percentOf,whatPercent,percentChange,addPercent,subPercent};
</script>
</body>
</html>
