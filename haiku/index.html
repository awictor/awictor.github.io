<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haiku — Syllable Counter & 5-7-5 Validator</title>
<meta name="description" content="Count syllables per line and check whether your poem is a valid 5-7-5 haiku, live as you type. 100% offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('haiku-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#db2777;
    --bg:#faf5f8; --card:#ffffff; --fg:#231a20; --muted:#6b5560; --line:#efe2ea; --shadow:0 1px 3px rgba(0,0,0,.08);
    --ok:#16a34a; --no:#db2777;
  }
  [data-theme="dark"]{
    --bg:#140d11; --card:#1e141a; --fg:#f6eef3; --muted:#a58b98; --line:#2e1f28; --shadow:0 1px 3px rgba(0,0,0,.5);
    --ok:#4ade80; --no:#f472b6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:680px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#9d174d);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:680px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.05rem;resize:vertical;line-height:1.7}
  .lines{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .ln{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .num{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;color:#fff}
  .num.hit{background:var(--ok)}
  .num.miss{background:var(--no)}
  .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .want{color:var(--muted);font-size:.85rem;white-space:nowrap}
  .verdict{text-align:center;font-size:1.3rem;font-weight:800;margin-top:6px}
  .verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
  .stats{color:var(--muted);font-size:.85rem;text-align:center;margin-top:6px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:680px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🌸</div>
    <div><h1>Haiku</h1><div class="sub">Syllable counter &amp; 5-7-5 checker</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="poem">Your poem (one line per row)</label>
    <textarea id="poem" spellcheck="false">An old silent pond
A frog jumps into the pond
splash Silence again</textarea>
    <div class="lines" id="lines"></div>
    <div class="verdict" id="verdict"></div>
    <div class="stats" id="stats"></div>
  </div>
</main>
<footer>
  Syllables via an English heuristic (vowel-group counting) — great for haiku, approximate for tricky words. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/haiku">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  // Heuristic English syllable count for a single word.
  function syllables(word){
    word = String(word).toLowerCase().replace(/[^a-z]/g, '');
    if(!word) return 0;
    if(word.length <= 3) return 1;
    word = word.replace(/(?:[^laeiouy]es|[^laeiouy]e)$/, '').replace(/^y/, '');
    const groups = word.match(/[aeiouy]{1,2}/g);
    return groups ? groups.length : 1;
  }

  // Syllables across a line (sum over whitespace-separated words).
  function lineSyllables(line){
    return String(line).trim().split(/\s+/).filter(Boolean)
      .reduce((sum, w) => sum + syllables(w), 0);
  }

  function wordCount(text){
    const t = String(text).trim();
    return t ? t.split(/\s+/).filter(Boolean).length : 0;
  }

  // Split into non-empty lines, count each, compare to 5-7-5.
  function analyze(text){
    const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    const counts = lines.map(lineSyllables);
    const target = [5, 7, 5];
    const valid = counts.length === 3 && counts.every((c, i) => c === target[i]);
    return { lines, counts, target, valid };
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('poem')){
    const $ = id => document.getElementById(id);
    const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

    function render(){
      const a = analyze($('poem').value);
      const target = [5, 7, 5];
      $('lines').innerHTML = a.lines.map((line, i) => {
        const c = a.counts[i];
        const want = target[i];
        const hit = want !== undefined && c === want;
        return `<div class="ln">
          <div class="num ${hit ? 'hit' : 'miss'}">${c}</div>
          <div class="txt">${esc(line) || '&nbsp;'}</div>
          <div class="want">${want !== undefined ? 'want ' + want : 'extra line'}</div>
        </div>`;
      }).join('') || '<div class="stats">Type a poem above.</div>';

      $('verdict').className = 'verdict ' + (a.valid ? 'ok' : 'no');
      $('verdict').textContent = a.lines.length === 0 ? '' : (a.valid ? '✓ Valid haiku' : '✗ Not 5-7-5 yet');
      const totalSyl = a.counts.reduce((s, c) => s + c, 0);
      $('stats').textContent = `${a.lines.length} line(s) · ${wordCount($('poem').value)} words · ${totalSyl} syllables`;
    }

    $('poem').addEventListener('input', render);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('haiku-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { syllables, lineSyllables, wordCount, analyze };
</script>
</body>
</html>
