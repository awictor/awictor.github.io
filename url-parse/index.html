<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URLParse — URL Inspector &amp; Query Parameter Viewer</title>
<meta name="description" content="Break a URL into its parts — protocol, host, port, path, query parameters, and hash — instantly. 100% offline, no signup." />
<meta name="theme-color" content="#1e40af" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="URLParse — URL Inspector" />
<meta property="og:description" content="Break a URL into protocol, host, path, query params, and hash. Offline." />
<meta property="og:url" content="https://awictor.github.io/url-parse/" />
<link rel="canonical" href="https://awictor.github.io/url-parse/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e40af'/%3E%3Cpath d='M26 38 a8 8 0 0 1 0-12 l4-4 a8 8 0 0 1 12 12 l-2 2 M38 26 a8 8 0 0 1 0 12 l-4 4 a8 8 0 0 1-12-12 l2-2' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eff3fc; --ink:#0c1430; --accent:#1e40af; --accent-d:#1e3a8a;
    --card:#fff; --line:#d8e0f4; --muted:#54608a; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(12,20,48,.05),0 8px 24px rgba(12,20,48,.07); }
  [data-theme="dark"]{ --bg:#080c1a; --ink:#e8ecfb; --accent:#60a5fa; --accent-d:#93c5fd;
    --card:#111830; --line:#232f52; --muted:#8b96c0; --bad:#f0685c; --field:#080c1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:640px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  #url{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);word-break:break-all}
  #url:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,64,175,.15)}
  #url.bad{border-color:var(--bad)}
  .err{color:var(--bad);font-weight:600;font-size:13px;min-height:16px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
  td:first-child{color:var(--muted);white-space:nowrap;width:120px}
  td.v{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--ink)}
  tr:first-child td{border-top:0}
  .params td:first-child{color:var(--accent);font-family:ui-monospace,monospace;font-weight:600}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("urlparse.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">URL</span>Parse</h1>
  <p>Break a URL into its parts and query parameters. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <input id="url" spellcheck="false" autocomplete="off" value="https://user:pass@example.com:8080/path/to/page?q=hello+world&lang=en#section">
    <div class="err" id="err"></div>
  </section>
  <section class="card"><h2>Parts</h2><table><tbody id="parts"></tbody></table></section>
  <section class="card" id="paramsCard"><h2>Query parameters</h2><table class="params"><tbody id="params"></tbody></table></section>
</div>

<footer>
  <b>URLParse</b> · offline URL inspector · <a href="https://github.com/awictor/url-parse">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Uses the browser's native URL parser. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure URL parsing ---
function parseUrl(str){
  try{
    const u=new URL(String(str).trim());
    return {error:null, protocol:u.protocol, username:u.username, password:u.password, hostname:u.hostname,
      port:u.port, pathname:u.pathname, search:u.search, hash:u.hash, origin:u.origin,
      params:[...u.searchParams.entries()]};
  }catch(e){ return {error:e.message}; }
}

// --- UI ---
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function render(){
  const r=parseUrl($("url").value);
  try{localStorage.setItem("urlparse.url",$("url").value);}catch(e){}
  if(r.error){ $("url").classList.add("bad"); $("err").textContent="Invalid URL — include a scheme like https://"; $("parts").innerHTML=""; $("params").innerHTML=""; $("paramsCard").style.display="none"; return; }
  $("url").classList.remove("bad"); $("err").textContent="";
  const rows=[["Protocol",r.protocol],["Username",r.username],["Password",r.password],["Host",r.hostname],["Port",r.port||"(default)"],["Path",r.pathname],["Query",r.search||"(none)"],["Hash",r.hash||"(none)"],["Origin",r.origin]];
  $("parts").innerHTML=rows.filter(([,v])=>v!=="").map(([k,v])=>`<tr><td>${k}</td><td class="v">${esc(v)}</td></tr>`).join("");
  if(r.params.length){ $("paramsCard").style.display=""; $("params").innerHTML=r.params.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="v">${esc(v)}</td></tr>`).join(""); }
  else { $("paramsCard").style.display="none"; }
}
$("url").addEventListener("input",render);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("urlparse.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const u=localStorage.getItem("urlparse.url");if(u!=null)$("url").value=u;}catch(e){}
render();

if(typeof module!=="undefined") module.exports={parseUrl};
</script>
</body>
</html>
