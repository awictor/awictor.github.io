<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowGen — CSS box-shadow generator</title>
<meta name="description" content="Free offline CSS box-shadow generator. Stack multiple shadow layers, toggle inset, tune offset/blur/spread/color, and copy ready-to-paste CSS with a live preview. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/shadow-gen/">
<style>
  :root{
    --c:#4c1d95; --bg:#faf8fd; --fg:#1b1330; --muted:#645a7e;
    --card:#ffffff; --border:#e7e1f2; --code:#efeafa; --stage:#f1f0f6;
  }
  [data-theme="dark"]{
    --bg:#120f1d; --fg:#e9e5f4; --muted:#9990b4; --card:#1b1630;
    --border:#2e2748; --code:#241d3c; --stage:#0c0a15;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#8b5cf6);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:820px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  .stage{background:var(--stage);border-radius:14px;height:200px;display:grid;place-items:center;margin-bottom:20px}
  .box{width:120px;height:120px;border-radius:16px;background:var(--card)}
  .layer{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .layer .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .layer .top b{font-size:.85rem}
  .layer .rm{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1.1rem}
  .layer .rm:hover{color:#dc2626;border-color:#dc2626}
  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sl label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:3px}
  .sl input[type=range]{width:100%;accent-color:var(--c)}
  .sl .rowv{display:flex;align-items:center;gap:8px}
  .sl .rowv span{font-family:ui-monospace,monospace;font-size:.78rem;width:46px;text-align:right}
  .chk{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;cursor:pointer}
  .add{background:var(--code);border:1px dashed var(--border);color:var(--c);border-radius:10px;
    padding:9px;cursor:pointer;font-size:.86rem;font-weight:600;width:100%}
  .out-head{display:flex;align-items:center;margin-top:16px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  pre{background:var(--code);border-radius:12px;padding:14px 16px;margin:8px 0 0;overflow-x:auto;
    font-family:ui-monospace,monospace;font-size:.9rem;white-space:pre-wrap;word-break:break-all}
  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('shadow.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">▨</div>
  <div>
    <h1>ShadowGen</h1>
    <p class="sub">CSS box-shadow generator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="stage"><div class="box" id="box"></div></div>
    <div id="layers"></div>
    <button class="add" id="add">+ Add shadow layer</button>
    <div class="out-head">
      <label style="margin:0;font-weight:600;font-size:.85rem">CSS</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <pre id="css"></pre>
  </div>
</main>
<footer>
  ShadowGen is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/shadow-gen">Source</a>
</footer>

<script>
// ---- pure functions ----
function px(v){ v = Number(v); if(!isFinite(v)) v = 0; return v + 'px'; }
function shadowLayer(l){
  l = l || {};
  var parts = [];
  if(l.inset) parts.push('inset');
  parts.push(px(l.x), px(l.y), px(l.blur), px(l.spread));
  parts.push(l.color || 'rgba(0,0,0,0.2)');
  return parts.join(' ');
}
function boxShadow(layers){
  if(!layers || layers.length === 0) return 'none';
  return layers.map(shadowLayer).join(', ');
}
function withProperty(css){ return 'box-shadow: ' + css + ';'; }

if(typeof module !== 'undefined') module.exports = { px, shadowLayer, boxShadow, withProperty };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var state = [
    { x:0, y:10, blur:20, spread:-4, color:'#4c1d95', inset:false }
  ];
  var layersEl = document.getElementById('layers');
  var boxEl = document.getElementById('box');
  var cssEl = document.getElementById('css');
  var FIELDS = [['x','X offset',-100,100],['y','Y offset',-100,100],['blur','Blur',0,150],['spread','Spread',-50,50]];

  function renderLayers(){
    layersEl.innerHTML = '';
    state.forEach(function(l, i){
      var d = document.createElement('div');
      d.className = 'layer';
      var sliders = FIELDS.map(function(f){
        return '<div class="sl"><label>'+f[1]+'</label><div class="rowv">' +
          '<input type="range" data-i="'+i+'" data-k="'+f[0]+'" min="'+f[2]+'" max="'+f[3]+'" value="'+l[f[0]]+'">' +
          '<span>'+l[f[0]]+'px</span></div></div>';
      }).join('');
      d.innerHTML =
        '<div class="top"><b>Layer '+(i+1)+'</b>' +
        '<label class="chk"><input type="checkbox" data-i="'+i+'" data-k="inset" '+(l.inset?'checked':'')+'> inset</label>' +
        '<input type="color" data-i="'+i+'" data-k="color" value="'+l.color+'" style="width:38px;height:32px;border:1px solid var(--border);border-radius:8px;background:none">' +
        '<button class="rm" data-i="'+i+'" title="Remove">&times;</button></div>' +
        '<div class="sliders">'+sliders+'</div>';
      layersEl.appendChild(d);
    });
  }
  function render(){
    var css = boxShadow(state);
    boxEl.style.boxShadow = css;
    cssEl.textContent = withProperty(css);
    try{ localStorage.setItem('shadow.state', JSON.stringify(state)); }catch(e){}
  }
  layersEl.addEventListener('input', function(e){
    var t = e.target, i = +t.getAttribute('data-i'), k = t.getAttribute('data-k');
    if(k === 'inset') state[i].inset = t.checked;
    else if(k === 'color') state[i].color = t.value;
    else { state[i][k] = Number(t.value);
      var span = t.parentNode.querySelector('span'); if(span) span.textContent = t.value + 'px'; }
    render();
  });
  layersEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.rm') : null;
    if(!b) return;
    var i = +b.getAttribute('data-i');
    if(state.length > 1){ state.splice(i, 1); renderLayers(); render(); }
  });
  document.getElementById('add').addEventListener('click', function(){
    state.push({ x:0, y:6, blur:12, spread:0, color:'#000000', inset:false });
    renderLayers(); render();
  });
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(cssEl.textContent);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var saved = JSON.parse(localStorage.getItem('shadow.state'));
    if(saved && saved.length) state = saved;
  }catch(e){}
  renderLayers();
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('shadow.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('shadow.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
