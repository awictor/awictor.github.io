<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Perigon — draw a perfect circle</title>
<style>
  :root{
    --bg:#0c0f14; --panel:#141a22; --ink:#e8edf4; --dim:#7d8aa0;
    --accent:#4de1c1; --line:#243040; --warm:#ff7a59; --cool:#5aa9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"SF Pro Text",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;left:0;right:0;pointer-events:none;z-index:5}
  #top{top:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-size:20px;letter-spacing:.14em;font-weight:700}
  .brand span{font-size:12px;color:var(--dim);letter-spacing:.02em}
  #modes{display:flex;gap:8px;pointer-events:auto}
  .chip{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;
    background:rgba(20,26,34,.5);backdrop-filter:blur(6px);transition:.18s}
  .chip.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
  .chip:hover{color:var(--ink)}
  #hint{bottom:0;padding:0 0 26px;text-align:center;font-size:13px;color:var(--dim);
    transition:opacity .4s}
  #hint b{color:var(--accent);font-weight:600}
  #spark{position:fixed;right:22px;bottom:20px;z-index:5;text-align:right;color:var(--dim);font-size:11px}
  #spark svg{display:block;margin-top:4px}
  /* result card */
  #card{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(6,9,13,.72);backdrop-filter:blur(3px)}
  #card.show{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel{width:min(420px,92vw);background:linear-gradient(180deg,#161d27,#10151d);
    border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.55);pointer-events:auto}
  .grade{font-size:15px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
  .score{font-size:88px;font-weight:800;line-height:1;margin:6px 0 2px;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .gtag{display:inline-block;font-size:30px;font-weight:800;padding:2px 14px;border-radius:12px;
    color:var(--bg);margin-bottom:14px}
  .stats{display:flex;gap:10px;margin:16px 0 20px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
  .stat b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  .msg{font-size:13px;color:var(--dim);margin-bottom:18px;min-height:18px}
  .msg b{color:var(--accent)}
  .row{display:flex;gap:10px}
  .btn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:14px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;transition:.16s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--bg)}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;
    border-radius:999px;opacity:0;transition:.3s;z-index:30;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div class="hud" id="top">
  <div class="brand"><b>PERIGON</b><span id="sub">one stroke. how round are you?</span></div>
  <div id="modes">
    <div class="chip on" id="mFree">Free</div>
    <div class="chip" id="mDaily">Daily</div>
    <div class="chip on" id="mMute" title="Toggle sound &amp; haptics">♪ Sound</div>
  </div>
</div>
<div class="hud" id="hint">Press and drag one continuous <b>circle</b>, then release.</div>
<div id="spark"></div>

<div id="card"><div class="panel">
  <div class="grade" id="cGrade">ROUNDNESS</div>
  <div class="score" id="cScore">0</div>
  <div class="gtag" id="cTag">–</div>
  <div class="stats">
    <div class="stat"><b id="sClose">–</b><span>closure</span></div>
    <div class="stat"><b id="sSweep">–</b><span>coverage</span></div>
    <div class="stat"><b id="sSteady">–</b><span>steadiness</span></div>
  </div>
  <div class="msg" id="cMsg"></div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn" id="bSave">Save PNG</button>
    <button class="btn" id="bShare">Copy link</button>
  </div>
  <div class="row"><button class="btn primary" id="bAgain">Draw again ↺</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const DPR=Math.min(window.devicePixelRatio||1,2.5);
let W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  if(mode==="daily"&&dailyTarget){dailyTarget.cx=W/2;dailyTarget.cy=H/2;} // recenter target on resize/rotate (keep seeded r)
  draw();}
addEventListener("resize",resize);

// ---------- persistence ----------
const LS="perigon.v1";
let store=load();
function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}
store.hist=store.hist||[];                     // free-mode recent scores
store.best=store.best||0;                      // free-mode best
store.bestPath=store.bestPath||null;           // normalized best stroke for replay
store.streak=store.streak||0;
store.lastDay=store.lastDay||null;
store.muted=store.muted||false;                // sound + haptics off toggle

// ---------- daily seed ----------
function today(){return Math.floor(Date.now()/86400000);} // UTC day index: consecutive days differ by exactly 1
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
let mode="free";
let dailyTarget=null;   // {cx,cy,r} start dot + target ring for daily

// ---------- audio ----------
let AC=null,osc=null,gain=null;
function audioOn(){
  if(store.muted)return;
  if(AC){if(AC.state==="suspended")AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    osc=AC.createOscillator();gain=AC.createGain();
    osc.type="sine";osc.frequency.value=220;gain.gain.value=0;
    osc.connect(gain);gain.connect(AC.destination);osc.start();
    if(AC.state==="suspended")AC.resume();}catch(e){AC=null;} // Safari/iOS often start suspended even in a gesture
}
function tone(freq,vol){if(!osc||store.muted)return;const t=AC.currentTime;
  osc.frequency.setTargetAtTime(freq,t,.03);gain.gain.setTargetAtTime(vol,t,.05);}
function toneOff(){if(gain)gain.gain.setTargetAtTime(0,AC.currentTime,.08);}
function chord(good){ // resolve on reveal
  if(!AC||store.muted)return;const base=good?392:196, r=good?[1,1.26,1.5]:[1,1.19];
  r.forEach((m,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";
    o.frequency.value=base*m;o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime+i*.06;g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
    o.start(t);o.stop(t+1);});
}

// ---------- stroke state ----------
let pts=[], drawing=false, wobble=0, result=null;
let racing=false, raceTimer=0;
function reset(){pts=[];result=null;draw();}

function down(e){
  if($("card").classList.contains("show"))return;
  // if a ghost-race is animating, cancel it and give a fresh canvas so we don't clobber this stroke mid-way
  if(racing){racing=false;clearTimeout(raceTimer);cancelAnimationFrame(raceReq);reset();}
  audioOn();
  drawing=true;pts=[];wobble=0;
  $("hint").style.opacity=0;
  addPt(e);
}
function move(e){
  if(!drawing)return;
  const p=addPt(e);
  if(p&&pts.length>2){
    // live steadiness from turn-angle jitter -> tone pitch
    const a=pts[pts.length-3],b=pts[pts.length-2],c=p;
    const ang=Math.abs(turn(a,b,c));
    wobble=wobble*.8+ang*.2;
    tone(300+ (1-Math.min(wobble/0.6,1))*260, .06);
  }
  draw();
}
function up(){
  if(!drawing)return;drawing=false;toneOff();
  finish();
}
function addPt(e){
  const t=e.touches?e.touches[0]:e;
  if(!t)return null;
  const x=t.clientX,y=t.clientY,now=performance.now();
  const last=pts[pts.length-1];
  if(last){const dx=x-last.x,dy=y-last.y;if(dx*dx+dy*dy<9)return null;}
  const p={x,y,t:now};pts.push(p);return p;
}
function turn(a,b,c){ // signed angle change b->c vs a->b
  const a1=Math.atan2(b.y-a.y,b.x-a.x),a2=Math.atan2(c.y-b.y,c.x-b.x);
  let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;
}
cv.addEventListener("mousedown",down);addEventListener("mousemove",move);addEventListener("mouseup",up);
cv.addEventListener("touchstart",e=>{e.preventDefault();down(e)},{passive:false});
cv.addEventListener("touchmove",e=>{e.preventDefault();move(e)},{passive:false});
cv.addEventListener("touchend",e=>{e.preventDefault();up()},{passive:false});

// ---------- circle fit + scoring ----------
function analyze(P){
  if(P.length<8)return {invalid:"Too short — draw a full loop."};
  let cx=0,cy=0;for(const p of P){cx+=p.x;cy+=p.y;}cx/=P.length;cy/=P.length;
  const rs=P.map(p=>Math.hypot(p.x-cx,p.y-cy));
  const mr=rs.reduce((a,b)=>a+b,0)/rs.length;
  if(mr<40)return {invalid:"Too small — draw a bigger circle."};
  // angular coverage: sum absolute swept angle around centroid
  let sweep=0;for(let i=1;i<P.length;i++){
    const a=Math.atan2(P[i-1].y-cy,P[i-1].x-cx),b=Math.atan2(P[i].y-cy,P[i].x-cx);
    let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;sweep+=Math.abs(d);
  }
  const cover=Math.min(sweep/(2*Math.PI),1);
  if(cover<0.7)return {invalid:"Not a full circle — sweep all the way around."};
  // radial deviation
  let vsum=0;for(const r of rs)vsum+=(r-mr)*(r-mr);
  const sd=Math.sqrt(vsum/rs.length);
  let round=100*(1-sd/mr);
  // closure penalty (start/end gap relative to radius)
  const gap=Math.hypot(P[0].x-P[P.length-1].x,P[0].y-P[P.length-1].y);
  const closure=Math.max(0,1-gap/(mr*1.4));
  round*=(0.6+0.4*closure);           // closure worth up to 40%
  round*=(0.85+0.15*cover);           // small nudge for full coverage
  // daily mode: you must actually trace the target ring, so blend in how well
  // the fitted circle matches the target's center + radius (worth up to 45%)
  let matchPct=null;
  if(mode==="daily"&&dailyTarget){
    const posErr=Math.hypot(cx-dailyTarget.cx,cy-dailyTarget.cy);
    const radErr=Math.abs(mr-dailyTarget.r);
    const posMatch=Math.max(0,1-posErr/(dailyTarget.r*0.8));
    const radMatch=Math.max(0,1-radErr/(dailyTarget.r*0.6));
    const match=(posMatch+radMatch)/2;
    round*=(0.55+0.45*match);
    matchPct=Math.round(match*100);
  }
  round=Math.max(0,Math.min(100,round));
  // steadiness from mean turn jitter
  let jit=0,n=0;for(let i=2;i<P.length;i++){jit+=Math.abs(turn(P[i-2],P[i-1],P[i]));n++;}
  const steady=Math.max(0,Math.min(100,100-(n?jit/n:0)*140));
  // deviation rose: bin residuals by angle (72 bins), smoothed
  const B=72,bins=new Array(B).fill(0),cnt=new Array(B).fill(0);
  for(let i=0;i<P.length;i++){
    let a=Math.atan2(P[i].y-cy,P[i].x-cx);if(a<0)a+=2*Math.PI;
    const k=Math.min(B-1,Math.floor(a/(2*Math.PI)*B));
    bins[k]+=(rs[i]-mr);cnt[k]++;
  }
  const rose=new Array(B);
  for(let k=0;k<B;k++)rose[k]=cnt[k]?bins[k]/cnt[k]:NaN;
  // fill gaps + smooth
  for(let k=0;k<B;k++)if(isNaN(rose[k])){let a=k,b=k;while(isNaN(rose[(a+B)%B]))a--;while(isNaN(rose[b%B]))b++;rose[k]=(rose[(a+B)%B]+rose[b%B])/2;}
  const sm=rose.map((_,k)=>(rose[(k-1+B)%B]+rose[k]+rose[(k+1)%B])/3);
  return {cx,cy,r:mr,score:Math.round(round),closure:Math.round(closure*100),
    cover:Math.round(cover*100),steady:Math.round(steady),match:matchPct,rose:sm,path:P};
}
function grade(s){return s>=97?"S":s>=90?"A":s>=80?"B":s>=68?"C":s>=50?"D":"F";}
function gradeColor(g){return {S:"#ffd166",A:"#4de1c1",B:"#5aa9ff",C:"#c58cff",D:"#ff9f66",F:"#ff6b6b"}[g];}

function finish(){
  const r=analyze(pts);
  if(r.invalid){$("hint").style.opacity=1;$("hint").innerHTML=r.invalid+" <b>Try again.</b>";
    pts=[];draw();return;}
  result=r;
  // store best + normalized path for replay
  if(mode==="free"){
    store.hist.push(r.score);if(store.hist.length>30)store.hist.shift();
    if(r.score>store.best){store.best=r.score;store.bestPath=normPath(r);}
    else if(!store.bestPath)store.bestPath=normPath(r);
    save();
  }
  // haptic
  if(navigator.vibrate&&!store.muted)navigator.vibrate(r.score>=90?[10,40,20]:20);
  draw();
  showCard(r);
}
function normPath(r){ // store as unit offsets from centroid + radius for replay/ghost
  return {r:r.r,pts:r.path.map(p=>({x:(p.x-r.cx),y:(p.y-r.cy)}))};
}

// ---------- rendering ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  // subtle vignette grid dot
  if(dailyTarget){
    ctx.save();ctx.setLineDash([4,8]);ctx.strokeStyle="rgba(125,138,160,.35)";
    ctx.beginPath();ctx.arc(dailyTarget.cx,dailyTarget.cy,dailyTarget.r,0,7);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle="#4de1c1";
    ctx.beginPath();ctx.arc(dailyTarget.cx,dailyTarget.cy-dailyTarget.r,6,0,7);ctx.fill();
    ctx.restore();
  }
  // personal-best ghost ring (faint reference)
  if(store.bestPath&&!result){drawGhostRing();}
  // live / final stroke
  if(pts.length>1){
    ctx.lineWidth=result?2.5:3.5;ctx.lineJoin="round";ctx.lineCap="round";
    ctx.strokeStyle=result?"rgba(232,237,244,.35)":"#e8edf4";
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  }
  if(result)drawResult(result);
}
function drawGhostRing(){
  // center best path on screen center as a faint reference ring
  const bp=store.bestPath,cx=W/2,cy=H/2;
  ctx.save();ctx.strokeStyle="rgba(77,225,193,.16)";ctx.lineWidth=2;ctx.setLineDash([3,6]);
  ctx.beginPath();bp.pts.forEach((p,i)=>i?ctx.lineTo(cx+p.x,cy+p.y):ctx.moveTo(cx+p.x,cy+p.y));
  ctx.stroke();ctx.restore();
}
function drawResult(r){
  // fitted true circle
  ctx.save();ctx.strokeStyle="rgba(125,138,160,.5)";ctx.lineWidth=1.5;ctx.setLineDash([2,5]);
  ctx.beginPath();ctx.arc(r.cx,r.cy,r.r,0,7);ctx.stroke();ctx.setLineDash([]);
  // deviation rose band
  const B=r.rose.length,amp=6;         // visual scale
  const maxDev=Math.max(4,...r.rose.map(Math.abs));
  for(let k=0;k<B;k++){
    const a0=k/B*2*Math.PI,a1=(k+1)/B*2*Math.PI;
    const dev=r.rose[k], t=Math.max(-1,Math.min(1,dev/maxDev));
    const ro=r.r + t*amp*3;             // push band in/out by error
    const col=t>=0?`rgba(255,122,89,${.25+.6*Math.abs(t)})`:`rgba(90,169,255,${.25+.6*Math.abs(t)})`;
    ctx.strokeStyle=col;ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(r.cx,r.cy,ro,a0,a1+.02);ctx.stroke();
  }
  // centroid
  ctx.fillStyle="rgba(232,237,244,.6)";ctx.beginPath();ctx.arc(r.cx,r.cy,3,0,7);ctx.fill();
  ctx.restore();
}

// ---------- ghost replay race ----------
let raceReq=0;
function raceGhost(){
  if(!store.bestPath)return;
  cancelAnimationFrame(raceReq);
  const bp=store.bestPath;
  // align ghost to the just-drawn stroke's centroid+radius so it "races" over it
  const anchor=result?{cx:result.cx,cy:result.cy,scale:result.r/bp.r}:{cx:W/2,cy:H/2,scale:1};
  const start=performance.now(),dur=1400;
  (function step(t){
    const k=Math.min(1,(t-start)/dur), n=Math.floor(k*bp.pts.length);
    draw();
    ctx.save();ctx.strokeStyle="rgba(77,225,193,.9)";ctx.lineWidth=2.5;ctx.lineCap="round";
    ctx.beginPath();
    for(let i=0;i<=n&&i<bp.pts.length;i++){
      const x=anchor.cx+bp.pts[i].x*anchor.scale,y=anchor.cy+bp.pts[i].y*anchor.scale;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
    if(n<bp.pts.length){const p=bp.pts[Math.min(n,bp.pts.length-1)];
      ctx.fillStyle="#4de1c1";ctx.beginPath();
      ctx.arc(anchor.cx+p.x*anchor.scale,anchor.cy+p.y*anchor.scale,5,0,7);ctx.fill();}
    ctx.restore();
    if(k<1)raceReq=requestAnimationFrame(step);
  })(start);
}

// ---------- result card ----------
function showCard(r){
  const g=grade(r.score),gc=gradeColor(g);
  $("cGrade").textContent=mode==="daily"?"DAILY ROUNDNESS":"ROUNDNESS";
  $("cTag").textContent=g;$("cTag").style.background=gc;
  $("cScore").style.color=gc;
  $("sClose").textContent=r.closure+"%";
  $("sSweep").textContent=r.cover+"%";
  $("sSteady").textContent=r.steady+"%";
  // message vs best / target
  let msg;
  if(mode==="daily"){bumpStreak();msg=`Day streak: <b>${store.streak}</b> · target trace accuracy <b>${r.match==null?"–":r.match+"%"}</b>`;}
  else if(r.score>=store.best&&store.hist.length>1)msg=`New personal best! Previous <b>${store.hist.slice(0,-1).reduce((a,b)=>Math.max(a,b),0)}</b>.`;
  else msg=`Personal best <b>${store.best}</b>. Chase the ghost ↺`;
  $("cMsg").innerHTML=msg;
  $("card").classList.add("show");
  chord(r.score>=80);
  // animated count-up gauge
  const el=$("cScore");let v=0;const target=r.score,t0=performance.now();
  (function tick(t){const k=Math.min(1,(t-t0)/900);v=Math.round(target*(1-Math.pow(1-k,3)));
    el.textContent=v;if(k<1)requestAnimationFrame(tick);})(t0);
  renderSpark();
}
function bumpStreak(){const d=today();
  if(store.lastDay===d)return;
  store.streak=(store.lastDay===d-1)?store.streak+1:1;store.lastDay=d;save();}

$("bAgain").onclick=()=>{
  $("card").classList.remove("show");
  // race the ghost over the fresh attempt, then clear for next stroke.
  // `racing` gates input so a stroke started during the race isn't wiped by the reset below.
  racing=true;
  raceGhost();
  raceTimer=setTimeout(()=>{
    if(!racing)return;            // a new stroke already took over
    racing=false;reset();$("hint").style.opacity=1;
    $("hint").innerHTML=mode==="daily"
      ?`Trace today's target: start at the <b>dot</b>, one clean loop.`
      :'Press and drag one continuous <b>circle</b>, then release.';},1500);
};

// ---------- share: URL hash + PNG ----------
function shareLink(){
  const g=grade(result.score);
  const payload=btoa(JSON.stringify({s:result.score,g,m:mode,t:store.streak}));
  // location.href survives file:// (location.origin is the string "null" there)
  const url=location.href.split("#")[0]+"#c="+encodeURIComponent(payload);
  const ok=()=>toast(`Link copied — bet they can't beat ${result.score}!`);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok,()=>legacyCopy(url,ok));
  }else legacyCopy(url,ok);
}
function legacyCopy(url,ok){ // file:// / insecure contexts have no async clipboard
  try{const ta=document.createElement("textarea");ta.value=url;
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const done=document.execCommand("copy");document.body.removeChild(ta);
    if(done)ok();else prompt("Copy this link:",url);
  }catch(e){prompt("Copy this link:",url);}
}
$("bShare").onclick=shareLink;

function exportPNG(){
  const r=result,S=760,c=document.createElement("canvas");c.width=c.height=S;
  const x=c.getContext("2d");
  x.fillStyle="#0c0f14";x.fillRect(0,0,S,S);
  const cx=S/2,cy=S/2+30,R=210;
  // fitted circle
  x.strokeStyle="rgba(125,138,160,.5)";x.lineWidth=2;x.setLineDash([3,6]);
  x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();x.setLineDash([]);
  // rose (reuse residual shape)
  const B=r.rose.length,maxDev=Math.max(4,...r.rose.map(Math.abs));
  for(let k=0;k<B;k++){const a0=k/B*2*Math.PI,a1=(k+1)/B*2*Math.PI;
    const t=Math.max(-1,Math.min(1,r.rose[k]/maxDev)),ro=R+t*26;
    x.strokeStyle=t>=0?`rgba(255,122,89,${.3+.6*Math.abs(t)})`:`rgba(90,169,255,${.3+.6*Math.abs(t)})`;
    x.lineWidth=9;x.beginPath();x.arc(cx,cy,ro,a0,a1+.02);x.stroke();}
  // player stroke scaled onto card
  x.strokeStyle="rgba(232,237,244,.6)";x.lineWidth=2.5;x.lineJoin="round";
  x.beginPath();r.path.forEach((p,i)=>{const px=cx+(p.x-r.cx)/r.r*R,py=cy+(p.y-r.cy)/r.r*R;
    i?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();
  // header
  x.textAlign="center";x.fillStyle="#e8edf4";x.font="700 34px sans-serif";
  x.fillText("PERIGON",cx,64);
  x.fillStyle="#7d8aa0";x.font="15px sans-serif";
  x.fillText("how round is your hand?",cx,88);
  // gauge text
  const g=grade(r.score),gc=gradeColor(g);
  x.fillStyle=gc;x.font="800 132px sans-serif";x.fillText(r.score,cx,cy+46);
  x.font="800 40px sans-serif";x.fillText(g,cx,cy+96);
  x.fillStyle="#7d8aa0";x.font="14px sans-serif";
  x.fillText(`closure ${r.closure}%   ·   coverage ${r.cover}%   ·   steady ${r.steady}%`,cx,S-40);
  const a=document.createElement("a");a.download=`perigon-${r.score}.png`;
  a.href=c.toDataURL("image/png");a.click();
  toast("Saved PNG card");
}
$("bSave").onclick=exportPNG;

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),1800);}

// ---------- sparkline ----------
function renderSpark(){
  const h=store.hist;if(!h.length){$("spark").innerHTML="";return;}
  const w=120,ht=32,mx=Math.max(...h,100),mn=Math.min(...h,0),rng=Math.max(1,mx-mn);
  const step=w/Math.max(1,h.length-1);
  let d=h.map((v,i)=>`${i*step},${ht-(v-mn)/rng*ht}`).join(" ");
  $("spark").innerHTML=`best ${store.best} · last ${h.length}
    <svg width="${w}" height="${ht}"><polyline fill="none" stroke="#4de1c1"
    stroke-width="1.5" points="${d}"/></svg>`;
}

// ---------- modes ----------
function setMode(m){
  mode=m;$("mFree").classList.toggle("on",m==="free");$("mDaily").classList.toggle("on",m==="daily");
  if(m==="daily"){
    const R=rng(today());const r=140+Math.floor(R()*120);
    dailyTarget={cx:W/2,cy:H/2,r};
    $("sub").textContent="daily challenge — match the target ring";
    $("hint").innerHTML=`Trace today's target: start at the <b>dot</b>, one clean loop.`;
  }else{dailyTarget=null;$("sub").textContent="one stroke. how round are you?";
    $("hint").innerHTML='Press and drag one continuous <b>circle</b>, then release.';}
  reset();$("hint").style.opacity=1;renderSpark();
}
$("mFree").onclick=()=>setMode("free");
$("mDaily").onclick=()=>setMode("daily");

// ---------- sound / haptics toggle ----------
function renderMute(){$("mMute").textContent=store.muted?"♪ Muted":"♪ Sound";
  $("mMute").classList.toggle("on",!store.muted);}
$("mMute").onclick=()=>{store.muted=!store.muted;if(store.muted)toneOff();save();renderMute();};

// ---------- shared-link target ----------
function readHash(){
  const m=location.hash.match(/c=([^&]+)/);if(!m)return;
  try{const d=JSON.parse(atob(decodeURIComponent(m[1])));
    $("sub").textContent=`challenge: beat ${d.s} (${d.g}) — your move`;
    $("hint").innerHTML=`A friend scored <b>${d.s}</b> (${d.g}). Draw to beat it.`;
  }catch(e){}
}

// ---------- boot ----------
resize();readHash();renderSpark();renderMute();
})();
</script>
