<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextShadowGen — CSS text-shadow generator</title>
<meta name="description" content="Free offline CSS text-shadow generator. Stack multiple shadow layers with a live text preview, then copy the CSS. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/text-shadow-gen/">
<style>
  :root{
    --c:#6d28d9; --bg:#faf8fd; --fg:#1b1030; --muted:#655880;
    --card:#ffffff; --border:#e8e0f2; --code:#f1eafa; --stage:#f1f0f6;
  }
  [data-theme="dark"]{
    --bg:#120b1e; --fg:#ebe5f5; --muted:#9a90b6; --card:#1b142c;
    --border:#2e2646; --code:#241d3a; --stage:#0c0a15;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#a855f7);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:820px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  .stage{background:var(--stage);border-radius:14px;min-height:150px;display:grid;place-items:center;margin-bottom:18px;padding:20px}
  .preview{font-size:3rem;font-weight:800;color:var(--fg)}
  .toprow{display:flex;gap:12px;margin-bottom:14px}
  .toprow input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font-size:.95rem}
  .layer{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .layer .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .layer .top b{font-size:.85rem}
  .layer .rm{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1.1rem}
  .layer .rm:hover{color:#dc2626;border-color:#dc2626}
  .sliders{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:520px){.sliders{grid-template-columns:1fr}}
  .sl label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:3px}
  .sl input[type=range]{width:100%;accent-color:var(--c)}
  .sl .v{font-family:ui-monospace,monospace;font-size:.78rem}
  .add{background:var(--code);border:1px dashed var(--border);color:var(--c);border-radius:10px;padding:9px;cursor:pointer;font-size:.86rem;font-weight:600;width:100%}
  .out-head{display:flex;align-items:center;margin-top:16px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  pre{background:var(--code);border-radius:12px;padding:14px 16px;margin:8px 0 0;overflow-x:auto;font-family:ui-monospace,monospace;font-size:.9rem;white-space:pre-wrap;word-break:break-all}
  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('tsh.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">A̲</div>
  <div>
    <h1>TextShadowGen</h1>
    <p class="sub">CSS text-shadow generator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="stage"><div class="preview" id="preview">Shadow</div></div>
    <div class="toprow">
      <input id="text" value="Shadow" spellcheck="false" placeholder="Preview text">
    </div>
    <div id="layers"></div>
    <button class="add" id="add">+ Add shadow layer</button>
    <div class="out-head">
      <label style="margin:0;font-weight:600;font-size:.85rem">CSS</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <pre id="css"></pre>
  </div>
</main>
<footer>
  TextShadowGen is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/text-shadow-gen">Source</a>
</footer>

<script>
// ---- pure functions ----
function px(v){ v = Number(v); if(!isFinite(v)) v = 0; return v + 'px'; }
function textShadowLayer(l){
  l = l || {};
  return [px(l.x), px(l.y), px(l.blur), l.color || 'rgba(0,0,0,0.3)'].join(' ');
}
function textShadow(layers){
  if(!layers || layers.length === 0) return 'none';
  return layers.map(textShadowLayer).join(', ');
}
function withProperty(css){ return 'text-shadow: ' + css + ';'; }

if(typeof module !== 'undefined') module.exports = { px, textShadowLayer, textShadow, withProperty };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var state = [ { x: 2, y: 2, blur: 4, color: '#6d28d9' } ];
  var layersEl = document.getElementById('layers');
  var previewEl = document.getElementById('preview');
  var cssEl = document.getElementById('css');
  var textEl = document.getElementById('text');
  var FIELDS = [['x','X',-50,50],['y','Y',-50,50],['blur','Blur',0,50]];

  function renderLayers(){
    layersEl.innerHTML = '';
    state.forEach(function(l, i){
      var d = document.createElement('div');
      d.className = 'layer';
      var sliders = FIELDS.map(function(f){
        return '<div class="sl"><label>' + f[1] + ' <span class="v">' + l[f[0]] + 'px</span></label>' +
          '<input type="range" data-i="' + i + '" data-k="' + f[0] + '" min="' + f[2] + '" max="' + f[3] + '" value="' + l[f[0]] + '"></div>';
      }).join('');
      d.innerHTML = '<div class="top"><b>Layer ' + (i + 1) + '</b>' +
        '<input type="color" data-i="' + i + '" data-k="color" value="' + l.color + '" style="width:38px;height:32px;border:1px solid var(--border);border-radius:8px;background:none">' +
        '<button class="rm" data-i="' + i + '" title="Remove">&times;</button></div>' +
        '<div class="sliders">' + sliders + '</div>';
      layersEl.appendChild(d);
    });
  }
  function render(){
    var css = textShadow(state);
    previewEl.style.textShadow = css === 'none' ? '' : css;
    cssEl.textContent = withProperty(css);
    try{ localStorage.setItem('tsh.state', JSON.stringify(state)); localStorage.setItem('tsh.text', textEl.value); }catch(e){}
  }
  layersEl.addEventListener('input', function(e){
    var t = e.target, i = +t.getAttribute('data-i'), k = t.getAttribute('data-k');
    if(k === 'color') state[i].color = t.value;
    else { state[i][k] = Number(t.value); var span = t.parentNode.querySelector('.v'); if(span) span.textContent = t.value + 'px'; }
    render();
  });
  layersEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.rm') : null;
    if(!b) return;
    if(state.length > 1){ state.splice(+b.getAttribute('data-i'), 1); renderLayers(); render(); }
  });
  document.getElementById('add').addEventListener('click', function(){
    state.push({ x: -2, y: -2, blur: 6, color: '#000000' }); renderLayers(); render();
  });
  textEl.addEventListener('input', function(){ previewEl.textContent = textEl.value || 'Shadow'; render(); });
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(cssEl.textContent);
    this.textContent = 'Copied'; var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var s = JSON.parse(localStorage.getItem('tsh.state')); if(s && s.length) state = s;
    var tx = localStorage.getItem('tsh.text'); if(tx !== null){ textEl.value = tx; previewEl.textContent = tx || 'Shadow'; }
  }catch(e){}
  renderLayers();
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('tsh.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('tsh.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
