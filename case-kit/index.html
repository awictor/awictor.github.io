<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CaseKit — camelCase, snake_case, kebab &amp; Slug Converter</title>
<meta name="description" content="Convert text between camelCase, PascalCase, snake_case, kebab-case, CONSTANT_CASE, Title Case, Sentence case, and URL slug. 100% offline, no signup." />
<meta name="theme-color" content="#65a30d" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="CaseKit — Text Case Converter" />
<meta property="og:description" content="camelCase, snake_case, kebab-case, CONSTANT_CASE, Title Case, and URL slug — convert instantly. Offline." />
<meta property="og:url" content="https://awictor.github.io/case-kit/" />
<link rel="canonical" href="https://awictor.github.io/case-kit/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2365a30d'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3EaA%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f6faef; --ink:#1a2410; --accent:#65a30d; --accent-d:#4d7c0f;
    --card:#fff; --line:#e3edd2; --muted:#5f6f4b; --field:#fff;
    --shadow:0 1px 2px rgba(26,36,16,.05),0 8px 24px rgba(26,36,16,.07); }
  [data-theme="dark"]{ --bg:#0e1407; --ink:#eef4e4; --accent:#a3e635; --accent-d:#bef264;
    --card:#161f0c; --line:#2a3618; --muted:#93a577; --field:#0e1407;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  #input{width:100%;min-height:80px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:var(--field);color:var(--ink);resize:vertical;font-family:inherit}
  #input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(101,163,13,.15)}
  .out{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .out:last-child{border-bottom:0}
  .out .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .out .v{flex:1;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;word-break:break-all;cursor:pointer}
  .out .v:hover{color:var(--accent)}
  #msg{font-size:12px;color:var(--muted);text-align:center;min-height:16px;margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("casekit.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Case</span>Kit</h1>
  <p>Convert text between camelCase, snake_case, kebab-case, and more. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Your text</h2>
    <textarea id="input" spellcheck="false" placeholder="Type or paste any text, e.g. &quot;Hello World example_test&quot;">Hello World example_test</textarea>
  </section>
  <section class="card">
    <h2>Conversions <span style="text-transform:none;font-weight:400;color:var(--muted)">— click a value to copy</span></h2>
    <div id="outputs"></div>
    <div id="msg"></div>
  </section>
</div>

<footer>
  <b>CaseKit</b> · offline text case converter · <a href="https://github.com/awictor/case-kit">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure case conversions ---
// Split text into lowercase word tokens, honoring camelCase humps and any separators.
function tokens(s){
  return String(s)
    .replace(/([a-z0-9])([A-Z])/g,"$1 $2")
    .replace(/([A-Z]+)([A-Z][a-z])/g,"$1 $2")
    .split(/[^A-Za-z0-9]+/)
    .filter(Boolean)
    .map(w=>w.toLowerCase());
}
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
function toCamel(s){ const t=tokens(s); return t.map((w,i)=>i?cap(w):w).join(""); }
function toPascal(s){ return tokens(s).map(cap).join(""); }
function toSnake(s){ return tokens(s).join("_"); }
function toKebab(s){ return tokens(s).join("-"); }
function toConstant(s){ return tokens(s).join("_").toUpperCase(); }
function toDot(s){ return tokens(s).join("."); }
function toTitle(s){ return tokens(s).map(cap).join(" "); }
function toSentence(s){ const t=tokens(s); return t.length? cap(t.join(" ")) : ""; }
function toSlug(s){ return tokens(s).join("-"); }

const CASES=[
  ["camelCase",toCamel],["PascalCase",toPascal],["snake_case",toSnake],
  ["kebab-case",toKebab],["CONSTANT_CASE",toConstant],["dot.case",toDot],
  ["Title Case",toTitle],["Sentence case",toSentence],["url-slug",toSlug]
];

// --- UI ---
function render(){
  const s=$("input").value;
  try{localStorage.setItem("casekit.input",s);}catch(e){}
  $("outputs").innerHTML=CASES.map(([label,fn])=>{
    const v=fn(s);
    return `<div class="out"><span class="k">${label}</span><span class="v" data-v="${v.replace(/"/g,"&quot;")}">${v||"—"}</span></div>`;
  }).join("");
  $("outputs").querySelectorAll(".v").forEach(el=>el.onclick=()=>{const v=el.dataset.v;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1200);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();});
}
$("input").addEventListener("input",render);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("casekit.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const s=localStorage.getItem("casekit.input");if(s!=null)$("input").value=s;}catch(e){}
render();

if(typeof module!=="undefined") module.exports={tokens,toCamel,toPascal,toSnake,toKebab,toConstant,toDot,toTitle,toSentence,toSlug};
</script>
</body>
</html>
