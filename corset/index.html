<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corset — a live constraint-writing studio</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --fg:#e6edf3; --dim:#8b98a5;
    --line:#2a323c; --acc:#ff7a3d; --acc2:#ffb07a; --good:#3fb950; --bad:#f85149;
    --mark:rgba(248,81,73,.32); --markb:rgba(248,81,73,.7);
  }
  [data-theme="light"]{
    --bg:#f5f3ef; --panel:#fffdf9; --panel2:#f0ece3; --fg:#232f3e; --dim:#6b7280;
    --line:#e2ddd2; --acc:#ff6100; --acc2:#d9540a; --good:#1a7f37; --bad:#c1352b;
    --mark:rgba(193,53,43,.22); --markb:rgba(193,53,43,.55);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  h1 b{color:var(--acc)}
  .tag{color:var(--dim);font-size:12.5px;flex:1;min-width:180px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,select,input,label.chk{font:inherit}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
  .btn.acc:hover{background:var(--acc2);color:#fff}
  .btn:focus-visible,.chk input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:12.5px;cursor:pointer}
  main{display:grid;grid-template-columns:1fr 320px;gap:18px;padding:18px 20px;max-width:1200px;margin:0 auto}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  #challenge{display:none;margin:0 20px;padding:10px 14px;border:1px solid var(--acc);border-radius:9px;background:var(--panel);align-items:center;gap:14px;flex-wrap:wrap}
  #challenge.on{display:flex}
  #challenge .ct{font-weight:600;color:var(--acc)}
  #challenge .stat{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
  #challenge .won{color:var(--good);font-weight:600}
  .editor{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
  #backdrop,#text{font:16px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px;margin:0;border:0;width:100%;height:360px;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;letter-spacing:0}
  #backdrop{position:absolute;inset:0;overflow:auto;color:transparent;pointer-events:none;z-index:1}
  #text{position:relative;z-index:2;background:transparent;color:var(--fg);resize:none;outline:none;caret-color:var(--acc);overflow:auto}
  #text::placeholder{color:var(--dim)}
  mark{color:transparent;background:var(--mark);border-radius:3px;box-shadow:0 0 0 1px var(--markb) inset}
  .readout{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .alpha{display:flex;flex-wrap:wrap;gap:4px}
  .alpha span{width:22px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:var(--panel2);color:var(--dim);font:600 12px ui-monospace,monospace;border:1px solid var(--line);transition:.2s}
  .alpha span.on{background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(-1px)}
  .alpha span.miss{animation:pulse 1s ease-in-out infinite;border-color:var(--acc)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,61,.0)}50%{box-shadow:0 0 0 4px rgba(255,122,61,.28)}}
  .meterwrap{display:flex;align-items:center;gap:12px}
  .meter{flex:1;height:14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--good);transition:width .35s ease,background-color .35s ease}
  .pct{font:600 15px ui-monospace,monospace;min-width:44px;text-align:right}
  .badge{padding:4px 10px;border-radius:20px;font:700 11px system-ui;letter-spacing:1px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);transition:.25s}
  .badge.clean{background:var(--good);color:#fff;border-color:var(--good);animation:pop .4s}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  .counts{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  aside h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
  .card{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel);overflow:hidden}
  .card .top{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 12px;cursor:pointer;color:var(--fg)}
  .card .top:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none;transition:.2s}
  .card.on .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
  .card.on .dot.fail{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .card .nm{font-weight:600;flex:1}
  .card .st{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .card .body{display:none;padding:12px;border-top:1px solid var(--line)}
  .card.on .body{display:block}
  .card .desc{color:var(--dim);font-size:12px;margin:0;padding:0 12px 11px 34px}
  .card .msg{font-size:12.5px;padding:6px 9px;border-radius:6px;background:var(--panel2)}
  .card.on .msg{color:var(--good)} .card.on.fail .msg{color:var(--bad)}
  .prm{display:flex;align-items:center;gap:7px;margin:8px 0 2px;font-size:12.5px;color:var(--dim)}
  .prm input,.prm select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 7px;width:auto}
  .prm input{width:70px;text-transform:uppercase}
  .prm input.one{width:40px;text-align:center}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:80vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1><b>Corset</b></h1>
  <div class="tag">Compose under Oulipo-style rules — every constraint polices you live.</div>
  <div class="tools">
    <label class="chk" title="Include your current text in the shared link, or share just the constraints as a challenge"><input type="checkbox" id="baketxt" checked> share text</label>
    <button class="btn" id="share">Share link</button>
    <button class="btn" id="rand">Random challenge</button>
    <button class="btn" id="copy">Copy</button>
    <button class="btn" id="export">.txt</button>
    <button class="btn" id="theme" aria-label="Toggle theme" title="Toggle light / dark theme">◐</button>
  </div>
</header>

<div id="challenge" role="status">
  <span class="ct">🎯 Challenge</span>
  <span class="stat" id="chTime">00:00</span>
  <span class="stat" id="chEdits">0 edits</span>
  <span id="chWon"></span>
  <button class="btn" id="chExit" title="Exit challenge mode" style="margin-left:auto">Exit</button>
</div>

<main>
  <section>
    <div class="editor">
      <div id="backdrop" aria-hidden="true"></div>
      <textarea id="text" spellcheck="false" aria-label="Constrained writing field"
        placeholder="Start writing. Flip on constraint cards → and watch them police every letter."></textarea>
    </div>
    <div class="readout">
      <div class="alpha" id="alpha" aria-label="Alphabet coverage"></div>
      <div class="meterwrap">
        <div class="meter"><i id="fill"></i></div>
        <span class="pct" id="pct">100%</span>
        <span class="badge" id="badge">IDLE</span>
      </div>
      <div class="counts" id="counts">0 words · 0 letters</div>
    </div>
  </section>

  <aside>
    <h2>Constraint rack</h2>
    <div id="rack"></div>
  </aside>
</main>

<div id="live" class="sr" aria-live="polite"></div>
<div id="toast" role="alert"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const ta=$("#text"), backdrop=$("#backdrop"), rack=$("#rack"),
      live=$("#live"), toastEl=$("#toast"), chBar=$("#challenge");

/* ---------- constraint registry: each fn(text,card)->{ok,message,spans} ---------- */
const AZ="abcdefghijklmnopqrstuvwxyz".split("");
const ASC="bdfghijklpqty";            // prisoner-forbidden (ascenders/descenders + dotted)
const words=t=>{const re=/[A-Za-z]+/g,o=[];let m;while((m=re.exec(t)))o.push({w:m[0],i:m.index});return o;};
const rev=s=>s.split("").reverse().join("");

const REG={
  lipogram:{name:"Lipogram",desc:"Forbid one letter everywhere.",param:{type:"one",def:"e"},
    fn(t,c){const L=(c.param||"e").toLowerCase(),sp=[];for(let i=0;i<t.length;i++)if(t[i].toLowerCase()===L)sp.push([i,i+1]);
      return{ok:sp.length===0,spans:sp,message:sp.length?`“${L}” appears ${sp.length}×`:`clean of “${L}”`};}},
  univocalic:{name:"Univocalic",desc:"Only one vowel is allowed.",param:{type:"sel",opts:["a","e","i","o","u"],def:"e"},
    fn(t,c){const V=(c.param||"e").toLowerCase(),sp=[];for(let i=0;i<t.length;i++){const ch=t[i].toLowerCase();if("aeiou".includes(ch)&&ch!==V)sp.push([i,i+1]);}
      return{ok:sp.length===0,spans:sp,message:sp.length?`${sp.length} stray vowel${sp.length>1?"s":""} (only “${V}” allowed)`:`only “${V}” — perfect`};}},
  tautogram:{name:"Tautogram",desc:"Every word starts with the same letter (blank = auto).",param:{type:"one",def:""},
    fn(t,c){const ws=words(t);if(!ws.length)return{ok:true,spans:[],message:"no words yet"};
      const tgt=(c.param||ws[0].w[0]).toLowerCase(),sp=[];let bad=0;
      for(const{w,i}of ws)if(w[0].toLowerCase()!==tgt){sp.push([i,i+w.length]);bad++;}
      return{ok:bad===0,spans:sp,message:bad?`${bad} word${bad>1?"s":""} not starting “${tgt}”`:`all words start “${tgt}”`};}},
  snowball:{name:"Snowball",desc:"Each word strictly longer than the last.",param:null,
    fn(t){const ws=words(t),sp=[];let first=0;
      for(let k=1;k<ws.length;k++)if(ws[k].w.length<=ws[k-1].w.length){sp.push([ws[k].i,ws[k].i+ws[k].w.length]);if(!first)first=k+1;}
      return{ok:sp.length===0,spans:sp,message:sp.length?`word ${first} breaks the snowball`:`${ws.length} words, ever-growing`};}},
  pangram:{name:"Pangram",desc:"Use all 26 letters at least once.",param:null,
    fn(t){const used=new Set(t.toLowerCase().replace(/[^a-z]/g,""));const miss=AZ.filter(l=>!used.has(l));
      return{ok:miss.length===0,spans:[],message:miss.length?`missing: ${miss.join(", ")}`:`all 26 letters used`};}},
  acrostic:{name:"Acrostic",desc:"Line initials must spell a target word.",param:{type:"word",def:"HELLO"},
    fn(t,c){const tgt=(c.param||"").toUpperCase().replace(/[^A-Z]/g,"");if(!tgt)return{ok:true,spans:[],message:"set a target word"};
      const lines=t.split("\n"),offs=[];let o=0;for(const ln of lines){offs.push(o);o+=ln.length+1;}
      const sp=[];let bad=0,missing=0;
      for(let i=0;i<tgt.length;i++){const ln=lines[i];const m=ln!==undefined?/[A-Za-z]/.exec(ln):null;
        if(!m){missing++;continue;}
        if(ln[m.index].toUpperCase()!==tgt[i]){sp.push([offs[i]+m.index,offs[i]+m.index+1]);bad++;}}
      const msg=missing?`need ${missing} more line${missing>1?"s":""} for “${tgt}”`:bad?`${bad} line${bad>1?"s":""} start wrong`:`spells “${tgt}”`;
      return{ok:bad===0&&missing===0,spans:sp,message:msg};}},
  palindrome:{name:"Palindrome words",desc:"Every word reads the same both ways.",param:null,
    fn(t){const ws=words(t),sp=[];let bad=0;for(const{w,i}of ws){const l=w.toLowerCase();if(l!==rev(l)){sp.push([i,i+w.length]);bad++;}}
      return{ok:bad===0,spans:sp,message:bad?`${bad} non-palindrome word${bad>1?"s":""}`:`${ws.length} palindromes`};}},
  prisoner:{name:"Prisoner’s",desc:"No ascenders/descenders (b d f g h i j k l p q t y).",param:null,
    fn(t){const sp=[];for(let i=0;i<t.length;i++)if(ASC.includes(t[i].toLowerCase()))sp.push([i,i+1]);
      return{ok:sp.length===0,spans:sp,message:sp.length?`${sp.length} tall/low letter${sp.length>1?"s":""}`:`flat & tidy`};}},
};
const ORDER=Object.keys(REG);

/* ---------- state ---------- */
const state={cards:{}};
for(const id of ORDER)state.cards[id]={on:false,param:REG[id].param?REG[id].param.def:""};
const challenge={active:false,started:0,edits:0,solved:false,tick:0};

/* ---------- compatibility guard ---------- */
function conflict(cards){
  const on=x=>cards[x].on, L=cards.lipogram,U=cards.univocalic,A=cards.acrostic,T=cards.tautogram;
  if(on("lipogram")&&on("univocalic")&&(L.param||"e").toLowerCase()===(U.param||"e").toLowerCase())
    return `Lipogram forbids “${L.param}” but Univocalic needs it — no vowels left.`;
  if(on("univocalic")&&on("prisoner")&&ASC.includes((U.param||"e").toLowerCase()))
    return `Univocalic vowel “${U.param}” is banned by the Prisoner’s constraint.`;
  if(on("acrostic")){
    const tgt=(A.param||"").toUpperCase().replace(/[^A-Z]/g,"");
    if(on("lipogram")&&tgt.includes((L.param||"e").toUpperCase()))
      return `Acrostic target “${tgt}” uses forbidden letter “${L.param}”.`;
    if(on("univocalic")){const b=[...tgt].find(c=>"AEIOU".includes(c)&&c!==(U.param||"e").toUpperCase());
      if(b)return `Acrostic needs vowel “${b}” but Univocalic only allows “${U.param}”.`;}
    if(on("prisoner")){const b=[...tgt].find(c=>ASC.includes(c.toLowerCase()));
      if(b)return `Acrostic letter “${b}” breaks the Prisoner’s constraint.`;}
    if(on("tautogram")&&T.param){const tp=T.param.toUpperCase();if([...tgt].some(c=>c!==tp))
      return `Tautogram fixes initials to “${T.param}”, incompatible with acrostic “${tgt}”.`;}
  }
  return null;
}

/* ---------- highlight overlay ---------- */
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escAttr(s){return esc(String(s)).replace(/"/g,"&quot;");}
function merge(spans){
  if(!spans.length)return spans;
  spans.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const out=[spans[0].slice()];
  for(let k=1;k<spans.length;k++){const s=spans[k],last=out[out.length-1];
    if(s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else out.push(s.slice());}
  return out;
}
function paint(text,spans){
  spans=merge(spans);let html="",i=0;
  for(const[s,e]of spans){html+=esc(text.slice(i,s))+"<mark>"+esc(text.slice(s,e))+"</mark>";i=e;}
  html+=esc(text.slice(i))+"\n";
  backdrop.innerHTML=html;
}

/* ---------- render helpers ---------- */
function buildRack(){
  rack.innerHTML="";
  for(const id of ORDER){
    const c=state.cards[id],r=REG[id];
    const card=document.createElement("div");card.className="card";card.dataset.id=id;
    const top=document.createElement("button");top.className="top";top.setAttribute("aria-pressed","false");
    top.innerHTML=`<span class="dot"></span><span class="nm">${r.name}</span><span class="st">off</span>`;
    top.onclick=()=>toggle(id);
    const desc=document.createElement("div");desc.className="desc";desc.textContent=r.desc;
    const body=document.createElement("div");body.className="body";
    let prm="";
    if(r.param){
      if(r.param.type==="sel")prm=`<label class="prm">vowel <select data-p="${id}">${r.param.opts.map(o=>`<option${o===c.param?" selected":""}>${escAttr(o)}</option>`).join("")}</select></label>`;
      else if(r.param.type==="word")prm=`<label class="prm">target <input data-p="${id}" value="${escAttr(c.param)}" maxlength="12"></label>`;
      else prm=`<label class="prm">letter <input class="one" data-p="${id}" value="${escAttr(c.param)}" maxlength="1" placeholder="—"></label>`;
    }
    body.innerHTML=`${prm}<div class="msg"></div>`;
    card.appendChild(top);card.appendChild(desc);card.appendChild(body);rack.appendChild(card);
  }
  rack.querySelectorAll("[data-p]").forEach(el=>{
    const id=el.dataset.p;
    el.addEventListener("input",()=>{state.cards[id].param=el.value;
      if(state.cards[id].on){const m=conflict(state.cards);if(m){state.cards[id].on=false;toast(m);syncCards();}}
      compute();saveLocal();});
    el.addEventListener("click",e=>e.stopPropagation());
  });
  syncCards();
}
function toggle(id){
  const c=state.cards[id];
  if(!c.on){c.on=true;const m=conflict(state.cards);if(m){c.on=false;toast(m);return;}}
  else c.on=false;
  syncCards();compute();saveLocal();
}
function syncCards(){
  for(const id of ORDER){
    const card=rack.querySelector(`.card[data-id="${id}"]`),c=state.cards[id];
    card.classList.toggle("on",c.on);
    card.querySelector(".top").setAttribute("aria-pressed",c.on);
    card.querySelector(".st").textContent=c.on?"on":"off";
  }
}
function renderAlpha(text,pangramOn){
  const used=new Set(text.toLowerCase().replace(/[^a-z]/g,""));
  const box=$("#alpha");
  if(!box.children.length)AZ.forEach(l=>{const s=document.createElement("span");s.textContent=l.toUpperCase();box.appendChild(s);});
  AZ.forEach((l,k)=>{const s=box.children[k],u=used.has(l);
    s.classList.toggle("on",u);s.classList.toggle("miss",pangramOn&&!u);});
}

/* ---------- main compute loop ---------- */
function compute(){
  const text=ta.value;
  let spans=[],active=0,pass=0,top=null,pangramOn=false;
  for(const id of ORDER){
    const c=state.cards[id],card=rack.querySelector(`.card[data-id="${id}"]`);
    if(!c.on){continue;}
    if(id==="pangram")pangramOn=true;
    active++;
    const r=REG[id].fn(text,c);
    if(r.ok)pass++;else if(!top)top=REG[id].name+" — "+r.message;
    if(r.spans.length)spans.push(...r.spans);
    card.classList.toggle("fail",!r.ok);
    card.querySelector(".dot").classList.toggle("fail",!r.ok);
    card.querySelector(".msg").textContent=r.message;
  }
  paint(text,spans);
  renderAlpha(text,pangramOn);
  const purity=active?Math.round(100*pass/active):100;
  const letters=(text.match(/[A-Za-z]/g)||[]).length;
  const fill=$("#fill");
  fill.style.width=purity+"%";
  fill.style.backgroundColor=`hsl(${Math.round(purity*1.2)} 68% 45%)`;
  $("#pct").textContent=purity+"%";
  const clean=active>0&&pass===active&&letters>0;
  const badge=$("#badge");
  badge.className="badge"+(clean?" clean":"");
  badge.textContent=active===0?"IDLE":clean?"CLEAN":"BOUND";
  $("#counts").textContent=`${(text.match(/\S+/g)||[]).length} words · ${letters} letters · ${text.length} chars`;
  live.textContent=active===0?"":clean?"All constraints satisfied.":("Top issue — "+top);
  updateChallenge(clean,active);
}

/* ---------- challenge mode ---------- */
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function startChallenge(){
  challenge.active=true;challenge.started=0;challenge.edits=0;challenge.solved=false;
  chBar.classList.add("on");$("#chWon").textContent="";$("#chTime").textContent="00:00";$("#chEdits").textContent="0 edits";
  clearInterval(challenge.tick);
  challenge.tick=setInterval(()=>{if(challenge.started&&!challenge.solved)$("#chTime").textContent=fmt(Date.now()-challenge.started);},500);
}
function endChallenge(){
  challenge.active=false;challenge.solved=false;challenge.started=0;
  clearInterval(challenge.tick);
  chBar.classList.remove("on");
  if(location.hash.length>1)history.replaceState(null,"",location.pathname+location.search);
}
function updateChallenge(clean,active){
  if(!challenge.active)return;
  if(clean&&!challenge.solved){
    challenge.solved=true;
    const t=challenge.started?fmt(Date.now()-challenge.started):"00:00";
    $("#chWon").innerHTML=`<span class="won">✔ Solved in ${t} · ${challenge.edits} edits</span>`;
    toast("Corset satisfied — challenge solved!");
  }
}
function onEdit(){
  if(challenge.active&&!challenge.solved){if(!challenge.started)challenge.started=Date.now();challenge.edits++;$("#chEdits").textContent=challenge.edits+" edits";}
  compute();saveLocal();
}

/* ---------- local persistence ---------- */
const LS_KEY="corset:v1";
let saveTimer;
function saveLocal(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{const c={};for(const id of ORDER)c[id]={on:state.cards[id].on,param:state.cards[id].param};
      localStorage.setItem(LS_KEY,JSON.stringify({t:ta.value,cards:c,theme:document.documentElement.dataset.theme}));}catch(e){}
  },250);
}
function readLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(e){return null;}}
function restoreLocal(){
  const o=readLocal();if(!o)return false;
  if(o.cards)for(const id of ORDER)if(o.cards[id]){state.cards[id].on=!!o.cards[id].on;if(o.cards[id].param!==undefined)state.cards[id].param=o.cards[id].param;}
  if(typeof o.t==="string")ta.value=o.t;
  return true;
}

/* ---------- share / URL hash ---------- */
function enc(o){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o))));}
function dec(s){return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));}
function copyText(text){
  try{const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.left="-9999px";
    document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();return ok;}catch(e){return false;}
}
function share(){
  const c={};for(const id of ORDER)if(state.cards[id].on)c[id]=state.cards[id].param||"";
  const baked=$("#baketxt").checked;
  const obj={c,t:baked?ta.value:""};
  const url=location.href.split("#")[0]+"#"+enc(obj);
  const done=()=>toast(baked?"Link copied — piece baked in":"Link copied — bare challenge");
  const fallback=()=>{if(copyText(url))done();else{location.hash=enc(obj);toast("Link is in the address bar — copy it");}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,fallback);
  else fallback();
}
function load(){
  if(location.hash.length<2)return false;
  try{
    const o=dec(location.hash.slice(1));
    for(const id of ORDER)state.cards[id].on=false;
    for(const id in o.c||{})if(state.cards[id]){state.cards[id].on=true;if(o.c[id]!=="")state.cards[id].param=o.c[id];}
    ta.value=o.t||"";
    buildRack();
    const challengeMode=(!o.t||!o.t.length)&&Object.keys(o.c||{}).length>0;
    if(challengeMode)startChallenge();
    return true;
  }catch(e){toast("Couldn't read that challenge link");return false;}
}

/* ---------- random solvable challenge ---------- */
function randChallenge(){
  const pool=[
    ()=>({id:"lipogram",p:"z"}),()=>({id:"lipogram",p:"e"}),()=>({id:"lipogram",p:"t"}),
    ()=>({id:"univocalic",p:["a","e","o","u"][Math.floor(Math.random()*4)]}),
    ()=>({id:"tautogram",p:"sctpbm"[Math.floor(Math.random()*6)]}),
    ()=>({id:"snowball"}),()=>({id:"pangram"}),()=>({id:"palindrome"}),()=>({id:"prisoner"}),
    ()=>({id:"acrostic",p:["CAT","SUN","MOON","WIN","POEM","RACE"][Math.floor(Math.random()*6)]}),
  ];
  let picks;
  for(let tries=0;tries<40;tries++){
    for(const id of ORDER)state.cards[id]={on:false,param:REG[id].param?REG[id].param.def:""};
    const n=1+Math.floor(Math.random()*2),seen=new Set();picks=[];
    while(picks.length<n){const p=pool[Math.floor(Math.random()*pool.length)]();if(seen.has(p.id))continue;seen.add(p.id);picks.push(p);}
    for(const p of picks){state.cards[p.id].on=true;if(p.p!==undefined)state.cards[p.id].param=p.p;}
    if(!conflict(state.cards))break;
  }
  ta.value="";
  buildRack();
  const c={};for(const id of ORDER)if(state.cards[id].on)c[id]=state.cards[id].param||"";
  location.hash=enc({c,t:""});
  startChallenge();
  compute();
  ta.focus();
  toast("New challenge generated — solve the corset!");
}

/* ---------- wiring ---------- */
ta.addEventListener("input",onEdit);
ta.addEventListener("scroll",()=>{backdrop.scrollTop=ta.scrollTop;backdrop.scrollLeft=ta.scrollLeft;});
$("#share").onclick=share;
$("#rand").onclick=randChallenge;
$("#theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";saveLocal();};
$("#chExit").onclick=endChallenge;
$("#copy").onclick=()=>{const t=ta.value;const d=()=>toast("Text copied");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(d,d);else{ta.select();document.execCommand("copy");d();}};
$("#export").onclick=()=>{const b=new Blob([ta.value],{type:"text/plain"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="corset-piece.txt";a.click();URL.revokeObjectURL(a.href);toast("Exported corset-piece.txt");};
let tt;function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),2600);}

/* ---------- boot ---------- */
(function boot(){
  const saved=readLocal();
  if(saved&&saved.theme)document.documentElement.dataset.theme=saved.theme;
  if(load()){compute();return;}   // incoming shared link / challenge wins
  restoreLocal();                 // otherwise rehydrate last session
  buildRack();
  compute();
})();
</script>
