<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acronym — Acronym &amp; Initialism Generator</title>
<meta name="description" content="Turn a phrase into an acronym or initialism — skips small words, offers a dotted form, and shows the letters. 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('acronym-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#7c3aed;
    --bg:#f6f4fb; --card:#ffffff; --fg:#1a1626; --muted:#615a72; --line:#e8e3f2; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0e0b16; --card:#181320; --fg:#efeaf7; --muted:#998fac; --line:#261e33; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:660px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#5b21b6);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:800}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:660px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.1rem}
  .opts{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
  .opts label{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);margin:0}
  .big{text-align:center;font-size:3rem;font-weight:800;color:var(--c);letter-spacing:.06em;word-break:break-all}
  .dotted{text-align:center;color:var(--muted);font-size:1.1rem;margin-top:6px}
  .copy{margin-top:12px;background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;display:block;margin-left:auto;margin-right:auto}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:660px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">A</div>
    <div><h1>Acronym</h1><div class="sub">Phrase → acronym</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="phrase">Phrase</label>
    <input type="text" id="phrase" value="National Aeronautics and Space Administration" spellcheck="false">
    <div class="opts">
      <label><input type="checkbox" id="skip" checked> skip small words (of, the, and…)</label>
    </div>
  </div>
  <div class="card">
    <div class="big" id="out">—</div>
    <div class="dotted" id="dotted"></div>
    <button class="copy" id="copyBtn" type="button">Copy</button>
  </div>
</main>
<footer>
  Takes the first letter of each word. By default it skips common small words so "National Aeronautics and Space Administration" → NASA (not NAASA). 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/acronym">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  const STOPWORDS = new Set(['a', 'an', 'and', 'the', 'of', 'for', 'to', 'in', 'on', 'or', 'at', 'by', 'with', 'from']);

  // First letters of each word, optionally skipping small words.
  function acronym(phrase, { skipStopwords = true, dotted = false } = {}){
    const words = String(phrase).match(/[A-Za-z0-9]+/g) || [];
    const letters = words
      .filter(w => !(skipStopwords && STOPWORDS.has(w.toLowerCase())))
      .map(w => w[0].toUpperCase());
    if(letters.length === 0) return '';
    return dotted ? letters.join('.') + '.' : letters.join('');
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);

    function render(){
      const opts = { skipStopwords: $('skip').checked };
      const a = acronym($('phrase').value, opts);
      $('out').textContent = a || '—';
      $('dotted').textContent = a ? acronym($('phrase').value, { ...opts, dotted: true }) : '';
    }
    $('phrase').addEventListener('input', render);
    $('skip').addEventListener('change', render);
    $('copyBtn').addEventListener('click', () => {
      navigator.clipboard?.writeText($('out').textContent);
      $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy', 1200);
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('acronym-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { STOPWORDS, acronym };
</script>
</body>
</html>
