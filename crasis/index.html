<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crasis — smash two words at the seam</title>
<style>
  :root{
    --bg:#F5F3EF; --ink:#232F3E; --a:#FF6100; --b:#1A7F8E; --ov:#B5179E;
    --a-text:#C24A00; --b-text:#14646F;
    --line:#e3ded4; --dim:#c7c1b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 120% at 50% -10%,#fbf9f5,var(--bg));
    color:var(--ink); font:15px/1.5 "Segoe UI",system-ui,-apple-system,"Segoe UI Symbol","Noto Sans Symbols2",sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:26px 16px 60px;
  }
  h1{font-size:34px;margin:0;letter-spacing:-.5px;font-weight:800}
  h1 .x{color:var(--a)}
  .tag{color:#6c675d;margin:6px 0 22px;font-size:14px}
  .wrap{width:100%;max-width:760px}
  .card{background:#fffdfa;border:1px solid var(--line);border-radius:16px;padding:18px 20px;
    box-shadow:0 8px 30px -18px rgba(35,47,62,.35);margin-bottom:16px}
  .inputs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{flex:1;min-width:190px;position:relative}
  .field label{position:absolute;top:-8px;left:12px;background:#fffdfa;padding:0 6px;font-size:11px;
    text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .field.a label{color:var(--a-text)} .field.b label{color:var(--b-text)}
  input[type=text]{width:100%;padding:12px 13px;border:2px solid var(--line);border-radius:11px;
    font-size:18px;font-weight:600;color:var(--ink);background:#fff;outline:none;transition:border-color .15s}
  .field.a input:focus{border-color:var(--a)} .field.b input:focus{border-color:var(--b)}
  .plus{font-size:24px;font-weight:800;color:var(--dim)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;transition:transform .08s,filter .15s}
  button:active{transform:translateY(1px)}
  .btn{background:var(--ink);color:#fff;padding:10px 15px}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn.acc{background:var(--a);color:#fff}
  .btn:hover{filter:brightness(1.06)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .cands{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .cand{border:2px solid var(--line);border-radius:10px;padding:7px 11px;background:#fff;text-align:left;
    display:flex;flex-direction:column;gap:5px;min-width:96px}
  .cand:hover{border-color:var(--a)}
  .cand.sel{border-color:var(--a);background:#fff6ef}
  .cand b{font-size:15px;letter-spacing:.3px}
  .meter{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a));border-radius:4px}
  .cand .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .cand .q{font-size:11px;font-weight:700;color:#8a857a}
  .sect-t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:#8a857a;margin:0 0 8px}
  /* tracks */
  .track{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 0;min-height:52px;user-select:none}
  .ltile{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:40px;padding:0 4px;
    border-radius:9px;font-size:20px;font-weight:700;background:#f1ece2;color:var(--dim);transition:background .18s,color .18s}
  .track.a .ltile.on{background:#ffe9d8;color:var(--a)}
  .track.b .ltile.on{background:#dceff1;color:var(--b)}
  .handle{width:16px;height:48px;position:relative;cursor:ew-resize;flex:0 0 auto;outline:none;touch-action:none}
  .handle::before{content:"";position:absolute;left:7px;top:0;width:2px;height:100%;background:var(--ink);border-radius:2px}
  .handle::after{content:"⇅";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);
    width:16px;height:16px;line-height:16px;text-align:center;background:var(--ink);color:#fff;border-radius:50%;font-size:11px}
  .handle:focus-visible::after{box-shadow:0 0 0 3px rgba(255,97,0,.5)}
  .track.a .handle::before,.track.a .handle::after{background:var(--a)}
  .track.b .handle::before,.track.b .handle::after{background:var(--b)}
  .lbl{font-size:11px;color:#8a857a;font-weight:700;width:100%;margin-top:2px}
  /* blend */
  .blend{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:8px 0 4px;min-height:70px;align-items:center}
  .btile{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:56px;padding:0 6px;
    border-radius:12px;font-size:32px;font-weight:800;color:#fff;animation:pop .17s ease both}
  .btile.a{background:var(--a)} .btile.b{background:var(--b)}
  .btile.ov{background:var(--ov);animation:glow .55s ease both;box-shadow:0 0 18px -2px var(--ov)}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.85)}to{opacity:1;transform:none}}
  @keyframes glow{0%{opacity:0;transform:scale(.6) rotate(-8deg)}60%{transform:scale(1.12)}100%{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){
    .btile,.btile.ov{animation:none;box-shadow:none}
    .ltile,input[type=text]{transition:none}
    button{transition:none}
  }
  .word{text-align:center;font-size:14px;color:#6c675d;margin-top:6px}
  .word b{font-size:22px;color:var(--ink);letter-spacing:.4px}
  .legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:#6c675d;margin-top:12px;flex-wrap:wrap}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
  .crumbs button{background:#f1ece2;color:var(--ink);padding:5px 10px;border-radius:8px;font-weight:700}
  .crumbs button:hover{background:#e6dfd2}
  .crumbs .cur{background:var(--a);color:#fff;padding:5px 10px;border-radius:8px;font-weight:800}
  .crumbs .arw{color:var(--dim);font-weight:800}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;
    transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hint{font-size:12px;color:#9a958c;margin-top:4px}
  @media(max-width:520px){.plus{display:none}}
</style>
</head>
<body>
  <h1>Cra<span class="x">s</span>is</h1>
  <div class="tag">A tactile portmanteau forge — smash two words together at the seam.</div>

  <div class="wrap">
    <div class="card">
      <div class="inputs">
        <div class="field a"><label>Word A</label><input id="ina" type="text" autocomplete="off" spellcheck="false" autofocus></div>
        <span class="plus">+</span>
        <div class="field b"><label>Word B</label><input id="inb" type="text" autocomplete="off" spellcheck="false"></div>
        <button class="btn ghost" id="shuf" title="Random classic pair">Shuffle</button>
      </div>
      <div class="hint">Type any two words. Crasis ranks the best blends by overlap &amp; vowel-pivot smoothness.</div>
      <div class="cands" id="cands"></div>
    </div>

    <div class="card">
      <p class="sect-t">Slide the seam — drag a handle or focus it and use ← → keys</p>
      <div class="track a" id="trka"></div>
      <div class="lbl" id="lba"></div>
      <div class="track b" id="trkb"></div>
      <div class="lbl" id="lbb"></div>
    </div>

    <div class="card">
      <div class="blend" id="blend"></div>
      <div class="word">blend → <b id="bword"></b></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--a)"></span>from A</span>
        <span><span class="dot" style="background:var(--ov)"></span>shared seam</span>
        <span><span class="dot" style="background:var(--b)"></span>from B</span>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn acc" id="copy">Copy word</button>
        <button class="btn" id="png">Export card</button>
        <button class="btn ghost" id="link">Copy link</button>
        <button class="btn ghost" id="ch">Chain &rarr; A</button>
      </div>
    </div>

    <div class="card" id="lin" style="display:none">
      <p class="sect-t">Blend lineage</p>
      <div class="crumbs" id="crumbs"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const VOW="aeiou";
const isV=c=>VOW.includes(c);
const hasV=s=>/[aeiou]/.test(s);
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
const clean=s=>s.toLowerCase().replace(/[^a-z]/g,"");
const EX=[["breakfast","lunch"],["smoke","fog"],["spoon","fork"],["motor","hotel"],
  ["education","entertainment"],["web","seminar"],["guess","estimate"],["spanish","english"],
  ["chill","relax"],["friend","enemy"],["internet","citizen"],["flavor","favorite"],
  ["brother","romance"],["cosmic","comedy"],["labrador","poodle"],["hunger","angry"]];

let state={a:"breakfast",b:"lunch",ca:2,cb:1};
let history=[];      // lineage snapshots {a,b,ca,cb}
let hashTimer=null;

/* ---- scoring: no dictionary, phonetic-ish heuristics ---- */
function overlapK(a,ca,b,cb){
  const max=Math.min(ca,cb);
  for(let n=max;n>=1;n--) if(a.slice(ca-n,ca)===b.slice(cb-n,cb)) return n;
  return 0;
}
function score(a,ca,b,cb){
  const keptA=a.slice(0,ca), keptB=b.slice(cb), blend=keptA+keptB;
  if(!keptA||!keptB) return -1e9;
  if(blend===a||blend===b) return -1e9;
  if(ca===a.length&&cb===0) return -1e9;           // plain concatenation
  let s=0;
  s+=overlapK(a,ca,b,cb)*3.2;                       // shared seam letters (motor+hotel→motel)
  const aEnd=keptA[keptA.length-1], bStart=keptB[0];
  if(isV(bStart)&&!isV(aEnd)) s+=4.5;               // classic consonant→vowel pivot (spork, chilax)
  else if(!isV(bStart)&&isV(aEnd)) s+=1.6;          // vowel→consonant, still readable
  else if(isV(aEnd)&&isV(bStart)) s-=1.6;           // vowel clash
  else s-=0.9;                                      // consonant pileup
  if(!hasV(keptA)) s-=1.2;                          // onset-only A ok (br+unch) but mild penalty
  if(!hasV(keptB)) s-=4;                            // suffix must carry a vowel
  const fA=ca/a.length, fB=keptB.length/b.length;   // recognizability: keep ~half of each word
  s-=Math.abs(fA-0.5)*3.2;
  s-=Math.abs(fB-0.5)*3.2;
  const maxL=Math.max(a.length,b.length);
  if(blend.length>maxL) s-=(blend.length-maxL)*0.7; // penalize bloated smush-ups
  if(blend.length<3) s-=6;
  if(ca===a.length) s-=1.5;
  if(cb===0) s-=1.5;
  return s;
}
function candidates(a,b){
  if(!a||!b) return [];
  const seen={};
  for(let ca=1;ca<=a.length;ca++) for(let cb=0;cb<b.length;cb++){
    const sc=score(a,ca,b,cb); if(sc<=-1e8) continue;
    const blend=a.slice(0,ca)+b.slice(cb);
    if(!seen[blend]||sc>seen[blend].sc) seen[blend]={sc,ca,cb,blend};
  }
  const out=Object.values(seen).sort((x,y)=>y.sc-x.sc);
  out.forEach(c=>c.q=clamp(Math.round(44+c.sc*6),12,100)); // fixed-scale blend-quality %
  return out.slice(0,7);
}

/* ---- state helpers ---- */
const blendOf=s=>s.a.slice(0,s.ca)+s.b.slice(s.cb);
function clampState(){
  state.a=clean(state.a); state.b=clean(state.b);
  state.ca=clamp(state.ca,1,Math.max(1,state.a.length));
  state.cb=clamp(state.cb,0,Math.max(0,state.b.length-1));
}
function applyDefaults(){
  const c=candidates(state.a,state.b);
  if(c.length){state.ca=c[0].ca;state.cb=c[0].cb;}
  else{state.ca=Math.max(1,state.a.length);state.cb=0;}
}

/* ---- rendering ---- */
function renderTrack(el,word,cut,kind){
  el.innerHTML="";
  for(let i=0;i<=word.length;i++){
    if(i===cut){
      const h=document.createElement("div");
      h.className="handle"; h.tabIndex=0; h.setAttribute("role","slider");
      h.setAttribute("aria-label",kind==="a"?"Word A cut point":"Word B cut point");
      h.setAttribute("aria-valuemin",kind==="a"?1:0);
      h.setAttribute("aria-valuemax",kind==="a"?word.length:Math.max(0,word.length-1));
      h.setAttribute("aria-valuenow",cut);
      h.dataset.kind=kind; el.appendChild(h);
    }
    if(i<word.length){
      const t=document.createElement("span");
      const on=kind==="a"?i<cut:i>=cut;
      t.className="ltile"+(on?" on":""); t.textContent=word[i]; el.appendChild(t);
    }
  }
}
function renderBlend(){
  const {a,b,ca,cb}=state, k=overlapK(a,ca,b,cb), blend=blendOf(state);
  const host=$("#blend"); host.innerHTML="";
  [...blend].forEach((ch,i)=>{
    const t=document.createElement("span");
    let cls=i<ca?"a":"b";
    if(k&&i>=ca-k&&i<ca) cls="ov";
    t.className="btile "+cls; t.textContent=ch; host.appendChild(t);
  });
  $("#bword").textContent=blend||"…";
}
function renderCands(){
  const host=$("#cands"); const c=candidates(state.a,state.b); host.innerHTML="";
  c.forEach(cd=>{
    const b=document.createElement("button");
    b.className="cand"+(cd.ca===state.ca&&cd.cb===state.cb?" sel":"");
    b.innerHTML=`<div class="top"><b>${cd.blend}</b><span class="q">${cd.q}%</span></div><div class="meter"><i style="width:${cd.q}%"></i></div>`;
    b.title=`blend quality ${cd.q}%`;
    b.setAttribute("aria-label",`${cd.blend}, blend quality ${cd.q}%`);
    b.onclick=()=>{state.ca=cd.ca;state.cb=cd.cb;update();};
    host.appendChild(b);
  });
  host.style.display=c.length?"flex":"none";
}
function renderLineage(){
  const box=$("#lin");
  if(!history.length){box.style.display="none";return;}
  box.style.display="block";
  const cr=$("#crumbs"); cr.innerHTML="";
  history.forEach((h,i)=>{
    const btn=document.createElement("button");
    btn.textContent=blendOf(h)||h.a;
    btn.title="jump back to this step";
    btn.onclick=()=>{const snap=history[i];history=history.slice(0,i);state={...snap};syncInputs();update();};
    cr.appendChild(btn);
    const ar=document.createElement("span");ar.className="arw";ar.textContent="→";cr.appendChild(ar);
  });
  const cur=document.createElement("span");cur.className="cur";cur.textContent=blendOf(state)||state.a;cr.appendChild(cur);
}
function syncInputs(){$("#ina").value=state.a;$("#inb").value=state.b;}

function update(){
  clampState();
  renderTrack($("#trka"),state.a,state.ca,"a");
  renderTrack($("#trkb"),state.b,state.cb,"b");
  $("#lba").textContent=`A keeps “${state.a.slice(0,state.ca)}”`;
  $("#lbb").textContent=state.b?`B keeps “${state.b.slice(state.cb)}”`:"add word B to blend";
  renderBlend(); renderCands(); renderLineage(); writeHash();
}

/* ---- drag + keyboard on handles ---- */
let drag=null;
function gapFromXY(trackEl,x,y){
  // Tracks use flex-wrap, so an x-only scan picks the wrong gap once a word
  // wraps to a second row. Find the nearest tile by 2D distance, then decide
  // the gap from which half of that tile the pointer is on.
  const tiles=[...trackEl.querySelectorAll(".ltile")];
  if(!tiles.length) return 0;
  let best=0,bd=Infinity,left=true;
  tiles.forEach((t,i)=>{
    const r=t.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);
    if(d<bd){bd=d;best=i;left=x<cx;}
  });
  return left?best:best+1;
}
function setCut(kind,val){
  if(kind==="a") state.ca=clamp(val,1,state.a.length);
  else state.cb=clamp(val,0,Math.max(0,state.b.length-1));
  update();
}
document.addEventListener("pointerdown",e=>{
  const h=e.target.closest(".handle"); if(!h)return;
  drag={kind:h.dataset.kind,track:h.parentElement}; h.setPointerCapture?.(e.pointerId); e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag)return; setCut(drag.kind,gapFromXY(drag.track,e.clientX,e.clientY));
});
document.addEventListener("pointerup",()=>{drag=null;});
document.addEventListener("keydown",e=>{
  const h=e.target.closest?.(".handle"); if(!h)return;
  const kind=h.dataset.kind, cur=kind==="a"?state.ca:state.cb;
  if(e.key==="ArrowLeft"||e.key==="ArrowDown"){setCut(kind,cur-1);e.preventDefault();refocus(kind);}
  else if(e.key==="ArrowRight"||e.key==="ArrowUp"){setCut(kind,cur+1);e.preventDefault();refocus(kind);}
});
function refocus(kind){const h=(kind==="a"?$("#trka"):$("#trkb")).querySelector(".handle");h&&h.focus();}

/* ---- actions ---- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1500);}
function copyText(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>legacyCopy(txt,msg));
  } else legacyCopy(txt,msg);
}
function legacyCopy(txt,msg){
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    toast(ok?msg:"copy not available");
  }catch(_){toast("copy not available");}
}

function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function exportPNG(){
  const {a,b,ca,cb}=state, k=overlapK(a,ca,b,cb), blend=blendOf(state);
  if(!blend)return;
  const chars=[...blend], ts=66, gap=10, mL=44;
  const rowW=chars.length*ts+(chars.length-1)*gap;
  const cv=document.createElement("canvas");
  cv.width=Math.max(rowW+mL*2,540); cv.height=280;
  const g=cv.getContext("2d"), cx=cv.width/2;
  g.fillStyle="#F5F3EF"; g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle="#232F3E"; g.textAlign="center";
  g.font='600 20px "Segoe UI",system-ui,sans-serif';
  g.fillText(a+"  +  "+b,cx,50);
  let x=cx-rowW/2, y=84;
  g.textBaseline="middle";
  chars.forEach((ch,i)=>{
    let col=i<ca?"#FF6100":"#1A7F8E"; if(k&&i>=ca-k&&i<ca) col="#B5179E";
    roundRect(g,x,y,ts,ts,14); g.fillStyle=col; g.fill();
    g.fillStyle="#fff"; g.font='800 34px "Segoe UI",system-ui,sans-serif';
    g.fillText(ch.toUpperCase(),x+ts/2,y+ts/2+2); x+=ts+gap;
  });
  g.textBaseline="alphabetic"; g.fillStyle="#232F3E";
  g.font='800 34px "Segoe UI",system-ui,sans-serif';
  g.fillText("“"+blend+"”",cx,y+ts+52);
  g.fillStyle="#9a958c"; g.font='12px "Segoe UI",system-ui,sans-serif';
  g.fillText("forged with Crasis",cx,cv.height-16);
  const a2=document.createElement("a"); a2.download=blend+"-blend.png"; a2.href=cv.toDataURL("image/png"); a2.click();
  toast("blend card exported");
}

/* ---- hash sync ---- */
function writeHash(){
  const p=new URLSearchParams();
  p.set("a",state.a); p.set("b",state.b); p.set("ca",state.ca); p.set("cb",state.cb);
  if(history.length) p.set("h",history.map(s=>`${s.a}.${s.b}.${s.ca}.${s.cb}`).join("~"));
  const url="#"+p.toString();
  // Debounced + replaceState: no history spam, no hashchange task per drag move
  // (which WebKit rate-limits), and the URL still updates for sharing.
  clearTimeout(hashTimer);
  hashTimer=setTimeout(()=>{try{window.history.replaceState(null,"",url);}catch(_){}} ,80);
}
function readHash(){
  const h=location.hash.slice(1); if(!h)return false;
  const p=new URLSearchParams(h); if(!p.get("a"))return false;
  state.a=clean(p.get("a")); state.b=clean(p.get("b")||"");
  state.ca=+p.get("ca")||1; state.cb=+p.get("cb")||0;
  const hs=p.get("h");
  history=hs?hs.split("~").filter(Boolean).map(s=>{const[a,b,ca,cb]=s.split(".");return{a,b,ca:+ca,cb:+cb};}):[];
  return true;
}

/* ---- wiring ---- */
$("#ina").addEventListener("input",e=>{state.a=clean(e.target.value);applyDefaults();update();});
$("#inb").addEventListener("input",e=>{state.b=clean(e.target.value);applyDefaults();update();});
$("#shuf").onclick=()=>{const p=EX[Math.floor(Math.random()*EX.length)];state.a=p[0];state.b=p[1];applyDefaults();syncInputs();update();};
$("#copy").onclick=()=>{const w=blendOf(state);w&&copyText(w,"copied “"+w+"”");};
$("#link").onclick=()=>copyText(location.href,"share link copied");
$("#png").onclick=exportPNG;
$("#ch").onclick=()=>{
  const w=blendOf(state); if(!w)return;
  history.push({...state});
  state={a:w,b:"",ca:w.length,cb:0};
  syncInputs(); update(); toast("“"+w+"” → Word A. Add a Word B.");
  $("#inb").focus();
};
window.addEventListener("hashchange",()=>{if(readHash()){syncInputs();update();}});

if(readHash()){syncInputs();update();}
else {syncInputs();applyDefaults();update();$("#ina").focus();$("#ina").select();}
