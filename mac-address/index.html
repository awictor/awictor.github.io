<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacAddress — MAC Address Formatter & Inspector</title>
<meta name="description" content="Normalize and reformat a MAC address (colon, hyphen, Cisco dot, bare), validate it, and see unicast/multicast and universal/local flags. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('mac-address-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#3730a3;
    --bg:#f5f5f9; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e3e3ea; --shadow:0 1px 3px rgba(0,0,0,.08); --ok:#16a34a; --bad:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#101017; --card:#191922; --fg:#f0f0f5; --muted:#98989e; --line:#2a2a37; --shadow:0 1px 3px rgba(0,0,0,.5); --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#312e81);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:1rem}
  .status{margin-top:10px;font-weight:700}
  .status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
  .r{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .r .lab{color:var(--muted);font-size:.85rem}
  .r .val{font-family:"SF Mono",Menlo,Consolas,monospace;flex:1;text-align:right;word-break:break-all}
  .r button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit;font-size:.75rem}
  .flags{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .flag{padding:4px 12px;border-radius:999px;background:var(--line);color:var(--fg);font-size:.82rem;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🔌</div>
    <div><h1>MacAddress</h1><div class="sub">Format &amp; inspect MAC addresses</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="mac">MAC address (any separator)</label>
    <input id="mac" value="a1:b2:c3:d4:e5:f6" spellcheck="false" autocapitalize="off">
    <div class="status" id="status"></div>
    <div class="flags" id="flags"></div>
  </div>
  <div class="card" id="outputs"></div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/mac-address">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function normalize(mac){
    const hex = String(mac).replace(/[^0-9a-fA-F]/g, '').toUpperCase();
    if(hex.length !== 12) throw new Error('MAC must have 12 hex digits');
    return hex;
  }

  function format(mac, style = 'colon'){
    const hex = normalize(mac);
    const pairs = hex.match(/.{2}/g);
    if(style === 'colon') return pairs.join(':');
    if(style === 'hyphen') return pairs.join('-');
    if(style === 'bare') return hex;
    if(style === 'dot') return hex.match(/.{4}/g).join('.'); // Cisco AABB.CCDD.EEFF
    throw new Error('unknown style: ' + style);
  }

  function isValid(mac){
    try{ normalize(mac); return true; }catch(e){ return false; }
  }

  function info(mac){
    const hex = normalize(mac);
    const firstOctet = parseInt(hex.slice(0, 2), 16);
    return {
      oui: hex.slice(0, 6),
      multicast: (firstOctet & 1) === 1,
      locallyAdministered: (firstOctet & 2) === 2
    };
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('outputs')){
    const $ = id => document.getElementById(id);
    const STYLES = [['colon', 'Colon'], ['hyphen', 'Hyphen'], ['dot', 'Cisco dot'], ['bare', 'Bare']];

    function render(){
      const mac = $('mac').value;
      if(!isValid(mac)){
        $('status').textContent = mac.trim() ? '✗ Not a valid MAC address' : '';
        $('status').className = 'status bad';
        $('outputs').innerHTML = '';
        $('flags').innerHTML = '';
        return;
      }
      $('status').textContent = '✓ Valid MAC address';
      $('status').className = 'status ok';
      $('outputs').innerHTML = STYLES.map(([s, label]) =>
        `<div class="r"><span class="lab">${label}</span><span class="val">${format(mac, s)}</span><button type="button" data-v="${format(mac, s)}">copy</button></div>`
      ).join('') + (() => { const i = info(mac); return `<div class="r"><span class="lab">OUI (vendor prefix)</span><span class="val">${i.oui}</span><span></span></div>`; })();
      const i = info(mac);
      $('flags').innerHTML =
        `<span class="flag">${i.multicast ? 'Multicast' : 'Unicast'}</span>` +
        `<span class="flag">${i.locallyAdministered ? 'Locally administered' : 'Universally administered'}</span>`;
    }

    $('mac').addEventListener('input', render);
    $('outputs').addEventListener('click', async e => {
      const b = e.target.closest('button[data-v]'); if(!b) return;
      try{ await navigator.clipboard.writeText(b.dataset.v); b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1000); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('mac-address-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { normalize, format, isValid, info };
</script>
</body>
</html>
