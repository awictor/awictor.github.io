<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecHeaders — HTTP Security Headers Analyzer</title>
<meta name="description" content="Paste HTTP response headers and get a security audit with a letter grade: HSTS, CSP, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('sec-headers-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#0369a1;
    --bg:#f4f6f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e5e8; --shadow:0 1px 3px rgba(0,0,0,.08);
    --pass:#16a34a; --warn:#d97706; --fail:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0f1317; --card:#181d22; --fg:#eef2f5; --muted:#95a0a8; --line:#28303700; --line:#283037; --shadow:0 1px 3px rgba(0,0,0,.5);
    --pass:#4ade80; --warn:#fbbf24; --fail:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#075985);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;min-height:150px;resize:vertical}
  .top{display:flex;align-items:center;gap:20px;margin-bottom:8px}
  .grade{width:74px;height:74px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;color:#fff;flex-shrink:0}
  .score b{font-size:1.6rem}
  .row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
  .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex-shrink:0}
  .row .name{font-weight:700}
  .row .detail{color:var(--muted);font-size:.86rem}
  .tag{margin-left:auto;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px;color:#fff}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
  code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🛡️</div>
    <div><h1>SecHeaders</h1><div class="sub">Grade a site's HTTP security headers</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="raw">Paste raw HTTP response headers</label>
    <textarea id="raw" spellcheck="false"></textarea>
    <div class="btns"><button class="ghost" id="ex" type="button">Load example</button></div>
    <div class="sub" style="margin-top:10px">Tip: get headers with <code>curl -sI https://example.com</code></div>
  </div>

  <div class="card">
    <div class="top">
      <div class="grade" id="grade">–</div>
      <div class="score"><b id="score">0</b> / 100 security score</div>
    </div>
    <div id="results"></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/sec-headers">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function parseHeaders(raw){
    const out = {};
    for(const line of String(raw).split(/\r?\n/)){
      const t = line.trim();
      if(!t || /^HTTP\//i.test(t)) continue;
      const i = t.indexOf(':');
      if(i < 1) continue;
      out[t.slice(0, i).trim().toLowerCase()] = t.slice(i + 1).trim();
    }
    return out;
  }

  function grade(score){
    if(score >= 90) return 'A';
    if(score >= 80) return 'B';
    if(score >= 70) return 'C';
    if(score >= 60) return 'D';
    return 'F';
  }

  function analyze(headers){
    const h = typeof headers === 'string' ? parseHeaders(headers) : headers;
    const get = k => h[k.toLowerCase()];
    const results = [];
    let score = 0;

    // Strict-Transport-Security (20)
    const hsts = get('strict-transport-security');
    if(!hsts) results.push({ name: 'Strict-Transport-Security', status: 'fail', detail: 'Missing — HTTPS is not enforced.' });
    else {
      const m = /max-age=(\d+)/i.exec(hsts);
      const age = m ? +m[1] : 0;
      if(age >= 15768000){ score += 20; results.push({ name: 'Strict-Transport-Security', status: 'pass', detail: `max-age=${age}` }); }
      else { score += 10; results.push({ name: 'Strict-Transport-Security', status: 'warn', detail: 'Present, but max-age is below 6 months.' }); }
    }

    // Content-Security-Policy (25)
    const csp = get('content-security-policy');
    if(csp){ score += 25; results.push({ name: 'Content-Security-Policy', status: 'pass', detail: 'Present.' }); }
    else results.push({ name: 'Content-Security-Policy', status: 'fail', detail: 'Missing — no built-in XSS/injection mitigation.' });

    // Clickjacking: X-Frame-Options or CSP frame-ancestors (20)
    const xfo = get('x-frame-options');
    if(xfo || /frame-ancestors/i.test(csp || '')){ score += 20; results.push({ name: 'X-Frame-Options', status: 'pass', detail: xfo || 'covered by CSP frame-ancestors' }); }
    else results.push({ name: 'X-Frame-Options', status: 'fail', detail: 'Missing — page can be framed (clickjacking).' });

    // X-Content-Type-Options (15)
    const xcto = get('x-content-type-options');
    if(xcto && /nosniff/i.test(xcto)){ score += 15; results.push({ name: 'X-Content-Type-Options', status: 'pass', detail: 'nosniff' }); }
    else results.push({ name: 'X-Content-Type-Options', status: 'fail', detail: 'Should be set to "nosniff".' });

    // Referrer-Policy (10)
    const rp = get('referrer-policy');
    if(rp){ score += 10; results.push({ name: 'Referrer-Policy', status: 'pass', detail: rp }); }
    else results.push({ name: 'Referrer-Policy', status: 'warn', detail: 'Missing — full referrer may leak to other sites.' });

    // Permissions-Policy (10)
    const pp = get('permissions-policy') || get('feature-policy');
    if(pp){ score += 10; results.push({ name: 'Permissions-Policy', status: 'pass', detail: 'Present.' }); }
    else results.push({ name: 'Permissions-Policy', status: 'warn', detail: 'Missing — browser features are not restricted.' });

    return { results, score, grade: grade(score) };
  }

  // ---- UI ----
  const EXAMPLE = [
    'HTTP/2 200',
    'strict-transport-security: max-age=31536000; includeSubDomains; preload',
    "content-security-policy: default-src 'self'; frame-ancestors 'none'",
    'x-content-type-options: nosniff',
    'referrer-policy: strict-origin-when-cross-origin',
    'permissions-policy: geolocation=(), microphone=()',
    'cache-control: max-age=3600'
  ].join('\n');

  if(typeof document !== 'undefined' && document.getElementById('results')){
    const $ = id => document.getElementById(id);
    const color = { pass: 'var(--pass)', warn: 'var(--warn)', fail: 'var(--fail)' };
    const gradeColor = g => g === 'A' ? 'var(--pass)' : g === 'B' || g === 'C' ? 'var(--warn)' : 'var(--fail)';

    function render(){
      const r = analyze($('raw').value);
      $('grade').textContent = r.grade;
      $('grade').style.background = gradeColor(r.grade);
      $('score').textContent = r.score;
      $('results').innerHTML = r.results.map(x =>
        `<div class="row"><div class="dot" style="background:${color[x.status]}"></div>` +
        `<div><div class="name">${x.name}</div><div class="detail">${x.detail}</div></div>` +
        `<span class="tag" style="background:${color[x.status]}">${x.status}</span></div>`
      ).join('');
    }

    $('raw').addEventListener('input', render);
    $('ex').addEventListener('click', () => { $('raw').value = EXAMPLE; render(); });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('sec-headers-theme', cur); }catch(e){}
    });

    $('raw').value = EXAMPLE;
    render();
  }

  if(typeof module !== 'undefined') module.exports = { parseHeaders, analyze, grade };
</script>
</body>
</html>
