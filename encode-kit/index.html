<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EncodeKit — Base64 &amp; URL Encoder / Decoder</title>
<meta name="description" content="Encode and decode Base64 and URL-encoded text instantly, both directions, UTF-8 safe. 100% offline, nothing is sent anywhere. No signup." />
<meta name="theme-color" content="#db2777" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="EncodeKit — Base64 & URL Encoder / Decoder" />
<meta property="og:description" content="Base64 and URL encode/decode, both directions, UTF-8 safe. Offline, nothing leaves your device." />
<meta property="og:url" content="https://awictor.github.io/encode-kit/" />
<link rel="canonical" href="https://awictor.github.io/encode-kit/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23db2777'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3E64%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fdf2f8; --ink:#2a1120; --accent:#db2777; --accent-d:#be185d;
    --card:#fff; --line:#f3dbe8; --muted:#7c5568; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(42,17,32,.05),0 8px 24px rgba(42,17,32,.07); }
  [data-theme="dark"]{ --bg:#170912; --ink:#f6e9f0; --accent:#f472b6; --accent-d:#f9a8d4;
    --card:#20111a; --line:#341f2b; --muted:#a9869a; --bad:#f0685c; --field:#170912;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px}
  .segbtn{flex:1;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:9px;font-size:14px;font-weight:600;cursor:pointer}
  .segbtn.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
  label.h{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  textarea{width:100%;min-height:110px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);resize:vertical;word-break:break-all}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(219,39,119,.15)}
  textarea.out{background:var(--bg)}
  textarea.bad{border-color:var(--bad)}
  .tools{display:flex;gap:8px;margin-top:10px;align-items:center}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  #msg{font-size:12px;color:var(--muted);align-self:center}
  .err{color:var(--bad);font-weight:600;font-size:13px;min-height:16px;margin-top:6px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("encodekit.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Encode</span>Kit</h1>
  <p>Base64 and URL encode/decode, both directions, UTF-8 safe. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="seg" id="modeSeg">
      <button class="segbtn on" data-mode="base64">Base64</button>
      <button class="segbtn" data-mode="url">URL</button>
    </div>
    <div class="seg" id="dirSeg">
      <button class="segbtn on" data-dir="encode">Encode</button>
      <button class="segbtn" data-dir="decode">Decode</button>
    </div>
    <label class="h" id="inLabel">Text to encode</label>
    <textarea id="input" spellcheck="false" placeholder="Type or paste here…">Hello, world!</textarea>
    <label class="h" style="margin-top:14px" id="outLabel">Result</label>
    <textarea id="output" class="out" spellcheck="false" readonly></textarea>
    <div class="err" id="err"></div>
    <div class="tools"><button class="btn" id="copyBtn">Copy result</button><button class="btn" id="swapBtn">Use result as input</button><span id="msg"></span></div>
  </section>
</div>

<footer>
  <b>EncodeKit</b> · offline Base64 &amp; URL encoder/decoder · <a href="https://github.com/awictor/encode-kit">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Everything runs locally — your text never leaves your device. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure encode/decode (UTF-8 safe). Each returns a string, or null on invalid input. ---
function b64Encode(s){ try{ return btoa(unescape(encodeURIComponent(String(s)))); }catch(e){ return null; } }
function b64Decode(s){ try{ return decodeURIComponent(escape(atob(String(s).trim()))); }catch(e){ return null; } }
function urlEncode(s){ try{ return encodeURIComponent(String(s)); }catch(e){ return null; } }
function urlDecode(s){ try{ return decodeURIComponent(String(s)); }catch(e){ return null; } }
function convert(mode,dir,text){
  if(mode==="base64") return dir==="encode"? b64Encode(text) : b64Decode(text);
  return dir==="encode"? urlEncode(text) : urlDecode(text);
}

// --- UI ---
let MODE="base64", DIR="encode";
function render(){
  const text=$("input").value;
  try{localStorage.setItem("encodekit.input",text);localStorage.setItem("encodekit.mode",MODE);localStorage.setItem("encodekit.dir",DIR);}catch(e){}
  const label=(MODE==="base64"?"Base64":"URL");
  $("inLabel").textContent = DIR==="encode"?"Text to encode":(label+" to decode");
  $("outLabel").textContent = DIR==="encode"?(label+" result"):"Decoded text";
  const res=convert(MODE,DIR,text);
  if(res==null){ $("output").value=""; $("input").classList.add("bad"); $("err").textContent="That doesn't look like valid "+label+"."; }
  else { $("output").value=res; $("input").classList.remove("bad"); $("err").textContent=""; }
}
$("modeSeg").querySelectorAll(".segbtn").forEach(b=>b.onclick=()=>{MODE=b.dataset.mode;$("modeSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x===b));render();});
$("dirSeg").querySelectorAll(".segbtn").forEach(b=>b.onclick=()=>{DIR=b.dataset.dir;$("dirSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x===b));render();});
$("input").addEventListener("input",render);
$("copyBtn").onclick=()=>{const v=$("output").value;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1200);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();};
$("swapBtn").onclick=()=>{const v=$("output").value;if(v){$("input").value=v;render();}};
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("encodekit.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{
  const s=localStorage.getItem("encodekit.input");if(s!=null)$("input").value=s;
  const m=localStorage.getItem("encodekit.mode");if(m){MODE=m;$("modeSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x.dataset.mode===m));}
  const d=localStorage.getItem("encodekit.dir");if(d){DIR=d;$("dirSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x.dataset.dir===d));}
}catch(e){}
render();

if(typeof module!=="undefined") module.exports={b64Encode,b64Decode,urlEncode,urlDecode,convert};
</script>
</body>
</html>
