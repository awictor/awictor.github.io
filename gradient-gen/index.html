<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GradientGen — CSS gradient generator</title>
<meta name="description" content="Free offline CSS gradient generator. Build linear and radial gradients with multiple color stops, live preview, and copy-ready CSS. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/gradient-gen/">
<style>
  :root{
    --c:#d946ef; --bg:#fdf7fd; --fg:#221426; --muted:#725a76;
    --card:#ffffff; --border:#efddef; --code:#f8ecf8;
  }
  [data-theme="dark"]{
    --bg:#170f19; --fg:#f1e5f2; --muted:#b394b6; --card:#221527;
    --border:#38243c; --code:#2c1a30;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;
    display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#f0abfc);
    display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--fg);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:22px;margin-top:18px}
  .preview{height:170px;border-radius:14px;border:1px solid var(--border);margin-bottom:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg button{background:var(--bg);border:none;color:var(--fg);padding:8px 14px;
    cursor:pointer;font-size:.86rem;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .angle{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
  .angle input[type=range]{flex:1;accent-color:var(--c)}
  .angle .val{font-family:ui-monospace,monospace;font-size:.86rem;width:48px;text-align:right}
  .stops{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .stop{display:flex;align-items:center;gap:10px}
  .stop input[type=color]{width:44px;height:38px;padding:0;border:1px solid var(--border);
    border-radius:9px;background:none;cursor:pointer}
  .stop input[type=text]{flex:1;padding:9px 11px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;font-size:.9rem}
  .stop input[type=number]{width:74px;padding:9px 11px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;font-size:.9rem}
  .stop .rm{background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:1.1rem;flex:none}
  .stop .rm:hover{color:#dc2626;border-color:#dc2626}
  .add{background:var(--code);border:1px dashed var(--border);color:var(--c);
    border-radius:10px;padding:9px;cursor:pointer;font-size:.86rem;font-weight:600;width:100%}
  .out-head{display:flex;align-items:center;margin-top:16px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--muted);border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  pre{background:var(--code);border-radius:12px;padding:14px 16px;margin:8px 0 0;
    overflow-x:auto;font-family:ui-monospace,monospace;font-size:.9rem;white-space:pre-wrap;word-break:break-all}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('grad.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">◑</div>
  <div>
    <h1>GradientGen</h1>
    <p class="sub">CSS gradient generator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="preview" id="preview"></div>
    <div class="controls">
      <div class="seg" id="type">
        <button data-t="linear" class="on">Linear</button>
        <button data-t="radial">Radial</button>
      </div>
      <div class="angle" id="angleWrap">
        <label style="margin:0">Angle</label>
        <input type="range" id="angle" min="0" max="360" value="90">
        <span class="val" id="angleVal">90°</span>
      </div>
    </div>
    <label>Color stops</label>
    <div class="stops" id="stops"></div>
    <button class="add" id="add">+ Add color stop</button>
    <div class="out-head">
      <label style="margin:0">CSS</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <pre id="css"></pre>
  </div>
</main>
<footer>
  GradientGen is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/gradient-gen">Source</a>
</footer>

<script>
// ---- pure functions ----
function stopStr(stop){
  var pos = stop.pos;
  return (pos == null || pos === '') ? String(stop.color)
    : String(stop.color) + ' ' + pos + '%';
}
function linearGradient(angle, stops){
  if(!stops || stops.length === 0) return '';
  var a = (angle == null) ? 180 : angle;
  return 'linear-gradient(' + a + 'deg, ' + stops.map(stopStr).join(', ') + ')';
}
function radialGradient(stops, opts){
  opts = opts || {};
  var shape = opts.shape || 'circle';
  var pos = opts.position || 'center';
  if(!stops || stops.length === 0) return '';
  return 'radial-gradient(' + shape + ' at ' + pos + ', ' + stops.map(stopStr).join(', ') + ')';
}
function buildGradient(config){
  config = config || {};
  var stops = config.stops || [];
  if(config.type === 'radial') return radialGradient(stops, config);
  return linearGradient(config.angle, stops);
}
function autoPositions(stops){
  var n = stops.length;
  return stops.map(function(s, i){
    return { color: s.color, pos: (n <= 1) ? 0 : Math.round(i / (n - 1) * 100) };
  });
}
function withBackground(css){ return 'background: ' + css + ';'; }

if(typeof module !== 'undefined') module.exports = {
  stopStr, linearGradient, radialGradient, buildGradient, autoPositions, withBackground
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var state = {
    type: 'linear', angle: 90,
    stops: [ { color: '#d946ef', pos: 0 }, { color: '#6366f1', pos: 100 } ]
  };
  var stopsEl = document.getElementById('stops');
  var previewEl = document.getElementById('preview');
  var cssEl = document.getElementById('css');
  var angleEl = document.getElementById('angle');
  var angleVal = document.getElementById('angleVal');
  var angleWrap = document.getElementById('angleWrap');
  var typeEl = document.getElementById('type');

  function renderStops(){
    stopsEl.innerHTML = '';
    state.stops.forEach(function(s, i){
      var row = document.createElement('div');
      row.className = 'stop';
      row.innerHTML =
        '<input type="color" data-i="'+i+'" data-k="color" value="'+s.color+'">' +
        '<input type="text" data-i="'+i+'" data-k="colortext" value="'+s.color+'">' +
        '<input type="number" data-i="'+i+'" data-k="pos" min="0" max="100" value="'+s.pos+'">' +
        '<button class="rm" data-i="'+i+'" title="Remove">&times;</button>';
      stopsEl.appendChild(row);
    });
  }
  function render(){
    var css = buildGradient(state);
    previewEl.style.background = css;
    cssEl.textContent = withBackground(css);
    angleVal.textContent = state.angle + '°';
    angleWrap.style.display = state.type === 'linear' ? '' : 'none';
    try{ localStorage.setItem('grad.state', JSON.stringify(state)); }catch(e){}
  }
  stopsEl.addEventListener('input', function(e){
    var t = e.target, i = +t.getAttribute('data-i'), k = t.getAttribute('data-k');
    if(k === 'color'){ state.stops[i].color = t.value; renderStops(); }
    else if(k === 'colortext'){ state.stops[i].color = t.value; }
    else if(k === 'pos'){ state.stops[i].pos = t.value === '' ? '' : Number(t.value); }
    render();
  });
  stopsEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.rm') : null;
    if(!b) return;
    var i = +b.getAttribute('data-i');
    if(state.stops.length > 2){ state.stops.splice(i, 1); renderStops(); render(); }
  });
  document.getElementById('add').addEventListener('click', function(){
    state.stops = autoPositions(state.stops.concat([{ color: '#22d3ee', pos: 50 }]));
    renderStops(); render();
  });
  typeEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    state.type = b.getAttribute('data-t');
    [].forEach.call(typeEl.querySelectorAll('button'), function(x){
      x.className = (x === b) ? 'on' : ''; });
    render();
  });
  angleEl.addEventListener('input', function(){ state.angle = Number(angleEl.value); render(); });
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(cssEl.textContent);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var saved = JSON.parse(localStorage.getItem('grad.state'));
    if(saved && saved.stops) state = saved;
    angleEl.value = state.angle;
    [].forEach.call(typeEl.querySelectorAll('button'), function(x){
      x.className = (x.getAttribute('data-t') === state.type) ? 'on' : ''; });
  }catch(e){}
  renderStops();
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('grad.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('grad.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
