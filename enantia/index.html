<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Enantia — one hand, two ghosts</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#eaeaff;
    touch-action:none;-webkit-user-select:none;user-select:none;cursor:default}
  #c{display:block;position:fixed;inset:0}
  #hint{position:fixed;left:50%;bottom:9px;transform:translateX(-50%);font-size:12px;
    letter-spacing:.6px;opacity:.45;text-align:center;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">&#8592; &#8594; / A / drag to steer &middot; thread BOTH twins &middot; R restart &middot; D daily challenge</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById('c'), g=cv.getContext('2d');
let W=0,H=0,DPR=1,inited=false;
// respect reduced-motion for photosensitivity/vestibular safety
const RM=(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)||false;
const FX=RM?0.12:1;   // flash / chromatic-split intensity
const SHK=RM?0.25:1;  // screen-shake scale
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
  // keep an in-progress run coherent after a resize / orientation change
  if(inited&&state==='play'){AY=H*0.76;ax=Math.max(30,Math.min(W-30,ax));tx=Math.max(30,Math.min(W-30,tx));}}
addEventListener('resize',resize);resize();

// ---------- seeded RNG ----------
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function daily(){const d=new Date();return 'daily-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function readHashSeed(){const m=location.hash.match(/seed=([^&]+)/);return m?decodeURIComponent(m[1]):null;}
let SEED='', rng=Math.random;
function setSeed(s){SEED=s;rng=mulberry32(hashStr(s));location.hash='seed='+encodeURIComponent(s);}

// ---------- audio ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function blip(freq,type,dur,vol,slideTo){const c=ac();if(!c)return;const o=c.createOscillator(),gn=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+dur);
  gn.gain.setValueAtTime(0.0001,c.currentTime);
  gn.gain.exponentialRampToValueAtTime(vol,c.currentTime+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  o.connect(gn).connect(c.destination);o.start();o.stop(c.currentTime+dur+0.03);}
function arp(base){[0,4,7,12,16].forEach((n,i)=>setTimeout(()=>blip(base*Math.pow(2,n/12),'square',0.13,0.11),i*52));}

// ---------- modes / palettes (per-axis "acts") ----------
function pal(hue){return{bg1:`hsl(${hue},58%,8%)`,bg2:`hsl(${(hue+45)%360},62%,15%)`,
  ship:`hsl(${(hue+185)%360},92%,66%)`,accent:`hsl(${hue},96%,63%)`,wall:`hsl(${hue},70%,34%)`};}
const CANON=[
  {name:'HORIZONTAL',kind:'line',theta:Math.PI/2,hue:255},
  {name:'VERTICAL',  kind:'line',theta:0,        hue:165},
  {name:'POINT',     kind:'point',theta:0,       hue:325},
  {name:'DIAGONAL',  kind:'line',theta:Math.PI/4,hue:38}];
function makeMode(i){
  if(i<CANON.length){const m=CANON[i];return{name:m.name,kind:m.kind,theta:m.theta,pal:pal(m.hue)};}
  const hue=(i*67+40)%360, th=rng()*Math.PI;
  return{name:'AXIS '+(i-2),kind:rng()<0.28?'point':'line',theta:th,pal:pal(hue)};
}
function reflect(px,py,m){const cx=W/2,cy=H/2;
  if(m.kind==='point')return[2*cx-px,2*cy-py];
  const dx=Math.cos(m.theta),dy=Math.sin(m.theta),vx=px-cx,vy=py-cy,dot=vx*dx+vy*dy;
  return[cx+2*dot*dx-vx,cy+2*dot*dy-vy];}
function clampB(px,py){return[Math.max(20,Math.min(W-20,px)),Math.max(20,Math.min(H-20,py))];}
function shipB(){const r=reflect(ax,AY,mode);return clampB(r[0],r[1]);}

// ---------- state ----------
let state='menu';
let score,best,combo,comboPeak,cleanStreak,longestClean,dist,shake,flash,chromo;
let ax,tx,AY,gates,parts,sinceSpawn;
let modeIdx,mode,nextMode,gatesInAct,gatesPerAct,tele,timeScale,axView;
let newBest=false;
let deadBtns=[],cardHit=null,menuHit=null;
best=+(localStorage.getItem('enantia_best')||0);
const RAD=9;

function reset(){
  score=0;combo=1;comboPeak=1;cleanStreak=0;longestClean=0;dist=0;shake=0;flash=0;chromo=0;
  AY=H*0.76;ax=W/2;tx=W/2;gates=[];parts=[];sinceSpawn=1e9;
  modeIdx=0;mode=makeMode(0);nextMode=makeMode(1);axView=mode.theta;
  gatesInAct=0;gatesPerAct=6;tele=null;timeScale=1;newBest=false;state='play';
}

// ---------- gates (feasibility-guaranteed fairness) ----------
function feasible(cx,gw){const l=cx-gw/2,r=cx+gw/2;
  for(let s=0;s<=64;s++){const a=30+(W-60)*s/64;const rf=reflect(a,AY,mode);const b=clampB(rf[0],rf[1]);
    if(a>=l&&a<=r&&b[0]>=l&&b[0]<=r)return true;}
  return false;}
function spawnGate(y){
  const t=Math.min(1,dist/6000);
  let gw=Math.max(W*0.15,W*(0.34-0.16*t)),cx=W/2;
  for(let k=0;k<48;k++){
    const jit=(rng()*2-1)*(W*0.30*t+W*0.05);
    cx=Math.max(gw/2+28,Math.min(W-gw/2-28,W/2+jit));
    if(feasible(cx,gw))break;
    gw+=18;
  }
  gates.push({y,cx,gw,doneA:false,doneB:false,rA:'',rB:'',scored:false});
}
function evalShip(gt,sx){const l=gt.cx-gt.gw/2,r=gt.cx+gt.gw/2;
  if(sx<l||sx>r)return 'crash';
  if(sx-RAD<l||sx+RAD>r)return 'graze';
  return 'clean';}

// ---------- particles ----------
function burst(x,y,col,n,spd){for(let i=0;i<n;i++){const a=rng()*6.283,s=spd*(0.25+rng());
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col,r:1.5+rng()*2.5});}}

// ---------- scoring ----------
function scoreGate(gt){
  if(gt.rA==='crash'||gt.rB==='crash'){die();return;}
  const B=shipB();
  const gr=(gt.rA==='graze'?1:0)+(gt.rB==='graze'?1:0);
  if(gr===0){combo=Math.min(12,combo+1);score+=10*combo;cleanStreak++;longestClean=Math.max(longestClean,cleanStreak);
    blip(500+combo*38,'triangle',0.09,0.13,760);burst(ax,AY,mode.pal.ship,10,120);burst(B[0],B[1],mode.pal.ship,10,120);}
  else if(gr===2){score+=60*combo;combo=Math.min(12,combo+2);cleanStreak=0;flash=FX;chromo=FX;shake=Math.min(shake+9*SHK,18*SHK);
    arp(440);burst(ax,AY,'#ffffff',26,240);burst(B[0],B[1],mode.pal.accent,26,240);}
  else{score+=15;combo=1;cleanStreak=0;blip(300,'square',0.08,0.12);burst(ax,AY,mode.pal.accent,12,150);burst(B[0],B[1],mode.pal.accent,12,150);}
  comboPeak=Math.max(comboPeak,combo);dist+=100;gatesInAct++;
  if(gatesInAct>=gatesPerAct && !tele)startTele();
}
function startTele(){tele={t:0,dur:1.15};blip(190,'sawtooth',0.95,0.09,880);}
function commitFlip(){modeIdx++;mode=nextMode;nextMode=makeMode(modeIdx+1);gatesInAct=0;
  // re-validate in-flight gates against the NEW mirror axis so a flip can't
  // strand an already-spawned gate that's only solvable under the old axis
  for(const gt of gates){if(gt.scored)continue;
    while(!feasible(gt.cx,gt.gw)){
      gt.gw+=18;
      if(gt.gw>=W-24){gt.gw=W-24;gt.cx=W/2;break;}
      gt.cx=Math.max(gt.gw/2+28,Math.min(W-gt.gw/2-28,gt.cx));
    }
  }
  flash=FX;chromo=FX;shake=Math.min(shake+7*SHK,16*SHK);blip(880,'square',0.13,0.13,660);tele=null;timeScale=1;axView=mode.theta;}
function die(){state='dead';newBest=false;
  if(score>best){best=Math.floor(score);localStorage.setItem('enantia_best',best);newBest=true;}
  shake=18*SHK;flash=FX;chromo=FX;blip(160,'sawtooth',0.55,0.16,55);
  if(newBest)setTimeout(()=>arp(660),140); // celebrate a new personal best
}

// ---------- update ----------
function update(rdt){
  // controls
  if(pointerActive){tx=Math.max(30,Math.min(W-30,pointerX));}
  else{tx+=(keyR-keyL)*W*1.05*rdt;tx=Math.max(30,Math.min(W-30,tx));}
  ax+=(tx-ax)*Math.min(1,rdt*15);
  if(state!=='play'){shake*=0.9;flash*=0.9;chromo*=0.9;return;}

  if(tele){tele.t+=rdt;const p=Math.min(1,tele.t/tele.dur);
    timeScale=1-(RM?0.3:0.62)*Math.sin(p*Math.PI);
    // sweep displayed axis toward the incoming axis
    let target=nextMode.kind==='point'?axView:nextMode.theta;
    axView+=(target-axView)*Math.min(1,rdt*4);
    if(p>=1)commitFlip();
  } else timeScale=1;
  const dt=rdt*timeScale;

  const speed=150+Math.min(230,dist*0.03);
  const gap=Math.max(170,340-dist*0.02);
  sinceSpawn+=speed*dt;
  if(sinceSpawn>=gap){spawnGate(-60);sinceSpawn=0;}

  const B=shipB();
  for(let i=gates.length-1;i>=0;i--){const gt=gates[i];
    gt.y+=speed*dt;
    if(!gt.doneA && gt.y>=AY){gt.doneA=true;gt.rA=evalShip(gt,ax);}
    if(!gt.doneB && gt.y>=B[1]){gt.doneB=true;gt.rB=evalShip(gt,B[0]);}
    if(gt.doneA&&gt.doneB&&!gt.scored){gt.scored=true;scoreGate(gt);}
    if(gt.y>H+60){if(!gt.scored){if(!gt.doneA)gt.rA=evalShip(gt,ax);if(!gt.doneB)gt.rB=evalShip(gt,B[0]);gt.scored=true;scoreGate(gt);}gates.splice(i,1);}
  }
  // survival drip
  dist+=speed*dt*0.05;score+=dt*combo*0.6;

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;p.life-=dt*1.7;if(p.life<=0)parts.splice(i,1);}
  shake*=0.88;flash*=0.9;chromo*=0.9;
}

// ---------- render ----------
function drawAxis(m,alpha,thetaOverride){
  const cx=W/2,cy=H/2,L=Math.hypot(W,H);g.save();g.globalAlpha=alpha;g.strokeStyle=m.pal.accent;
  g.shadowColor=m.pal.accent;g.shadowBlur=18;g.lineWidth=2;
  if(m.kind==='point'){
    g.beginPath();g.arc(cx,cy,16,0,6.283);g.stroke();
    for(let a=0;a<4;a++){const th=a*Math.PI/4+performance.now()*0.0005;
      g.beginPath();g.moveTo(cx-Math.cos(th)*L,cy-Math.sin(th)*L);g.lineTo(cx+Math.cos(th)*L,cy+Math.sin(th)*L);g.globalAlpha=alpha*(a?0.12:0.5);g.stroke();}
  }else{const th=thetaOverride!=null?thetaOverride:m.theta;
    g.beginPath();g.moveTo(cx-Math.cos(th)*L,cy-Math.sin(th)*L);g.lineTo(cx+Math.cos(th)*L,cy+Math.sin(th)*L);g.setLineDash([14,10]);g.stroke();g.setLineDash([]);}
  g.restore();
}
function drawShip(x,y,col,scale){g.save();g.translate(x,y);g.shadowColor=col;g.shadowBlur=16;g.fillStyle=col;
  g.beginPath();g.moveTo(0,-9*scale);g.lineTo(7*scale,7*scale);g.lineTo(0,3*scale);g.lineTo(-7*scale,7*scale);g.closePath();g.fill();
  g.globalAlpha=0.35;g.beginPath();g.arc(0,0,12*scale,0,6.283);g.fill();g.restore();}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  const sx=(Math.random()*2-1)*shake, sy=(Math.random()*2-1)*shake;
  g.save();g.translate(sx,sy);
  // background gradient (act palette)
  const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,mode.pal.bg1);grd.addColorStop(1,mode.pal.bg2);
  g.fillStyle=grd;g.fillRect(-40,-40,W+80,H+80);
  // axis (current + telegraph preview of the incoming axis)
  drawAxis(mode,0.5,mode.kind==='point'?null:axView);
  if(tele){const p=Math.min(1,tele.t/tele.dur);drawAxis(nextMode,0.25+0.6*p,nextMode.kind==='point'?null:axView);}
  // gates
  for(const gt of gates){const l=gt.cx-gt.gw/2,r=gt.cx+gt.gw/2;
    g.fillStyle=mode.pal.wall;g.fillRect(0,gt.y-7,l,14);g.fillRect(r,gt.y-7,W-r,14);
    g.strokeStyle=mode.pal.accent;g.shadowColor=mode.pal.accent;g.shadowBlur=14;g.lineWidth=3;
    g.beginPath();g.moveTo(l,gt.y-7);g.lineTo(l,gt.y+7);g.moveTo(r,gt.y-7);g.lineTo(r,gt.y+7);g.stroke();g.shadowBlur=0;}
  // particles
  for(const p of parts){g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill();}
  g.globalAlpha=1;
  // ships + mirror tie
  const B=shipB();
  g.strokeStyle=mode.pal.accent;g.globalAlpha=0.22;g.lineWidth=1.5;g.beginPath();g.moveTo(ax,AY);g.lineTo(B[0],B[1]);g.stroke();g.globalAlpha=1;
  drawShip(ax,AY,mode.pal.ship,1);
  drawShip(B[0],B[1],mode.pal.ship,1);
  if(chromo>0.02){g.globalCompositeOperation='lighter';g.globalAlpha=chromo*0.6;
    drawShip(ax-chromo*7,AY,'#ff3355',1);drawShip(ax+chromo*7,AY,'#33ffee',1);
    drawShip(B[0]-chromo*7,B[1],'#ff3355',1);drawShip(B[0]+chromo*7,B[1],'#33ffee',1);
    g.globalAlpha=1;g.globalCompositeOperation='source-over';}
  g.restore();
  // flash overlay
  if(flash>0.02){g.fillStyle=mode.pal.accent;g.globalAlpha=flash*0.18;g.fillRect(0,0,W,H);g.globalAlpha=1;}
  // HUD
  hud();
  if(state==='menu')menu();
  if(state==='dead')drawCardOnScreen();
}
function hud(){
  g.textAlign='left';g.fillStyle='#eaeaff';g.font='700 26px Segoe UI,sans-serif';
  g.fillText(Math.floor(score).toString(),18,36);
  g.font='600 14px Segoe UI,sans-serif';g.fillStyle=mode.pal.accent;
  g.fillText('COMBO x'+combo,18,58);
  g.fillStyle='rgba(234,234,255,.55)';g.fillText('BEST '+best,18,78);
  g.textAlign='right';g.fillStyle=mode.pal.ship;g.font='700 16px Segoe UI,sans-serif';
  g.fillText('AXIS: '+mode.name,W-18,32);
  g.font='600 12px Segoe UI,sans-serif';g.fillStyle='rgba(234,234,255,.55)';
  g.fillText('next: '+nextMode.name,W-18,52);
  g.fillText('streak '+cleanStreak,W-18,70);
  if(tele){g.textAlign='center';g.fillStyle=mode.pal.accent;g.font='700 20px Segoe UI,sans-serif';
    g.globalAlpha=0.6+0.4*Math.sin(performance.now()*0.02);
    g.fillText('◆ AXIS SHIFT → '+nextMode.name+' ◆',W/2,H*0.16);g.globalAlpha=1;}
}
function menu(){g.fillStyle='rgba(5,6,13,.55)';g.fillRect(0,0,W,H);g.textAlign='center';
  g.fillStyle=mode.pal.ship;g.shadowColor=mode.pal.ship;g.shadowBlur=24;g.font='800 68px Segoe UI,sans-serif';
  g.fillText('ENANTIA',W/2,H*0.36);g.shadowBlur=0;
  g.fillStyle='#eaeaff';g.font='500 18px Segoe UI,sans-serif';
  g.fillText('One hand, two ghosts, a mirror that keeps turning.',W/2,H*0.36+40);
  g.fillStyle='rgba(234,234,255,.7)';g.font='500 15px Segoe UI,sans-serif';
  g.fillText('Steer ship A — its twin is a live mirror image. Thread BOTH through every gate.',W/2,H*0.36+72);
  g.fillText('The mirror plane rotates as you survive. Re-wire your reflexes.',W/2,H*0.36+96);
  g.fillStyle=mode.pal.accent;g.font='700 20px Segoe UI,sans-serif';
  g.globalAlpha=0.6+0.4*Math.sin(performance.now()*0.005);
  g.fillText('press any key / tap to launch',W/2,H*0.36+150);g.globalAlpha=1;
  g.fillStyle='rgba(234,234,255,.5)';g.font='500 13px Segoe UI,sans-serif';
  g.fillText('D = daily challenge  ·  share your run when you crash',W/2,H*0.36+180);
  g.fillText('seed: '+SEED+'   ·   best: '+best,W/2,H*0.36+204);
  // tappable daily-challenge affordance (works without a keyboard)
  const bw=Math.min(220,W*0.7),bh=40,bx=(W-bw)/2,by=H*0.36+222;
  drawBtn('◆ Daily challenge',bx,by,bw,bh);menuHit={x:bx,y:by,w:bw,h:bh};
}
function drawBtn(label,x,y,w,h){g.save();
  g.fillStyle='rgba(234,234,255,.08)';g.strokeStyle=mode.pal.accent;g.lineWidth=1.5;
  g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,9);else g.rect(x,y,w,h);g.fill();g.stroke();
  g.fillStyle='#eaeaff';g.font='600 14px Segoe UI,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(label,x+w/2,y+h/2);g.textBaseline='alphabetic';g.restore();}

// ---------- share card ----------
function renderCard(ctx,w,h){
  const grd=ctx.createLinearGradient(0,0,0,h);grd.addColorStop(0,mode.pal.bg1);grd.addColorStop(1,mode.pal.bg2);
  ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=mode.pal.accent;ctx.lineWidth=3;ctx.strokeRect(8,8,w-16,h-16);
  ctx.textAlign='left';ctx.fillStyle=mode.pal.ship;ctx.font='800 40px Segoe UI,sans-serif';
  ctx.fillText('ENANTIA',34,64);
  ctx.fillStyle='rgba(234,234,255,.7)';ctx.font='500 14px Segoe UI,sans-serif';
  ctx.fillText('one hand, two ghosts, a mirror that keeps turning',34,88);
  ctx.textAlign='right';ctx.fillStyle=mode.pal.accent;ctx.font='800 76px Segoe UI,sans-serif';
  ctx.fillText(Math.floor(score).toString(),w-34,120);
  ctx.fillStyle='rgba(234,234,255,.55)';ctx.font='600 14px Segoe UI,sans-serif';
  ctx.fillText('SCORE',w-34,140);
  if(newBest){ctx.textAlign='right';ctx.fillStyle=mode.pal.accent;ctx.font='800 18px Segoe UI,sans-serif';
    ctx.fillText('★ NEW BEST',w-34,162);ctx.textAlign='left';}
  const rows=[['seed',SEED],['best',best],['longest clean streak',longestClean],['combo peak','x'+comboPeak],['axes cleared',modeIdx+1]];
  ctx.textAlign='left';let y=180;
  for(const[k,v]of rows){ctx.fillStyle='rgba(234,234,255,.6)';ctx.font='500 16px Segoe UI,sans-serif';ctx.fillText(k,34,y);
    ctx.textAlign='right';ctx.fillStyle='#eaeaff';ctx.font='700 16px Segoe UI,sans-serif';ctx.fillText(String(v),w-34,y);ctx.textAlign='left';y+=30;}
  ctx.fillStyle='rgba(234,234,255,.4)';ctx.font='500 12px Segoe UI,sans-serif';
  ctx.fillText('challenge a friend — same seed, same gauntlet',34,h-20);
}
function cardCanvas(){const c=document.createElement('canvas');c.width=600;c.height=340;renderCard(c.getContext('2d'),600,340);return c;}
function drawCardOnScreen(){g.fillStyle='rgba(5,6,13,.6)';g.fillRect(0,0,W,H);
  const cw=Math.min(600,W*0.9),ch=cw*340/600,cx=(W-cw)/2,cy=H*0.18;
  const c=cardCanvas();g.drawImage(c,cx,cy,cw,ch);
  cardHit={x:cx,y:cy,w:cw,h:ch}; // tap the card to copy it
  if(newBest){g.textAlign='center';g.fillStyle=mode.pal.accent;g.font='800 22px Segoe UI,sans-serif';
    g.globalAlpha=0.65+0.35*Math.sin(performance.now()*0.012);
    g.fillText('★ NEW BEST ★',W/2,cy-14);g.globalAlpha=1;}
  // tappable controls (so touch users can copy / share / play the daily)
  const labels=[['Copy card',copyCard],['Copy link',copyLink],['Daily',()=>{toast='';setSeed(daily());reset();}]];
  const bw=Math.min(150,(cw-24)/3),bh=40,gap=12,tot=bw*3+gap*2,bx0=(W-tot)/2,by=cy+ch+18;
  deadBtns=[];
  labels.forEach((L,i)=>{const bx=bx0+i*(bw+gap);drawBtn(L[0],bx,by,bw,bh);deadBtns.push({x:bx,y:by,w:bw,h:bh,fn:L[1]});});
  g.textAlign='center';g.fillStyle=mode.pal.accent;g.font='600 14px Segoe UI,sans-serif';
  g.globalAlpha=0.6+0.4*Math.sin(performance.now()*0.006);
  g.fillText('tap the card to copy  ·  R replay  ·  tap elsewhere to restart',W/2,by+bh+26);g.globalAlpha=1;
  if(toast){g.fillStyle='#eaeaff';g.font='600 15px Segoe UI,sans-serif';g.fillText(toast,W/2,by+bh+50);}
}
let toast='';
// synchronous copy fallback for non-secure origins (e.g. file://) where
// navigator.clipboard is unavailable
function fallbackCopy(txt){try{const ta=document.createElement('textarea');ta.value=txt;
  ta.style.position='fixed';ta.style.top='-1000px';ta.setAttribute('readonly','');
  document.body.appendChild(ta);ta.focus();ta.select();
  const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}}
async function copyText(txt){try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);return true;}}catch(e){}
  return fallbackCopy(txt);}
async function copyCard(){try{const c=cardCanvas();c.toBlob(async b=>{
    try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast='share card copied to clipboard ✓';return;}throw 0;}
    catch(e){const a=document.createElement('a');a.href=c.toDataURL();a.download='enantia-'+SEED+'.png';a.click();toast='share card downloaded ✓';}});}
  catch(e){toast='copy unavailable — screenshot instead';}}
async function copyLink(){
  const url=location.href.split('#')[0]+'#seed='+encodeURIComponent(SEED);
  location.hash='seed='+encodeURIComponent(SEED);
  const ok=await copyText(url);
  toast=ok?'challenge link copied ✓':('seed: '+SEED+' — copy this to share');}

// ---------- input ----------
let keyL=0,keyR=0,pointerActive=false,pointerX=0;
addEventListener('keydown',e=>{ac();const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keyL=1;
  if(k==='arrowright'||k==='d'&&state==='play')keyR=1;
  if(k==='r'){toast='';reset();return;}
  if(k==='d'&&state!=='play'){toast='';setSeed(daily());reset();return;}
  if(k==='c'&&state==='dead'){copyCard();return;}
  if(k==='l'){copyLink();return;}
  if(state==='menu'){reset();}
  else if(state==='dead'&&k===' '){toast='';reset();}
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keyL=0;if(k==='arrowright'||k==='d')keyR=0;});
function pt(e){pointerActive=true;pointerX=e.clientX;}
function inRect(e,r){return r&&e.clientX>=r.x&&e.clientX<=r.x+r.w&&e.clientY>=r.y&&e.clientY<=r.y+r.h;}
addEventListener('pointerdown',e=>{ac();
  if(state==='menu'){if(inRect(e,menuHit)){toast='';setSeed(daily());reset();return;}reset();return;}
  if(state==='dead'){
    for(const b of deadBtns){if(inRect(e,b)){toast='';b.fn();return;}}
    if(inRect(e,cardHit)){toast='';copyCard();return;}
    toast='';reset();return;}
  pt(e);});
addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pt(e);});
addEventListener('pointerup',()=>{pointerActive=false;});

// ---------- boot ----------
setSeed(readHashSeed()||('run-'+Math.floor(Math.random()*1e6).toString(36)));
reset();state='menu';inited=true; // init all game vars so the first frame renders the menu instead of crashing
let last=performance.now();
function loop(now){let rdt=(now-last)/1000;last=now;if(rdt>0.05)rdt=0.05;
  update(rdt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
