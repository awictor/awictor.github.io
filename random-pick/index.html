<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RandomPick — Random Number, Dice &amp; List Picker</title>
<meta name="description" content="Generate a random number in a range, roll dice, or pick and shuffle items from a list. 100% offline, no signup." />
<meta name="theme-color" content="#0ea5e9" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="RandomPick — Random Number, Dice & List Picker" />
<meta property="og:description" content="Random number in a range, dice roller, and pick/shuffle a list. Offline." />
<meta property="og:url" content="https://awictor.github.io/random-pick/" />
<link rel="canonical" href="https://awictor.github.io/random-pick/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230ea5e9'/%3E%3Crect x='18' y='18' width='28' height='28' rx='5' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='27' cy='27' r='2.5' fill='%23fff'/%3E%3Ccircle cx='37' cy='37' r='2.5' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eff8fd; --ink:#0a1c26; --accent:#0ea5e9; --accent-d:#0284c7;
    --card:#fff; --line:#d3e7f0; --muted:#4f6773; --field:#fff;
    --shadow:0 1px 2px rgba(10,28,38,.05),0 8px 24px rgba(10,28,38,.07); }
  [data-theme="dark"]{ --bg:#06141c; --ink:#e6f2f8; --accent:#38bdf8; --accent-d:#7dd3fc;
    --card:#0f1e28; --line:#1e3642; --muted:#8aa5b0; --field:#06141c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  input[type=number]{width:90px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px;text-align:right;background:var(--field);color:var(--ink)}
  textarea{width:100%;min-height:110px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--field);color:var(--ink);resize:vertical;font-family:inherit;margin-bottom:10px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:hover{border-color:var(--accent)}
  .out{margin-top:12px;font-size:15px;text-align:center;min-height:24px}
  .out .big{font-size:40px;font-weight:800;color:var(--accent);line-height:1.1}
  .out b{color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("rand.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Random</span>Pick</h1>
  <p>Random numbers, dice, and picking from a list. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Random number</h2>
    <div class="row">from <input id="min" type="number" value="1"> to <input id="max" type="number" value="100"> <button class="btn primary" id="rollNum">Generate</button></div>
    <div class="out" id="numOut"></div>
  </section>

  <section class="card">
    <h2>Dice</h2>
    <div class="row"><input id="count" type="number" min="1" value="2"> × d<input id="sides" type="number" min="2" value="6"> <button class="btn primary" id="rollDiceBtn">Roll</button></div>
    <div class="out" id="diceOut"></div>
  </section>

  <section class="card">
    <h2>Pick from a list</h2>
    <textarea id="list" spellcheck="false" placeholder="One item per line…">Alice
Bob
Carol
Dave</textarea>
    <div class="row"><button class="btn primary" id="pickOne">Pick one</button><button class="btn" id="shuffleBtn">Shuffle</button></div>
    <div class="out" id="listOut"></div>
  </section>
</div>

<footer>
  <b>RandomPick</b> · offline randomizer · <a href="https://github.com/awictor/random-pick">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure randomness (rng injectable; defaults to Math.random) ---
function randInt(min,max,rng){ rng=rng||Math.random; min=Math.ceil(min); max=Math.floor(max); if(max<min){const t=min;min=max;max=t;} return Math.floor(rng()*(max-min+1))+min; }
function pick(list,rng){ if(!list.length) return null; return list[randInt(0,list.length-1,rng||Math.random)]; }
function shuffle(list,rng){ rng=rng||Math.random; const a=list.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function pickN(list,n,rng){ return shuffle(list,rng||Math.random).slice(0,Math.max(0,n)); }
function rollDice(sides,count,rng){ rng=rng||Math.random; const rolls=[]; for(let i=0;i<count;i++) rolls.push(randInt(1,sides,rng)); return {rolls, sum:rolls.reduce((a,b)=>a+b,0)}; }

// --- UI ---
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const lines=()=>$("list").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
$("rollNum").onclick=()=>{ $("numOut").innerHTML='<span class="big">'+randInt(num("min"),num("max"))+'</span>'; };
$("rollDiceBtn").onclick=()=>{ const r=rollDice(Math.max(2,num("sides")),Math.max(1,Math.min(50,num("count")))); $("diceOut").innerHTML=r.rolls.join(" + ")+" = <b>"+r.sum+"</b>"; };
$("pickOne").onclick=()=>{ const p=pick(lines()); $("listOut").innerHTML=p==null?"Add some items first.":'👉 <b>'+p.replace(/</g,"&lt;")+'</b>'; };
$("shuffleBtn").onclick=()=>{ const s=shuffle(lines()); $("listOut").innerHTML=s.length?s.map(x=>x.replace(/</g,"&lt;")).join(" · "):"Add some items first."; };
["list"].forEach(id=>$(id).addEventListener("input",()=>{try{localStorage.setItem("rand.list",$("list").value);}catch(e){}}));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("rand.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const l=localStorage.getItem("rand.list");if(l!=null)$("list").value=l;}catch(e){}

if(typeof module!=="undefined") module.exports={randInt,pick,shuffle,pickN,rollDice};
</script>
</body>
</html>
