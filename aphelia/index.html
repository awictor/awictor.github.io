<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aphelia · Exoplanet Almanac</title>
<style>
  :root{
    --bg:#05060d; --panel:#0c1020; --ink:#e8ecff; --dim:#8390b8;
    --accent:#7fd4ff; --gold:#e9c877; --edge:#1c2340;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 800px at 70% -10%,#141a33 0%,#05060d 60%);
    color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    padding:24px 16px 40px; gap:18px;
  }
  header{text-align:center; letter-spacing:.02em}
  header h1{margin:0; font-size:26px; font-weight:700}
  header h1 span{color:var(--accent)}
  header p{margin:4px 0 0; color:var(--dim); font-size:13px}
  .stage{
    background:var(--panel); border:1px solid var(--edge); border-radius:16px;
    padding:14px; box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  #card{display:block; border-radius:10px; width:720px; max-width:88vw; height:auto}
  .bar{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; max-width:760px}
  input,button{
    font:inherit; border-radius:9px; border:1px solid var(--edge);
    background:#0f1428; color:var(--ink); padding:9px 13px;
  }
  input{min-width:200px; letter-spacing:.02em}
  input:focus{border-color:var(--accent)}
  button{cursor:pointer; transition:.15s; font-size:13px; font-weight:600}
  button:hover{border-color:var(--accent); background:#141b36}
  /* keep the ring for keyboard users, drop it only for mouse focus */
  :focus{outline:none}
  button:focus-visible,input:focus-visible,.thumb:focus-visible{
    border-color:var(--accent); box-shadow:0 0 0 2px rgba(127,212,255,.35); outline:none;
  }
  button.primary{background:var(--accent); color:#04121c; border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.1)}
  .hint{color:var(--dim); font-size:12px; text-align:center}
  .hint kbd{background:#111834; border:1px solid var(--edge); border-radius:5px; padding:1px 6px; color:var(--ink)}
  .recents{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:760px; min-height:56px}
  .recents .thumb{
    width:52px; height:52px; border-radius:8px; border:1px solid var(--edge);
    cursor:pointer; transition:.15s; padding:0; overflow:hidden; background:#0f1428;
  }
  .recents .thumb:hover{border-color:var(--gold); transform:translateY(-2px)}
  .recents .thumb img{width:100%; height:100%; display:block}
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px);
    background:var(--gold); color:#1a1405; padding:10px 18px; border-radius:10px;
    font-weight:600; font-size:13px; opacity:0; pointer-events:none; transition:.25s;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
  <header>
    <h1>APH<span>&#233;</span>LIA</h1>
    <p>Seed a string &middot; discover a world &middot; catalog the cosmos</p>
  </header>

  <div class="stage"><canvas id="card" role="img" aria-label="Exoplanet catalog card"></canvas></div>

  <div class="bar">
    <input id="seed" type="text" placeholder="type a seed…" spellcheck="false" autocomplete="off" aria-label="World seed">
    <button id="go" class="primary">Discover &#9166;</button>
    <button id="roll">Reseed</button>
    <button id="png">Export PNG</button>
    <button id="link">Copy Link</button>
  </div>
  <div class="hint">Press <kbd>Space</kbd> to roll a new world &middot; each seed always renders the same planet</div>

  <div class="recents" id="recents"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// ===== Section 1: seeded RNG + noise =====================================
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^=h>>>16)>>>0; };
}
function mulberry32(a){
  return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function makeRng(seed){ return mulberry32(xmur3(seed)()); }
const TAU=Math.PI*2;
// value noise: hashed lattice, bilinear + smoothstep, on a seeded gradient table
function makeNoise(rng){
  const G=new Float32Array(256); for(let i=0;i<256;i++) G[i]=rng();
  const perm=new Uint8Array(512); for(let i=0;i<256;i++) perm[i]=i;
  for(let i=255;i>0;i--){ const j=(rng()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<256;i++) perm[i+256]=perm[i];
  const fade=t=>t*t*(3-2*t);
  return function(x,y){
    const xi=Math.floor(x)&255, yi=Math.floor(y)&255;
    const xf=x-Math.floor(x), yf=y-Math.floor(y);
    const u=fade(xf), v=fade(yf);
    const aa=G[perm[perm[xi]+yi]], ba=G[perm[perm[xi+1]+yi]];
    const ab=G[perm[perm[xi]+yi+1]], bb=G[perm[perm[xi+1]+yi+1]];
    const top=aa+u*(ba-aa), bot=ab+u*(bb-ab);
    return top+v*(bot-top);
  };
}
function fbm(n,x,y,oct){ let a=0,amp=.5,f=1; for(let i=0;i<oct;i++){ a+=amp*n(x*f,y*f); f*=2; amp*=.5; } return a; }
const pick=(rng,arr)=>arr[(rng()*arr.length)|0];
const range=(rng,a,b)=>a+(b-a)*rng();
const rnd2=x=>Math.round(x*100)/100;

// ===== Section 2: world model ============================================
const ARCHES=["Gas Giant","Rockball","Ocean World","Ice World","Lava World"];
const STARS=["O","B","A","F","G","K","M"];
const STARCOL={O:"#9bb0ff",B:"#aabfff",A:"#cad7ff",F:"#f8f7ff",G:"#fff4e8",K:"#ffd2a1",M:"#ffb37a"};
const PREFIX=["Cinder","Aureus","Vela","Halcyon","Nyx","Tethys","Orrery","Kethara","Solace","Vantablack","Meridian","Zephyr","Umbra","Calyx"];
const SUFFIX=["Reach","Expanse","Basin","Verge","Drift","Shoal","Hollow","Span","Marches","Cradle","Wake","Rift"];
const ADJ=["a wind-scoured","a tide-locked","a storm-wreathed","a sun-drowned","a frost-bitten","a mineral-rich","a cloud-shrouded","an ember-lit","a silent","a shimmering","an ancient","a restless"];
const NOUN=["desert of glass","ocean of ammonia","expanse of ash","field of black ice","reef of silicate","plain of ferrous dust","sea of methane","valley of salt","ridge of basalt","haze of sulfur"];
const CLOSER=["catalogued by the Aphelian survey.","first sighted from a decaying orbit.","named for its impossible dawns.","logged, then quietly forgotten.","where no probe has yet returned.","favored by long-haul cartographers.","its year longer than most empires.","a waypoint for the patient."];

function buildWorld(seed){
  const rng=makeRng(seed);
  const arch=pick(rng,ARCHES);
  const star=pick(rng,STARS);
  const radius=arch==="Gas Giant"?rnd2(range(rng,4,11)):rnd2(range(rng,.4,2.6));
  const density=arch==="Gas Giant"?range(rng,.2,.7):range(rng,.7,1.5);
  const mass=rnd2(Math.pow(radius,3)*density);
  const gravity=rnd2(mass/(radius*radius));
  const day=rnd2(range(rng,6,64));
  const year=rnd2(range(rng,0.2,900));
  const baseT={"Gas Giant":150,"Rockball":260,"Ocean World":295,"Ice World":90,"Lava World":1400}[arch];
  const temp=Math.round(baseT+range(rng,-40,40));
  const gases=["N2","CO2","O2","CH4","H2","He","SO2","Ar","H2O"];
  const g1=pick(rng,gases); let g2=pick(rng,gases); if(g2===g1)g2=gases[(gases.indexOf(g1)+3)%gases.length];
  const p1=Math.round(range(rng,50,88)), atmo=g1+" "+p1+"% · "+g2+" "+(100-p1)+"%";
  const habit=arch==="Ocean World"?range(rng,20,74):arch==="Rockball"?range(rng,1,32):range(rng,0,9);
  const bio=rnd2(habit);
  const desig="APH-"+(1000+((rng()*8999)|0))+" "+String.fromCharCode(98+((rng()*5)|0));
  const flavor=pick(rng,PREFIX)+" "+pick(rng,SUFFIX)+" — "+pick(rng,ADJ)+" world, "+pick(rng,NOUN)+", "+pick(rng,CLOSER);
  const moons=(rng()*(arch==="Gas Giant"?5:3))|0;
  const hasRings=arch==="Gas Giant"?rng()<.7:rng()<.15;
  // palettes per archetype
  const PAL={
    "Gas Giant":[["#f0d8a8","#c98f4e","#9a5a2b","#e8c88a"],["#d9e6f0","#8fb8d8","#5b7fae","#c4d8ea"],["#e7c9e0","#b874a8","#7d4b78","#d9a8cd"]],
    "Rockball":[["#b6a48c","#8a7256","#5f4a35","#cbb89c"],["#c08a6a","#96604a","#6a4030","#d6a582"]],
    "Ocean World":[["#7fdfff","#2f8fd8","#0c4a86","#d8f4ff"]],
    "Ice World":[["#dff2ff","#a7d3ef","#6f9ec8","#ffffff"]],
    "Lava World":[["#ffd27a","#ff7a2f","#7a1005","#ffb14a"]]
  };
  const pal=pick(rng,PAL[arch]);
  const noise=makeNoise(makeRng(seed+"·n"));
  const stars=[]; const sr=makeRng(seed+"·s");
  for(let i=0;i<120;i++) stars.push([sr(),sr(),sr()*.7+.3,sr()*TAU]);
  const moonCfg=[]; for(let i=0;i<moons;i++) moonCfg.push({d:range(rng,1.35,2.2),r:range(rng,.05,.11),s:range(rng,.2,.7)*(rng()<.5?-1:1),ph:rng()*TAU,ecc:range(rng,.15,.4)});
  const atmoCol=arch==="Ocean World"?"#7fd4ff":arch==="Lava World"?"#ff7a3a":arch==="Ice World"?"#bfe6ff":arch==="Gas Giant"?pal[0]:"#c8a878";
  return {seed,arch,star,starCol:STARCOL[star],radius,mass,gravity,day,year,temp,atmo,bio,desig,flavor,moons:moonCfg,hasRings,pal,noise,stars,atmoCol,ringTilt:range(rng,.18,.42)};
}

// ===== Section 3: renderers ==============================================
const cv=document.getElementById("card"), cx=cv.getContext("2d");
const W=720,H=440,DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
cv.width=W*DPR; cv.height=H*DPR; cx.scale(DPR,DPR);
const CXp=250,CYp=225,R=140;             // planet center + radius (left side)
const LIGHT=[-.55,-.45];                  // light direction (unit-ish)
let world=null, t0=performance.now();

function drawFrame(){
  cx.fillStyle="#070a16"; cx.fillRect(0,0,W,H);
  const g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0c1226"); g.addColorStop(1,"#05070f");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // engraved frame
  cx.strokeStyle="#26305a"; cx.lineWidth=2; roundRect(10,10,W-20,H-20,12); cx.stroke();
  cx.strokeStyle="rgba(233,200,119,.5)"; cx.lineWidth=1; roundRect(16,16,W-32,H-32,9); cx.stroke();
  // corner ticks
  cx.strokeStyle="rgba(233,200,119,.7)";
  [[16,16],[W-16,16],[16,H-16],[W-16,H-16]].forEach(([x,y],i)=>{
    const sx=x<W/2?1:-1, sy=y<H/2?1:-1;
    cx.beginPath(); cx.moveTo(x+sx*10,y); cx.lineTo(x+sx*26,y); cx.moveTo(x,y+sy*10); cx.lineTo(x,y+sy*26); cx.stroke();
  });
}
function starfield(time){
  for(const s of world.stars){
    const x=24+s[0]*(W-48), y=24+s[1]*(H-48);
    if(Math.hypot(x-CXp,y-CYp)<R+14) continue;
    const tw=.4+.6*Math.abs(Math.sin(time*.0012*s[2]+s[3]));
    cx.globalAlpha=tw*s[2]; cx.fillStyle=world.starCol||"#dfe8ff";
    cx.fillRect(x,y,s[2]>.85?1.6:1,s[2]>.85?1.6:1);
  }
  cx.globalAlpha=1;
}
function surfaceColor(w,ang,lat,scroll){
  // ang: longitude 0..1 across visible disk, lat: -1..1, scroll: rotation offset
  const p=w.pal, n=w.noise, u=ang+scroll;
  let mix,c;
  if(w.arch==="Gas Giant"){
    const band=Math.sin(lat*7+ Math.sin(u*3+lat*4)*.6 + fbm(n,u*3,lat*5,3)*3)*.5+.5;
    c=band<.33?p[2]:band<.66?p[1]:p[0]; if(band>.9)c=p[3];
  }else if(w.arch==="Ocean World"){
    const v=fbm(n,u*4,lat*3+2,4);
    c=v>.56?p[1]:v>.5?p[0]:v<.4?p[2]:p[1]; // land vs deep vs shallow
    if(fbm(n,u*6+9,lat*6,3)>.66) c=p[3]; // clouds
  }else if(w.arch==="Ice World"){
    const v=fbm(n,u*5,lat*4,4);
    c=v>.58?p[3]:v>.48?p[0]:p[1]; if(v<.36)c=p[2];
  }else if(w.arch==="Lava World"){
    const v=fbm(n,u*6,lat*5,4);
    c=v>.6?p[0]:v>.5?p[1]:v>.4?p[3]:p[2];
  }else{ // rockball
    const v=fbm(n,u*6,lat*5,4);
    c=v>.58?p[3]:v>.48?p[0]:p[1]; if(v<.34)c=p[2];
  }
  return c;
}
// draw globe as vertical scanlines mapped onto a sphere
function drawGlobe(time){
  const w=world, scroll=(time*0.00004*(w.arch==="Gas Giant"?2.4:1.2));
  cx.save();
  cx.beginPath(); cx.arc(CXp,CYp,R,0,TAU); cx.clip();
  const step=2;
  for(let px=-R;px<=R;px+=step){
    const nx=px/R; if(nx*nx>1)continue;
    const colH=Math.sqrt(1-nx*nx)*R;
    const lon=Math.asin(nx)/Math.PI+0.5; // 0..1
    for(let py=-colH;py<=colH;py+=step){
      const ny=py/R; const lat=ny;
      const col=surfaceColor(w,lon,lat,scroll);
      // sphere normal for lighting
      const nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
      let light=nx*LIGHT[0]+ny*LIGHT[1]+nz*0.72; light=Math.max(0,light);
      const limb=0.35+0.65*nz; // limb darkening toward edge
      let shade=(0.12+0.95*light)*limb;
      if(w.arch==="Lava World") shade=Math.max(shade,0.30+0.5*(1-nz)); // lava self-glow at limb
      cx.fillStyle=tint(col,Math.min(1.15,shade));
      cx.fillRect(CXp+px,CYp+py,step+.6,step+.6);
    }
  }
  // specular glint on ocean/lava
  if(w.arch==="Ocean World"||w.arch==="Lava World"){
    const gx=CXp+LIGHT[0]*R*.5, gy=CYp+LIGHT[1]*R*.5;
    const gg=cx.createRadialGradient(gx,gy,0,gx,gy,R*.5);
    gg.addColorStop(0,w.arch==="Lava World"?"rgba(255,240,200,.55)":"rgba(255,255,255,.5)");
    gg.addColorStop(1,"rgba(255,255,255,0)"); cx.fillStyle=gg;
    cx.beginPath(); cx.arc(gx,gy,R*.5,0,TAU); cx.fill();
  }
  cx.restore();
  // atmospheric limb glow
  const halo=cx.createRadialGradient(CXp,CYp,R*.86,CXp,CYp,R*1.18);
  halo.addColorStop(0,"rgba(0,0,0,0)");
  halo.addColorStop(.62,hexA(w.atmoCol,.30));
  halo.addColorStop(1,"rgba(0,0,0,0)");
  cx.fillStyle=halo; cx.beginPath(); cx.arc(CXp,CYp,R*1.18,0,TAU); cx.fill();
  // crisp rim
  cx.strokeStyle=hexA(w.atmoCol,.5); cx.lineWidth=1.4;
  cx.beginPath(); cx.arc(CXp,CYp,R+.5,0,TAU); cx.stroke();
}
function drawRings(front){
  if(!world.hasRings)return;
  const w=world, ry=R*w.ringTilt;
  for(let i=0;i<3;i++){
    const rx=R*(1.35+i*0.22);
    cx.save(); cx.translate(CXp,CYp); cx.rotate(-0.32);
    cx.beginPath(); cx.ellipse(0,0,rx,ry*(1.35+i*.22),0, front?-0.15:Math.PI-0.15, front?Math.PI+0.15:TAU+0.15);
    cx.strokeStyle=hexA(w.pal[i%w.pal.length],front?.75:.4); cx.lineWidth=6-i*1.3; cx.stroke();
    cx.restore();
  }
}
function drawMoons(time,layer){
  for(const m of world.moons){
    const a=m.ph+time*0.0006*m.s;
    const mx=CXp+Math.cos(a)*R*m.d, my=CYp+Math.sin(a)*R*m.d*m.ecc;
    const front=Math.sin(a)>=0;
    if((front&&layer==="back")||(!front&&layer==="front")) continue;
    const mr=R*m.r;
    const gg=cx.createRadialGradient(mx-mr*.3,my-mr*.3,0,mx,my,mr);
    gg.addColorStop(0,"#e6e9f2"); gg.addColorStop(1,"#5a6178");
    cx.fillStyle=gg; cx.beginPath(); cx.arc(mx,my,mr,0,TAU); cx.fill();
  }
}
function drawStats(){
  const w=world, x=430, y=70, lh=25;
  // opaque inset panel — keeps orbiting moons from bleeding over the almanac text
  cx.fillStyle="rgba(6,9,20,.85)"; roundRect(x-16,44,282,H-64,10); cx.fill();
  cx.strokeStyle="rgba(233,200,119,.18)"; cx.lineWidth=1; roundRect(x-16,44,282,H-64,10); cx.stroke();
  cx.textBaseline="alphabetic";
  cx.fillStyle="#e9c877"; cx.font="700 22px system-ui,-apple-system,'Segoe UI',sans-serif";
  cx.fillText(w.desig,x,y);
  cx.font="600 11px system-ui,-apple-system,'Segoe UI',sans-serif";
  cx.fillStyle="#8390b8"; cx.fillText(w.arch.toUpperCase()+"  ·  CLASS ",x,y+16);
  const cw=cx.measureText(w.arch.toUpperCase()+"  ·  CLASS ").width;
  cx.fillStyle=w.starCol||"#8390b8"; cx.fillText(w.star+" STAR",x+cw,y+16);
  cx.fillStyle="rgba(233,200,119,.35)"; cx.fillRect(x,y+26,240,1);
  const rows=[
    ["Radius",w.radius+" R⊕"],["Mass",w.mass+" M⊕"],["Surface g",w.gravity+" g"],
    ["Day",w.day+" h"],["Year",w.year+" d"],["Mean temp",w.temp+" K"],
    ["Atmosphere",w.atmo],["Moons",String(w.moons.length)],["Biosignature",w.bio+" %"]
  ];
  cx.font="13px system-ui,-apple-system,'Segoe UI',sans-serif";
  let yy=y+50;
  for(const [k,v] of rows){
    cx.fillStyle="#8390b8"; cx.fillText(k,x,yy);
    cx.fillStyle="#e8ecff"; cx.font="600 13px system-ui,-apple-system,'Segoe UI',sans-serif";
    cx.textAlign="right"; cx.fillText(v,x+240,yy); cx.textAlign="left";
    cx.font="13px system-ui,-apple-system,'Segoe UI',sans-serif"; yy+=lh;
  }
  // flavor citation, wrapped
  cx.fillStyle="rgba(233,200,119,.35)"; cx.fillRect(x,yy-2,240,1);
  cx.fillStyle="#9aa6cc"; cx.font="italic 12px system-ui,-apple-system,'Segoe UI',sans-serif";
  wrapText(w.flavor,x,yy+16,240,15);
  // seed footer
  cx.fillStyle="#5a6488"; cx.font="11px system-ui,-apple-system,'Segoe UI',sans-serif";
  cx.fillText("seed › "+w.seed,x,H-30);
}
function wrapText(text,x,y,maxW,lh){
  const words=text.split(" "); let line="",yy=y;
  for(const word of words){
    const test=line+word+" ";
    if(cx.measureText(test).width>maxW&&line){ cx.fillText(line.trim(),x,yy); line=word+" "; yy+=lh; }
    else line=test;
  }
  cx.fillText(line.trim(),x,yy);
}
// small color helpers
function hexToRgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function tint(hex,f){ const c=hexToRgb(hex); return "rgb("+c.map(v=>Math.min(255,Math.round(v*f))).join(",")+")"; }
function hexA(hex,a){ const c=hexToRgb(hex); return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"; }
function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

function render(time){
  drawFrame();
  starfield(time);
  drawRings(false);        // back arcs
  drawMoons(time,"back");
  drawGlobe(time);
  drawRings(true);         // front arcs
  drawMoons(time,"front");
  drawStats();
}

// ===== Section 4: app wiring =============================================
const $=id=>document.getElementById(id);
let running=true;
function loop(){ if(running&&world) render(performance.now()-t0); requestAnimationFrame(loop); }

function setWorld(seed,updateHash){
  seed=(seed||"").trim(); if(!seed) seed=randomSeed();
  world=buildWorld(seed); $("seed").value=seed;
  cv.setAttribute("aria-label",
    world.desig+", "+world.arch+", class "+world.star+" star. "+
    "Radius "+world.radius+" Earth radii, mass "+world.mass+" Earth masses, "+
    "surface gravity "+world.gravity+" g, mean temperature "+world.temp+" kelvin, "+
    world.moons.length+" moon"+(world.moons.length===1?"":"s")+", "+
    "biosignature odds "+world.bio+" percent. "+world.flavor);
  if(updateHash!==false){ history.replaceState(null,"","#seed="+encodeURIComponent(seed)); }
  render(performance.now()-t0);
  saveRecent(seed);
}
const WORDS=["orion","vega","nova","echo","cobalt","lyra","quill","onyx","atlas","rune","sable","pyx","zenith","tycho"];
function randomSeed(){ const r=makeRng(String(Math.random())+Date.now()); return pick(r,WORDS)+"-"+((r()*9000+100)|0); }

// recents strip via localStorage
function saveRecent(seed){
  let list=[]; try{ list=JSON.parse(localStorage.getItem("aphelia.recent")||"[]"); }catch(e){}
  list=list.filter(s=>s!==seed); list.unshift(seed); list=list.slice(0,8);
  try{ localStorage.setItem("aphelia.recent",JSON.stringify(list)); }catch(e){}
  renderRecents(list);
}
function renderRecents(list){
  const box=$("recents"); box.innerHTML="";
  if(!list||list.length===0){
    const p=document.createElement("span"); p.className="hint";
    p.textContent="Worlds you discover show up here";
    box.appendChild(p); return;
  }
  for(const seed of list){
    const b=document.createElement("button"); b.className="thumb"; b.title=seed;
    b.appendChild(thumbFor(seed)); b.onclick=()=>setWorld(seed);
    box.appendChild(b);
  }
}
function thumbFor(seed){
  const c=document.createElement("canvas"); c.width=52; c.height=52;
  const g=c.getContext("2d"); const w=buildWorld(seed);
  g.fillStyle="#0a0f20"; g.fillRect(0,0,52,52);
  const r=20,cxp=26,cyp=26;
  for(let px=-r;px<=r;px+=2){ const nx=px/r; if(nx*nx>1)continue; const ch=Math.sqrt(1-nx*nx)*r;
    for(let py=-ch;py<=ch;py+=2){ const ny=py/r; const lon=Math.asin(nx)/Math.PI+.5;
      const col=surfaceColor(w,lon,ny,0); const nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
      let li=Math.max(0,nx*LIGHT[0]+ny*LIGHT[1]+nz*.72); const sh=(0.15+0.9*li)*(0.4+0.6*nz);
      g.fillStyle=tint(col,Math.min(1.1,sh)); g.fillRect(cxp+px,cyp+py,2.4,2.4);
    }
  }
  const img=new Image(); img.src=c.toDataURL(); return img;
}

function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1600); }

$("go").onclick=()=>setWorld($("seed").value);
$("roll").onclick=()=>setWorld(randomSeed());
$("seed").addEventListener("keydown",e=>{ if(e.key==="Enter") setWorld($("seed").value); });
$("png").onclick=()=>{
  render(performance.now()-t0); // crisp single frame
  const a=document.createElement("a"); a.download="aphelia-"+world.seed+".png"; a.href=cv.toDataURL("image/png"); a.click();
  toast("PNG exported");
};
$("link").onclick=async()=>{
  const url=location.href.split("#")[0]+"#seed="+encodeURIComponent(world.seed);
  try{ await navigator.clipboard.writeText(url); toast("Link copied ✦"); }
  catch(e){ prompt("Copy this shareable link:",url); }
};
window.addEventListener("keydown",e=>{
  if(e.code==="Space"&&document.activeElement!==$("seed")){ e.preventDefault(); setWorld(randomSeed()); }
});
window.addEventListener("hashchange",()=>{ const s=hashSeed(); if(s&&(!world||s!==world.seed)) setWorld(s,false); });
function hashSeed(){ const m=location.hash.match(/seed=([^&]+)/); return m?decodeURIComponent(m[1]):""; }

// boot
try{ renderRecents(JSON.parse(localStorage.getItem("aphelia.recent")||"[]")); }catch(e){ renderRecents([]); }
setWorld(hashSeed()||randomSeed());
// respect reduced-motion: the renderer already produces a crisp static frame
const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!reduceMotion) loop();
</script>
