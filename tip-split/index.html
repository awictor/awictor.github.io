<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TipSplit — Tip &amp; Bill Split Calculator</title>
<meta name="description" content="Split a bill fast: tip amount, grand total, and what each person owes — with optional round-up. 100% offline, no signup." />
<meta name="theme-color" content="#e11d48" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="TipSplit — Tip & Bill Split Calculator" />
<meta property="og:description" content="Tip amount, grand total, and per-person share — with optional round-up. Offline, no signup." />
<meta property="og:url" content="https://awictor.github.io/tip-split/" />
<link rel="canonical" href="https://awictor.github.io/tip-split/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e11d48'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3E%25%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fbf5f6; --ink:#241016; --accent:#e11d48; --accent-d:#be123c;
    --card:#fff; --line:#efdfe3; --muted:#7c5b63; --good:#0f9d58; --field:#fff;
    --shadow:0 1px 2px rgba(36,16,22,.05),0 8px 24px rgba(36,16,22,.07); }
  [data-theme="dark"]{ --bg:#160b0e; --ink:#f4e9ec; --accent:#fb7185; --accent-d:#fda4af;
    --card:#201417; --line:#33232a; --muted:#a98891; --good:#34c884; --field:#160b0e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:820px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:720px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 14px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:12px 0;gap:12px}
  .row label{font-size:14px;flex:1}
  .ig{position:relative;width:140px}
  .ig .pre{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
  input[type=number]{width:100%;padding:10px 10px 10px 24px;border:1px solid var(--line);border-radius:9px;font-size:15px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,72,.15)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
  .big{font-size:42px;font-weight:700;letter-spacing:-.02em;margin:2px 0;color:var(--accent)}
  .bd{margin-top:14px;font-size:14px}
  .bd .li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
  .bd .li:last-child{border-bottom:0;font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("tipsplit.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Tip</span>Split</h1>
  <p>Split the bill in a tap — tip, total, and each person's share. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>The bill</h2>
    <div class="row"><label>Bill amount</label><div class="ig"><span class="pre cur">$</span><input id="bill" type="number" step="1" value="86.40"></div></div>
    <div><div class="row" style="margin-bottom:0"><label>Tip %</label><div class="ig"><span class="pre">%</span><input id="tipPct" type="number" step="1" value="20"></div></div>
      <div class="chips" id="tipChips"></div></div>
    <div class="row"><label>Split between</label><div class="ig"><span class="pre">#</span><input id="people" type="number" step="1" min="1" value="4"></div></div>
    <label class="toggle"><input type="checkbox" id="roundUp"> Round each person up to the nearest <span class="cur">$</span>1</label>
    <div style="margin-top:14px;text-align:right"><button id="shareBtn" style="border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer">🔗 Share</button></div>
    <div id="shareMsg" style="font-size:12px;color:var(--muted);text-align:right;margin-top:6px"></div>
  </section>

  <section class="card">
    <h2>Each person pays</h2>
    <div id="perPerson" class="big">—</div>
    <div class="bd">
      <div class="li"><span>Tip</span><span id="tip">—</span></div>
      <div class="li"><span>Grand total</span><span id="total">—</span></div>
      <div class="li"><span id="collLbl">Collected (after round-up)</span><span id="collected">—</span></div>
    </div>
  </section>
</div>

<footer>
  <b>TipSplit</b> · offline tip &amp; bill splitter · <a href="https://github.com/awictor/tip-split">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
let CUR="$";
const money=n=>(n<0?"-":"")+CUR+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// Split a bill with tip across people, optionally rounding each share up. Pure.
function splitBill(s){
  const tip=s.bill*s.tipPct/100;
  const total=s.bill+tip;
  const people=s.people>0?s.people:1;
  let perPerson=total/people;
  if(s.roundUp) perPerson=Math.ceil(perPerson);
  const collected=perPerson*people;
  return {tip, total, perPerson, collected, extra:collected-total};
}

const KEYS=["bill","tipPct","people"];
function readState(){return {bill:num("bill"),tipPct:num("tipPct"),people:num("people"),roundUp:$("roundUp").checked};}
function encodeState(s){return btoa(unescape(encodeURIComponent([s.bill,s.tipPct,s.people,s.roundUp?1:0].join("~")))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function decodeState(str){try{const p=decodeURIComponent(escape(atob(str.replace(/-/g,"+").replace(/_/g,"/")))).split("~");if(p.length!==4)return null;const b=+p[0],t=+p[1],pe=+p[2];if([b,t,pe].some(isNaN))return null;return {bill:b,tipPct:t,people:pe,roundUp:p[3]==="1"};}catch{return null;}}

function calc(){
  const s=readState(), r=splitBill(s);
  try{KEYS.forEach(k=>localStorage.setItem("tipsplit."+k,$(k).value));localStorage.setItem("tipsplit.round",s.roundUp?"1":"0");}catch(e){}
  $("perPerson").textContent=money(r.perPerson);
  $("tip").textContent=money(r.tip);
  $("total").textContent=money(r.total);
  $("collected").textContent=money(r.collected);
  $("collLbl").textContent=s.roundUp?`Collected (+${money(r.extra)} over)`:"Collected";
  document.querySelectorAll("#tipChips .chip").forEach(c=>c.classList.toggle("on",+c.dataset.t===s.tipPct));
}
[15,18,20,25].forEach(p=>{const b=document.createElement("button");b.className="chip";b.dataset.t=p;b.textContent=p+"%";b.onclick=()=>{$("tipPct").value=p;calc();};$("tipChips").appendChild(b);});
document.querySelectorAll("input").forEach(el=>el.addEventListener("input",calc));
$("roundUp").addEventListener("change",calc);
$("shareBtn").onclick=()=>{const url=location.origin+location.pathname+"#s="+encodeState(readState());const msg=x=>{$("shareMsg").textContent=x;};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>msg("✓ Link copied."),()=>msg(url));else msg(url);};
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("tipsplit.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{KEYS.forEach(k=>{const v=localStorage.getItem("tipsplit."+k);if(v!=null)$(k).value=v;});if(localStorage.getItem("tipsplit.round")==="1")$("roundUp").checked=true;}catch(e){}
(function(){const m=(location.hash||"").match(/[#&]s=([^&]+)/);if(!m)return;const st=decodeState(m[1]);if(st){$("bill").value=st.bill;$("tipPct").value=st.tipPct;$("people").value=st.people;$("roundUp").checked=st.roundUp;$("shareMsg").textContent="Opened from a shared link.";}})();
calc();

if(typeof module!=="undefined") module.exports={splitBill,encodeState,decodeState};
</script>
</body>
</html>
