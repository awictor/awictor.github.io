<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdealWeight — ideal body weight calculator</title>
<meta name="description" content="Free offline ideal body weight calculator using the Devine, Robinson, Miller, and Hamwi formulas, plus a healthy weight range from BMI. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/ideal-weight/">
<style>
  :root{
    --c:#14532d; --bg:#f5faf6; --fg:#0e1f14; --muted:#4f6b57;
    --card:#ffffff; --border:#d7e8dc; --code:#e6f2e9;
  }
  [data-theme="dark"]{
    --bg:#0a160e; --fg:#e3efe7; --muted:#84a48f; --card:#102417;
    --border:#203a29; --code:#152c1d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#16a34a);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:720px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
  .seg button{background:var(--bg);border:none;color:var(--fg);padding:8px 18px;cursor:pointer;
    font-size:.9rem;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .fld{flex:1;min-width:130px}
  input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;
    background:var(--bg);color:var(--fg);font-size:1rem;font-family:ui-monospace,monospace}
  input:focus{outline:2px solid var(--c);border-color:var(--c)}
  .err{color:#dc2626;font-size:.86rem;margin:12px 0 0;min-height:1.1em}
  .range{margin-top:18px;background:var(--code);border-radius:12px;padding:14px 16px}
  .range .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .range .v{font-family:ui-monospace,monospace;font-weight:700;font-size:1.3rem;color:var(--c);margin-top:3px}
  .grid{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cell{background:var(--card);padding:12px 15px;display:flex;justify-content:space-between;align-items:baseline}
  .cell .n{font-size:.9rem}
  .cell .n small{color:var(--muted);font-size:.72rem;display:block}
  .cell .w{font-family:ui-monospace,monospace;font-weight:700}
  .hint{color:var(--muted);font-size:.82rem;margin:16px 0 0}
  footer{max-width:720px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('iw.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">⚖</div>
  <div>
    <h1>IdealWeight</h1>
    <p class="sub">Ideal body weight calculator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="seg" id="sex">
      <button data-s="male" class="on">Male</button>
      <button data-s="female">Female</button>
    </div>
    <div class="row">
      <div class="fld">
        <label for="height">Height (cm)</label>
        <input id="height" value="175" inputmode="decimal" spellcheck="false">
      </div>
      <div class="fld">
        <label for="weight">Current weight (kg, optional)</label>
        <input id="weight" value="" inputmode="decimal" spellcheck="false" placeholder="to compare">
      </div>
    </div>
    <p class="err" id="err"></p>
    <div class="range" id="range"></div>
    <div class="grid" id="grid"></div>
    <p class="hint">The four formulas each estimate a single "ideal" figure; the healthy range is
      derived from BMI 18.5–24.9 for your height. Estimates only — not medical advice. Runs locally.</p>
  </div>
</main>
<footer>
  IdealWeight is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/ideal-weight">Source</a>
</footer>

<script>
// ---- pure functions ----
function inchesOver5ft(cm){ return (Number(cm) - 152.4) / 2.54; }
function idealWeights(sex, heightCm){
  var h = Number(heightCm);
  if(!(h > 0)) return null;
  var over = inchesOver5ft(h);
  var male = sex !== 'female';
  return {
    devine: (male ? 50 : 45.5) + 2.3 * over,
    robinson: male ? 52 + 1.9 * over : 49 + 1.7 * over,
    miller: male ? 56.2 + 1.41 * over : 53.1 + 1.36 * over,
    hamwi: male ? 48 + 2.7 * over : 45.5 + 2.2 * over
  };
}
function healthyRange(heightCm){
  var h = Number(heightCm);
  if(!(h > 0)) return null;
  var m = h / 100;
  return { min: 18.5 * m * m, max: 24.9 * m * m };
}
function averageIdeal(sex, heightCm){
  var w = idealWeights(sex, heightCm);
  if(!w) return null;
  return (w.devine + w.robinson + w.miller + w.hamwi) / 4;
}

if(typeof module !== 'undefined') module.exports = {
  inchesOver5ft, idealWeights, healthyRange, averageIdeal
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var sexWrap = document.getElementById('sex');
  var heightEl = document.getElementById('height');
  var weightEl = document.getElementById('weight');
  var errEl = document.getElementById('err');
  var rangeEl = document.getElementById('range');
  var gridEl = document.getElementById('grid');
  var sex = 'male';
  var FORMULAS = [['Devine','devine'],['Robinson','robinson'],['Miller','miller'],['Hamwi','hamwi']];

  function kg(x){ return x.toFixed(1) + ' kg'; }
  function render(){
    var w = idealWeights(sex, heightEl.value);
    var r = healthyRange(heightEl.value);
    if(!w || !r){
      errEl.textContent = 'Enter a valid height in cm.';
      rangeEl.innerHTML = ''; gridEl.innerHTML = '';
      return;
    }
    errEl.textContent = '';
    var cur = Number(weightEl.value);
    var curNote = (isFinite(cur) && cur > 0)
      ? (cur < r.min ? ' · you are below the healthy range' : cur > r.max ? ' · you are above the healthy range' : ' · you are within the healthy range')
      : '';
    rangeEl.innerHTML = '<div class="k">Healthy weight range (BMI 18.5–24.9)</div>' +
      '<div class="v">' + kg(r.min) + ' – ' + kg(r.max) + '</div>' +
      (curNote ? '<div class="k" style="margin-top:6px">Current: ' + kg(cur) + curNote + '</div>' : '');
    gridEl.innerHTML = FORMULAS.map(function(f){
      return '<div class="cell"><span class="n">' + f[0] + '<small>formula</small></span>' +
        '<span class="w">' + kg(w[f[1]]) + '</span></div>';
    }).join('');
    try{
      localStorage.setItem('iw.sex', sex);
      localStorage.setItem('iw.height', heightEl.value);
      localStorage.setItem('iw.weight', weightEl.value);
    }catch(e){}
  }
  sexWrap.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    sex = b.getAttribute('data-s');
    [].forEach.call(sexWrap.querySelectorAll('button'), function(x){ x.className = (x === b) ? 'on' : ''; });
    render();
  });
  [heightEl, weightEl].forEach(function(e){ e.addEventListener('input', render); });
  try{
    var ss = localStorage.getItem('iw.sex');
    if(ss){ sex = ss; [].forEach.call(sexWrap.querySelectorAll('button'), function(x){
      x.className = (x.getAttribute('data-s') === ss) ? 'on' : ''; }); }
    var sh = localStorage.getItem('iw.height'); if(sh !== null) heightEl.value = sh;
    var sw = localStorage.getItem('iw.weight'); if(sw !== null) weightEl.value = sw;
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('iw.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('iw.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
