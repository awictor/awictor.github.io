<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coinery — a word mint</title>
<style>
  :root{
    --paper:#f4efe4; --ink:#2b2620; --rule:#d8cdb5; --accent:#8a5a2b;
    --gk:#0f766e; --lat:#9a3412; --oe:#3f6212;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;line-height:1.5;
    background-image:radial-gradient(circle at 20% 10%,#fbf7ec,transparent 60%);}
  .wrap{max-width:760px;margin:0 auto;padding:26px 20px 60px}
  header{text-align:center;border-bottom:3px double var(--rule);padding-bottom:14px;margin-bottom:22px}
  h1{font-size:34px;margin:0;letter-spacing:2px;font-variant:small-caps}
  header p{margin:4px 0 0;font-style:italic;color:#6b6152;font-size:15px}
  .dials{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;
    background:#efe8d8;border:1px solid var(--rule);border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px}
  .dials label{display:flex;flex-direction:column;gap:3px;font-variant:small-caps;letter-spacing:.5px;color:#6b6152}
  .dials select,.dials input[type=range]{font-family:inherit}
  button{font-family:Georgia,serif;cursor:pointer;background:#efe8d8;border:1px solid var(--accent);
    color:var(--ink);border-radius:6px;padding:7px 13px;font-size:14px;transition:.12s}
  button:hover{background:var(--accent);color:#fdf9ef}
  .strike{font-size:17px;padding:11px 26px;background:var(--accent);color:#fdf9ef;letter-spacing:1px;font-variant:small-caps}
  .strike:hover{filter:brightness(1.12)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:24px}
  .entry{background:#fbf7ec;border:1px solid var(--rule);border-radius:10px;padding:26px 28px;
    box-shadow:0 4px 18px rgba(90,70,40,.08)}
  .medallion{width:150px;height:150px;margin:0 auto 6px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#e8c98f,#c9973f 55%,#9a6a28 100%);
    display:flex;align-items:center;justify-content:center;text-align:center;
    box-shadow:inset 0 3px 8px rgba(255,255,255,.5),inset 0 -6px 12px rgba(0,0,0,.28),0 3px 10px rgba(0,0,0,.25);
    border:3px solid #b98a3f}
  .medallion span{font-size:20px;font-weight:bold;color:#3a2a12;padding:0 8px;
    font-variant:small-caps;text-shadow:0 1px 0 rgba(255,255,255,.4);word-break:break-word;line-height:1.1}
  .headline{text-align:center;margin:10px 0 4px}
  .hw{font-size:32px;font-weight:bold}
  .pos{font-style:italic;color:#6b6152;font-size:19px;margin-left:6px}
  .pron{text-align:center;color:var(--accent);font-size:16px;margin:0 0 16px;letter-spacing:.5px}
  .def{font-size:19px;margin:0 0 16px;text-align:center}
  .sec{font-variant:small-caps;letter-spacing:1px;color:#6b6152;font-size:12px;border-bottom:1px solid var(--rule);
    padding-bottom:3px;margin:18px 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;border:1px solid;transition:.12s;user-select:none}
  .chip:hover{transform:translateY(-2px)}
  .chip b{font-weight:bold}
  .chip .lang{font-size:10px;opacity:.75;margin-left:5px;font-variant:small-caps}
  .Gk{background:#dcf1ee;border-color:var(--gk);color:var(--gk)}
  .Lat{background:#f6e5dc;border-color:var(--lat);color:var(--lat)}
  .OE{background:#e7f0d8;border-color:var(--oe);color:var(--oe)}
  .example{font-style:italic;color:#4a4335;font-size:16px;margin:2px 0 0}
  .related{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;min-height:8px}
  .related button{font-size:13px;padding:5px 11px;font-style:italic}
  .tray{margin-top:30px;border-top:3px double var(--rule);padding-top:16px}
  .trayhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .trayhead h2{font-variant:small-caps;letter-spacing:1px;font-size:20px;margin:0}
  .trayhead .mini{font-size:12px;padding:5px 10px}
  ul.pins{list-style:none;padding:0;margin:14px 0 0}
  ul.pins li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:8px 4px;border-bottom:1px dotted var(--rule)}
  ul.pins .w{cursor:pointer}
  ul.pins .w:hover{color:var(--accent)}
  ul.pins .w b{font-size:17px}
  ul.pins .w i{color:#6b6152}
  ul.pins .gl{color:#6b6152;font-size:13px;flex:1}
  ul.pins .x{border:none;background:none;color:#a33;padding:0 6px;font-size:16px}
  ul.pins .x:hover{background:none;color:#c00}
  .empty{color:#8a7f6c;font-style:italic;font-size:14px;margin-top:10px}
  footer{text-align:center;color:#8a7f6c;font-size:12px;margin-top:34px;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Coinery</h1>
    <p>A word mint — striking brand-new English words with etymology-true definitions.</p>
  </header>

  <div class="dials">
    <label>Length
      <input id="d-len" type="range" min="2" max="4" step="1" value="3">
      <span id="lenval" style="text-transform:none;font-variant:normal;color:var(--accent)"></span>
    </label>
    <label>Origin
      <select id="d-pur">
        <option value="mix">Mixed</option>
        <option value="gk">Pure Greek</option>
        <option value="lat">Pure Latin</option>
      </select>
    </label>
    <label>Register
      <select id="d-reg">
        <option value="common">Common</option>
        <option value="rare" selected>Scholarly</option>
        <option value="arcane">Arcane</option>
      </select>
    </label>
  </div>

  <div class="toolbar">
    <button class="strike" id="strike">◉ Strike a coin</button>
    <button id="wotd">Word of the Day</button>
    <button id="speak">🔊 Pronounce</button>
    <button id="copytxt">Copy text</button>
    <button id="copyimg">Copy card image</button>
    <button id="pin">Pin</button>
  </div>

  <div class="entry" id="entry"></div>

  <div class="tray">
    <div class="trayhead">
      <h2>Coin Tray</h2>
      <div>
        <button class="mini" id="export">Export</button>
        <button class="mini" id="import">Import</button>
        <button class="mini" id="print">Print page</button>
      </div>
    </div>
    <ul class="pins" id="pins"></ul>
    <div class="empty" id="empty">No coins pinned yet — strike one and press Pin.</div>
  </div>

  <footer>Every word here is invented. Definitions are composed from the literal glosses of real morphemes.</footer>
</div>
<input type="file" id="importfile" accept="application/json" hidden>

<script>
"use strict";
// ---------- Morpheme banks (o = origin: Gk / Lat / OE) ----------
const PRE = [
  ["a","without","Gk"],["anti","against","Gk"],["auto","self","Gk"],["dia","across","Gk"],
  ["epi","upon","Gk"],["hyper","over","Gk"],["hypo","under","Gk"],["meta","beyond","Gk"],
  ["para","beside","Gk"],["peri","around","Gk"],["syn","together","Gk"],["endo","within","Gk"],
  ["exo","outside","Gk"],["neo","new","Gk"],
  ["ab","away from","Lat"],["ad","toward","Lat"],["circum","around","Lat"],["contra","against","Lat"],
  ["extra","beyond","Lat"],["inter","between","Lat"],["intra","within","Lat"],["post","after","Lat"],
  ["pre","before","Lat"],["sub","beneath","Lat"],["super","above","Lat"],["trans","across","Lat"],
  ["ultra","beyond","Lat"],["retro","backward","Lat"],
  ["fore","before","OE"],["over","above","OE"],["under","beneath","OE"]
].map(a=>({m:a[0],g:a[1],o:a[2],t:"P"}));

const ROOT = [
  ["bio","life","Gk"],["nykt","night","Gk"],["helio","the sun","Gk"],["astro","a star","Gk"],
  ["chron","time","Gk"],["psych","the soul","Gk"],["phon","sound","Gk"],["morph","form","Gk"],
  ["phos","light","Gk"],["hydro","water","Gk"],["pyr","fire","Gk"],["geo","the earth","Gk"],
  ["cosmo","the world","Gk"],["anthrop","humankind","Gk"],["dendro","a tree","Gk"],["ornith","a bird","Gk"],
  ["ichthy","a fish","Gk"],["gastro","the belly","Gk"],["neuro","the nerves","Gk"],["lith","stone","Gk"],
  ["aqua","water","Lat"],["luc","light","Lat"],["noct","night","Lat"],["sol","the sun","Lat"],
  ["luna","the moon","Lat"],["terra","the earth","Lat"],["ver","truth","Lat"],["voc","the voice","Lat"],
  ["mort","death","Lat"],["vita","life","Lat"],["cord","the heart","Lat"],["man","the hand","Lat"],
  ["ped","the foot","Lat"],["sang","blood","Lat"],["flor","a flower","Lat"],["silv","the forest","Lat"],
  ["somn","sleep","Lat"],["ign","fire","Lat"],["avi","a bird","Lat"],["pisc","a fish","Lat"],
  ["dream","a dream","OE"],["moon","the moon","OE"],["wood","the wood","OE"],["stone","stone","OE"]
].map(a=>({m:a[0],g:a[1],o:a[2],t:"R"}));

// suffix: [m, gloss, origin, pos, band, definition-template({X})]
const SUF = [
  ["ous","full of","Lat","adj","common","full of {X}"],
  ["ic","of","Gk","adj","common","relating to {X}"],
  ["al","of","Lat","adj","common","pertaining to {X}"],
  ["ful","full of","OE","adj","common","abounding in {X}"],
  ["less","without","OE","adj","common","having no {X}"],
  ["ify","to make","Lat","verb","common","to fill with {X}"],
  ["ize","to make","Gk","verb","common","to turn into {X}"],
  ["ist","practitioner","Gk","noun","common","one devoted to {X}"],
  ["ism","doctrine","Gk","noun","common","the belief in {X}"],
  ["ling","little one","OE","noun","common","a small being born of {X}"],
  ["dom","domain","OE","noun","common","the realm of {X}"],
  ["wise","in the way of","OE","adv","common","in the manner of {X}"],
  ["phile","lover of","Gk","noun","rare","one who loves {X}"],
  ["phobe","fearer of","Gk","noun","rare","one who fears {X}"],
  ["logy","study of","Gk","noun","rare","the study of {X}"],
  ["graphy","writing of","Gk","noun","rare","the recording of {X}"],
  ["metry","measure of","Gk","noun","rare","the measurement of {X}"],
  ["oid","resembling","Gk","adj","rare","resembling {X}"],
  ["escent","becoming","Lat","adj","rare","gradually becoming like {X}"],
  ["phone","sound","Gk","noun","rare","a sound made of {X}"],
  ["scope","viewer","Gk","noun","rare","an instrument for viewing {X}"],
  ["genic","producing","Gk","adj","rare","giving rise to {X}"],
  ["mancy","divination","Gk","noun","arcane","divination by means of {X}"],
  ["cracy","rule","Gk","noun","arcane","rule founded on {X}"],
  ["archy","rule","Gk","noun","arcane","government founded on {X}"],
  ["naut","voyager","Gk","noun","arcane","a voyager through {X}"],
  ["itis","inflammation","Gk","noun","arcane","an inflammation caused by {X}"],
  ["arium","place for","Lat","noun","arcane","a place devoted to {X}"]
].map(a=>({m:a[0],g:a[1],o:a[2],pos:a[3],band:a[4],def:a[5],t:"S"}));

const EXAMPLES = {
  noun:["Every scholar dreams of one day encountering a true {w}.",
        "The old dictionary listed {w} between two forgotten words.",
        "She kept {an} {w} on her desk as a private talisman."],
  adj:["It was the most {w} evening the village had ever known.",
       "Critics called the quiet little work strangely {w}.",
       "There was something {w} in the way the light fell."],
  verb:["The council voted to {w} the ancient hall by spring.",
        "He promised to {w} the whole garden before dawn.",
        "They gathered to {w} the river under the full moon."],
  adv:["She crossed the room {w}, as if pulled by the tide.",
       "He answered {w}, and no one dared to reply.",
       "The old clock ticked {w} through the long night."]
};
const POSABBR={noun:"n.",adj:"adj.",verb:"v.",adv:"adv."};

// ---------- PRNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedNum(st){let h=st.seed>>>0;h=(h*31+st.len)>>>0;h=(h*31+({gk:1,lat:2,mix:3}[st.pur]))>>>0;h=(h*31+({common:1,rare:2,arcane:3}[st.reg]))>>>0;if(st.force)for(const c of st.force)h=(h*31+c.charCodeAt(0))>>>0;return h>>>0;}
function findMorph(m){return PRE.concat(ROOT,SUF).find(x=>x.m===m);}

// ---------- Word assembly with phonotactic smoothing ----------
function assemble(parts){
  let w="",prevO="";const V="aeiou";
  parts.forEach(p=>{
    let seg=p.m;
    if(!w){w=seg;prevO=p.o;return;}
    const a=w.slice(-1).toLowerCase(),b=seg[0].toLowerCase();
    if(V.includes(a)&&V.includes(b)) w=w.slice(0,-1);                 // elide adjacent vowels
    else if(!V.includes(a)&&!V.includes(b)&&prevO!=="OE"&&p.o!=="OE") // insert connecting vowel
      w+=(prevO==="Lat"?"i":"o");
    w+=seg;prevO=p.o;
  });
  return w.charAt(0).toUpperCase()+w.slice(1);
}
function respell(w){
  let s=w.toLowerCase().replace(/ph/g,"f").replace(/qu/g,"kw").replace(/x/g,"ks")
        .replace(/c(?=[eiy])/g,"s").replace(/c/g,"k").replace(/y/g,"i");
  // break VC*V: a single consonant joins the following vowel (v·c); in a
  // cluster only the last consonant carries over (vc…·c), so clusters split.
  let sy=s.replace(/([aeiou]+)([^aeiou]+)(?=[aeiou])/g,
        (m,v,c)=>c.length>1?v+c.slice(0,-1)+"·"+c.slice(-1):v+"·"+c).split("·");
  const n=sy.length,st=n>=3?n-3:0;
  return "/"+sy.map((x,i)=>i===st?"ˈ"+x.toUpperCase():x).join("·")+"/";
}

// ---------- Coin (deterministic entry) ----------
function coin(st){
  const rng=mulberry32(seedNum(st));
  const pick=arr=>arr[Math.floor(rng()*arr.length)];
  const okO=o=>st.pur==="mix"||(st.pur==="gk"&&o==="Gk")||(st.pur==="lat"&&o==="Lat");
  const filt=(arr,fb)=>{const f=arr.filter(x=>okO(x.o));return f.length?f:(fb||arr);};
  const pref=filt(PRE),roots=filt(ROOT);
  let sufPool=SUF.filter(x=>x.band===st.reg);
  const sp=sufPool.filter(x=>okO(x.o));if(sp.length)sufPool=sp;
  let roles;
  if(st.len===2)roles=["R","S"];
  else if(st.len===3)roles=rng()<0.5?["P","R","S"]:["R","R","S"];
  else roles=["P","R","R","S"];
  let parts=roles.map(r=>r==="P"?pick(pref):r==="R"?pick(roots):pick(sufPool));
  if(st.force){
    const fm=findMorph(st.force);
    if(fm){
      if(fm.t==="S"){parts[parts.length-1]=fm;}
      else if(fm.t==="P"){if(roles[0]==="P")parts[0]=fm;else{parts.unshift(fm);roles.unshift("P");}}
      else{const i=roles.indexOf("R");if(i>=0)parts[i]=fm;}
    }
  }
  const suf=parts[parts.length-1];
  const head=assemble(parts);
  const stem=parts.slice(0,-1).map(p=>p.g).join(" ");
  let def=suf.def.replace("{X}",stem);def=def.charAt(0).toUpperCase()+def.slice(1);
  const tmpl=EXAMPLES[suf.pos];
  const art="aeiou".includes(head[0].toLowerCase())?"an":"a";
  const ex=tmpl[Math.floor(rng()*tmpl.length)].replace("{an}",art).replace("{w}",head.toLowerCase());
  return {head,pos:POSABBR[suf.pos],pron:respell(head),def,example:ex,
          chips:parts.map(p=>({m:p.m,g:p.g,o:p.o}))};
}

// ---------- State + URL hash ----------
let state={seed:0,len:3,pur:"mix",reg:"rare",force:null};
function readHash(){
  const h=location.hash.slice(1);if(!h)return false;
  const p=new URLSearchParams(h);
  if(!p.has("s"))return false;
  state={seed:(parseInt(p.get("s"),10)||0)>>>0,
    len:Math.min(4,Math.max(2,parseInt(p.get("l"),10)||3)),
    pur:["mix","gk","lat"].includes(p.get("p"))?p.get("p"):"mix",
    reg:["common","rare","arcane"].includes(p.get("r"))?p.get("r"):"rare",
    force:p.get("f")&&findMorph(p.get("f"))?p.get("f"):null};
  return true;
}
function writeHash(){
  const p=new URLSearchParams();
  p.set("s",state.seed);p.set("l",state.len);p.set("p",state.pur);p.set("r",state.reg);
  if(state.force)p.set("f",state.force);
  history.replaceState(null,"","#"+p.toString());
}
// UTC-based so the Word of the Day is globally identical regardless of timezone.
function daySeed(){const d=new Date();return(d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate())>>>0;}

// ---------- Render ----------
const $=id=>document.getElementById(id);
let current=null;
function render(){
  $("d-len").value=state.len;$("d-pur").value=state.pur;$("d-reg").value=state.reg;
  $("lenval").textContent={2:"compound (2)",3:"triadic (3)",4:"quadratic (4)"}[state.len];
  const c=coin(state);current=c;
  const chips=c.chips.map(ch=>`<span class="chip ${ch.o}" data-m="${ch.m}"><b>${ch.m}-</b> ${ch.g}<span class="lang">${ch.o}</span></span>`).join("");
  const L=c.head.length,fs=L<=6?26:L<=10?22:L<=14?18:L<=18?15:12;
  $("entry").innerHTML=
    `<div class="medallion"><span style="font-size:${fs}px;line-height:1.05">${c.head}</span></div>
     <div class="headline"><span class="hw">${c.head}</span><span class="pos">${c.pos}</span></div>
     <p class="pron">${c.pron}</p>
     <p class="def">${c.def}</p>
     <div class="sec">Etymology &mdash; click any part to explore</div>
     <div class="chips">${chips}</div>
     <div class="related" id="related"></div>
     <div class="sec">Usage</div>
     <p class="example">&ldquo;${c.example}&rdquo;</p>`;
  $("pin").textContent=isPinned()?"Unpin":"Pin";
  writeHash();
}
function exploreMorph(m){
  const strip=$("related");if(!strip)return;
  const base=state.seed;let html="<b style='font-variant:small-caps;color:#6b6152;font-size:12px'>shares “"+m+"”:&nbsp;</b>";
  for(let i=1;i<=6;i++){
    const s={seed:(base*131+i*977)>>>0,len:state.len,pur:state.pur,reg:state.reg,force:m};
    const rc=coin(s);
    html+=`<button data-s='${JSON.stringify(s)}'>${rc.head}</button>`;
  }
  strip.innerHTML=html;
}

// ---------- Coin tray (localStorage) ----------
const KEY="coinery.tray";
function tray(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];}}
function saveTray(t){localStorage.setItem(KEY,JSON.stringify(t));renderTray();}
function stKey(s){return[s.seed,s.len,s.pur,s.reg,s.force||""].join("|");}
function isPinned(){return tray().some(s=>stKey(s)===stKey(state));}
function togglePin(){
  let t=tray();const k=stKey(state);
  if(t.some(s=>stKey(s)===k))t=t.filter(s=>stKey(s)!==k);
  else t.push({...state});
  saveTray(t);$("pin").textContent=isPinned()?"Unpin":"Pin";
}
function renderTray(){
  const t=tray();$("empty").style.display=t.length?"none":"block";
  $("pins").innerHTML=t.map((s,i)=>{const c=coin(s);
    return `<li><span class="w" data-i="${i}"><b>${c.head}</b> <i>${c.pos}</i></span>
      <span class="gl">${c.def}</span>
      <button class="x" data-del="${i}" title="remove">✕</button></li>`;}).join("");
}

// ---------- Card image export ----------
function cardImage(cb){
  const c=current,W=620,H=340,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  x.fillStyle="#fbf7ec";x.fillRect(0,0,W,H);
  x.strokeStyle="#c9973f";x.lineWidth=6;x.strokeRect(10,10,W-20,H-20);
  x.textAlign="center";x.fillStyle="#2b2620";
  x.font="bold 40px Georgia";x.fillText(c.head,W/2,68);
  x.font="italic 20px Georgia";x.fillStyle="#8a5a2b";x.fillText(c.pos+"   "+c.pron,W/2,98);
  x.font="22px Georgia";x.fillStyle="#2b2620";
  wrap(x,c.def,W/2,138,W-80,26);
  // chips
  const cols={Gk:"#0f766e",Lat:"#9a3412",OE:"#3f6212"};
  x.font="15px Georgia";x.textAlign="left";
  let cx=40,cy=228;
  c.chips.forEach(ch=>{const label=ch.m+"- "+ch.g;const w=x.measureText(label).width+22;
    if(cx+w>W-40){cx=40;cy+=34;}
    x.fillStyle=cols[ch.o];x.globalAlpha=.14;roundRect(x,cx,cy-19,w,26,13);x.fill();x.globalAlpha=1;
    x.strokeStyle=cols[ch.o];x.lineWidth=1;roundRect(x,cx,cy-19,w,26,13);x.stroke();
    x.fillStyle=cols[ch.o];x.fillText(label,cx+11,cy-1);cx+=w+8;});
  x.textAlign="center";x.font="italic 15px Georgia";x.fillStyle="#4a4335";
  wrap(x,"“"+c.example+"”",W/2,H-34,W-70,20);
  cv.toBlob(cb);
}
function wrap(x,text,cx,y,max,lh){const words=text.split(" ");let line="",yy=y;
  for(const w of words){const t=line+w+" ";if(x.measureText(t).width>max&&line){x.fillText(line.trim(),cx,yy);line=w+" ";yy+=lh;}else line=t;}
  x.fillText(line.trim(),cx,yy);}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

// ---------- Print page of pins ----------
function printPage(){
  const t=tray();const body=t.map(s=>{const c=coin(s);
    return `<div class="e"><span class="h">${c.head}</span> <i>${c.pos}</i> <span class="p">${c.pron}</span>
      <div class="d">${c.def}</div>
      <div class="et">${c.chips.map(ch=>ch.m+"- ("+ch.o+") "+ch.g).join(" · ")}</div>
      <div class="x">&ldquo;${c.example}&rdquo;</div></div>`;}).join("");
  const w=window.open("","_blank");
  w.document.write(`<html><head><title>Coinery — Dictionary Page</title><style>
    body{font-family:Georgia,serif;color:#2b2620;max-width:640px;margin:30px auto;padding:0 20px}
    h1{text-align:center;font-variant:small-caps;letter-spacing:2px;border-bottom:3px double #999;padding-bottom:8px}
    .e{margin:16px 0;padding-bottom:12px;border-bottom:1px dotted #bbb}
    .h{font-size:22px;font-weight:bold}.p{color:#8a5a2b}.d{font-size:17px;margin:4px 0}
    .et{font-size:12px;color:#666;font-variant:small-caps}.x{font-style:italic;color:#555;margin-top:4px}
  </style></head><body><h1>Coinery — Collected Coinages</h1>${body||"<p>No pinned words.</p>"}</body></html>`);
  w.document.close();w.focus();setTimeout(()=>w.print(),250);
}

// ---------- Events ----------
$("strike").onclick=()=>{state.seed=(Math.random()*4294967295)>>>0;state.force=null;render();};
$("wotd").onclick=function(){state.seed=daySeed();state.force=null;render();flash(this,"Today's word");};
$("d-len").oninput=()=>{state.len=+$("d-len").value;render();};
$("d-pur").onchange=()=>{state.pur=$("d-pur").value;render();};
$("d-reg").onchange=()=>{state.reg=$("d-reg").value;render();};
$("speak").onclick=function(){if(!current)return;
  if(!window.speechSynthesis){flash(this,"No voice support");return;}
  const u=new SpeechSynthesisUtterance(current.head);u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);
  flash(this,"🔊 Speaking…");};
$("copytxt").onclick=function(){const c=current;if(!c)return;const btn=this;
  const txt=`${c.head} ${c.pos} ${c.pron}\n${c.def}\nfrom: ${c.chips.map(ch=>ch.m+"- ("+ch.o+") "+ch.g).join(" + ")}\ne.g. "${c.example}"\n${location.href}`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>flash(btn,"Copied!"),()=>fallbackCopy(txt,btn));
  }else fallbackCopy(txt,btn);};
function fallbackCopy(txt,btn){
  try{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");document.body.removeChild(ta);
    flash(btn,ok?"Copied!":"Copy failed — serve over http");
  }catch(e){flash(btn,"Copy failed — serve over http");}}
$("copyimg").onclick=function(){if(!current)return;const b=this;cardImage(blob=>{
  if(navigator.clipboard&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(()=>flash(b,"Image copied!"),()=>dl(blob));
  }else dl(blob);});};
function dl(blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=current.head+".png";a.click();}
$("pin").onclick=togglePin;
$("export").onclick=()=>{const blob=new Blob([JSON.stringify(tray(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="coinery-tray.json";a.click();};
$("import").onclick=()=>$("importfile").click();
$("importfile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const arr=JSON.parse(r.result);if(Array.isArray(arr)){
    const seen={},merged=tray().concat(arr).filter(s=>{const k=stKey(s);return seen[k]?false:(seen[k]=1);});
    saveTray(merged);}}catch(err){alert("Invalid tray file.");}};r.readAsText(f);e.target.value="";};
$("print").onclick=printPage;
document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip");if(chip){exploreMorph(chip.dataset.m);return;}
  const rel=e.target.closest("#related button");if(rel){state=JSON.parse(rel.dataset.s);render();return;}
  const w=e.target.closest(".w");if(w){state={...tray()[+w.dataset.i]};render();window.scrollTo({top:0,behavior:"smooth"});return;}
  const del=e.target.closest("[data-del]");if(del){const t=tray();t.splice(+del.dataset.del,1);saveTray(t);
    $("pin").textContent=isPinned()?"Unpin":"Pin";}
});
function flash(btn,msg){const o=btn.textContent;btn.textContent=msg;setTimeout(()=>btn.textContent=o,1200);}
window.addEventListener("hashchange",()=>{if(readHash())render();});
// Space / Enter strikes a fresh coin (unless typing in a form control).
document.addEventListener("keydown",e=>{
  const t=e.target,tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA"||tag==="BUTTON")return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();$("strike").click();}});

// ---------- Boot ----------
if(!readHash())state.seed=daySeed();
render();renderTray();$("strike").focus();
</script>
</body>
