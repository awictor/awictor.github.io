<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base58 — Bitcoin-style Base58 encoder / decoder</title>
<meta name="description" content="Free offline Base58 encoder and decoder using the Bitcoin alphabet. Convert text to and from Base58, with leading-zero handling. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/base58/">
<style>
  :root{
    --c:#292524; --bg:#f8f7f6; --fg:#1c1917; --muted:#57534e;
    --card:#ffffff; --border:#e4e1de; --code:#efece9;
  }
  [data-theme="dark"]{
    --bg:#0c0a09; --fg:#e8e4e0; --muted:#8f8880; --card:#171412;
    --border:#2a2521; --code:#1d1916;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:24px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#78716c);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:700}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:820px;margin:0 auto;padding:6px 20px 60px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:14px}
  .seg button{background:var(--card);border:none;color:var(--fg);padding:9px 16px;cursor:pointer;
    font-size:.86rem;border-right:1px solid var(--border);font-weight:600}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .pane .h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);
    font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:7px;padding:3px 11px;cursor:pointer;font-size:.72rem;text-transform:none;letter-spacing:0}
  .copy:hover{color:var(--c);border-color:var(--c)}
  textarea,pre{border:none;background:none;color:var(--fg);min-height:360px;margin:0;padding:15px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95rem;line-height:1.6;width:100%}
  textarea{resize:vertical}
  textarea:focus{outline:none}
  pre{overflow:auto;white-space:pre-wrap;word-break:break-all}
  pre.err{color:#dc2626}
  footer{max-width:820px;margin:0 auto;padding:14px 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('b58.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">58</div>
  <div>
    <h1>Base58</h1>
    <p class="sub">Bitcoin-style encoder / decoder</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="seg" id="mode">
    <button data-m="encode" class="on">Encode</button>
    <button data-m="decode">Decode</button>
  </div>
  <div class="grid">
    <div class="pane">
      <div class="h" id="inHead">Text</div>
      <textarea id="in" spellcheck="false">Hello World!</textarea>
    </div>
    <div class="pane">
      <div class="h" id="outHead">Base58 <button class="copy" id="copy">Copy</button></div>
      <pre id="out"></pre>
    </div>
  </div>
</main>
<footer>
  Base58 is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/base58">Source</a>
</footer>

<script>
// ---- pure functions ----
var ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'; // no 0 O I l
function textToBytes(str){
  var u = unescape(encodeURIComponent(String(str)));
  var out = [];
  for(var i = 0; i < u.length; i++) out.push(u.charCodeAt(i) & 0xff);
  return out;
}
function bytesToText(bytes){
  var s = '';
  for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  try{ return decodeURIComponent(escape(s)); }catch(e){ return s; }
}
function base58Encode(bytes){
  bytes = Array.prototype.slice.call(bytes);
  var zeros = 0;
  while(zeros < bytes.length && bytes[zeros] === 0) zeros++;
  var digits = [];
  for(var i = zeros; i < bytes.length; i++){
    var carry = bytes[i] & 0xff;
    for(var j = 0; j < digits.length; j++){
      carry += digits[j] << 8;
      digits[j] = carry % 58;
      carry = (carry / 58) | 0;
    }
    while(carry > 0){ digits.push(carry % 58); carry = (carry / 58) | 0; }
  }
  var out = '';
  for(var z = 0; z < zeros; z++) out += '1';
  for(var d = digits.length - 1; d >= 0; d--) out += ALPHABET.charAt(digits[d]);
  return out;
}
function base58Decode(str){
  str = String(str);
  var zeros = 0;
  while(zeros < str.length && str.charAt(zeros) === '1') zeros++;
  var bytes = [];
  for(var i = zeros; i < str.length; i++){
    var val = ALPHABET.indexOf(str.charAt(i));
    if(val < 0) return null;
    var carry = val;
    for(var j = 0; j < bytes.length; j++){
      carry += bytes[j] * 58;
      bytes[j] = carry & 0xff;
      carry >>= 8;
    }
    while(carry > 0){ bytes.push(carry & 0xff); carry >>= 8; }
  }
  var out = [];
  for(var z = 0; z < zeros; z++) out.push(0);
  for(var b = bytes.length - 1; b >= 0; b--) out.push(bytes[b]);
  return out;
}
function encodeText(str){ return base58Encode(textToBytes(str)); }
function decodeText(b58){ var b = base58Decode(String(b58).trim()); return b === null ? null : bytesToText(b); }

if(typeof module !== 'undefined') module.exports = {
  ALPHABET, textToBytes, bytesToText, base58Encode, base58Decode, encodeText, decodeText
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  var modeEl = document.getElementById('mode');
  var mode = 'encode';
  function setHeads(){
    document.getElementById('inHead').textContent = mode === 'encode' ? 'Text' : 'Base58';
    document.getElementById('outHead').firstChild.textContent = mode === 'encode' ? 'Base58 ' : 'Text ';
  }
  function render(){
    outEl.className = '';
    if(mode === 'encode'){ outEl.textContent = encodeText(inEl.value); }
    else {
      var r = decodeText(inEl.value);
      if(r === null){ outEl.className = 'err'; outEl.textContent = '⚠ Invalid Base58 (no 0, O, I, or l).'; }
      else outEl.textContent = r;
    }
    try{ localStorage.setItem('b58.in.' + mode, inEl.value); }catch(e){}
  }
  modeEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    mode = b.getAttribute('data-m');
    [].forEach.call(modeEl.querySelectorAll('button'), function(x){ x.className = (x === b) ? 'on' : ''; });
    setHeads();
    var saved = null; try{ saved = localStorage.getItem('b58.in.' + mode); }catch(e){}
    inEl.value = saved !== null ? saved : (mode === 'encode' ? 'Hello World!' : '2NEpo7TZRRrLZSi2U');
    render();
  });
  inEl.addEventListener('input', render);
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.textContent);
    this.textContent = 'Copied'; var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  setHeads();
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('b58.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('b58.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
