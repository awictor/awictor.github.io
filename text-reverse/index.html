<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextReverse — reverse text, words, lines &amp; flip upside down</title>
<meta name="description" content="Free offline text reverser. Reverse characters, reverse word order, reverse line order, or flip text upside down. Emoji-safe. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/text-reverse/">
<style>
  :root{
    --c:#431407; --bg:#fcf8f4; --fg:#20140b; --muted:#775f48;
    --card:#ffffff; --border:#ece0d3; --code:#f6ede1;
  }
  [data-theme="dark"]{
    --bg:#150e07; --fg:#f1e8dc; --muted:#b49d84; --card:#221810;
    --border:#3a2a1b; --code:#2c2013;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#c2410c);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  textarea{width:100%;min-height:110px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;
    background:var(--bg);color:var(--fg);font-size:.98rem;line-height:1.55;resize:vertical;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .modes{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
  .modes button{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:9px;
    padding:8px 14px;cursor:pointer;font-size:.86rem;font-weight:600}
  .modes button.on{background:var(--c);color:#fff;border-color:var(--c)}
  .out-head{display:flex;align-items:center;margin-top:8px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  .hint{color:var(--muted);font-size:.82rem;margin:14px 0 0}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('rev.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">⇄</div>
  <div>
    <h1>TextReverse</h1>
    <p class="sub">Reverse &amp; flip text</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <label for="in">Text</label>
    <textarea id="in" spellcheck="false">Hello, World!</textarea>
    <div class="modes" id="modes">
      <button data-m="chars" class="on">Characters</button>
      <button data-m="words">Words</button>
      <button data-m="lines">Lines</button>
      <button data-m="upside">Upside down</button>
    </div>
    <div class="out-head">
      <label style="margin:0">Result</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <textarea id="out" spellcheck="false" readonly></textarea>
    <p class="hint">Character reversal is emoji-safe (works on full code points). "Words" reverses word
      order, "Lines" reverses line order, "Upside down" flips letters for social bios. Runs locally.</p>
  </div>
</main>
<footer>
  TextReverse is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/text-reverse">Source</a>
</footer>

<script>
// ---- pure functions ----
function reverseChars(text){
  return Array.from(String(text)).reverse().join('');
}
function reverseWords(text){
  var t = String(text).trim();
  if(t === '') return '';
  return t.split(/\s+/).reverse().join(' ');
}
function reverseLines(text){
  return String(text).split('\n').reverse().join('\n');
}
var FLIP = {
  a:'ɐ', b:'q', c:'ɔ', d:'p', e:'ǝ', f:'ɟ', g:'ƃ', h:'ɥ',
  i:'ᴉ', j:'ɾ', k:'ʞ', l:'l', m:'ɯ', n:'u', o:'o', p:'d', q:'b',
  r:'ɹ', s:'s', t:'ʇ', u:'n', v:'ʌ', w:'ʍ', x:'x', y:'ʎ', z:'z',
  '.':'˙', ',': "'", '?':'¿', '!':'¡', '(':')', ')':'(',
  '[':']', ']':'[', '{':'}', '}':'{', '<':'>', '>':'<', '_':'‾', '&':'⅋'
};
function upsideDown(text){
  return Array.from(String(text).toLowerCase())
    .map(function(c){ return FLIP[c] || c; })
    .reverse().join('');
}
function transform(text, mode){
  if(mode === 'words') return reverseWords(text);
  if(mode === 'lines') return reverseLines(text);
  if(mode === 'upside') return upsideDown(text);
  return reverseChars(text);
}

if(typeof module !== 'undefined') module.exports = {
  reverseChars, reverseWords, reverseLines, upsideDown, transform, FLIP
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  var modesEl = document.getElementById('modes');
  var mode = 'chars';
  function render(){
    outEl.value = transform(inEl.value, mode);
    try{ localStorage.setItem('rev.in', inEl.value); localStorage.setItem('rev.mode', mode); }catch(e){}
  }
  modesEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    mode = b.getAttribute('data-m');
    [].forEach.call(modesEl.querySelectorAll('button'), function(x){ x.className = (x === b) ? 'on' : ''; });
    render();
  });
  inEl.addEventListener('input', render);
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.value);
    this.textContent = 'Copied'; var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var si = localStorage.getItem('rev.in'); if(si !== null) inEl.value = si;
    var sm = localStorage.getItem('rev.mode');
    if(sm){ mode = sm; [].forEach.call(modesEl.querySelectorAll('button'), function(x){
      x.className = (x.getAttribute('data-m') === sm) ? 'on' : ''; }); }
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('rev.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('rev.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
