<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ByteSize — data size converter &amp; humanizer</title>
<meta name="description" content="Free offline data size converter. Convert between bytes, KB, MB, GB, TB in decimal (1000) or binary (1024, KiB/MiB) units, and get a human-readable best-fit size. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/byte-size/">
<style>
  :root{
    --c:#155e75; --bg:#f5fafb; --fg:#0f2027; --muted:#557079;
    --card:#ffffff; --border:#d8e7ea; --code:#e6f2f4;
  }
  [data-theme="dark"]{
    --bg:#0b1518; --fg:#e4eef1; --muted:#88a2aa; --card:#12222699; --card:#122226;
    --border:#22383d; --code:#182b30;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;
    display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#22d3ee);
    display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--fg);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:720px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .fld{flex:1;min-width:140px}
  input,select{width:100%;padding:12px 13px;border:1px solid var(--border);
    border-radius:11px;background:var(--bg);color:var(--fg);font-size:1.05rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  input:focus,select:focus{outline:2px solid var(--c);border-color:var(--c)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:16px}
  .seg button{background:var(--bg);border:none;color:var(--fg);padding:8px 15px;
    cursor:pointer;font-size:.86rem;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .err{color:#dc2626;font-size:.86rem;margin:12px 0 0;min-height:1.1em}
  .best{margin-top:18px;text-align:center;font-family:ui-monospace,monospace;
    font-size:2.2rem;font-weight:700;color:var(--c)}
  .best small{display:block;font-size:.8rem;color:var(--muted);font-weight:400;
    font-family:system-ui;margin-top:4px}
  .table{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cell{background:var(--card);padding:11px 14px;display:flex;justify-content:space-between}
  .cell .u{color:var(--muted);font-size:.85rem}
  .cell .v{font-family:ui-monospace,monospace;font-weight:600}
  .hint{color:var(--muted);font-size:.82rem;margin:16px 0 0}
  footer{max-width:720px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
  @media(max-width:520px){.table{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('bytesize.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">≡</div>
  <div>
    <h1>ByteSize</h1>
    <p class="sub">Data size converter &amp; humanizer</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="row">
      <div class="fld">
        <label for="val">Amount</label>
        <input id="val" value="1536" inputmode="decimal" spellcheck="false" placeholder="1536">
      </div>
      <div class="fld" style="max-width:130px;flex:0 0 130px">
        <label for="unit">Unit</label>
        <select id="unit"></select>
      </div>
    </div>
    <div class="seg" id="mode">
      <button data-m="dec" class="on">Decimal (1000)</button>
      <button data-m="bin">Binary (1024)</button>
    </div>
    <p class="err" id="err"></p>
    <div class="best" id="best"></div>
    <div class="table" id="table"></div>
    <p class="hint">Decimal uses powers of 1000 (KB, MB — how drives are marketed); binary uses
      powers of 1024 (KiB, MiB — how memory and most OSes count). Runs entirely in your browser.</p>
  </div>
</main>
<footer>
  ByteSize is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/byte-size">Source</a>
</footer>

<script>
// ---- pure functions ----
var DEC = ['B','KB','MB','GB','TB','PB'];
var BIN = ['B','KiB','MiB','GiB','TiB','PiB'];
function factorFor(unit){
  var i = DEC.indexOf(unit);
  if(i >= 0) return Math.pow(1000, i);
  i = BIN.indexOf(unit);
  if(i >= 0) return Math.pow(1024, i);
  return null;
}
function round(x, dp){ var f = Math.pow(10, dp); return Math.round(x * f) / f; }
function trimNum(x){ return parseFloat(x.toFixed(6)); }

function toBytes(value, unit){
  var f = factorFor(unit);
  value = Number(value);
  if(f == null || !isFinite(value)) return null;
  return value * f;
}
function convert(bytes, unit){
  var f = factorFor(unit);
  if(f == null || !isFinite(bytes)) return null;
  return bytes / f;
}
function humanize(bytes, binary, dp){
  if(!isFinite(bytes)) return null;
  dp = (dp == null) ? 2 : dp;
  var units = binary ? BIN : DEC;
  var base = binary ? 1024 : 1000;
  var neg = bytes < 0;
  bytes = Math.abs(bytes);
  var i = 0;
  while(bytes >= base && i < units.length - 1){ bytes /= base; i++; }
  var val = (i === 0) ? Math.round(bytes) : trimNum(round(bytes, dp));
  return (neg ? '-' : '') + val + ' ' + units[i];
}
function parseSize(str){
  var m = String(str).trim().match(/^([\d.]+)\s*([a-zA-Z]*)$/);
  if(!m) return null;
  var val = parseFloat(m[1]);
  if(!isFinite(val)) return null;
  var u = m[2] || 'B', found = null;
  [DEC, BIN].forEach(function(set){
    set.forEach(function(x){ if(x.toLowerCase() === u.toLowerCase()) found = x; });
  });
  if(!found) return null;
  return val * factorFor(found);
}

if(typeof module !== 'undefined') module.exports = {
  DEC, BIN, factorFor, toBytes, convert, humanize, parseSize
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var valEl = document.getElementById('val');
  var unitEl = document.getElementById('unit');
  var errEl = document.getElementById('err');
  var bestEl = document.getElementById('best');
  var tableEl = document.getElementById('table');
  var modeEl = document.getElementById('mode');
  var binary = false;

  function fillUnits(){
    var set = binary ? BIN : DEC;
    var cur = unitEl.value;
    unitEl.innerHTML = set.map(function(u){ return '<option value="'+u+'">'+u+'</option>'; }).join('');
    // keep same tier if switching modes
    var idx = DEC.indexOf(cur); if(idx < 0) idx = BIN.indexOf(cur); if(idx < 0) idx = 0;
    unitEl.value = set[idx];
  }
  function render(){
    var bytes = toBytes(valEl.value, unitEl.value);
    if(bytes === null){
      errEl.textContent = 'Enter a valid non-negative number.';
      bestEl.textContent = ''; tableEl.innerHTML = '';
      return;
    }
    errEl.textContent = '';
    bestEl.innerHTML = humanize(bytes, binary) + '<small>' +
      bytes.toLocaleString() + ' bytes</small>';
    var set = binary ? BIN : DEC;
    tableEl.innerHTML = set.map(function(u){
      return '<div class="cell"><span class="u">'+u+'</span><span class="v">'+
        trimNum(round(convert(bytes, u), 4)).toLocaleString()+'</span></div>';
    }).join('');
    try{
      localStorage.setItem('bytesize.val', valEl.value);
      localStorage.setItem('bytesize.unit', unitEl.value);
      localStorage.setItem('bytesize.bin', binary ? '1' : '0');
    }catch(e){}
  }
  modeEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    binary = b.getAttribute('data-m') === 'bin';
    [].forEach.call(modeEl.querySelectorAll('button'), function(x){
      x.className = (x === b) ? 'on' : ''; });
    fillUnits(); render();
  });
  valEl.addEventListener('input', render);
  unitEl.addEventListener('change', render);
  try{
    if(localStorage.getItem('bytesize.bin') === '1'){ binary = true;
      [].forEach.call(modeEl.querySelectorAll('button'), function(x){
        x.className = (x.getAttribute('data-m') === 'bin') ? 'on' : ''; }); }
  }catch(e){}
  fillUnits();
  try{
    var sv = localStorage.getItem('bytesize.val'); if(sv !== null) valEl.value = sv;
    var su = localStorage.getItem('bytesize.unit');
    if(su && (binary ? BIN : DEC).indexOf(su) >= 0) unitEl.value = su;
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('bytesize.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('bytesize.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
