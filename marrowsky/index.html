<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marrowsky — a tactile spoonerism bench</title>
<style>
  :root{
    --paper:#F5F3EF; --ink:#232F3E; --accent:#FF6100; --accent-soft:#ffe3d1;
    --line:#e3ddd2; --mut:#6f6a5e; --warn:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #fbf7f0, transparent),
      var(--paper);
    color:var(--ink); font:16px/1.5 "Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh; padding:28px 18px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  h1{font-size:34px;margin:0;letter-spacing:.5px;font-weight:800}
  h1 .k{color:var(--accent)}
  .sub{color:var(--mut);margin-top:4px;font-size:14.5px}
  .card{background:#fffdf9;border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 18px;box-shadow:0 6px 24px rgba(35,47,62,.06)}
  label.small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--mut);margin:0 0 6px}
  #phrase{width:100%;font-size:18px;padding:11px 13px;border:1px solid var(--line);
    border-radius:11px;background:var(--paper);color:var(--ink);outline:none}
  #phrase:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .hint{font-size:12.5px;color:var(--mut);margin-top:8px}
  #chips{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;margin:16px 0 6px;
    min-height:52px;touch-action:none}
  .chip{position:relative;display:inline-flex;align-items:baseline;
    background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
    padding:8px 12px;font-size:22px;cursor:pointer;user-select:none;
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .chip:hover{border-color:var(--accent);transform:translateY(-2px)}
  .chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
    transform:translateY(-2px)}
  .chip:focus{outline:none}
  .chip:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
    transform:translateY(-2px)}
  .chip.pop{animation:pop .35s ease}
  .chip.warn{border-color:var(--warn);border-style:dashed}
  .chip .pre,.chip .post{color:var(--mut)}
  .chip .onset{color:var(--accent);font-weight:800;cursor:grab}
  .chip.warn .onset{color:var(--warn)}
  .chip .rime{color:var(--ink)}
  .sep{align-self:center;color:var(--mut);font-size:22px}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  .ghost{position:fixed;z-index:60;color:var(--accent);font-weight:800;font-size:22px;
    pointer-events:none;will-change:transform}
  .result{margin:14px 0 4px;font-size:clamp(20px,4.4vw,30px);font-weight:700;
    line-height:1.35;min-height:38px}
  .result .o{color:var(--accent)}
  .meter-row{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .meter{flex:1;min-width:160px;height:12px;background:var(--paper);border:1px solid var(--line);
    border-radius:20px;overflow:hidden}
  .meter > i{display:block;height:100%;width:0;border-radius:20px;
    background:linear-gradient(90deg,#ffb37a,var(--accent));transition:width .45s ease}
  .meter-lbl{font-size:12.5px;color:var(--mut);white-space:nowrap}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  button{font:inherit;font-size:14px;padding:8px 13px;border-radius:10px;cursor:pointer;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
    transition:background .12s,border-color .12s,transform .08s}
  button:hover{border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button.primary:hover{background:#e85800}
  button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button.active:hover{background:#e85800}
  .bar-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar-div{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
  .modes{display:inline-flex;gap:0}
  .modes button{border-radius:0;border-left-width:0}
  .modes button:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px;border-left-width:1.5px}
  .modes button:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}
  .empty{color:var(--mut);font-size:14.5px;font-style:italic;padding:6px 2px}
  .warn-note{color:var(--warn);font-size:12.5px;margin:2px 0 0;min-height:0}
  .foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:20px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Marrow<span class="k">sky</span></h1>
    <div class="sub">A tactile spoonerism bench — grab the front of one word and slap it onto another.</div>
  </header>

  <div class="card">
    <label class="small" for="phrase">Your phrase</label>
    <input id="phrase" type="text" autocomplete="off" spellcheck="false"
           value="a loving shepherd">
    <div class="hint">Click two chips to swap their onsets, or <b>drag</b> a highlighted onset onto another word.</div>

    <div id="chips" aria-label="word chips"></div>
    <p class="warn-note" id="warnNote" role="alert" aria-live="polite"></p>

    <div class="result" id="result"></div>

    <div class="meter-row">
      <div class="meter" title="delight" role="progressbar" aria-label="delight meter"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><i id="meterFill"></i></div>
      <div class="meter-lbl" id="meterLbl">0 onsets moved</div>
    </div>

    <div class="bar" role="toolbar" aria-label="controls">
      <button class="primary" id="surprise">Surprise me</button>
      <span class="bar-div" aria-hidden="true"></span>
      <span class="modes" role="group" aria-label="auto modes">
        <button data-mode="adjacent">Adjacent</button>
        <button data-mode="classic">Classic</button>
        <button data-mode="shuffle">Shuffle</button>
      </span>
      <span class="bar-div" aria-hidden="true"></span>
      <span class="bar-group">
        <button id="reset">Reset</button>
        <button id="replay">Replay</button>
        <button id="speak">Read aloud</button>
        <button id="copy">Copy</button>
        <button id="share">Copy link</button>
        <button id="png">Save card</button>
      </span>
    </div>
  </div>

  <div class="foot">Marrowsky (archaic) — a spoonerism. Zero dependencies, one file, every twist is a shareable link.</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  var VOWELS="aeiou";
  // Valid English onsets (single consonants + real clusters). Anything else = hard to say.
  var OK = {};
  ("b c d f g h j k l m n p r s t v w y z qu "+
   "bl br ch cl cr dr fl fr gl gr pl pr sc scr sh shr sk sl sm sn sp spl spr squ "+
   "st str sw th thr tr tw wh wr ph gn kn sph dw gw thw").split(/\s+/)
   .forEach(function(o){ if(o) OK[o]=1; });

  var BANK = [
    "a loving shepherd","the dear old queen","a crushing blow","a well-boiled icicle",
    "a half-warmed fish","you have wasted the whole term","a pack of lies","the Lord is a loving shepherd",
    "three cheers for the dear old queen","a blushing crow","fighting a liar","let me show you to your seat",
    "so you tried to tackle the food","is the dean busy","cattle ships and bruisers","go and shake a tower",
    "she sells sea shells","peter piper picked a peck","fuzzy wuzzy was a bear","red lorry yellow lorry",
    "big black bug bit","fresh fried fish","she stood on the balcony","toy boat toy boat",
    "the plucky brave knight","a mangy tiger","a fine summer morning","a jelly-filled donut",
    "a rolling stone","the golden ticket","chunky monkey bread","silly sally swiftly"
  ];

  var $=function(s){return document.querySelector(s);};
  var inp=$("#phrase"), chipBox=$("#chips"), resEl=$("#result"),
      meterFill=$("#meterFill"), meterLbl=$("#meterLbl"), toastEl=$("#toast"),
      warnNote=$("#warnNote"), meter=$("#meter");
  var curMode=null; // active auto-mode, for button highlight

  // model
  var tokens=[];   // {pre, core, post, word:bool, home, rime}
  var words=[];    // token indices that are words
  var cur=[];      // current onset per word
  var swaps=[];    // list of [i,j] word-index pairs applied
  var caps=[];     // capitalized-first-letter flag per word
  var sel=null;

  function isVowel(ch,i){ return VOWELS.indexOf(ch)>=0 || (ch==="y" && i>0); }

  function onsetLen(core){
    var lc=core.toLowerCase(), n=0;
    while(n<lc.length && !isVowel(lc[n],n)) n++;
    if(lc[n-1]==="q" && lc[n]==="u") n++;      // keep "qu" together
    if(n===lc.length && n>1) n--;              // never eat the whole word
    return n;
  }

  function parse(phrase){
    tokens=[]; words=[]; cur=[]; caps=[]; swaps=[]; sel=null;
    phrase.split(/\s+/).forEach(function(raw){
      if(!raw) return;
      var m=raw.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'\-]*)?([^A-Za-z]*)$/);
      if(m && m[2]){
        var core=m[2], k=onsetLen(core);
        tokens.push({pre:m[1],core:core,post:m[3],word:true,
                     home:core.slice(0,k),rime:core.slice(k)});
      } else {
        tokens.push({pre:"",core:raw,post:"",word:false});
      }
    });
    tokens.forEach(function(t,ti){
      if(t.word){
        words.push(ti);
        cur.push(t.home);
        caps.push(/^[A-Z]/.test(t.core));
      }
    });
  }

  // build a word's final text pieces given a current onset
  function pieces(wi){
    var t=tokens[words[wi]], o=cur[wi], combined=(o+t.rime).toLowerCase();
    if(caps[wi] && combined) combined=combined[0].toUpperCase()+combined.slice(1);
    return {pre:t.pre,onset:combined.slice(0,o.length),rime:combined.slice(o.length),post:t.post};
  }

  function badOnset(wi){
    var o=cur[wi].toLowerCase();
    return o.length>0 && !OK[o];
  }

  function render(){
    chipBox.innerHTML="";
    if(words.length===0){
      var e=document.createElement("div"); e.className="empty";
      e.textContent="Type a phrase above and its words become chips to swap.";
      chipBox.appendChild(e);
      warnNote.textContent="";
      updateResult(); updateMeter(); syncModeButtons();
      return;
    }
    var bad=0;
    words.forEach(function(ti,wi){
      var p=pieces(wi), isBad=badOnset(wi); if(isBad) bad++;
      var chip=document.createElement("div");
      chip.className="chip"+(sel===wi?" sel":"")+(isBad?" warn":"");
      chip.dataset.w=wi;
      chip.tabIndex=0;
      chip.setAttribute("role","button");
      chip.setAttribute("aria-pressed", sel===wi ? "true" : "false");
      var label="onset "+(cur[wi]||"none")+", word "+resultWord(wi);
      if(isBad){ chip.title="hard to say — try another swap"; label+=" (hard to say)"; }
      chip.setAttribute("aria-label",label);
      chip.innerHTML=
        (p.pre?'<span class="pre">'+esc(p.pre)+'</span>':'')+
        '<span class="onset" draggable="false">'+esc(p.onset)+'</span>'+
        '<span class="rime">'+esc(p.rime)+'</span>'+
        (p.post?'<span class="post">'+esc(p.post)+'</span>':'');
      chipBox.appendChild(chip);
    });
    warnNote.textContent = bad ? "⚠ hard to say — one or more onsets form an unpronounceable cluster." : "";
    updateResult(); updateMeter(); syncModeButtons();
  }
  function syncModeButtons(){
    document.querySelectorAll("[data-mode]").forEach(function(b){
      b.classList.toggle("active", b.dataset.mode===curMode);
      b.setAttribute("aria-pressed", b.dataset.mode===curMode ? "true":"false");
    });
  }
  // plain-text of a single word for aria labels
  function resultWord(wi){ var p=pieces(wi); return p.pre+p.onset+p.rime+p.post; }

  function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

  function resultHTML(){
    var wi=0, out=[];
    tokens.forEach(function(t){
      if(t.word){ var p=pieces(wi++); out.push(esc(p.pre)+'<span class="o">'+esc(p.onset)+'</span>'+esc(p.rime)+esc(p.post)); }
      else out.push(esc(t.pre+t.core+t.post));
    });
    return out.join(" ");
  }
  function resultText(){
    var wi=0, out=[];
    tokens.forEach(function(t){
      if(t.word){ var p=pieces(wi++); out.push(p.pre+p.onset+p.rime+p.post); }
      else out.push(t.pre+t.core+t.post);
    });
    return out.join(" ");
  }
  function updateResult(){ resEl.innerHTML=resultHTML(); }

  function updateMeter(){
    var moved=0,allit=0,rhyme=0;
    words.forEach(function(_,wi){ if(cur[wi].toLowerCase()!==tokens[words[wi]].home.toLowerCase()) moved++; });
    for(var i=0;i+1<words.length;i++){
      var a=cur[i].toLowerCase(), b=cur[i+1].toLowerCase();
      if(a && a===b) allit++;
    }
    for(var x=0;x<words.length;x++) for(var y=x+1;y<words.length;y++){
      var ra=tokens[words[x]].rime.toLowerCase(), rb=tokens[words[y]].rime.toLowerCase();
      if(ra.length>=2 && ra===rb) rhyme++;
    }
    var score=Math.min(100, moved*15 + allit*22 + rhyme*10);
    meterFill.style.width=score+"%";
    if(meter) meter.setAttribute("aria-valuenow",String(score));
    var bits=[moved+" onset"+(moved!==1?"s":"")+" moved"];
    if(allit) bits.push(allit+" alliteration");
    if(rhyme) bits.push(rhyme+" rhyme");
    meterLbl.textContent=bits.join(" · ");
  }

  function swapCur(i,j){ var t=cur[i]; cur[i]=cur[j]; cur[j]=t; }

  function onsetEl(wi){ var c=chipBox.querySelector('.chip[data-w="'+wi+'"]'); return c?c.querySelector('.onset'):null; }

  // capture positions, run mutation callback (which re-renders), then fly ghosts
  function flyThen(i,j,cb){
    var ea=onsetEl(i), eb=onsetEl(j);
    var ra=ea&&ea.getBoundingClientRect(), rb=eb&&eb.getBoundingClientRect();
    var ta=ea?ea.textContent:"", tb=eb?eb.textContent:"";
    cb();
    if(!ra||!rb) return;
    ghost(ta,ra,rb); ghost(tb,rb,ra);
    var ci=chipBox.querySelector('.chip[data-w="'+i+'"]'), cj=chipBox.querySelector('.chip[data-w="'+j+'"]');
    [ci,cj].forEach(function(c){ if(c){c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");} });
  }
  function ghost(text,from,to){
    if(!text) return;
    var g=document.createElement("span"); g.className="ghost"; g.textContent=text;
    g.style.left=from.left+"px"; g.style.top=from.top+"px"; document.body.appendChild(g);
    var dx=to.left-from.left, dy=to.top-from.top;
    g.animate([
      {transform:"translate(0,0) scale(1) rotate(0deg)",opacity:1},
      {transform:"translate("+(dx/2)+"px,"+(dy/2-46)+"px) scale(1.25) rotate(8deg)",opacity:1,offset:.5},
      {transform:"translate("+dx+"px,"+dy+"px) scale(1) rotate(0deg)",opacity:.85}
    ],{duration:440,easing:"cubic-bezier(.34,1.4,.4,1)"}).onfinish=function(){g.remove();};
  }

  function applySwap(i,j){
    if(i===j) return;
    curMode=null; // manual swap diverges from any auto-mode
    flyThen(i,j,function(){ swapCur(i,j); swaps.push([i,j]); render(); });
    writeHash();
  }

  // ---- selection + drag (pointer based: works on mouse + touch) ----
  var down=null, dragging=false, dragGhost=null;
  chipBox.addEventListener("pointerdown",function(e){
    var chip=e.target.closest(".chip"); if(!chip) return;
    down={w:+chip.dataset.w,x:e.clientX,y:e.clientY};
    dragging=false;
    chipBox.setPointerCapture(e.pointerId);
  });
  chipBox.addEventListener("pointermove",function(e){
    if(!down) return;
    if(!dragging && Math.hypot(e.clientX-down.x,e.clientY-down.y)>7){
      dragging=true;
      var el=onsetEl(down.w);
      dragGhost=document.createElement("span"); dragGhost.className="ghost";
      dragGhost.textContent=el?el.textContent:cur[down.w];
      document.body.appendChild(dragGhost);
      if(el) el.style.visibility="hidden";
    }
    if(dragging && dragGhost){
      dragGhost.style.left=(e.clientX+8)+"px"; dragGhost.style.top=(e.clientY-14)+"px";
      dragGhost.style.transform="scale(1.2) rotate(6deg)";
    }
  });
  chipBox.addEventListener("pointerup",function(e){
    if(!down) return;
    if(dragging){
      if(dragGhost){dragGhost.remove();dragGhost=null;}
      var over=document.elementFromPoint(e.clientX,e.clientY);
      var tchip=over&&over.closest(".chip");
      var el=onsetEl(down.w); if(el) el.style.visibility="";
      if(tchip && +tchip.dataset.w!==down.w) applySwap(down.w,+tchip.dataset.w);
    } else {
      var w=down.w;
      if(sel===null){ sel=w; render(); }
      else if(sel===w){ sel=null; render(); }
      else { var s=sel; sel=null; applySwap(s,w); }
    }
    down=null; dragging=false;
  });
  chipBox.addEventListener("pointercancel",function(){
    if(dragGhost){dragGhost.remove();dragGhost=null;}
    down=null;dragging=false;render();
  });
  // keyboard: Enter/Space selects a chip, same two-chip swap path as click
  chipBox.addEventListener("keydown",function(e){
    if(e.key!=="Enter" && e.key!==" " && e.key!=="Spacebar") return;
    var chip=e.target.closest(".chip"); if(!chip) return;
    e.preventDefault();
    var w=+chip.dataset.w;
    if(sel===null){ sel=w; render(); refocus(w); }
    else if(sel===w){ sel=null; render(); refocus(w); }
    else { var s=sel; sel=null; applySwap(s,w); refocus(w); }
  });
  function refocus(w){ var c=chipBox.querySelector('.chip[data-w="'+w+'"]'); if(c) c.focus(); }

  // ---- auto modes ----
  function resetCur(){ cur=words.map(function(_,wi){return tokens[words[wi]].home;}); swaps=[]; sel=null; }
  function mode(name){
    resetCur(); curMode=name;
    var n=words.length,k;
    if(name==="classic"){ if(n>=2){swapCur(0,1);swaps.push([0,1]);} }
    else if(name==="adjacent"){ for(k=0;k+1<n;k+=2){swapCur(k,k+1);swaps.push([k,k+1]);} }
    else if(name==="shuffle"){
      var idx=words.map(function(_,i){return i;});
      for(var i=idx.length-1;i>0;i--){var r=Math.floor(Math.random()*(i+1));var t=idx[i];idx[i]=idx[r];idx[r]=t;}
      for(k=0;k+1<idx.length;k+=2){swapCur(idx[k],idx[k+1]);swaps.push([idx[k],idx[k+1]]);}
    }
    render(); writeHash();
  }

  function replay(){
    if(!swaps.length) return;
    var seq=swaps.slice(); // keep swaps array intact for the hash
    cur=words.map(function(_,wi){return tokens[words[wi]].home;});
    sel=null; render();
    var k=0;
    (function step(){
      if(k>=seq.length){ return; }
      var pr=seq[k++];
      flyThen(pr[0],pr[1],function(){ swapCur(pr[0],pr[1]); render(); });
      setTimeout(step,520);
    })();
  }

  // ---- hash share ----
  function writeHash(){
    var s=swaps.map(function(p){return p[0]+"-"+p[1];}).join(".");
    var h="p="+encodeURIComponent(inp.value)+(s?("&s="+s):"");
    history.replaceState(null,"","#"+h);
  }
  function readHash(){
    var h=location.hash.replace(/^#/,""); if(!h) return false;
    var pr={}; h.split("&").forEach(function(kv){var q=kv.split("=");pr[q[0]]=decodeURIComponent(q[1]||"");});
    if(pr.p===undefined) return false;
    curMode=null; inp.value=pr.p; parse(pr.p);
    if(pr.s){ pr.s.split(".").forEach(function(pair){
      var q=pair.split("-").map(Number);
      if(q.length===2 && q[0]<words.length && q[1]<words.length){ swapCur(q[0],q[1]); swaps.push(q); }
    });}
    render(); return true;
  }

  // ---- utility buttons ----
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); setTimeout(function(){toastEl.classList.remove("show");},1600); }
  function clip(text,msg){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast(msg);},function(){fallbackCopy(text,msg);}); }
    else fallbackCopy(text,msg);
  }
  function fallbackCopy(text,msg){
    var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy");toast(msg);}catch(e){toast("Copy failed");} ta.remove();
  }

  function drawCard(){
    var scale=2, W=600, H=315, c=document.createElement("canvas");
    c.width=W*scale; c.height=H*scale; var x=c.getContext("2d"); x.scale(scale,scale);
    x.fillStyle="#F5F3EF"; x.fillRect(0,0,W,H);
    x.fillStyle="#FF6100"; x.fillRect(0,0,W,7);
    x.textAlign="left"; x.fillStyle="#8b8578";
    x.font="600 13px 'Helvetica Neue',Arial,sans-serif"; x.fillText("MARROWSKY · a spoonerism", 34, 44);
    // original
    x.fillStyle="#8b8578"; x.font="italic 18px 'Helvetica Neue',Arial,sans-serif";
    x.fillText(inp.value, 34, 86);
    x.fillStyle="#FF6100"; x.font="800 26px 'Helvetica Neue',Arial,sans-serif"; x.fillText("↓", 34, 122);
    // result, word-coloured, wrapped
    var wi=0, cursorX=34, cursorY=168, lineH=40, maxX=W-34;
    x.font="800 30px 'Helvetica Neue',Arial,sans-serif";
    tokens.forEach(function(t){
      var chunks;
      if(t.word){ var p=pieces(wi++); chunks=[[t.pre,"#8b8578"],[p.onset,"#FF6100"],[p.rime,"#232F3E"],[t.post,"#8b8578"]]; }
      else chunks=[[t.pre+t.core+t.post,"#232F3E"]];
      var word=chunks.map(function(ch){return ch[0];}).join("");
      var w=x.measureText(word).width;
      if(cursorX+w>maxX){ cursorX=34; cursorY+=lineH; }
      chunks.forEach(function(ch){ if(!ch[0])return; x.fillStyle=ch[1]; x.fillText(ch[0],cursorX,cursorY); cursorX+=x.measureText(ch[0]).width; });
      cursorX+=x.measureText(" ").width;
    });
    // meter
    var my=H-40, mw=W-68;
    x.fillStyle="#e3ddd2"; roundRect(x,34,my,mw,12,6); x.fill();
    var pct=parseFloat(meterFill.style.width)||0;
    x.fillStyle="#FF6100"; roundRect(x,34,my,mw*pct/100,12,6); x.fill();
    x.fillStyle="#8b8578"; x.font="600 12px 'Helvetica Neue',Arial,sans-serif"; x.textAlign="left";
    x.fillText(meterLbl.textContent, 34, my-8);
    return c;
  }
  function roundRect(x,rx,ry,rw,rh,r){ if(rw<r*2)r=rw/2; x.beginPath();
    x.moveTo(rx+r,ry); x.arcTo(rx+rw,ry,rx+rw,ry+rh,r); x.arcTo(rx+rw,ry+rh,rx,ry+rh,r);
    x.arcTo(rx,ry+rh,rx,ry,r); x.arcTo(rx,ry,rx+rw,ry,r); x.closePath(); }

  // wire buttons
  document.querySelectorAll("[data-mode]").forEach(function(b){ b.onclick=function(){mode(b.dataset.mode);}; });
  $("#reset").onclick=function(){ resetCur(); curMode=null; render(); writeHash(); };
  $("#replay").onclick=replay;
  $("#copy").onclick=function(){ clip(resultText(),"Phrase copied"); };
  $("#share").onclick=function(){ writeHash(); clip(location.href,"Share link copied"); };
  $("#speak").onclick=function(){
    if(!("speechSynthesis" in window)){ toast("No speech support"); return; }
    var u=new SpeechSynthesisUtterance(resultText()); u.rate=.92; u.pitch=1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u); toast("Reading aloud…");
  };
  $("#surprise").onclick=function(){
    var p; do{ p=BANK[Math.floor(Math.random()*BANK.length)]; }while(p===inp.value && BANK.length>1);
    inp.value=p; parse(p); mode("classic");
  };
  $("#png").onclick=function(){
    try{
      var c=drawCard(), a=document.createElement("a");
      a.download="marrowsky.png"; a.href=c.toDataURL("image/png"); a.click(); toast("Card saved");
    }catch(e){ toast("Save failed"); }
  };
  var deb;
  inp.addEventListener("input",function(){ clearTimeout(deb); deb=setTimeout(function(){ curMode=null; parse(inp.value); render(); writeHash(); },220); });
  window.addEventListener("hashchange",readHash);

  // boot
  if(!readHash()){ parse(inp.value); render(); writeHash(); }
})();
</script>
</body>
</html>
