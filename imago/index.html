<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imago — procedural lepidoptera</title>
<style>
  :root{--bg:#1a1c22;--panel:#22252e;--edge:#33373f;--ink:#e9e3d4;--dim:#9aa0ac;--acc:#d9a441}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0%,#242730,#141519);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif}
  #wrap{display:flex;height:100vh;overflow:hidden}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
  canvas{max-width:100%;max-height:calc(100vh - 36px);box-shadow:0 24px 60px #0009,0 0 0 1px #0006;
    border-radius:6px;background:#0000;cursor:default}
  #panel{width:288px;flex:none;background:var(--panel);border-left:1px solid var(--edge);
    padding:16px 16px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
  h1{font-family:Georgia,serif;font-size:22px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--acc)}
  .sub{color:var(--dim);font-size:11px;margin:-6px 0 4px}
  .row{display:flex;gap:8px;align-items:center}
  label{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:3px;
    text-transform:uppercase;letter-spacing:.6px}
  label b{color:var(--ink);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--acc);margin:0}
  input[type=text],select{width:100%;background:#171922;color:var(--ink);border:1px solid var(--edge);
    border-radius:5px;padding:7px 8px;font-size:13px;font-family:inherit}
  select{cursor:pointer}
  button{background:#2c3039;color:var(--ink);border:1px solid var(--edge);border-radius:5px;padding:8px 10px;
    font-size:12px;cursor:pointer;flex:1;transition:.12s;font-weight:600}
  button:hover{background:#3a3f4a;border-color:#565c68}
  button.acc{background:var(--acc);color:#241a06;border-color:var(--acc)}
  button.acc:hover{filter:brightness(1.08)}
  fieldset{border:1px solid var(--edge);border-radius:6px;padding:10px 12px 12px;margin:0}
  legend{font-size:10px;color:var(--acc);text-transform:uppercase;letter-spacing:1px;padding:0 5px}
  .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px}
  .chk input{accent-color:var(--acc);width:auto}
  .hint{font-size:10px;color:var(--dim);line-height:1.4}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="panel">
    <div>
      <h1>Imago<span>.</span></h1>
      <div class="sub">Seed a hash, hatch a specimen.</div>
    </div>
    <div class="row"><input type="text" id="seed" placeholder="seed" spellcheck="false"></div>
    <div class="hint" id="mod" style="color:var(--acc);display:none">Custom variant — edited away from its seed; export tagged _custom.</div>
    <div class="row">
      <button class="acc" id="rnd">Randomize</button>
      <button id="collect">Collection</button>
    </div>
    <div class="row">
      <button id="png">Export PNG</button>
      <button id="svg">Export SVG</button>
    </div>
    <div class="row">
      <button id="copy">Copy link</button>
    </div>
    <div class="hint">The URL hash (#seed) reproduces this exact specimen — copy the link to share it.</div>

    <label>Palette</label>
    <select id="pal"></select>
    <label class="chk"><input type="checkbox" id="moth"> Moth mode (plumose antennae)</label>

    <label>Wing span <b id="v-span"></b></label><input type="range" id="span" min="230" max="360" step="1">
    <label>Wing shape <b id="v-sweep"></b></label><input type="range" id="sweep" min="0" max="100" step="1">
    <label>Tail / lobe <b id="v-tail"></b></label><input type="range" id="tail" min="0" max="100" step="1">
    <label>Scallop <b id="v-scallop"></b></label><input type="range" id="scallop" min="0" max="100" step="1">
    <label>Pattern density <b id="v-density"></b></label><input type="range" id="density" min="0" max="100" step="1">
    <label>Eyespots <b id="v-eye"></b></label><input type="range" id="eye" min="0" max="6" step="1">
    <label>Band width <b id="v-band"></b></label><input type="range" id="band" min="0" max="100" step="1">
    <label>Asymmetry jitter <b id="v-jit"></b></label><input type="range" id="jit" min="0" max="100" step="1">

    <fieldset>
      <legend>Breed</legend>
      <div class="row"><input type="text" id="pa" placeholder="parent A" spellcheck="false"></div>
      <div class="row" style="margin-top:6px"><input type="text" id="pb" placeholder="parent B" spellcheck="false"></div>
      <label style="margin-top:8px">Mutation <b id="v-mut"></b></label>
      <input type="range" id="mut" min="0" max="100" step="1" value="12">
      <div class="row" style="margin-top:8px"><button id="breed">Cross ♀ × ♂</button></div>
      <div class="hint" style="margin-top:6px">Crosses two seeds' gene vectors into a hybrid offspring.</div>
    </fieldset>
  </div>
</div>
<script>
"use strict";
/* ---------- section 1: util ---------- */
const PW=880, PH=1080, SX=440, SY=430, TRAY="#f0e8d6";
function hashSeed(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return (h>>>0);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a==null?1:a})`;}

const PALETTES=[
 {name:"Swallowtail",genus:"Papilio",base:["#f6df5c","#e4b528"],vein:"#141210",band:"#100e0c",edge:"#0a0806",
  eye:["#b23b1f","#e6892f","#120d0a"],dapple:"#1c2f57",iri:false},
 {name:"Morpho (iridescent)",genus:"Morpho",base:["#2a63c8","#0f2f78"],vein:"#0a1c46",band:"#0a1838",edge:"#081026",
  eye:["#08122e","#3f6fd0","#050a1c"],dapple:"#dfe9ff",iri:true,iriHues:["#3a7bff","#12d6ff","#7b52ff"]},
 {name:"Tiger moth",genus:"Arctia",base:["#f7f0dd","#ead7b0"],vein:"#5f2f16",band:"#7a2c11",edge:"#3a1a0c",
  eye:["#7a2c11","#df7a34","#2a1108"],dapple:"#3a1c10",iri:false},
 {name:"Underwing",genus:"Catocala",base:["#8b7154","#5c4732"],vein:"#382a1a",band:"#b53722",edge:"#2a2014",
  eye:["#2a2016","#6d5640","#12100b"],dapple:"#2a2016",iri:false},
 {name:"Sphinx",genus:"Sphinx",base:["#d98aa0","#a86a4f"],vein:"#582f24",band:"#7c4636",edge:"#341c15",
  eye:["#582f24","#e2a1b3","#2a1710"],dapple:"#4a2c22",iri:false},
 {name:"Monarch",genus:"Danaus",base:["#ee7a1e","#c8560c"],vein:"#120f0c",band:"#0f0c09",edge:"#0a0806",
  eye:["#1a1512","#ee7a1e","#0c0a08"],dapple:"#f5efe2",iri:true,iriHues:["#ffb24d","#ff7a2f","#ffd98a"]}
];

/* macro genome derived from a seed; drives the sliders */
function macro(seed){
 const r=mulberry32(hashSeed(seed+"#macro"));
 return{span:Math.round(lerp(250,350,r())),sweep:Math.round(lerp(15,90,r())),tail:Math.round(lerp(0,95,r())),
  scallop:Math.round(lerp(0,90,r())),density:Math.round(lerp(35,95,r())),eye:Math.round(lerp(0,5,r())),
  band:Math.round(lerp(15,80,r())),pal:(r()*PALETTES.length)|0,moth:r()<0.35};
}
function crossMacro(a,b,t,mut,seed){
 const A=macro(a),B=macro(b),r=mulberry32(hashSeed(seed+"#mut"));
 // mut arrives 0..1; scale so a full slider visibly spreads the genome across its range
 const m=(k)=>clamp(Math.round(lerp(A[k],B[k],t)+(r()-.5)*mut*(k==="span"?40:30)),0,999);
 return{span:clamp(m("span"),230,360),sweep:clamp(m("sweep"),0,100),tail:clamp(m("tail"),0,100),
  scallop:clamp(m("scallop"),0,100),density:clamp(m("density"),0,100),eye:clamp(m("eye"),0,6),
  band:clamp(m("band"),0,100),pal:(t<.5?A.pal:B.pal),moth:(t<.5?A.moth:B.moth)};
}

function speciesName(seed,pal){
 const r=mulberry32(hashSeed(seed+"#name"));
 const syl=["ae","be","ci","do","lu","me","ni","or","pa","qu","ri","so","ta","vi","xa","za","el","in","um","ar"];
 const suf=["atus","ella","ides","ana","ii","ensis","alis","ora","ina"];
 let s="";const n=2+((r()*2)|0);for(let i=0;i<n;i++)s+=syl[(r()*syl.length)|0];
 return pal.genus+" "+s+suf[(r()*suf.length)|0];
}

/* ---------- section 2: geometry ---------- */
function smooth(p,closed){
 const n=p.length,g=i=>p[(i%n+n)%n],f=v=>v.toFixed(1);
 let d="M"+f(p[0][0])+","+f(p[0][1]);
 for(let i=0;i<(closed?n:n-1);i++){
  const p0=closed?g(i-1):p[Math.max(0,i-1)],p1=p[i],p2=p[(i+1)%n],p3=closed?g(i+2):p[Math.min(n-1,i+2)];
  const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
  d+="C"+f(c1[0])+","+f(c1[1])+" "+f(c2[0])+","+f(c2[1])+" "+f(p2[0])+","+f(p2[1]);
 }
 return closed?d+"Z":d;
}
/* scalloped edge points between a and b (lobes decoupled from sample count) */
function edge(a,b,depth,n,lobes){
 const out=[],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,lo=lobes||2;
 for(let i=1;i<n;i++){const t=i/n,w=Math.sin(t*Math.PI*lo)*-depth;
  out.push([a[0]+dx*t+nx*w,a[1]+dy*t+ny*w]);}
 return out;
}
/* one wing outline for a given side(+/-1) and kind */
function wingOutline(side,kind,P){
 const S=P.span,X=o=>SX+side*o,d=P.scallop*S*0.05,nl=9;
 let V,root;
 if(kind==="fore"){
  const P0=[X(S*0.03),SY-S*0.30],P1=[X(S*0.55),SY-S*(0.26+0.24*P.sweep)],
   P2=[X(S*1.02),SY-S*(0.06+0.20*P.sweep)],P3=[X(S*0.94),SY+S*0.02],
   P4=[X(S*0.40),SY+S*0.11],P5=[X(S*0.05),SY+S*0.02];
  V=[P0,P1,P2,...edge(P2,P3,d,nl,3),P3,...edge(P3,P4,d*.7,nl,2),P4,P5];
  root=[X(S*0.06),SY-S*0.12];
 }else{
  const tl=P.tail;
  const H0=[X(S*0.05),SY+S*0.03],H1=[X(S*0.58),SY+S*0.11],H2=[X(S*0.70),SY+S*0.30],
   H3=[X(S*(0.34+tl*0.22)),SY+S*(0.42+tl*0.42)],H4=[X(S*0.12),SY+S*0.40];
  V=[H0,H1,...edge(H1,H2,d,nl,2),H2,...edge(H2,H3,d,nl,3),H3,...edge(H3,H4,d,nl,3),H4];
  root=[X(S*0.08),SY+S*0.12];
 }
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const v of V){x0=Math.min(x0,v[0]);y0=Math.min(y0,v[1]);x1=Math.max(x1,v[0]);y1=Math.max(y1,v[1]);}
 return{d:smooth(V,true),root,bbox:{x0,y0,x1,y1},outer:V.slice(2,V.length-2)};
}

/* ---------- section 3: build primitive list (shared by canvas + svg) ---------- */
function eyespot(x,y,r,pal){return[
 {t:"e",cx:x,cy:y,rx:r,ry:r*1.12,fill:pal.eye[0]},
 {t:"e",cx:x,cy:y,rx:r*0.66,ry:r*0.78,fill:pal.eye[1]},
 {t:"e",cx:x,cy:y,rx:r*0.36,ry:r*0.44,fill:pal.eye[2]},
 {t:"e",cx:x-r*0.13,cy:y-r*0.17,rx:r*0.11,ry:r*0.13,fill:"#fdfdfb"}];}

function buildWing(layers,side,kind,P,pal,rng){
 const w=wingOutline(side,kind,P),S=P.span,b=w.bbox,prims=[],den=P.density/100;
 // base wash gradient
 const rad=Math.hypot(b.x1-w.root[0],b.y1-w.root[1])*1.05;
 prims.push({t:"r",x:b.x0,y:b.y0,w:b.x1-b.x0,h:b.y1-b.y0,
  fill:{g:"radial",cx:w.root[0],cy:w.root[1],r:rad,stops:[[0,pal.base[0],1],[.75,pal.base[1],1],[1,pal.edge,1]]}});
 // venation fanning from root to margin
 const vc=Math.floor(6+den*10),om=w.outer;
 for(let i=0;i<vc;i++){const tgt=om[Math.floor(i/vc*om.length)];
  const mx=(w.root[0]+tgt[0])/2+(rng()-.5)*S*0.06,my=(w.root[1]+tgt[1])/2+(rng()-.5)*S*0.06;
  prims.push({t:"p",d:`M${w.root[0].toFixed(1)},${w.root[1].toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${tgt[0].toFixed(1)},${tgt[1].toFixed(1)}`,
   fill:"none",stroke:pal.vein,sw:1.4});}
 // marginal band (stroke the outline, clip keeps the inner half)
 if(P.band>2)prims.push({t:"p",d:w.d,fill:"none",stroke:pal.band,sw:P.band/100*S*0.42});
 // submarginal lunules
 for(let i=1;i<om.length-1;i+=2){const o=om[i],dx=o[0]-w.root[0],dy=o[1]-w.root[1],L=Math.hypot(dx,dy)||1;
  prims.push({t:"e",cx:o[0]-dx/L*S*0.06,cy:o[1]-dy/L*S*0.06,rx:S*0.02,ry:S*0.03,fill:rgba(pal.base[0],.55)});}
 // dapple speckles
 const dc=Math.floor(den*90);
 for(let i=0;i<dc;i++){const rr=S*(0.008+rng()*0.02);
  prims.push({t:"e",cx:lerp(b.x0,b.x1,rng()),cy:lerp(b.y0,b.y1,rng()),rx:rr,ry:rr,fill:rgba(pal.dapple,0.15+rng()*0.35)});}
 // discal eyespots
 const ne=kind==="fore"?Math.ceil(P.eye/2):Math.floor(P.eye/2);
 const ex=kind==="fore"?SX+side*S*0.62:SX+side*S*0.44, ey=kind==="fore"?SY-S*0.04:SY+S*0.24;
 for(let i=0;i<Math.min(ne,3);i++)prims.push(...eyespot(ex+side*i*S*0.16,ey+i*S*0.05,S*(0.11-i*0.02),pal));
 layers.push({clip:w.d,prims});
 // iridescent structural-colour pass (screen-blended angle-shifted gradients)
 if(pal.iri){const iri=[];
  for(let k=0;k<3;k++){const a=0.35+k*0.7,hu=pal.iriHues[k];
   const x1=lerp(b.x0,b.x1,k*0.25),y1=b.y0,x2=lerp(b.x0,b.x1,0.6+k*0.15),y2=b.y1;
   iri.push({t:"r",x:b.x0,y:b.y0,w:b.x1-b.x0,h:b.y1-b.y0,
    fill:{g:"linear",x1,y1,x2,y2,stops:[[0,hu,0],[Math.min(.5+k*0.08,.8),hu,a*.5],[1,hu,0]]}});}
  layers.push({clip:w.d,blend:"screen",prims:iri});}
 // crisp edge
 layers.push({prims:[{t:"p",d:w.d,fill:"none",stroke:pal.edge,sw:2}]});
}

function buildPlate(seed,P){
 const pal=PALETTES[P.pal],rng=mulberry32(hashSeed(seed+"#micro")),S=P.span,dark="#1b120a",L=[];
 // tray card
 L.push({prims:[{t:"r",x:0,y:0,w:PW,h:PH,fill:TRAY},
  {t:"r",x:22,y:22,w:PW-44,h:PH-44,fill:"none",stroke:"#00000018",sw:2},
  {t:"r",x:34,y:34,w:PW-68,h:PH-68,fill:"none",stroke:"#00000010",sw:1}]});
 // pin shaft + head
 L.push({prims:[{t:"p",d:`M${SX},${SY-S*0.52} L${SX},${SY+S*0.02}`,fill:"none",stroke:"#9a9a9a",sw:3},
  {t:"e",cx:SX,cy:SY-S*0.52,rx:9,ry:9,fill:"#c9c9c9"},{t:"e",cx:SX-3,cy:SY-S*0.52-3,rx:3,ry:3,fill:"#f2f2f2"}]});
 // per-side jitter for gynandromorph look
 const mk=(s,kind)=>{const jp=Object.assign({},P);const j=P.jitter/100*0.28;
  if(j>0){const jr=mulberry32(hashSeed(seed+kind+s));
   jp.span=P.span*(1+(s<0?(jr()-.5)*j:0));jp.sweep=clamp(P.sweep/100+(s<0?(jr()-.5)*j:0),0,1);jp.tail=clamp(P.tail/100+(s<0?(jr()-.5)*j:0),0,1);}
  else{jp.sweep=P.sweep/100;jp.tail=P.tail/100;}
  jp.scallop=P.scallop/100;return jp;};
 // hind first (behind), both sides
 for(const s of[-1,1])buildWing(L,s,"hind",mk(s,"h"),pal,rng);
 for(const s of[-1,1])buildWing(L,s,"fore",mk(s,"f"),pal,rng);
 // body
 const bw=P.moth?1.7:1;
 L.push({prims:[
  {t:"e",cx:SX,cy:SY+S*0.14,rx:S*0.032*bw,ry:S*0.30,fill:dark},
  {t:"e",cx:SX,cy:SY-S*0.12,rx:S*0.05*bw,ry:S*0.15,fill:dark},
  {t:"e",cx:SX,cy:SY-S*0.30,rx:S*0.036*bw,ry:S*0.04,fill:dark}]});
 if(P.moth){const fuzz=[];for(let i=0;i<10;i++)fuzz.push({t:"e",cx:SX+(rng()-.5)*S*0.11,cy:SY-S*0.16+(rng()-.5)*S*0.22,rx:S*0.02,ry:S*0.03,fill:rgba("#3a2a18",.5)});L.push({prims:fuzz});}
 // antennae
 const ant=[];
 for(const s of[-1,1]){const hx=SX+s*S*0.02,hy=SY-S*0.32,tx=SX+s*S*0.17,ty=SY-S*0.50;
  ant.push({t:"p",d:`M${hx},${hy} Q${SX+s*S*0.16},${SY-S*0.46} ${tx},${ty}`,fill:"none",stroke:dark,sw:2.4});
  if(P.moth){for(let i=1;i<6;i++){const t=i/6,px=lerp(hx,tx,t),py=lerp(hy,ty,t);
   ant.push({t:"p",d:`M${px},${py} L${px+s*S*0.05},${py-S*0.01}`,fill:"none",stroke:dark,sw:1.4});
   ant.push({t:"p",d:`M${px},${py} L${px+s*S*0.05},${py+S*0.015}`,fill:"none",stroke:dark,sw:1.4});}}
  else ant.push({t:"e",cx:tx,cy:ty,rx:S*0.022,ry:S*0.03,fill:dark});}
 L.push({prims:ant});
 // museum label
 const name=speciesName(seed,pal),ly=PH-150;
 L.push({prims:[
  {t:"r",x:PW/2-250,y:ly,w:500,h:118,fill:"#fbf7ec",stroke:"#00000022",sw:1},
  {t:"tx",x:PW/2,y:ly+42,str:name,size:30,fill:"#20160c",anchor:"middle",italic:true,fam:"Georgia,serif"},
  {t:"tx",x:PW/2,y:ly+70,str:pal.name.toUpperCase(),size:12,fill:"#8a6a3a",anchor:"middle",fam:"Georgia,serif"},
  {t:"tx",x:PW/2,y:ly+98,str:"seed: "+seed,size:15,fill:"#4a4034",anchor:"middle",fam:"'Courier New',monospace"},
  {t:"tx",x:PW-46,y:PH-40,str:"IMAGO COLL.",size:11,fill:"#b7ad97",anchor:"end",fam:"Georgia,serif"}]});
 return{layers:L,name,seed};
}

/* ---------- render: canvas ---------- */
function cfill(ctx,f){
 if(typeof f==="string")return f;
 let g;
 if(f.g==="radial")g=ctx.createRadialGradient(f.cx,f.cy,0,f.cx,f.cy,f.r);
 else g=ctx.createLinearGradient(f.x1,f.y1,f.x2,f.y2);
 for(const s of f.stops)g.addColorStop(clamp(s[0],0,1),rgba(s[1],s[2]));
 return g;
}
function drawPrim(ctx,p){
 if(p.t==="r"){if(p.fill&&p.fill!=="none"){ctx.fillStyle=cfill(ctx,p.fill);ctx.fillRect(p.x,p.y,p.w,p.h);}
  if(p.stroke){ctx.strokeStyle=p.stroke;ctx.lineWidth=p.sw;ctx.strokeRect(p.x,p.y,p.w,p.h);}}
 else if(p.t==="e"){ctx.beginPath();ctx.ellipse(p.cx,p.cy,p.rx,p.ry,0,0,7);if(p.fill&&p.fill!=="none"){ctx.fillStyle=cfill(ctx,p.fill);ctx.fill();}
  if(p.stroke){ctx.strokeStyle=p.stroke;ctx.lineWidth=p.sw;ctx.stroke();}}
 else if(p.t==="p"){const pa=new Path2D(p.d);if(p.fill&&p.fill!=="none"){ctx.fillStyle=cfill(ctx,p.fill);ctx.fill(pa);}
  if(p.stroke){ctx.strokeStyle=p.stroke;ctx.lineWidth=p.sw;ctx.lineJoin="round";ctx.stroke(pa);}}
 else if(p.t==="tx"){ctx.fillStyle=p.fill;ctx.textAlign=p.anchor||"start";ctx.textBaseline="alphabetic";
  ctx.font=(p.italic?"italic ":"")+p.size+"px "+(p.fam||"sans-serif");ctx.fillText(p.str,p.x,p.y);}
}
function paint(ctx,plate,ox,oy,sc){
 ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
 for(const L of plate.layers){ctx.save();if(L.blend)ctx.globalCompositeOperation=L.blend;
  if(L.clip)ctx.clip(new Path2D(L.clip));for(const p of L.prims)drawPrim(ctx,p);ctx.restore();}
 ctx.restore();
}

/* ---------- render: svg ---------- */
function svgPlate(plate,ox,oy,sc,ids){
 const F=v=>(+v).toFixed(1),defs=[],body=[];
 const fref=f=>{if(typeof f==="string")return f;const id="g"+(ids.n++);
  const st=f.stops.map(s=>`<stop offset="${clamp(s[0],0,1)}" stop-color="${s[1]}" stop-opacity="${s[2]==null?1:s[2]}"/>`).join("");
  if(f.g==="radial")defs.push(`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${F(f.cx)}" cy="${F(f.cy)}" r="${F(f.r)}">${st}</radialGradient>`);
  else defs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${F(f.x1)}" y1="${F(f.y1)}" x2="${F(f.x2)}" y2="${F(f.y2)}">${st}</linearGradient>`);
  return`url(#${id})`;};
 const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
 for(const L of plate.layers){
  let clip="";if(L.clip){const cid="c"+(ids.n++);defs.push(`<clipPath id="${cid}"><path d="${L.clip}"/></clipPath>`);clip=` clip-path="url(#${cid})"`;}
  const style=L.blend?` style="mix-blend-mode:${L.blend}"`:"";
  body.push(`<g${clip}${style}>`);
  for(const p of L.prims){
   const fl=p.fill?` fill="${fref(p.fill)}"`:` fill="none"`,sk=p.stroke?` stroke="${p.stroke}" stroke-width="${p.sw}" stroke-linejoin="round"`:"";
   if(p.t==="r")body.push(`<rect x="${F(p.x)}" y="${F(p.y)}" width="${F(p.w)}" height="${F(p.h)}"${fl}${sk}/>`);
   else if(p.t==="e")body.push(`<ellipse cx="${F(p.cx)}" cy="${F(p.cy)}" rx="${F(p.rx)}" ry="${F(p.ry)}"${fl}${sk}/>`);
   else if(p.t==="p")body.push(`<path d="${p.d}"${fl}${sk}/>`);
   else if(p.t==="tx")body.push(`<text x="${F(p.x)}" y="${F(p.y)}" font-size="${p.size}" fill="${p.fill}" text-anchor="${p.anchor||"start"}"${p.italic?' font-style="italic"':''} font-family="${p.fam||"sans-serif"}">${esc(p.str)}</text>`);
  }
  body.push("</g>");
 }
 return`<g transform="translate(${ox},${oy}) scale(${sc})">`+`<defs>${defs.join("")}</defs>`+body.join("")+`</g>`;
}

/* ---------- section 4: UI wiring ---------- */
const $=id=>document.getElementById(id),cv=$("cv"),ctx=cv.getContext("2d");
const IDS=["span","sweep","tail","scallop","density","eye","band","jit"];
let collection=false, sheetSeeds=[], sheetCache=null, hoverCell=-1;
PALETTES.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.name;$("pal").appendChild(o);});

function readParams(){return{span:+$("span").value,sweep:+$("sweep").value,tail:+$("tail").value,
 scallop:+$("scallop").value,density:+$("density").value,eye:+$("eye").value,band:+$("band").value,
 jitter:+$("jit").value,pal:+$("pal").value,moth:$("moth").checked};}
function syncLabels(){$("v-span").textContent=$("span").value;$("v-sweep").textContent=$("sweep").value;
 $("v-tail").textContent=$("tail").value;$("v-scallop").textContent=$("scallop").value;
 $("v-density").textContent=$("density").value;$("v-eye").textContent=$("eye").value;
 $("v-band").textContent=$("band").value;$("v-jit").textContent=$("jit").value;$("v-mut").textContent=$("mut").value;}

function setSliders(m){$("span").value=m.span;$("sweep").value=m.sweep;$("tail").value=m.tail;
 $("scallop").value=m.scallop;$("density").value=m.density;$("eye").value=m.eye;$("band").value=m.band;
 $("pal").value=m.pal;$("moth").checked=m.moth;}

function macroToParams(m){return{span:m.span,sweep:m.sweep,tail:m.tail,scallop:m.scallop,density:m.density,
 eye:m.eye,band:m.band,jitter:0,pal:m.pal,moth:m.moth};}
/* true once sliders/palette/moth diverge from the seed's deterministic genome */
function isModified(){const m=macroToParams(macro($("seed").value)),p=readParams();
 return p.span!=m.span||p.sweep!=m.sweep||p.tail!=m.tail||p.scallop!=m.scallop||p.density!=m.density||
  p.eye!=m.eye||p.band!=m.band||p.pal!=m.pal||p.moth!=m.moth||p.jitter!=0;}

function render(){
 syncLabels();
 cv.style.cursor=collection?"pointer":"default";
 $("collect").textContent=collection?"Back to specimen":"Collection";
 if(collection){$("mod").style.display="none";renderSheet();return;}
 $("mod").style.display=isModified()?"block":"none";
 cv.width=PW;cv.height=PH;
 const plate=buildPlate($("seed").value,readParams());
 paint(ctx,plate,0,0,1);
}
function renderSheet(){
 const N=3,cw=PW*0.5,ch=PH*0.5,pad=18;
 cv.width=N*cw+pad*(N+1);cv.height=N*ch+pad*(N+1);
 ctx.fillStyle="#141519";ctx.fillRect(0,0,cv.width,cv.height);
 sheetSeeds.forEach((sd,i)=>{const cx=pad+(i%N)*(cw+pad),cy=pad+((i/N)|0)*(ch+pad);
  const plate=buildPlate(sd,macroToParams(macro(sd)));paint(ctx,plate,cx,cy,0.5);});
 sheetCache=sheetCache||document.createElement("canvas");
 sheetCache.width=cv.width;sheetCache.height=cv.height;
 sheetCache.getContext("2d").drawImage(cv,0,0);hoverCell=-1;
}

function loadSeed(seed,push){
 $("seed").value=seed;$("jit").value=0;setSliders(macro(seed));
 if(push!==false&&("#"+encodeURIComponent(seed))!==location.hash)location.hash=encodeURIComponent(seed);
 collection=false;render();
}
function randSeed(){return Math.random().toString(36).slice(2,9);}

// events
IDS.concat(["mut"]).forEach(id=>$(id).addEventListener("input",render));
$("pal").addEventListener("change",render);
$("moth").addEventListener("change",render);
$("rnd").addEventListener("click",()=>loadSeed(randSeed()));
$("collect").addEventListener("click",()=>{
 if(!collection){collection=true;const base=$("seed").value;sheetSeeds=[base];
  for(let i=1;i<9;i++)sheetSeeds.push(randSeed());render();}
 else{collection=false;render();}
});
function cellAt(e){const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
 const x=(e.clientX-r.left)*sx,y=(e.clientY-r.top)*sy,cw=PW*0.5,ch=PH*0.5,pad=18,N=3;
 const col=Math.floor((x-pad)/(cw+pad)),row=Math.floor((y-pad)/(ch+pad)),idx=row*N+col;
 return(col>=0&&col<N&&row>=0&&row<N&&idx<sheetSeeds.length)?idx:-1;}
cv.addEventListener("click",e=>{if(!collection)return;const i=cellAt(e);if(i>=0)loadSeed(sheetSeeds[i]);});
cv.addEventListener("mousemove",e=>{
 if(!collection||!sheetCache)return;const hit=cellAt(e);if(hit===hoverCell)return;hoverCell=hit;
 ctx.drawImage(sheetCache,0,0);
 if(hit>=0){const cw=PW*0.5,ch=PH*0.5,pad=18,N=3,cx=pad+(hit%N)*(cw+pad),cy=pad+((hit/N)|0)*(ch+pad);
  ctx.strokeStyle="#d9a441";ctx.lineWidth=3;ctx.strokeRect(cx+1.5,cy+1.5,cw-3,ch-3);}
});
cv.addEventListener("mouseleave",()=>{if(collection&&sheetCache&&hoverCell!==-1){hoverCell=-1;ctx.drawImage(sheetCache,0,0);}});
$("seed").addEventListener("change",()=>loadSeed($("seed").value.trim()||randSeed()));
$("breed").addEventListener("click",()=>{
 const a=($("pa").value.trim()||$("seed").value),b=($("pb").value.trim()||randSeed()),child=a+"×"+b;
 $("pa").value=a;$("pb").value=b;$("seed").value=child;$("jit").value=Math.round(+$("mut").value*0.4);
 setSliders(crossMacro(a,b,0.5,+$("mut").value/100,child));
 location.hash=encodeURIComponent(child);collection=false;render();
});

// export
function download(name,url){const a=document.createElement("a");a.href=url;a.download=name;a.click();}
function exportName(seed,ext){return"imago_"+(collection?("collection_"+(sheetSeeds[0]||seed)):(seed+(isModified()?"_custom":"")))+"."+ext;}
$("png").addEventListener("click",()=>{
 const seed=$("seed").value,sc=2,tmp=document.createElement("canvas"),tc=tmp.getContext("2d");
 if(collection){tmp.width=cv.width*sc;tmp.height=cv.height*sc;tc.scale(sc,sc);
  tc.fillStyle="#141519";tc.fillRect(0,0,cv.width,cv.height);const N=3,cw=PW*0.5,ch=PH*0.5,pad=18;
  sheetSeeds.forEach((sd,i)=>{const cx=pad+(i%N)*(cw+pad),cy=pad+((i/N)|0)*(ch+pad);
   paint(tc,buildPlate(sd,macroToParams(macro(sd))),cx,cy,0.5);});
 }else{tmp.width=PW*sc;tmp.height=PH*sc;paint(tc,buildPlate(seed,readParams()),0,0,sc);}
 const name=exportName(seed,"png");
 // Blob download avoids Safari's data:-URL size cap and length-limited anchor downloads
 tmp.toBlob(blob=>{const url=URL.createObjectURL(blob);download(name,url);setTimeout(()=>URL.revokeObjectURL(url),2000);},"image/png");
});
$("svg").addEventListener("click",()=>{
 const seed=$("seed").value,ids={n:0};let w,h,inner;
 if(collection){const N=3,cw=PW*0.5,ch=PH*0.5,pad=18;w=N*cw+pad*(N+1);h=N*ch+pad*(N+1);
  inner=`<rect width="${w}" height="${h}" fill="#141519"/>`;
  sheetSeeds.forEach((sd,i)=>{const cx=pad+(i%N)*(cw+pad),cy=pad+((i/N)|0)*(ch+pad);
   inner+=svgPlate(buildPlate(sd,macroToParams(macro(sd))),cx,cy,0.5,ids);});
 }else{w=PW;h=PH;inner=svgPlate(buildPlate(seed,readParams()),0,0,1,ids);}
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
 download(exportName(seed,"svg"),"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg));
});
$("copy").addEventListener("click",()=>{
 const b=$("copy"),ok=()=>{b.textContent="Copied!";setTimeout(()=>{b.textContent="Copy link";},1200);};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(location.href).then(ok,ok);
 else ok();
});

function readHash(){try{return decodeURIComponent(location.hash.slice(1));}catch(e){return location.hash.slice(1);}}
window.addEventListener("hashchange",()=>{const s=readHash();if(s&&s!==$("seed").value)loadSeed(s,false);});
(function init(){const h=readHash();loadSeed(h||randSeed(),!h);})();
</script>
</body>
</html>
