<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DotEnv — .env ⇄ JSON converter</title>
<meta name="description" content="Free offline .env to JSON converter (and back). Parse dotenv files with comments, quotes, export prefixes, and escapes, or turn JSON into a .env file. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/dotenv/">
<style>
  :root{
    --c:#1e293b; --bg:#f7f8fa; --fg:#131a24; --muted:#5a6675;
    --card:#ffffff; --border:#e0e5ec; --code:#eef1f5;
  }
  [data-theme="dark"]{
    --bg:#0d1117; --fg:#e6ebf2; --muted:#8b97a8; --card:#161b22;
    --border:#28303c; --code:#1b222c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:900px;margin:0 auto;padding:24px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#475569);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:900px;margin:0 auto;padding:6px 20px 60px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:14px}
  .seg button{background:var(--card);border:none;color:var(--fg);padding:9px 16px;cursor:pointer;
    font-size:.86rem;border-right:1px solid var(--border);font-weight:600}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .pane .h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);
    font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:7px;padding:3px 11px;cursor:pointer;font-size:.72rem;text-transform:none;letter-spacing:0}
  .copy:hover{color:var(--c);border-color:var(--c)}
  textarea,pre{border:none;background:none;color:var(--fg);min-height:380px;margin:0;padding:15px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;line-height:1.6;width:100%}
  textarea{resize:vertical}
  textarea:focus{outline:none}
  pre{overflow:auto;white-space:pre-wrap;word-break:break-word}
  pre.err{color:#dc2626}
  footer{max-width:900px;margin:0 auto;padding:14px 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('env.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">env</div>
  <div>
    <h1>DotEnv</h1>
    <p class="sub">.env &harr; JSON converter</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="seg" id="mode">
    <button data-m="tojson" class="on">.env → JSON</button>
    <button data-m="toenv">JSON → .env</button>
  </div>
  <div class="grid">
    <div class="pane">
      <div class="h" id="inHead">.env</div>
      <textarea id="in" spellcheck="false"># App config
export NODE_ENV=production
PORT=8080
APP_NAME="My Cool App"
DATABASE_URL=postgres://user:pass@host:5432/db
GREETING="Hello\nWorld"</textarea>
    </div>
    <div class="pane">
      <div class="h" id="outHead">JSON <button class="copy" id="copy">Copy</button></div>
      <pre id="out"></pre>
    </div>
  </div>
</main>
<footer>
  DotEnv is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/dotenv">Source</a>
</footer>

<script>
// ---- pure functions ----
function parseEnv(text){
  var out = {};
  String(text).split(/\r?\n/).forEach(function(raw){
    var line = raw.trim();
    if(line === '' || line.charAt(0) === '#') return;
    line = line.replace(/^export\s+/, '');
    var eq = line.indexOf('=');
    if(eq < 0) return;
    var key = line.slice(0, eq).trim();
    if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) return;
    var val = line.slice(eq + 1).trim();
    if(val.length >= 2 && val.charAt(0) === '"' && val.charAt(val.length - 1) === '"'){
      val = val.slice(1, -1).replace(/\\(.)/g, function(_, c){
        return { n: '\n', t: '\t', r: '\r', '"': '"', '\\': '\\' }[c] || ('\\' + c);
      });
    } else if(val.length >= 2 && val.charAt(0) === "'" && val.charAt(val.length - 1) === "'"){
      val = val.slice(1, -1);
    }
    out[key] = val;
  });
  return out;
}
function needsQuote(v){ return v === '' || /[\s"'#\n\t\r\\]/.test(v); }
function toEnv(obj){
  return Object.keys(obj).map(function(k){
    var v = obj[k];
    v = (v === null || v === undefined) ? '' : String(v);
    if(needsQuote(v)){
      v = '"' + v.replace(/\\/g, '\\\\').replace(/"/g, '\\"')
        .replace(/\n/g, '\\n').replace(/\t/g, '\\t').replace(/\r/g, '\\r') + '"';
    }
    return k + '=' + v;
  }).join('\n');
}
function envToJson(text){ return JSON.stringify(parseEnv(text), null, 2); }
function jsonToEnv(jsonText){
  var obj = JSON.parse(jsonText);
  if(obj === null || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Expected a JSON object');
  return toEnv(obj);
}

if(typeof module !== 'undefined') module.exports = { parseEnv, toEnv, needsQuote, envToJson, jsonToEnv };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  var modeEl = document.getElementById('mode');
  var mode = 'tojson';
  var ENV_SAMPLE = inEl.value;
  var JSON_SAMPLE = '{\n  "NODE_ENV": "production",\n  "PORT": "8080",\n  "APP_NAME": "My Cool App"\n}';

  function render(){
    outEl.className = '';
    try{
      if(mode === 'tojson') outEl.textContent = envToJson(inEl.value);
      else outEl.textContent = jsonToEnv(inEl.value);
    }catch(e){ outEl.className = 'err'; outEl.textContent = '⚠ ' + e.message; }
    try{ localStorage.setItem('env.in.' + mode, inEl.value); }catch(e){}
  }
  function setMode(m){
    mode = m;
    [].forEach.call(modeEl.querySelectorAll('button'), function(b){
      b.className = (b.getAttribute('data-m') === m) ? 'on' : ''; });
    document.getElementById('inHead').textContent = m === 'tojson' ? '.env' : 'JSON';
    document.getElementById('outHead').firstChild.textContent = m === 'tojson' ? 'JSON ' : '.env ';
    var saved = null; try{ saved = localStorage.getItem('env.in.' + m); }catch(e){}
    inEl.value = saved !== null ? saved : (m === 'tojson' ? ENV_SAMPLE : JSON_SAMPLE);
    render();
  }
  modeEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(b) setMode(b.getAttribute('data-m'));
  });
  inEl.addEventListener('input', render);
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.textContent);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('env.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('env.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
