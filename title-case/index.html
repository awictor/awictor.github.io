<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TitleCase — Title Case &amp; Text Case Converter</title>
<meta name="description" content="Convert text to proper Title Case (with small-word rules), Sentence case, UPPERCASE, or lowercase. 100% offline, no signup." />
<meta name="theme-color" content="#a21caf" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="TitleCase — Title Case Converter" />
<meta property="og:description" content="Proper Title Case, Sentence case, UPPER and lower. Offline." />
<meta property="og:url" content="https://awictor.github.io/title-case/" />
<link rel="canonical" href="https://awictor.github.io/title-case/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a21caf'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23fff' font-family='Georgia,serif' font-weight='bold'%3ETt%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#faf1fb; --ink:#25092a; --accent:#a21caf; --accent-d:#86198f;
    --card:#fff; --line:#eed6f2; --muted:#71547a; --field:#fff;
    --shadow:0 1px 2px rgba(37,9,42,.05),0 8px 24px rgba(37,9,42,.07); }
  [data-theme="dark"]{ --bg:#150818; --ink:#f4e9f6; --accent:#e879f9; --accent-d:#f0abfc;
    --card:#1e1022; --line:#331f38; --muted:#a888ad; --field:#150818;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:600px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  textarea{width:100%;min-height:120px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:var(--field);color:var(--ink);resize:vertical;font-family:inherit}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(162,28,175,.15)}
  textarea.out{background:var(--bg)}
  .ops{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #msg{font-size:12px;color:var(--muted);align-self:center}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("titlecase.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Title</span>Case</h1>
  <p>Convert text to Title Case, Sentence case, UPPER, or lower. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <textarea id="input" spellcheck="false" placeholder="Type or paste text…">the lord of the rings: return of the king</textarea>
    <div class="ops">
      <button class="btn primary" data-op="title">Title Case</button>
      <button class="btn" data-op="sentence">Sentence case</button>
      <button class="btn" data-op="upper">UPPERCASE</button>
      <button class="btn" data-op="lower">lowercase</button>
    </div>
  </section>
  <section class="card">
    <textarea id="output" class="out" spellcheck="false" readonly></textarea>
    <div class="ops"><button class="btn" id="copy">Copy</button><span id="msg"></span></div>
  </section>
</div>

<footer>
  <b>TitleCase</b> · offline title case converter · <a href="https://github.com/awictor/title-case">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Title Case keeps small words (a, of, the…) lowercase unless first/last. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const SMALL=new Set("a an and as at but by for if in nor of off on or per so the to up via vs yet".split(" "));

// --- Pure case conversions ---
function titleCase(str){
  const words=String(str).trim().split(/\s+/).filter(Boolean);
  return words.map((w,i)=>{
    const lw=w.toLowerCase();
    if(i!==0 && i!==words.length-1 && SMALL.has(lw)) return lw;
    return lw.charAt(0).toUpperCase()+lw.slice(1);
  }).join(" ");
}
function sentenceCase(str){
  return String(str).toLowerCase().replace(/(^\s*[a-z])|([.!?]\s+[a-z])/g,c=>c.toUpperCase());
}
function upperCase(str){ return String(str).toUpperCase(); }
function lowerCase(str){ return String(str).toLowerCase(); }
function apply(op,text){
  return op==="title"?titleCase(text):op==="sentence"?sentenceCase(text):op==="upper"?upperCase(text):op==="lower"?lowerCase(text):text;
}

// --- UI ---
document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{ $("output").value=apply(b.dataset.op,$("input").value); });
$("input").addEventListener("input",()=>{try{localStorage.setItem("titlecase.input",$("input").value);}catch(e){}});
$("copy").onclick=()=>{const v=$("output").value;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1200);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();};
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("titlecase.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const t=localStorage.getItem("titlecase.input");if(t!=null)$("input").value=t;}catch(e){}
$("output").value=titleCase($("input").value);

if(typeof module!=="undefined") module.exports={titleCase,sentenceCase,upperCase,lowerCase,apply};
</script>
</body>
</html>
