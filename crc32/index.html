<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crc32 — CRC-32 checksum calculator</title>
<meta name="description" content="Free offline CRC-32 checksum calculator. Compute the CRC-32 (hex and decimal) of any text. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/crc32/">
<style>
  :root{
    --c:#3f3f46; --bg:#f8f8f9; --fg:#18181b; --muted:#52525b;
    --card:#ffffff; --border:#e4e4e7; --code:#efeff1;
  }
  [data-theme="dark"]{
    --bg:#09090b; --fg:#e7e7ea; --muted:#8b8b93; --card:#151518;
    --border:#27272a; --code:#1c1c20;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:700px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#71717a);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:700px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  textarea{width:100%;min-height:130px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;
    background:var(--bg);color:var(--fg);font-size:.95rem;line-height:1.55;resize:vertical;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .grid{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cell{background:var(--card);padding:14px 16px}
  .cell .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .cell .v{font-family:ui-monospace,monospace;font-weight:700;font-size:1.4rem;margin-top:3px;color:var(--c);
    cursor:pointer;user-select:all}
  .hint{color:var(--muted);font-size:.82rem;margin:16px 0 0}
  footer{max-width:700px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('crc.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">CRC</div>
  <div>
    <h1>Crc32</h1>
    <p class="sub">CRC-32 checksum calculator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <label for="in">Text</label>
    <textarea id="in" spellcheck="false">The quick brown fox jumps over the lazy dog</textarea>
    <div class="grid" id="out"></div>
    <p class="hint">CRC-32 (IEEE 802.3 polynomial 0xEDB88320) — the checksum used by ZIP, PNG, and gzip.
      It detects accidental corruption, but is <b>not</b> a cryptographic hash. Runs locally.</p>
  </div>
</main>
<footer>
  Crc32 is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/crc32">Source</a>
</footer>

<script>
// ---- pure functions ----
function textToBytes(str){
  var u = unescape(encodeURIComponent(String(str)));
  var out = [];
  for(var i = 0; i < u.length; i++) out.push(u.charCodeAt(i) & 0xff);
  return out;
}
var CRC_TABLE = null;
function makeTable(){
  var t = new Array(256);
  for(var n = 0; n < 256; n++){
    var c = n;
    for(var k = 0; k < 8; k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    t[n] = c >>> 0;
  }
  return t;
}
function crc32(input){
  var bytes = (typeof input === 'string') ? textToBytes(input) : input;
  if(!CRC_TABLE) CRC_TABLE = makeTable();
  var crc = 0xFFFFFFFF;
  for(var i = 0; i < bytes.length; i++){
    crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function crc32Hex(input){
  var h = crc32(input).toString(16).toUpperCase();
  while(h.length < 8) h = '0' + h;
  return h;
}

if(typeof module !== 'undefined') module.exports = { textToBytes, makeTable, crc32, crc32Hex };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  function render(){
    var dec = crc32(inEl.value);
    outEl.innerHTML =
      '<div class="cell"><div class="k">CRC-32 (hex)</div><div class="v">' + crc32Hex(inEl.value) + '</div></div>' +
      '<div class="cell"><div class="k">CRC-32 (decimal)</div><div class="v">' + dec + '</div></div>';
    try{ localStorage.setItem('crc.in', inEl.value); }catch(e){}
  }
  inEl.addEventListener('input', render);
  outEl.addEventListener('click', function(e){
    var v = e.target.closest ? e.target.closest('.v') : null;
    if(v && navigator.clipboard) navigator.clipboard.writeText(v.textContent);
  });
  try{ var s = localStorage.getItem('crc.in'); if(s !== null) inEl.value = s; }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('crc.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('crc.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
