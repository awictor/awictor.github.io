<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RegexTest — Live Regular Expression Tester</title>
<meta name="description" content="Test regular expressions live: highlighted matches, capture groups, match count, flag toggles, and clear error messages. 100% offline, no signup." />
<meta name="theme-color" content="#7e22ce" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="RegexTest — Live Regex Tester" />
<meta property="og:description" content="Highlighted matches, capture groups, and match count, entirely offline." />
<meta property="og:url" content="https://awictor.github.io/regex-test/" />
<link rel="canonical" href="https://awictor.github.io/regex-test/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237e22ce'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3E.*%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f6f2fc; --ink:#1c1030; --accent:#7e22ce; --accent-d:#6b21a8;
    --card:#fff; --line:#e7ddf4; --muted:#655a80; --bad:#e5484d; --field:#fff; --mark:#fde68a; --markInk:#3a2c00;
    --shadow:0 1px 2px rgba(28,16,48,.05),0 8px 24px rgba(28,16,48,.07); }
  [data-theme="dark"]{ --bg:#0f0a1a; --ink:#ece7f7; --accent:#c084fc; --accent-d:#d8b4fe;
    --card:#18122a; --line:#2a2244; --muted:#968bbb; --bad:#f0685c; --field:#0f0a1a; --mark:#a16207; --markInk:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:760px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .pat{display:flex;align-items:center;gap:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
  .pat .slash{color:var(--muted)}
  #pattern{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:16px;background:var(--field);color:var(--ink)}
  #flags{width:70px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:16px;background:var(--field);color:var(--ink)}
  #pattern:focus,#flags:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(126,34,206,.15)}
  #pattern.bad{border-color:var(--bad)}
  .flags{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px}
  .flags label{display:flex;gap:5px;align-items:center;color:var(--muted)}
  textarea{width:100%;min-height:120px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);resize:vertical;line-height:1.6}
  .err{color:var(--bad);font-weight:600;font-size:13px;min-height:18px;margin-top:8px}
  .count{font-size:14px;color:var(--muted);margin-bottom:8px}
  .count b{color:var(--accent)}
  .preview{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;word-break:break-word;line-height:1.7;background:var(--bg);border-radius:10px;padding:12px 14px}
  mark{background:var(--mark);color:var(--markInk);border-radius:3px;padding:0 1px}
  .groups{margin-top:10px;font-size:13px;font-family:ui-monospace,monospace;color:var(--muted)}
  .groups .g{padding:3px 0}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("regex.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Regex</span>Test</h1>
  <p>Test regular expressions live — matches, groups, and errors. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="pat"><span class="slash">/</span><input id="pattern" spellcheck="false" autocomplete="off" value="(\w+)@(\w+)"><span class="slash">/</span><input id="flags" spellcheck="false" autocomplete="off" value="g"></div>
    <div class="flags">
      <label><input type="checkbox" data-f="g" checked> g (global)</label>
      <label><input type="checkbox" data-f="i"> i (ignore case)</label>
      <label><input type="checkbox" data-f="m"> m (multiline)</label>
      <label><input type="checkbox" data-f="s"> s (dotall)</label>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <h2>Test string</h2>
    <textarea id="text" spellcheck="false">Contact bob@example or alice@site for details.</textarea>
  </section>

  <section class="card">
    <div class="count" id="count"></div>
    <div class="preview" id="preview"></div>
    <div class="groups" id="groups"></div>
  </section>
</div>

<footer>
  <b>RegexTest</b> · offline regular expression tester · <a href="https://github.com/awictor/regex-test">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  JavaScript regex engine. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure regex runner ---
function runRegex(pattern,flags,text){
  let re;
  try{ re=new RegExp(pattern,flags); }catch(e){ return {error:e.message, matches:[]}; }
  const matches=[];
  if(re.global){
    let m,guard=0;
    while((m=re.exec(text))!==null){
      matches.push({match:m[0],index:m.index,groups:m.slice(1)});
      if(m.index===re.lastIndex) re.lastIndex++;
      if(++guard>100000) break;
    }
  } else {
    const m=re.exec(text);
    if(m) matches.push({match:m[0],index:m.index,groups:m.slice(1)});
  }
  return {error:null, matches};
}

// --- UI ---
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function highlight(text,matches){
  let out="",pos=0;
  for(const m of matches){
    if(m.index<pos) continue; // skip overlaps
    out+=esc(text.slice(pos,m.index));
    out+= m.match.length ? "<mark>"+esc(m.match)+"</mark>" : "<mark>&#8203;</mark>";
    pos=m.index+m.match.length;
  }
  out+=esc(text.slice(pos));
  return out;
}
function render(){
  const pattern=$("pattern").value, flags=$("flags").value, text=$("text").value;
  try{localStorage.setItem("regex.pattern",pattern);localStorage.setItem("regex.flags",flags);localStorage.setItem("regex.text",text);}catch(e){}
  const r=runRegex(pattern,flags,text);
  if(r.error){ $("pattern").classList.add("bad"); $("err").textContent=r.error; $("count").textContent=""; $("preview").innerHTML=""; $("groups").innerHTML=""; return; }
  $("pattern").classList.remove("bad"); $("err").textContent="";
  $("count").innerHTML="<b>"+r.matches.length+"</b> match"+(r.matches.length===1?"":"es");
  $("preview").innerHTML=highlight(text,r.matches)||"<span style='color:var(--muted)'>(no text)</span>";
  const withGroups=r.matches.filter(m=>m.groups.length);
  $("groups").innerHTML=withGroups.length? withGroups.slice(0,20).map((m,i)=>`<div class="g">match ${i+1}: ${m.groups.map((g,gi)=>"$"+(gi+1)+"="+(g==null?"∅":esc(g))).join("  ")}</div>`).join("") : "";
}
$("pattern").addEventListener("input",render);
$("text").addEventListener("input",render);
$("flags").addEventListener("input",()=>{syncBoxes();render();});
function syncBoxes(){ const f=$("flags").value; document.querySelectorAll("[data-f]").forEach(b=>b.checked=f.includes(b.dataset.f)); }
document.querySelectorAll("[data-f]").forEach(b=>b.onchange=()=>{
  let f=$("flags").value.replace(b.dataset.f,""); if(b.checked) f+=b.dataset.f; $("flags").value=f; render();
});
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("regex.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const p=localStorage.getItem("regex.pattern");if(p!=null)$("pattern").value=p;const f=localStorage.getItem("regex.flags");if(f!=null)$("flags").value=f;const t=localStorage.getItem("regex.text");if(t!=null)$("text").value=t;}catch(e){}
syncBoxes(); render();

if(typeof module!=="undefined") module.exports={runRegex};
</script>
</body>
</html>
