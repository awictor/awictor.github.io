<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubnetCalc — IPv4 / CIDR subnet calculator</title>
<meta name="description" content="Free offline IPv4 subnet calculator. Enter an IP and CIDR prefix to get the network address, broadcast, usable host range, subnet mask, wildcard, and host count. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/subnet-calc/">
<style>
  :root{
    --c:#7c3aed; --bg:#faf9fc; --fg:#1f1a2e; --muted:#6b6580;
    --card:#ffffff; --border:#e7e3ef; --code:#f2eefb;
  }
  [data-theme="dark"]{
    --bg:#151221; --fg:#ece9f5; --muted:#9d97b3; --card:#1e1a2e;
    --border:#302a44; --code:#241f38;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;
    display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#a78bfa);
    display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--fg);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.88rem;margin:0 0 6px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .fld{flex:1;min-width:180px}
  input,select{width:100%;padding:11px 13px;border:1px solid var(--border);
    border-radius:11px;background:var(--bg);color:var(--fg);font-size:1rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  input:focus,select:focus{outline:2px solid var(--c);border-color:var(--c)}
  .err{color:#dc2626;font-size:.86rem;margin:10px 0 0;min-height:1.1em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--border);border:1px solid var(--border);
    border-radius:13px;overflow:hidden;margin-top:20px}
  .cell{background:var(--card);padding:13px 15px}
  .cell .k{font-size:.76rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em}
  .cell .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:1.02rem;margin-top:3px;word-break:break-all}
  .cell.wide{grid-column:1 / -1}
  .hint{color:var(--muted);font-size:.82rem;margin:14px 0 0}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;
    color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.cell.wide{grid-column:auto}}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('subnet.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">🌐</div>
  <div>
    <h1>SubnetCalc</h1>
    <p class="sub">IPv4 / CIDR subnet calculator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="row">
      <div class="fld">
        <label for="ip">IP address</label>
        <input id="ip" value="192.168.1.10" spellcheck="false" autocomplete="off"
          inputmode="decimal" placeholder="192.168.1.10">
      </div>
      <div class="fld" style="max-width:120px;flex:0 0 120px">
        <label for="prefix">Prefix</label>
        <select id="prefix"></select>
      </div>
    </div>
    <p class="err" id="err"></p>
    <div class="grid" id="out"></div>
    <p class="hint">Enter <code>10.0.0.1</code> and <code>/8</code>, or paste a full
      <code>192.168.1.10/24</code> into the IP field. Everything runs locally — nothing leaves your browser.</p>
  </div>
</main>
<footer>
  SubnetCalc is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/subnet-calc">Source</a>
</footer>

<script>
// ---- pure functions ----
function ipToInt(ip){
  var p = String(ip).trim().split('.');
  if(p.length !== 4) return null;
  var n = 0;
  for(var i=0;i<4;i++){
    if(!/^\d{1,3}$/.test(p[i])) return null;
    var o = Number(p[i]);
    if(o < 0 || o > 255) return null;
    n = n * 256 + o;
  }
  return n >>> 0;
}
function intToIp(n){
  n = n >>> 0;
  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
}
function parseCidr(str){
  var s = String(str).trim();
  var m = s.match(/^(.+?)\/(\d{1,2})$/);
  if(!m) return null;
  var ip = ipToInt(m[1]);
  var prefix = Number(m[2]);
  if(ip === null || prefix < 0 || prefix > 32) return null;
  return { ip: ip, prefix: prefix };
}
function maskInt(prefix){
  if(prefix <= 0) return 0;
  if(prefix >= 32) return 0xFFFFFFFF >>> 0;
  return (0xFFFFFFFF << (32 - prefix)) >>> 0;
}
function subnetInfo(ip, prefix){
  if(ip === null || prefix < 0 || prefix > 32) return null;
  var mask = maskInt(prefix);
  var network = (ip & mask) >>> 0;
  var broadcast = (network | (~mask >>> 0)) >>> 0;
  var total = Math.pow(2, 32 - prefix);
  var usable, firstHost, lastHost;
  if(total <= 2){ // /31, /32 — no separate net/broadcast usable range
    usable = total;
    firstHost = network;
    lastHost = broadcast;
  } else {
    usable = total - 2;
    firstHost = (network + 1) >>> 0;
    lastHost = (broadcast - 1) >>> 0;
  }
  return {
    prefix: prefix,
    mask: intToIp(mask),
    wildcard: intToIp(~mask >>> 0),
    network: intToIp(network),
    broadcast: intToIp(broadcast),
    firstHost: intToIp(firstHost),
    lastHost: intToIp(lastHost),
    totalHosts: total,
    usableHosts: usable,
    ipClass: ipClass(ip),
    isPrivate: isPrivate(ip)
  };
}
function ipClass(ip){
  var first = (ip >>> 24) & 255;
  if(first < 128) return 'A';
  if(first < 192) return 'B';
  if(first < 224) return 'C';
  if(first < 240) return 'D (multicast)';
  return 'E (reserved)';
}
function isPrivate(ip){
  var a = (ip>>>24)&255, b = (ip>>>16)&255;
  if(a === 10) return true;
  if(a === 172 && b >= 16 && b <= 31) return true;
  if(a === 192 && b === 168) return true;
  if(a === 127) return true; // loopback
  return false;
}

if(typeof module !== 'undefined') module.exports = {
  ipToInt, intToIp, parseCidr, maskInt, subnetInfo, ipClass, isPrivate
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var sel = document.getElementById('prefix');
  if(sel){
    for(var i=0;i<=32;i++){
      var o = document.createElement('option');
      o.value = i; o.textContent = '/' + i;
      if(i === 24) o.selected = true;
      sel.appendChild(o);
    }
  }
  var ipEl = document.getElementById('ip');
  var errEl = document.getElementById('err');
  var outEl = document.getElementById('out');

  function cell(k, v, wide){
    return '<div class="cell'+(wide?' wide':'')+'"><div class="k">'+k+
      '</div><div class="v">'+v+'</div></div>';
  }
  function render(){
    var raw = ipEl.value.trim();
    var prefix = Number(sel.value);
    // allow pasting full CIDR into the IP field
    if(raw.indexOf('/') !== -1){
      var pc = parseCidr(raw);
      if(pc){
        ipEl.value = intToIpKeep(raw);
        prefix = pc.prefix;
        sel.value = pc.prefix;
      }
    }
    var ip = ipToInt(ipEl.value.trim());
    if(ip === null){
      errEl.textContent = 'Enter a valid IPv4 address (e.g. 192.168.1.10).';
      outEl.style.display = 'none';
      return;
    }
    errEl.textContent = '';
    outEl.style.display = '';
    var info = subnetInfo(ip, prefix);
    outEl.innerHTML =
      cell('Network address', info.network) +
      cell('Broadcast', info.broadcast) +
      cell('Usable range', info.firstHost + ' – ' + info.lastHost, true) +
      cell('Subnet mask', info.mask) +
      cell('Wildcard', info.wildcard) +
      cell('Total addresses', info.totalHosts.toLocaleString()) +
      cell('Usable hosts', info.usableHosts.toLocaleString()) +
      cell('IP class', info.ipClass) +
      cell('Scope', info.isPrivate ? 'Private / loopback' : 'Public');
    try{ localStorage.setItem('subnet.ip', ipEl.value.trim());
         localStorage.setItem('subnet.prefix', String(prefix)); }catch(e){}
  }
  function intToIpKeep(raw){ // strip the /nn, keep the ip text
    return raw.split('/')[0].trim();
  }
  try{
    var savedIp = localStorage.getItem('subnet.ip');
    var savedPrefix = localStorage.getItem('subnet.prefix');
    if(savedIp) ipEl.value = savedIp;
    if(savedPrefix !== null) sel.value = savedPrefix;
  }catch(e){}
  ipEl.addEventListener('input', render);
  sel.addEventListener('change', render);
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('subnet.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('subnet.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
