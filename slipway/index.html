<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slipway — Procedural Starship Drydock</title>
<style>
  :root{
    --panel:#0d1118; --panel2:#131a24; --edge:#233246; --edge2:#2f4460;
    --txt:#cfe0f2; --txt-dim:#7f93aa; --accent:#ffd23f; --accent2:#4fd6ff;
    --btn:#1b2635; --btn-h:#26374d; --field:#0a0f16;
    --font-ui: "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-mono:"Consolas","SFMono-Regular","Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 78% -10%, #16233a 0%, #0a0e14 55%, #070a0f 100%);
    color:var(--txt); font-family:var(--font-ui); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:322px 1fr; height:100vh; min-height:0}

  /* ---------- Sidebar ---------- */
  aside.controls{
    background:linear-gradient(180deg,var(--panel) 0%, #0a0e14 100%);
    border-right:1px solid var(--edge); display:flex; flex-direction:column;
    min-height:0;
  }
  .brand{padding:18px 20px 14px; border-bottom:1px solid var(--edge)}
  .brand h1{
    margin:0; font-size:23px; letter-spacing:.32em; font-weight:800;
    background:linear-gradient(90deg,var(--accent),#ff9d3d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand .tag{margin:6px 0 0; font-size:11px; color:var(--txt-dim); letter-spacing:.04em; line-height:1.45}
  .brand .glyph{font-family:var(--font-mono); font-size:10px; color:var(--accent2); letter-spacing:.3em; margin-top:8px; opacity:.7}

  .ctl-scroll{overflow-y:auto; padding:14px 18px 8px; flex:1; min-height:0}
  .ctl-scroll::-webkit-scrollbar{width:9px}
  .ctl-scroll::-webkit-scrollbar-thumb{background:var(--edge2); border-radius:6px}

  .grp{margin-bottom:16px}
  .grp > label, .lbl{
    display:block; font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--txt-dim); margin-bottom:7px; font-weight:700;
  }
  .seedrow{display:flex; gap:7px}
  input[type=text]{
    flex:1; min-width:0; background:var(--field); border:1px solid var(--edge2); color:var(--txt);
    font-family:var(--font-mono); font-size:13px; padding:9px 10px; border-radius:7px; letter-spacing:.05em;
  }
  input[type=text]:focus{outline:none; border-color:var(--accent2); box-shadow:0 0 0 2px rgba(79,214,255,.15)}
  select{
    width:100%; background:var(--field); border:1px solid var(--edge2); color:var(--txt);
    font-family:var(--font-ui); font-size:13px; padding:9px 10px; border-radius:7px; cursor:pointer;
    -webkit-appearance:none; -moz-appearance:none; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--txt-dim) 50%),linear-gradient(135deg,var(--txt-dim) 50%,transparent 50%);
    background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  }
  select:focus{outline:none; border-color:var(--accent2)}
  button{font-family:var(--font-ui); cursor:pointer; border:none}
  .btn{
    background:var(--btn); color:var(--txt); border:1px solid var(--edge2); border-radius:7px;
    padding:9px 12px; font-size:12px; font-weight:600; transition:background .12s,border-color .12s; letter-spacing:.02em;
  }
  .btn:hover{background:var(--btn-h); border-color:var(--accent2)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible, .seg button:focus-visible{outline:none; border-color:var(--accent2); box-shadow:0 0 0 2px rgba(79,214,255,.25)}
  .seg button:focus-visible{position:relative; z-index:1}
  .btn.roll{flex:0 0 auto; padding:9px 12px}
  .btn.primary{background:linear-gradient(180deg,#3a2e0e,#241c08); border-color:#7a601c; color:var(--accent)}
  .btn.primary:hover{background:#4a3a12}
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:7px}
  .btnrow.three{grid-template-columns:1fr 1fr 1fr}

  input[type=range]{width:100%; accent-color:var(--accent2); cursor:pointer}
  .rangeval{float:right; font-family:var(--font-mono); font-size:11px; color:var(--accent2)}
  .checkrow{display:flex; align-items:center; gap:9px; padding:5px 0}
  .checkrow input{width:16px; height:16px; accent-color:var(--accent2); cursor:pointer}
  .checkrow label{font-size:12.5px; color:var(--txt); cursor:pointer; letter-spacing:.02em}

  .seg{display:flex; background:var(--field); border:1px solid var(--edge2); border-radius:7px; overflow:hidden}
  .seg button{flex:1; background:transparent; color:var(--txt-dim); padding:8px 6px; font-size:11.5px; font-weight:700; letter-spacing:.06em}
  .seg button.on{background:var(--btn-h); color:var(--accent2)}

  .foot{padding:11px 18px; border-top:1px solid var(--edge); font-size:10px; color:var(--txt-dim); line-height:1.5}
  .foot code{color:var(--accent2); font-family:var(--font-mono)}

  .fleetopts{display:none}
  .fleetopts.on{display:block}
  .single-only.hide{display:none}

  /* ---------- Stage ---------- */
  main.stage{position:relative; min-width:0; display:flex; align-items:center; justify-content:center; padding:26px; overflow:auto}
  #sheet{width:100%; height:100%; display:flex; align-items:center; justify-content:center}
  #sheet svg{max-width:100%; max-height:100%; filter:drop-shadow(0 24px 60px rgba(0,0,0,.55)); border-radius:3px}
  #fleet{display:none; width:100%; height:100%; overflow:auto; padding:4px}
  #fleet svg{width:100%; height:auto; filter:drop-shadow(0 24px 60px rgba(0,0,0,.55)); border-radius:3px}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px);
    background:#0d1420; border:1px solid var(--accent2); color:var(--txt); padding:11px 20px;
    border-radius:9px; font-size:13px; opacity:0; pointer-events:none; transition:all .28s cubic-bezier(.2,.9,.3,1); z-index:50;
    box-shadow:0 12px 34px rgba(0,0,0,.5); letter-spacing:.02em;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .hint{position:absolute; top:14px; right:18px; font-family:var(--font-mono); font-size:10px; color:var(--txt-dim); letter-spacing:.14em; opacity:.6}

  /* ---------- Responsive: stack on narrow viewports so shared #seed links stay legible on mobile ---------- */
  @media (max-width:720px){
    html,body{height:auto}
    body{overflow:auto}
    .app{grid-template-columns:1fr; height:auto; min-height:100vh}
    aside.controls{border-right:none; border-bottom:1px solid var(--edge)}
    .ctl-scroll{max-height:none; overflow-y:visible}
    main.stage{min-height:60vh; padding:16px}
    .hint{display:none}
  }
</style>
</head>

        <div class="checkrow"><input type="checkbox" id="animate" checked><label for="animate">Animated ink reveal</label></div>
      </div>

      <div class="grp">

        <div class="btnrow three">
          <button class="btn" id="copyLink" title="Copy shareable URL">⧉ Link</button>
          <button class="btn" id="dlSvg" title="Download SVG">↓ SVG</button>
          <button class="btn" id="dlPng" title="Download PNG">↓ PNG</button>
        </div>
      </div>
    </div>

    <div class="foot">
      Every hull is reproducible from its seed. Share via the <code>#</code> URL — one paste and anyone rebuilds the exact same ship.
    </div>

  <main class="stage">
    <div class="hint" id="hint">DRAFTING SHEET · ISO A-SERIES</div>
    <div id="sheet"></div>

</div>

<script>
"use strict";
/* =====================================================================
   SLIPWAY — procedural starship drydock
   Zero dependencies. Deterministic from seed. One parametric model,
   projected into three orthographic views.
   ===================================================================== */

/* ---------- deterministic PRNG ---------- */
function xmur3(str){
  let h=1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h=Math.imul(h ^ str.charCodeAt(i),3432918353);
    h=(h<<13)|(h>>>19);
  }
  return function(){
    h=Math.imul(h ^ (h>>>16),2246822507);
    h=Math.imul(h ^ (h>>>13),3266489909);
    return (h ^= h>>>16)>>>0;
  };
}
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a ^ (a>>>15), 1|a);
    t=(t+Math.imul(t ^ (t>>>7), 61|t)) ^ t;
    return ((t ^ (t>>>14))>>>0)/4294967296;
  };
}
function makeRng(seedStr){
  const seed=xmur3(String(seedStr));
  const r=mulberry32(seed());
  const api={
    next:r,
    f:(a,b)=>a+(b-a)*r(),
    i:(a,b)=>Math.floor(a+(b-a+1)*r()),
    pick:(arr)=>arr[Math.floor(r()*arr.length)],
    chance:(p)=>r()<p,
    // gaussian-ish via sum
    g:()=>((r()+r()+r())/3),
    weighted:(pairs)=>{ // [[val,w],...]
      let tot=0; for(const p of pairs) tot+=p[1];
      let x=r()*tot;
      for(const p of pairs){ x-=p[1]; if(x<=0) return p[0]; }
      return pairs[pairs.length-1][0];
    }
  };
  return api;
}

/* ---------- math helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const num=(v)=>{ v=+v; return (Math.abs(v)<0.005?0:v).toFixed(2); };

/* Catmull-Rom interpolation over keypoints [[x,v],...] */
function catmull1D(kp,t){
  if(t<=kp[0][0]) return kp[0][1];
  if(t>=kp[kp.length-1][0]) return kp[kp.length-1][1];
  let i=0; while(i<kp.length-1 && kp[i+1][0]<t) i++;
  const p1=kp[i], p2=kp[i+1];
  const p0=kp[Math.max(0,i-1)], p3=kp[Math.min(kp.length-1,i+2)];
  const s=(t-p1[0])/(p2[0]-p1[0]);
  return 0.5*((2*p1[1]) + (-p0[1]+p2[1])*s + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*s*s + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*s*s*s);
}

/* Smooth closed/open path from points via Catmull-Rom -> cubic bezier */
function smoothPath(pts,closed){
  if(pts.length<2) return "";
  const n=pts.length;
  const get=(i)=>{ if(closed) return pts[((i%n)+n)%n]; return pts[clamp(i,0,n-1)]; };
  let d=`M ${num(pts[0][0])} ${num(pts[0][1])}`;
  const end=closed?n:n-1;
  for(let i=0;i<end;i++){
    const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${num(c1x)} ${num(c1y)}, ${num(c2x)} ${num(c2y)}, ${num(p2[0])} ${num(p2[1])}`;
  }
  if(closed) d+=" Z";
  return d;
}

/* ---------- ship generation (all geometry in metres) ---------- */
function generateShip(seedStr, opts){
  opts=opts||{};
  const facKey=opts.faction||"standard";
  const fac=FACTION_DEFS[facKey];
  const rng=makeRng(seedStr+"::"+facKey+"::v2");

  const classKey = (opts.hullClass && opts.hullClass!=="auto") ? opts.hullClass : rng.pick(CLASS_KEYS);
  const C=CLASS_DEFS[classKey];

  const L = Math.round(lerp(C.Lmin,C.Lmax,rng.f(0,1)));
  const beam = +(L*C.beamR*rng.f(0.85,1.12)).toFixed(1);
  const height = +(L*C.heightR*rng.f(0.85,1.12)).toFixed(1);

  // ---- profiles ----
  const N=80;
  const jitter=(kp)=>kp.map(([x,v])=>[x, Math.max(0.005, v*rng.f(0.86,1.14))]);
  const wkp=jitter(C.wkp), hkp=jitter(C.hkp);
  let hwRaw=[], hhRaw=[];
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    hwRaw.push(Math.max(0,catmull1D(wkp,t)));
    hhRaw.push(Math.max(0,catmull1D(hkp,t)));
  }
  const maxHW=Math.max(...hwRaw), maxHH=Math.max(...hhRaw);
  // faction reshaping
  const boxTop=(t)=> t<0.13 ? (t/0.13) : (t>0.80 ? Math.max(0.10, 1-(t-0.80)/0.20*0.92) : 1);
  const noseC=fac.noseChamfer;
  const hwm=[], hhm=[], xs=[];
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    let w=hwRaw[i]/maxHW, h=hhRaw[i]/maxHH;
    if(fac.boxy>0){ w=lerp(w, boxTop(t), fac.boxy); h=lerp(h, boxTop(t), fac.boxy); }
    if(fac.curvy>0){ const b=3+Math.floor(rng.f(1,4));
      w*= 1 + fac.curvy*0.14*Math.sin(t*Math.PI*b + rng.f(0,6.28));
      h*= 1 + fac.curvy*0.12*Math.sin(t*Math.PI*(b+1) + rng.f(0,6.28)); }
    if(noseC>0 && t<noseC){ const k=t/noseC; w=lerp(w*0.55+0.10, w, k); } // blunter nose
    xs.push(+(t*L).toFixed(2));
    hwm.push(Math.max(0.002, w)*beam/2);
    hhm.push(Math.max(0.002, h)*height/2);
  }
  const hwAt=(t)=>{ const idx=clamp(Math.round(t*(N-1)),0,N-1); return hwm[idx]; };
  const hhAt=(t)=>{ const idx=clamp(Math.round(t*(N-1)),0,N-1); return hhm[idx]; };

  // ---- engines / nacelle pods ----
  let E = (opts.engines && opts.engines!=="auto") ? parseInt(opts.engines,10)
        : rng.weighted([[1,2],[2,5],[3,3],[4,3],[6,1]]);
  E=clamp(E,1,6);
  const spreadFor=(n)=>{
    if(n===1) return [0];
    const out=[]; for(let i=0;i<n;i++) out.push(-1 + 2*i/(n-1));
    return out;
  };
  const podXc = 0.82*L, podLen=lerp(0.14,0.24,rng.f(0,1))*L, podR=Math.max(beam*0.045, height*0.10, 0.9);
  const rearHalf=hwAt(0.80);
  const podZ = -height*0.04;
  const pods=[], thrusters=[];
  spreadFor(E).forEach((f,idx)=>{
    let y = f*rearHalf*0.82;
    if(!opts.symmetry && f!==0) y*= (idx%2? 1.08:0.9); // asymmetry
    pods.push({x0:podXc-podLen/2, x1:podXc+podLen/2, y, r:podR, z:podZ});
    thrusters.push({x0:podXc+podLen*0.42, x1:L*0.995, y, r:podR*0.86, z:podZ});
  });

  // ---- wings ----
  const wings=[];
  let wingSpanHalf=beam/2;
  if(C.wings!=="none"){
    const isDelta=C.wings==="delta";
    const rx0=isDelta?0.52*L:0.62*L, rx1=isDelta?0.97*L:0.90*L;
    const tipX=isDelta?0.90*L:0.86*L;
    const span=(isDelta? beam*rng.f(1.5,2.0): beam*rng.f(0.7,1.05));
    wingSpanHalf=Math.max(wingSpanHalf, beam/2+span);
    for(const sgn of [1,-1]){
      let sp=span; if(!opts.symmetry) sp*= (sgn>0?1:rng.f(0.82,0.98));
      wings.push([[rx0,sgn*hwAt(rx0/L)],[rx1,sgn*hwAt(rx1/L)*0.7],[tipX,sgn*(beam/2+sp)]]);
    }
  }
  // dorsal fin (side)
  let fin=null;
  if(C.finTop){
    const fx0=0.60*L, fx1=0.94*L, ftipX=0.72*L;
    fin=[[fx0,hhAt(fx0/L)],[fx1,hhAt(fx1/L)*0.7],[ftipX,hhAt(ftipX/L)+height*rng.f(0.28,0.5)]];
  }

  // ---- bridge / superstructure ----
  let bridge=null;
  if(C.bridge){
    const bx = (classKey==="hauler") ? 0.14*L : rng.f(0.20,0.34)*L;
    const bw = rng.f(0.06,0.11)*L;
    const bh = height*rng.f(0.22,0.42);
    const bwid = hwAt(bx/L)*rng.f(0.5,0.85);
    bridge={x:bx, w:bw, h:bh, halfW:bwid};
  }

  // ---- containers (haulers) ----
  const containers=[];
  if(C.containers || fac.containersForce){
    const cx0=(bridge?bridge.x+bridge.w:0.20*L)+0.03*L, cx1=podXc-podLen*0.7;
    const cols=rng.i(3,6), rows=rng.i(2,3);
    const cw=(cx1-cx0)/cols, availH=hhAt(0.5)*1.6, ch=availH/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      containers.push({x0:cx0+c*cw+cw*0.06, x1:cx0+(c+1)*cw-cw*0.06,
        z0:-availH/2+r*ch+ch*0.08, z1:-availH/2+(r+1)*ch-ch*0.08,
        y:hwAt((cx0+c*cw)/L)*0.9});
    }
  }

  // ---- masts / sensor antennae ----
  const masts=[];
  const mCount=C.masts;
  for(let i=0;i<mCount;i++){
    const mx=rng.f(0.10,0.30)*L;
    const side = opts.symmetry?0:(rng.chance(0.5)?1:-1);
    masts.push({x:mx, len:height*rng.f(0.5,0.95), tip:rng.pick(["dish","cross","node"]), yside:side});
  }

  // ---- hardpoints ----
  const hardpoints=[];
  const hpN=rng.i(C.hardpoints[0],C.hardpoints[1]);
  for(let i=0;i<hpN;i++){
    const hx=rng.f(0.22,0.78)*L;
    const dorsal=rng.chance(0.5);
    const yf=rng.f(0.15,0.8);
    for(const sgn of [1,-1]){
      if(!opts.symmetry && sgn<0 && rng.chance(0.35)) continue;
      hardpoints.push({x:hx, y:sgn*hwAt(hx/L)*yf, z:(dorsal?1:-1)*hhAt(hx/L)*0.9, size:beam*0.03+0.5});
    }
  }

  // ---- flight deck (carrier) ----
  const flightDeck = C.flightDeck ? {x0:0.30*L, x1:0.86*L} : null;

  // =========== specs ===========
  const volume = L*beam*height;
  const mass = Math.round(volume*0.34*rng.f(0.8,1.25));
  const crew = Math.round(lerp(C.crew[0],C.crew[1],rng.f(0,1)));
  const thrust = +(mass*0.00028*(E+1)*rng.f(0.8,1.3)*100).toFixed(1); // MN
  const deltaV = Math.round(lerp(6,42,rng.f(0,1))*10)/10;
  const powerplant = rng.pick(LORE.powerplant);
  const drive = rng.pick(LORE.drives);

  // =========== lore ===========
  const prefix = rng.pick(fac.prefixes);
  const name = rng.pick(LORE.names);
  const className = rng.pick(LORE.classNames);
  const typeCode = rng.pick(C.typePrefixes)+"-"+rng.i(1,9);
  const yard = rng.pick(LORE.yardPlace)+" "+rng.pick(LORE.yardType);
  const motto = rng.pick(LORE.mottos);
  const year = rng.i(2311,2499);
  const registry = rng.pick(fac.prefixes.length>1?["A","B","C","D","M","X"]:["A"]); // reserved: DO NOT remove — this rng.pick() draw preserves seed determinism for every already-shared #seed URL
  const regNum = `${(rng.pick(C.typePrefixes))}-${String(rng.i(1000,9998)).padStart(4,"0")}-${rng.pick(["A","B","C","D","E","F","G","H"])}`;
  const sector = rng.pick(LORE.sectors);
  // service record templated
  let evPool = LORE.eventsCiv;
  if(facKey==="military") evPool=LORE.eventsMil;
  else if(facKey==="alien") evPool=LORE.eventsAlien;
  else if(classKey==="cruiser"||classKey==="carrier"||classKey==="frigate") evPool=LORE.eventsMil;
  let record = rng.pick(evPool)
    .replace("{P}",rng.pick(LORE.yardPlace))
    .replace("{N}",rng.i(1,12))
    .replace("{S}",sector)
    .replace("{K}",rng.i(3,240))
    .replace("{Y}",rng.i(year+1,year+30))
    .replace("{Z}",rng.i(year+31,year+60));

  return {
    seed:seedStr, faction:facKey, fac, classKey, C,
    L, beam, height, N, xs, hwm, hhm, hwAt, hhAt,
    pods, thrusters, wings, wingSpanHalf, fin, bridge, containers, masts, hardpoints, flightDeck, E,
    specs:{ L, beam, height, mass, crew, thrust, deltaV, powerplant, drive, hardpoints:hpN, engines:E },
    lore:{ prefix, name, className, typeCode, yard, motto, year, regNum, sector, record }
  };
}

/* ---------- view projector ---------- */
function makeProjector(model, layout){
  const {L,beam,height,wingSpanHalf}=model;
  const spanW=Math.max(beam, wingSpanHalf*2);
  const s=Math.min(layout.usableLen/L, layout.maxHalfW/(spanW/2), layout.maxHalfH/(height/2));
  const drawnLen=L*s;
  const x0=layout.leftX + (layout.usableLen-drawnLen)/2;
  return {
    s, drawnLen, x0,
    TX:(xm)=>x0+xm*s,
    TY:(ym)=>layout.topCY - ym*s,
    SY:(zm)=>layout.sideCY - zm*s,
    FX:(ym)=>layout.frontCX+ym*s,
    FY:(zm)=>layout.frontCY - zm*s
  };
}

/* ---------- individual view drawing (returns svg fragment strings) ---------- */
function drawTopView(m,P,opt){
  const detail=opt.detail, gd=opt.greeble;
  let s="";
  // hull outline
  const up=[], dn=[];
  for(let i=0;i<m.N;i++){ up.push([P.TX(m.xs[i]),P.TY(m.hwm[i])]); dn.push([P.TX(m.xs[i]),P.TY(-m.hwm[i])]); }
  const pts=up.concat(dn.slice().reverse());
  // wings behind hull
  for(const w of m.wings) s+=`<path class="ink" d="${smoothPath(w.map(p=>[P.TX(p[0]),P.TY(p[1])]),true)}"/>`;
  s+=`<path class="ink hull" d="${smoothPath(pts,true)}"/>`;
  // pods
  for(const p of m.pods){
    const x=P.TX(p.x0), w=(p.x1-p.x0)*P.s, y=P.TY(p.y+p.r), h=2*p.r*P.s;
    s+=`<rect class="ink" x="${num(x)}" y="${num(y)}" width="${num(w)}" height="${num(h)}" rx="${num(p.r*P.s*0.5)}"/>`;
  }
  // thrusters (nozzle bells)
  for(const t of m.thrusters){
    const a=[[P.TX(t.x0),P.TY(t.y+t.r*0.7)],[P.TX(t.x1),P.TY(t.y+t.r)],[P.TX(t.x1),P.TY(t.y-t.r)],[P.TX(t.x0),P.TY(t.y-t.r*0.7)]];
    s+=`<polygon class="ink dim" points="${a.map(p=>num(p[0])+","+num(p[1])).join(" ")}" fill="none"/>`;
  }
  // bridge
  if(m.bridge){
    const b=m.bridge;
    s+=`<rect class="ink" x="${num(P.TX(b.x))}" y="${num(P.TY(b.halfW))}" width="${num(b.w*P.s)}" height="${num(2*b.halfW*P.s)}" rx="2"/>`;
  }
  // containers
  for(const c of m.containers){
    s+=`<rect class="ink dim" x="${num(P.TX(c.x0))}" y="${num(P.TY(c.y))}" width="${num((c.x1-c.x0)*P.s)}" height="${num(2*c.y*P.s)}"/>`;
  }
  if(m.flightDeck){
    const fd=m.flightDeck;
    s+=`<line class="ink dim" x1="${num(P.TX(fd.x0))}" y1="${num(P.TY(0))}" x2="${num(P.TX(fd.x1))}" y2="${num(P.TY(0))}"/>`;
  }
  // masts
  for(const mst of m.masts){
    const yy = mst.yside* m.hwAt(mst.x/m.L)*0.5;
    s+=`<line class="ink dim" x1="${num(P.TX(mst.x))}" y1="${num(P.TY(yy)-4)}" x2="${num(P.TX(mst.x))}" y2="${num(P.TY(yy)+4)}"/>`;
  }
  // hardpoints
  for(const hp of m.hardpoints){
    s+=`<circle class="ink" cx="${num(P.TX(hp.x))}" cy="${num(P.TY(hp.y))}" r="${num(Math.max(1.5,hp.size*P.s))}"/>`;
  }
  if(detail){
    s+=drawGreebleTop(m,P,gd);
    // centreline
    s+=`<line class="ink faint" stroke-dasharray="6 5" x1="${num(P.x0)}" y1="${num(P.TY(0))}" x2="${num(P.x0+P.drawnLen)}" y2="${num(P.TY(0))}"/>`;
  }
  return s;
}

function drawGreebleTop(m,P,gd){
  if(gd<=0) return "";
  const rng=makeRng(m.seed+"::grbT::"+m.faction);
  let s="";
  // transverse frame lines
  const frames=Math.round(lerp(4,16,clamp(gd/2,0,1))*m.fac.greebleMul);
  for(let i=1;i<frames;i++){
    const t=i/frames; const hw=m.hwAt(t);
    if(hw<0.4) continue;
    s+=`<line class="ink faint" x1="${num(P.TX(t*m.L))}" y1="${num(P.TY(hw*0.92))}" x2="${num(P.TX(t*m.L))}" y2="${num(P.TY(-hw*0.92))}"/>`;
  }
  // longerons
  for(const f of [0.4,-0.4,0.7,-0.7]){
    const pp=[];
    for(let i=2;i<m.N-2;i++) pp.push([P.TX(m.xs[i]),P.TY(m.hwm[i]*f)]);
    s+=`<path class="ink faint" fill="none" d="${smoothPath(pp,false)}"/>`;
  }
  // hatches + rivets
  const hatches=Math.round(lerp(3,14,clamp(gd/2,0,1))*m.fac.greebleMul);
  for(let i=0;i<hatches;i++){
    const t=rng.f(0.15,0.9), hw=m.hwAt(t);
    const yf=rng.f(-0.7,0.7); const w=m.L*rng.f(0.015,0.04), h=hw*rng.f(0.12,0.3);
    const cx=P.TX(t*m.L), cy=P.TY(yf*hw);
    s+=`<rect class="ink faint" x="${num(cx-w*P.s/2)}" y="${num(cy-h*P.s)}" width="${num(w*P.s)}" height="${num(h*P.s)}" rx="1.5"/>`;
  }
  const rivets=Math.round(lerp(0,40,clamp(gd/2,0,1))*m.fac.greebleMul);
  for(let i=0;i<rivets;i++){
    const t=rng.f(0.1,0.95), hw=m.hwAt(t);
    s+=`<circle class="rivet" cx="${num(P.TX(t*m.L))}" cy="${num(P.TY(rng.f(-0.85,0.85)*hw))}" r="0.9"/>`;
  }
  return s;
}

function drawSideView(m,P,opt){
  const detail=opt.detail, gd=opt.greeble;
  let s="";
  const up=[], dn=[];
  for(let i=0;i<m.N;i++){ up.push([P.TX(m.xs[i]),P.SY(m.hhm[i])]); dn.push([P.TX(m.xs[i]),P.SY(-m.hhm[i]*0.78)]); }
  const pts=up.concat(dn.slice().reverse());
  if(m.fin) s+=`<path class="ink" d="${smoothPath(m.fin.map(p=>[P.TX(p[0]),P.SY(p[1])]),true)}"/>`;
  s+=`<path class="ink hull" d="${smoothPath(pts,true)}"/>`;
  // pods
  for(const p of m.pods){
    if(Math.abs(p.y)>1e-6 && p!==m.pods[0] && p.y<0) continue; // avoid drawing every mirrored pod overlapping; draw representative
    const x=P.TX(p.x0), w=(p.x1-p.x0)*P.s, y=P.SY(p.z+p.r), h=2*p.r*P.s;
    s+=`<rect class="ink" x="${num(x)}" y="${num(y)}" width="${num(w)}" height="${num(h)}" rx="${num(p.r*P.s*0.5)}"/>`;
  }
  for(const t of m.thrusters){
    if(t.y<0) continue;
    const a=[[P.TX(t.x0),P.SY(t.z+t.r*0.7)],[P.TX(t.x1),P.SY(t.z+t.r)],[P.TX(t.x1),P.SY(t.z-t.r)],[P.TX(t.x0),P.SY(t.z-t.r*0.7)]];
    s+=`<polyline class="ink dim" points="${a.map(p=>num(p[0])+","+num(p[1])).join(" ")}"/>`;
  }
  if(m.bridge){
    const b=m.bridge, topz=m.hhAt(b.x/m.L);
    const bx=P.TX(b.x), bw=b.w*P.s;
    s+=`<path class="ink" fill="none" d="M ${num(bx)} ${num(P.SY(topz))} L ${num(bx+bw*0.2)} ${num(P.SY(topz+b.h))} L ${num(bx+bw*0.85)} ${num(P.SY(topz+b.h))} L ${num(bx+bw)} ${num(P.SY(topz))}"/>`;
  }
  for(const c of m.containers){
    s+=`<rect class="ink dim" x="${num(P.TX(c.x0))}" y="${num(P.SY(c.z1))}" width="${num((c.x1-c.x0)*P.s)}" height="${num((c.z1-c.z0)*P.s)}"/>`;
  }
  if(m.flightDeck){
    const fd=m.flightDeck, tz=m.hhAt(0.55)*0.55;
    s+=`<line class="ink dim" x1="${num(P.TX(fd.x0))}" y1="${num(P.SY(tz))}" x2="${num(P.TX(fd.x1))}" y2="${num(P.SY(tz))}"/>`;
  }
  // masts vertical
  for(const mst of m.masts){
    const bx=P.TX(mst.x), topz=m.hhAt(mst.x/m.L);
    const ty=P.SY(topz+mst.len);
    s+=`<line class="ink dim" x1="${num(bx)}" y1="${num(P.SY(topz))}" x2="${num(bx)}" y2="${num(ty)}"/>`;
    if(mst.tip==="dish") s+=`<path class="ink dim" fill="none" d="M ${num(bx-5)} ${num(ty+2)} Q ${num(bx)} ${num(ty-7)} ${num(bx+5)} ${num(ty+2)}"/>`;
    else if(mst.tip==="cross"){ s+=`<line class="ink dim" x1="${num(bx-5)}" y1="${num(ty)}" x2="${num(bx+5)}" y2="${num(ty)}"/>`; }
    else s+=`<circle class="ink dim" cx="${num(bx)}" cy="${num(ty)}" r="2.5"/>`;
  }
  for(const hp of m.hardpoints){
    if(Math.abs(hp.y)>m.hwAt(hp.x/m.L)*0.35) continue; // only show near-centreline ones in profile
    s+=`<circle class="ink" cx="${num(P.TX(hp.x))}" cy="${num(P.SY(hp.z))}" r="${num(Math.max(1.5,hp.size*P.s))}"/>`;
  }
  if(detail){
    s+=drawGreebleSide(m,P,gd);
    s+=`<line class="ink faint" stroke-dasharray="6 5" x1="${num(P.x0)}" y1="${num(P.SY(0))}" x2="${num(P.x0+P.drawnLen)}" y2="${num(P.SY(0))}"/>`;
  }
  return s;
}

function drawGreebleSide(m,P,gd){
  if(gd<=0) return "";
  const rng=makeRng(m.seed+"::grbS::"+m.faction);
  let s="";
  const frames=Math.round(lerp(3,12,clamp(gd/2,0,1))*m.fac.greebleMul);
  for(let i=1;i<frames;i++){
    const t=i/frames, hh=m.hhAt(t);
    if(hh<0.4) continue;
    s+=`<line class="ink faint" x1="${num(P.TX(t*m.L))}" y1="${num(P.SY(hh*0.9))}" x2="${num(P.TX(t*m.L))}" y2="${num(P.SY(-hh*0.7))}"/>`;
  }
  // deck line
  const dl=[]; for(let i=2;i<m.N-2;i++) dl.push([P.TX(m.xs[i]),P.SY(m.hhm[i]*0.15)]);
  s+=`<path class="ink faint" fill="none" d="${smoothPath(dl,false)}"/>`;
  const win=Math.round(lerp(0,26,clamp(gd/2,0,1))*m.fac.greebleMul);
  for(let i=0;i<win;i++){
    const t=rng.f(0.12,0.9), hh=m.hhAt(t);
    s+=`<rect class="ink faint" x="${num(P.TX(t*m.L))}" y="${num(P.SY(rng.f(-0.2,0.6)*hh))}" width="2.5" height="2" />`;
  }
  return s;
}

function drawFrontView(m,P,opt){
  let s="";
  const Bh=m.beam/2, Hh=m.height/2;
  // wingspan line
  if(m.wings.length){
    const yz=P.FY(0);
    s+=`<line class="ink" x1="${num(P.FX(-m.wingSpanHalf))}" y1="${num(yz)}" x2="${num(P.FX(m.wingSpanHalf))}" y2="${num(yz)}"/>`;
    s+=`<path class="ink" fill="none" d="M ${num(P.FX(-m.wingSpanHalf))} ${num(yz)} L ${num(P.FX(-Bh))} ${num(P.FY(Hh*0.2))} L ${num(P.FX(-Bh))} ${num(P.FY(-Hh*0.2))} Z"/>`;
    s+=`<path class="ink" fill="none" d="M ${num(P.FX(m.wingSpanHalf))} ${num(yz)} L ${num(P.FX(Bh))} ${num(P.FY(Hh*0.2))} L ${num(P.FX(Bh))} ${num(P.FY(-Hh*0.2))} Z"/>`;
  }
  // hull cross section — rounded shape
  s+=`<ellipse class="ink hull" cx="${num(P.FX(0))}" cy="${num(P.FY(0))}" rx="${num(Bh*P.s)}" ry="${num(Hh*P.s)}"/>`;
  // interior structural ring
  s+=`<ellipse class="ink faint" cx="${num(P.FX(0))}" cy="${num(P.FY(0))}" rx="${num(Bh*P.s*0.72)}" ry="${num(Hh*P.s*0.72)}"/>`;
  // bridge bump on top
  if(m.bridge){
    s+=`<path class="ink" fill="none" d="M ${num(P.FX(-m.bridge.halfW))} ${num(P.FY(Hh))} Q ${num(P.FX(0))} ${num(P.FY(Hh+m.bridge.h))} ${num(P.FX(m.bridge.halfW))} ${num(P.FY(Hh))}"/>`;
  }
  // pods as circles
  for(const p of m.pods){
    s+=`<circle class="ink" cx="${num(P.FX(p.y))}" cy="${num(P.FY(p.z))}" r="${num(p.r*P.s)}"/>`;
    s+=`<circle class="ink faint" cx="${num(P.FX(p.y))}" cy="${num(P.FY(p.z))}" r="${num(p.r*P.s*0.5)}"/>`;
  }
  // centre cross
  s+=`<line class="ink faint" stroke-dasharray="5 4" x1="${num(P.FX(-Bh*1.15))}" y1="${num(P.FY(0))}" x2="${num(P.FX(Bh*1.15))}" y2="${num(P.FY(0))}"/>`;
  s+=`<line class="ink faint" stroke-dasharray="5 4" x1="${num(P.FX(0))}" y1="${num(P.FY(-Hh*1.25))}" x2="${num(P.FX(0))}" y2="${num(P.FY(Hh*1.25))}"/>`;
  return s;
}

/* ---------- dimension & callout helpers ---------- */
function dimLineH(x1,x2,y,label){
  const ah=4;
  return `<g class="ink dimline">
    <line x1="${num(x1)}" y1="${num(y)}" x2="${num(x2)}" y2="${num(y)}"/>
    <path d="M ${num(x1+ah*2)} ${num(y-ah)} L ${num(x1)} ${num(y)} L ${num(x1+ah*2)} ${num(y+ah)}"/>
    <path d="M ${num(x2-ah*2)} ${num(y-ah)} L ${num(x2)} ${num(y)} L ${num(x2-ah*2)} ${num(y+ah)}"/>
    <text class="fade dimtext" x="${num((x1+x2)/2)}" y="${num(y-6)}" text-anchor="middle">${label}</text>
  </g>`;
}
function dimLineV(y1,y2,x,label){
  const ah=4;
  return `<g class="ink dimline">
    <line x1="${num(x)}" y1="${num(y1)}" x2="${num(x)}" y2="${num(y2)}"/>
    <path d="M ${num(x-ah)} ${num(y1+ah*2)} L ${num(x)} ${num(y1)} L ${num(x+ah)} ${num(y1+ah*2)}"/>
    <path d="M ${num(x-ah)} ${num(y2-ah*2)} L ${num(x)} ${num(y2)} L ${num(x+ah)} ${num(y2-ah*2)}"/>
    <text class="fade dimtext" x="${num(x-6)}" y="${num((y1+y2)/2)}" text-anchor="middle" transform="rotate(-90 ${num(x-6)} ${num((y1+y2)/2)})">${label}</text>
  </g>`;
}
function callout(fx,fy,tx,ty,label,anchor){
  return `<g class="callout"><line class="ink dimline" x1="${num(fx)}" y1="${num(fy)}" x2="${num(tx)}" y2="${num(ty)}"/>
    <circle class="ink" cx="${num(fx)}" cy="${num(fy)}" r="1.8"/>
    <text class="fade calltext" x="${num(tx+(anchor==="end"?-4:4))}" y="${num(ty+3)}" text-anchor="${anchor}">${label}</text></g>`;
}

/* ---------- full blueprint sheet ---------- */
function renderSheet(model,opt){
  const th=THEME_DEFS[opt.theme];
  const fac=model.fac;
  const W=1500,H=1000;
  const layout={ leftX:110, usableLen:700, topCY:235, sideCY:530, frontCX:1170, frontCY:230, maxHalfW:150, maxHalfH:150 };
  const P=makeProjector(model,layout);
  const strokeMain=(1.5*fac.stroke).toFixed(2);
  const gd=opt.greeble;

  // ---- grid ----
  let grid="";
  for(let x=0;x<=W;x+=20) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${x%100===0?th.gridMajor:th.grid}" stroke-width="${x%100===0?1:0.5}"/>`;
  for(let y=0;y<=H;y+=20) grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${y%100===0?th.gridMajor:th.grid}" stroke-width="${y%100===0?1:0.5}"/>`;

  // ---- panel frames ----
  const panel=(x,y,w,h,title)=>`<g class="layer-frame">
      <rect class="ink panelbox" x="${x}" y="${y}" width="${w}" height="${h}" fill="none"/>
      <rect x="${x}" y="${y}" width="${w}" height="18" fill="${th.gridMajor}" opacity="0.25"/>
      <text class="fade paneltitle" x="${x+8}" y="${y+13}">${title}</text>
    </g>`;

  // ---- views ----
  const topSvg=drawTopView(model,P,{detail:true,greeble:gd});
  const sideSvg=drawSideView(model,P,{detail:true,greeble:gd});
  const frontSvg=drawFrontView(model,P,{detail:true,greeble:gd});

  // ---- dimensions ----
  const dimTopY=layout.topCY+layout.maxHalfH+30;
  let dims=dimLineH(P.x0,P.x0+P.drawnLen,dimTopY,`OVERALL LENGTH · ${num(model.L)} m`);
  const beamY0=P.TY(model.beam/2), beamY1=P.TY(-model.beam/2);
  dims+=dimLineV(beamY0,beamY1,P.x0-22,`BEAM ${num(model.beam)} m`);
  dims+=dimLineV(P.SY(model.hhAt(0.55)),P.SY(-model.hhAt(0.55)*0.78),P.x0-22,`HEIGHT ${num(model.height)} m`);

  // ---- callouts ----
  let calls="";
  if(model.bridge){ const bx=P.TX(model.bridge.x), by=P.SY(model.hhAt(model.bridge.x/model.L)+model.bridge.h);
    calls+=callout(bx+model.bridge.w*P.s*0.5,by, bx+70, by-24, model.classKey==="hauler"?"CMD / HAB MODULE":"C.I.C. · BRIDGE","start"); }
  if(model.pods.length){ const p=model.pods[model.pods.length-1];
    calls+=callout(P.TX(p.x0),P.TY(p.y), P.TX(p.x0)-60, P.TY(p.y)-30, model.specs.drive+" DRIVE POD","end"); }
  if(model.masts.length){ const mst=model.masts[0], bx=P.TX(mst.x), ty=P.SY(model.hhAt(mst.x/model.L)+mst.len);
    calls+=callout(bx,ty, bx-40, ty-18, "SENSOR MAST","end"); }
  if(model.hardpoints.length){ const hp=model.hardpoints[0];
    calls+=callout(P.TX(hp.x),P.TY(hp.y), P.TX(hp.x)+55, P.TY(hp.y)+34, "HARDPOINT","start"); }

  // ---- spec table ----
  const sp=model.specs, lo=model.lore;
  const specRows=[
    ["LENGTH", num(sp.L)+" m"],["BEAM", num(sp.beam)+" m"],["HEIGHT", num(sp.height)+" m"],
    ["MASS", sp.mass.toLocaleString()+" t"],["COMPLEMENT", sp.crew.toLocaleString()+" crew"],
    ["THRUST", num(sp.thrust)+" MN"],["Δv BUDGET", num(sp.deltaV)+" km/s"],
    ["POWERPLANT", sp.powerplant],["DRIVE", sp.engines+"× "+sp.drive],["HARDPOINTS", sp.hardpoints]
  ];
  const stx=920, sty=400, stw=510, sth=305, rowH=(sth-30)/specRows.length;
  let specTbl=`<g class="layer-title"><rect class="ink panelbox" x="${stx}" y="${sty}" width="${stw}" height="${sth}" fill="none"/>
    <rect x="${stx}" y="${sty}" width="${stw}" height="22" fill="${th.gridMajor}" opacity="0.3"/>
    <text class="fade paneltitle" x="${stx+9}" y="${sty+16}">SPECIFICATION SHEET</text>`;
  specRows.forEach((r,i)=>{
    const ry=sty+30+i*rowH;
    specTbl+=`<line class="ink faint" x1="${stx}" y1="${num(ry+rowH-2)}" x2="${stx+stw}" y2="${num(ry+rowH-2)}"/>`;
    specTbl+=`<text class="fade speclabel" x="${stx+12}" y="${num(ry+rowH*0.62)}">${r[0]}</text>`;
    specTbl+=`<text class="fade specval" x="${stx+stw-12}" y="${num(ry+rowH*0.62)}" text-anchor="end">${r[1]}</text>`;
  });
  specTbl+=`<line class="ink faint" x1="${stx+stw*0.5}" y1="${sty+30}" x2="${stx+stw*0.5}" y2="${sty+sth}"/></g>`;

  // ---- title block ----
  const tbx=920, tby=720, tbw=510, tbh=232;
  const disp=(s)=>fac.upper?String(s).toUpperCase():s;
  const tb=`<g class="layer-title"><rect class="ink panelbox tblock" x="${tbx}" y="${tby}" width="${tbw}" height="${tbh}" fill="none"/>
    <line class="ink" x1="${tbx}" y1="${tby+64}" x2="${tbx+tbw}" y2="${tby+64}"/>
    <line class="ink" x1="${tbx}" y1="${tby+118}" x2="${tbx+tbw}" y2="${tby+118}"/>
    <line class="ink" x1="${tbx}" y1="${tby+162}" x2="${tbx+tbw}" y2="${tby+162}"/>
    <line class="ink" x1="${tbx+tbw*0.62}" y1="${tby+64}" x2="${tbx+tbw*0.62}" y2="${tby+162}"/>
    <text class="fade tb-yard" x="${tbx+14}" y="${tby+22}">${disp(lo.yard)}</text>
    <text class="fade tb-sub" x="${tbx+14}" y="${tby+40}">◈ ORBITAL FABRICATION · SHEET 1 OF 1 · FIRST-ANGLE PROJECTION</text>
    <text class="fade tb-motto" x="${tbx+tbw-14}" y="${tby+22}" text-anchor="end">“${disp(lo.motto)}”</text>
    <text class="fade tb-name" x="${tbx+14}" y="${tby+98}">${disp(lo.prefix+" "+lo.name)}</text>
    <text class="fade tb-cls" x="${tbx+14}" y="${tby+146}">${disp(model.C.label)} · ${disp(lo.typeCode)} · ${disp(lo.className)}-class</text>
    <text class="fade tb-fld" x="${tbx+tbw*0.64}" y="${tby+90}">REGISTRY</text>
    <text class="fade tb-fldv" x="${tbx+tbw*0.64}" y="${tby+108}">${lo.regNum}</text>
    <text class="fade tb-fld" x="${tbx+tbw*0.64}" y="${tby+136}">COMMISSIONED</text>
    <text class="fade tb-fldv" x="${tbx+tbw*0.64}" y="${tby+154}">${lo.year} CE · ${lo.sector}</text>
    <text class="fade tb-rec" x="${tbx+14}" y="${tby+186}">SERVICE RECORD:</text>
    <text class="fade tb-recv" x="${tbx+14}" y="${tby+204}">${cap(lo.record)}.</text>
    <text class="fade tb-drawn" x="${tbx+14}" y="${tby+222}">DRAWN BY SLIPWAY AUTO-DRAFT · SEED “${escapeXml(model.seed)}” · SCALE 1:${Math.round(1/P.s*100)/100 < 1 ? 1 : Math.round(1/(P.s))}</text>
  </g>`;

  // ---- general notes / projection symbol (bottom-left) ----
  const nx=110, ny=690, nw=690, nh=262;
  const notes=`<g class="layer-detail"><rect class="ink panelbox" x="${nx}" y="${ny}" width="${nw}" height="${nh}" fill="none"/>
    <rect x="${nx}" y="${ny}" width="${nw}" height="20" fill="${th.gridMajor}" opacity="0.25"/>
    <text class="fade paneltitle" x="${nx+9}" y="${ny+15}">GENERAL NOTES &amp; PROJECTION</text>
    ${firstAngleSymbol(nx+nw-120,ny+70)}
    ${noteLines(nx+16,ny+44,model)}
  </g>`;

  const facLine=`<text class="fade watermark" x="${W-20}" y="${H-14}" text-anchor="end">SLIPWAY · ${fac.label.toUpperCase()} · ${model.classKey.toUpperCase()}</text>`;

  const css=sheetCss(th,fac,strokeMain);

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${fac.font}">
  <defs>${css}</defs>
  <rect x="0" y="0" width="${W}" height="${H}" fill="${th.bg}"/>
  <g opacity="1">${grid}</g>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="55%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="${th.vignette}"/></radialGradient>
  <rect x="0" y="0" width="${W}" height="${H}" fill="url(#vig)"/>
  <g class="layer-frame"><rect class="ink border" x="24" y="24" width="${W-48}" height="${H-48}" fill="none"/>
    <rect class="ink border2" x="34" y="34" width="${W-68}" height="${H-68}" fill="none"/></g>
  ${panel(110,80,690,300,"PLAN · TOP ELEVATION")}
  ${panel(110,400,690,270,"PROFILE · STARBOARD ELEVATION")}
  ${panel(920,80,510,300,"SECTION A–A · FORWARD (LOOKING AFT)")}
  <g class="layer-top">${topSvg}</g>
  <g class="layer-side">${sideSvg}</g>
  <g class="layer-front">${frontSvg}</g>
  <g class="layer-detail">${dims}${calls}</g>
  ${specTbl}
  ${tb}
  ${notes}
  ${facLine}
</svg>`;
}

function noteLines(x,y,m){
  const lines=[
    `1.  All dimensions in metres unless noted. Do not scale drawing.`,
    `2.  Hull synthesised from seed “${m.seed}” — reproducible & shareable.`,
    `3.  Powerplant: ${m.specs.powerplant}; ${m.specs.engines}× ${m.specs.drive} main drive.`,
    `4.  Structural frames shown at nominal spacing; greeble density ${(m._gd!=null?m._gd:1).toFixed(1)}×.`,
    `5.  Faction spec: ${m.fac.label}. Symmetry: ${m._sym?"bilateral":"asymmetric fit-out"}.`,
    `6.  Weapon hardpoints: ${m.specs.hardpoints} rated mounts. Complement ${m.specs.crew} crew.`,
    `7.  This schematic is a work of generative fiction; no real vessel is depicted.`
  ];
  return lines.map((l,i)=>`<text class="fade noteline" x="${x}" y="${y+i*24}">${escapeXml(l)}</text>`).join("");
}
function firstAngleSymbol(cx,cy){
  return `<g class="ink dimline">
    <circle cx="${cx-24}" cy="${cy}" r="16" fill="none"/>
    <circle cx="${cx-24}" cy="${cy}" r="9" fill="none"/>
    <path d="M ${cx} ${cy-16} L ${cx+40} ${cy} L ${cx} ${cy+16} Z" fill="none"/>
    <line x1="${cx+8}" y1="${cy-16}" x2="${cx+8}" y2="${cy+16}"/>
    <text class="fade noteline" x="${cx-8}" y="${cy+38}" text-anchor="middle">FIRST-ANGLE</text>
  </g>`;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function escapeXml(s){ return String(s).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c])); }

function sheetCss(th,fac,strokeMain){
  const serif=fac.serif?"font-family:Georgia,serif;":"";
  return `<style>
    .ink{stroke:${th.ink};stroke-width:${strokeMain};fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;}
    .ink.hull{stroke-width:${(parseFloat(strokeMain)+0.5).toFixed(2)};}
    .ink.dim{stroke:${th.ink2};stroke-width:${(parseFloat(strokeMain)*0.8).toFixed(2)};}
    .ink.faint{stroke:${th.faint};stroke-width:0.7;}
    .ink.dimline{stroke:${th.accent};stroke-width:0.9;fill:none;}
    .ink.dimline text{stroke:none;}
    .ink.border{stroke:${th.ink};stroke-width:2.2;}
    .ink.border2{stroke:${th.ink2};stroke-width:0.8;}
    .ink.panelbox{stroke:${th.ink2};stroke-width:1.1;}
    .ink.tblock{stroke:${th.ink};stroke-width:1.6;}
    .rivet{fill:${th.faint};stroke:none;}
    text{fill:${th.text};}
    .paneltitle{font-size:11px;letter-spacing:.22em;fill:${th.text};font-weight:700;}
    .dimtext{font-size:10.5px;letter-spacing:.1em;fill:${th.accent};font-weight:700;}
    .calltext{font-size:10px;letter-spacing:.14em;fill:${th.accent};}
    .speclabel{font-size:11px;letter-spacing:.14em;fill:${th.ink2};}
    .specval{font-size:12.5px;letter-spacing:.04em;fill:${th.text};font-weight:700;}
    .tb-yard{font-size:16px;letter-spacing:.14em;fill:${th.accent};font-weight:800;${serif}}
    .tb-sub{font-size:9px;letter-spacing:.16em;fill:${th.ink2};}
    .tb-motto{font-size:11px;font-style:italic;fill:${th.text};${serif}}
    .tb-name{font-size:30px;letter-spacing:.10em;fill:${th.text};font-weight:800;${serif}}
    .tb-cls{font-size:13px;letter-spacing:.14em;fill:${th.ink2};}
    .tb-fld{font-size:9px;letter-spacing:.18em;fill:${th.ink2};}
    .tb-fldv{font-size:14px;letter-spacing:.06em;fill:${th.text};font-weight:700;}
    .tb-rec{font-size:9px;letter-spacing:.18em;fill:${th.ink2};}
    .tb-recv{font-size:11.5px;letter-spacing:.02em;fill:${th.text};font-style:italic;}
    .tb-drawn{font-size:9.5px;letter-spacing:.08em;fill:${th.faint};}
    .noteline{font-size:11px;letter-spacing:.03em;fill:${th.text};}
    .watermark{font-size:10px;letter-spacing:.28em;fill:${th.faint};}
  </style>`;
}

/* ---------- fleet contact sheet ---------- */
function renderFleet(baseSeed, count, opt){
  const th=THEME_DEFS[opt.theme];
  const cols = count<=4?2 : count<=6?3 : count<=9?3 : 4;
  const rows = Math.ceil(count/cols);
  const tileW=460, tileH=330, pad=26, headH=96;
  const W=pad*2+cols*tileW+(cols-1)*pad;
  const H=headH+pad*2+rows*tileH+(rows-1)*pad;

  let grid="";
  for(let x=0;x<=W;x+=24) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${x%96===0?th.gridMajor:th.grid}" stroke-width="${x%96===0?0.9:0.5}"/>`;
  for(let y=0;y<=H;y+=24) grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${y%96===0?th.gridMajor:th.grid}" stroke-width="${y%96===0?0.9:0.5}"/>`;

  let tiles="";
  const catalog=[];
  for(let i=0;i<count;i++){
    const seed=baseSeed+"-"+String(i+1).padStart(2,"0");
    const model=generateShip(seed,{hullClass:opt.hullClass,faction:opt.faction,engines:opt.engines,symmetry:opt.symmetry});
    catalog.push(model);
    const c=i%cols, r=Math.floor(i/cols);
    const tx=pad+c*(tileW+pad), ty=headH+pad+r*(tileH+pad);
    tiles+=renderTile(model,tx,ty,tileW,tileH,th,seed,i);
  }

  const facLbl=FACTION_DEFS[opt.faction].label.toUpperCase();
  const head=`<g class="layer-title">
    <rect class="ink border" x="16" y="16" width="${W-32}" height="${H-32}" fill="none"/>
    <text class="fade fleet-title" x="${pad}" y="52">SLIPWAY FLEET REGISTRY</text>
    <text class="fade fleet-sub" x="${pad}" y="76">${count} HULLS · SEED “${escapeXml(baseSeed)}” · ${facLbl} · ${opt.hullClass==="auto"?"MIXED CLASSES":opt.hullClass.toUpperCase()}</text>
    <text class="fade fleet-motto" x="${W-pad}" y="52" text-anchor="end">◈ ORBITAL FABRICATION DIVISION ◈</text>
    <text class="fade fleet-motto" x="${W-pad}" y="76" text-anchor="end">CATALOG SHEET · GENERATED BY SLIPWAY AUTO-DRAFT</text>
    <line class="ink" x1="${pad}" y1="${headH-6}" x2="${W-pad}" y2="${headH-6}"/>
  </g>`;

  const css=sheetCss(th,FACTION_DEFS[opt.faction],1.15)+`<style>
    .fleet-title{font-size:30px;letter-spacing:.28em;font-weight:800;fill:${th.accent};}
    .fleet-sub{font-size:12px;letter-spacing:.16em;fill:${th.text};}
    .fleet-motto{font-size:10px;letter-spacing:.2em;fill:${th.ink2};}
    .tile-name{font-size:14px;letter-spacing:.08em;font-weight:800;fill:${th.text};}
    .tile-cls{font-size:9.5px;letter-spacing:.12em;fill:${th.ink2};}
    .tile-reg{font-size:9px;letter-spacing:.1em;fill:${th.accent};}
    .tile-spec{font-size:9.5px;letter-spacing:.04em;fill:${th.text};}
  </style>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${FACTION_DEFS[opt.faction].font}">
    <defs>${css}</defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="${th.bg}"/>
    <g>${grid}</g>
    ${head}
    ${tiles}
  </svg>`;
}

function renderTile(model,tx,ty,tw,th_,theme,seed,idx){
  // layout inside tile: top view occupies upper 62%, side view a strip, labels bottom
  const layout={ leftX:tx+30, usableLen:tw-60, topCY:ty+78, sideCY:ty+150, frontCX:tx+tw-58, frontCY:ty+78, maxHalfW:44, maxHalfH:44 };
  const P=makeProjector(model,layout);
  const gd=0.6;
  let s=`<g class="layer-top" data-tile="${idx}">`;
  s+=`<rect class="ink panelbox" x="${tx}" y="${ty}" width="${tw}" height="${th_}" fill="none"/>`;
  s+=`<line class="ink faint" x1="${tx}" y1="${ty+th_-92}" x2="${tx+tw}" y2="${ty+th_-92}"/>`;
  s+=drawTopView(model,P,{detail:false,greeble:gd});
  s+=drawSideView(model,P,{detail:false,greeble:gd});
  // labels
  const lo=model.lore, sp=model.specs;
  const bx=tx+16, byy=ty+th_-70;
  s+=`<text class="fade tile-reg" x="${tx+tw-16}" y="${ty+18}" text-anchor="end">${lo.regNum}</text>`;
  s+=`<text class="fade tile-name" x="${bx}" y="${byy}">${(model.fac.upper?(lo.prefix+" "+lo.name).toUpperCase():lo.prefix+" "+lo.name)}</text>`;
  s+=`<text class="fade tile-cls" x="${bx}" y="${byy+16}">${model.C.label.toUpperCase()} · ${lo.className}-CLASS · ${lo.year} CE</text>`;
  s+=`<text class="fade tile-spec" x="${bx}" y="${byy+38}">${num(sp.L)} m · ${sp.mass.toLocaleString()} t · ${sp.crew.toLocaleString()} crew · ${sp.engines}× ${sp.drive} · ${sp.hardpoints} HP</text>`;
  s+=`<text class="fade tile-cls" x="${bx}" y="${byy+54}" font-style="italic">“${model.fac.upper?lo.motto.toUpperCase():lo.motto}”</text>`;
  s+=`</g>`;
  return s;
}

/* ---------- animation: line-drawing reveal ---------- */
function animateSheet(svg){
  const order=[
    [".layer-frame",0,600,10],
    [".layer-top",480,1300,9],
    [".layer-side",1500,1050,11],
    [".layer-front",2350,850,9],
    [".layer-detail",2900,700,6],
    [".layer-title",3300,900,5]
  ];
  order.forEach(([sel,base,dur,stagger])=>{
    const groups=svg.querySelectorAll(sel);
    let k=0;
    groups.forEach(g=>{
      const inks=g.querySelectorAll(".ink, path.ink, line, polyline, polygon, circle.ink, rect.ink, ellipse.ink");
      inks.forEach(el=>{
        let len=0;
        try{ len=el.getTotalLength?el.getTotalLength():0; }catch(e){ len=0; }
        if(!len || !isFinite(len)){ return; }
        len=Math.min(len,4000);
        el.style.strokeDasharray=len+" "+len;
        el.style.strokeDashoffset=len;
        const delay=base + (k%14)*stagger + Math.random()*stagger*2;
        k++;
        el.animate(
          [{strokeDashoffset:len},{strokeDashoffset:0}],
          {duration:dur, delay:delay, easing:"cubic-bezier(.55,.1,.3,1)", fill:"both"}
        );
      });
      // fade elements (text, rivets, fills)
      const fades=g.querySelectorAll(".fade, .rivet, text");
      fades.forEach(el=>{
        el.style.opacity="0";
        el.animate([{opacity:0},{opacity:1}],{duration:500, delay:base+dur*0.5+Math.random()*300, easing:"ease-out", fill:"both"});
      });
    });
  });
}

/* ==================== app / UI ==================== */
const $=(id)=>document.getElementById(id);
const state={
  seed:"", hullClass:"auto", faction:"standard", theme:"blueprint",
  engines:"auto", greeble:1.0, symmetry:true, animate:true, mode:"single", fleetCount:9
};

function randomSeed(){
  const adj=["nova","umbra","kite","void","hex","echo","ferro","stark","lumen","raze","onyx","drift","vega","sol","cinder"];
  const a=makeRng(Date.now()+"-"+Math.random());
  return a.pick(adj)+"-"+String(a.i(100,9999));
}

function readHash(){
  const h=location.hash.replace(/^#/,"");
  if(!h) return false;
  const p=new URLSearchParams(h);
  if(p.has("seed")) state.seed=p.get("seed");
  if(p.has("class")) state.hullClass=p.get("class");
  if(p.has("fac")) state.faction=p.get("fac");
  if(p.has("theme")) state.theme=p.get("theme");
  if(p.has("eng")) state.engines=p.get("eng");
  if(p.has("grb")) state.greeble=clamp(parseFloat(p.get("grb"))||1,0,2);
  if(p.has("sym")) state.symmetry=p.get("sym")==="1";
  if(p.has("mode")) state.mode=p.get("mode")==="fleet"?"fleet":"single";
  if(p.has("n")) state.fleetCount=parseInt(p.get("n"),10)||9;
  return true;
}
function writeHash(){
  const p=new URLSearchParams();
  p.set("seed",state.seed);
  p.set("class",state.hullClass);
  p.set("fac",state.faction);
  p.set("theme",state.theme);
  p.set("eng",state.engines);
  p.set("grb",state.greeble.toFixed(1));
  p.set("sym",state.symmetry?"1":"0");
  p.set("mode",state.mode);
  if(state.mode==="fleet") p.set("n",state.fleetCount);
  history.replaceState(null,"","#"+p.toString());
}

function syncControls(){
  $("seed").value=state.seed;
  $("hullClass").value=state.hullClass;
  $("faction").value=state.faction;
  $("theme").value=state.theme;
  $("engines").value=state.engines;
  $("greeble").value=state.greeble;
  $("greebleVal").textContent=state.greeble.toFixed(1)+"×";
  $("symmetry").checked=state.symmetry;
  $("animate").checked=state.animate;
  $("fleetCount").value=String(state.fleetCount);
  document.querySelectorAll("#modeSeg button").forEach(b=>{
    const on=b.dataset.mode===state.mode;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  $("fleetOpts").classList.toggle("on",state.mode==="fleet");
  document.querySelectorAll(".single-only").forEach(e=>e.classList.toggle("hide",state.mode==="fleet"));
  $("hint").textContent = state.mode==="fleet" ? "FLEET CATALOG · SHIPYARD REGISTRY" : "DRAFTING SHEET · ISO A-SERIES";
}

let currentModel=null;
let themeTouched=false; // set true once the user manually picks a Blueprint Theme, so switching faction won't clobber it

// animateReveal: run the ink-reveal only for intentional new-ship events (load, roll,
// seed change, mode/fleet switch, shared-link nav). Incidental tweaks (theme, greeble,
// engines, class, faction, symmetry) render instantly so controls stay responsive.
// state.animate stays the master on/off gate.
function render(animateReveal){
  writeHash();
  const reveal=!!animateReveal && state.animate;
  const opt={hullClass:state.hullClass, faction:state.faction, theme:state.theme,
    engines:state.engines, greeble:state.greeble, symmetry:state.symmetry};
  const sheetEl=$("sheet"), fleetEl=$("fleet");
  if(state.mode==="fleet"){
    sheetEl.style.display="none"; fleetEl.style.display="block";
    fleetEl.innerHTML=renderFleet(state.seed,state.fleetCount,opt);
    currentModel=null;
    if(reveal) animateSheet(fleetEl.querySelector("svg"));
  } else {
    fleetEl.style.display="none"; sheetEl.style.display="flex";
    const model=generateShip(state.seed,opt);
    model._gd=state.greeble; model._sym=state.symmetry;
    currentModel=model;
    sheetEl.innerHTML=renderSheet(model,opt);
    if(reveal) animateSheet(sheetEl.querySelector("svg"));
  }
}

/* ---------- export ---------- */
function currentSvgEl(){
  return (state.mode==="fleet"?$("fleet"):$("sheet")).querySelector("svg");
}
function serializeSvg(){
  const svg=currentSvgEl();
  if(!svg) return null;
  const clone=svg.cloneNode(true);
  // strip animation inline styles so export is fully inked
  clone.querySelectorAll("[style]").forEach(el=>{
    el.style.strokeDasharray=""; el.style.strokeDashoffset=""; el.style.opacity="";
  });
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  return new XMLSerializer().serializeToString(clone);
}
function download(name,blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
}
function baseName(){
  if(state.mode==="fleet") return "slipway_fleet_"+sanitize(state.seed);
  const lo=currentModel?currentModel.lore:null;
  return "slipway_"+(lo?sanitize(lo.prefix+"_"+lo.name):sanitize(state.seed));
}
function sanitize(s){ return String(s).replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,"").toLowerCase()||"ship"; }

function exportSvg(){
  const str=serializeSvg();
  if(!str){toast("Nothing to export");return;}
  download(baseName()+".svg", new Blob([str],{type:"image/svg+xml"}));
  toast("SVG downloaded");
}
function exportPng(){
  const svg=currentSvgEl();
  const str=serializeSvg();
  if(!svg||!str){toast("Nothing to export");return;}
  const vb=svg.viewBox.baseVal;
  const scale=2;
  const w=(vb&&vb.width)?vb.width:svg.clientWidth;
  const h=(vb&&vb.height)?vb.height:svg.clientHeight;
  const img=new Image();
  const blob=new Blob([str],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  img.onload=()=>{
    const cv=document.createElement("canvas");
    cv.width=w*scale; cv.height=h*scale;
    const ctx=cv.getContext("2d");
    ctx.drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    try{
      cv.toBlob(b=>{
        if(!b){ toast("PNG export not supported in this browser — use SVG"); return; }
        download(baseName()+".png",b); toast("PNG downloaded");
      },"image/png");
    }catch(e){ toast("PNG export not supported in this browser — use SVG"); }
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast("PNG export failed"); };
  img.src=url;
}

let toastTimer=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1900);
}

/* ---------- wiring ---------- */
function init(){
  if(!readHash()){ state.seed=randomSeed(); }
  if(!state.seed) state.seed=randomSeed();
  syncControls();
  render(true);

  // Commit a seed: if the field is left empty, keep the current seed instead of
  // auto-rerolling, so deliberate manual entry (clear -> retype) isn't fought.
  const commitSeed=()=>{
    const v=$("seed").value.trim();
    if(!v){ syncControls(); return; }   // revert empty field to the live seed
    state.seed=v; syncControls(); render(true);
  };
  $("seed").addEventListener("change",commitSeed);
  $("seed").addEventListener("keydown",(e)=>{ if(e.key==="Enter") commitSeed(); });
  $("roll").addEventListener("click",()=>{ state.seed=randomSeed(); themeTouched=false; syncControls(); render(true); });
  $("hullClass").addEventListener("change",()=>{ state.hullClass=$("hullClass").value; render(false); });
  $("faction").addEventListener("change",()=>{
    state.faction=$("faction").value;
    // Only auto-apply the faction's default theme if the user hasn't picked one deliberately.
    if(!themeTouched) state.theme=FACTION_DEFS[state.faction].defaultTheme;
    syncControls(); render(false);
  });
  $("theme").addEventListener("change",()=>{ state.theme=$("theme").value; themeTouched=true; render(false); });
  $("engines").addEventListener("change",()=>{ state.engines=$("engines").value; render(false); });
  $("greeble").addEventListener("input",()=>{ state.greeble=parseFloat($("greeble").value); $("greebleVal").textContent=state.greeble.toFixed(1)+"×"; });
  $("greeble").addEventListener("change",()=>{ render(false); });
  $("symmetry").addEventListener("change",()=>{ state.symmetry=$("symmetry").checked; render(false); });
  $("animate").addEventListener("change",()=>{ state.animate=$("animate").checked; render(false); });
  $("fleetCount").addEventListener("change",()=>{ state.fleetCount=parseInt($("fleetCount").value,10); render(true); });
  document.querySelectorAll("#modeSeg button").forEach(b=>{
    b.addEventListener("click",()=>{ state.mode=b.dataset.mode; syncControls(); render(true); });
  });

  $("copyLink").addEventListener("click",()=>{
    writeHash();
    const url=location.href;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>toast("Shareable link copied")).catch(()=>fallbackCopy(url));
    } else fallbackCopy(url);
  });
  $("dlSvg").addEventListener("click",exportSvg);
  $("dlPng").addEventListener("click",exportPng);

  window.addEventListener("hashchange",()=>{
    const before=JSON.stringify(state);
    readHash();
    if(JSON.stringify(state)!==before){ syncControls(); render(true); }
  });
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Shareable link copied"); }catch(e){ toast("Copy failed — URL in address bar"); }
  document.body.removeChild(ta);
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
