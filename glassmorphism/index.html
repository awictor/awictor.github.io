<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass — Glassmorphism CSS Generator</title>
<meta name="description" content="Generate frosted-glass (glassmorphism) CSS: tint, opacity, blur, radius and border with a live preview and copy-ready code. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('glass-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#06b6d4;
    --bg:#f4f7f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e5e7; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0f1416; --card:#181f22; --fg:#eef4f5; --muted:#93a2a6; --line:#26302f; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:880px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#0e7490);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:880px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
  label:first-child{margin-top:0}
  input[type=range]{width:100%;accent-color:var(--c)}
  input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .row b{font-variant-numeric:tabular-nums}
  .stage{min-height:300px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(135deg,#f857a6,#ff5858 40%,#5b6cff 80%,#00c6ff);background-size:cover}
  .panel{width:80%;min-height:150px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.3)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.82rem;margin:14px 0 0;white-space:pre-wrap}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;margin-top:12px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:880px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🧊</div>
    <div><h1>Glass</h1><div class="sub">Glassmorphism (frosted glass) CSS generator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="color">Tint color</label>
    <input type="color" id="color" value="#ffffff">
    <label class="row"><span>Opacity</span><b id="opV">0.20</b></label>
    <input type="range" id="op" min="0" max="100" value="20">
    <label class="row"><span>Blur</span><b id="blurV">10px</b></label>
    <input type="range" id="blur" min="0" max="40" value="10">
    <label class="row"><span>Corner radius</span><b id="radV">16px</b></label>
    <input type="range" id="rad" min="0" max="60" value="16">
    <label class="row"><span>Border opacity</span><b id="boV">0.18</b></label>
    <input type="range" id="bo" min="0" max="100" value="18">
  </div>

  <div class="card">
    <div class="stage"><div class="panel" id="panel">Glass panel</div></div>
    <pre id="out"></pre>
    <button class="act" id="copy" type="button">Copy CSS</button>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/glassmorphism">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function hexToRgb(hex){
    let h = String(hex).replace('#', '');
    if(h.length === 3) h = h.split('').map(c => c + c).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('invalid hex color: ' + hex);
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  }

  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  function rgba(hex, alpha){
    const [r, g, b] = hexToRgb(hex);
    return `rgba(${r}, ${g}, ${b}, ${clamp01(alpha)})`;
  }

  function glass(o = {}){
    const color = o.color || '#ffffff';
    const opacity = o.opacity == null ? 0.2 : o.opacity;
    const blur = o.blur == null ? 10 : o.blur;
    const radius = o.radius == null ? 16 : o.radius;
    const borderOpacity = o.borderOpacity == null ? 0.18 : o.borderOpacity;
    const background = rgba(color, opacity);
    const border = `1px solid rgba(255, 255, 255, ${clamp01(borderOpacity)})`;
    const css = [
      `background: ${background};`,
      `backdrop-filter: blur(${blur}px);`,
      `-webkit-backdrop-filter: blur(${blur}px);`,
      `border-radius: ${radius}px;`,
      `border: ${border};`,
      `box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);`
    ].join('\n');
    return { background, border, blur, radius, css };
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);

    function render(){
      const opacity = +$('op').value / 100;
      const borderOpacity = +$('bo').value / 100;
      const blur = +$('blur').value;
      const radius = +$('rad').value;
      $('opV').textContent = opacity.toFixed(2);
      $('boV').textContent = borderOpacity.toFixed(2);
      $('blurV').textContent = blur + 'px';
      $('radV').textContent = radius + 'px';
      let g;
      try{ g = glass({ color: $('color').value, opacity, blur, radius, borderOpacity }); }catch(e){ return; }
      $('out').textContent = g.css;
      const p = $('panel');
      p.style.background = g.background;
      p.style.backdropFilter = `blur(${blur}px)`;
      p.style.webkitBackdropFilter = `blur(${blur}px)`;
      p.style.borderRadius = radius + 'px';
      p.style.border = g.border;
      p.style.boxShadow = '0 8px 32px rgba(0, 0, 0, 0.1)';
    }

    ['color', 'op', 'blur', 'rad', 'bo'].forEach(id => $(id).addEventListener('input', render));
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy CSS', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('glass-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { hexToRgb, rgba, glass };
</script>
</body>
</html>
