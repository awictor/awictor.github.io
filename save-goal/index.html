<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SaveGoal — Savings Goal Calculator</title>
<meta name="description" content="Find out how much to save each month to reach a goal by a target date, with optional interest. 100% offline, no signup." />
<meta name="theme-color" content="#4d7c0f" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="SaveGoal — Savings Goal Calculator" />
<meta property="og:description" content="Monthly amount needed to hit a savings goal by a date, with optional interest. Offline." />
<meta property="og:url" content="https://awictor.github.io/save-goal/" />
<link rel="canonical" href="https://awictor.github.io/save-goal/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234d7c0f'/%3E%3Cpath d='M20 44 V30 M32 44 V22 M44 44 V26' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f4f8ec; --ink:#1a2109; --accent:#4d7c0f; --accent-d:#3f6212;
    --card:#fff; --line:#e2eccf; --muted:#5c6b45; --field:#fff;
    --shadow:0 1px 2px rgba(26,33,9,.05),0 8px 24px rgba(26,33,9,.07); }
  [data-theme="dark"]{ --bg:#0e1405; --ink:#eef4e2; --accent:#a3e635; --accent-d:#bef264;
    --card:#161f0b; --line:#2a3617; --muted:#94a577; --field:#0e1405;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  .ig{position:relative}
  .ig .pre{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  input[type=number]{width:150px;padding:11px 12px 11px 24px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,124,15,.15)}
  .result{text-align:center}
  .big{font-size:44px;font-weight:800;color:var(--accent);line-height:1}
  .note{margin-top:12px;font-size:14px;color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("savegoal.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Save</span>Goal</h1>
  <p>How much to save each month to reach your goal. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Goal amount</label><div class="ig"><span class="pre">$</span><input id="goal" type="number" step="100" value="10000"></div></div>
    <div class="row"><label>Saved so far</label><div class="ig"><span class="pre">$</span><input id="current" type="number" step="100" value="1500"></div></div>
    <div class="row"><label>Timeframe (months)</label><div class="ig"><span class="pre">#</span><input id="months" type="number" step="1" value="24"></div></div>
    <div class="row"><label>Annual return</label><div class="ig"><span class="pre">%</span><input id="rate" type="number" step="0.1" value="4"></div></div>
  </section>

  <section class="card result">
    <div style="color:var(--muted);font-size:14px">Save each month</div>
    <div class="big" id="monthly">—</div>
    <div class="note" id="note"></div>
  </section>
</div>

<footer>
  <b>SaveGoal</b> · offline savings goal calculator · <a href="https://github.com/awictor/save-goal">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Monthly compounding, end-of-month deposits. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const money=n=>"$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// --- Pure savings math ---
// Monthly deposit needed so current grows to goal over `months` at annualRate% (monthly compounding). Pure.
function requiredMonthly(goal,current,months,annualRate){
  months=Math.max(1,Math.round(months));
  const r=(annualRate||0)/1200;
  if(r===0) return (goal-current)/months;
  const g=Math.pow(1+r,months);
  return (goal - current*g)/((g-1)/r);
}

// --- UI ---
function render(){
  const goal=num("goal"), current=num("current"), months=num("months"), rate=num("rate");
  try{["goal","current","months","rate"].forEach(k=>localStorage.setItem("savegoal."+k,$(k).value));}catch(e){}
  const pmt=requiredMonthly(goal,current,months,rate);
  if(pmt<=0){
    $("monthly").textContent=money(0);
    $("note").textContent="You're already on track to reach this goal without saving more.";
  } else {
    $("monthly").textContent=money(pmt);
    const deposits=pmt*Math.max(1,Math.round(months));
    const growth=goal-current-deposits;
    $("note").innerHTML=`Over ${Math.max(1,Math.round(months))} months you'll deposit ${money(deposits)}`+(rate>0?`, and interest adds about ${money(Math.max(0,growth))}.`:".");
  }
}
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("savegoal.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["goal","current","months","rate"].forEach(k=>{const v=localStorage.getItem("savegoal."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={requiredMonthly};
</script>
</body>
</html>
