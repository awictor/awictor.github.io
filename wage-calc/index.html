<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WageCalc — Salary ↔ Hourly Wage Converter</title>
<meta name="description" content="Convert a wage between yearly, monthly, weekly, and hourly using your hours per week and weeks per year. 100% offline, no signup." />
<meta name="theme-color" content="#166534" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="WageCalc — Salary ↔ Hourly Converter" />
<meta property="og:description" content="Yearly, monthly, weekly, hourly wage conversion. Offline." />
<meta property="og:url" content="https://awictor.github.io/wage-calc/" />
<link rel="canonical" href="https://awictor.github.io/wage-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23166534'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eef7f0; --ink:#0b2013; --accent:#166534; --accent-d:#14532d;
    --card:#fff; --line:#d2e8d8; --muted:#4e6b57; --field:#fff;
    --shadow:0 1px 2px rgba(11,32,19,.05),0 8px 24px rgba(11,32,19,.07); }
  [data-theme="dark"]{ --bg:#06140b; --ink:#e6f2ea; --accent:#4ade80; --accent-d:#86efac;
    --card:#0e1f14; --line:#1d352a; --muted:#88a896; --field:#06140b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  .ig{position:relative}
  .ig .pre{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  input[type=number]{width:150px;padding:11px 12px 11px 24px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,101,52,.15)}
  .li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:16px}
  .li:last-child{border-bottom:0}
  .li b{color:var(--accent)}
  .small{width:80px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("wage.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Wage</span>Calc</h1>
  <p>Convert a wage between yearly, monthly, weekly, and hourly. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Amount</label><div class="ig"><span class="pre">$</span><input id="amount" type="number" step="0.01" value="25"></div></div>
    <div class="row"><label>Per</label><select id="period"><option value="hour">hour</option><option value="week">week</option><option value="month">month</option><option value="year">year</option></select></div>
    <div class="row"><label>Hours per week</label><input class="small" id="hpw" type="number" value="40" style="text-align:right;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)"></div>
    <div class="row"><label>Weeks per year</label><input class="small" id="wpy" type="number" value="52" style="text-align:right;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)"></div>
  </section>

  <section class="card">
    <div class="li"><span>Yearly</span><b id="year">—</b></div>
    <div class="li"><span>Monthly</span><b id="month">—</b></div>
    <div class="li"><span>Weekly</span><b id="week">—</b></div>
    <div class="li"><span>Hourly</span><b id="hour">—</b></div>
  </section>
</div>

<footer>
  <b>WageCalc</b> · offline salary ↔ hourly converter · <a href="https://github.com/awictor/wage-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Gross pay before tax. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const money=n=>"$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// --- Pure wage math ---
function annualFrom(amount,period,hpw,wpy){
  switch(period){
    case "year": return amount;
    case "month": return amount*12;
    case "week": return amount*wpy;
    case "hour": return amount*hpw*wpy;
    default: return 0;
  }
}
function breakdownFromAnnual(annual,hpw,wpy){
  return {
    year:annual,
    month:annual/12,
    week: wpy>0 ? annual/wpy : 0,
    hour: (hpw*wpy)>0 ? annual/(hpw*wpy) : 0
  };
}

// --- UI ---
function render(){
  const hpw=num("hpw"), wpy=num("wpy");
  const annual=annualFrom(num("amount"),$("period").value,hpw,wpy);
  try{["amount","period","hpw","wpy"].forEach(k=>localStorage.setItem("wage."+k,$(k).value));}catch(e){}
  const b=breakdownFromAnnual(annual,hpw,wpy);
  $("year").textContent=money(b.year);
  $("month").textContent=money(b.month);
  $("week").textContent=money(b.week);
  $("hour").textContent=money(b.hour);
}
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("wage.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["amount","period","hpw","wpy"].forEach(k=>{const v=localStorage.getItem("wage."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={annualFrom,breakdownFromAnnual};
</script>
</body>
</html>
