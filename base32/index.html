<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base32 — RFC 4648 Base32 encoder / decoder</title>
<meta name="description" content="Free offline Base32 encoder and decoder (RFC 4648). Convert text to and from Base32 with padding. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/base32/">
<style>
  :root{
    --c:#082f49; --bg:#f5f9fc; --fg:#0b1a24; --muted:#516475;
    --card:#ffffff; --border:#d8e5ee; --code:#e8f1f7;
  }
  [data-theme="dark"]{
    --bg:#08131b; --fg:#e3eef5; --muted:#83a0b1; --card:#0e1f2a;
    --border:#213544; --code:#152834;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:24px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#0284c7);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:700}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:820px;margin:0 auto;padding:6px 20px 60px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:14px}
  .seg button{background:var(--card);border:none;color:var(--fg);padding:9px 16px;cursor:pointer;
    font-size:.86rem;border-right:1px solid var(--border);font-weight:600}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .pane{background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .pane .h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);
    font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:7px;padding:3px 11px;cursor:pointer;font-size:.72rem;text-transform:none;letter-spacing:0}
  .copy:hover{color:var(--c);border-color:var(--c)}
  textarea{border:none;background:none;color:var(--fg);resize:vertical;min-height:360px;padding:15px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95rem;line-height:1.6;width:100%}
  textarea:focus{outline:none}
  pre{margin:0;padding:15px;font-family:ui-monospace,monospace;font-size:.95rem;line-height:1.6;
    white-space:pre-wrap;word-break:break-all;min-height:360px;color:var(--fg)}
  pre.err{color:#dc2626}
  footer{max-width:820px;margin:0 auto;padding:14px 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('b32.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">32</div>
  <div>
    <h1>Base32</h1>
    <p class="sub">RFC 4648 encoder / decoder</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="seg" id="mode">
    <button data-m="encode" class="on">Encode</button>
    <button data-m="decode">Decode</button>
  </div>
  <div class="grid">
    <div class="pane">
      <div class="h" id="inHead">Text</div>
      <textarea id="in" spellcheck="false">Hello, World!</textarea>
    </div>
    <div class="pane">
      <div class="h" id="outHead">Base32 <button class="copy" id="copy">Copy</button></div>
      <pre id="out"></pre>
    </div>
  </div>
</main>
<footer>
  Base32 is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/base32">Source</a>
</footer>

<script>
// ---- pure functions ----
var ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function textToBytes(str){
  var u = unescape(encodeURIComponent(String(str)));
  var out = [];
  for(var i = 0; i < u.length; i++) out.push(u.charCodeAt(i) & 0xff);
  return out;
}
function bytesToText(bytes){
  var s = '';
  for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  try{ return decodeURIComponent(escape(s)); }catch(e){ return s; }
}
function base32Encode(bytes){
  var bits = 0, val = 0, out = '';
  for(var i = 0; i < bytes.length; i++){
    val = (val << 8) | (bytes[i] & 0xff);
    bits += 8;
    while(bits >= 5){ out += ALPHA[(val >>> (bits - 5)) & 31]; bits -= 5; }
    val &= (1 << bits) - 1;
  }
  if(bits > 0) out += ALPHA[(val << (5 - bits)) & 31];
  while(out.length % 8 !== 0) out += '=';
  return out;
}
function base32Decode(str){
  var s = String(str).toUpperCase().replace(/=+$/, '').replace(/\s+/g, '');
  var bits = 0, val = 0, out = [];
  for(var i = 0; i < s.length; i++){
    var idx = ALPHA.indexOf(s.charAt(i));
    if(idx < 0) return null;
    val = (val << 5) | idx;
    bits += 5;
    if(bits >= 8){ bits -= 8; out.push((val >>> bits) & 0xff); val &= (1 << bits) - 1; }
  }
  return out;
}
function encodeText(str){ return base32Encode(textToBytes(str)); }
function decodeText(b32){ var b = base32Decode(b32); return b === null ? null : bytesToText(b); }

if(typeof module !== 'undefined') module.exports = {
  ALPHA, textToBytes, bytesToText, base32Encode, base32Decode, encodeText, decodeText
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  var modeEl = document.getElementById('mode');
  var mode = 'encode';
  function setHeads(){
    document.getElementById('inHead').textContent = mode === 'encode' ? 'Text' : 'Base32';
    document.getElementById('outHead').firstChild.textContent = mode === 'encode' ? 'Base32 ' : 'Text ';
  }
  function render(){
    outEl.className = '';
    if(mode === 'encode'){ outEl.textContent = encodeText(inEl.value); }
    else {
      var r = decodeText(inEl.value);
      if(r === null){ outEl.className = 'err'; outEl.textContent = '⚠ Invalid Base32 (letters A–Z and digits 2–7 only).'; }
      else outEl.textContent = r;
    }
    try{ localStorage.setItem('b32.in.' + mode, inEl.value); }catch(e){}
  }
  modeEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    mode = b.getAttribute('data-m');
    [].forEach.call(modeEl.querySelectorAll('button'), function(x){ x.className = (x === b) ? 'on' : ''; });
    setHeads();
    var saved = null; try{ saved = localStorage.getItem('b32.in.' + mode); }catch(e){}
    inEl.value = saved !== null ? saved : (mode === 'encode' ? 'Hello, World!' : 'JBSWY3DPFQQFO33SNRSCC===');
    render();
  });
  inEl.addEventListener('input', render);
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.textContent);
    this.textContent = 'Copied'; var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  setHeads();
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('b32.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('b32.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
