<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIELAB + ΔE — LAB color converter & difference</title>
<meta name="description" content="Convert colors between HEX/RGB and CIELAB (L*a*b*), and measure the perceptual color difference (ΔE, CIE76) between two colors. Offline, no tracking.">
<style>
  :root{
    --c:#db2777;
    --bg:#fbf4f8; --card:#ffffff; --fg:#211320; --muted:#786070;
    --line:#efdfe9; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.05);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#170e14; --card:#22161e; --fg:#f5eaf1; --muted:#b598a8;
    --line:#382634; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;
    font-size:22px;color:#fff;flex:0 0 auto}
  h1{font-size:1.4rem;margin:0}
  header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
  .theme{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  .swatch{height:90px;border-radius:12px;border:1px solid var(--line);margin-bottom:16px}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .frow{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .frow input[type=text]{flex:1;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;padding:11px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
  .frow input[type=color]{width:48px;height:44px;padding:0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer}
  .lab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .lab .ch label{text-align:center}
  .lab .val{text-align:center;font-family:ui-monospace,monospace;font-size:1.15rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.two{grid-template-columns:1fr}}
  .mini{height:44px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
  .de{text-align:center;margin-top:6px}
  .de .n{font-size:2.6rem;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
  .de .lbl{color:var(--muted);font-size:.9rem;margin-top:4px}
  h2{font-size:1rem;margin:0 0 10px}
  .note{color:var(--muted);font-size:.86rem}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:26px}
  .foot a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="logo">🔬</div>
  <div>
    <h1>CIELAB + ΔE</h1>
    <p>L*a*b* converter &amp; color difference</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="card">
    <div class="swatch" id="swatch"></div>
    <label>HEX</label>
    <div class="frow">
      <input type="color" id="picker" value="#db2777">
      <input type="text" id="hex" spellcheck="false" value="#db2777">
    </div>
    <label>RGB</label>
    <div class="frow"><input type="text" id="rgb" spellcheck="false" value="219, 39, 119"></div>
    <label>CIELAB (D65)</label>
    <div class="lab">
      <div class="ch"><label>L*</label><div class="val" id="L">—</div></div>
      <div class="ch"><label>a*</label><div class="val" id="a">—</div></div>
      <div class="ch"><label>b*</label><div class="val" id="b">—</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Compare two colors (ΔE)</h2>
    <div class="two">
      <div><label>Color 1</label><input type="color" id="c1" value="#ff0000" style="width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:none"><div class="mini" id="m1"></div></div>
      <div><label>Color 2</label><input type="color" id="c2" value="#ff2200" style="width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:none"><div class="mini" id="m2"></div></div>
    </div>
    <div class="de"><div class="n" id="de">—</div><div class="lbl" id="deLbl">ΔE (CIE76)</div></div>
    <p class="note" style="margin-top:6px">ΔE ≈ 1 is the smallest difference a person can typically notice. &lt;2 = barely perceptible, 2–10 = perceptible, &gt;10 = distinct colors.</p>
  </div>

  <p class="foot">100% offline · nothing leaves your browser · part of the
    <a href="https://awictor.github.io/toolkit/">Toolkit</a></p>
</main>

<script>
  var Xn = 95.047, Yn = 100, Zn = 108.883, EPS = 0.008856, KAPPA = 903.3;
  function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
  function hexToRgb(hex){
    var h = String(hex).trim().replace(/^#/, '');
    if(/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(function(c){ return c + c; }).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('hex must be #RGB or #RRGGBB');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function rgbToHex(r, g, b){
    return '#' + [r,g,b].map(function(x){ return clamp(Math.round(x),0,255).toString(16).padStart(2,'0'); }).join('');
  }
  function gammaExpand(c){ c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function gammaCompress(c){ return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
  function f(t){ return t > EPS ? Math.cbrt(t) : (KAPPA * t + 16) / 116; }
  function finv(t){ var t3 = t * t * t; return t3 > EPS ? t3 : (116 * t - 16) / KAPPA; }
  function rgbToLab(rgb){
    var r = gammaExpand(rgb[0]), g = gammaExpand(rgb[1]), b = gammaExpand(rgb[2]);
    var X = 100 * (0.4124564 * r + 0.3575761 * g + 0.1804375 * b);
    var Y = 100 * (0.2126729 * r + 0.7151522 * g + 0.0721750 * b);
    var Z = 100 * (0.0193339 * r + 0.1191920 * g + 0.9503041 * b);
    var fx = f(X / Xn), fy = f(Y / Yn), fz = f(Z / Zn);
    return { L: 116 * fy - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
  }
  function labToRgb(lab){
    var fy = (lab.L + 16) / 116, fx = fy + lab.a / 500, fz = fy - lab.b / 200;
    var X = finv(fx) * Xn, Y = finv(fy) * Yn, Z = finv(fz) * Zn;
    X /= 100; Y /= 100; Z /= 100;
    var r =  3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z;
    var g = -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z;
    var b =  0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z;
    return [r, g, b].map(function(c){ return clamp(Math.round(gammaCompress(c) * 255), 0, 255); });
  }
  function deltaE(lab1, lab2){
    return Math.sqrt(Math.pow(lab1.L - lab2.L, 2) + Math.pow(lab1.a - lab2.a, 2) + Math.pow(lab1.b - lab2.b, 2));
  }

  if(typeof module !== 'undefined') module.exports = {
    hexToRgb:hexToRgb, rgbToHex:rgbToHex, rgbToLab:rgbToLab, labToRgb:labToRgb, deltaE:deltaE
  };

  // ---- UI ----
  if(typeof document !== 'undefined'){
    var picker=document.getElementById('picker'), hex=document.getElementById('hex'), rgb=document.getElementById('rgb'), swatch=document.getElementById('swatch');
    function paint(r,g,b){
      var hx=rgbToHex(r,g,b); swatch.style.background=hx; picker.value=hx; hex.value=hx; rgb.value=r+', '+g+', '+b;
      var lab=rgbToLab([r,g,b]);
      document.getElementById('L').textContent=lab.L.toFixed(2);
      document.getElementById('a').textContent=lab.a.toFixed(2);
      document.getElementById('b').textContent=lab.b.toFixed(2);
    }
    function fromHex(){ try{ var a=hexToRgb(hex.value); paint(a[0],a[1],a[2]); }catch(e){} }
    function fromRgb(){ var m=rgb.value.match(/(\d+)\D+(\d+)\D+(\d+)/); if(m) paint(clamp(+m[1],0,255),clamp(+m[2],0,255),clamp(+m[3],0,255)); }
    picker.addEventListener('input', function(){ hex.value=picker.value; fromHex(); });
    hex.addEventListener('input', fromHex); rgb.addEventListener('input', fromRgb);

    var c1=document.getElementById('c1'), c2=document.getElementById('c2');
    function renderDe(){
      document.getElementById('m1').style.background=c1.value;
      document.getElementById('m2').style.background=c2.value;
      var d = deltaE(rgbToLab(hexToRgb(c1.value)), rgbToLab(hexToRgb(c2.value)));
      document.getElementById('de').textContent = d.toFixed(2);
      var lbl = d < 1 ? 'not perceptible' : d < 2 ? 'barely perceptible' : d < 10 ? 'perceptible' : d < 50 ? 'distinct' : 'opposite';
      document.getElementById('deLbl').textContent = 'ΔE (CIE76) · ' + lbl;
    }
    c1.addEventListener('input', renderDe); c2.addEventListener('input', renderDe);

    var root=document.documentElement, tb=document.getElementById('theme');
    function setTheme(t){ root.setAttribute('data-theme',t); tb.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('cielab-theme',t);}catch(e){} }
    var saved; try{ saved=localStorage.getItem('cielab-theme'); }catch(e){}
    setTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    tb.addEventListener('click', function(){ setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });

    fromHex(); renderDe();
  }
</script>
</body>
</html>
