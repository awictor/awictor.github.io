<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slugify — URL Slug Generator</title>
<meta name="description" content="Turn any title into a clean URL slug — lowercase, accent-stripped, hyphenated, with optional separator and max length. 100% offline, no signup." />
<meta name="theme-color" content="#166534" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Slugify — URL Slug Generator" />
<meta property="og:description" content="Clean URL slugs — accent-stripped, hyphenated, configurable. Offline." />
<meta property="og:url" content="https://awictor.github.io/slugify/" />
<link rel="canonical" href="https://awictor.github.io/slugify/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23166534'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3E/-/%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eef7f0; --ink:#0b2013; --accent:#166534; --accent-d:#14532d;
    --card:#fff; --line:#d2e8d8; --muted:#4e6b57; --field:#fff;
    --shadow:0 1px 2px rgba(11,32,19,.05),0 8px 24px rgba(11,32,19,.07); }
  [data-theme="dark"]{ --bg:#06140b; --ink:#e6f2ea; --accent:#4ade80; --accent-d:#86efac;
    --card:#0e1f14; --line:#1d352a; --muted:#88a896; --field:#06140b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  input[type=text]{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:var(--field);color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,101,52,.15)}
  .row{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
  .row label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  select,.row input[type=number]{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-size:14px}
  .row input[type=number]{width:70px;text-align:right}
  .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;background:var(--bg);border-radius:11px;padding:16px;word-break:break-all;cursor:pointer;color:var(--accent);font-weight:700}
  #msg{font-size:12px;color:var(--muted);text-align:center;min-height:16px;margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("slugify.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Slug</span>ify</h1>
  <p>Turn a title into a clean URL slug. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <input id="input" type="text" spellcheck="false" value="Café Déjà Vu: 10 Things You Should Know!">
    <div class="row">
      <label>Separator <select id="sep"><option value="-">hyphen (-)</option><option value="_">underscore (_)</option></select></label>
      <label>Max length <input id="max" type="number" min="0" value="0"></label>
    </div>
  </section>
  <section class="card">
    <div class="out" id="out" title="Click to copy"></div>
    <div id="msg"></div>
  </section>
</div>

<footer>
  <b>Slugify</b> · offline URL slug generator · <a href="https://github.com/awictor/slugify">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Lowercases, strips accents, and hyphenates. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure slugify ---
function slugify(str,separator,maxLen){
  separator = separator||"-"; maxLen=maxLen||0;
  const esc=separator.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  let s=String(str).normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/[^a-z0-9]+/g,separator)
    .replace(new RegExp("^"+esc+"+|"+esc+"+$","g"),"");
  if(maxLen>0 && s.length>maxLen) s=s.slice(0,maxLen).replace(new RegExp(esc+"+$"),"");
  return s;
}

// --- UI ---
function render(){
  try{["input","sep","max"].forEach(k=>localStorage.setItem("slugify."+k,$(k).value));}catch(e){}
  const s=slugify($("input").value,$("sep").value,parseInt($("max").value)||0);
  $("out").textContent=s||"(empty)";
}
$("out").onclick=()=>{const v=$("out").textContent;if(!v||v==="(empty)")return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1300);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();};
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("slugify.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["input","sep","max"].forEach(k=>{const v=localStorage.getItem("slugify."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={slugify};
</script>
</body>
</html>
