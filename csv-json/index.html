<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSVJSON — CSV ↔ JSON Converter</title>
<meta name="description" content="Convert CSV to JSON and JSON to CSV in your browser, with a proper quoted-field parser. 100% offline — your data never leaves your device. No signup." />
<meta name="theme-color" content="#5b21b6" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="CSVJSON — CSV ↔ JSON Converter" />
<meta property="og:description" content="CSV to JSON and back, RFC-4180 quoted fields, entirely local. Offline." />
<meta property="og:url" content="https://awictor.github.io/csv-json/" />
<link rel="canonical" href="https://awictor.github.io/csv-json/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b21b6'/%3E%3Ctext x='32' y='40' font-size='15' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3E⇄%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f5f2fc; --ink:#1c1233; --accent:#5b21b6; --accent-d:#4c1d95;
    --card:#fff; --line:#e5ddf5; --muted:#655a80; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(28,18,51,.05),0 8px 24px rgba(28,18,51,.07); }
  [data-theme="dark"]{ --bg:#0f0a1c; --ink:#ece7f7; --accent:#a78bfa; --accent-d:#c4b5fd;
    --card:#18122b; --line:#2b2244; --muted:#9a8dbb; --bad:#f0685c; --field:#0f0a1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:940px;margin:0 auto;padding:20px}
  .two{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
  @media(max-width:700px){.two{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
  .card h2 .copy{cursor:pointer;color:var(--accent);text-transform:none;letter-spacing:0}
  textarea{width:100%;min-height:280px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);resize:vertical;white-space:pre;overflow-wrap:normal;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,33,182,.15)}
  .mid{display:flex;flex-direction:column;gap:10px}
  @media(max-width:700px){.mid{flex-direction:row;justify-content:center}}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .err{color:var(--bad);font-weight:600;font-size:13px;text-align:center;min-height:18px;margin-top:10px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("csvjson.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">CSV</span>JSON</h1>
  <p>Convert CSV to JSON and back — proper quoted-field parsing, entirely in your browser.</p>
</header>

<div class="wrap">
  <div class="two">
    <section class="card"><h2>CSV <span class="copy" data-t="csv">copy</span></h2><textarea id="csv" spellcheck="false" placeholder="name,age&#10;Alex,30&#10;Sam,25">name,age,city
Alex,30,"Seattle, WA"
Sam,25,Portland</textarea></section>
    <div class="mid">
      <button class="btn" id="toJson" title="CSV to JSON">→</button>
      <button class="btn" id="toCsv" title="JSON to CSV">←</button>
    </div>
    <section class="card"><h2>JSON <span class="copy" data-t="json">copy</span></h2><textarea id="json" spellcheck="false" placeholder='[&#10;  {"name":"Alex","age":"30"}&#10;]'></textarea></section>
  </div>
  <div class="err" id="err"></div>
</div>

<footer>
  <b>CSVJSON</b> · offline CSV ↔ JSON converter · <a href="https://github.com/awictor/csv-json">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  RFC-4180 style quoting · runs locally. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure CSV/JSON conversion ---
function parseCsv(text){
  const s=String(text); const rows=[]; let row=[], field="", inQ=false, i=0;
  while(i<s.length){
    const c=s[i];
    if(inQ){
      if(c==='"'){ if(s[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===','){ row.push(field); field=""; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
    field+=c; i++;
  }
  row.push(field); rows.push(row);
  if(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==="") rows.pop();
  return rows;
}
function csvToRecords(text){
  const rows=parseCsv(text); if(!rows.length) return [];
  const headers=rows[0];
  return rows.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>o[h]=r[i]!==undefined?r[i]:""); return o; });
}
function csvToJson(text,indent){ return JSON.stringify(csvToRecords(text),null,indent==null?2:indent); }
function esc(v){ v=v==null?"":String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function recordsToCsv(arr){
  if(!Array.isArray(arr)||!arr.length) return "";
  const keys=[]; for(const o of arr) for(const k of Object.keys(o||{})) if(!keys.includes(k)) keys.push(k);
  const lines=[keys.map(esc).join(",")];
  for(const o of arr) lines.push(keys.map(k=>esc(o?o[k]:"")).join(","));
  return lines.join("\n");
}
function jsonToCsv(jsonText){ const data=JSON.parse(jsonText); return recordsToCsv(Array.isArray(data)?data:[data]); }

// --- UI ---
function copy(v){ if(!v)return; const done=()=>{$("err").textContent="✓ Copied";setTimeout(()=>{if($("err").textContent==="✓ Copied")$("err").textContent="";},1200);}; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done,done); else done(); }
$("toJson").onclick=()=>{ try{ $("json").value=csvToJson($("csv").value); $("err").textContent=""; }catch(e){ $("err").textContent="CSV error: "+e.message; } persist(); };
$("toCsv").onclick=()=>{ try{ $("csv").value=jsonToCsv($("json").value); $("err").textContent=""; }catch(e){ $("err").textContent="JSON error: "+e.message; } persist(); };
document.querySelectorAll(".copy").forEach(c=>c.onclick=()=>copy($(c.dataset.t).value));
function persist(){ try{localStorage.setItem("csvjson.csv",$("csv").value);localStorage.setItem("csvjson.json",$("json").value);}catch(e){} }
$("csv").addEventListener("input",persist); $("json").addEventListener("input",persist);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("csvjson.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const c=localStorage.getItem("csvjson.csv");if(c!=null)$("csv").value=c;const j=localStorage.getItem("csvjson.json");if(j!=null)$("json").value=j;}catch(e){}
if(!$("json").value) $("toJson").onclick();

if(typeof module!=="undefined") module.exports={parseCsv,csvToRecords,csvToJson,recordsToCsv,jsonToCsv,esc};
</script>
</body>
</html>
