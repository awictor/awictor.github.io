<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaistHeight — waist-to-height &amp; waist-to-hip ratio</title>
<meta name="description" content="Free offline waist-to-height ratio (WHtR) and waist-to-hip ratio (WHR) calculator with risk categories. Any consistent units. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/waist-height/">
<style>
  :root{
    --c:#881337; --bg:#fdf7f8; --fg:#22111a; --muted:#7c5560;
    --card:#ffffff; --border:#efdae0; --code:#fbecf0;
    --ok:#15803d; --mid:#d97706; --hi:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#190d11; --fg:#f2e4e8; --muted:#b5919b; --card:#251218;
    --border:#3a212a; --code:#2d161d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:700px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#e11d48);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:700px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
  .seg button{background:var(--bg);border:none;color:var(--fg);padding:8px 18px;cursor:pointer;font-size:.9rem;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .fld{flex:1;min-width:110px}
  input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;
    background:var(--bg);color:var(--fg);font-size:1rem;font-family:ui-monospace,monospace}
  input:focus{outline:2px solid var(--c);border-color:var(--c)}
  .err{color:#dc2626;font-size:.86rem;margin:12px 0 0;min-height:1.1em}
  .cards{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rc{border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .rc .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .rc .v{font-family:ui-monospace,monospace;font-weight:700;font-size:1.8rem;margin-top:2px}
  .rc .cat{font-size:.85rem;font-weight:600;margin-top:4px}
  .hint{color:var(--muted);font-size:.82rem;margin:16px 0 0}
  footer{max-width:700px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('wh.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">◉</div>
  <div>
    <h1>WaistHeight</h1>
    <p class="sub">Waist-to-height &amp; waist-to-hip ratio</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="seg" id="sex">
      <button data-s="male" class="on">Male</button>
      <button data-s="female">Female</button>
    </div>
    <div class="row">
      <div class="fld"><label for="waist">Waist</label><input id="waist" value="85" inputmode="decimal" spellcheck="false"></div>
      <div class="fld"><label for="height">Height</label><input id="height" value="178" inputmode="decimal" spellcheck="false"></div>
      <div class="fld"><label for="hip">Hip (optional)</label><input id="hip" value="98" inputmode="decimal" spellcheck="false"></div>
    </div>
    <p class="err" id="err"></p>
    <div class="cards" id="cards"></div>
    <p class="hint">Use any consistent unit (cm or in) — the ratios are unitless. Waist-to-height under
      0.5 is generally considered healthy. Estimates only, not medical advice. Runs locally.</p>
  </div>
</main>
<footer>
  WaistHeight is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/waist-height">Source</a>
</footer>

<script>
// ---- pure functions ----
function whtr(waist, height){
  waist = Number(waist); height = Number(height);
  if(!(waist > 0) || !(height > 0)) return null;
  return waist / height;
}
function whtrCategory(ratio){
  if(ratio == null || !isFinite(ratio)) return null;
  if(ratio < 0.4) return 'Slim';
  if(ratio < 0.5) return 'Healthy';
  if(ratio < 0.6) return 'Increased risk';
  return 'High risk';
}
function whr(waist, hip){
  waist = Number(waist); hip = Number(hip);
  if(!(waist > 0) || !(hip > 0)) return null;
  return waist / hip;
}
function whrRisk(ratio, sex){
  if(ratio == null || !isFinite(ratio)) return null;
  var t = (sex === 'female') ? [0.8, 0.85] : [0.9, 1.0];
  if(ratio < t[0]) return 'Low';
  if(ratio < t[1]) return 'Moderate';
  return 'High';
}

if(typeof module !== 'undefined') module.exports = { whtr, whtrCategory, whr, whrRisk };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var sexWrap = document.getElementById('sex');
  var waistEl = document.getElementById('waist');
  var heightEl = document.getElementById('height');
  var hipEl = document.getElementById('hip');
  var errEl = document.getElementById('err');
  var cardsEl = document.getElementById('cards');
  var sex = 'male';
  var COLORS = { Slim: 'var(--mid)', Healthy: 'var(--ok)', 'Increased risk': 'var(--mid)', 'High risk': 'var(--hi)',
    Low: 'var(--ok)', Moderate: 'var(--mid)', High: 'var(--hi)' };

  function render(){
    var r1 = whtr(waistEl.value, heightEl.value);
    if(r1 === null){
      errEl.textContent = 'Enter a valid waist and height.';
      cardsEl.innerHTML = '';
      return;
    }
    errEl.textContent = '';
    var cat1 = whtrCategory(r1);
    var html = '<div class="rc"><div class="k">Waist-to-height</div><div class="v">' + r1.toFixed(2) +
      '</div><div class="cat" style="color:' + COLORS[cat1] + '">' + cat1 + '</div></div>';
    var r2 = whr(waistEl.value, hipEl.value);
    if(r2 !== null){
      var cat2 = whrRisk(r2, sex);
      html += '<div class="rc"><div class="k">Waist-to-hip</div><div class="v">' + r2.toFixed(2) +
        '</div><div class="cat" style="color:' + COLORS[cat2] + '">' + cat2 + ' risk</div></div>';
    }
    cardsEl.innerHTML = html;
    try{
      localStorage.setItem('wh.sex', sex);
      localStorage.setItem('wh.waist', waistEl.value);
      localStorage.setItem('wh.height', heightEl.value);
      localStorage.setItem('wh.hip', hipEl.value);
    }catch(e){}
  }
  sexWrap.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    sex = b.getAttribute('data-s');
    [].forEach.call(sexWrap.querySelectorAll('button'), function(x){ x.className = (x === b) ? 'on' : ''; });
    render();
  });
  [waistEl, heightEl, hipEl].forEach(function(e){ e.addEventListener('input', render); });
  try{
    var ss = localStorage.getItem('wh.sex');
    if(ss){ sex = ss; [].forEach.call(sexWrap.querySelectorAll('button'), function(x){
      x.className = (x.getAttribute('data-s') === ss) ? 'on' : ''; }); }
    ['waist','height','hip'].forEach(function(id){ var v = localStorage.getItem('wh.'+id);
      if(v !== null) document.getElementById(id).value = v; });
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('wh.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('wh.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
