<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StringEscape — Escape Strings for JSON, HTML, URL, Regex & Shell</title>
<meta name="description" content="Escape any string for JSON, JavaScript, HTML, URL, regular expressions, or the shell. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('string-escape-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#c026d3;
    --bg:#f7f5f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e9e2ec; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#150f16; --card:#1e1720; --fg:#f2ecf4; --muted:#a596a8; --line:#332839; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:780px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#a21caf);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:780px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.9rem;min-height:100px;resize:vertical}
  .targets{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .targets button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
  .targets button.on{background:var(--c);color:#fff;border-color:var(--c);font-weight:700}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.9rem;margin:0;white-space:pre-wrap;word-break:break-word}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:780px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⧵</div>
    <div><h1>StringEscape</h1><div class="sub">Escape a string for JSON, HTML, URL, regex &amp; shell</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="input">Input</label>
    <textarea id="input" spellcheck="false">He said "it's a test" &lt;now&gt;
path\to\file.txt</textarea>
    <div class="targets" id="targets"></div>
  </div>
  <div class="card">
    <label>Escaped output</label>
    <pre id="out"></pre>
    <div class="btns"><button class="act" id="copy" type="button">Copy</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/string-escape">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function escapeJson(s){ return JSON.stringify(String(s)).slice(1, -1); }
  function escapeHtml(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeUrl(s){ return encodeURIComponent(String(s)); }
  function escapeRegex(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function escapeShell(s){ return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

  function escapeFor(s, target){
    switch(target){
      case 'json': case 'js': return escapeJson(s);
      case 'html': return escapeHtml(s);
      case 'url': return escapeUrl(s);
      case 'regex': return escapeRegex(s);
      case 'shell': return escapeShell(s);
      default: throw new Error('unknown target: ' + target);
    }
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    const TARGETS = [['json', 'JSON / JS'], ['html', 'HTML'], ['url', 'URL'], ['regex', 'Regex'], ['shell', 'Shell']];
    let target = 'json';

    function render(){
      try{ $('out').textContent = escapeFor($('input').value, target); }catch(e){ $('out').textContent = e.message; }
    }

    $('targets').innerHTML = TARGETS.map(([v, l]) => `<button type="button" data-t="${v}"${v === target ? ' class="on"' : ''}>${l}</button>`).join('');
    $('targets').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      target = b.dataset.t;
      [...$('targets').children].forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('input').addEventListener('input', render);
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('string-escape-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { escapeJson, escapeHtml, escapeUrl, escapeRegex, escapeShell, escapeFor };
</script>
</body>
</html>
