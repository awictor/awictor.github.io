<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kintsugi — strike, fracture, heal in gold</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #16130f; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    display: flex; align-items: center; justify-content: center;
    color: #e8dfce; -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #stage {
    position: relative;
    box-shadow: 0 30px 90px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
    border-radius: 6px; overflow: hidden;
    background: #000;
  }
  canvas { display: block; cursor: crosshair; border-radius: 6px; }
  #bar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px;
    max-width: calc(100% - 24px);
    background: rgba(22,19,15,.55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 22px;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,.7);
    opacity: 1; transition: opacity .3s;
  }
  /* Dim-until-hover only on devices that actually have hover; keep the bar
     fully legible on touch (no :hover) and when a control is focused. */
  @media (hover: hover) {
    #bar { opacity: .4; }
    #stage:hover #bar, #bar:focus-within { opacity: 1; }
  }
  #bar button {
    font: inherit; font-size: 12px; letter-spacing: .04em;
    color: #e8dfce; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.09); border-radius: 999px;
    padding: 7px 13px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, transform .05s;
  }
  #bar button:hover { background: rgba(217,164,65,.22); }
  #bar button:active { transform: translateY(1px); }
  #bar button b { font-weight: 400; color: #d9a441; }
  #hint {
    position: absolute; left: 0; right: 0; top: 18px; text-align: center;
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(232,223,206,.5); pointer-events: none;
    transition: opacity 1.2s; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hint">press &amp; hold to strike · longer hold shatters · shift = shatter · S saves png</div>
  <div id="bar">
    <button id="bGlaze" title="Cycle glaze color">glaze · <b>off-white</b></button>
    <button id="bMetal" title="Cycle vein metal">vein · <b>gold</b></button>
    <button id="bGold" title="Toggle gold healing (G)">heal · <b>on</b></button>
    <button id="bMute" title="Toggle sound (M)">sound · <b>off</b></button>
    <button id="bReset" title="New blank plate (N)">new plate</button>
  </div>
</div>
<script>
"use strict";
(function () {
  const stage = document.getElementById("stage");
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const hint = document.getElementById("hint");

  // ---- palettes ---------------------------------------------------------
  const GLAZES = [
    { name: "off-white", a: "#f6f3ec", b: "#e3dccb", spk: "rgba(120,105,80,.10)", dark: "rgba(52,40,28,.60)" },
    { name: "celadon",   a: "#e2ece2", b: "#aec7b6", spk: "rgba(60,90,72,.12)",  dark: "rgba(30,52,40,.55)" },
    { name: "oxblood",   a: "#8a2f26", b: "#3f120e", spk: "rgba(20,6,4,.28)",    dark: "rgba(18,6,4,.60)" },
  ];
  const METALS = [
    { name: "gold",   shadow: "#6a4610", glow: "#d9a441", core: "#ffe6a0", tip: "#fff7de" },
    { name: "silver", shadow: "#3c424b", glow: "#9aa4b0", core: "#e6edf4", tip: "#ffffff" },
    { name: "lacquer",shadow: "#2a0909", glow: "#8f2318", core: "#e07a4c", tip: "#ffd9b0" },
  ];

  // ---- state ------------------------------------------------------------
  const st = { seed: 0, glaze: 0, metal: 0, gold: true, strikes: [] };
  let muted = true;
  let W = 0, H = 0, DPR = 1, MIN = 0;
  let base = null;                 // offscreen ceramic layer
  const segs = [];                 // {x1,y1,x2,y2,d,h}
  let tips = [];                   // active growing crack tips
  const CELL = 46;
  const grid = new Map();          // spatial index of segment indices
  let maxD = 1;                    // largest crack distance (heal extent)
  let healActive = false, healStart = 0;
  let running = false, raf = 0;
  const STEP = 6.2, MENISCUS = 58, HEAL_PXMS = 0.85;
  const MAX_SEG = 6500, MAX_TIPS = 260;
  let charging = null;             // {x,y,t0,shift}
  const pending = [];              // strikes queued while a network is still growing
  const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ---- seeded PRNG (mulberry32) ----------------------------------------
  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- spatial grid -----------------------------------------------------
  const key = (cx, cy) => cx + "," + cy;
  function indexSeg(i) {
    const s = segs[i];
    const c1x = (s.x1 / CELL) | 0, c1y = (s.y1 / CELL) | 0;
    const c2x = (s.x2 / CELL) | 0, c2y = (s.y2 / CELL) | 0;
    for (let cx = Math.min(c1x, c2x); cx <= Math.max(c1x, c2x); cx++)
      for (let cy = Math.min(c1y, c2y); cy <= Math.max(c1y, c2y); cy++) {
        const k = key(cx, cy);
        let arr = grid.get(k);
        if (!arr) grid.set(k, (arr = []));
        arr.push(i);
      }
  }
  function nearby(ax, ay, bx, by) {
    const out = [];
    const c1x = (ax / CELL) | 0, c1y = (ay / CELL) | 0;
    const c2x = (bx / CELL) | 0, c2y = (by / CELL) | 0;
    for (let cx = Math.min(c1x, c2x) - 1; cx <= Math.max(c1x, c2x) + 1; cx++)
      for (let cy = Math.min(c1y, c2y) - 1; cy <= Math.max(c1y, c2y) + 1; cy++) {
        const arr = grid.get(key(cx, cy));
        if (arr) for (let j = 0; j < arr.length; j++) out.push(arr[j]);
      }
    return out;
  }

  // interior segment intersection (excludes shared/near-endpoint touches)
  function intersect(ax, ay, bx, by, cx, cy, dx, dy) {
    const r1x = bx - ax, r1y = by - ay, r2x = dx - cx, r2y = dy - cy;
    const den = r1x * r2y - r1y * r2x;
    if (Math.abs(den) < 1e-9) return null;
    const t = ((cx - ax) * r2y - (cy - ay) * r2x) / den;
    const u = ((cx - ax) * r1y - (cy - ay) * r1x) / den;
    if (t > 0.04 && t < 1 && u > 0.03 && u < 0.97)
      return { x: ax + t * r1x, y: ay + t * r1y };
    return null;
  }

  // ---- strike: spawn radial + concentric ring cracks --------------------
  function strike(nx, ny, inten) {
    if (segs.length > MAX_SEG) return;
    // Quantize to the precision the URL stores so live play seeds seedStrike()
    // with the exact same numbers replay will — otherwise the sub-pixel seed
    // offset cascades through deterministic growth into a different topology.
    nx = +nx.toFixed(3); ny = +ny.toFixed(3); inten = +inten.toFixed(3);
    const idx = st.strikes.length;
    st.strikes.push({ x: nx, y: ny, i: inten });
    // A strike must grow to completion before the next is seeded so that live
    // play produces the exact same topology as URL replay (which grows one
    // strike at a time). If a network is still growing, queue this strike.
    if (tips.length || pending.length) {
      pending.push({ cx: nx * W, cy: ny * H, inten, idx });
      kick();
    } else {
      seedStrike(nx * W, ny * H, inten, idx);
    }
    if (!muted) tink(inten);
  }

  function seedStrike(cx, cy, inten, idx) {
    const rng = mulberry((st.seed + idx * 0x9e3779b1) >>> 0);
    const radial = Math.round(5 + inten * 12);           // 5..17 cracks
    const jit = 0.09 + inten * 0.16;                      // curvature jitter
    const reach = (0.20 + inten * 0.55) * MIN;            // crack length
    const start = rng() * Math.PI * 2;
    for (let i = 0; i < radial; i++) {
      const ang = start + (i / radial) * Math.PI * 2 + (rng() - 0.5) * 0.5;
      tips.push(mkTip(cx + Math.cos(ang) * 5, cy + Math.sin(ang) * 5,
        ang, jit, reach * (0.6 + rng() * 0.7), cx, cy, rng, true));
    }
    // concentric ring cracks arc between the radials (Hertzian rings)
    const rings = Math.round(1 + inten * 4);
    for (let r = 0; r < rings; r++) {
      const rad = reach * (0.18 + (r + rng() * 0.4) / (rings + 1) * 0.9);
      const dir = rng() < 0.5 ? 1 : -1;
      const a0 = rng() * Math.PI * 2;
      const span = (0.5 + rng() * 1.4);                   // arc length (radians)
      const t = mkTip(cx + Math.cos(a0) * rad, cy + Math.sin(a0) * rad,
        a0 + dir * Math.PI / 2, jit * 0.7, rad * span, cx, cy, rng, false);
      t.curl = dir * STEP / rad;                          // follow the circle
      tips.push(t);
    }
    if (tips.length > MAX_TIPS) tips.length = MAX_TIPS;
    healActive = false;
    kick();
  }

  function mkTip(x, y, ang, jit, maxLen, cx, cy, rng, radial) {
    return { x, y, ang, jit, len: 0, maxLen, cx, cy, rng, radial, curl: 0, alive: true };
  }

  // ---- growth tick: advance every tip one segment -----------------------
  function tick() {
    if (!tips.length) return;
    const next = [];
    for (const tp of tips) {
      if (!tp.alive) continue;
      tp.ang += tp.curl + (tp.rng() - 0.5) * tp.jit;
      const nx = tp.x + Math.cos(tp.ang) * STEP;
      const ny = tp.y + Math.sin(tp.ang) * STEP;
      // stress relief: halt on the first crack we run into
      let hit = null, hd = Infinity;
      for (const j of nearby(tp.x, tp.y, nx, ny)) {
        const s = segs[j];
        const p = intersect(tp.x, tp.y, nx, ny, s.x1, s.y1, s.x2, s.y2);
        if (p) { const dd = (p.x - tp.x) ** 2 + (p.y - tp.y) ** 2; if (dd < hd) { hd = dd; hit = p; } }
      }
      const ex = hit ? hit.x : nx, ey = hit ? hit.y : ny;
      const inb = ex >= -4 && ex <= W + 4 && ey >= -4 && ey <= H + 4;
      const d = Math.hypot((tp.x + ex) / 2 - tp.cx, (tp.y + ey) / 2 - tp.cy);
      const i = segs.length;
      segs.push({ x1: tp.x, y1: tp.y, x2: ex, y2: ey, d, h: 0 });
      indexSeg(i);
      if (d > maxD) maxD = d;
      tp.x = ex; tp.y = ey; tp.len += STEP;
      const stop = hit || !inb || tp.len >= tp.maxLen || segs.length > MAX_SEG;
      if (!stop) {
        next.push(tp);
        // radial cracks occasionally branch
        if (tp.radial && tp.rng() < 0.028 && tips.length + next.length < MAX_TIPS && tp.len > 24) {
          const b = mkTip(tp.x, tp.y, tp.ang + (tp.rng() < 0.5 ? 0.55 : -0.55),
            tp.jit * 1.15, (tp.maxLen - tp.len) * 0.7, tp.cx, tp.cy, tp.rng, true);
          next.push(b);
        }
      }
    }
    tips = next;
  }

  // ---- ceramic base layer ----------------------------------------------
  function buildBase() {
    base = document.createElement("canvas");
    base.width = W * DPR; base.height = H * DPR;
    const b = base.getContext("2d");
    b.scale(DPR, DPR);
    const g = GLAZES[st.glaze];
    const rad = b.createRadialGradient(W * 0.42, H * 0.38, MIN * 0.05, W * 0.5, H * 0.5, MIN * 0.85);
    rad.addColorStop(0, g.a); rad.addColorStop(1, g.b);
    b.fillStyle = rad; b.fillRect(0, 0, W, H);
    // soft rim vignette so the surface reads as one object
    const vg = b.createRadialGradient(W / 2, H / 2, MIN * 0.35, W / 2, H / 2, MIN * 0.72);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.22)");
    b.fillStyle = vg; b.fillRect(0, 0, W, H);
    // faint deterministic speckle
    const rng = mulberry((st.seed ^ 0x51ed270b) >>> 0);
    b.fillStyle = g.spk;
    for (let i = 0; i < (W * H) / 900; i++) {
      const x = rng() * W, y = rng() * H, r = rng() * 1.2 + 0.2;
      b.globalAlpha = 0.4 + rng() * 0.6;
      b.beginPath(); b.arc(x, y, r, 0, 7); b.fill();
    }
    b.globalAlpha = 1;
  }

  // ---- render -----------------------------------------------------------
  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(base, 0, 0, W, H);
    ctx.lineJoin = "round"; ctx.lineCap = "round";

    // dark, unhealed fractures (batched)
    ctx.strokeStyle = GLAZES[st.glaze].dark;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (const s of segs) if (s.h < 1) { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
    ctx.stroke();

    // molten-gold veining, drawn in three layers for depth
    if (st.gold) {
      const m = METALS[st.metal];
      let front = Infinity;
      if (healActive) {
        front = (performance.now() - healStart) * HEAL_PXMS;
        for (const s of segs) if (s.h < 1) {
          const nh = Math.max(0, Math.min(1, (front - s.d) / MENISCUS));
          if (nh > s.h) s.h = nh;
        }
        if (front > maxD + MENISCUS + 40) { healActive = false; if (!muted) shimmer(); }
      }
      layer(m.shadow, 4.4, 0.42, 0.6);   // shadow / recess
      layer(m.glow, 2.6, 0.6, 0.75);     // warm glow
      layer(m.core, 1.1, 0.95, 1);       // bright metal core
      // bright leading meniscus where the gold is still flowing
      ctx.strokeStyle = m.tip; ctx.lineWidth = 1.7;
      ctx.beginPath();
      for (const s of segs) if (s.h > 0.02 && s.h < 0.98) { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
      ctx.globalAlpha = 0.9; ctx.stroke(); ctx.globalAlpha = 1;
    }

    // charge indicator while holding
    if (charging) {
      const p = Math.min(1, (performance.now() - charging.t0) / 900);
      const r = 8 + p * 46;
      ctx.strokeStyle = "rgba(217,164,65," + (0.25 + p * 0.55) + ")";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(charging.x, charging.y, r, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(charging.x, charging.y, 2.5, 0, 7);
      ctx.fillStyle = "rgba(255,247,222,.9)"; ctx.fill();
    }
  }

  function layer(color, wBase, a, wFade) {
    ctx.strokeStyle = color;
    for (const s of segs) {
      if (s.h <= 0) continue;
      ctx.globalAlpha = a * s.h;
      ctx.lineWidth = wBase * (0.55 + wFade * s.h);
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---- animation loop ---------------------------------------------------
  // begin the gold heal pass — snap instantly if the user prefers reduced motion
  function startHeal() {
    if (!st.gold || !segs.length) return;
    if (reduceMotion) { for (const s of segs) s.h = 1; healActive = false; return; }
    healActive = true; healStart = performance.now();
  }
  function busy() {
    return charging || tips.length > 0 || pending.length > 0 || healActive ||
      (st.gold && segs.some(s => s.h > 0 && s.h < 1));
  }
  function frame() {
    for (let i = 0; i < 2; i++) tick();      // fixed growth ticks / frame
    // once the current network settles, seed the next queued strike
    if (!tips.length && pending.length) {
      const k = pending.shift();
      seedStrike(k.cx, k.cy, k.inten, k.idx);
    }
    if (!tips.length && !pending.length && !healActive && st.gold && segs.some(s => s.h < 1)) {
      startHeal();                                        // all strikes settled -> heal
    }
    render();
    if (busy()) raf = requestAnimationFrame(frame);
    else { render(); running = false; }
  }
  function kick() { if (!running) { running = true; raf = requestAnimationFrame(frame); } }

  // ---- WebAudio: ceramic tink + heal shimmer ----------------------------
  let ac = null;
  const audio = () => (ac || (ac = new (window.AudioContext || window.webkitAudioContext)()));
  function tink(inten) {
    try {
      const a = audio(), t = a.currentTime;
      const f = 1500 - inten * 750 + Math.random() * 120;
      [1, 2.76, 5.4].forEach((mult, k) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = "sine"; o.frequency.value = f * mult;
        const peak = (0.18 - k * 0.05) * (0.5 + inten * 0.5);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(peak, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 0.32 - k * 0.06);
        o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.4);
      });
    } catch (e) {}
  }
  function shimmer() {
    try {
      const a = audio(), t = a.currentTime;
      [523, 784, 1046, 1568].forEach((f, k) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = "triangle"; o.frequency.value = f;
        const s = t + k * 0.07;
        g.gain.setValueAtTime(0, s);
        g.gain.linearRampToValueAtTime(0.05, s + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0006, s + 0.9);
        o.connect(g).connect(a.destination); o.start(s); o.stop(s + 1);
      });
    } catch (e) {}
  }

  // ---- URL hash: seed + look + strike list (reproducible/shareable) -----
  function encode() {
    // strikes joined by ';' — the '.' in each toFixed(3) coordinate must not be the separator
    const s = st.strikes.map(k => k.x.toFixed(3) + "_" + k.y.toFixed(3) + "_" + k.i.toFixed(3)).join(";");
    location.replace("#" + [st.seed, "" + st.glaze + st.metal + (st.gold ? 1 : 0), s].join("~"));
  }
  function decode() {
    const h = location.hash.slice(1);
    if (!h) { st.strikes = []; resetSurface(); render(); return false; }
    const p = h.split("~");
    st.seed = (parseInt(p[0], 10) || 0) >>> 0;
    if (p[1] && p[1].length >= 3) {
      st.glaze = (+p[1][0]) % GLAZES.length;
      st.metal = (+p[1][1]) % METALS.length;
      st.gold = p[1][2] === "1";
    }
    const list = (p[2] || "").split(";").filter(Boolean).map(t => {
      const a = t.split("_"); return { x: +a[0], y: +a[1], i: +a[2] };
    });
    st.strikes = [];
    resetSurface();
    // replay each strike, growing it fully to settle before the next
    list.forEach((k, idx) => {
      st.strikes.push(k);
      seedStrike(k.x * W, k.y * H, k.i, idx);
      let guard = 0;
      while (tips.length && guard++ < 6000) tick();
    });
    if (st.gold && segs.length) startHeal();
    kick();
    return true;
  }

  // ---- surface / sizing -------------------------------------------------
  function resetSurface() {
    segs.length = 0; grid.clear(); tips = []; pending.length = 0; maxD = 1; healActive = false;
    buildBase();
  }
  function size() {
    const s = Math.min(window.innerWidth, window.innerHeight) - 40;
    W = H = Math.max(320, s);
    MIN = W;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildBase();
    render();
  }

  function newPlate() {
    st.seed = (Math.random() * 0xffffffff) >>> 0;
    st.strikes = [];
    resetSurface();
    encode();
    render();
    hint.classList.remove("gone");   // re-onboard over the fresh blank plate
  }

  // ---- controls ---------------------------------------------------------
  const bGlaze = document.getElementById("bGlaze"),
        bMetal = document.getElementById("bMetal"),
        bGold = document.getElementById("bGold"),
        bMute = document.getElementById("bMute"),
        bReset = document.getElementById("bReset");
  function labels() {
    bGlaze.innerHTML = "glaze · <b>" + GLAZES[st.glaze].name + "</b>";
    bMetal.innerHTML = "vein · <b>" + METALS[st.metal].name + "</b>";
    bGold.innerHTML = "heal · <b>" + (st.gold ? "on" : "off") + "</b>";
    bMute.innerHTML = "sound · <b>" + (muted ? "off" : "on") + "</b>";
  }
  bGlaze.onclick = () => { st.glaze = (st.glaze + 1) % GLAZES.length; buildBase(); labels(); encode(); render(); };
  bMetal.onclick = () => { st.metal = (st.metal + 1) % METALS.length; labels(); encode(); render(); };
  bGold.onclick = () => {
    st.gold = !st.gold;
    if (st.gold && segs.length && !tips.length && !pending.length) startHeal();
    if (!st.gold) segs.forEach(s => s.h = 0);
    labels(); encode(); kick(); render();
  };
  bMute.onclick = () => { muted = !muted; if (!muted) audio(); labels(); };
  bReset.onclick = newPlate;

  // ---- pointer: hold to charge, release to strike -----------------------
  function pos(e) {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function down(e) {
    e.preventDefault();
    if (!muted) audio();
    const p = pos(e);
    charging = { x: p.x, y: p.y, t0: performance.now(), shift: e.shiftKey };
    kick();
  }
  function up(e) {
    if (!charging) return;
    e.preventDefault();
    const held = performance.now() - charging.t0;
    const inten = charging.shift ? 1 : Math.min(1, held / 900);
    const x = charging.x, y = charging.y;
    charging = null;
    if (x >= 0 && x <= W && y >= 0 && y <= H) {
      strike(x / W, y / H, Math.max(0.06, inten));
      encode();
      hint.classList.add("gone");
    }
    kick();
  }
  cv.addEventListener("mousedown", down);
  window.addEventListener("mouseup", up);
  cv.addEventListener("touchstart", down, { passive: false });
  window.addEventListener("touchend", up, { passive: false });

  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "s") {
      const a = document.createElement("a");
      a.download = "kintsugi-" + st.seed + ".png";
      a.href = cv.toDataURL("image/png"); a.click();
    } else if (k === "g") bGold.onclick();
    else if (k === "m") bMute.onclick();
    else if (k === "n") newPlate();
  });

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { size(); decode(); }, 150); });

  // ---- boot -------------------------------------------------------------
  size();
  labels();
  if (!decode()) { st.seed = (Math.random() * 0xffffffff) >>> 0; resetSurface(); encode(); render(); }
})();
</script>
