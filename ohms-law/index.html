<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OhmsLaw — Ohm's Law & Power Calculator</title>
<meta name="description" content="Enter any two of voltage, current, resistance, or power and get the other two, using Ohm's law and the power equations. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('ohms-law-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#f97316;
    --bg:#f8f6f3; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e6e2dd; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#16130f; --card:#201b16; --fg:#f2ede7; --muted:#a39a90; --line:#332b22; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#c2410c);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .fld label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  .fld input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.05rem}
  .fld.solved input{border-color:var(--c);background:color-mix(in srgb, var(--c) 8%, var(--bg))}
  .hint{color:var(--muted);font-size:.86rem;text-align:center;margin-top:4px}
  .results{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:520px){.results{grid-template-columns:1fr 1fr}}
  .res{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .res span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .res b{font-size:1.25rem;font-variant-numeric:tabular-nums}
  .res small{color:var(--muted)}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  .clear{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;margin-top:12px}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⚡</div>
    <div><h1>OhmsLaw</h1><div class="sub">Volts · Amps · Ohms · Watts — know any two</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="grid">
      <div class="fld" id="fld-V"><label for="V">Voltage (V)</label><input type="number" id="V" step="any" placeholder="volts"></div>
      <div class="fld" id="fld-I"><label for="I">Current (I)</label><input type="number" id="I" step="any" placeholder="amps"></div>
      <div class="fld" id="fld-R"><label for="R">Resistance (R)</label><input type="number" id="R" step="any" placeholder="ohms"></div>
      <div class="fld" id="fld-P"><label for="P">Power (P)</label><input type="number" id="P" step="any" placeholder="watts"></div>
    </div>
    <div class="hint" id="hint">Enter any two values.</div>
    <button class="clear" id="clear" type="button">Clear</button>
  </div>

  <div class="card">
    <div class="results">
      <div class="res"><span>Voltage</span><b id="rV">—</b> <small>V</small></div>
      <div class="res"><span>Current</span><b id="rI">—</b> <small>A</small></div>
      <div class="res"><span>Resistance</span><b id="rR">—</b> <small>Ω</small></div>
      <div class="res"><span>Power</span><b id="rP">—</b> <small>W</small></div>
    </div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/ohms-law">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  // Given exactly two of {V, I, R, P}, return all four.
  function solve(known){
    const has = k => known[k] != null && known[k] !== '' && !Number.isNaN(Number(known[k]));
    const provided = ['V', 'I', 'R', 'P'].filter(has);
    if(provided.length !== 2) throw new Error('provide exactly two of V, I, R, P');
    let V = has('V') ? Number(known.V) : undefined;
    let I = has('I') ? Number(known.I) : undefined;
    let R = has('R') ? Number(known.R) : undefined;
    let P = has('P') ? Number(known.P) : undefined;

    if(has('V') && has('I')){ if(I === 0) throw new Error('current cannot be zero'); R = V / I; P = V * I; }
    else if(has('V') && has('R')){ if(R === 0) throw new Error('resistance cannot be zero'); I = V / R; P = V * V / R; }
    else if(has('V') && has('P')){ if(V === 0) throw new Error('voltage cannot be zero'); I = P / V; R = V * V / P; }
    else if(has('I') && has('R')){ V = I * R; P = I * I * R; }
    else if(has('I') && has('P')){ if(I === 0) throw new Error('current cannot be zero'); V = P / I; R = P / (I * I); }
    else if(has('R') && has('P')){ if(R <= 0) throw new Error('resistance must be positive'); V = Math.sqrt(P * R); I = Math.sqrt(P / R); }

    return { V, I, R, P };
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('rV')){
    const $ = id => document.getElementById(id);
    const keys = ['V', 'I', 'R', 'P'];
    const fmt = n => {
      if(!isFinite(n)) return '—';
      const r = Math.round(n * 1e6) / 1e6;
      return r.toLocaleString(undefined, { maximumFractionDigits: 6 });
    };

    function render(){
      const known = {};
      keys.forEach(k => { known[k] = $(k).value; });
      keys.forEach(k => $('fld-' + k).classList.remove('solved'));
      const filled = keys.filter(k => known[k] !== '' && !Number.isNaN(Number(known[k])));

      if(filled.length !== 2){
        keys.forEach(k => $('r' + k).textContent = '—');
        $('hint').textContent = filled.length < 2 ? 'Enter any two values.' : 'Only two values — clear one to solve.';
        return;
      }
      let out;
      try{ out = solve(known); }
      catch(e){ keys.forEach(k => $('r' + k).textContent = '—'); $('hint').textContent = e.message; return; }
      $('hint').textContent = 'Solved ✓';
      keys.forEach(k => {
        $('r' + k).textContent = fmt(out[k]);
        if(!filled.includes(k)) $('fld-' + k).classList.add('solved');
      });
    }

    keys.forEach(k => $(k).addEventListener('input', render));
    $('clear').addEventListener('click', () => { keys.forEach(k => $(k).value = ''); render(); });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('ohms-law-theme', cur); }catch(e){}
    });

    $('V').value = 12; $('I').value = 2;
    render();
  }

  if(typeof module !== 'undefined') module.exports = { solve };
</script>
</body>
</html>
