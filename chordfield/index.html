<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chordfield — Walk the Tonnetz</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131824; --line:#2a3345; --ink:#e8edf6; --dim:#8a97b0;
    --maj:#5ad6c8; --min:#c98bff; --accent:#ffb347; --dia:#3ad07e; --glow:#63e6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141a28,#0e131d);flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:700}
  h1 b{color:var(--accent)}
  .sub{font-size:11px;color:var(--dim);margin-right:auto}
  .grp{display:flex;align-items:center;gap:6px}
  button,select,label.tg{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;transition:.12s;user-select:none}
  button:hover,select:hover,label.tg:hover{border-color:var(--glow);color:#fff}
  button:active{transform:translateY(1px)}
  .plr{font-weight:700;min-width:34px}
  .plr small{display:block;font-size:8px;color:var(--dim);font-weight:400;margin-top:1px}
  label.tg input{display:none}
  label.tg.on{background:#1d2b3a;border-color:var(--glow);color:var(--glow)}
  input[type=range]{accent-color:var(--accent);width:96px;vertical-align:middle}
  #main{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:pointer}
  footer{border-top:1px solid var(--line);background:#0e131d;padding:8px 12px;
    display:flex;align-items:center;gap:10px}
  #chips{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px 0}
  .chip{flex:0 0 auto;padding:5px 9px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);font-size:12px;cursor:pointer;white-space:nowrap;transition:.1s}
  .chip.maj{color:var(--maj)} .chip.min{color:var(--min)}
  .chip.now{background:var(--accent);color:#1a1206;border-color:var(--accent);font-weight:700}
  .chip:hover{border-color:var(--glow)}
  #toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#1d2b3a;
    border:1px solid var(--glow);color:var(--glow);padding:8px 16px;border-radius:8px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none}
  #toast.show{opacity:1}
  .lbl{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Chord<b>field</b></h1>
    <span class="sub">Walk the Tonnetz — every triad is a tile, every chord change a step.</span>
    <div class="grp">
      <button class="plr" data-t="P" title="Parallel (key P)">P<small>parallel</small></button>
      <button class="plr" data-t="L" title="Leading-tone (key L)">L<small>lead-tone</small></button>
      <button class="plr" data-t="R" title="Relative (key R)">R<small>relative</small></button>
    </div>
    <div class="grp">
      <span class="lbl">Key</span>
      <select id="tonic"></select>
      <select id="mode"></select>
    </div>
    <div class="grp">
      <button id="play">▶ Play</button>
      <span class="lbl">♩</span><input type="range" id="tempo" min="50" max="220" value="96">
      <span class="lbl" id="bpm">96</span>
    </div>
    <div class="grp">
      <label class="tg on" id="arpTg"><input type="checkbox" id="arp">Arp</label>
      <label class="tg" id="sevTg"><input type="checkbox" id="sev">7th</label>
    </div>
    <div class="grp">
      <button id="pop">Undo</button>
      <button id="clear">Clear</button>
      <button id="mid">↓ MIDI</button>
      <button id="share">🔗 Share</button>
    </div>
  </header>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
  </div>
  <footer>
    <div id="chips"></div>
  </footer>
</div>
<script>
"use strict";
const NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const SCALES=[
  {n:"Ionian (major)",s:[0,2,4,5,7,9,11]},
  {n:"Aeolian (minor)",s:[0,2,3,5,7,8,10]},
  {n:"Dorian",s:[0,2,3,5,7,9,10]},
  {n:"Mixolydian",s:[0,2,4,5,7,9,10]},
  {n:"Lydian",s:[0,2,4,6,7,9,11]},
  {n:"Phrygian",s:[0,1,3,5,7,8,10]},
];
const S=86, TH=S*Math.sqrt(3)/2;              // triangle side + height
let cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let cw=0, ch=0, cx=0, cy=0, dpr=1, view={x:0,y:0};

// ---- state ----
let prog=[{u:0,v:0,type:0}];   // list of triads {u,v,type}  type 0=major 1=minor
let tonic=0, modeIdx=0;
let arp=true, seventh=false, tempo=96;
let playing=false, soundingIdx=-1, playIdx=0, playTimer=null;
let anim=null;                 // moving-voice animation
let hover=null;                // triad under the cursor {u,v,type}
let showHint=true;             // first-run onboarding hint
const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function dismissHint(){showHint=false;}

// ---- tonnetz math ----
const mod=(n,m)=>((n%m)+m)%m;
const pc=(u,v)=>mod(7*u+4*v,12);
function triad(t){
  const p=pc(t.u,t.v);
  if(t.type===0){const r=p; return {root:r,notes:[r,mod(r+4,12),mod(r+7,12)],q:"maj"};}
  const r=mod(p+4,12); return {root:r,notes:[r,mod(r+3,12),mod(r+7,12)],q:"min"};
}
// vertices carry pitch class + lattice coords
function verts(t){
  const p=pc(t.u,t.v), u=t.u, v=t.v;
  if(t.type===0) return [{pc:p,u,v},{pc:mod(p+7,12),u:u+1,v},{pc:mod(p+4,12),u,v:v+1}];
  return [{pc:mod(p+4,12),u,v:v+1},{pc:mod(p+7,12),u:u+1,v},{pc:mod(p+11,12),u:u+1,v:v+1}];
}
// neo-Riemannian move to the edge-adjacent triad (derived from lattice geometry)
function move(t,k){
  if(t.type===0){ // major
    if(k==="P") return {u:t.u,v:t.v-1,type:1};
    if(k==="R") return {u:t.u-1,v:t.v,type:1};
    return {u:t.u,v:t.v,type:1};            // L
  }
  if(k==="L") return {u:t.u,v:t.v,type:0};
  if(k==="P") return {u:t.u,v:t.v+1,type:0};
  return {u:t.u+1,v:t.v,type:0};            // R
}
function midiNotes(t){
  const tr=triad(t), r=tr.root;
  const ns=tr.notes.map(n=>60+n+(n<r?12:0));
  if(seventh) ns.push(60+r+(tr.q==="maj"?11:10));
  return ns;
}
const scaleSet=()=> (modeIdx<0||!SCALES[modeIdx])?null:new Set(SCALES[modeIdx].s.map(i=>mod(tonic+i,12)));
const isDia=(t,set)=> set && triad(t).notes.every(n=>set.has(n));

// ---- audio ----
let ac=null, masterIn=null;
function ensureAudio(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const out=ac.createGain(); out.gain.value=0.9; out.connect(ac.destination);
  const dry=ac.createGain(); dry.gain.value=0.8; dry.connect(out);
  const wet=ac.createGain(); wet.gain.value=0.32;
  const rev=ac.createConvolver(); rev.buffer=impulse(1.7,2.6); rev.connect(wet); wet.connect(out);
  masterIn=ac.createGain(); masterIn.connect(dry); masterIn.connect(rev);
}
function impulse(dur,decay){
  const len=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
  return b;
}
const freq=m=>440*Math.pow(2,(m-69)/12);
function voice(f,t,d){
  const g=ac.createGain(); g.connect(masterIn);
  const a=0.025, rel=Math.min(0.7,d*0.55), peak=0.2;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.setValueAtTime(peak,t+Math.max(a,d-rel));
  g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2400; lp.connect(g);
  [-7,7].forEach(det=>{
    const o=ac.createOscillator(); o.type="triangle"; o.frequency.value=f; o.detune.value=det;
    o.connect(lp); o.start(t); o.stop(t+d+0.1);
  });
}
function playNotes(ns,when,dur,doArp){
  ensureAudio();
  ns.forEach((m,i)=>{
    const t=when+(doArp?i*(dur/ns.length):0);
    const d=doArp?(dur/ns.length)*1.5:dur;
    voice(freq(m),t,d);
  });
}
const sound=t=>{ensureAudio(); playNotes(midiNotes(t),ac.currentTime+0.01,0.85,arp);};

// ---- interaction ----
function doMove(k){
  dismissHint();
  const cur=prog[prog.length-1], nxt=move(cur,k);
  const oldN=triad(cur).notes, newN=triad(nxt).notes;
  const leaving=oldN.find(x=>!newN.includes(x));
  const entering=newN.find(x=>!oldN.includes(x));
  const fv=verts(cur).find(z=>z.pc===leaving), tv=verts(nxt).find(z=>z.pc===entering);
  if(fv&&tv&&!reduceMotion) anim={fu:fv.u,fv:fv.v,tu:tv.u,tv:tv.v,start:performance.now()};
  prog.push(nxt); sound(nxt); renderChips();
}
function pickTriangle(mx,my){
  const X=mx-cx-view.x, Y=my-cy-view.y;
  const v=-Y/TH, u=X/S-0.5*v;
  const iu=Math.floor(u), iv=Math.floor(v), fa=u-iu, fb=v-iv;
  return {u:iu,v:iv,type:(fa+fb<1)?0:1};
}
cv.addEventListener("click",e=>{
  dismissHint();
  const r=cv.getBoundingClientRect();
  const t=pickTriangle(e.clientX-r.left,e.clientY-r.top);
  const cur=prog[prog.length-1];
  if(cur.u===t.u&&cur.v===t.v&&cur.type===t.type){ sound(t); return; } // re-hear current
  prog.push(t); sound(t); renderChips();
});
cv.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect();
  hover=pickTriangle(e.clientX-r.left,e.clientY-r.top);
  hover.mx=e.clientX-r.left; hover.my=e.clientY-r.top;
});
cv.addEventListener("mouseleave",()=>hover=null);

// ---- rendering ----
function resize(){
  dpr=window.devicePixelRatio||1;
  cw=cv.clientWidth; ch=cv.clientHeight; cx=cw/2; cy=ch/2;
  cv.width=cw*dpr; cv.height=ch*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
const P=(u,v)=>[cx+view.x+(u+0.5*v)*S, cy+view.y-(v*TH)];
function centroidL(t){const vs=verts(t); return {u:(vs[0].u+vs[1].u+vs[2].u)/3,v:(vs[0].v+vs[1].v+vs[2].v)/3};}
const key=t=>t.u+","+t.v+","+t.type;

function render(){
  requestAnimationFrame(render);
  const c=centroidL(prog[prog.length-1]);
  const tx=-((c.u+0.5*c.v)*S), ty=(c.v*TH);
  if(reduceMotion){view.x=tx; view.y=ty;}
  else{view.x+=(tx-view.x)*0.12; view.y+=(ty-view.y)*0.12;}
  ctx.clearRect(0,0,cw,ch);

  const set=scaleSet();
  const uc=Math.round(c.u), vc=Math.round(c.v);
  const R=7;
  const visited=new Set(prog.map(key));
  const cur=prog[prog.length-1];

  // triangles
  for(let iv=vc-R;iv<=vc+R;iv++)for(let iu=uc-R;iu<=uc+R;iu++)for(let ty2=0;ty2<2;ty2++){
    const t={u:iu,v:iv,type:ty2}, vs=verts(t);
    const a=P(vs[0].u,vs[0].v),b=P(vs[1].u,vs[1].v),d=P(vs[2].u,vs[2].v);
    if(Math.max(a[0],b[0],d[0])<-20||Math.min(a[0],b[0],d[0])>cw+20)continue;
    if(Math.max(a[1],b[1],d[1])<-20||Math.min(a[1],b[1],d[1])>ch+20)continue;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();
    const dia=isDia(t,set), isCur=key(t)===key(cur), vis=visited.has(key(t));
    if(isCur){ctx.fillStyle="rgba(255,179,71,0.28)";}
    else if(vis){ctx.fillStyle=t.type?"rgba(201,139,255,0.16)":"rgba(90,214,200,0.16)";}
    else if(dia){ctx.fillStyle="rgba(58,208,126,0.11)";}
    else {ctx.fillStyle=t.type?"rgba(201,139,255,0.03)":"rgba(90,214,200,0.03)";}
    ctx.fill();
    ctx.lineWidth=dia?1.4:0.8;
    ctx.strokeStyle=dia?"rgba(58,208,126,0.45)":"rgba(42,51,69,0.9)";
    ctx.stroke();
  }

  // trail
  if(prog.length>1){
    ctx.save(); ctx.lineWidth=3; ctx.lineJoin="round";
    ctx.shadowColor="var(--glow)"; ctx.shadowBlur=12;
    ctx.strokeStyle="rgba(99,230,255,0.75)"; ctx.beginPath();
    prog.forEach((t,i)=>{const q=centroidL(t),pp=P(q.u,q.v); i?ctx.lineTo(pp[0],pp[1]):ctx.moveTo(pp[0],pp[1]);});
    ctx.stroke(); ctx.restore();
    // step dots
    prog.forEach((t,i)=>{const q=centroidL(t),pp=P(q.u,q.v);
      ctx.beginPath();ctx.arc(pp[0],pp[1],i===soundingIdx?7:4,0,7);
      ctx.fillStyle=i===soundingIdx?"var(--accent)":"rgba(99,230,255,0.85)";ctx.fill();});
  }

  // nodes + labels
  for(let iv=vc-R;iv<=vc+R;iv++)for(let iu=uc-R;iu<=uc+R;iu++){
    const pp=P(iu,iv);
    if(pp[0]<-16||pp[0]>cw+16||pp[1]<-16||pp[1]>ch+16)continue;
    const p=pc(iu,iv), inScale=set&&set.has(p);
    ctx.beginPath();ctx.arc(pp[0],pp[1],13,0,7);
    ctx.fillStyle=inScale?"#1c2f26":"#161c28";ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle=inScale?"var(--dia)":"#39435a";ctx.stroke();
    ctx.fillStyle=inScale?"#eafff2":"#cdd6e6";ctx.font="600 12px system-ui";
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(NAMES[p],pp[0],pp[1]);
  }

  // current triad label
  {
    const tr=triad(cur), q=centroidL(cur), pp=P(q.u,q.v);
    ctx.font="700 15px system-ui";ctx.fillStyle="var(--accent)";ctx.textAlign="center";
    ctx.fillText(NAMES[tr.root]+(tr.q==="min"?"m":""),pp[0],pp[1]+0.5);
  }

  // hover highlight — show which triangle the cursor is over + its chord name
  if(hover&&key(hover)!==key(cur)){
    const vs=verts(hover), a=P(vs[0].u,vs[0].v),b=P(vs[1].u,vs[1].v),d=P(vs[2].u,vs[2].v);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();
    ctx.fillStyle=hover.type?"rgba(201,139,255,0.22)":"rgba(90,214,200,0.22)";ctx.fill();
    ctx.lineWidth=1.6;ctx.strokeStyle="rgba(99,230,255,0.85)";ctx.stroke();
    const htr=triad(hover);
    ctx.font="700 13px system-ui";ctx.textAlign="left";ctx.textBaseline="bottom";
    ctx.fillStyle="var(--glow)";
    ctx.fillText(NAMES[htr.root]+(htr.q==="min"?"m":""),(hover.mx||0)+14,(hover.my||0)-8);
  }

  // moving-voice animation (only the single voice that changes)
  if(anim){
    const pr=Math.min(1,(performance.now()-anim.start)/460);
    const f=P(anim.fu,anim.fv), tt=P(anim.tu,anim.tv);
    const x=f[0]+(tt[0]-f[0])*pr, y=f[1]+(tt[1]-f[1])*pr;
    ctx.save();ctx.shadowColor="var(--accent)";ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fillStyle="var(--accent)";ctx.fill();ctx.restore();
    if(pr>=1)anim=null;
  }

  // first-run onboarding hint (hides on first interaction / after ~7s)
  if(showHint){
    const msg="Click any triangle to sound a chord  •  press P / L / R to walk";
    ctx.font="600 14px system-ui";
    const bw=ctx.measureText(msg).width+34, bx=cx-bw/2, by=ch-24;
    ctx.fillStyle="rgba(19,24,36,0.92)";ctx.strokeStyle="var(--glow)";ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(bx,by-30,bw,38,10);ctx.fill();ctx.stroke();
    ctx.fillStyle="#e8edf6";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(msg,cx,by-11);
  }
}

// ---- chips ----
function renderChips(){
  const el=document.getElementById("chips"); el.innerHTML="";
  // "now" follows the playhead during playback; otherwise it marks the current (last) chord
  const nowIdx=soundingIdx>=0?soundingIdx:prog.length-1;
  prog.forEach((t,i)=>{
    const tr=triad(t), c=document.createElement("div");
    c.className="chip "+tr.q+(i===nowIdx?" now":"");
    c.textContent=NAMES[tr.root]+(tr.q==="min"?"m":"");
    c.title="Rewind to here";
    c.onclick=()=>{prog=prog.slice(0,i+1);sound(prog[prog.length-1]);renderChips();};
    el.appendChild(c);
  });
  el.scrollLeft=el.scrollWidth;
}

// ---- playback ----
function stop(){playing=false;soundingIdx=-1;clearInterval(playTimer);
  document.getElementById("play").textContent="▶ Play";renderChips();}
function startPlay(){
  if(prog.length<1)return; ensureAudio();
  playing=true;playIdx=0;document.getElementById("play").textContent="◼ Stop";
  const step=()=>{soundingIdx=playIdx;
    playNotes(midiNotes(prog[playIdx]),ac.currentTime+0.02,(60/tempo)*0.94,arp);
    renderChips(); playIdx=(playIdx+1)%prog.length;};
  step(); playTimer=setInterval(step,60000/tempo);
}

// ---- MIDI export ----
function midiVar(n){let b=[n&0x7f];n=Math.floor(n/128);while(n>0){b.unshift((n&0x7f)|0x80);n=Math.floor(n/128);}return b;}
function exportMidi(){
  const tpq=480,beat=tpq,ev=[],us=Math.round(60000000/tempo);
  ev.push(0,0xFF,0x51,0x03,(us>>16)&255,(us>>8)&255,us&255);
  ev.push(0,0xFF,0x03,9,...[..."Chordfield"].map(c=>c.charCodeAt(0)));
  prog.forEach(t=>{
    const ns=midiNotes(t);
    if(arp){const st=Math.floor(beat/ns.length);
      ns.forEach(n=>{ev.push(...midiVar(0),0x90,n,92);ev.push(...midiVar(st),0x80,n,0);});}
    else{ns.forEach(n=>ev.push(...midiVar(0),0x90,n,86));
      ns.forEach((n,i)=>ev.push(...midiVar(i===0?beat:0),0x80,n,0));}
  });
  ev.push(0,0xFF,0x2F,0x00);
  const trk=[0x4D,0x54,0x72,0x6B,(ev.length>>24)&255,(ev.length>>16)&255,(ev.length>>8)&255,ev.length&255,...ev];
  const hdr=[0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,(tpq>>8)&255,tpq&255];
  const bytes=new Uint8Array([...hdr,...trk]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type:"audio/midi"}));
  a.download="chordfield.mid";a.click();URL.revokeObjectURL(a.href);
  toast("MIDI file downloaded");
}

// ---- hash share ----
function encodeHash(){return `${tonic}.${modeIdx};`+prog.map(t=>`${t.u}.${t.v}.${t.type}`).join(",");}
function decodeHash(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h)return false;
  try{
    const [k,seq]=h.split(";"); const [tn,md]=(k||"").split(".").map(Number);
    const pr=(seq||"").split(",").filter(Boolean)
      .map(s=>{const[u,v,t]=s.split(".").map(Number);return{u,v,type:t};})
      .filter(o=>Number.isFinite(o.u)&&Number.isFinite(o.v)&&(o.type===0||o.type===1));
    if(!pr.length)return false;                    // nothing usable -> keep defaults
    if(Number.isFinite(tn))tonic=mod(tn,12);
    if(Number.isInteger(md)&&md>=-1&&md<SCALES.length)modeIdx=md;
    prog=pr; return true;
  }catch(e){}
  return false;
}
function share(){
  location.hash=encodeHash();
  if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>toast("Link copied to clipboard"),()=>toast("Link in URL bar"));
  else toast("Link in URL bar");
}
let toastT;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1800);}

// ---- wiring ----
document.querySelectorAll(".plr").forEach(b=>b.onclick=()=>doMove(b.dataset.t));
window.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;              // leave browser chords (Ctrl/Cmd+R/P/L) alone
  const tag=e.target&&e.target.tagName;
  if(tag==="SELECT"||tag==="INPUT")return;               // don't hijack form controls
  const k=e.key.toLowerCase();
  if(k==="p"||k==="l"||k==="r"){doMove(k.toUpperCase());}
  else if(e.code==="Space"){e.preventDefault();playing?stop():startPlay();}
});
document.getElementById("play").onclick=()=>playing?stop():startPlay();
const tEl=document.getElementById("tempo"),bpmEl=document.getElementById("bpm");
tEl.oninput=()=>{tempo=+tEl.value;bpmEl.textContent=tempo;if(playing){clearInterval(playTimer);
  playTimer=setInterval(()=>{soundingIdx=playIdx;playNotes(midiNotes(prog[playIdx]),ac.currentTime+0.02,(60/tempo)*0.94,arp);
    renderChips();playIdx=(playIdx+1)%prog.length;},60000/tempo);}};
function tg(id,setter){const l=document.getElementById(id+"Tg"),c=document.getElementById(id);
  l.onclick=e=>{if(e.target!==c)c.checked=!c.checked;l.classList.toggle("on",c.checked);setter(c.checked);};}
tg("arp",v=>arp=v); tg("sev",v=>seventh=v);
document.getElementById("pop").onclick=()=>{if(prog.length>1){prog.pop();renderChips();}};
document.getElementById("clear").onclick=()=>{prog=[{u:0,v:0,type:0}];renderChips();};
document.getElementById("mid").onclick=exportMidi;
document.getElementById("share").onclick=share;

// key selects
const tSel=document.getElementById("tonic"),mSel=document.getElementById("mode");
NAMES.forEach((n,i)=>{const o=document.createElement("option");o.value=i;o.textContent=n;tSel.appendChild(o);});
{const o=document.createElement("option");o.value=-1;o.textContent="Off (no overlay)";mSel.appendChild(o);}
SCALES.forEach((s,i)=>{const o=document.createElement("option");o.value=i;o.textContent=s.n;mSel.appendChild(o);});
tSel.onchange=()=>tonic=+tSel.value; mSel.onchange=()=>modeIdx=+mSel.value;

// init
decodeHash();
tSel.value=tonic; mSel.value=modeIdx;
document.getElementById("arp").checked=arp; document.getElementById("arpTg").classList.toggle("on",arp);
resize();
// center view instantly on load
{const c=centroidL(prog[prog.length-1]);view.x=-((c.u+0.5*c.v)*S);view.y=(c.v*TH);}
renderChips();
setTimeout(dismissHint,7000);   // auto-hide onboarding hint
render();
</script>
