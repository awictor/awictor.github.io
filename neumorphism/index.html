<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neumorph — Neumorphism CSS Generator</title>
<meta name="description" content="Generate soft-UI (neumorphism) CSS: pick a base color, distance, blur and intensity and copy the box-shadow. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('neumorph-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#8b5cf6;
    --bg:#f5f5f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e2e6; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#131318; --card:#1d1d24; --fg:#f0f0f4; --muted:#9a9aa2; --line:#30303a; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:860px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#6d28d9);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:860px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
  label:first-child{margin-top:0}
  input[type=range]{width:100%;accent-color:var(--c)}
  input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .row b{font-variant-numeric:tabular-nums}
  .shapes{display:flex;gap:8px;flex-wrap:wrap}
  .shapes button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit;font-size:.85rem}
  .shapes button.on{background:var(--c);color:#fff;border-color:var(--c);font-weight:700}
  .stage{display:flex;align-items:center;justify-content:center;min-height:280px;border-radius:14px}
  .demo{width:150px;height:150px;border-radius:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.82rem;margin:14px 0 0;white-space:pre-wrap}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:860px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🫧</div>
    <div><h1>Neumorph</h1><div class="sub">Soft-UI (neumorphism) CSS generator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="color">Base color</label>
    <input type="color" id="color" value="#e0e0e6">
    <label class="row"><span>Distance</span><b id="distV">20px</b></label>
    <input type="range" id="dist" min="2" max="60" value="20">
    <label class="row"><span>Blur</span><b id="blurV">40px</b></label>
    <input type="range" id="blur" min="0" max="120" value="40">
    <label class="row"><span>Intensity</span><b id="intV">15%</b></label>
    <input type="range" id="int" min="1" max="50" value="15">
    <label>Shape</label>
    <div class="shapes" id="shapes">
      <button type="button" data-s="flat">Flat</button>
      <button type="button" data-s="concave">Concave</button>
      <button type="button" data-s="convex">Convex</button>
      <button type="button" data-s="pressed">Pressed</button>
    </div>
  </div>

  <div class="card">
    <div class="stage" id="stage"><div class="demo" id="demo">preview</div></div>
    <pre id="out"></pre>
    <div class="btns"><button class="act" id="copy" type="button">Copy CSS</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/neumorphism">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }

  function hexToRgb(hex){
    let h = String(hex).replace('#', '');
    if(h.length === 3) h = h.split('').map(c => c + c).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('invalid hex color: ' + hex);
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  }

  function rgbToHex(r, g, b){
    return '#' + [r, g, b].map(x => clamp(Math.round(x), 0, 255).toString(16).padStart(2, '0')).join('');
  }

  // percent > 0 lightens toward white, < 0 darkens toward black
  function adjust(hex, percent){
    const [r, g, b] = hexToRgb(hex);
    const target = percent < 0 ? 0 : 255;
    const p = clamp(Math.abs(percent), 0, 100) / 100;
    return rgbToHex(r + (target - r) * p, g + (target - g) * p, b + (target - b) * p);
  }

  function neu(o = {}){
    const color = o.color || '#e0e0e0';
    const distance = o.distance == null ? 20 : o.distance;
    const blur = o.blur == null ? distance * 2 : o.blur;
    const intensity = o.intensity == null ? 15 : o.intensity;
    const shape = o.shape || 'flat';
    const light = adjust(color, intensity);
    const dark = adjust(color, -intensity);
    const inset = shape === 'pressed' ? 'inset ' : '';
    const shadow = `${inset}${distance}px ${distance}px ${blur}px ${dark}, ${inset}-${distance}px -${distance}px ${blur}px ${light}`;
    let background = color;
    if(shape === 'concave') background = `linear-gradient(145deg, ${dark}, ${light})`;
    else if(shape === 'convex') background = `linear-gradient(145deg, ${light}, ${dark})`;
    const css = `border-radius: 36px;\nbackground: ${background};\nbox-shadow: ${shadow};`;
    return { light, dark, shadow, background, css };
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    let shape = 'flat';

    function render(){
      const color = $('color').value;
      const distance = +$('dist').value;
      const blur = +$('blur').value;
      const intensity = +$('int').value;
      $('distV').textContent = distance + 'px';
      $('blurV').textContent = blur + 'px';
      $('intV').textContent = intensity + '%';
      let r;
      try{ r = neu({ color, distance, blur, intensity, shape }); }catch(e){ return; }
      $('out').textContent = r.css;
      $('stage').style.background = color;
      const demo = $('demo');
      demo.style.background = r.background;
      demo.style.boxShadow = r.shadow;
      demo.style.borderRadius = '36px';
    }

    ['color', 'dist', 'blur', 'int'].forEach(id => $(id).addEventListener('input', render));
    $('shapes').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      shape = b.dataset.s;
      [...$('shapes').children].forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('shapes').querySelector('[data-s="flat"]').classList.add('on');

    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy CSS', 1200); }catch(e){}
    });

    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('neumorph-theme', cur); }catch(e){}
    });

    render();
  }

  if(typeof module !== 'undefined') module.exports = { adjust, neu, hexToRgb, rgbToHex };
</script>
</body>
</html>
