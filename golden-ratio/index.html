<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldenRatio — Divine Proportion Calculator</title>
<meta name="description" content="Split any length into golden-ratio parts, scale a value up or down by φ, build a golden rectangle, and generate a φ sequence for layout and typography. 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('golden-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#ca8a04;
    --bg:#faf7ef; --card:#ffffff; --fg:#211d12; --muted:#6b6250; --line:#efe8d6; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#13110a; --card:#1d1a10; --fg:#f6f1e4; --muted:#a89c7d; --line:#2c2717; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{max-width:680px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#a16207);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:680px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  h2{font-size:.85rem;margin:0 0 12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.05rem}
  .phi{text-align:center;font-size:2rem;font-weight:800;color:var(--c)}
  .phi small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .split{display:flex;height:44px;border-radius:8px;overflow:hidden;margin-top:14px;border:1px solid var(--line)}
  .split .maj{background:var(--c);color:#fff}
  .split .min{background:color-mix(in srgb,var(--c) 30%,transparent);color:var(--fg)}
  .split div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;white-space:nowrap}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .box .v{font-size:1.4rem;font-weight:800;color:var(--c)}
  .box .k{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
  .rect{margin-top:14px;border:2px solid var(--c);border-radius:6px;position:relative;max-width:100%}
  .rect .cut{position:absolute;top:0;bottom:0;border-right:2px dashed var(--c);opacity:.6}
  .seq{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .seq span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-weight:700}
  .err{color:#dc2626;font-size:.85rem;margin-top:10px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:680px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo mono">φ</div>
    <div><h1>GoldenRatio</h1><div class="sub">Divine proportion calculator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="phi mono" id="phiVal">φ<small>the golden ratio</small></div>
  </div>

  <div class="card">
    <h2>Split a length by φ</h2>
    <label for="total">Total length</label>
    <input type="number" id="total" value="960" step="any" min="0">
    <div class="split" id="splitBar"></div>
    <div class="pair">
      <div class="box"><div class="v" id="major">—</div><div class="k">Larger part</div></div>
      <div class="box"><div class="v" id="minor">—</div><div class="k">Smaller part</div></div>
    </div>
    <div class="rect" id="rect"><div class="cut" id="cut"></div></div>
    <div class="err" id="errA"></div>
  </div>

  <div class="card">
    <h2>Scale a value</h2>
    <label for="val">Value</label>
    <input type="number" id="val" value="16" step="any" min="0">
    <div class="pair">
      <div class="box"><div class="v" id="larger">—</div><div class="k">× φ (larger)</div></div>
      <div class="box"><div class="v" id="smaller">—</div><div class="k">÷ φ (smaller)</div></div>
    </div>
    <div class="seq" id="seq"></div>
    <div class="err" id="errB"></div>
  </div>
</main>
<footer>
  φ = (1 + √5) / 2 ≈ 1.618, the golden ratio — beloved in design, architecture and typography. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/golden-ratio">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  const PHI = (1 + Math.sqrt(5)) / 2;

  function assertPos(x, what){
    if(!Number.isFinite(x)) throw new Error('enter a number');
    if(x < 0) throw new Error((what || 'value') + ' must be ≥ 0');
  }

  // Split total into two parts whose ratio is φ (major/minor = φ, major + minor = total).
  function goldenSplit(total){
    const t = Number(total);
    assertPos(t, 'length');
    const major = t / PHI;
    return { major, minor: t - major };
  }

  const goldenLarger  = x => { const v = Number(x); assertPos(v); return v * PHI; };
  const goldenSmaller = x => { const v = Number(x); assertPos(v); return v / PHI; };

  // Are two lengths in the golden ratio (within a relative tolerance)?
  function isGolden(a, b, tol = 0.01){
    const x = Math.abs(Number(a)), y = Math.abs(Number(b));
    if(!Number.isFinite(x) || !Number.isFinite(y) || x === 0 || y === 0) return false;
    const ratio = Math.max(x, y) / Math.min(x, y);
    return Math.abs(ratio - PHI) <= tol;
  }

  // Geometric sequence scaled by φ: [base, base·φ, base·φ², …].
  function goldenSequence(base, count){
    const b = Number(base);
    assertPos(b, 'base');
    const n = Number(count);
    if(!Number.isInteger(n) || n < 1) throw new Error('count must be a positive integer');
    return Array.from({ length: n }, (_, i) => b * Math.pow(PHI, i));
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('phiVal')){
    const $ = id => document.getElementById(id);
    const r2 = n => (Math.round(n * 100) / 100).toLocaleString('en-US');
    $('phiVal').innerHTML = r2(PHI) + '…<small>the golden ratio</small>';

    function renderSplit(){
      try{
        const t = $('total').value;
        const { major, minor } = goldenSplit(t);
        $('major').textContent = r2(major);
        $('minor').textContent = r2(minor);
        const majPct = Number(t) > 0 ? (major / Number(t)) * 100 : 61.8;
        $('splitBar').innerHTML =
          `<div class="maj" style="width:${majPct}%">${r2(major)}</div>` +
          `<div class="min" style="width:${100 - majPct}%">${r2(minor)}</div>`;
        const w = Math.min(Number(t) || 0, 620);
        const h = w / PHI;
        $('rect').style.width = w + 'px';
        $('rect').style.height = h + 'px';
        $('cut').style.width = (w / PHI) + 'px';
        $('errA').textContent = '';
      }catch(e){ $('major').textContent = '—'; $('minor').textContent = '—'; $('splitBar').innerHTML = ''; $('errA').textContent = e.message; }
    }
    function renderScale(){
      try{
        const v = $('val').value;
        $('larger').textContent = r2(goldenLarger(v));
        $('smaller').textContent = r2(goldenSmaller(v));
        $('seq').innerHTML = goldenSequence(v, 6).map(x => `<span>${r2(x)}</span>`).join('');
        $('errB').textContent = '';
      }catch(e){ $('larger').textContent = '—'; $('smaller').textContent = '—'; $('seq').innerHTML = ''; $('errB').textContent = e.message; }
    }
    $('total').addEventListener('input', renderSplit);
    $('val').addEventListener('input', renderScale);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('golden-theme', cur); }catch(e){}
    });
    renderSplit(); renderScale();
  }

  if(typeof module !== 'undefined') module.exports = { PHI, goldenSplit, goldenLarger, goldenSmaller, isGolden, goldenSequence };
</script>
</body>
</html>
