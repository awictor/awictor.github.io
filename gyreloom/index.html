<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gyreloom — orbit sequencer</title>
<style>
  :root{--bg:#07070d;--ink:#e8ecff;--dim:#a6acd4;--accent:#ff7a3c}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;left:14px;top:14px;display:flex;flex-direction:column;gap:9px;max-width:340px;pointer-events:none}
  #ui>*{pointer-events:auto}
  h1{font-size:15px;letter-spacing:.28em;font-weight:700;color:var(--accent);text-transform:uppercase}
  .sub{color:var(--dim);font-size:11px;max-width:300px;line-height:1.5}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{background:#141426;color:var(--ink);border:1px solid #2a2b45;border-radius:7px;
    padding:5px 9px;font:inherit;font-size:11px;cursor:pointer;transition:.13s}
  button:hover{border-color:var(--accent);color:#fff}
  button.on{background:var(--accent);color:#150a04;border-color:var(--accent);font-weight:700}
  .chip{background:#101024;border:1px solid #262744;font-size:10.5px;padding:4px 8px;border-radius:20px;color:var(--dim)}
  .chip:hover{color:var(--accent)}
  input[type=range]{width:120px;accent-color:var(--accent);cursor:pointer}
  label{color:var(--dim);font-size:11px;display:flex;align-items:center;gap:6px}
  #hint{position:fixed;right:14px;bottom:12px;color:var(--dim);font-size:11.5px;text-align:right;line-height:1.7;pointer-events:none;text-shadow:0 1px 3px #07070d}
  kbd{background:#181830;border:1px solid #2c2d4c;border-radius:4px;padding:0 5px;color:#b9beea}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--accent);color:#150a04;font-weight:700;padding:7px 16px;border-radius:20px;transition:.28s;font-size:12px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #scaleName{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <h1>Gyreloom</h1>
  <div class="sub">Beads orbit nested rings and pluck the spoke comb. Coprime counts weave a polyrhythm that only realigns after the full loop.</div>
  <div class="row">
    <button id="play">⏸ pause</button>
    <button id="wash" class="on">space wash</button>
    <button id="rnd">↺ randomize</button>
    <button id="copy">⧉ copy link</button>
  </div>
  <div class="row">
    <label>loop length <input id="tempo" type="range" min="3" max="18" step="0.5" value="8"><span id="loopVal" class="sub">8.0s</span></label>
    <button id="scaleBtn" class="chip" title="tap to change scale">scale: <span id="scaleName">minor pentatonic</span></button>
  </div>
  <div class="row" id="gallery"></div>
</div>
<div id="hint">
  <div><kbd>click ring</kbd> add / <kbd>alt+click</kbd> remove bead</div>
  <div><kbd>scroll ring</kbd> speed &nbsp; <kbd>drag spoke</kbd> re-voice</div>
  <div><kbd>right-click ring</kbd> mute &nbsp; <kbd>shift+click</kbd> solo</div>
  <div><kbd>1-4</kbd> scale &nbsp; <kbd>space</kbd> play/pause</div>
</div>
<div id="toast"></div>
<script>
"use strict";
// ---------- utilities ----------
const TAU = Math.PI * 2, mod = (a,n)=>((a%n)+n)%n;
const gcd = (a,b)=>b?gcd(b,a%b):a;
const gcdAll = a=>a.reduce((x,y)=>gcd(x,y));
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SCALES = [
  {name:"minor pentatonic", iv:[0,3,5,7,10]},
  {name:"major pentatonic", iv:[0,2,4,7,9]},
  {name:"natural minor",    iv:[0,2,3,5,7,8,10]},
  {name:"dorian",           iv:[0,2,3,5,7,9,10]},
];
const OCT_HUE = [200,168,120,45,15]; // low->high

// ---------- audio ----------
const AC = new (window.AudioContext||window.webkitAudioContext)();
const master = AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
const dry = AC.createGain(); dry.connect(master);
const send = AC.createGain(); send.gain.value=0.5;
const delay = AC.createDelay(1.0); delay.delayTime.value=0.30;
const fb = AC.createGain(); fb.gain.value=0.42;
const damp = AC.createBiquadFilter(); damp.type="lowpass"; damp.frequency.value=2600;
send.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay); damp.connect(master);
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function env(g,t,a,d,peak){g.setValueAtTime(0,t);g.linearRampToValueAtTime(peak,t+a);g.exponentialRampToValueAtTime(0.0001,t+a+d);}
function voice(freq, oct, vel){
  const t = AC.currentTime + 0.005, g = AC.createGain();
  g.connect(dry); g.connect(send);
  const V = 0.16*vel;
  if(oct<=1){ // sub sine
    const o=AC.createOscillator();o.type="sine";o.frequency.value=freq;
    const o2=AC.createOscillator();o2.type="triangle";o2.frequency.value=freq*2;const g2=AC.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(g);
    o.connect(g);env(g.gain,t,0.02,1.1,V*1.1);o.start(t);o2.start(t);o.stop(t+1.3);o2.stop(t+1.3);
  } else if(oct>=4){ // FM glassy bell
    const c=AC.createOscillator();c.type="sine";c.frequency.value=freq;
    const m=AC.createOscillator();m.type="sine";m.frequency.value=freq*2.01;
    const mg=AC.createGain();mg.gain.value=freq*3;env(mg.gain,t,0.001,0.9,freq*3);
    m.connect(mg);mg.connect(c.frequency);c.connect(g);env(g.gain,t,0.003,1.0,V*0.9);
    c.start(t);m.start(t);c.stop(t+1.2);m.stop(t+1.2);
  } else { // plucked string
    const o=AC.createOscillator();o.type="sawtooth";o.frequency.value=freq;
    const o2=AC.createOscillator();o2.type="triangle";o2.frequency.value=freq*1.005;
    const lp=AC.createBiquadFilter();lp.type="lowpass";lp.Q.value=3;
    lp.frequency.setValueAtTime(freq*7,t);lp.frequency.exponentialRampToValueAtTime(freq*1.5,t+0.28);
    o.connect(lp);o2.connect(lp);lp.connect(g);env(g.gain,t,0.004,0.5,V);
    o.start(t);o2.start(t);o.stop(t+0.6);o2.stop(t+0.6);
  }
}

// ---------- model ----------
let S = null; // {L, scale, rings:[{beads,speed,oct,mute,solo}], spokes:[{ang,deg}]}
function genFromSeed(seed){
  const r = mulberry32(seed>>>0);
  const pick = arr => arr[(r()*arr.length)|0];
  const speedPool=[1,2,3,5,7], beadPool=[2,3,4,5,6,7];
  const nR = 3+((r()*3)|0); // 3-5 rings
  const sp=[...speedPool].sort(()=>r()-0.5), bd=[...beadPool].sort(()=>r()-0.5);
  const rings=[];
  for(let i=0;i<nR;i++) rings.push({beads:bd[i%bd.length], speed:sp[i%sp.length], oct:i, mute:false, solo:false});
  const nS = 3+((r()*3)|0); // 3-5 spokes
  const spokes=[];
  for(let j=0;j<nS;j++) spokes.push({ang:mod(r()*TAU,TAU), deg:(r()*6|0)});
  return {L:8, scale:(r()*SCALES.length)|0, rings, spokes, seed:seed>>>0};
}
// guarantee gcd(speeds)===1 so the loop uses the FULL least-common-multiple period
function randomSeed(){
  for(let k=0;k<64;k++){const s=(Math.random()*1e9)|0;const g=genFromSeed(s);if(gcdAll(g.rings.map(x=>x.speed))===1)return s;}
  return 1;
}
function loopPeriod(){return S.L/gcdAll(S.rings.map(r=>r.speed));}

// ---------- hash serialization ----------
function toHash(){
  const R=S.rings.map(r=>`${r.beads}.${r.speed}.${r.oct}${r.mute?'m':''}${r.solo?'s':''}`).join("_");
  const K=S.spokes.map(k=>`${Math.round(k.ang*100)}.${k.deg}`).join("_");
  return `#L${S.L}~c${S.scale}~r${R}~k${K}~e${S.seed}`;
}
function fromHash(h){
  try{
    const fin=n=>typeof n==="number"&&isFinite(n);
    const m=Object.fromEntries(h.slice(1).split("~").map(p=>[p[0],p.slice(1)]));
    const rings=m.r.split("_").map(t=>{const[a,mk]=t.match(/^([\d.]+)([ms]*)$/).slice(1);const[b,s,o]=a.split(".").map(Number);
      return{beads:b,speed:s,oct:o,mute:mk.includes('m'),solo:mk.includes('s')};});
    const spokes=m.k.split("_").map(t=>{const[a,d]=t.split(".").map(Number);return{ang:a/100,deg:d};});
    const L=+m.L, scale=+m.c, seed=+m.e;
    // reject structurally-parseable but semantically-invalid links so the ||genFromSeed fallback fires
    if(!fin(L)||!fin(scale)||scale<0||scale>=SCALES.length) return null;
    if(!rings.length||rings.some(r=>!fin(r.beads)||r.beads<1||!fin(r.speed)||!fin(r.oct))) return null;
    if(!spokes.length||spokes.some(k=>!fin(k.ang)||!fin(k.deg))) return null;
    return{L,scale,rings,spokes,seed:fin(seed)?seed:0};
  }catch(e){return null;}
}
function syncHash(){history.replaceState(null,"",toHash());}

// ---------- setup / load ----------
function load(state){ S=state; if(!SCALES[S.scale]) S.scale=0;
  document.getElementById("tempo").value=S.L;
  document.getElementById("scaleName").textContent=SCALES[S.scale].name;
  const lv=document.getElementById("loopVal"); if(lv) lv.textContent=(+S.L).toFixed(1)+"s";
  syncHash(); }
load(fromHash(location.hash)||genFromSeed(randomSeed()));

// ---------- canvas & layout ----------
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W,H,CX,CY,MAXR,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);CX=W/2;CY=H/2;MAXR=Math.min(W,H)*0.42;}
addEventListener("resize",resize);resize();
const ringR = i => MAXR*(0.30 + 0.70*(i+1)/S.rings.length);

// ---------- transport & triggers ----------
let playing=true, clock=0, last=performance.now();
const ripples=[], flashes={}; // spoke flashes
let prevAng=[]; // per-ring unbounded angle
function anySolo(){return S.rings.some(r=>r.solo);}
function ringAudible(r){return anySolo()?r.solo:!r.mute;}

function step(dt){
  clock += dt;
  const solo=anySolo();
  const hits={}; // dedupe by pitch this frame
  S.rings.forEach((r,i)=>{
    const ang = TAU * r.speed * (clock / S.L);          // unbounded, increasing
    if(prevAng[i]===undefined) prevAng[i]=ang;
    const audible = solo?r.solo:!r.mute;
    for(const sp of S.spokes){
      for(let k=0;k<r.beads;k++){
        const target = sp.ang - k*TAU/r.beads;           // phase where bead k meets this spoke
        if(Math.floor((ang-target)/TAU) > Math.floor((prevAng[i]-target)/TAU)){
          const sc=SCALES[S.scale], deg=sp.deg%sc.length, extra=(sp.deg/sc.length|0);
          const midi = 36 + r.oct*12 + sc.iv[deg] + extra*12;
          flashes[sp.ang] = 1;
          if(audible){ const key=midi; if(!hits[key]){hits[key]=1; voice(mtof(midi), r.oct, 0.7+0.3/r.beads);
            const rr=ringR(i);
            ripples.push({x:CX+Math.cos(sp.ang)*rr, y:CY+Math.sin(sp.ang)*rr, r:6, hue:OCT_HUE[Math.min(r.oct,4)], a:1});
          }}
        }
      }
    }
    prevAng[i]=ang;
  });
  for(const a in flashes){flashes[a]-=dt*3.2; if(flashes[a]<=0) delete flashes[a];}
  for(let i=ripples.length-1;i>=0;i--){const p=ripples[i];p.r+=dt*120;p.a-=dt*1.5;if(p.a<=0)ripples.splice(i,1);}
}

// ---------- render ----------
function draw(){
  ctx.fillStyle="rgba(7,7,13,0.34)"; ctx.fillRect(0,0,W,H); // alpha-fade trails
  const solo=anySolo();
  // spokes
  for(const sp of S.spokes){
    const fl=flashes[sp.ang]||0;
    ctx.strokeStyle=`rgba(255,${120+fl*120|0},${90+fl*90|0},${0.16+fl*0.7})`;
    ctx.lineWidth=1+fl*2.5;
    const r0=MAXR*0.22, r1=MAXR*1.02;
    ctx.beginPath();ctx.moveTo(CX+Math.cos(sp.ang)*r0,CY+Math.sin(sp.ang)*r0);
    ctx.lineTo(CX+Math.cos(sp.ang)*r1,CY+Math.sin(sp.ang)*r1);ctx.stroke();
    ctx.fillStyle=`rgba(255,180,120,${0.4+fl*0.6})`;
    const hx=CX+Math.cos(sp.ang)*r1,hy=CY+Math.sin(sp.ang)*r1;
    ctx.beginPath();ctx.arc(hx,hy,3+fl*3,0,TAU);ctx.fill();
  }
  // rings + beads
  S.rings.forEach((r,i)=>{
    const rad=ringR(i), hue=OCT_HUE[Math.min(r.oct,4)];
    const audible=solo?r.solo:!r.mute;
    const dim=audible?1:0.22;
    ctx.strokeStyle=`hsla(${hue},70%,60%,${0.13*dim})`;
    ctx.lineWidth=1;ctx.beginPath();ctx.arc(CX,CY,rad,0,TAU);ctx.stroke();
    const ang=TAU*r.speed*(clock/S.L);
    for(let k=0;k<r.beads;k++){
      const a=ang+k*TAU/r.beads, x=CX+Math.cos(a)*rad, y=CY+Math.sin(a)*rad;
      // comet trail
      for(let tr=1;tr<=5;tr++){const ta=a-Math.sign(r.speed||1)*tr*0.05, tx=CX+Math.cos(ta)*rad, ty=CY+Math.sin(ta)*rad;
        ctx.fillStyle=`hsla(${hue},85%,65%,${(0.5-tr*0.09)*dim})`;ctx.beginPath();ctx.arc(tx,ty,4-tr*0.55,0,TAU);ctx.fill();}
      ctx.fillStyle=`hsla(${hue},95%,72%,${dim})`;ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();
      ctx.fillStyle=`hsla(${hue},100%,90%,${0.9*dim})`;ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();
    }
    if(!audible){ctx.fillStyle="rgba(180,190,230,0.5)";ctx.font="10px monospace";ctx.textAlign="center";
      ctx.fillText(r.mute?"muted":"", CX, CY-rad-6);}
  });
  // ripple blooms
  for(const p of ripples){ctx.strokeStyle=`hsla(${p.hue},90%,70%,${p.a*0.7})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();}
  // center hub
  ctx.fillStyle="rgba(255,122,60,0.9)";ctx.beginPath();ctx.arc(CX,CY,4,0,TAU);ctx.fill();
  // LCM phase HUD (ring around edge)
  const lp=loopPeriod(), u=mod(clock,lp)/lp, near=Math.min(u,1-u);
  const glow=near<0.03?(1-near/0.03):0;
  ctx.strokeStyle="rgba(122,128,168,0.25)";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(CX,CY,MAXR*1.12,0,TAU);ctx.stroke();
  ctx.strokeStyle=`hsla(24,100%,${60+glow*30}%,${0.85})`;ctx.lineWidth=3+glow*4;
  ctx.beginPath();ctx.arc(CX,CY,MAXR*1.12,-Math.PI/2,-Math.PI/2+u*TAU);ctx.stroke();
  ctx.fillStyle=`rgba(255,122,60,${0.5+glow*0.5})`;ctx.font="10px monospace";ctx.textAlign="center";
  ctx.fillText(`loop ${lp.toFixed(1)}s`, CX, CY+MAXR*1.12+16);
  if(glow>0.4){ctx.fillStyle=`rgba(255,180,120,${glow})`;ctx.font="700 12px monospace";ctx.fillText("↺ REALIGN", CX, CY-MAXR*1.12-8);}
  // first-run audio prompt: rings animate but AudioContext is suspended (browser autoplay policy)
  if(AC.state==="suspended"){
    const pulse=0.55+0.45*Math.sin(performance.now()/380);
    ctx.fillStyle="rgba(7,7,13,0.55)";ctx.beginPath();ctx.arc(CX,CY,MAXR*0.30,0,TAU);ctx.fill();
    ctx.textAlign="center";
    ctx.fillStyle=`rgba(255,122,60,${pulse})`;ctx.font="700 17px ui-monospace,monospace";
    ctx.fillText("▶ click to play", CX, CY-2);
    ctx.fillStyle="rgba(232,236,255,0.75)";ctx.font="11px ui-monospace,monospace";
    ctx.fillText("audio is muted until you interact", CX, CY+18);
  }
}
function frame(now){const dt=Math.min((now-last)/1000,0.05);last=now;if(playing)step(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- picking / input ----------
function pos(e){const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};}
function pickRing(x,y){const d=Math.hypot(x-CX,y-CY);let best=-1,bd=18;
  S.rings.forEach((r,i)=>{const dd=Math.abs(d-ringR(i));if(dd<bd){bd=dd;best=i;}});return best;}
function pickSpoke(x,y){const a=mod(Math.atan2(y-CY,x-CX),TAU);let best=-1,bd=0.13;
  S.spokes.forEach((s,j)=>{const dd=Math.min(mod(a-s.ang,TAU),mod(s.ang-a,TAU));if(dd<bd){bd=dd;best=j;}});return best;}

let dragSpoke=-1;
// touch gesture state: no right-click / modifier keys exist, so gestures cover mute/remove
let lpTimer=null, lpFired=false, lpRing=-1, downXY=null, pendingTap=null, lastTap=0, lastTapRing=-1;
function addBead(ri){const r=S.rings[ri];if(r.beads<9)r.beads++;syncHash();}
function removeBead(ri){const r=S.rings[ri];if(r.beads>1)r.beads--;syncHash();}
cv.addEventListener("pointerdown",e=>{
  if(AC.state==="suspended")AC.resume();
  const{x,y}=pos(e); const sk=pickSpoke(x,y);
  const d=Math.hypot(x-CX,y-CY);
  // dragging a spoke handle takes priority near the outer edge
  if(sk>=0 && d>MAXR*0.5){dragSpoke=sk;cv.setPointerCapture(e.pointerId);return;}
  const ri=pickRing(x,y); if(ri<0)return;
  const r=S.rings[ri];
  if(e.pointerType==="touch"){
    // touch: long-press = mute, double-tap = remove, single tap = add (resolved on pointerup)
    lpFired=false; lpRing=ri; downXY={x,y};
    clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{lpFired=true;r.mute=!r.mute;syncHash();toast(r.mute?"muted":"unmuted");},500);
    return;
  }
  // mouse / pen
  if(e.shiftKey){r.solo=!r.solo;}
  else if(e.altKey||e.metaKey){if(r.beads>1)r.beads--;}
  else {if(r.beads<9)r.beads++;}
  syncHash();
});
cv.addEventListener("pointermove",e=>{
  if(dragSpoke>=0){const{x,y}=pos(e);S.spokes[dragSpoke].ang=mod(Math.atan2(y-CY,x-CX),TAU);return;}
  // a moving finger is not a long-press
  if(lpTimer&&downXY){const{x,y}=pos(e);if(Math.hypot(x-downXY.x,y-downXY.y)>12){clearTimeout(lpTimer);lpTimer=null;}}
});
cv.addEventListener("pointerup",e=>{
  if(dragSpoke>=0){dragSpoke=-1;syncHash();return;}
  if(e.pointerType!=="touch")return;
  clearTimeout(lpTimer);lpTimer=null;
  if(lpFired||lpRing<0)return; // long-press already handled the gesture
  const ri=lpRing, now=performance.now();
  if(pendingTap&&now-lastTap<300&&lastTapRing===ri){ // double tap = remove
    clearTimeout(pendingTap);pendingTap=null;lastTap=0;removeBead(ri);
  } else { // single tap = add, deferred so a second tap can cancel it
    lastTap=now;lastTapRing=ri;
    pendingTap=setTimeout(()=>{pendingTap=null;addBead(ri);},300);
  }
});
cv.addEventListener("contextmenu",e=>{e.preventDefault();const{x,y}=pos(e);const ri=pickRing(x,y);
  if(ri>=0){S.rings[ri].mute=!S.rings[ri].mute;syncHash();}});
cv.addEventListener("wheel",e=>{const{x,y}=pos(e);const ri=pickRing(x,y);if(ri<0)return;e.preventDefault();
  const r=S.rings[ri];r.speed=Math.max(1,Math.min(9,r.speed+(e.deltaY<0?1:-1)));
  prevAng[ri]=undefined; // re-seed phase so the new speed doesn't fire a spurious out-of-time note
  syncHash();},{passive:false});

addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();togglePlay();}
  else if(/^Digit[1-4]$/.test(e.code)){S.scale=+e.code.slice(5)-1;
    document.getElementById("scaleName").textContent=SCALES[S.scale].name;syncHash();}
});

// ---------- UI wiring ----------
const $=id=>document.getElementById(id);
// label reflects the TRUE audible state: while the AudioContext is suspended nothing is heard yet
function refreshPlay(){$("play").textContent=AC.state==="suspended"?"▶ click to start":(playing?"⏸ pause":"▶ play");}
function togglePlay(){playing=!playing;if(playing&&AC.state==="suspended")AC.resume();refreshPlay();}
AC.onstatechange=refreshPlay; refreshPlay();
$("play").onclick=togglePlay;
$("wash").onclick=function(){const on=!this.classList.contains("on");this.classList.toggle("on",on);
  send.gain.setTargetAtTime(on?0.5:0.0,AC.currentTime,0.05);fb.gain.setTargetAtTime(on?0.42:0.0,AC.currentTime,0.05);};
$("tempo").oninput=function(){S.L=+this.value;$("loopVal").textContent=S.L.toFixed(1)+"s";
  prevAng=[];syncHash();}; // reset phase so a loop-length change doesn't fire spurious out-of-time notes
$("scaleBtn").onclick=()=>{S.scale=(S.scale+1)%SCALES.length;
  $("scaleName").textContent=SCALES[S.scale].name;syncHash();toast(SCALES[S.scale].name);};
$("rnd").onclick=()=>{load(genFromSeed(randomSeed()));prevAng=[];toast("new coprime pattern");};
$("copy").onclick=()=>{syncHash();const u=location.href;
  // optional chaining would short-circuit the whole .then chain (and its fallback) where clipboard is unavailable
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(()=>toast("link copied"),()=>toast("copy failed — url is in the address bar"));
  } else { toast("copy failed — url is in the address bar"); }};
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1400);}
// curated gallery
const PRESETS=[["drift",20240711],["cathedral",1337],["glass rain",90210],["heartbeat",424242],["spindrift",70707],["prism",8675309]];
const gal=$("gallery");
PRESETS.forEach(([name,seed])=>{const b=document.createElement("button");b.className="chip";b.textContent=name;
  b.onclick=()=>{load(genFromSeed(seed));prevAng=[];toast(name);};gal.appendChild(b);});
addEventListener("hashchange",()=>{const s=fromHash(location.hash);if(s&&toHash()!==location.hash){load(s);prevAng=[];}});
// resume audio on first gesture (autoplay policy)
addEventListener("pointerdown",()=>{if(AC.state==="suspended")AC.resume();},{once:true});
// swap the hint copy for touch devices, where right-click / scroll / number keys don't exist
if(window.matchMedia&&matchMedia("(pointer:coarse)").matches){
  $("hint").innerHTML="<div><kbd>tap ring</kbd> add / <kbd>double-tap</kbd> remove bead</div>"
    +"<div><kbd>long-press ring</kbd> mute &nbsp; <kbd>drag spoke</kbd> re-voice</div>"
    +"<div><kbd>scale</kbd> chip cycles scales</div>";
}
</script>
