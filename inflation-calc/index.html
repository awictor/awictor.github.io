<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InflationCalc — Inflation &amp; Purchasing Power Calculator</title>
<meta name="description" content="See what an amount will cost in the future at a given inflation rate, and what a future amount is worth in today's money. 100% offline, no signup." />
<meta name="theme-color" content="#a16207" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="InflationCalc — Inflation Calculator" />
<meta property="og:description" content="Future cost and today's purchasing power at any inflation rate. Offline." />
<meta property="og:url" content="https://awictor.github.io/inflation-calc/" />
<link rel="canonical" href="https://awictor.github.io/inflation-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a16207'/%3E%3Cpath d='M18 44 L28 34 L36 40 L48 24' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#faf6ec; --ink:#241c08; --accent:#a16207; --accent-d:#854d0e;
    --card:#fff; --line:#ece0c8; --muted:#786646; --field:#fff;
    --shadow:0 1px 2px rgba(36,28,8,.05),0 8px 24px rgba(36,28,8,.07); }
  [data-theme="dark"]{ --bg:#150f05; --ink:#f4ecdd; --accent:#eab308; --accent-d:#facc15;
    --card:#1d160a; --line:#332918; --muted:#a99878; --field:#150f05;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  .ig{position:relative}
  .ig .pre{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  input[type=number]{width:150px;padding:11px 12px 11px 24px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(161,98,7,.15)}
  .out .li{padding:12px 0;border-bottom:1px dashed var(--line)}
  .out .li:last-child{border-bottom:0}
  .out .k{font-size:13px;color:var(--muted)}
  .out .v{font-size:24px;font-weight:700;color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("inflation.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Inflation</span>Calc</h1>
  <p>What money will cost — and be worth — over time. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Amount today</label><div class="ig"><span class="pre">$</span><input id="amount" type="number" step="100" value="1000"></div></div>
    <div class="row"><label>Annual inflation</label><div class="ig"><span class="pre">%</span><input id="rate" type="number" step="0.1" value="3" style="padding-left:24px"></div></div>
    <div class="row"><label>Years</label><div class="ig"><span class="pre">#</span><input id="years" type="number" step="1" value="10"></div></div>
  </section>

  <section class="card out">
    <div class="li"><div class="k" id="k1"></div><div class="v" id="future">—</div></div>
    <div class="li"><div class="k" id="k2"></div><div class="v" id="power">—</div></div>
  </section>
</div>

<footer>
  <b>InflationCalc</b> · offline inflation calculator · <a href="https://github.com/awictor/inflation-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Compounded annually. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const money=n=>"$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// --- Pure inflation math ---
function futureValue(amount,rate,years){ return amount*Math.pow(1+rate/100,years); }
function purchasingPower(amount,rate,years){ return amount/Math.pow(1+rate/100,years); }

// --- UI ---
function render(){
  const a=num("amount"), r=num("rate"), y=num("years");
  try{["amount","rate","years"].forEach(k=>localStorage.setItem("inflation."+k,$(k).value));}catch(e){}
  $("k1").textContent=`What costs ${money(a)} today will cost in ${y} years:`;
  $("future").textContent=money(futureValue(a,r,y));
  $("k2").textContent=`${money(a)} in ${y} years is worth today:`;
  $("power").textContent=money(purchasingPower(a,r,y));
}
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("inflation.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["amount","rate","years"].forEach(k=>{const v=localStorage.getItem("inflation."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={futureValue,purchasingPower};
</script>
</body>
</html>
