<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WaterIntake — Daily Water Intake Calculator</title>
<meta name="description" content="Estimate how much water to drink each day from your body weight and exercise, in mL, litres, cups, and ounces. 100% offline, no signup." />
<meta name="theme-color" content="#0284c7" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="WaterIntake — Daily Water Intake Calculator" />
<meta property="og:description" content="Daily water target from weight + exercise, in mL/L/cups/oz. Offline." />
<meta property="og:url" content="https://awictor.github.io/water-intake/" />
<link rel="canonical" href="https://awictor.github.io/water-intake/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230284c7'/%3E%3Cpath d='M32 14 C24 26 20 32 20 38 a12 12 0 0 0 24 0 C44 32 40 26 32 14 Z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eff7fb; --ink:#0a1e28; --accent:#0284c7; --accent-d:#0369a1;
    --card:#fff; --line:#d3e6ee; --muted:#4f6773; --field:#fff;
    --shadow:0 1px 2px rgba(10,30,40,.05),0 8px 24px rgba(10,30,40,.07); }
  [data-theme="dark"]{ --bg:#06141c; --ink:#e6f1f7; --accent:#38bdf8; --accent-d:#7dd3fc;
    --card:#0f1e28; --line:#1e3441; --muted:#8aa5b1; --field:#06141c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  input[type=number]{width:110px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
  .result{text-align:center}
  .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
  .stat .v{font-size:18px;font-weight:700} .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("water.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Water</span>Intake</h1>
  <p>How much water to drink each day. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Body weight</label><div><input id="weight" type="number" value="70"> <select id="unit"><option>kg</option><option>lb</option></select></div></div>
    <div class="row"><label>Exercise (minutes/day)</label><input id="exercise" type="number" value="30"></div>
  </section>

  <section class="card result">
    <div style="color:var(--muted);font-size:14px">Aim for about</div>
    <div class="big" id="litres">—</div>
    <div class="grid">
      <div class="stat"><div class="v" id="ml">—</div><div class="k">mL</div></div>
      <div class="stat"><div class="v" id="cups">—</div><div class="k">cups</div></div>
      <div class="stat"><div class="v" id="oz">—</div><div class="k">fl oz</div></div>
    </div>
  </section>
</div>

<footer>
  <b>WaterIntake</b> · offline water intake calculator · <a href="https://github.com/awictor/water-intake">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Rough guideline (~33 mL/kg + exercise); needs vary. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};

// --- Pure water math ---
function dailyWaterMl(kg, exerciseMin){ return Math.max(0,kg)*33 + (Math.max(0,exerciseMin)/30)*350; }
function mlToLitres(ml){ return ml/1000; }
function mlToCups(ml){ return ml/240; }         // US cup
function mlToOz(ml){ return ml/29.5735295625; } // US fl oz

// --- UI ---
function render(){
  const kg = $("unit").value==="lb" ? num("weight")*0.45359237 : num("weight");
  const ml=dailyWaterMl(kg,num("exercise"));
  try{["weight","unit","exercise"].forEach(k=>localStorage.setItem("water."+k,$(k).value));}catch(e){}
  $("litres").textContent=(Math.round(mlToLitres(ml)*100)/100)+" L";
  $("ml").textContent=Math.round(ml).toLocaleString();
  $("cups").textContent=Math.round(mlToCups(ml)*10)/10;
  $("oz").textContent=Math.round(mlToOz(ml));
}
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("water.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["weight","unit","exercise"].forEach(k=>{const v=localStorage.getItem("water."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={dailyWaterMl,mlToLitres,mlToCups,mlToOz};
</script>
</body>
</html>
