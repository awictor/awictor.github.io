<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Diff — structural compare of two JSON values</title>
<meta name="description" content="Compare two JSON documents and see exactly which paths were added, removed, or changed. Structural (not text) diff for APIs and configs. Offline, no tracking.">
<style>
  :root{
    --c:#0891b2;
    --bg:#f2f8fa; --card:#ffffff; --fg:#13212a; --muted:#5a6b74;
    --line:#dcebef; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.05);
    --radius:14px;
    --add:#16a34a; --rem:#dc2626; --chg:#ca8a04;
  }
  [data-theme="dark"]{
    --bg:#0d1519; --card:#141f25; --fg:#e8f3f6; --muted:#8ea3ac;
    --line:#22333a; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
    --add:#4ade80; --rem:#f87171; --chg:#fcd34d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{max-width:960px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;
    font-size:22px;font-weight:800;color:#fff;flex:0 0 auto;font-family:ui-monospace,monospace}
  h1{font-size:1.4rem;margin:0}
  header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
  .theme{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem}
  main{max-width:960px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.cols{grid-template-columns:1fr}}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;padding:12px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:180px;resize:vertical;white-space:pre;overflow-wrap:normal}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:.9rem}
  .summary .b{font-weight:700;font-variant-numeric:tabular-nums}
  .add{color:var(--add)} .rem{color:var(--rem)} .chg{color:var(--chg)}
  .diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
  .row{display:flex;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:baseline}
  .row .tag{flex:0 0 auto;width:16px;font-weight:800}
  .row .path{flex:0 0 auto;color:var(--fg);font-weight:600}
  .row .val{color:var(--muted);word-break:break-all}
  .err{color:var(--rem);font-size:.85rem;margin-top:6px;min-height:18px}
  .ok{color:var(--add)}
  h2{font-size:1rem;margin:0 0 10px}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:26px}
  .foot a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="logo">Δ</div>
  <div>
    <h1>JSON Diff</h1>
    <p>Structural compare — what changed, by path</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="card">
    <div class="cols">
      <div>
        <label for="a">JSON A (original)</label>
        <textarea id="a" spellcheck="false">{
  "name": "Widget",
  "price": 9.99,
  "tags": ["new", "sale"],
  "stock": { "warehouse": 40, "store": 5 }
}</textarea>
        <div class="err" id="errA"></div>
      </div>
      <div>
        <label for="b">JSON B (new)</label>
        <textarea id="b" spellcheck="false">{
  "name": "Widget",
  "price": 12.50,
  "tags": ["new", "clearance"],
  "stock": { "warehouse": 40 },
  "sku": "W-100"
}</textarea>
        <div class="err" id="errB"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="summary">
      <span class="add">+ added <span class="b" id="nAdd">0</span></span>
      <span class="rem">− removed <span class="b" id="nRem">0</span></span>
      <span class="chg">~ changed <span class="b" id="nChg">0</span></span>
    </div>
    <div class="diff" id="diff"></div>
  </div>

  <p class="foot">100% offline · nothing leaves your browser · part of the
    <a href="https://awictor.github.io/toolkit/">Toolkit</a></p>
</main>

<script>
  function typeOf(v){
    if(v === null) return 'null';
    if(Array.isArray(v)) return 'array';
    return typeof v;
  }
  function deepEqual(a, b){
    if(a === b) return true;
    var ta = typeOf(a), tb = typeOf(b);
    if(ta !== tb) return false;
    if(ta === 'array'){
      if(a.length !== b.length) return false;
      return a.every(function(x, i){ return deepEqual(x, b[i]); });
    }
    if(ta === 'object'){
      var ka = Object.keys(a), kb = Object.keys(b);
      if(ka.length !== kb.length) return false;
      return ka.every(function(k){ return Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]); });
    }
    return false;
  }
  function diffJson(a, b, path, out){
    path = path || '';
    out = out || [];
    var ta = typeOf(a), tb = typeOf(b);
    if(ta === 'object' && tb === 'object'){
      var keys = [];
      Object.keys(a).forEach(function(k){ keys.push(k); });
      Object.keys(b).forEach(function(k){ if(keys.indexOf(k) < 0) keys.push(k); });
      keys.forEach(function(k){
        var p = path ? path + '.' + k : k;
        var ina = Object.prototype.hasOwnProperty.call(a, k);
        var inb = Object.prototype.hasOwnProperty.call(b, k);
        if(!ina) out.push({ path: p, type: 'added', to: b[k] });
        else if(!inb) out.push({ path: p, type: 'removed', from: a[k] });
        else diffJson(a[k], b[k], p, out);
      });
    } else if(ta === 'array' && tb === 'array'){
      var len = Math.max(a.length, b.length);
      for(var i = 0; i < len; i++){
        var pi = path + '[' + i + ']';
        if(i >= a.length) out.push({ path: pi, type: 'added', to: b[i] });
        else if(i >= b.length) out.push({ path: pi, type: 'removed', from: a[i] });
        else diffJson(a[i], b[i], pi, out);
      }
    } else if(!deepEqual(a, b)){
      out.push({ path: path || '(root)', type: 'changed', from: a, to: b });
    }
    return out;
  }
  function summarize(diffs){
    var s = { added: 0, removed: 0, changed: 0 };
    diffs.forEach(function(d){ s[d.type]++; });
    return s;
  }

  if(typeof module !== 'undefined') module.exports = { typeOf:typeOf, deepEqual:deepEqual, diffJson:diffJson, summarize:summarize };

  // ---- UI ----
  if(typeof document !== 'undefined'){
    var a=document.getElementById('a'), b=document.getElementById('b');
    var errA=document.getElementById('errA'), errB=document.getElementById('errB'), diffEl=document.getElementById('diff');
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function val(v){ return v === undefined ? '' : JSON.stringify(v); }
    function render(){
      var pa, pb, ok = true;
      try{ pa = JSON.parse(a.value); errA.textContent=''; }catch(e){ errA.textContent='✗ ' + e.message; ok=false; }
      try{ pb = JSON.parse(b.value); errB.textContent=''; }catch(e){ errB.textContent='✗ ' + e.message; ok=false; }
      if(!ok){ diffEl.innerHTML=''; return; }
      var diffs = diffJson(pa, pb);
      var s = summarize(diffs);
      document.getElementById('nAdd').textContent = s.added;
      document.getElementById('nRem').textContent = s.removed;
      document.getElementById('nChg').textContent = s.changed;
      if(diffs.length === 0){ diffEl.innerHTML = '<div class="ok">✓ The two documents are identical.</div>'; return; }
      var sym = { added:'+', removed:'−', changed:'~' }, cls = { added:'add', removed:'rem', changed:'chg' };
      diffEl.innerHTML = diffs.map(function(d){
        var detail = d.type === 'changed'
          ? esc(val(d.from)) + ' → ' + esc(val(d.to))
          : esc(val(d.type === 'added' ? d.to : d.from));
        return '<div class="row"><span class="tag ' + cls[d.type] + '">' + sym[d.type] + '</span>'
          + '<span class="path">' + esc(d.path) + '</span><span class="val">' + detail + '</span></div>';
      }).join('');
    }
    a.addEventListener('input', render);
    b.addEventListener('input', render);

    var root=document.documentElement, tb=document.getElementById('theme');
    function setTheme(t){ root.setAttribute('data-theme',t); tb.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('jsondiff-theme',t);}catch(e){} }
    var saved; try{ saved=localStorage.getItem('jsondiff-theme'); }catch(e){}
    setTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    tb.addEventListener('click', function(){ setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });

    render();
  }
</script>
</body>
</html>
