<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chainbloom</title>
<style>
  :root{ --ink:#eaf2ff; --dim:#7f8aa3; --accent:#5ad1ff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#05060c; }
  body{ font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #stage{ position:fixed; inset:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* HUD */
  #hud{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:18px;
        padding:14px 18px; pointer-events:none; z-index:5; text-shadow:0 1px 8px #000; }
  .stat{ display:flex; flex-direction:column; line-height:1.05; }
  .stat b{ font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  .stat span{ font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--dim); }
  #chainStat b{ color:var(--accent); }
  .spacer{ flex:1; }
  #brand{ position:fixed; bottom:12px; left:18px; z-index:5; pointer-events:none;
          font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#3d4661; text-shadow:0 1px 6px #000; }
  /* buttons */
  .btns{ position:fixed; top:12px; right:14px; z-index:6; display:flex; gap:8px; }
  button{ pointer-events:auto; font:inherit; font-size:11px; letter-spacing:.6px; color:var(--ink);
          background:rgba(20,26,44,.72); border:1px solid rgba(120,150,210,.28); border-radius:8px;
          padding:8px 12px; cursor:pointer; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:.15s; }
  button:hover{ border-color:var(--accent); color:var(--accent); background:rgba(30,40,66,.85); }
  button:active{ transform:translateY(1px); }
  #toast{ position:fixed; bottom:44px; left:50%; transform:translateX(-50%) translateY(20px);
          z-index:8; background:rgba(20,26,44,.92); border:1px solid rgba(120,150,210,.3);
          padding:9px 16px; border-radius:9px; font-size:12px; opacity:0; transition:.3s; pointer-events:none;
          -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  #toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  /* overlay for round result / share card */
  #ov{ position:fixed; inset:0; z-index:7; display:none; flex-direction:column; align-items:center;
       justify-content:center; gap:18px; background:rgba(4,6,14,.62);
       -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #ov.on{ display:flex; }
  #card{ background:linear-gradient(160deg,#0b1022,#070912); border:1px solid rgba(120,150,210,.25);
         border-radius:16px; padding:26px 30px 22px; width:min(88vw,340px); text-align:center;
         box-shadow:0 24px 80px rgba(0,0,0,.6); }
  #card h2{ font-size:15px; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  #card h2.win{ color:#7CFFB0; } #card h2.miss{ color:#ff8f9a; }
  #bigscore{ font-size:66px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;
             margin:6px 0 2px; color:var(--accent); text-shadow:0 0 26px rgba(90,209,255,.5); }
  #cardsub{ color:var(--dim); font-size:12px; margin-bottom:16px; }
  #replayCv{ width:100%; height:120px; border-radius:10px; background:#05060c;
             border:1px solid rgba(120,150,210,.16); margin-bottom:16px; display:block; }
  #card .row{ display:flex; gap:8px; }
  #card .row button{ flex:1; justify-content:center; }
  #card .primary{ background:var(--accent); color:#05060c; border-color:var(--accent); font-weight:700; }
  #card .primary:hover{ color:#05060c; filter:brightness(1.08); }
  #hint{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:4;
         text-align:center; color:#9fb0d6; text-shadow:0 2px 14px #000; pointer-events:none; transition:.4s; }
  #hint b{ display:block; font-size:26px; font-weight:700; letter-spacing:.5px; margin-bottom:6px; color:var(--ink); }
  #hint.hide{ opacity:0; }
  #legend{ display:block; margin-top:14px; font-size:11px; letter-spacing:.4px; color:var(--dim); }
  #legend i{ font-style:normal; color:var(--ink); }
  /* narrow widths: keep the New seed / Share buttons clear of the Best-board stat */
  @media (max-width:520px){ #hud{ padding-right:132px; } }
  @media (prefers-reduced-motion:reduce){ #ov,#toast,button{ transition:none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud">
  <div class="stat"><b id="roundV">1</b><span>Round</span></div>
  <div class="stat" id="chainStat"><b id="chainV">0<small style="color:var(--dim);font-size:14px;font-weight:400"> / <span id="targetV">3</span></small></b><span>Chain</span></div>
  <div class="spacer"></div>
  <div class="stat" style="text-align:right"><b id="bestV">0</b><span>Best board</span></div>
</div>
<div class="btns">
  <button id="newBtn" title="Random new board">New seed</button>
  <button id="shareBtn" title="Copy this board's link">Share</button>
</div>
<div id="hint"><b>Chainbloom</b>Click once to detonate a bloom.<br>Ignite dots to chain a cascade of light &amp; sound.
  <span id="legend"><i>&#10040;</i> mega-bloom &nbsp;·&nbsp; <i>&#9672;</i> splits &nbsp;·&nbsp; <i>&#9680;</i> slow-mo</span></div>
<div id="brand">CHAINBLOOM · one click, one cascade</div>
<div id="toast"></div>
<div id="ov"><div id="card">
  <h2 id="cardTitle"></h2>
  <div id="bigscore">0</div>
  <div id="cardsub"></div>
  <canvas id="replayCv"></canvas>
  <div class="row" style="margin-bottom:8px">
    <button id="copyBtn">Copy board link</button>
    <button id="snapBtn">Download snapshot</button>
  </div>
  <div class="row"><button id="nextBtn" class="primary"></button></div>
</div></div>

<script>
"use strict";
// ---------- seeded PRNG (mulberry32) ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- hash: seed encodes the whole board ----------
function readSeed(){ const h=location.hash.slice(1); const n=parseInt(h,36);
  return (h && !isNaN(n)) ? (n>>>0) : (Math.random()*4294967296>>>0); }
function writeSeed(s){ history.replaceState(null,"", "#"+s.toString(36)); }
let SEED=readSeed(); writeSeed(SEED);

// ---------- canvas ----------
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
const REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function resize(){ const oldW=W, oldH=H;
  DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  // rescale in-flight pixel-space objects so a mid-cascade resize doesn't desync geometry
  if(oldW>0 && oldH>0 && (oldW!==W||oldH!==H)){ const rx=W/oldW, ry=H/oldH;
    for(const b of blooms){ b.x*=rx; b.y*=ry; b.r*=rx; b.max*=rx; }
    for(const p of pops){ p.x*=rx; p.y*=ry; }
    for(const f of floats){ f.x*=rx; f.y*=ry; }
    for(const t of trail){ t.x*=rx; t.y*=ry; } } }
addEventListener("resize",resize); resize();

// ---------- audio: pentatonic instrument + delay + drone ----------
const A={ctx:null,master:null,delay:null,drone:null};
const PENTA=[0,3,5,7,10]; // minor pentatonic semitone offsets
function initAudio(){ if(A.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=new AC(); A.ctx=c;
  const master=c.createGain(); master.gain.value=0.5; master.connect(c.destination); A.master=master;
  // feedback-delay "reverb-ish" send
  const dl=c.createDelay(1.0); dl.delayTime.value=0.26;
  const fb=c.createGain(); fb.gain.value=0.34;
  const wet=c.createGain(); wet.gain.value=0.32;
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
  dl.connect(fb); fb.connect(dl); dl.connect(lp); lp.connect(wet); wet.connect(master);
  A.delay=dl;
  // ambient drone pad (two detuned oscillators, slow filter sweep)
  const dg=c.createGain(); dg.gain.value=0.0; dg.connect(master);
  const df=c.createBiquadFilter(); df.type="lowpass"; df.frequency.value=420; df.Q.value=6; df.connect(dg);
  [55,55.4,82.5].forEach((f,i)=>{ const o=c.createOscillator(); o.type=i<2?"sawtooth":"sine";
    o.frequency.value=f; const g=c.createGain(); g.gain.value=i<2?0.5:0.32; o.connect(g); g.connect(df); o.start(); });
  const lfo=c.createOscillator(); lfo.frequency.value=0.05; const lg=c.createGain(); lg.gain.value=260;
  lfo.connect(lg); lg.connect(df.frequency); lfo.start();
  A.drone={gain:dg}; }
function droneLevel(v){ if(A.drone) A.drone.gain.gain.setTargetAtTime(v,A.ctx.currentTime,0.6); }
function chime(depth,vol){ if(!A.ctx) return; const c=A.ctx, t=c.currentTime;
  const scaleLen=PENTA.length; const oct=Math.min(4,Math.floor(depth/scaleLen)); // cap rise so deep pops stay audible
  const semi=PENTA[depth%scaleLen]+12*oct;
  const freq=220*Math.pow(2,semi/12); // root A3 rising by depth
  const o=c.createOscillator(); o.type="triangle"; o.frequency.value=freq;
  const o2=c.createOscillator(); o2.type="sine"; o2.frequency.value=freq*2.005;
  const g=c.createGain(); const peak=Math.min(0.42,vol);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  const g2=c.createGain(); g2.gain.value=0.35; o2.connect(g2); g2.connect(g);
  o.connect(g); g.connect(A.master); if(A.delay) g.connect(A.delay);
  o.start(t); o2.start(t); o.stop(t+0.6); o2.stop(t+0.6); }

// ---------- board generation from seed ----------
const HUES=[190,315,45,265,140,20];
const KIND={NORMAL:0,BOMB:1,PRISM:2,SLOW:3};
let dots=[], round=1, target=3, best=0, bestKey="";
let phase="ready"; // ready -> live -> settled
let blooms=[], pops=[], floats=[], shake=0, slowmo=1, slowT=0;
let chainCount=0, chainMax=0, comboShown=0;
let trail=[]; // for ghost replay

function bestKeyFor(s){ return "chainbloom.best."+s; }
function genBoard(){
  const rnd=mulberry32(SEED ^ (round*0x9e3779b1));
  dots=[]; const count=26+Math.min(round*3,34);
  for(let i=0;i<count;i++){
    let k=KIND.NORMAL; const r=rnd();
    if(r>0.93) k=KIND.BOMB; else if(r>0.85) k=KIND.PRISM; else if(r>0.78) k=KIND.SLOW;
    const speed=(0.12+rnd()*0.55);
    const ang=rnd()*Math.PI*2;
    dots.push({ x:0.08+rnd()*0.84, y:0.12+rnd()*0.80, // normalized
      vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      hue:HUES[(rnd()*HUES.length)|0], kind:k, r:k===KIND.BOMB?11:8, lit:false, ph:rnd()*6.28 }); }
  target=Math.min(dots.length, 3+Math.floor(round*1.6));
  blooms=[]; pops=[]; floats=[]; trail=[]; chainCount=0; chainMax=0; phase="ready";
  slowmo=1; slowT=0; shake=0; // clear time-decaying state so a new board never starts in slow-mo/shake
  bestKey=bestKeyFor(SEED); best=+(localStorage.getItem(bestKey)||0);
  hint.classList.remove("hide"); // restore the "ready to click" cue on every new/next board
  updateHUD();
}
function updateHUD(){
  roundV.textContent=round; targetV.textContent=target;
  chainV.firstChild.textContent=chainCount; bestV.textContent=best;
}

// ---------- bloom lifecycle ----------
const BLOOM_LIFE=1.15;
function spawnBloom(x,y,depth,hue,kind){
  const big=kind===KIND.BOMB;
  blooms.push({ x,y, t:0, life:BLOOM_LIFE, max:big?150:96, depth, hue,
    r:0, active:true }); // x,y in px
  trail.push({x,y,depth,hue,t:0});
  chainCount++; if(chainCount>chainMax) chainMax=chainCount;
  const vol=0.34*Math.pow(0.965,depth)+0.06;
  chime(depth,vol);
  // juice: depth number popup
  floats.push({x,y,txt:depth>0?"+"+depth:"", hue, t:0, life:0.9, vy:-26});
  // screen shake scales with cascade energy (suppressed for reduced-motion users)
  if(!REDUCE) shake=Math.min(16, shake + (big?4.5:1.6) + depth*0.15);
  if(kind===KIND.PRISM){ // splits into several child blooms
    for(let i=0;i<4;i++){ const a=(i/4)*6.283+Math.random();
      blooms.push({ x:x+Math.cos(a)*34, y:y+Math.sin(a)*34, t:0, life:BLOOM_LIFE*0.8,
        max:70, depth:depth+1, hue:(hue+40)%360, r:0, active:true }); } }
  if(kind===KIND.SLOW){ slowmo=0.32; slowT=1.4; }
  updateHUD();
}
function detonate(px,py){
  initAudio(); if(A.ctx&&A.ctx.state==="suspended") A.ctx.resume();
  droneLevel(0.12);
  phase="live"; hint.classList.add("hide");
  spawnBloom(px,py,0,205,KIND.NORMAL);
}

// ---------- main loop ----------
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  if(slowT>0){ slowT-=dt; if(slowT<=0){slowmo=1;} }
  const sdt=dt*slowmo;
  // move dots
  for(const d of dots){ if(d.lit) continue;
    d.x+=d.vx*sdt*0.06; d.y+=d.vy*sdt*0.06; d.ph+=dt*2;
    if(d.x<0.04||d.x>0.96) d.vx*=-1; if(d.y<0.06||d.y>0.96) d.vy*=-1;
    d.x=Math.max(0.04,Math.min(0.96,d.x)); d.y=Math.max(0.06,Math.min(0.96,d.y)); }
  // blooms grow then contract; check collisions
  let anyActive=false;
  for(const b of blooms){ b.t+=sdt; const f=b.t/b.life;
    b.r = f<0.55 ? (f/0.55)*b.max : b.max*(1-(f-0.55)/0.45);
    if(b.r<0) b.r=0; if(b.t<b.life){ anyActive=true;
      for(const d of dots){ if(d.lit) continue;
        const dx=d.x*W-b.x, dy=d.y*H-b.y; if(dx*dx+dy*dy < (b.r+d.r)*(b.r+d.r)){
          d.lit=true; spawnBloom(d.x*W,d.y*H,b.depth+1,d.hue,d.kind);
          pops.push({x:d.x*W,y:d.y*H,hue:d.hue,t:0}); } } } }
  blooms=blooms.filter(b=>b.t<b.life);
  pops=pops.filter(p=>(p.t+=dt)<0.5);
  floats=floats.filter(f=>(f.t+=dt)<f.life);
  if(shake>0) shake=Math.max(0,shake-dt*38);
  // end of round detection
  if(phase==="live" && !anyActive && blooms.length===0){ endRound(); }
  render();
  requestAnimationFrame(frame);
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // background gradient
  const bg=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.75);
  bg.addColorStop(0,"#0a1024"); bg.addColorStop(1,"#04050b");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
  ctx.globalCompositeOperation="lighter";
  // dots
  for(const d of dots){ if(d.lit) continue;
    const px=d.x*W, py=d.y*H, pulse=1+Math.sin(d.ph)*(REDUCE?0.03:0.12);
    drawGlow(px,py,d.r*pulse,d.hue,0.9);
    if(d.kind!==KIND.NORMAL) drawMark(px,py,d.kind,d.hue); }
  // blooms (rings)
  for(const b of blooms){ const a=Math.max(0,1-b.t/b.life);
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283);
    ctx.lineWidth=3+b.depth*0.25; ctx.strokeStyle=`hsla(${b.hue},95%,65%,${0.85*a})`; ctx.stroke();
    drawGlow(b.x,b.y,10+b.depth*1.2,b.hue,0.6*a); }
  // pop bursts
  for(const p of pops){ const a=1-p.t/0.5; drawGlow(p.x,p.y,4+p.t*80,p.hue,a*0.8); }
  ctx.globalCompositeOperation="source-over";
  // floating depth numbers
  ctx.textAlign="center"; ctx.font="700 18px -apple-system,Segoe UI,sans-serif";
  for(const f of floats){ const a=1-f.t/f.life; if(!f.txt) continue;
    ctx.fillStyle=`hsla(${f.hue},90%,72%,${a})`;
    ctx.fillText(f.txt, f.x, f.y + f.vy*f.t); }
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function drawGlow(x,y,r,hue,alpha){ const g=ctx.createRadialGradient(x,y,0,x,y,r*2.4);
  g.addColorStop(0,`hsla(${hue},95%,70%,${alpha})`);
  g.addColorStop(0.4,`hsla(${hue},90%,55%,${alpha*0.4})`);
  g.addColorStop(1,`hsla(${hue},90%,50%,0)`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*2.4,0,6.283); ctx.fill(); }
function drawMark(x,y,kind,hue){ ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="rgba(255,255,255,.92)"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font="700 11px -apple-system,Segoe UI,sans-serif";
  ctx.fillText(kind===KIND.BOMB?"✸":kind===KIND.PRISM?"◈":"◐", x, y+0.5);
  ctx.globalCompositeOperation="lighter"; ctx.textBaseline="alphabetic"; }

// ---------- round end + share card ----------
function endRound(){ phase="settled"; droneLevel(0.0);
  const win=chainMax>=target;
  if(chainMax>best){ best=chainMax; localStorage.setItem(bestKey,best); }
  updateHUD();
  cardTitle.textContent = win? "Round cleared" : "Chain too short";
  cardTitle.className = win?"win":"miss";
  cardsub.textContent = win? `Target ${target} beaten — advancing to round ${round+1}`
                            : `Reached ${chainMax} of ${target}. Try the board again.`;
  nextBtn.textContent = win? "Next round →" : "Retry board";
  ov.classList.add("on");
  // count-up combo tally
  comboShown=0; const goal=chainMax, t0=performance.now();
  (function tick(t){ const p=Math.min(1,(t-t0)/900); comboShown=Math.round(goal*(p*(2-p)));
    bigscore.textContent=comboShown; if(p<1) requestAnimationFrame(tick); })(t0);
  drawReplay();
}
// ghost replay: redraw the cascade trail as an animated growing path
let replayRAF=0;
function drawReplay(){ const rc=document.getElementById("replayCv"), r=rc.getContext("2d");
  const w=rc.width=rc.clientWidth*2, h=rc.height=120*2; r.scale(1,1);
  cancelAnimationFrame(replayRAF);
  if(!trail.length){ r.fillStyle="#05060c"; r.fillRect(0,0,w,h); return; }
  let xs=trail.map(p=>p.x), ys=trail.map(p=>p.y);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=Math.min((w-40)/(maxx-minx+1),(h-40)/(maxy-miny+1));
  const ox=(w-(maxx-minx)*sc)/2-minx*sc, oy=(h-(maxy-miny)*sc)/2-miny*sc;
  const t0=performance.now(), dur=1400;
  (function anim(t){ const p=Math.min(1,(t-t0)/dur), show=Math.ceil(p*trail.length);
    r.globalCompositeOperation="source-over"; r.fillStyle="#05060c"; r.fillRect(0,0,w,h);
    r.globalCompositeOperation="lighter";
    for(let i=0;i<show;i++){ const pt=trail[i], X=pt.x*sc+ox, Y=pt.y*sc+oy;
      if(i>0){ const pv=trail[i-1]; r.strokeStyle=`hsla(${pt.hue},90%,62%,.5)`; r.lineWidth=2;
        r.beginPath(); r.moveTo(pv.x*sc+ox,pv.y*sc+oy); r.lineTo(X,Y); r.stroke(); }
      const g=r.createRadialGradient(X,Y,0,X,Y,10+pt.depth);
      g.addColorStop(0,`hsla(${pt.hue},95%,72%,.95)`); g.addColorStop(1,`hsla(${pt.hue},90%,55%,0)`);
      r.fillStyle=g; r.beginPath(); r.arc(X,Y,10+pt.depth,0,6.283); r.fill(); }
    if(p<1) replayRAF=requestAnimationFrame(anim); })(t0);
}

// ---------- input & buttons ----------
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg;
  el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1600); }
cv.addEventListener("pointerdown",e=>{ if(phase!=="ready") return;
  detonate(e.clientX,e.clientY); });
document.getElementById("newBtn").onclick=()=>{ SEED=Math.random()*4294967296>>>0; writeSeed(SEED);
  round=1; genBoard(); ov.classList.remove("on"); hint.classList.remove("hide"); toast("New board seeded"); };
function shareLink(){ return location.href; }
// robust copy: Clipboard API in secure contexts, execCommand fallback otherwise, always toast feedback
function fallbackCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt; ta.readOnly=true;
  ta.style.cssText="position:fixed;top:-1000px;left:0;opacity:0;user-select:text;-webkit-user-select:text";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ ta.setSelectionRange(0,txt.length); }catch(e){}
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove();
  toast(ok ? "Board link copied — beat my board!"
           : (location.protocol==="file:" ? "Serve this page over http to share a working link" : txt));
}
function copyShare(){ const txt=shareLink();
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(
      ()=>toast("Board link copied — beat my board!"),
      ()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
document.getElementById("shareBtn").onclick=copyShare;
document.getElementById("copyBtn").onclick=copyShare;
document.getElementById("snapBtn").onclick=()=>{ const a=document.createElement("a");
  a.download="chainbloom-"+SEED.toString(36)+"-r"+round+"-"+chainMax+".png";
  a.href=cv.toDataURL("image/png"); a.click(); toast("Snapshot saved"); };
document.getElementById("nextBtn").onclick=()=>{ const win=chainMax>=target;
  if(win) round++; genBoard(); ov.classList.remove("on"); };

// ---------- go ----------
genBoard();
requestAnimationFrame(t=>{ last=t; frame(t); });
</script>
</body>
