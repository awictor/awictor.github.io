<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CronDescribe — Cron Expression to Plain English</title>
<meta name="description" content="Translate a 5-field cron expression into a plain-English schedule description. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('cron-describe-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#0284c7;
    --bg:#f5f6f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e4ea; --shadow:0 1px 3px rgba(0,0,0,.08); --bad:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0f1319; --card:#181d25; --fg:#eff1f5; --muted:#96a0ac; --line:#262c37; --shadow:0 1px 3px rgba(0,0,0,.5); --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#075985);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:1.1rem}
  .desc{font-size:1.5rem;font-weight:700;text-align:center;padding:8px 4px}
  .desc.err{color:var(--bad);font-size:1rem}
  .fields{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;font-size:.72rem;color:var(--muted);text-align:center}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .presets button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer;font:inherit;font-size:.78rem;font-family:"SF Mono",Menlo,Consolas,monospace}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⏰</div>
    <div><h1>CronDescribe</h1><div class="sub">Cron expression → plain English</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="cron">Cron expression (min hour day month weekday)</label>
    <input id="cron" value="0 9 * * 1-5" spellcheck="false" autocapitalize="off">
    <div class="fields"><span>minute</span><span>hour</span><span>day</span><span>month</span><span>weekday</span></div>
    <div class="presets" id="presets"></div>
  </div>
  <div class="card">
    <div class="desc" id="desc"></div>
  </div>
</main>
<footer>
  Covers the common patterns (*, */n, ranges, lists). 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/cron-describe">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function fmtTime(h, m){
    const ap = h < 12 ? 'AM' : 'PM';
    let hr = h % 12; if(hr === 0) hr = 12;
    return hr + ':' + String(m).padStart(2, '0') + ' ' + ap;
  }

  function dowPhrase(dow){
    let mm;
    if(/^\d+$/.test(dow)) return 'only on ' + DOW[+dow % 7];
    if((mm = dow.match(/^(\d+)-(\d+)$/))) return DOW[+mm[1] % 7] + ' through ' + DOW[+mm[2] % 7];
    if(dow.includes(',')) return 'on ' + dow.split(',').map(d => DOW[+d % 7]).join(', ');
    return 'on weekday ' + dow;
  }

  function monthPhrase(mon){
    if(/^\d+$/.test(mon) && +mon >= 1 && +mon <= 12) return 'in ' + MONTHS[+mon];
    return 'in month ' + mon;
  }

  function describe(expr){
    const parts = String(expr).trim().split(/\s+/);
    if(parts.length !== 5) throw new Error('a cron expression has 5 fields');
    for(const p of parts) if(!/^[\d*/,\-]+$/.test(p)) throw new Error('invalid field: ' + p);
    const [min, hour, dom, mon, dow] = parts;

    let time, isEvery = false;
    if(min === '*' && hour === '*'){ time = 'Every minute'; isEvery = true; }
    else if(/^\*\/(\d+)$/.test(min) && hour === '*'){ time = 'Every ' + min.slice(2) + ' minutes'; isEvery = true; }
    else if(min === '0' && hour === '*'){ time = 'Every hour'; isEvery = true; }
    else if(/^\*\/(\d+)$/.test(hour) && min === '0'){ time = 'Every ' + hour.slice(2) + ' hours'; isEvery = true; }
    else if(hour === '*'){ time = 'Every hour at minute ' + min; isEvery = true; }
    else if(/^\d+$/.test(min) && /^\d+$/.test(hour)){ time = 'At ' + fmtTime(+hour, +min); }
    else { time = 'At minute ' + min + ' past hour ' + hour; }

    const dayBits = [];
    if(dom !== '*') dayBits.push('on day ' + dom + ' of the month');
    if(mon !== '*') dayBits.push(monthPhrase(mon));
    if(dow !== '*') dayBits.push(dowPhrase(dow));

    if(isEvery) return dayBits.length ? time + ', ' + dayBits.join(', ') : time;
    return time + ', ' + (dayBits.length ? dayBits.join(', ') : 'every day');
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('desc')){
    const $ = id => document.getElementById(id);
    const PRESETS = ['* * * * *', '*/5 * * * *', '0 * * * *', '0 0 * * *', '30 9 * * *', '0 9 * * 1-5', '0 0 1 * *', '0 0 * * 0', '0 */2 * * *'];

    function render(){
      try{ $('desc').textContent = describe($('cron').value); $('desc').className = 'desc'; }
      catch(e){ $('desc').textContent = e.message; $('desc').className = 'desc err'; }
    }

    $('presets').innerHTML = PRESETS.map(p => `<button type="button">${p}</button>`).join('');
    $('presets').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; $('cron').value = b.textContent; render(); });
    $('cron').addEventListener('input', render);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('cron-describe-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { describe, fmtTime, dowPhrase };
</script>
</body>
</html>
