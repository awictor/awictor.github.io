<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lapidary — procedural gem cutter</title>
<style>
  :root{ --bg:#0b0b12; --panel:#14141f; --ink:#e9e6df; --dim:#8b8698; --gold:#d9b46a; --line:#2a2838; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:radial-gradient(1200px 700px at 60% -10%,#1c1a2b,#07070c 70%); color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #wrap{ display:flex; height:100%; }
  #stage{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-width:0; padding:12px; }
  canvas{ touch-action:none; cursor:grab; border-radius:8px; box-shadow:0 30px 80px rgba(0,0,0,.6);
    max-width:100%; max-height:100%; height:auto; }
  canvas:active{ cursor:grabbing; }
  #hint{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:var(--dim); font-size:12px;
    letter-spacing:.4px; pointer-events:none; opacity:.8; }
  #panel{ width:288px; flex:none; background:linear-gradient(180deg,#171624,#101019); border-left:1px solid var(--line);
    padding:18px 18px 24px; overflow-y:auto; }
  h1{ margin:0 0 2px; font-size:19px; letter-spacing:1.5px; font-weight:600; }
  h1 b{ color:var(--gold); font-weight:600; }
  .sub{ color:var(--dim); font-size:11px; margin:0 0 16px; letter-spacing:.3px; }
  .grp{ margin-bottom:16px; }
  .lbl{ text-transform:uppercase; font-size:10px; letter-spacing:1.4px; color:var(--gold); margin-bottom:8px; opacity:.85; }
  .cuts,.presets{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  button{ background:#1e1c2c; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:7px 4px;
    font-size:11px; cursor:pointer; transition:.15s; letter-spacing:.3px; }
  button:hover{ border-color:var(--gold); color:#fff; }
  button.on{ background:var(--gold); color:#1a1712; border-color:var(--gold); font-weight:600; }
  button:disabled{ opacity:.5; cursor:default; }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .presets button{ text-transform:capitalize; }
  .row{ display:flex; align-items:center; gap:8px; margin:7px 0; transition:opacity .15s; }
  .row.off{ opacity:.4; }
  .row.off input{ pointer-events:none; }
  .row span{ width:70px; font-size:11px; color:var(--dim); }
  .row output{ width:34px; text-align:right; font-size:11px; color:var(--ink); font-variant-numeric:tabular-nums; }
  input[type=range]{ flex:1; appearance:none; -webkit-appearance:none; height:3px; background:var(--line); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border:none; border-radius:50%;
    background:var(--gold); cursor:pointer; box-shadow:0 0 6px rgba(217,180,106,.6); }
  input[type=range]::-moz-range-thumb{ width:13px; height:13px; border:none; border-radius:50%;
    background:var(--gold); cursor:pointer; box-shadow:0 0 6px rgba(217,180,106,.6); }
  input[type=range]::-moz-range-track{ height:3px; background:var(--line); border-radius:2px; }
  input[type=range]:focus-visible::-webkit-slider-thumb{ box-shadow:0 0 0 3px rgba(217,180,106,.5); }
  input[type=range]:focus-visible::-moz-range-thumb{ box-shadow:0 0 0 3px rgba(217,180,106,.5); }
  .act{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .act .wide{ grid-column:1/3; }
  .seedrow{ display:flex; gap:6px; margin-top:8px; }
  .seedrow input{ flex:1; min-width:0; background:#1e1c2c; color:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:6px 8px; font:11px/1.2 "Segoe UI",monospace; letter-spacing:.3px; }
  .seedrow input:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
  .seedrow button{ flex:none; }
  .seed{ font-family:"Segoe UI",monospace; font-size:11px; color:var(--dim); word-break:break-all; margin-top:10px; }
  .seed b{ color:var(--gold); }
  @media(max-width:720px){
    html,body{ overflow:auto; }
    #wrap{ flex-direction:column; height:auto; min-height:100%; }
    #stage{ min-height:60vh; }
    #panel{ width:100%; border-left:none; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="620" height="620"></canvas>
    <div id="hint">drag the stone to catch the light</div>
  </div>
  <div id="panel">
    <h1>LAPI<b>DARY</b></h1>
    <p class="sub">procedural gem-cutting studio</p>

    <div class="grp"><div class="lbl">Gem gallery</div>
      <div class="presets" id="presets"></div></div>

    <div class="grp"><div class="lbl">Cut family</div>
      <div class="cuts" id="cuts"></div></div>

    <div class="grp"><div class="lbl">Geometry</div>
      <div class="row"><span>Facets</span><input type="range" id="density" min="8" max="28" step="2" value="18"><output></output></div>
      <div class="row"><span>Table</span><input type="range" id="table" min="20" max="60" value="34"><output></output></div>
      <div class="row"><span>Culet</span><input type="range" id="culet" min="0" max="40" value="10"><output></output></div>
      <div class="row"><span>Elongate</span><input type="range" id="elong" min="100" max="230" value="100"><output></output></div>
      <div class="row"><span>Roundness</span><input type="range" id="round" min="0" max="100" value="60"><output></output></div>
    </div>

    <div class="grp"><div class="lbl">Optics</div>
      <div class="row"><span>Hue</span><input type="range" id="hue" min="0" max="360" value="205"><output></output></div>
      <div class="row"><span>Saturation</span><input type="range" id="sat" min="0" max="100" value="18"><output></output></div>
      <div class="row"><span>Brilliance</span><input type="range" id="bril" min="20" max="100" value="72"><output></output></div>
      <div class="row"><span>Fire</span><input type="range" id="fire" min="0" max="100" value="55"><output></output></div>
      <div class="row"><span>Clarity</span><input type="range" id="clarity" min="0" max="100" value="82"><output></output></div>
    </div>

    <div class="grp"><div class="lbl">Studio</div>
      <div class="act">
        <button id="png">Export PNG</button>
        <button id="svg">Export SVG</button>
        <button class="wide" id="copy">⧉ Copy share link</button>
      </div>
      <div class="seedrow">
        <input type="text" id="seedin" spellcheck="false" autocomplete="off" aria-label="Seed" title="Type a seed and press Enter">
        <button id="roll" title="Random seed">✦ Roll</button>
      </div>
      <div class="seed" id="seedlbl"></div>
    </div>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$("c"), ctx=cv.getContext("2d"), W=cv.width, H=cv.height, CX=W/2, CY=H/2, R=245;
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

/* seeded rng */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

const CUTS=["round","step","rose","marquise","cushion","princess"];
const CUTNAME={round:"Round",step:"Emerald",rose:"Rose",marquise:"Marquise",cushion:"Cushion",princess:"Princess"};
const PRESETS={
  diamond:{cut:"round",  hue:210,sat:8, fire:80,bril:82,elong:100,round:60,seed:"brilliance"},
  ruby:   {cut:"cushion",hue:352,sat:82,fire:52,bril:70,elong:108,round:52,seed:"pigeonblood"},
  emerald:{cut:"step",   hue:150,sat:74,fire:40,bril:64,elong:150,round:40,seed:"muzomine"},
  sapphire:{cut:"marquise",hue:222,sat:80,fire:60,bril:74,elong:190,round:60,seed:"kashmir"},
  amethyst:{cut:"princess",hue:278,sat:64,fire:58,bril:72,elong:100,round:20,seed:"veneta"},
  topaz:  {cut:"rose",   hue:38, sat:78,fire:70,bril:78,elong:120,round:60,seed:"imperial"}
};

let P={cut:"round",seed:"brilliance",density:18,table:34,culet:10,elong:100,round:60,
       hue:205,sat:18,bril:72,fire:55,clarity:82};

/* ---------- geometry ---------- */
function boundary(cut,N,round){
  const rnd=round/100, p=[];
  if(cut==="step"){ // emerald: clipped-corner octagon
    const w=1,h=.82,c=lerp(.42,.16,rnd);
    return [[w-c,-h],[w,-h+c],[w,h-c],[w-c,h],[-w+c,h],[-w,h-c],[-w,-h+c],[-w+c,-h]];
  }
  for(let i=0;i<N;i++){
    const t=i/N*TAU, ct=Math.cos(t), st=Math.sin(t);
    if(cut==="round"||cut==="rose"){ p.push([ct,st]); }
    else if(cut==="marquise"){ const nx=Math.cos(t); p.push([nx, Math.sin(t)*(1-nx*nx*.72)*.62]); }
    else if(cut==="cushion"){ const n=lerp(2.2,5.5,1-rnd); const k=Math.pow(Math.abs(ct),n)+Math.pow(Math.abs(st),n); const r=Math.pow(k,-1/n); p.push([ct*r,st*r*.9]); }
    else if(cut==="princess"){ const n=lerp(4,14,1-rnd); const k=Math.pow(Math.abs(ct),n)+Math.pow(Math.abs(st),n); const r=Math.pow(k,-1/n); p.push([ct*r,st*r]); }
  }
  return p;
}
// shift a ring by half a cell (creates the alternating brilliant facet pattern)
function ringPts(b,frac,shift){
  const N=b.length,out=[];
  for(let i=0;i<N;i++){ const a=b[i],c=b[(i+1)%N]; const x=lerp(a[0],c[0],shift),y=lerp(a[1],c[1],shift); out.push([x*frac,y*frac]); }
  return out;
}
function build(){
  const N = P.cut==="step"?8 : P.density;
  const b=boundary(P.cut,N,P.round), tf=P.table/100, cf=P.culet/100*tf, ex=P.elong/100;
  const F=[], rng=mulberry32(hashStr(P.seed+"g"));
  const push=(pts,fr)=>{ F.push({pts,fr,tint:.86+rng()*.28}); };
  if(P.cut==="rose"){                        // triangular dome — radial fan
    const r1=lerp(.5,.66,P.round/100);
    const rA=ringPts(b,1,0), rB=ringPts(b,r1,.5);
    for(let i=0;i<N;i++){ const j=(i+1)%N;
      push([rA[i],rA[j],rB[i]],.92); push([rA[j],rB[j],rB[i]],.78);
      push([rB[i],rB[j],[0,0]],.4); }
  } else if(P.cut==="step"){                  // concentric rectangular steps
    const fr=[1,.72,.5,Math.max(.3,tf)];
    for(let k=0;k<fr.length-1;k++){ const rA=ringPts(b,fr[k],0),rB=ringPts(b,fr[k+1],0);
      for(let i=0;i<N;i++){ const j=(i+1)%N; push([rA[i],rA[j],rB[j],rB[i]],(fr[k]+fr[k+1])/2); } }
    const tp=ringPts(b,Math.max(.3,tf),0); push(tp,.08);
  } else {                                    // brilliant family — offset-ring kites
    const fr=[1,.80,.55,tf];
    for(let k=0;k<fr.length-1;k++){ const sh=(k%2)*.5;
      const rA=ringPts(b,fr[k],sh),rB=ringPts(b,fr[k+1],((k+1)%2)*.5);
      for(let i=0;i<N;i++){ const j=(i+1)%N;
        push([rA[i],rA[j],rB[j]],lerp(fr[k],fr[k+1],.35));
        push([rA[i],rB[j],rB[i]],lerp(fr[k],fr[k+1],.65)); } }
    const tp=ringPts(b,tf,0); push(tp,.06);
  }
  if(cf>0.02){ const cp=ringPts(b,cf,0); push(cp,.02); }        // culet
  for(const f of F) for(const q of f.pts){ q[0]*=ex; }          // elongation
  // inclusions (seeded)
  const inc=[], ni=Math.round((1-P.clarity/100)*34), ir=mulberry32(hashStr(P.seed+"i"));
  for(let i=0;i<ni;i++){ const a=ir()*TAU, rr=Math.sqrt(ir())*.82;
    inc.push({x:Math.cos(a)*rr*ex,y:Math.sin(a)*rr,r:1+ir()*3,o:.1+ir()*.28}); }
  return {F,inc};
}

/* ---------- shading (shared by canvas + svg) ---------- */
function bodyRGB(){ const h=P.hue/360,s=P.sat/100,l=.5; // hsl->rgb
  const f=n=>{const k=(n+h*12)%12;return l-s*l*Math.max(-1,Math.min(k-3,9-k,1));};
  return [f(0)*255,f(8)*255,f(4)*255]; }
function shade(f,body,L){
  let cx=0,cy=0; for(const q of f.pts){cx+=q[0];cy+=q[1];} cx/=f.pts.length; cy/=f.pts.length;
  const dl=Math.hypot(cx,cy)||1e-4, slope=f.fr*1.5;
  let nx=cx/dl*slope, ny=cy/dl*slope, nz=1; const nl=Math.hypot(nx,ny,nz); nx/=nl;ny/=nl;nz/=nl;
  let diff=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]);
  const rd=2*(nx*L[0]+ny*L[1]+nz*L[2]); const spec=Math.max(0,Math.pow(Math.max(0,rd*nz-L[2]),22));
  const bril=P.bril/100;
  let inten=(.14+bril*(diff*diff*1.15+.12))*f.tint;
  if(diff<.16) inten*=.42;                       // extinction zone
  const sp=spec*(.55+bril*.6);
  let r=body[0]*inten+sp*255, g=body[1]*inten+sp*255, b=body[2]*inten+sp*255;
  return {c:[clamp(r,0,255),clamp(g,0,255),clamp(b,0,255)], cx, cy, spec:sp, diff};
}

/* ---------- render ---------- */
let disp=null, prev=null, fade=0, frame=0, dragging=false;
let L=[.4,-.5,.78], Lt=[.4,-.5,.78], driftA=0;
function toPx(q){ return [CX+q[0]*R, CY+q[1]*R]; }
function drawSet(set,alpha,expand){
  const body=bodyRGB();
  ctx.globalAlpha=alpha;
  for(const f of set.F){
    const s=shade(f,body,L);
    ctx.beginPath();
    for(let i=0;i<f.pts.length;i++){ let q=f.pts[i];
      if(expand!==1){ q=[q[0]*expand,q[1]*expand]; }
      const p=toPx(q); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
    ctx.closePath();
    ctx.fillStyle=`rgb(${s.c[0]|0},${s.c[1]|0},${s.c[2]|0})`; ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.28)"; ctx.lineWidth=.6; ctx.stroke();
  }
  // fire + specular (additive)
  ctx.globalCompositeOperation="lighter";
  const fr=P.fire/100, fseed=mulberry32(hashStr(P.seed)+frame*2654435761>>>0);
  for(const f of set.F){
    const s=shade(f,body,L); if(s.spec<.22) continue;
    const p=toPx([s.cx*expand,s.cy*expand]);
    ctx.globalAlpha=alpha*Math.min(1,s.spec*1.4);
    ctx.fillStyle="rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(p[0],p[1],1.6+s.spec*2.2,0,TAU); ctx.fill();
    if(fr>.02){ const ang=fseed()*TAU, d=(2.5+fr*7)*(.6+s.spec);
      const cols=[[255,60,60],[60,255,90],[70,110,255]];
      for(let k=0;k<3;k++){ const a=ang+k*TAU/3;
        ctx.globalAlpha=alpha*fr*s.spec*1.2;
        ctx.fillStyle=`rgb(${cols[k][0]},${cols[k][1]},${cols[k][2]})`;
        ctx.beginPath(); ctx.arc(p[0]+Math.cos(a)*d,p[1]+Math.sin(a)*d,1.1+fr*1.4,0,TAU); ctx.fill(); } }
  }
  ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=alpha;
  // inclusions
  for(const g of set.inc){ const p=toPx([g.x*expand,g.y*expand]);
    ctx.fillStyle=`rgba(20,16,30,${g.o*alpha})`; ctx.beginPath(); ctx.arc(p[0],p[1],g.r,0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;
}
function render(){
  // vignette backdrop
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(CX,CY-40,20,CX,CY,R*1.5);
  bg.addColorStop(0,"#191826"); bg.addColorStop(1,"#08080e");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(prev&&fade>0){ drawSet(prev,fade*.6,1+.12*fade); }
  if(disp){ drawSet(disp,prev&&fade>0?1-fade*.4:1,1); }
}
let target=build(); disp=cloneGeom(target);
function cloneGeom(g){ return {F:g.F.map(f=>({pts:f.pts.map(q=>[q[0],q[1]]),fr:f.fr,tint:f.tint})),inc:g.inc}; }
function loop(){
  frame++;
  // light easing + idle drift
  if(!dragging){ driftA+=0.006; Lt=[Math.sin(driftA)*.5, -.35+Math.cos(driftA*.7)*.25, .74]; }
  for(let i=0;i<3;i++) L[i]=lerp(L[i],Lt[i],dragging?.35:.04);
  const ln=Math.hypot(L[0],L[1],L[2]); for(let i=0;i<3;i++) L[i]/=ln;
  // geometry ease toward target (smooth morph for compatible changes)
  if(disp&&disp.F.length===target.F.length){
    for(let i=0;i<disp.F.length;i++){ const a=disp.F[i].pts,t=target.F[i].pts;
      const n=Math.min(a.length,t.length);
      for(let j=0;j<n;j++){ a[j][0]=lerp(a[j][0],t[j][0],.22); a[j][1]=lerp(a[j][1],t[j][1],.22); }
      disp.F[i].fr=target.F[i].fr; disp.F[i].tint=target.F[i].tint; }
    disp.inc=target.inc;
  } else { disp=cloneGeom(target); }
  if(fade>0) fade=Math.max(0,fade-.045);
  render();
  requestAnimationFrame(loop);
}
function rebuild(morph){ const old=disp; const ng=build();
  if(morph&&old&&old.F.length!==ng.F.length){ prev=old; fade=1; }
  target=ng;
  if(!disp||disp.F.length!==ng.F.length&&!morph) disp=cloneGeom(ng);
}

/* ---------- UI ---------- */
const cutsEl=$("cuts"), presEl=$("presets");
CUTS.forEach(c=>{ const b=document.createElement("button"); b.textContent=CUTNAME[c]; b.dataset.cut=c;
  b.onclick=()=>{ P.cut=c; syncCutBtns(); rebuild(true); sync(); }; cutsEl.appendChild(b); });
Object.keys(PRESETS).forEach(name=>{ const b=document.createElement("button"); b.textContent=name;
  b.onclick=()=>applyPreset(name); presEl.appendChild(b); });
function syncCutBtns(){ [...cutsEl.children].forEach(b=>b.classList.toggle("on",b.dataset.cut===P.cut)); }
const sliders=["density","table","culet","elong","round","hue","sat","bril","fire","clarity"];
const RANGE={}; sliders.forEach(id=>{ const el=$(id); RANGE[id]=[+el.min,+el.max]; });
sliders.forEach(id=>{ const el=$(id); el.oninput=()=>{ P[id]=+el.value; rebuild(false); sync(); }; });
function sync(){
  $("density").value=P.density; $("table").value=P.table; $("culet").value=P.culet;
  $("elong").value=P.elong; $("round").value=P.round; $("hue").value=P.hue; $("sat").value=P.sat;
  $("bril").value=P.bril; $("fire").value=P.fire; $("clarity").value=P.clarity;
  document.querySelectorAll(".row").forEach(r=>{ const inp=r.querySelector("input"),out=r.querySelector("output");
    if(!inp||!out)return; let v=+inp.value, id=inp.id;
    out.textContent = (id==="table"||id==="culet"||id==="round"||id==="sat"||id==="bril"||id==="fire"||id==="clarity")?v+"%"
      : id==="elong"?(v/100).toFixed(2)+"×" : id==="hue"?v+"°" : v; });
  syncCutBtns();
  // dim + disable controls a given cut ignores, turning silent no-ops into a legibility cue
  setOff("density", P.cut==="step");
  setOff("round", P.cut==="round"||P.cut==="marquise");
  const si=$("seedin"); if(document.activeElement!==si) si.value=P.seed;
  $("seedlbl").innerHTML="seed <b>"+P.seed+"</b> · "+CUTNAME[P.cut];
  writeHash();
}
function setOff(id,off){ const el=$(id); el.disabled=off; el.closest(".row").classList.toggle("off",off); }
function applyPreset(name){ const q=PRESETS[name]; Object.assign(P,{cut:q.cut,seed:q.seed,hue:q.hue,sat:q.sat,fire:q.fire,bril:q.bril,elong:q.elong,round:q.round});
  P.density=18; P.table=34; P.culet=10; P.clarity=86; rebuild(true); sync(); }
$("roll").onclick=()=>{ P.seed=Math.random().toString(36).slice(2,10); rebuild(false); sync(); };
$("seedin").addEventListener("change",e=>{ const v=e.target.value.trim(); if(v){ P.seed=v; rebuild(false); sync(); } else { e.target.value=P.seed; } });
// transient label swap so a click has visible feedback
function flash(btn,msg){ if(btn._t) return; const t=btn.textContent; btn.textContent=msg; btn._t=setTimeout(()=>{ btn.textContent=t; btn._t=null; },1200); }
$("copy").onclick=()=>{ const done=()=>flash($("copy"),"Copied!");
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(location.href).then(done).catch(done); } else { done(); } };

/* drag to move key light */
function setLightFromEvt(e){ const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  Lt=[clamp((mx-CX)/R,-1,1)*.9, clamp((my-CY)/R,-1,1)*.9, .6]; }
cv.addEventListener("pointerdown",e=>{ dragging=true; cv.setPointerCapture(e.pointerId); setLightFromEvt(e); });
cv.addEventListener("pointermove",e=>{ if(dragging) setLightFromEvt(e); });
cv.addEventListener("pointerup",()=>{ dragging=false; });
cv.addEventListener("pointercancel",()=>{ dragging=false; });

/* URL hash sync */
function writeHash(){ const h=`s=${encodeURIComponent(P.seed)}&c=${P.cut}&h=${P.hue}&t=${P.sat}&f=${P.fire}&b=${P.bril}&e=${P.elong}&r=${P.round}&d=${P.density}&tb=${P.table}&cu=${P.culet}&cl=${P.clarity}`;
  history.replaceState(null,"","#"+h); }
function readHash(){ const h=location.hash.slice(1); if(!h) return false; const q={};
  h.split("&").forEach(kv=>{const[k,v]=kv.split("=");q[k]=decodeURIComponent(v||"");});
  if(q.s) P.seed=q.s; if(q.c&&CUTS.includes(q.c)) P.cut=q.c;
  const m={h:"hue",t:"sat",f:"fire",b:"bril",e:"elong",r:"round",d:"density",tb:"table",cu:"culet",cl:"clarity"};
  // validate + clamp each value to its slider range so a corrupt/truncated hash falls back to defaults instead of NaN
  for(const k in m){ const f=m[k]; if(q[k]===undefined||q[k]==="") continue;
    const n=+q[k], rg=RANGE[f]; if(Number.isFinite(n)&&rg) P[f]=clamp(n,rg[0],rg[1]); }
  return true; }

/* ---------- export ---------- */
$("png").onclick=()=>{ const a=document.createElement("a"); a.download=`lapidary-${P.cut}-${P.seed}.png`; a.href=cv.toDataURL("image/png"); a.click(); flash($("png"),"Saved!"); };
$("svg").onclick=()=>{ const body=bodyRGB(); let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s+=`<defs><radialGradient id="bg" cx="50%" cy="42%" r="80%"><stop offset="0" stop-color="#191826"/><stop offset="1" stop-color="#08080e"/></radialGradient></defs>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#bg)"/>`;
  for(const f of disp.F){ const sh=shade(f,body,L);
    const pts=f.pts.map(q=>{const p=toPx(q);return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
    s+=`<polygon points="${pts}" fill="rgb(${sh.c[0]|0},${sh.c[1]|0},${sh.c[2]|0})" stroke="rgba(0,0,0,.28)" stroke-width=".6"/>`; }
  for(const f of disp.F){ const sh=shade(f,body,L); if(sh.spec<.22) continue; const p=toPx([sh.cx,sh.cy]);
    s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(1.6+sh.spec*2.2).toFixed(1)}" fill="rgba(255,255,255,.9)"/>`;
    if(P.fire>2){ const fr=P.fire/100,cols=["#ff3c3c","#3cff5a","#4670ff"]; for(let k=0;k<3;k++){const a=k*TAU/3,d=(2.5+fr*7)*(.6+sh.spec);
      s+=`<circle cx="${(p[0]+Math.cos(a)*d).toFixed(1)}" cy="${(p[1]+Math.sin(a)*d).toFixed(1)}" r="${(1.1+fr*1.4).toFixed(1)}" fill="${cols[k]}" opacity="${(fr*sh.spec).toFixed(2)}"/>`; } } }
  for(const g of disp.inc){ const p=toPx([g.x,g.y]); s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${g.r.toFixed(1)}" fill="rgba(20,16,30,${g.o.toFixed(2)})"/>`; }
  s+="</svg>";
  const a=document.createElement("a"); a.download=`lapidary-${P.cut}-${P.seed}.svg`;
  a.href="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s); a.click(); flash($("svg"),"Saved!"); };

/* ---------- boot ---------- */
if(!readHash()) applyPreset("diamond");
rebuild(false); disp=cloneGeom(target); sync(); loop();
</script>
</body>
</html>
