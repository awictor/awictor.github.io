<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAGR — Compound Annual Growth Rate Calculator</title>
<meta name="description" content="Calculate compound annual growth rate (CAGR) from a start and end value, project future value at a rate, and find doubling time. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('cagr-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#2563eb;
    --bg:#f5f6f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e3e6; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#101319; --card:#191d25; --fg:#f0f1f4; --muted:#98a0aa; --line:#2a2f39; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:760px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  h2{font-size:1rem;margin:0 0 12px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .out{text-align:center;margin-top:14px}
  .big{font-size:3rem;font-weight:800;color:var(--c);letter-spacing:-1px}
  .line{color:var(--muted);font-size:.9rem;margin-top:4px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .res div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .res span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .res b{font-size:1.2rem}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:760px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">📈</div>
    <div><h1>CAGR</h1><div class="sub">Compound annual growth rate &amp; projections</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <h2>Growth rate from start &amp; end value</h2>
    <div class="grid">
      <div><label for="begin">Start value</label><input type="number" id="begin" value="10000" min="0" step="any"></div>
      <div><label for="end">End value</label><input type="number" id="end" value="25000" min="0" step="any"></div>
      <div><label for="years">Years</label><input type="number" id="years" value="7" min="0" step="any"></div>
    </div>
    <div class="out">
      <div class="big" id="cagrOut">—</div>
      <div class="line" id="totalOut"></div>
    </div>
    <div class="res">
      <div><span>Total growth</span><b id="totalGrowth">—</b></div>
      <div><span>Doubling time</span><b id="doubleOut">—</b></div>
    </div>
  </div>

  <div class="card">
    <h2>Project a future value</h2>
    <div class="grid">
      <div><label for="pv">Present value</label><input type="number" id="pv" value="10000" min="0" step="any"></div>
      <div><label for="rate">Annual rate (%)</label><input type="number" id="rate" value="8" step="any"></div>
      <div><label for="pyears">Years</label><input type="number" id="pyears" value="10" min="0" step="any"></div>
    </div>
    <div class="out"><div class="big" id="fvOut">—</div><div class="line">projected future value</div></div>
  </div>
</main>
<footer>
  Estimates only — not financial advice. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/cagr-calc">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  // Compound annual growth rate as a decimal (0.10 = 10%)
  function cagr(begin, end, years){
    if(!(begin > 0)) throw new Error('start value must be positive');
    if(!(end > 0)) throw new Error('end value must be positive');
    if(!(years > 0)) throw new Error('years must be positive');
    return Math.pow(end / begin, 1 / years) - 1;
  }

  function futureValue(present, rate, years){
    if(!(present >= 0)) throw new Error('present value must be non-negative');
    if(years < 0) throw new Error('years must be non-negative');
    return present * Math.pow(1 + rate, years);
  }

  // years to grow from present to target at a fixed rate
  function yearsToTarget(present, target, rate){
    if(!(present > 0) || !(target > 0)) throw new Error('values must be positive');
    if(!(rate > -1) || rate === 0) throw new Error('rate must be > -1 and non-zero');
    return Math.log(target / present) / Math.log(1 + rate);
  }

  function doublingTime(rate){
    if(!(rate > -1) || rate === 0) throw new Error('rate must be > -1 and non-zero');
    return Math.log(2) / Math.log(1 + rate);
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('cagrOut')){
    const $ = id => document.getElementById(id);
    const money = n => n.toLocaleString(undefined, { maximumFractionDigits: 0 });
    const pct = r => (r * 100).toFixed(2) + '%';

    function renderCagr(){
      const begin = +$('begin').value, end = +$('end').value, years = +$('years').value;
      let r;
      try{ r = cagr(begin, end, years); }
      catch(e){ $('cagrOut').textContent = '—'; $('totalOut').textContent = ''; $('totalGrowth').textContent = '—'; $('doubleOut').textContent = '—'; return; }
      $('cagrOut').textContent = pct(r);
      $('totalOut').textContent = `${money(begin)} → ${money(end)} over ${years} year${years == 1 ? '' : 's'}`;
      $('totalGrowth').textContent = ((end / begin - 1) * 100).toFixed(1) + '%';
      try{ $('doubleOut').textContent = doublingTime(r).toFixed(1) + ' yrs'; }
      catch(e){ $('doubleOut').textContent = '—'; }
    }

    function renderFv(){
      const pv = +$('pv').value, rate = +$('rate').value / 100, years = +$('pyears').value;
      try{ $('fvOut').textContent = money(futureValue(pv, rate, years)); }
      catch(e){ $('fvOut').textContent = '—'; }
    }

    ['begin', 'end', 'years'].forEach(id => $(id).addEventListener('input', renderCagr));
    ['pv', 'rate', 'pyears'].forEach(id => $(id).addEventListener('input', renderFv));
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('cagr-theme', cur); }catch(e){}
    });
    renderCagr(); renderFv();
  }

  if(typeof module !== 'undefined') module.exports = { cagr, futureValue, yearsToTarget, doublingTime };
</script>
</body>
</html>
