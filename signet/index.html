<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signet — procedural wax seal press</title>
<style>
  :root{ --ink:#2a2320; --panel:#efe7d8; --edge:#d8cbb2; --accent:#8f1f14; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font:14px/1.45 "Iowan Old Style","Palatino Linotype",Georgia,serif;
    color:var(--ink);
    background:#1c1815;
    display:flex;min-height:100%;
  }
  #stage{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;gap:14px;position:relative;min-width:0;
    background:radial-gradient(120% 120% at 50% 30%,#3a322b,#171310);
  }
  #wrap{position:relative;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));}
  canvas#seal{border-radius:8px;cursor:grab;touch-action:none;background:transparent;}
  canvas#seal:active{cursor:grabbing}
  #hint{color:#c9b48f;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
  #seedline{color:#b39b78;font-size:12px;font-family:"SF Mono",ui-monospace,Menlo,monospace}
  #panel{
    width:312px;flex:none;overflow-y:auto;background:var(--panel);
    border-left:1px solid #000;padding:18px 18px 40px;
    box-shadow:inset 2px 0 0 #fff8ec;
  }
  h1{font-size:22px;margin:0 0 2px;letter-spacing:.04em}
  .sub{font-size:11.5px;color:#7a6a52;margin:0 0 16px;font-style:italic}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#6e5d45;margin:13px 0 4px}
  .val{float:right;color:var(--accent);font-style:normal;font-variant-numeric:tabular-nums}
  select,input[type=text]{
    width:100%;padding:7px 8px;border:1px solid var(--edge);border-radius:5px;
    background:#fbf6ec;font:inherit;font-size:13px;color:var(--ink);
  }
  input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  button{
    padding:9px 6px;border:1px solid #000;border-radius:6px;cursor:pointer;
    font:inherit;font-size:12.5px;letter-spacing:.04em;background:#fbf6ec;color:var(--ink);
    transition:transform .06s;
  }
  button:hover{background:#fff}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);color:#fff2e2;border-color:#5c130b;grid-column:1/3}
  .chk{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink)}
  .chk input{accent-color:var(--accent)}
  a.tag{color:var(--accent);text-decoration:none;font-size:11px}
  @media (max-width:820px){
    body{flex-direction:column}
    #stage{padding:16px 12px}
    canvas#seal{width:auto!important;height:auto!important;max-width:92vw;max-height:74vh}
    #panel{width:100%;flex:none;border-left:none;border-top:1px solid #000;box-shadow:inset 0 2px 0 #fff8ec}
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="wrap"><canvas id="seal" width="560" height="560"></canvas></div>
    <div id="hint">drag the seal to rake the light</div>
    <div id="seedline"></div>
  </div>
  <div id="panel">
    <h1>Signet</h1>
    <p class="sub">a seeded press for molten wax seals</p>

    <label for="device">Device</label>
    <select id="device">
      <option value="monogram">Entwined monogram</option>
      <option value="rosette">N-fold rosette</option>
      <option value="emblem">Emblem silhouette</option>
      <option value="mark">Merchant's mark</option>
    </select>

    <div class="row">
      <div><label for="mono">Monogram</label><input type="text" id="mono" maxlength="3" spellcheck="false"></div>
      <div><label for="emblem">Emblem</label>
        <select id="emblem">
          <option value="bee">Bee</option><option value="key">Key</option>
          <option value="anchor">Anchor</option><option value="crescent">Crescent</option>
          <option value="oak">Oak sprig</option><option value="quill">Quill</option>
          <option value="star">Star</option>
        </select>
      </div>
    </div>

    <label for="motto">Motto ring</label>
    <input type="text" id="motto" maxlength="34" spellcheck="false">

    <div class="row">
      <div><label for="border">Border</label>
        <select id="border">
          <option value="beaded">Beaded</option><option value="rope">Rope-twist</option>
          <option value="dotted">Dotted</option><option value="plain">Plain</option>
        </select>
      </div>
      <div><label for="rings">Rings <span class="val" id="ringsV"></span></label><input type="range" id="rings" min="1" max="3" step="1" aria-label="Border ring count"></div>
    </div>

    <div class="row">
      <div><label for="color">Wax color</label>
        <select id="color">
          <option value="vermilion">Vermilion</option><option value="oxblood">Oxblood</option>
          <option value="forest">Forest</option><option value="navy">Navy</option>
          <option value="plum">Plum</option><option value="black">Black</option>
          <option value="ivory">Ivory</option>
        </select>
      </div>
      <div><label for="material">Material</label>
        <select id="material">
          <option value="solid">Solid</option><option value="marble">Marbled</option>
          <option value="gold">Gold leaf</option><option value="silver">Silver leaf</option>
        </select>
      </div>
    </div>

    <div id="color2wrap" style="display:none">
      <label for="color2">Marble second tone</label>
      <select id="color2">
        <option value="vermilion">Vermilion</option><option value="oxblood">Oxblood</option>
        <option value="forest">Forest</option><option value="navy">Navy</option>
        <option value="plum">Plum</option><option value="black">Black</option>
        <option value="ivory">Ivory</option>
      </select>
    </div>

    <label for="ground">Ground</label>
    <select id="ground">
      <option value="parchment">Parchment</option><option value="kraft">Kraft</option>
      <option value="flap">Envelope flap</option><option value="transparent">Transparent</option>
    </select>

    <label for="irr">Blob raggedness <span class="val" id="irrV"></span></label>
    <input type="range" id="irr" min="0" max="100" step="1" aria-label="Blob raggedness">
    <div class="row">
      <div><label for="drip">Drips <span class="val" id="dripV"></span></label><input type="range" id="drip" min="0" max="3" step="1" aria-label="Drip count"></div>
      <div><label for="depth">Depth <span class="val" id="depthV"></span></label><input type="range" id="depth" min="20" max="100" step="1" aria-label="Impression depth"></div>
    </div>

    <div class="chk"><input type="checkbox" id="glossy" checked><label style="margin:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:12px">Glossy finish</label></div>
    <div class="chk"><input type="checkbox" id="orbit"><label style="margin:0;text-transform:none;letter-spacing:0;color:var(--ink);font-size:12px">Auto-orbit light</label></div>

    <div class="btns">
      <button class="primary" id="press">✦ Press a new seal</button>
      <button id="reshape">Reshape</button>
      <button id="restamp">Re-stamp</button>
      <button id="link">Copy link</button>
      <button id="png">Export PNG</button>
      <button id="svg">Export SVG</button>
    </div>
    <p style="margin-top:16px"><a class="tag" id="permalink" href="#">deterministic · shareable · zero-dependency</a></p>
  </div>

<script>
"use strict";
const C=document.getElementById("seal"), X=C.getContext("2d"), DPR=Math.min(2,window.devicePixelRatio||1);
C.width=560*DPR; C.height=560*DPR; C.style.width="560px"; C.style.height="560px";
const W=560,H=560;
// ---------- deterministic PRNG ----------
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// ---------- color helpers ----------
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
const WAX={vermilion:"#c8351f",oxblood:"#701d17",forest:"#254a2b",navy:"#22315e",plum:"#5b2a52",black:"#26242a",ivory:"#e8dcc2"};
const MOTTO_A=["SEMPER","VIRTUS","FIDES","LUMEN","ARDOR","VERITAS","SPES","HONOR","NOX","AURUM","TENAX","VIGILO"];
const MOTTO_B=["FIDELIS","IN LUCE","ET ROBUR","PARATUS","VINCIT","INFINITA","AETERNA","SUPERAT","REGNAT","PROBATA"];
// ---------- state ----------
const S={};
const EMBLEMS=["bee","key","anchor","crescent","oak","quill","star"];
function deriveFromSeed(seed){
  const r=mulberry32(hashStr(seed+"|sig"));
  const pick=a=>a[Math.floor(r()*a.length)];
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  S.seed=seed;
  S.device=pick(["monogram","rosette","emblem","mark"]);
  S.mono=letters[Math.floor(r()*26)]+letters[Math.floor(r()*26)]+(r()>.5?letters[Math.floor(r()*26)]:"");
  S.emblem=pick(EMBLEMS);
  S.motto=(pick(MOTTO_A)+" "+pick(MOTTO_B));
  S.border=pick(["beaded","rope","dotted","plain"]);
  S.rings=1+Math.floor(r()*3);
  S.color=pick(Object.keys(WAX));
  S.material=pick(["solid","solid","marble","gold","silver"]);
  S.color2=pick(Object.keys(WAX));
  S.ground=pick(["parchment","kraft","flap","parchment"]);
  S.irr=25+Math.floor(r()*55);
  S.drip=Math.floor(r()*4);
  S.depth=45+Math.floor(r()*45);
  S.glossy=r()>.25;
  S.foldSeed=Math.floor(r()*100000);
}
// ---------- hash sync ----------
const KEYS=["seed","device","mono","emblem","motto","border","rings","color","material","color2","ground","irr","drip","depth","glossy","foldSeed"];
const ENUMS={device:["monogram","rosette","emblem","mark"],emblem:EMBLEMS,border:["beaded","rope","dotted","plain"],
  color:Object.keys(WAX),color2:Object.keys(WAX),material:["solid","marble","gold","silver"],ground:["parchment","kraft","flap","transparent"]};
const NUMR={rings:[1,3],irr:[0,100],drip:[0,3],depth:[20,100],foldSeed:[0,1e9]};
function writeHash(){const p=new URLSearchParams();KEYS.forEach(k=>p.set(k,S[k]===true?1:S[k]===false?0:S[k]));
  history.replaceState(null,"","#"+p.toString());document.getElementById("permalink").href="#"+p.toString();}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));if(!p.has("seed"))return false;
  deriveFromSeed(p.get("seed"));
  KEYS.forEach(k=>{if(!p.has(k))return;let v=p.get(k);
    if(NUMR[k]){v=+v;if(!isFinite(v))return;v=Math.max(NUMR[k][0],Math.min(NUMR[k][1],Math.round(v)));}
    else if(k==="glossy"){v=v==="1"||v==="true";}
    else if(ENUMS[k]){if(!ENUMS[k].includes(v))return;} // ignore out-of-enum values from tampered/truncated links
    S[k]=v;});return true;}
// ---------- geometry (cached) ----------
let geo=null,geoKey="";
function buildGeo(){
  const key=[S.seed,S.irr,S.drip,S.foldSeed].join(",");
  if(key===geoKey&&geo)return geo; geoKey=key;
  const r=mulberry32(hashStr(S.seed+"|blob")+S.foldSeed);
  const R=W*0.315, irr=S.irr/100, N=80, harm=[];
  for(let k=0;k<5;k++)harm.push({f:3+k+Math.floor(r()*2),a:(r()*2-1)/(k+1.4),p:r()*Math.PI*2});
  const pts=[];
  for(let i=0;i<N;i++){const th=i/N*Math.PI*2;let n=0;harm.forEach(h=>n+=h.a*Math.sin(h.f*th+h.p));
    const rad=R*(1+irr*0.22*n); pts.push([Math.cos(th)*rad,Math.sin(th)*rad]);}
  const drips=[];
  for(let d=0;d<S.drip;d++){const th=Math.PI/2+(r()*2-1)*0.7; const base=R*0.97;
    drips.push({th,len:R*(0.28+r()*0.5),w:R*(0.11+r()*0.09),base});}
  geo={R,pts,drips}; return geo;
}
// ---------- pen abstraction (canvas + svg share device/border geometry) ----------
function CanvasPen(ctx){return{ctx,dx:0,dy:0,
  save(x,y){ctx.save();ctx.translate(x,y);},restore(){ctx.restore();},
  begin(){ctx.beginPath();},m(x,y){ctx.moveTo(x,y);},l(x,y){ctx.lineTo(x,y);},
  q(cx,cy,x,y){ctx.quadraticCurveTo(cx,cy,x,y);},close(){ctx.closePath();},
  fill(c){ctx.fillStyle=c;ctx.fill();},stroke(c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();},
  dot(x,y,rr,c){ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fillStyle=c;ctx.fill();}};}
function SvgPen(){const el=[];let d="",tx=0,ty=0,stack=[];return{el,
  save(x,y){stack.push([tx,ty]);tx+=x;ty+=y;},restore(){[tx,ty]=stack.pop();},
  begin(){d="";},m(x,y){d+=`M${(x+tx).toFixed(1)} ${(y+ty).toFixed(1)}`;},l(x,y){d+=`L${(x+tx).toFixed(1)} ${(y+ty).toFixed(1)}`;},
  q(cx,cy,x,y){d+=`Q${(cx+tx).toFixed(1)} ${(cy+ty).toFixed(1)} ${(x+tx).toFixed(1)} ${(y+ty).toFixed(1)}`;},close(){d+="Z";},
  fill(c){el.push(`<path d="${d}" fill="${c}"/>`);},stroke(c,w){el.push(`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`);},
  dot(x,y,rr,c){el.push(`<circle cx="${(x+tx).toFixed(1)}" cy="${(y+ty).toFixed(1)}" r="${rr.toFixed(1)}" fill="${c}"/>`);}};}
// ---------- device + border shapes (via pen) ----------
function drawBorders(p,rd,col){
  const rings=S.rings, style=S.border;
  for(let ring=0;ring<rings;ring++){
    const rr=rd*(1.0+ring*0.075);
    if(style==="plain"){p.begin();circlePath(p,rr);p.stroke(col,rd*0.035);}
    else if(style==="rope"){const n=Math.floor(rr*0.5);for(let i=0;i<n;i++){const a=i/n*Math.PI*2,c=Math.cos(a),s=Math.sin(a);
      p.begin();p.m(c*(rr-rd*0.03),s*(rr-rd*0.03));p.l(c*(rr+rd*0.03)-s*rd*0.05,s*(rr+rd*0.03)+c*rd*0.05);p.stroke(col,rd*0.028);}}
    else{const big=style==="beaded";const n=Math.floor(rr*(big?0.28:0.5));
      for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.dot(Math.cos(a)*rr,Math.sin(a)*rr,rd*(big?0.045:0.022),col);}}
  }
}
function circlePath(p,rr){const k=0.5523*rr;p.m(rr,0);p.q(rr,k,k,rr);p.q(-k,rr,-rr,0);p.q(-rr,-k,-k,-rr);p.q(k,-rr,rr,0);p.close();}
function drawDevice(p,rd,col){
  const t=S.device;
  if(t==="rosette"){const r=mulberry32(hashStr(S.seed+"|rose"));const N=4+Math.floor(r()*5),inner=rd*(0.3+r()*0.2);
    p.begin();for(let i=0;i<=N*2;i++){const a=i/(N*2)*Math.PI*2-Math.PI/2,rr=(i%2?inner:rd*0.82);
      i?p.l(Math.cos(a)*rr,Math.sin(a)*rr):p.m(Math.cos(a)*rr,Math.sin(a)*rr);}p.close();p.fill(col);
    p.dot(0,0,rd*0.16,shade(col,-0.001));}
  else if(t==="emblem"){emblem(p,S.emblem,rd*0.72,col);}
  else if(t==="mark"){const r=mulberry32(hashStr(S.seed+"|mark"));const w=rd*0.07;
    p.begin();p.m(0,-rd*0.7);p.l(0,rd*0.65);p.stroke(col,w);               // staff
    p.begin();p.m(-rd*0.3,-rd*0.4);p.l(rd*0.3,-rd*0.4);p.stroke(col,w);     // cross bar
    // seeded flags/limbs
    for(let i=0;i<3;i++){const y=-rd*0.55+i*rd*0.4,dir=r()>.5?1:-1,len=rd*(0.25+r()*0.25);
      p.begin();p.m(0,y);p.q(dir*len,y-rd*0.12,dir*len,y+rd*0.18);p.stroke(col,w);}
    p.begin();p.m(-rd*0.28,rd*0.65);p.l(rd*0.28,rd*0.65);p.stroke(col,w);}  // foot
}
function emblem(p,kind,r,col){
  const S2=r;
  if(kind==="bee"){p.begin();p.m(0,-S2*0.9);p.q(S2*0.5,-S2*0.6,S2*0.42,0);p.q(S2*0.5,S2*0.7,0,S2*0.95);p.q(-S2*0.5,S2*0.7,-S2*0.42,0);p.q(-S2*0.5,-S2*0.6,0,-S2*0.9);p.close();p.fill(col);
    // stripes as negative — draw wings
    p.begin();p.m(0,-S2*0.2);p.q(S2*1.0,-S2*0.7,S2*0.7,-S2*0.05);p.q(S2*0.4,S2*0.1,0,0);p.close();p.fill(col);
    p.begin();p.m(0,-S2*0.2);p.q(-S2*1.0,-S2*0.7,-S2*0.7,-S2*0.05);p.q(-S2*0.4,S2*0.1,0,0);p.close();p.fill(col);}
  else if(kind==="key"){p.begin();circlePath(p,S2*0.35);p.stroke(col,S2*0.16);
    p.begin();p.m(0,S2*0.35);p.l(0,S2*0.9);p.stroke(col,S2*0.16);
    p.begin();p.m(0,S2*0.72);p.l(S2*0.3,S2*0.72);p.m(0,S2*0.55);p.l(S2*0.24,S2*0.55);p.stroke(col,S2*0.12);}
  else if(kind==="anchor"){p.begin();p.m(0,-S2*0.7);p.l(0,S2*0.6);p.stroke(col,S2*0.14);   // shank
    p.begin();p.m(-S2*0.4,-S2*0.5);p.l(S2*0.4,-S2*0.5);p.stroke(col,S2*0.12);               // stock
    p.begin();p.save(0,-S2*0.82);circlePath(p,S2*0.16);p.restore();p.stroke(col,S2*0.08);   // ring
    p.begin();p.m(-S2*0.55,S2*0.15);p.q(-S2*0.55,S2*0.72,0,S2*0.68);p.q(S2*0.55,S2*0.72,S2*0.55,S2*0.15);p.stroke(col,S2*0.13); // flukes
    p.begin();p.m(-S2*0.55,S2*0.15);p.l(-S2*0.68,S2*0.02);p.m(S2*0.55,S2*0.15);p.l(S2*0.68,S2*0.02);p.stroke(col,S2*0.1);}     // barbs
  else if(kind==="crescent"){const Ro=S2*0.85;p.begin();p.m(0,-Ro);p.q(-Ro*1.45,0,0,Ro);p.q(-Ro*0.28,0,0,-Ro);p.close();p.fill(col);
    p.dot(Ro*0.5,-Ro*0.36,S2*0.14,col);}
  else if(kind==="oak"){p.begin();p.m(0,S2*0.9);p.q(-S2*0.1,0,0,-S2*0.9);p.q(S2*0.1,0,0,S2*0.9);p.close();p.fill(col);
    for(let i=-2;i<=2;i++){if(!i)continue;const y=i*S2*0.32,dir=i>0?1:-1;
      p.begin();p.m(0,y);p.q(dir*S2*0.5,y-S2*0.28,dir*S2*0.62,y-S2*0.02);p.q(dir*S2*0.3,y+S2*0.05,0,y);p.close();p.fill(col);}}
  else if(kind==="quill"){p.begin();p.m(-S2*0.7,S2*0.85);p.q(S2*0.1,-S2*0.2,S2*0.55,-S2*0.85);p.q(S2*0.7,-S2*0.4,S2*0.2,S2*0.1);p.q(-S2*0.1,S2*0.45,-S2*0.7,S2*0.85);p.close();p.fill(col);
    p.begin();p.m(-S2*0.7,S2*0.85);p.l(S2*0.4,-S2*0.55);p.stroke(shade(col,-0.15),S2*0.04);}
  else{ // star
    p.begin();const N=5,ro=S2*0.9,ri=S2*0.38;for(let i=0;i<=N*2;i++){const a=i/(N*2)*Math.PI*2-Math.PI/2,rr=i%2?ri:ro;
      i?p.l(Math.cos(a)*rr,Math.sin(a)*rr):p.m(Math.cos(a)*rr,Math.sin(a)*rr);}p.close();p.fill(col);}
}
// ---------- relief pass = borders + device (non-text devices) ----------
function drawRelief(p,rd,col){drawBorders(p,rd,col);if(S.device!=="monogram")drawDevice(p,rd,col);}
// ---------- canvas render ----------
let light={a:-2.2}, press=1, tPrev=0;
function grounds(ctx){
  const g=S.ground;if(g==="transparent")return;
  if(g==="parchment"){const gr=ctx.createLinearGradient(0,0,W,H);gr.addColorStop(0,"#efe3c8");gr.addColorStop(1,"#d9c69f");ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.05;const r=mulberry32(999);for(let i=0;i<400;i++){ctx.fillStyle=r()>.5?"#000":"#fff";ctx.fillRect(r()*W,r()*H,1.4,1.4);}ctx.globalAlpha=1;}
  else if(g==="kraft"){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#b98f5e");gr.addColorStop(1,"#9c7245");ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  else if(g==="flap"){ctx.fillStyle="#e7dcc4";ctx.fillRect(0,0,W,H);ctx.fillStyle="#d8cbac";
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W/2,H*0.62);ctx.closePath();ctx.fill();
    ctx.strokeStyle="rgba(120,100,70,.5)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W/2,H*0.62);ctx.lineTo(W,0);ctx.stroke();}
}
function render(){
  const g=buildGeo();
  X.setTransform(DPR,0,0,DPR,0,0);
  X.clearRect(0,0,W,H);
  grounds(X);
  const cx=W/2, cy=H/2-6;
  const lv={x:-Math.cos(light.a),y:-Math.sin(light.a)}; // -lv points toward the light/cursor (highlight side)
  // press transform: squish + settle
  const pe=press, sx=1+(1-pe)*0.16*Math.cos(pe*9), sy=1-(1-pe)*0.16*Math.cos(pe*9), sc=0.7+0.3*pe;
  // ---- contact shadow (skip solid dark under transparent for cleaner PNG but keep faint) ----
  X.save();X.translate(cx,cy);
  X.save();X.translate(lv.x*10,lv.y*10+14);X.scale(1.02,0.5);
  X.beginPath();buildBlobPath(X,g);X.closePath();
  X.fillStyle="rgba(0,0,0,"+(S.ground==="transparent"?0.22:0.34)+")";X.filter="blur(11px)";X.fill();X.filter="none";X.restore();
  // ---- wax body ----
  X.scale(sc*sx,sc*sy);
  X.beginPath();buildBlobPath(X,g);X.closePath();
  X.save();X.clip();
  paintWax(X,g,lv);
  // rim: inner shadow ring + light rim
  X.lineWidth=g.R*0.16;X.strokeStyle="rgba(0,0,0,0.33)";X.filter="blur(6px)";X.beginPath();buildBlobPath(X,g);X.closePath();X.stroke();X.filter="none";
  // rim highlight on light side
  const rg=X.createRadialGradient(-lv.x*g.R*0.7,-lv.y*g.R*0.7,g.R*0.2,0,0,g.R*1.15);
  rg.addColorStop(0,"rgba(255,255,255,0)");rg.addColorStop(0.86,"rgba(255,255,255,0)");rg.addColorStop(0.97,"rgba(255,255,255,"+(S.glossy?0.5:0.22)+")");rg.addColorStop(1,"rgba(255,255,255,0)");
  X.fillStyle=rg;X.fillRect(-W,-H,2*W,2*H);
  X.restore();
  // ---- impression (intaglio well shading) ----
  const rd=g.R*0.52;
  X.beginPath();X.arc(0,0,rd*1.18,0,7);X.fillStyle="rgba(0,0,0,0.16)";X.filter="blur(5px)";X.fill();X.filter="none";
  // ---- relief emboss: shadow + highlight + mid, offset by light ----
  const base=material_base(), depth=(S.depth/100)*g.R*0.05*(0.4+0.6*pe);
  const dark=shade(base,-0.42),lite=shade(base,0.5),mid=shade(base,-0.08);
  const wob=(1-pe)*0.06*Math.sin(pe*12);
  X.rotate(wob);
  drawEmbossCanvas(X,rd,depth,lv,dark,lite,mid);
  X.rotate(-wob);
  // motto ring
  if(S.motto.trim())mottoCanvas(X,rd*(1.02+S.rings*0.075)+g.R*0.055,lv,base);
  // specular sweep glint
  if(S.glossy){const sp=X.createRadialGradient(-lv.x*g.R*0.55,-lv.y*g.R*0.55,0,-lv.x*g.R*0.55,-lv.y*g.R*0.55,g.R*0.7);
    sp.addColorStop(0,"rgba(255,255,255,0.35)");sp.addColorStop(1,"rgba(255,255,255,0)");
    X.beginPath();buildBlobPath(X,g);X.closePath();X.save();X.clip();X.fillStyle=sp;X.fillRect(-W,-H,2*W,2*H);X.restore();}
  X.restore();
  document.getElementById("seedline").textContent="seed · "+S.seed+"   ·   "+S.device+"   ·   "+S.motto;
}
function buildBlobPath(ctx,g){const pts=g.pts,n=pts.length;
  ctx.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
  g.drips.forEach(d=>{const c=Math.cos(d.th),s=Math.sin(d.th),tipx=c*(d.base+d.len),tipy=s*(d.base+d.len);
    const px=-s,py=c;ctx.moveTo(c*d.base+px*d.w,s*d.base+py*d.w);
    ctx.quadraticCurveTo(tipx+px*d.w*0.3,tipy+py*d.w*0.3,tipx,tipy);
    ctx.quadraticCurveTo(tipx-px*d.w*0.3,tipy-py*d.w*0.3,c*d.base-px*d.w,s*d.base-py*d.w);});
}
function material_base(){if(S.material==="gold")return "#caa24a";if(S.material==="silver")return "#c4c8d0";return WAX[S.color]||WAX.vermilion;}
function paintWax(ctx,g,lv){
  const m=S.material, base=material_base(), R=g.R;
  if(m==="gold"||m==="silver"){const a=Math.atan2(lv.y,lv.x)+Math.PI/2;
    const gr=ctx.createLinearGradient(Math.cos(a)*R,Math.sin(a)*R,-Math.cos(a)*R,-Math.sin(a)*R);
    const hi=m==="gold"?"#fff2c2":"#ffffff",lo=m==="gold"?"#7a5814":"#5c6068";
    gr.addColorStop(0,lo);gr.addColorStop(0.35,base);gr.addColorStop(0.5,hi);gr.addColorStop(0.65,base);gr.addColorStop(1,lo);
    ctx.fillStyle=gr;ctx.fillRect(-W,-H,2*W,2*H);}
  else{const gr=ctx.createRadialGradient(-lv.x*R*0.5,-lv.y*R*0.5,R*0.05,0,0,R*1.25);
    gr.addColorStop(0,shade(base,S.glossy?0.28:0.14));gr.addColorStop(0.55,base);gr.addColorStop(1,shade(base,-0.3));
    ctx.fillStyle=gr;ctx.fillRect(-W,-H,2*W,2*H);
    if(m==="marble"){const b2=WAX[S.color2]||base;ctx.globalCompositeOperation="overlay";
      const r=mulberry32(hashStr(S.seed+"|marb"));for(let i=0;i<9;i++){const x=(r()*2-1)*R,y=(r()*2-1)*R,rr=R*(0.3+r()*0.5);
        const mg=ctx.createRadialGradient(x,y,0,x,y,rr);mg.addColorStop(0,b2);mg.addColorStop(1,b2+"00");ctx.fillStyle=mg;ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fill();}
      ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";}}
  if(S.glossy){const gl=ctx.createRadialGradient(-lv.x*R*0.6,-lv.y*R*0.6,0,-lv.x*R*0.6,-lv.y*R*0.6,R*0.85);
    gl.addColorStop(0,"rgba(255,255,255,0.4)");gl.addColorStop(0.6,"rgba(255,255,255,0.05)");gl.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=gl;ctx.fillRect(-W,-H,2*W,2*H);}
}
function drawEmbossCanvas(ctx,rd,depth,lv,dark,lite,mid){
  const p=CanvasPen(ctx);const ox=lv.x*depth,oy=lv.y*depth;
  ctx.save();ctx.translate(ox,oy);drawRelief(p,rd,dark);drawMonogram(ctx,rd,dark);ctx.restore();      // shadow (away side pushed by light dir)
  ctx.save();ctx.translate(-ox,-oy);drawRelief(p,rd,lite);drawMonogram(ctx,rd,lite);ctx.restore();     // highlight
  drawRelief(p,rd,mid);drawMonogram(ctx,rd,mid);                                                       // mid
}
function drawMonogram(ctx,rd,col){if(S.device!=="monogram")return;
  ctx.fillStyle=col;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="700 "+(rd*0.95)+"px 'Iowan Old Style',Palatino,Georgia,serif";
  const t=(S.mono||"AW").toUpperCase();
  if(t.length<=1){ctx.fillText(t,0,rd*0.06);}
  else{const sp=rd*0.34;for(let i=0;i<t.length;i++){ctx.save();ctx.translate((i-(t.length-1)/2)*sp,rd*0.06);ctx.fillText(t[i],0,0);ctx.restore();}}
}
function mottoCanvas(ctx,rr,lv,base){const txt=" ✦ "+S.motto.toUpperCase()+" ";const n=txt.length;
  ctx.font="700 "+(rr*0.13)+"px 'Iowan Old Style',Palatino,Georgia,serif";ctx.textAlign="center";ctx.textBaseline="middle";
  for(let i=0;i<n;i++){const a=-Math.PI/2+ (i/n)*Math.PI*2;ctx.save();ctx.rotate(a);ctx.translate(0,-rr);
    ctx.fillStyle=shade(base,0.45);ctx.fillText(txt[i],-lv.x*1.2,-rr*0.02-lv.y*1.2);
    ctx.fillStyle=shade(base,-0.4);ctx.fillText(txt[i],lv.x*1.2,-rr*0.02+lv.y*1.2);
    ctx.fillStyle=shade(base,-0.05);ctx.fillText(txt[i],0,-rr*0.02);ctx.restore();}
}
// ---------- SVG export (layered vector approximation) ----------
function blobD(g){let d="";const pts=g.pts,n=pts.length;
  d+=`M${((pts[0][0]+pts[n-1][0])/2).toFixed(1)} ${((pts[0][1]+pts[n-1][1])/2).toFixed(1)}`;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];d+=`Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${((a[0]+b[0])/2).toFixed(1)} ${((a[1]+b[1])/2).toFixed(1)}`;}
  g.drips.forEach(dr=>{const c=Math.cos(dr.th),s=Math.sin(dr.th),tx=c*(dr.base+dr.len),ty=s*(dr.base+dr.len),px=-s,py=c;
    d+=`M${(c*dr.base+px*dr.w).toFixed(1)} ${(s*dr.base+py*dr.w).toFixed(1)}Q${(tx).toFixed(1)} ${(ty).toFixed(1)} ${(tx).toFixed(1)} ${(ty).toFixed(1)}L${(c*dr.base-px*dr.w).toFixed(1)} ${(s*dr.base-py*dr.w).toFixed(1)}Z`;});
  return d;}
function buildSVG(){const g=buildGeo(),cx=W/2,cy=H/2-6,base=material_base(),rd=g.R*0.52;
  const lv={x:-Math.cos(light.a),y:-Math.sin(light.a)},depth=(S.depth/100)*g.R*0.05;
  const grd={parchment:"#e6d9bd",kraft:"#a97f52",flap:"#e2d6bd",transparent:null}[S.ground];
  const bg=grd?`<rect width="${W}" height="${H}" fill="${grd}"/>`:"";
  const shad=`<ellipse cx="${cx+lv.x*10}" cy="${cy+lv.y*10+14}" rx="${(g.R*1.02).toFixed(1)}" ry="${(g.R*0.5).toFixed(1)}" fill="#000" fill-opacity="0.3" filter="url(#blur)"/>`;
  const waxD=blobD(g);
  const mid=shade(base,-0.08),dark=shade(base,-0.42),lite=shade(base,0.5);
  const P=SvgPen();P.save(-lv.x*depth,-lv.y*depth);drawRelief(P,rd,lite);P.restore();
  P.save(lv.x*depth,lv.y*depth);drawRelief(P,rd,dark);P.restore();
  drawRelief(P,rd,mid);
  let mono="";if(S.device==="monogram"){const t=(S.mono||"AW").toUpperCase(),fs=rd*0.95;
    [[lite,-lv.x*depth,-lv.y*depth],[dark,lv.x*depth,lv.y*depth],[mid,0,0]].forEach(([c,ox,oy])=>{
      mono+=`<text x="${(ox).toFixed(1)}" y="${(rd*0.06+oy).toFixed(1)}" font-family="Palatino,Georgia,serif" font-weight="700" font-size="${fs.toFixed(1)}" fill="${c}" text-anchor="middle" dominant-baseline="middle" letter-spacing="${(-rd*0.05).toFixed(1)}">${t}</text>`;});}
  let motto="";if(S.motto.trim()){const rr=rd*(1.02+S.rings*0.075)+g.R*0.055;
    motto=`<defs><path id="mp" d="M0 -${rr.toFixed(1)} A${rr.toFixed(1)} ${rr.toFixed(1)} 0 1 1 -0.1 -${rr.toFixed(1)}"/></defs>`+
    `<text font-family="Palatino,Georgia,serif" font-weight="700" font-size="${(rr*0.13).toFixed(1)}" fill="${shade(base,-0.05)}" letter-spacing="1.5"><textPath xlink:href="#mp" href="#mp" startOffset="0%">✦ ${S.motto.toUpperCase()} ✦ ${S.motto.toUpperCase()}</textPath></text>`;}
  const grad=`<radialGradient id="wax" cx="${(50-lv.x*20).toFixed(0)}%" cy="${(50-lv.y*20).toFixed(0)}%" r="70%"><stop offset="0%" stop-color="${shade(base,0.24)}"/><stop offset="55%" stop-color="${base}"/><stop offset="100%" stop-color="${shade(base,-0.3)}"/></radialGradient>`;
  const gloss=S.glossy?`<ellipse cx="${(cx-lv.x*g.R*0.5).toFixed(1)}" cy="${(cy-lv.y*g.R*0.5).toFixed(1)}" rx="${(g.R*0.5).toFixed(1)}" ry="${(g.R*0.42).toFixed(1)}" fill="#fff" fill-opacity="0.28" filter="url(#blur)"/>`:"";
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>${grad}</defs>
${bg}${shad}
<g transform="translate(${cx},${cy})"><path d="${waxD}" fill="url(#wax)" stroke="${shade(base,-0.35)}" stroke-width="2"/></g>
<g transform="translate(${cx},${cy})">${gloss.replace(/cx="[^"]*"/,`cx="${(-lv.x*g.R*0.5).toFixed(1)}"`).replace(/cy="[^"]*"/,`cy="${(-lv.y*g.R*0.5).toFixed(1)}"`)}</g>
<g transform="translate(${cx},${cy})">${P.el.join("")}${mono}${motto}</g>
</svg>`;
}
// ---------- interaction ----------
function setLightFromEvent(e){const rect=C.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width)-W/2;
  const y=(e.clientY-rect.top)*(H/rect.height)-H/2;
  light.a=Math.atan2(y,x);}
let dragging=false;
C.addEventListener("pointerdown",e=>{dragging=true;document.getElementById("orbit").checked=false;S.orbit=false;setLightFromEvent(e);C.setPointerCapture(e.pointerId);});
C.addEventListener("pointermove",e=>{if(dragging)setLightFromEvent(e);});
C.addEventListener("pointerup",()=>dragging=false);
// ---------- controls wiring ----------
function bind(id,key,fn){const el=document.getElementById(id);el.addEventListener("input",()=>{
  S[key]=el.type==="checkbox"?el.checked:(["rings","irr","drip","depth"].includes(key)?+el.value:el.value);fn&&fn();writeHash();syncLabels();updateContext();});}
// dim/disable a field's wrapper when it can't affect the current seal
function fieldOn(el,on){const w=el.parentElement;w.style.opacity=on?"":"0.4";w.style.pointerEvents=on?"":"none";el.disabled=!on;}
function updateContext(){
  fieldOn(document.getElementById("mono"),S.device==="monogram");
  fieldOn(document.getElementById("emblem"),S.device==="emblem");
  const metal=S.material==="gold"||S.material==="silver";
  fieldOn(document.getElementById("color"),!metal);
  document.getElementById("color2wrap").style.display=S.material==="marble"?"":"none";
}
function syncControls(){
  document.getElementById("device").value=S.device;document.getElementById("mono").value=S.mono;
  document.getElementById("emblem").value=S.emblem;document.getElementById("motto").value=S.motto;
  document.getElementById("border").value=S.border;document.getElementById("rings").value=S.rings;
  document.getElementById("color").value=S.color;document.getElementById("material").value=S.material;
  document.getElementById("color2").value=S.color2;
  document.getElementById("ground").value=S.ground;document.getElementById("irr").value=S.irr;
  document.getElementById("drip").value=S.drip;document.getElementById("depth").value=S.depth;
  document.getElementById("glossy").checked=S.glossy;document.getElementById("orbit").checked=!!S.orbit;
  syncLabels();updateContext();}
function syncLabels(){document.getElementById("ringsV").textContent=S.rings;document.getElementById("irrV").textContent=S.irr;
  document.getElementById("dripV").textContent=S.drip;document.getElementById("depthV").textContent=S.depth;}
bind("device","device");bind("mono","mono");bind("emblem","emblem");bind("motto","motto");
bind("border","border");bind("rings","rings");bind("color","color");bind("material","material");
bind("color2","color2");bind("ground","ground");bind("irr","irr");bind("drip","drip");bind("depth","depth");
bind("glossy","glossy");
document.getElementById("orbit").addEventListener("input",e=>{S.orbit=e.target.checked;});
function startPress(){press=0;}
document.getElementById("press").addEventListener("click",()=>{const seed=Math.random().toString(36).slice(2,8);deriveFromSeed(seed);S.orbit=document.getElementById("orbit").checked;syncControls();writeHash();startPress();});
document.getElementById("restamp").addEventListener("click",startPress);
document.getElementById("reshape").addEventListener("click",()=>{S.foldSeed=Math.floor(Math.random()*100000);writeHash();startPress();}); // re-roll blob shape only, keep device/color/motto
document.getElementById("link").addEventListener("click",()=>{const b=document.getElementById("link");
  const done=(msg,ms)=>{b.textContent=msg;setTimeout(()=>b.textContent="Copy link",ms);};
  const ok=()=>done("Copied!",1200), fail=()=>{try{prompt("Copy this link:",location.href);}catch(_){}done("Press Ctrl+C",1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(location.href).then(ok,fail);}else{fail();}});
document.getElementById("png").addEventListener("click",()=>{
  const s=2,off=document.createElement("canvas");off.width=W*s;off.height=H*s;const octx=off.getContext("2d");
  octx.imageSmoothingEnabled=true;octx.drawImage(C,0,0,W*s,H*s);
  off.toBlob(b=>download(b,"signet-"+S.seed+".png"));});
document.getElementById("svg").addEventListener("click",()=>{const blob=new Blob([buildSVG()],{type:"image/svg+xml"});download(blob,"signet-"+S.seed+".svg");});
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
// ---------- animation loop ----------
function frame(t){const dt=Math.min(50,t-tPrev||16);tPrev=t;
  if(press<1){press=Math.min(1,press+dt/620);}          // press-down settle
  if(S.orbit&&!dragging){light.a+=dt/2600;}              // living light
  render();requestAnimationFrame(frame);}
// ---------- boot ----------
if(!readHash()){deriveFromSeed(Math.random().toString(36).slice(2,8));}
S.orbit=false;syncControls();writeHash();startPress();requestAnimationFrame(frame);
</script>
