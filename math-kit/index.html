<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathKit — number theory toolbox</title>
<meta name="description" content="Free offline number theory toolbox: prime test, prime factorization, divisors, GCD, LCM, factorial, permutations (nPr), combinations (nCr), and Fibonacci. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/math-kit/">
<style>
  :root{
    --c:#6366f1; --bg:#f8f8fd; --fg:#161627; --muted:#5f5f7d;
    --card:#ffffff; --border:#e4e4f2; --code:#eeeefb;
  }
  [data-theme="dark"]{
    --bg:#0f0f1a; --fg:#e8e8f4; --muted:#9494b4; --card:#181826;
    --border:#2a2a42; --code:#20203a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#a5b4fc);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .fld{flex:1;min-width:120px}
  input{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:11px;
    background:var(--bg);color:var(--fg);font-size:1.1rem;font-family:ui-monospace,monospace}
  input:focus{outline:2px solid var(--c);border-color:var(--c)}
  h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    margin:22px 0 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cell{background:var(--card);padding:12px 15px}
  .cell.wide{grid-column:1 / -1}
  .cell .k{font-size:.76rem;color:var(--muted)}
  .cell .v{font-family:ui-monospace,monospace;font-weight:700;margin-top:2px;word-break:break-all}
  .cell .v.prime{color:var(--c)}
  .hint{color:var(--muted);font-size:.82rem;margin:16px 0 0}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
  @media(max-width:520px){.grid{grid-template-columns:1fr}.cell.wide{grid-column:auto}}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('mk.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">∑</div>
  <div>
    <h1>MathKit</h1>
    <p class="sub">Number theory toolbox</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="row">
      <div class="fld">
        <label for="n">n</label>
        <input id="n" value="360" inputmode="numeric" spellcheck="false">
      </div>
      <div class="fld">
        <label for="r">r / second number</label>
        <input id="r" value="3" inputmode="numeric" spellcheck="false">
      </div>
    </div>

    <h3>Properties of n</h3>
    <div class="grid" id="single"></div>

    <h3>n and r together</h3>
    <div class="grid" id="pair"></div>

    <p class="hint">Everything is exact integer math run in your browser. Very large factorials and
      combinations may exceed JavaScript's safe integer range — those are marked.</p>
  </div>
</main>
<footer>
  MathKit is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/math-kit">Source</a>
</footer>

<script>
// ---- pure functions ----
function isPrime(n){
  n = Number(n);
  if(!Number.isInteger(n) || n < 2) return false;
  if(n % 2 === 0) return n === 2;
  if(n % 3 === 0) return n === 3;
  for(var i = 5; i * i <= n; i += 6){
    if(n % i === 0 || n % (i + 2) === 0) return false;
  }
  return true;
}
function primeFactors(n){
  n = Number(n);
  if(!Number.isInteger(n) || n < 2) return [];
  var f = [], d = 2;
  while(d * d <= n){ while(n % d === 0){ f.push(d); n /= d; } d++; }
  if(n > 1) f.push(n);
  return f;
}
function gcd(a, b){
  a = Math.abs(Number(a)); b = Math.abs(Number(b));
  while(b){ var t = b; b = a % b; a = t; }
  return a;
}
function lcm(a, b){
  a = Number(a); b = Number(b);
  if(a === 0 || b === 0) return 0;
  return Math.abs(a / gcd(a, b) * b);
}
function factorial(n){
  n = Number(n);
  if(!Number.isInteger(n) || n < 0) return null;
  var r = 1;
  for(var i = 2; i <= n; i++) r *= i;
  return r;
}
function nPr(n, r){
  n = Number(n); r = Number(r);
  if(!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return null;
  var res = 1;
  for(var i = 0; i < r; i++) res *= (n - i);
  return res;
}
function nCr(n, r){
  n = Number(n); r = Number(r);
  if(!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) return null;
  r = Math.min(r, n - r);
  var res = 1;
  for(var i = 0; i < r; i++) res = res * (n - i) / (i + 1);
  return Math.round(res);
}
function fib(n){
  n = Number(n);
  if(!Number.isInteger(n) || n < 0) return null;
  var a = 0, b = 1;
  for(var i = 0; i < n; i++){ var t = a + b; a = b; b = t; }
  return a;
}
function divisors(n){
  n = Number(n);
  if(!Number.isInteger(n) || n < 1) return [];
  var out = [];
  for(var i = 1; i * i <= n; i++){
    if(n % i === 0){ out.push(i); if(i !== n / i) out.push(n / i); }
  }
  return out.sort(function(a, b){ return a - b; });
}

if(typeof module !== 'undefined') module.exports = {
  isPrime, primeFactors, gcd, lcm, factorial, nPr, nCr, fib, divisors
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var nEl = document.getElementById('n');
  var rEl = document.getElementById('r');
  var singleEl = document.getElementById('single');
  var pairEl = document.getElementById('pair');

  function safeInt(x){ var v = Number(x); return Number.isInteger(v) ? v : null; }
  function fmt(v){
    if(v === null) return '—';
    if(typeof v === 'number' && !Number.isSafeInteger(v) && Math.abs(v) >= 9e15) return v.toExponential(4) + ' (approx)';
    return (typeof v === 'number') ? v.toLocaleString() : v;
  }
  function cell(k, v, cls, wide){
    return '<div class="cell'+(wide?' wide':'')+'"><div class="k">'+k+'</div><div class="v'+
      (cls?' '+cls:'')+'">'+v+'</div></div>';
  }
  function render(){
    var n = safeInt(nEl.value);
    if(n === null){
      singleEl.innerHTML = cell('n', 'Enter a whole number', '', true);
      pairEl.innerHTML = '';
    } else {
      var pf = primeFactors(n);
      singleEl.innerHTML =
        cell('Prime?', isPrime(n) ? 'Yes' : 'No', isPrime(n) ? 'prime' : '') +
        cell('n!', fmt(factorial(n))) +
        cell('Prime factorization', pf.length ? pf.join(' × ') : '—', '', true) +
        cell('Divisors (' + divisors(n).length + ')', divisors(n).join(', ') || '—', '', true) +
        cell('Fibonacci F(n)', n >= 0 ? fmt(fib(n)) : '—', '', true);
    }
    var r = safeInt(rEl.value);
    if(n === null || r === null){
      pairEl.innerHTML = cell('n and r', 'Enter two whole numbers', '', true);
    } else {
      pairEl.innerHTML =
        cell('GCD(n, r)', fmt(gcd(n, r))) +
        cell('LCM(n, r)', fmt(lcm(n, r))) +
        cell('Permutations nPr', fmt(nPr(n, r))) +
        cell('Combinations nCr', fmt(nCr(n, r)));
    }
    try{ localStorage.setItem('mk.n', nEl.value); localStorage.setItem('mk.r', rEl.value); }catch(e){}
  }
  nEl.addEventListener('input', render);
  rEl.addEventListener('input', render);
  try{
    var sn = localStorage.getItem('mk.n'); if(sn !== null) nEl.value = sn;
    var sr = localStorage.getItem('mk.r'); if(sr !== null) rEl.value = sr;
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('mk.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('mk.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
