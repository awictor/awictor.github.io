<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwosComplement — Signed Integer Binary / Hex Viewer</title>
<meta name="description" content="See any integer in two's-complement binary and hex across 8, 16, 32 and 64 bits, and interpret a bit pattern as signed or unsigned. BigInt-accurate, 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('twos-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#4f46e5;
    --bg:#f4f4fb; --card:#ffffff; --fg:#171826; --muted:#5c6072; --line:#e4e4f0; --shadow:0 1px 3px rgba(0,0,0,.08);
    --sign:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0c0d16; --card:#161824; --fg:#eef0f7; --muted:#9296ac; --line:#242736; --shadow:0 1px 3px rgba(0,0,0,.5);
    --sign:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#4338ca);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:800}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.15rem}
  input.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .bits{display:flex;gap:6px;margin-top:12px}
  .bits button{flex:1;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer;font:inherit}
  .bits button.active{background:var(--c);color:#fff;border-color:var(--c)}
  h2{font-size:.8rem;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .binary{word-break:break-all;line-height:2;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .binary .s{color:var(--sign);font-weight:800;background:color-mix(in srgb,var(--sign) 15%,transparent);border-radius:3px;padding:0 2px}
  .rows{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:12px;font-size:.95rem}
  .rows .k{color:var(--muted)}
  .rows .v{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;word-break:break-all}
  .err{color:var(--sign);font-size:.85rem;margin-top:10px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo mono">±2</div>
    <div><h1>TwosComplement</h1><div class="sub">Signed integer bits</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="dec">Signed decimal integer</label>
    <input class="mono" id="dec" value="-42" spellcheck="false" inputmode="numeric">
    <div class="bits" id="bits">
      <button data-b="8" type="button">8-bit</button>
      <button data-b="16" type="button">16-bit</button>
      <button data-b="32" class="active" type="button">32-bit</button>
      <button data-b="64" type="button">64-bit</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <h2>Two's-complement bits</h2>
    <div class="binary" id="binary"></div>
    <div class="rows">
      <div class="k">Hex</div><div class="v" id="hex"></div>
      <div class="k">Unsigned value</div><div class="v" id="uns"></div>
      <div class="k">Range</div><div class="v" id="range"></div>
    </div>
  </div>
  <div class="card">
    <h2>Interpret a bit pattern</h2>
    <label for="pat">Binary or 0x-hex (at the width above)</label>
    <input class="mono" id="pat" value="0xFFFFFFD6" spellcheck="false">
    <div class="rows">
      <div class="k">As signed</div><div class="v" id="asSigned"></div>
      <div class="k">As unsigned</div><div class="v" id="asUnsigned"></div>
    </div>
    <div class="err" id="err2"></div>
  </div>
</main>
<footer>
  Two's complement stores a negative number as (2ⁿ + value), so the top bit is the sign. BigInt-accurate through 64 bits. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/twos-complement">Source</a>.
</footer>

<script>
  // ---------- pure logic (BigInt) ----------
  const WIDTHS = [8, 16, 32, 64];

  function chkBits(bits){
    if(!WIDTHS.includes(Number(bits))) throw new Error('bits must be 8, 16, 32 or 64');
    return BigInt(bits);
  }

  // Encode a signed integer as its two's-complement pattern.
  function encode(value, bits){
    const b = chkBits(bits);
    let v;
    try{ v = BigInt(String(value).trim()); }catch{ throw new Error('enter an integer'); }
    const min = -(1n << (b - 1n)), max = (1n << (b - 1n)) - 1n;
    if(v < min || v > max) throw new Error(`out of range for ${bits}-bit (${min}…${max})`);
    const u = v < 0n ? (1n << b) + v : v;
    return { unsigned: u, binary: u.toString(2).padStart(Number(bits), '0'), hex: u.toString(16).padStart(Number(bits) / 4, '0') };
  }

  // Interpret an unsigned bit pattern as a signed integer.
  function decode(unsigned, bits){
    const b = chkBits(bits);
    const u = BigInt(unsigned);
    if(u < 0n || u >= (1n << b)) throw new Error('pattern out of range for width');
    return u >= (1n << (b - 1n)) ? u - (1n << b) : u;
  }

  // Parse a binary / 0x-hex / decimal string to an unsigned BigInt.
  function parsePattern(str, bits){
    const b = chkBits(bits);
    const s = String(str).trim().replace(/\s+/g, '');
    let u;
    try{
      if(/^0x/i.test(s)) u = BigInt(s);
      else if(/^[01]+$/.test(s)) u = BigInt('0b' + s);
      else u = BigInt(s);
    }catch{ throw new Error('invalid pattern'); }
    if(u < 0n || u >= (1n << b)) throw new Error(`pattern does not fit in ${bits} bits`);
    return u;
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('binary')){
    const $ = id => document.getElementById(id);
    let bits = 32;

    function render(){
      try{
        const e = encode($('dec').value, bits);
        const grouped = e.binary.replace(/(.)(?=(.{4})+$)/g, '$1 ');
        $('binary').innerHTML = `<span class="s">${e.binary[0]}</span>` + grouped.slice(1);
        $('hex').textContent = '0x' + e.hex;
        $('uns').textContent = e.unsigned.toString();
        const min = -(1n << (BigInt(bits) - 1n)), max = (1n << (BigInt(bits) - 1n)) - 1n;
        $('range').textContent = `${min} … ${max}`;
        $('err').textContent = '';
      }catch(ex){ $('binary').textContent = ''; $('hex').textContent = ''; $('uns').textContent = ''; $('range').textContent = ''; $('err').textContent = ex.message; }
      renderPattern();
    }
    function renderPattern(){
      try{
        const u = parsePattern($('pat').value, bits);
        $('asSigned').textContent = decode(u, bits).toString();
        $('asUnsigned').textContent = u.toString();
        $('err2').textContent = '';
      }catch(ex){ $('asSigned').textContent = ''; $('asUnsigned').textContent = ''; $('err2').textContent = ex.message; }
    }
    $('bits').querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      bits = +btn.dataset.b;
      $('bits').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === btn));
      render();
    }));
    $('dec').addEventListener('input', render);
    $('pat').addEventListener('input', renderPattern);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('twos-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { WIDTHS, encode, decode, parsePattern };
</script>
</body>
</html>
