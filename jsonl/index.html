<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSONLines — JSON Array ⇄ JSONL Converter</title>
<meta name="description" content="Convert between a JSON array and JSONL (newline-delimited JSON) in both directions. The format used for ML datasets and log streams. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('jsonl-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#d97706;
    --bg:#f8f6f2; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e8e2d8; --shadow:0 1px 3px rgba(0,0,0,.08); --bad:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#15120c; --card:#1f1a12; --fg:#f2ede4; --muted:#a39a89; --line:#332b1e; --shadow:0 1px 3px rgba(0,0,0,.5); --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:900px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#b45309);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:900px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .modes button{padding:9px 16px;border:0;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit}
  .modes button.on{background:var(--c);color:#fff;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;min-height:220px;resize:vertical}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;margin:0;white-space:pre;min-height:220px}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;min-height:1em}
  .err{color:var(--bad)}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:900px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">{ }</div>
    <div><h1>JSONLines</h1><div class="sub">JSON array ⇄ JSONL (newline-delimited JSON)</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="modes" id="modes">
      <button type="button" data-m="toJsonl">Array → JSONL</button>
      <button type="button" data-m="fromJsonl">JSONL → Array</button>
    </div>
    <div class="grid">
      <div>
        <label for="input">Input</label>
        <textarea id="input" spellcheck="false">[
  {"id": 1, "name": "Ada"},
  {"id": 2, "name": "Linus"}
]</textarea>
      </div>
      <div>
        <label>Output</label>
        <pre id="out"></pre>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="btns"><button class="act" id="copy" type="button">Copy output</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/jsonl">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function toJsonl(text){
    let data;
    try{ data = JSON.parse(text); }catch(e){ throw new Error('invalid JSON: ' + e.message); }
    if(!Array.isArray(data)) throw new Error('input must be a JSON array');
    return data.map(x => JSON.stringify(x)).join('\n');
  }

  function fromJsonl(text){
    const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const arr = lines.map((l, i) => {
      try{ return JSON.parse(l); }
      catch(e){ throw new Error('invalid JSON on line ' + (i + 1)); }
    });
    return JSON.stringify(arr, null, 2);
  }

  function lineCount(text){
    return String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean).length;
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    let mode = 'toJsonl';

    function render(){
      const text = $('input').value;
      try{
        if(mode === 'toJsonl'){
          const out = toJsonl(text);
          $('out').textContent = out;
          $('meta').textContent = `${out ? out.split('\n').length : 0} JSONL records`;
        }else{
          const out = fromJsonl(text);
          $('out').textContent = out;
          $('meta').textContent = `${lineCount(text)} records → array`;
        }
        $('meta').classList.remove('err');
      }catch(e){ $('out').textContent = ''; $('meta').textContent = e.message; $('meta').classList.add('err'); }
    }

    $('modes').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      mode = b.dataset.m;
      [...$('modes').children].forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('modes').querySelector('[data-m="toJsonl"]').classList.add('on');
    $('input').addEventListener('input', render);
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy output', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('jsonl-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { toJsonl, fromJsonl, lineCount };
</script>
</body>
</html>
