<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Apsis</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070f;
    font-family:"Trebuchet MS",Segoe UI,system-ui,sans-serif;color:#dfe9ff;-webkit-user-select:none;user-select:none}
  #c{display:block;position:fixed;inset:0}
  #hud{position:fixed;top:14px;left:16px;pointer-events:none;text-shadow:0 2px 8px #000;line-height:1.25;display:none}
  #hud .sc{font-size:34px;font-weight:700;letter-spacing:1px}
  #hud .sub{font-size:14px;opacity:.85}
  #mult{position:fixed;top:16px;right:18px;text-align:right;pointer-events:none;text-shadow:0 2px 8px #000;display:none}
  #mult .x{font-size:30px;font-weight:700;color:#7fe9ff}
  #pips{margin-top:4px}
  .pip{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px;background:#7fe9ff;box-shadow:0 0 8px #7fe9ff}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,7,15,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-align:center}
  #over h1{margin:0;font-size:40px;letter-spacing:6px;color:#ff7a59;text-shadow:0 0 24px #ff7a5966}
  #over img{margin:14px 0;border-radius:10px;box-shadow:0 10px 40px #000a;border:1px solid #ffffff22}
  #over .hint{font-size:15px;opacity:.8}
  #over .cp{font-size:13px;opacity:.7;margin-top:6px;color:#7fe9ff}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #title h1{font-size:66px;margin:0;letter-spacing:14px;color:#7fe9ff;text-shadow:0 0 30px #7fe9ff55}
  #title p{max-width:420px;opacity:.85;font-size:16px;line-height:1.5}
  #title .go{margin-top:10px;font-size:18px;color:#ff7a59;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.35}}
  #legend{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;max-width:440px;font-size:13px;opacity:.9}
  #legend span{display:inline-flex;align-items:center;gap:6px}
  #legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  #tinfo{margin-top:16px;font-size:14px;letter-spacing:1px}
  #tinfo .b{color:#7fe9ff;font-weight:700}
  #tinfo .g{color:#ff7a59}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="sc" id="score">0</div><div class="sub" id="alt">0 m &middot; best 0</div></div>
<div id="mult"><span class="x" id="x">x1</span><div id="pips"></div></div>
<div id="title">
  <h1>APSIS</h1>
  <p>You are a mote locked in orbit. <b>Tap</b> (Space / click) to release on the tangent and sling to the next peg. Chain captures to climb. Don't fall.</p>
  <div id="legend">
    <span><i style="background:#7fe9ff"></i>orbit</span>
    <span><i style="background:#ff7a59"></i>crumbles</span>
    <span><i style="background:#c58bff"></i>drifts</span>
    <span><i style="background:#ffd24a"></i>shrinks</span>
    <span><i style="background:#66ff9e"></i>pulls</span>
  </div>
  <div id="tinfo"></div>
  <div class="go">tap to launch</div>
</div>
<div id="over">
  <h1>DRIFTED</h1>
  <a id="cardlink" download="apsis.png" title="save run card"><img id="card" alt="run card"></a>
  <div class="hint">Tap card to save &middot; tap elsewhere or press <b>R</b> to relaunch this seed</div>
  <div class="cp" id="cp"></div>
</div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR=1,starsReady=false;
const REDUCE=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches), MO=REDUCE?0:1;
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  if(starsReady)makeStars();}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v, mod=(a,n)=>((a%n)+n)%n, TAU=Math.PI*2;

// ---- seed + deterministic rng ----
function getSeed(){const m=location.hash.match(/seed=([0-9a-z]+)/i);return m?m[1]:Math.random().toString(36).slice(2,8);}
let SEED=getSeed();
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng;

// ---- peg archetypes ----
const TYPES={
  normal :{col:'#7fe9ff',pitch:440},
  crumble:{col:'#ff7a59',pitch:300},
  drift  :{col:'#c58bff',pitch:540},
  shrink :{col:'#ffd24a',pitch:640},
  well   :{col:'#66ff9e',pitch:250}
};
let pegs,genY,MARGIN=22;
function pegX(p){let x=MARGIN+p.frac*(W-2*MARGIN);if(p.driftAmp)x+=Math.sin(G.time*0.0016+p.ph)*p.driftAmp;return clamp(x,MARGIN,W-MARGIN);}
function pegR(p){return p.type==='shrink'?p.r*(0.55+0.45*Math.abs(Math.sin(p.t*0.045))):p.r;}
function captureR(p){return pegR(p)+clamp(52-diff()*2,30,52);}
function diff(){return G.peak/1000;}
function baseOm(){return 0.055+Math.min(0.055,diff()*0.006);}
function pickType(d){const r=rng();if(d<0.9)return 'normal';
  if(r<0.14+Math.min(0.14,d*0.03))return 'crumble';
  if(r<0.30)return 'drift';if(r<0.44)return 'shrink';if(r<0.53)return 'well';return 'normal';}
function genRows(uptoY){
  while(genY>uptoY){
    const d=(-genY)/1000;
    genY-=100+Math.min(150,d*12)+rng()*45;
    if(genY<-500&&rng()<0.08)continue;            // void gap
    const n=(d>1&&rng()<0.25)?2:1;
    for(let k=0;k<n;k++){
      const t=pickType(d);
      pegs.push({frac:0.14+rng()*0.72,y:genY,r:t==='shrink'?17:14,type:t,alive:true,
        ph:rng()*TAU,driftAmp:t==='drift'?36+rng()*44:0,t:0,dieAt:0});
    }
  }
}

// ---- state ----
const P={mode:'orbit',peg:null,leaving:null,r:44,ang:-Math.PI/2,om:0.055,dir:1,x:0,y:0,vx:0,vy:0,trail:[]};
const G={time:0,frame:0,camY:0,camGoal:0,peak:0,score:0,combo:0,maxCombo:0,
  best:+localStorage.getItem('apsis_best')||0,dead:false,started:false,shake:0,hitstop:0,slow:1,slowT:0,coastT:0,danger:0,bgHue:220};
let particles,rings,stars,runPath,ghost;

function makeStars(){stars=[];const R=mulberry32(0xA95),rx=Math.max(W||0,2000),ry=Math.max(H||0,2000);
  for(let i=0;i<130;i++)stars.push({x:R()*rx,y:R()*ry,dp:0.08+R()*0.5,s:R()*1.6+0.4});starsReady=true;}
function loadGhost(){try{const g=JSON.parse(localStorage.getItem('apsis_ghost_'+SEED));
  ghost=(g&&g.v===2&&g.path&&g.path.length>=3)?g:null;if(ghost)ghost._i=0;}catch(e){ghost=null;}}

function reset(){
  rng=mulberry32(fnv(SEED));pegs=[];genY=-1;particles=[];rings=[];runPath=[];
  pegs.push({frac:0.5,y:0,r:16,type:'normal',alive:true,ph:0,driftAmp:0,t:0,dieAt:0});
  genRows(-H*1.6);
  G.time=0;G.frame=0;G.peak=0;G.score=0;G.combo=0;G.maxCombo=0;G.dead=false;G.danger=0;G.shake=0;G.hitstop=0;G.slow=1;G.slowT=0;G.coastT=0;G.bgHue=220;
  P.mode='orbit';P.peg=pegs[0];P.leaving=null;P.r=44;P.ang=-Math.PI/2;P.dir=1;P.om=baseOm();P.trail.length=0;
  P.x=pegX(P.peg)+Math.cos(P.ang)*P.r;P.y=P.peg.y+Math.sin(P.ang)*P.r;
  G.camGoal=P.y-H*0.6;G.camY=G.camGoal;
  loadGhost();updateTitleInfo();document.getElementById('over').style.display='none';
}
function updateTitleInfo(){const el=document.getElementById('tinfo');if(!el)return;
  const parts=[];if(G.best>0)parts.push('best <span class="b">'+G.best.toLocaleString()+'</span>');
  if(ghost)parts.push('<span class="g">ghost loaded</span>');
  el.innerHTML=parts.join('  &middot;  ');}

// ---- audio ----
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function blip(f,dur,type,gain,f2){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);
  g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(gain||0.12,a.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur+0.02);}

// ---- fx helpers ----
function spawn(x,y,n,col,spd){for(let i=0;i<n;i++){const a=rng()*TAU,s=spd*(0.3+rng());particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col});}}
function ping(x,y,col,r){rings.push({x,y,r:r||10,max:110,life:1,col});}
function copyText(text,ok){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok,()=>execCopy(text,ok));
  }else execCopy(text,ok);
}
function execCopy(text,ok){ // fallback for file:// / non-secure contexts
  try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();const done=document.execCommand('copy');document.body.removeChild(ta);
    if(done)ok();}catch(e){/* leave URL visible for manual copy */}
}

function release(){
  if(P.mode!=='orbit')return;
  const s=Math.sin(P.ang),c=Math.cos(P.ang),sp=baseOm()*P.r;
  P.vx=-s*P.dir*sp;P.vy=c*P.dir*sp;
  P.mode='coast';P.leaving=P.peg;P.coastT=0;G.coastT=0;
  if(P.peg.type==='crumble')P.peg.dieAt=G.time+240;
  G.shake=10;spawn(P.x,P.y,16,'#fff',6);ping(P.x,P.y,'#ffffff',pegR(P.peg));
  blip(280+G.combo*34,0.09,'sawtooth',0.1,120);
}

function capture(p,dist,edge){
  const T=TYPES[p.type];
  P.mode='orbit';P.peg=p;P.leaving=null;
  P.r=clamp(dist,26,72);
  const rx=P.x-pegX(p),ry=P.y-p.y;P.ang=Math.atan2(ry,rx);P.om=baseOm()*P.dir;
  if(G.coastT<150){G.combo++;}else{G.combo=1;}
  G.maxCombo=Math.max(G.maxCombo,G.combo);
  G.score+=Math.round((10+G.combo*6)*(1+diff()*0.25));
  G.shake=6;G.hitstop=55;
  ping(pegX(p),p.y,T.col,pegR(p));spawn(P.x,P.y,10,T.col,4);
  blip(T.pitch*(1+G.combo*0.03),0.12,'triangle',0.12);
  if(edge<0.16){G.slow=0.32;G.slowT=200;blip(1400,0.08,'sine',0.06);} // near-miss slow-mo
}

function die(){
  if(G.dead)return;G.dead=true;G.slow=1;
  blip(320,0.7,'sawtooth',0.16,70);
  spawn(P.x,P.y,40,'#ff7a59',8);
  if(G.score>G.best)G.best=G.score;
  const prev=ghost?ghost.score:0;
  try{
    localStorage.setItem('apsis_best',G.best);
    if(G.score>prev&&runPath.length>=3)localStorage.setItem('apsis_ghost_'+SEED,JSON.stringify({v:2,score:G.score,path:runPath}));
  }catch(e){/* storage unavailable (private mode / quota) — non-fatal */}
  const dataUrl=makeCard();
  document.getElementById('card').src=dataUrl;
  document.getElementById('cardlink').href=dataUrl;
  const url=location.origin+location.pathname+'#seed='+SEED;
  const cp=document.getElementById('cp');cp.textContent=url;
  copyText(url,()=>cp.textContent='seed link copied ✓  '+url);
  document.getElementById('over').style.display='flex';
}

// ---- update ----
function step(dt){
  G.frame++;G.time+=dt;
  if(G.slowT>0){G.slowT-=dt;if(G.slowT<=0)G.slow=1;}
  if(G.hitstop>0){G.hitstop-=dt;return;}
  const d=Math.min(dt,34)/16.67*G.slow;
  G.bgHue=mod(220+G.peak*0.03,360);
  for(const p of pegs){p.t+=d;if(p.type==='crumble'&&p.dieAt&&G.time>p.dieAt&&p.alive){p.alive=false;spawn(pegX(p),p.y,14,TYPES.crumble.col,4);blip(180,0.15,'square',0.08,90);}}

  if(P.mode==='orbit'){
    P.ang+=P.om*d;
    P.x=pegX(P.peg)+Math.cos(P.ang)*P.r;P.y=P.peg.y+Math.sin(P.ang)*P.r;
  }else{
    G.coastT+=d;
    for(const p of pegs){if(p.type!=='well'||!p.alive)continue;
      const dx=pegX(p)-P.x,dy=p.y-P.y,dd=Math.hypot(dx,dy);
      if(dd<250&&dd>1){const f=0.30*(1-dd/250)*d/dd;P.vx+=dx*f;P.vy+=dy*f;}}
    P.x+=P.vx*d;P.y+=P.vy*d;
    if(P.x<MARGIN){P.x=MARGIN;P.vx=Math.abs(P.vx);wall();}
    else if(P.x>W-MARGIN){P.x=W-MARGIN;P.vx=-Math.abs(P.vx);wall();}
    if(P.leaving){const dx=P.x-pegX(P.leaving),dy=P.y-P.leaving.y;if(Math.hypot(dx,dy)>captureR(P.leaving)+3)P.leaving=null;}
    for(const p of pegs){if(!p.alive||p===P.leaving)continue;
      const dx=P.x-pegX(p),dy=P.y-p.y,dist=Math.hypot(dx,dy),cr=captureR(p);
      if(dist<cr){capture(p,dist,(cr-dist)/cr);break;}}
    if(G.coastT>150){G.combo=0;}
  }

  P.trail.unshift({x:P.x,y:P.y});if(P.trail.length>24)P.trail.pop();
  G.peak=Math.max(G.peak,-P.y);
  G.camGoal=Math.min(G.camGoal,P.y-H*0.6);
  G.camY+=(G.camGoal-G.camY)*Math.min(1,0.09*d);
  G.danger+=(0.02+diff()*0.03)*d;
  if(G.frame%2===0)runPath.push(Math.round(G.time),Math.round(P.x),Math.round(P.y));

  for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*d;q.y+=q.vy*d;q.vx*=0.94;q.vy*=0.94;q.life-=0.03*d;if(q.life<=0)particles.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=6*d;r.life-=0.045*d;if(r.life<=0)rings.splice(i,1);}
  if(G.shake>0)G.shake*=Math.pow(0.85,d);
  genRows(G.camGoal-H);
  while(pegs.length>90&&pegs[0].y>G.camY+H+400)pegs.shift();

  if((P.y-G.camY)>H-G.danger)die();
}
function wall(){G.combo=0;G.shake=7;spawn(P.x,P.y,8,'#9fd0ff',5);blip(200,0.05,'square',0.08);}

// ---- render ----
function draw(){
  const sh=G.shake>0.4?(rng()-0.5)*G.shake*MO:0,sy=G.shake>0.4?(rng()-0.5)*G.shake*MO:0;
  ctx.setTransform(DPR,0,0,DPR,sh,sy);
  const top=`hsl(${G.bgHue},45%,7%)`,bot=`hsl(${mod(G.bgHue+40,360)},55%,4%)`;
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,top);bg.addColorStop(1,bot);
  ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);
  // parallax stars
  for(const st of stars){const x=mod(st.x,W),y=mod(st.y-G.camY*st.dp*MO,H);
    ctx.globalAlpha=0.25+st.dp;ctx.fillStyle='#cfe4ff';ctx.fillRect(x,y,st.s,st.s);}
  ctx.globalAlpha=1;
  const oy=-G.camY;
  // pegs
  for(const p of pegs){const py=p.y+oy;if(py<-60||py>H+60)continue;
    const px=pegX(p),T=TYPES[p.type],r=pegR(p),cr=captureR(p);
    ctx.strokeStyle=T.col+'22';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,cr,0,TAU);ctx.stroke();
    const fade=(p.type==='crumble'&&p.dieAt)?clamp((p.dieAt-G.time)/240,0.2,1):1;
    ctx.globalAlpha=fade;
    const gr=ctx.createRadialGradient(px,py,1,px,py,r*2.2);gr.addColorStop(0,T.col);gr.addColorStop(1,T.col+'00');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,r*2.2,0,TAU);ctx.fill();
    ctx.fillStyle=T.col;ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.fill();
    ctx.fillStyle='#0a0f1a';ctx.beginPath();ctx.arc(px,py,r*0.42,0,TAU);ctx.fill();
    ctx.globalAlpha=1;
    if(p===P.peg&&P.mode==='orbit'){ctx.strokeStyle='#ffffff33';ctx.beginPath();ctx.arc(px,py,P.r,0,TAU);ctx.stroke();}
  }
  // ghost (time-indexed: pace is correct at any refresh rate)
  if(ghost){const path=ghost.path,t=G.time;
    while(ghost._i+3<path.length&&path[ghost._i+3]<=t)ghost._i+=3;
    const i=ghost._i;let gx,gy;
    if(i+5<path.length){const t0=path[i],t1=path[i+3],f=t1>t0?clamp((t-t0)/(t1-t0),0,1):0;
      gx=path[i+1]+(path[i+4]-path[i+1])*f;gy=path[i+2]+(path[i+5]-path[i+2])*f;}
    else{gx=path[i+1];gy=path[i+2];}
    ctx.globalAlpha=0.5;ctx.fillStyle='#ff7a59';ctx.beginPath();ctx.arc(gx,gy+oy,5,0,TAU);ctx.fill();
    ctx.globalAlpha=0.16;for(let k=1;k<14;k++){const j=i-k*3;if(j<0)break;
      ctx.beginPath();ctx.arc(path[j+1],path[j+2]+oy,4-k*0.22,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;}
  // player comet
  const hue=mod(190+G.combo*14,360);
  for(let i=P.trail.length-1;i>0;i--){const t=P.trail[i],a=(1-i/P.trail.length);
    ctx.globalAlpha=a*0.6;ctx.fillStyle=`hsl(${hue},90%,70%)`;ctx.beginPath();ctx.arc(t.x,t.y+oy,a*6+1,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  const pgr=ctx.createRadialGradient(P.x,P.y+oy,1,P.x,P.y+oy,20);pgr.addColorStop(0,'#ffffff');pgr.addColorStop(1,`hsla(${hue},90%,60%,0)`);
  ctx.fillStyle=pgr;ctx.beginPath();ctx.arc(P.x,P.y+oy,20,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x,P.y+oy,5,0,TAU);ctx.fill();
  // tangent preview
  if(P.mode==='orbit'){const s=Math.sin(P.ang),c=Math.cos(P.ang);
    ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P.x,P.y+oy);
    ctx.lineTo(P.x-s*P.dir*46,P.y+oy+c*P.dir*46);ctx.stroke();}
  // rings + particles
  for(const r of rings){ctx.globalAlpha=r.life*0.7;ctx.strokeStyle=r.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y+oy,r.r,0,TAU);ctx.stroke();}
  for(const q of particles){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y+oy-1.5,3,3);}
  ctx.globalAlpha=1;
  // danger line
  const dyl=H-G.danger;const dg=ctx.createLinearGradient(0,dyl,0,H);dg.addColorStop(0,'#ff2a4400');dg.addColorStop(1,'#ff2a4455');
  ctx.fillStyle=dg;ctx.fillRect(-20,dyl,W+40,H-dyl+20);
  ctx.strokeStyle='#ff466699';ctx.lineWidth=2;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(0,dyl);ctx.lineTo(W,dyl);ctx.stroke();ctx.setLineDash([]);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // HUD
  document.getElementById('score').textContent=G.score.toLocaleString();
  document.getElementById('alt').innerHTML=Math.round(G.peak/10)+' m &middot; best '+G.best;
  document.getElementById('x').textContent='x'+(G.combo+1);
  const pips=document.getElementById('pips');const want=Math.min(G.combo,10);
  if(pips.childElementCount!==want){pips.innerHTML='';for(let i=0;i<want;i++){const s=document.createElement('span');s.className='pip';pips.appendChild(s);}}
}

// ---- share card ----
function makeCard(){
  const c=document.createElement('canvas');c.width=480;c.height=250;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,250);g.addColorStop(0,'#0b1226');g.addColorStop(1,'#05070f');
  x.fillStyle=g;x.fillRect(0,0,480,250);
  x.strokeStyle='#7fe9ff';x.lineWidth=2;x.strokeRect(6,6,468,238);
  x.textAlign='left';x.fillStyle='#7fe9ff';x.font='bold 30px Trebuchet MS';x.fillText('APSIS',26,50);
  x.fillStyle='#8fb0d8';x.font='13px Trebuchet MS';x.fillText('seed '+SEED,26,72);
  x.fillStyle='#fff';x.font='bold 72px Trebuchet MS';x.fillText(G.score.toLocaleString(),26,150);
  x.fillStyle='#8fb0d8';x.font='14px Trebuchet MS';x.fillText('SCORE',28,168);
  x.fillStyle='#ff7a59';x.font='bold 26px Trebuchet MS';x.fillText(Math.round(G.peak/10)+' m',300,120);
  x.fillText('x'+(G.maxCombo+1),300,160);
  x.fillStyle='#8fb0d8';x.font='13px Trebuchet MS';x.fillText('PEAK ALTITUDE',300,138);x.fillText('MAX COMBO',300,178);
  x.fillStyle='#5f7ba0';x.font='12px Trebuchet MS';x.fillText('#seed='+SEED+'  ·  one thumb, endless sky',26,222);
  return c.toDataURL('image/png');
}

// ---- input ----
function tap(){ac().resume&&ac().resume();
  if(!G.started){G.started=true;document.getElementById('title').style.display='none';
    document.getElementById('hud').style.display='';document.getElementById('mult').style.display='';return;}
  if(G.dead){SEED=getSeed();reset();return;}
  release();}
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();tap();}
  else if(e.key==='r'||e.key==='R'){reset();}});
addEventListener('mousedown',tap);
addEventListener('touchstart',e=>{e.preventDefault();tap();},{passive:false});
// let the run card be saved without the tap bubbling up to restart
(function(){const cl=document.getElementById('cardlink');
  ['mousedown','touchstart','click'].forEach(ev=>cl.addEventListener(ev,e=>e.stopPropagation(),{passive:true}));})();
addEventListener('hashchange',()=>{SEED=getSeed();reset();});

// ---- loop ----
makeStars();reset();
let last=performance.now();
function frame(now){const dt=now-last;last=now;
  try{
    if(G.started&&!G.dead)step(dt);
    else if(G.dead){ // keep particles alive on death screen
      for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vx*=0.94;q.vy*=0.94;q.life-=0.02;if(q.life<=0)particles.splice(i,1);}
    }
    draw();
  }catch(e){console.error(e);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
