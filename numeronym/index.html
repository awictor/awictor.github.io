<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numeronym — a11y / i18n Numeronym Generator</title>
<meta name="description" content="Turn words into numeronyms like a11y (accessibility), i18n (internationalization), and k8s (kubernetes) — first letter + middle count + last letter. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('numeronym-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#14b8a6;
    --bg:#f4f7f7; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e6e6; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0e1414; --card:#171f1f; --fg:#eef4f4; --muted:#93a1a1; --line:#253030; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#0f766e);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:760px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1rem;min-height:90px;resize:vertical}
  .row{display:flex;align-items:center;gap:14px;margin-top:14px}
  .row input[type=range]{flex:1;accent-color:var(--c)}
  .out{font-size:1.4rem;font-weight:700;padding:12px 2px;word-break:break-word}
  .out b{color:var(--c)}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  .egs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .egs button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:.8rem}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:760px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">a11y</div>
    <div><h1>Numeronym</h1><div class="sub">accessibility → a11y, kubernetes → k8s</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="input">Text</label>
    <textarea id="input" spellcheck="false">accessibility internationalization kubernetes localization observability</textarea>
    <div class="row">
      <label style="margin:0">Min word length</label>
      <input type="range" id="min" min="3" max="10" value="4">
      <b id="minV">4</b>
    </div>
    <div class="egs" id="egs"></div>
  </div>
  <div class="card">
    <div class="out" id="out"></div>
    <div class="btns"><button class="act" id="copy" type="button">Copy output</button></div>
  </div>
</main>
<footer>
  A numeronym = first letter + count of the middle letters + last letter. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/numeronym">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  // first letter + (length-2) + last letter, when the word is long enough
  function numeronym(word, min = 4){
    const w = String(word);
    if(w.length < min || w.length < 4) return w;
    return w[0] + (w.length - 2) + w[w.length - 1];
  }

  // apply to each alphabetic run, preserving everything else
  function numeronymText(text, min = 4){
    return String(text).replace(/[A-Za-z]+/g, m => numeronym(m, min));
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    const EGS = ['accessibility', 'internationalization', 'kubernetes', 'localization', 'observability', 'configuration'];

    function render(){
      const min = +$('min').value;
      $('minV').textContent = min;
      const text = $('input').value;
      const out = numeronymText(text, min);
      $('out').innerHTML = out.replace(/[a-z]\d+[a-z]/gi, m => '<b>' + m + '</b>').replace(/</g, m => m === '<' ? '<' : m);
    }

    $('egs').innerHTML = EGS.map(w => `<button type="button">${w} → ${numeronym(w)}</button>`).join('');
    $('egs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; $('input').value = b.textContent.split(' → ')[0]; render(); });
    $('input').addEventListener('input', render);
    $('min').addEventListener('input', render);
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText(numeronymText($('input').value, +$('min').value)); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy output', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('numeronym-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { numeronym, numeronymText };
</script>
</body>
</html>
