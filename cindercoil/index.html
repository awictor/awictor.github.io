<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cindercoil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #05070d; color: #cfe0ff;
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: min(96vw, 96vh); aspect-ratio: 1; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 10px; box-shadow: 0 0 60px rgba(255,90,20,.15), inset 0 0 0 1px rgba(255,255,255,.04); background: #05070d; touch-action: none; }
  #hud {
    position: absolute; top: 12px; left: 0; right: 0; padding: 0 18px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-variant-numeric: tabular-nums; letter-spacing: .04em;
    text-shadow: 0 1px 6px rgba(0,0,0,.9);
  }
  #hud .lab { font-size: 11px; text-transform: uppercase; opacity: .55; letter-spacing: .18em; }
  #score { font-size: 34px; font-weight: 700; line-height: 1; color: #fff; }
  #combo { font-size: 20px; font-weight: 700; color: #ffb060; }
  .right { text-align: right; }
  #best { font-size: 15px; opacity: .8; }
  #dashbar { margin-top: 7px; width: 130px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; margin-left: auto; }
  #dashfill { height: 100%; width: 0%; background: linear-gradient(90deg,#38d0ff,#7af0ff); transition: width .08s linear; box-shadow: 0 0 8px #38d0ff; }
  #dashbar.ready #dashfill { background: linear-gradient(90deg,#fff,#7af0ff); box-shadow: 0 0 12px #7af0ff; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at center, rgba(10,6,20,.55), rgba(3,4,10,.9));
    border-radius: 10px; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  #title { font-size: 58px; font-weight: 800; letter-spacing: .02em;
    background: linear-gradient(180deg,#fff,#ff7a2a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255,90,20,.5)); }
  #tag { margin-top: 8px; font-size: 15px; opacity: .8; max-width: 460px; }
  #tip { margin-top: 22px; font-size: 13px; line-height: 1.9; opacity: .75; }
  #tip b { color: #ffb060; font-weight: 700; }
  #card { margin-top: 18px; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.6); display: none; max-width: 320px; }
  #btns { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  button {
    font: inherit; font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
    color: #cfe0ff; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
    padding: 9px 16px; border-radius: 6px; cursor: pointer; transition: .12s;
  }
  button:hover { background: rgba(255,120,40,.18); border-color: rgba(255,120,40,.5); color: #fff; }
  button.primary { background: rgba(255,120,40,.22); border-color: rgba(255,120,40,.55); color: #fff; }
  #mode { font-size: 12px; margin-top: 14px; opacity: .6; text-transform: uppercase; letter-spacing: .16em; }
  #toast { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: 0;
    transition: opacity .3s; pointer-events: none; color: #7af0ff; letter-spacing: .06em; }
  #toast.show { opacity: .9; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div>
      <div class="lab">Score</div>
      <div id="score">0</div>
      <div id="combo">x1</div>
    </div>
    <div class="right">
      <div class="lab">Best</div>
      <div id="best">0</div>
      <div id="dashbar"><div id="dashfill"></div></div>
    </div>
  </div>
  <div id="overlay">
    <div id="title">CINDERCOIL</div>
    <div id="tag">A snake of light whose own glowing wake is lethal — until it cools.</div>
    <div id="tip"></div>
    <img id="card" alt="score card">
    <div id="btns"></div>
    <div id="mode"></div>
  </div>
  <div id="toast"></div>
</div>
<script>
"use strict";
(function(){
// ---------- Config ----------
const GRID = 30, CELL = 22, W = GRID*CELL, H = GRID*CELL;
const BASE_TICK = 130;      // ms per step at charge 0
const MIN_TICK = 62;        // fastest step
const BASE_HOT = 1500;      // ms trail stays lethal at charge 0
const HOT_PER_CHARGE = 120; // extra lethal ms per charge point
const CREEP_EVERY = 6;      // sparks per inward border creep
const DASH_CD = 9000;       // ms dash cooldown
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// ---------- DOM ----------
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const $score = document.getElementById('score'), $combo = document.getElementById('combo'),
      $best = document.getElementById('best'), $overlay = document.getElementById('overlay'),
      $tip = document.getElementById('tip'), $btns = document.getElementById('btns'),
      $mode = document.getElementById('mode'), $card = document.getElementById('card'),
      $dashbar = document.getElementById('dashbar'), $dashfill = document.getElementById('dashfill'),
      $toast = document.getElementById('toast');

// ---------- Seeded RNG (mulberry32) ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- Audio (zero assets) ----------
let AC=null, sizzle=null, sizGain=null, sizFilt=null;
function audio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  sizzle=AC.createBufferSource(); const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5; sizzle.buffer=buf; sizzle.loop=true;
  sizFilt=AC.createBiquadFilter(); sizFilt.type='bandpass'; sizFilt.frequency.value=900; sizFilt.Q.value=0.7;
  sizGain=AC.createGain(); sizGain.gain.value=0; sizzle.connect(sizFilt).connect(sizGain).connect(AC.destination); sizzle.start();
}
function blip(freq,dur,type,vol){ if(!AC) return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'triangle'; o.frequency.value=freq; g.gain.value=0; o.connect(g).connect(AC.destination);
  const t=AC.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }
function boom(){ if(!AC) return; const o=AC.createOscillator(),g=AC.createGain(); o.type='sawtooth';
  const t=AC.currentTime; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(40,t+0.6);
  g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.7); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.72); }

// ---------- Game state ----------
let heat, headX, headY, dir, nextDir, running, score, charge, combo, sparksTaken, seed, rng;
let tickMs, hotMs, acc, lastT, border, spark, particles, shake, slowmo, dashReady, dashAt;
let ghost, ghostPath, recPath, dailyMode, hiScore, primaryAction=null;

function reseed(s){ seed=s>>>0; rng=mulberry32(seed); }
function nextSpark(){
  // deterministic spawn inside current border, avoiding head
  for(let tries=0; tries<400; tries++){
    const x=border+Math.floor(rng()*(GRID-2*border)), y=border+Math.floor(rng()*(GRID-2*border));
    if((x!==headX||y!==headY) && heat[y*GRID+x]<=0) return {x,y};
  }
  return {x:headX, y:Math.max(border,Math.min(GRID-1-border,headY+2))};
}

function reset(keepSeed){
  heat=new Float32Array(GRID*GRID);
  headX=headY=(GRID>>1); dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; charge=0; combo=1; sparksTaken=0; border=0;
  tickMs=BASE_TICK; hotMs=BASE_HOT; acc=0; running=true;
  particles=[]; shake=0; slowmo=0; dashAt=-DASH_CD; dashReady=true;
  recPath=[]; ghostPath = ghost? ghost.slice() : null;
  if(!keepSeed) reseed(dailyMode? dailySeed() : (Math.random()*1e9|0));
  else reseed(seed);
  spark=nextSpark();
  lastT=performance.now();
}

// ---------- Input ----------
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){ if(!running){ audio(); (primaryAction||(()=>startGame(dailyMode)))(); } e.preventDefault(); return; }
  if((e.key==='Shift'||e.key==='e'||e.key==='E') && running && dashReady){ coolstorm(); e.preventDefault(); return; }
  const k=KEYS[e.key]; if(k){ e.preventDefault();
    if(k[0]!==-dir.x || k[1]!==-dir.y){ nextDir={x:k[0],y:k[1]}; } }
});

// touch: swipe-to-turn, tap-to-start/restart, two-finger tap = Coolstorm
let tStart=null;
cv.addEventListener('touchstart',e=>{ audio();
  if(e.touches.length>=2){ if(running&&dashReady) coolstorm(); tStart=null; e.preventDefault(); return; }
  const t=e.touches[0]; tStart={x:t.clientX,y:t.clientY}; e.preventDefault();
},{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); },{passive:false});
cv.addEventListener('touchend',e=>{
  if(!tStart) return; const t=e.changedTouches[0];
  const dx=t.clientX-tStart.x, dy=t.clientY-tStart.y, adx=Math.abs(dx), ady=Math.abs(dy);
  tStart=null; e.preventDefault();
  if(adx<24&&ady<24){ if(!running) (primaryAction||(()=>startGame(dailyMode)))(); return; }
  const k = adx>ady ? [dx>0?1:-1,0] : [0,dy>0?1:-1];
  if(running && (k[0]!==-dir.x||k[1]!==-dir.y)) nextDir={x:k[0],y:k[1]};
},{passive:false});

function coolstorm(){
  for(let i=0;i<heat.length;i++) if(heat[i]>0) heat[i]=Math.min(heat[i],hotMs*0.18);
  if(!reduceMotion){ shake=Math.max(shake,16); slowmo=Math.max(slowmo,260); } dashReady=false; dashAt=performance.now();
  $dashbar.classList.remove('ready');
  blip(140,0.5,'sine',0.25); blip(520,0.35,'triangle',0.15);
  for(let i=0;i<40;i++) particles.push({x:headX*CELL+CELL/2,y:headY*CELL+CELL/2,
    vx:(rng()-0.5)*9,vy:(rng()-0.5)*9,life:1,c:'150,220,255'});
  toast('COOLSTORM');
}

// ---------- Step ----------
function step(){
  dir=nextDir;
  // record ghost path (head cell per tick)
  recPath.push(headX+headY*GRID);
  // lay heat at current head cell before moving
  heat[headY*GRID+headX]=hotMs;
  headX+=dir.x; headY+=dir.y;
  // wall / border collision
  if(headX<border||headY<border||headX>=GRID-border||headY>=GRID-border){ return die(); }
  const idx=headY*GRID+headX;
  // hot-trail collision (only lethal while hot)
  if(heat[idx]>0){ return die(); }
  // near-miss detection (adjacent hot cell) -> slowmo + shake pulse
  let near=false;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(dx===0&&dy===0) continue;
    if(dx===-dir.x&&dy===-dir.y) continue; // skip freshly-laid trail cell right behind the head
    const nx=headX+dx,ny=headY+dy;
    if(nx>=0&&ny>=0&&nx<GRID&&ny<GRID&&heat[ny*GRID+nx]>hotMs*0.5) near=true; }
  if(near&&!reduceMotion){ slowmo=Math.max(slowmo,120); shake=Math.max(shake,4); }
  // spark pickup
  if(headX===spark.x&&headY===spark.y){
    charge++; sparksTaken++; combo++;
    score+=10*combo;
    hotMs=BASE_HOT+charge*HOT_PER_CHARGE;
    tickMs=Math.max(MIN_TICK, BASE_TICK-charge*3.5);
    if(sparksTaken%CREEP_EVERY===0 && border<GRID/2-4){ border++;
      // keep head inside the newly-grown wall so the border can't retroactively kill it
      headX=Math.max(border,Math.min(GRID-1-border,headX));
      headY=Math.max(border,Math.min(GRID-1-border,headY)); }
    for(let i=0;i<18;i++) particles.push({x:spark.x*CELL+CELL/2,y:spark.y*CELL+CELL/2,
      vx:(rng()-0.5)*6,vy:(rng()-0.5)*6,life:1,c:'255,'+(140+((combo*20)%110)|0)+',60'});
    if(!reduceMotion) shake=Math.max(shake,3);
    blip(440*Math.pow(1.06,Math.min(combo,40)),0.12,'triangle',0.2);
    spark=nextSpark();
  }
}

function die(){
  running=false; shake=reduceMotion?0:18; boom();
  for(let i=0;i<50;i++) particles.push({x:headX*CELL+CELL/2,y:headY*CELL+CELL/2,
    vx:(rng()-0.5)*11,vy:(rng()-0.5)*11,life:1,c:'255,90,30'});
  const keyH=dailyMode?'cc_best_daily':'cc_best';
  hiScore=Math.max(hiScore, score);
  try{ localStorage.setItem(keyH,String(hiScore)); }catch(e){}
  // save ghost if this run beat stored ghost length-adjusted best
  const gkey=dailyMode?'cc_ghost_daily':'cc_ghost';
  let prevBest=0; try{ prevBest=+(localStorage.getItem(dailyMode?'cc_gbest_daily':'cc_gbest')||0);}catch(e){}
  if(score>=prevBest){ try{ localStorage.setItem(gkey, recPath.join(',')); localStorage.setItem(dailyMode?'cc_gbest_daily':'cc_gbest',String(score)); }catch(e){} }
  setTimeout(showDead, 700);
}

// ---------- Render ----------
function heatColor(h){ // h in [0,hotMs]; white-hot -> orange -> blue ember
  const f=Math.max(0,Math.min(1,h/hotMs));
  if(f>0.7){ const t=(f-0.7)/0.3; return [255,200+55*t|0,150+105*t|0]; }      // white-hot
  if(f>0.35){ const t=(f-0.35)/0.35; return [255,90+110*t|0,30+40*t|0]; }     // orange
  const t=f/0.35; return [40+60*t|0,90+30*t|0,200-40*t|0];                     // blue ember
}

function draw(now){
  const heatLevel=Math.min(1, charge/40);
  // background vignette reacts to charge
  const bg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,W*0.75);
  bg.addColorStop(0,`rgb(${10+heatLevel*30|0},${6+heatLevel*4|0},${14})`);
  bg.addColorStop(1,`rgb(3,4,${10-heatLevel*4|0})`);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // screen shake
  let sx=0,sy=0; if(shake>0){ sx=(rng()-0.5)*shake; sy=(rng()-0.5)*shake; shake*=0.86; if(shake<0.3)shake=0; }
  ctx.setTransform(1,0,0,1,sx,sy);

  // border walls
  if(border>0){ ctx.fillStyle=`rgba(${120+heatLevel*100|0},60,40,0.28)`;
    ctx.fillRect(0,0,W,border*CELL); ctx.fillRect(0,H-border*CELL,W,border*CELL);
    ctx.fillRect(0,0,border*CELL,H); ctx.fillRect(W-border*CELL,0,border*CELL,H);
    ctx.strokeStyle=`rgba(255,${120-heatLevel*40|0},60,0.6)`; ctx.lineWidth=2;
    ctx.strokeRect(border*CELL,border*CELL,W-2*border*CELL,H-2*border*CELL); }

  // ghost ribbon (non-lethal, faint)
  if(ghostPath){ ctx.globalCompositeOperation='lighter';
    const gi=Math.floor(ghostFrame);
    for(let i=Math.max(0,gi-26);i<=gi&&i<ghostPath.length;i++){
      const c=ghostPath[i]; const gx=(c%GRID)*CELL, gy=((c/GRID)|0)*CELL;
      const a=0.10*(1-(gi-i)/28);
      ctx.fillStyle=`rgba(120,180,255,${a})`; ctx.fillRect(gx+4,gy+4,CELL-8,CELL-8);
    }
    ctx.globalCompositeOperation='source-over';
  }

  // trail — single additive pass over flat heat array
  ctx.globalCompositeOperation='lighter';
  const bloom=0.5+heatLevel*0.7;
  for(let i=0;i<heat.length;i++){ const h=heat[i]; if(h<=0) continue;
    const x=(i%GRID)*CELL, y=((i/GRID)|0)*CELL;
    const [r,g,b]=heatColor(h);
    const f=h/hotMs;
    // "about to cool" flicker just before turning safe
    let a=0.28+f*0.6;
    if(!reduceMotion && h<hotMs*0.22 && (now*0.03|0)%2===0) a*=0.55;
    ctx.fillStyle=`rgba(${r},${g},${b},${a})`;
    const pad=2+(1-f)*4;
    ctx.fillRect(x+pad,y+pad,CELL-pad*2,CELL-pad*2);
    if(f>0.4){ ctx.fillStyle=`rgba(${r},${g},${b},${(f-0.4)*bloom*0.5})`;
      ctx.fillRect(x-2,y-2,CELL+4,CELL+4); }
  }

  // spark
  const pulse=0.6+0.4*Math.sin(now*0.008);
  ctx.fillStyle=`rgba(120,240,255,${pulse})`;
  ctx.beginPath(); ctx.arc(spark.x*CELL+CELL/2,spark.y*CELL+CELL/2,CELL*0.4*pulse+3,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(spark.x*CELL+CELL/2,spark.y*CELL+CELL/2,CELL*0.16,0,7); ctx.fill();

  // particles
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life-=0.04;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.fillStyle=`rgba(${p.c},${p.life})`;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }

  // head
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.fillRect(headX*CELL+3,headY*CELL+3,CELL-6,CELL-6);
  ctx.fillStyle='rgba(255,180,90,0.6)';
  ctx.fillRect(headX*CELL-1,headY*CELL-1,CELL+2,CELL+2);
  ctx.globalCompositeOperation='source-over';

  // slow-mo edge glow
  if(slowmo>0){ ctx.setTransform(1,0,0,1,0,0);
    ctx.strokeStyle=`rgba(120,240,255,${Math.min(0.5,slowmo/400)})`; ctx.lineWidth=8;
    ctx.strokeRect(4,4,W-8,H-8); }
}

// ---------- Loop ----------
let ghostFrame=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(80, now-lastT); lastT=now;
  if(running){
    // cool all hot cells
    for(let i=0;i<heat.length;i++) if(heat[i]>0){ heat[i]-=dt; if(heat[i]<0)heat[i]=0; }
    const factor = slowmo>0 ? 2.4 : 1;
    if(slowmo>0) slowmo-=dt;
    acc+=dt/factor;
    while(acc>=tickMs){ acc-=tickMs; step(); if(!running) break; }
    ghostFrame += dt/tickMs;
    // sizzle ambience reacts to charge
    if(sizGain){ const hl=Math.min(1,charge/40);
      sizGain.gain.value = 0.006+hl*0.03; sizFilt.frequency.value=700+hl*1400; }
    // dash cooldown UI
    if(!dashReady){ const p=Math.min(1,(now-dashAt)/DASH_CD); $dashfill.style.width=(p*100)+'%';
      if(p>=1){ dashReady=true; $dashbar.classList.add('ready'); toast('DASH READY'); } }
    else { $dashfill.style.width='100%'; }
    // HUD
    $score.textContent=score; $combo.textContent='x'+combo; $best.textContent=hiScore;
  }
  draw(now);
}

// ---------- Overlays / meta ----------
function toast(t){ $toast.textContent=t; $toast.classList.add('show'); clearTimeout(toast._t);
  toast._t=setTimeout(()=>$toast.classList.remove('show'),1400); }

function dailySeed(){ const d=new Date(); return (d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate())>>>0; }

function loadGhost(daily){ try{ const raw=localStorage.getItem(daily?'cc_ghost_daily':'cc_ghost');
  ghost = raw? raw.split(',').map(Number) : null; }catch(e){ ghost=null; } }

function startGame(daily){
  dailyMode=!!daily;
  hiScore=(function(){ try{ return +(localStorage.getItem(daily?'cc_best_daily':'cc_best')||0); }catch(e){ return 0; } })();
  loadGhost(daily);
  $overlay.classList.add('hidden'); $card.style.display='none';
  $dashbar.classList.add('ready');
  ghostFrame=0;
  reset(false);
  // reflect seed in URL for sharing (non-daily)
  if(!daily) location.hash='s='+seed;
}

function startShared(s){ dailyMode=false; hiScore=(function(){ try{return +(localStorage.getItem('cc_best')||0);}catch(e){return 0;}})();
  loadGhost(false); $overlay.classList.add('hidden'); $card.style.display='none'; $dashbar.classList.add('ready');
  ghostFrame=0; seed=s>>>0; reset(true); }

function makeCard(){
  const cc=document.createElement('canvas'); cc.width=600; cc.height=340; const x=cc.getContext('2d');
  const g=x.createLinearGradient(0,0,0,340); g.addColorStop(0,'#12060a'); g.addColorStop(1,'#05070d');
  x.fillStyle=g; x.fillRect(0,0,600,340);
  // mini weave snapshot
  x.save(); x.translate(330,30); const s=2.6;
  x.globalCompositeOperation='lighter';
  for(let i=0;i<heat.length;i++){ const h=heat[i]; if(h<=0)continue; const [r,gg,b]=heatColor(h);
    x.fillStyle=`rgba(${r},${gg},${b},0.7)`; x.fillRect((i%GRID)*s,((i/GRID)|0)*s,s,s); }
  x.globalCompositeOperation='source-over'; x.restore();
  x.fillStyle='#ff7a2a'; x.font='700 40px Segoe UI, sans-serif'; x.fillText('CINDERCOIL',30,58);
  x.fillStyle='#fff'; x.font='700 72px Segoe UI, sans-serif'; x.fillText(String(score),30,150);
  x.fillStyle='#cfe0ff'; x.font='16px Segoe UI, sans-serif';
  x.fillText('score',32,175);
  x.fillStyle='#ffb060'; x.font='700 22px Segoe UI, sans-serif'; x.fillText('combo x'+combo,30,215);
  x.fillStyle='#7af0ff'; x.font='15px Segoe UI, sans-serif';
  x.fillText((dailyMode?'daily #'+seed:'seed '+seed),30,300);
  x.fillStyle='#8fa4c8'; x.fillText(dailyMode?'Daily Challenge':'beat my run',30,322);
  return cc.toDataURL('image/png');
}

function btn(label,fn,primary){ const b=document.createElement('button'); b.textContent=label;
  if(primary)b.className='primary'; b.onclick=fn; return b; }

function showMenu(){
  $overlay.classList.remove('hidden');
  document.getElementById('title').textContent='CINDERCOIL';
  document.getElementById('tag').textContent='A snake of light whose own glowing wake is lethal — until it cools.';
  $tip.innerHTML='Move with <b>WASD / Arrows</b>. Collect <b>sparks</b> to raise charge — score soars, but your trail stays <b>hot</b> longer. Weave through the cooling weave. <b>Shift / E</b> = Coolstorm dash (flash-cool everything).';
  $card.style.display='none';
  $btns.innerHTML='';
  primaryAction=()=>{ audio(); startGame(false); };
  $btns.appendChild(btn('▶ Play',primaryAction,true));
  $btns.appendChild(btn('Daily Challenge',()=>{ audio(); startGame(true); }));
  $mode.textContent='';
}

function showDead(){
  $overlay.classList.remove('hidden');
  document.getElementById('title').textContent = score>=hiScore && score>0 ? 'NEW BEST!' : 'BURNED OUT';
  document.getElementById('tag').textContent = 'Score '+score+' · combo x'+combo+' · '+(dailyMode?'Daily #'+seed:'seed '+seed);
  const url=location.href.split('#')[0]+'#s='+seed;
  $tip.innerHTML='Your run is now the <b>ghost</b> to beat. Share the board below.<br><span style="opacity:.6;font-size:12px">'+url+'</span>';
  const src=makeCard(); $card.src=src; $card.style.display='block';
  $btns.innerHTML='';
  primaryAction=()=>{ startShared(seed); };
  $btns.appendChild(btn('↻ Retry same board',primaryAction,true));
  $btns.appendChild(btn('New board',()=>{ startGame(false); }));
  $btns.appendChild(btn('Daily',()=>{ startGame(true); }));
  $btns.appendChild(btn('Copy link',()=>{ if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Copy failed — select the link')); } else { toast('Copy unavailable — select the link'); } }));
  $btns.appendChild(btn('Save card',()=>{ const a=document.createElement('a'); a.href=src; a.download='cindercoil-'+score+'.png'; a.click(); }));
  $mode.textContent = dailyMode?'Daily Challenge Mode':'';
}

// ---------- Boot ----------
running=false; heat=new Float32Array(GRID*GRID); rng=mulberry32(1); border=0; particles=[]; charge=0; hotMs=BASE_HOT;
headX=headY=GRID>>1; spark={x:-1,y:-1}; ghost=null; ghostPath=null; hiScore=0; slowmo=0; shake=0;
const m=location.hash.match(/s=(\d+)/);
if(m){ showMenu(); document.getElementById('tag').textContent='Someone challenged you on seed '+m[1]+' — beat their run.';
  $btns.innerHTML=''; primaryAction=()=>{ audio(); startShared(+m[1]); };
  $btns.appendChild(btn('▶ Accept challenge',primaryAction,true));
  $btns.appendChild(btn('Daily',()=>{ audio(); startGame(true); }));
  $btns.appendChild(btn('New board',()=>{ audio(); startGame(false); }));
} else { showMenu(); }
requestAnimationFrame(frame);
})();
</script>
