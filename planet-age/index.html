<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanetAge — Your Age on Every Planet</title>
<meta name="description" content="Enter your birthdate to see how old you are on Mercury, Venus, Mars, Jupiter and every other planet, based on each planet's orbital period. 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('planetage-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#a855f7;
    --bg:#f6f3fb; --card:#ffffff; --fg:#1b1626; --muted:#645a72; --line:#eae2f2; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0c0813; --card:#16101f; --fg:#f2ecf8; --muted:#a494b4; --line:#241a30; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:640px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#7e22ce);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:640px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.1rem}
  .earth{text-align:center;color:var(--muted);font-size:.9rem;margin-top:12px}
  .earth b{color:var(--c);font-size:1.1rem}
  .list{display:flex;flex-direction:column;gap:8px}
  .p{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .p .icon{font-size:1.6rem;width:34px;text-align:center}
  .p .name{font-weight:700;flex:1}
  .p .age{font-size:1.5rem;font-weight:800;color:var(--c)}
  .p .unit{color:var(--muted);font-size:.75rem}
  .next{color:var(--muted);font-size:.72rem}
  .err{color:#dc2626;font-size:.85rem;margin-top:10px;text-align:center}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:640px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.8rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🪐</div>
    <div><h1>PlanetAge</h1><div class="sub">Your age across the solar system</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="birth">Your birthdate</label>
    <input type="date" id="birth" value="1990-06-15">
    <div class="earth" id="earth"></div>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <div class="list" id="list"></div>
  </div>
</main>
<footer>
  A "year" on a planet is one orbit around the Sun. Ages use each planet's sidereal orbital period; Earth years are Julian years (365.25 days). 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/planet-age">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  const YEAR_MS = 365.25 * 24 * 60 * 60 * 1000;   // one Julian year in ms

  // Orbital period in Earth years (sidereal).
  const PERIODS = {
    Mercury: 0.2408467,
    Venus:   0.61519726,
    Earth:   1,
    Mars:    1.8808158,
    Jupiter: 11.862615,
    Saturn:  29.447498,
    Uranus:  84.016846,
    Neptune: 164.79132
  };

  function earthYearsBetween(birthMs, nowMs){
    const b = Number(birthMs), n = Number(nowMs);
    if(!Number.isFinite(b) || !Number.isFinite(n)) throw new Error('invalid date');
    if(n < b) throw new Error('birthdate is in the future');
    return (n - b) / YEAR_MS;
  }

  function ageOnPlanet(earthYears, planet){
    if(!(planet in PERIODS)) throw new Error('unknown planet: ' + planet);
    const y = Number(earthYears);
    if(!Number.isFinite(y) || y < 0) throw new Error('invalid age');
    return y / PERIODS[planet];
  }

  function allAges(earthYears){
    const out = {};
    for(const p of Object.keys(PERIODS)) out[p] = ageOnPlanet(earthYears, p);
    return out;
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('list')){
    const $ = id => document.getElementById(id);
    const ICONS = { Mercury:'☿️', Venus:'♀️', Earth:'🌍', Mars:'♂️', Jupiter:'🪐', Saturn:'🪐', Uranus:'🔵', Neptune:'🔷' };

    function render(){
      try{
        const birthMs = new Date($('birth').value + 'T00:00:00').getTime();
        const ey = earthYearsBetween(birthMs, Date.now());
        $('earth').innerHTML = `On Earth you are <b>${ey.toFixed(1)}</b> years old.`;
        const ages = allAges(ey);
        $('list').innerHTML = Object.keys(PERIODS).map(p => {
          const a = ages[p];
          const nextY = Math.floor(a) + 1;
          return `<div class="p">
            <div class="icon">${ICONS[p]}</div>
            <div class="name">${p}<div class="next">turns ${nextY} in ${((nextY - a) * PERIODS[p]).toFixed(1)} Earth yrs</div></div>
            <div style="text-align:right"><div class="age">${a.toFixed(2)}</div><div class="unit">${p} years</div></div>
          </div>`;
        }).join('');
        $('err').textContent = '';
      }catch(e){ $('earth').textContent = ''; $('list').innerHTML = ''; $('err').textContent = e.message; }
    }
    $('birth').addEventListener('input', render);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('planetage-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { YEAR_MS, PERIODS, earthYearsBetween, ageOnPlanet, allAges };
</script>
</body>
</html>
