<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PxRem — px ↔ rem / em Converter</title>
<meta name="description" content="Convert px to rem and em (and back) with an adjustable root font size, plus a quick-reference table. 100% offline, no signup." />
<meta name="theme-color" content="#6d28d9" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="PxRem — px ↔ rem / em Converter" />
<meta property="og:description" content="px to rem/em and back, adjustable base, reference table. Offline." />
<meta property="og:url" content="https://awictor.github.io/px-rem/" />
<link rel="canonical" href="https://awictor.github.io/px-rem/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d28d9'/%3E%3Ctext x='32' y='40' font-size='15' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3Epx⇄%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f5f2fc; --ink:#1a1030; --accent:#6d28d9; --accent-d:#5b21b6;
    --card:#fff; --line:#e5ddf5; --muted:#615982; --field:#fff;
    --shadow:0 1px 2px rgba(26,16,48,.05),0 8px 24px rgba(26,16,48,.07); }
  [data-theme="dark"]{ --bg:#0e0a1c; --ink:#ece7f7; --accent:#a78bfa; --accent-d:#c4b5fd;
    --card:#17122b; --line:#292145; --muted:#968bbb; --field:#0e0a1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  .ig{position:relative}
  .ig .suf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-family:ui-monospace,monospace}
  input[type=number]{width:150px;padding:11px 40px 11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.15)}
  table{width:100%;border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:6px 8px;font-family:inherit}
  th:first-child,td:first-child{text-align:left}
  td{padding:7px 8px;border-top:1px solid var(--line);text-align:right}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("pxrem.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Px</span>Rem</h1>
  <p>Convert px to rem/em and back, with an adjustable root size. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Root font size (base)</label><div class="ig"><input id="base" type="number" step="1" value="16"><span class="suf">px</span></div></div>
    <div class="row"><label>Pixels</label><div class="ig"><input id="px" type="number" step="1" value="24"><span class="suf">px</span></div></div>
    <div class="row"><label>rem / em</label><div class="ig"><input id="rem" type="number" step="0.01" value="1.5"><span class="suf">rem</span></div></div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Reference (base <span id="baseEcho">16</span>px)</h2>
    <table><thead><tr><th>px</th><th>rem</th></tr></thead><tbody id="ref"></tbody></table>
  </section>
</div>

<footer>
  <b>PxRem</b> · offline px ↔ rem/em converter · <a href="https://github.com/awictor/px-rem">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  rem and em share the same math here (relative to the base). © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};

// --- Pure conversion ---
function pxToRem(px,base){ base=base||16; return base>0 ? px/base : 0; }
function remToPx(rem,base){ base=base||16; return rem*base; }

// --- UI ---
const REF=[4,8,12,14,16,18,20,24,32,40,48,64];
const r2=n=>Math.round(n*10000)/10000;
function base(){ const b=num("base"); return b>0?b:16; }
function refreshTable(){
  const b=base(); $("baseEcho").textContent=b;
  $("ref").innerHTML=REF.map(px=>`<tr><td>${px}px</td><td>${r2(pxToRem(px,b))}rem</td></tr>`).join("");
}
function fromPx(){ $("rem").value=r2(pxToRem(num("px"),base())); persist(); refreshTable(); }
function fromRem(){ $("px").value=r2(remToPx(num("rem"),base())); persist(); refreshTable(); }
function fromBase(){ $("rem").value=r2(pxToRem(num("px"),base())); persist(); refreshTable(); }
function persist(){ try{["base","px","rem"].forEach(k=>localStorage.setItem("pxrem."+k,$(k).value));}catch(e){} }
$("px").addEventListener("input",fromPx);
$("rem").addEventListener("input",fromRem);
$("base").addEventListener("input",fromBase);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("pxrem.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["base","px","rem"].forEach(k=>{const v=localStorage.getItem("pxrem."+k);if(v!=null)$(k).value=v;});}catch(e){}
refreshTable();

if(typeof module!=="undefined") module.exports={pxToRem,remToPx};
</script>
</body>
</html>
