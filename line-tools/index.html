<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LineTools — Sort, Dedupe &amp; Clean Up Lines of Text</title>
<meta name="description" content="Sort lines A–Z, Z–A, or numerically, remove duplicates and blank lines, trim, reverse, and number lines. 100% offline, no signup." />
<meta name="theme-color" content="#be123c" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="LineTools — Sort & Clean Up Text Lines" />
<meta property="og:description" content="Sort, dedupe, trim, reverse, and number lines of text. Offline." />
<meta property="og:url" content="https://awictor.github.io/line-tools/" />
<link rel="canonical" href="https://awictor.github.io/line-tools/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23be123c'/%3E%3Cpath d='M16 22 H40 M16 32 H34 M16 42 H46' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fbf1f3; --ink:#28101a; --accent:#be123c; --accent-d:#9f1239;
    --card:#fff; --line:#f0d9df; --muted:#7a5460; --field:#fff;
    --shadow:0 1px 2px rgba(40,16,26,.05),0 8px 24px rgba(40,16,26,.07); }
  [data-theme="dark"]{ --bg:#160810; --ink:#f5e8ec; --accent:#fb7185; --accent-d:#fda4af;
    --card:#20111a; --line:#341f29; --muted:#a9869a; --field:#160810;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:760px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  textarea{width:100%;min-height:200px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);resize:vertical;white-space:pre;overflow-wrap:normal;line-height:1.6}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(190,18,60,.15)}
  textarea.out{background:var(--bg)}
  .ops{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #stat{font-size:12px;color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("linetools.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Line</span>Tools</h1>
  <p>Sort, dedupe, trim, reverse, and number lines of text. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <textarea id="input" spellcheck="false" placeholder="Paste your lines here…">banana
apple
Cherry
apple

  date</textarea>
    <div class="ops">
      <button class="btn primary" data-op="az">Sort A→Z</button>
      <button class="btn" data-op="za">Sort Z→A</button>
      <button class="btn" data-op="num">Sort 1→9</button>
      <button class="btn" data-op="dedupe">Dedupe</button>
      <button class="btn" data-op="removeBlank">Remove blanks</button>
      <button class="btn" data-op="trim">Trim</button>
      <button class="btn" data-op="reverse">Reverse</button>
      <button class="btn" data-op="number">Number</button>
    </div>
    <div id="stat"></div>
  </section>
  <section class="card">
    <textarea id="output" class="out" spellcheck="false" readonly></textarea>
    <div class="ops"><button class="btn" id="copy">Copy</button><button class="btn" id="use">Use as input</button><span id="msg" style="font-size:12px;color:var(--muted);align-self:center"></span></div>
  </section>
</div>

<footer>
  <b>LineTools</b> · offline line sorter &amp; cleaner · <a href="https://github.com/awictor/line-tools">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const split=t=>String(t).split(/\r?\n/);

// --- Pure line operations ---
function sortLines(text,mode){
  const ls=split(text);
  if(mode==="za") ls.sort((a,b)=>b.localeCompare(a));
  else if(mode==="num") ls.sort((a,b)=>(parseFloat(a)||0)-(parseFloat(b)||0));
  else ls.sort((a,b)=>a.localeCompare(b));
  return ls.join("\n");
}
function dedupe(text){ const seen=new Set(),out=[]; for(const l of split(text)){ if(!seen.has(l)){ seen.add(l); out.push(l); } } return out.join("\n"); }
function removeBlank(text){ return split(text).filter(l=>l.trim()!=="").join("\n"); }
function trimLines(text){ return split(text).map(l=>l.trim()).join("\n"); }
function reverseLines(text){ return split(text).reverse().join("\n"); }
function numberLines(text){ return split(text).map((l,i)=>(i+1)+". "+l).join("\n"); }
function apply(op,text){
  switch(op){
    case "az": case "za": case "num": return sortLines(text,op);
    case "dedupe": return dedupe(text);
    case "removeBlank": return removeBlank(text);
    case "trim": return trimLines(text);
    case "reverse": return reverseLines(text);
    case "number": return numberLines(text);
    default: return text;
  }
}

// --- UI ---
function stat(){ const t=$("input").value; const lines=t===""?0:split(t).length; $("stat").textContent=lines+" lines"; try{localStorage.setItem("linetools.input",t);}catch(e){} }
document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{ $("output").value=apply(b.dataset.op,$("input").value); });
$("input").addEventListener("input",stat);
$("copy").onclick=()=>{const v=$("output").value;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1200);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();};
$("use").onclick=()=>{if($("output").value){$("input").value=$("output").value;stat();}};
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("linetools.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const t=localStorage.getItem("linetools.input");if(t!=null)$("input").value=t;}catch(e){}
stat();

if(typeof module!=="undefined") module.exports={sortLines,dedupe,removeBlank,trimLines,reverseLines,numberLines,apply};
</script>
</body>
</html>
