<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triangle — CSS Triangle & Arrow Generator</title>
<meta name="description" content="Generate a pure-CSS triangle (border trick) in any direction, with size and color, a live preview and copy-ready CSS. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('css-triangle-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#a855f7;
    --bg:#f7f5f9; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e8e2ec; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#150f18; --card:#1e1722; --fg:#f1ecf5; --muted:#a294ab; --line:#312838; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#7e22ce);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
  label:first-child{margin-top:0}
  input[type=range]{width:100%;accent-color:var(--c)}
  input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .dirs button{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit;font-size:1.1rem}
  .dirs button.on{background:var(--c);color:#fff;border-color:var(--c)}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .stage{display:flex;align-items:center;justify-content:center;min-height:220px}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.82rem;margin:14px 0 0;white-space:pre}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;margin-top:12px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🔺</div>
    <div><h1>Triangle</h1><div class="sub">Pure-CSS triangle &amp; arrow generator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label>Direction</label>
    <div class="dirs" id="dirs">
      <button type="button" data-d="up">▲</button>
      <button type="button" data-d="down">▼</button>
      <button type="button" data-d="left">◀</button>
      <button type="button" data-d="right">▶</button>
    </div>
    <label class="row"><span>Size</span><b id="sizeV">30px</b></label>
    <input type="range" id="size" min="6" max="100" value="30">
    <label for="color">Color</label>
    <input type="color" id="color" value="#a855f7">
  </div>
  <div class="card">
    <div class="stage"><div id="preview"></div></div>
    <pre id="out"></pre>
    <button class="act" id="copy" type="button">Copy CSS</button>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/css-triangle">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function isHex(c){ return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c); }

  function triangleCss(o = {}){
    const direction = o.direction || 'up';
    const size = o.size == null ? 20 : o.size;
    const color = o.color || '#ff6100';
    if(!isHex(color)) throw new Error('invalid hex color: ' + color);
    if(!(size > 0)) throw new Error('size must be positive');
    const dirs = {
      up: [`border-left: ${size}px solid transparent;`, `border-right: ${size}px solid transparent;`, `border-bottom: ${size}px solid ${color};`],
      down: [`border-left: ${size}px solid transparent;`, `border-right: ${size}px solid transparent;`, `border-top: ${size}px solid ${color};`],
      left: [`border-top: ${size}px solid transparent;`, `border-bottom: ${size}px solid transparent;`, `border-right: ${size}px solid ${color};`],
      right: [`border-top: ${size}px solid transparent;`, `border-bottom: ${size}px solid transparent;`, `border-left: ${size}px solid ${color};`]
    };
    if(!dirs[direction]) throw new Error('unknown direction: ' + direction);
    return ['width: 0;', 'height: 0;', ...dirs[direction]].join('\n');
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('preview')){
    const $ = id => document.getElementById(id);
    let direction = 'up';

    function render(){
      const size = +$('size').value, color = $('color').value;
      $('sizeV').textContent = size + 'px';
      let css;
      try{ css = triangleCss({ direction, size, color }); }catch(e){ return; }
      $('out').textContent = css;
      const p = $('preview');
      p.style.width = '0'; p.style.height = '0';
      p.style.borderTop = p.style.borderBottom = p.style.borderLeft = p.style.borderRight = '';
      css.split('\n').forEach(line => {
        const m = /^([a-z-]+):\s*(.+);$/.exec(line);
        if(m){ p.style.setProperty(m[1], m[2]); }
      });
    }

    $('dirs').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      direction = b.dataset.d;
      [...$('dirs').children].forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('dirs').querySelector('[data-d="up"]').classList.add('on');
    ['size', 'color'].forEach(id => $(id).addEventListener('input', render));
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy CSS', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('css-triangle-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { isHex, triangleCss };
</script>
</body>
</html>
