<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DiffCheck — Text &amp; Code Diff Checker</title>
<meta name="description" content="Compare two texts line by line and see exactly what was added, removed, or unchanged. 100% offline — your text never leaves your device. No signup." />
<meta name="theme-color" content="#4338ca" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="DiffCheck — Text & Code Diff Checker" />
<meta property="og:description" content="Line-by-line diff of two texts — added, removed, unchanged, with counts. Offline." />
<meta property="og:url" content="https://awictor.github.io/diff-check/" />
<link rel="canonical" href="https://awictor.github.io/diff-check/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234338ca'/%3E%3Cpath d='M20 24 H36 M20 32 H30 M20 40 H40' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f2f3fb; --ink:#171634; --accent:#4338ca; --accent-d:#3730a3;
    --card:#fff; --line:#dedcf2; --muted:#5a5880;
    --add:#16a34a; --addbg:#e7f7ec; --del:#e5484d; --delbg:#fdeaea; --field:#fff;
    --shadow:0 1px 2px rgba(23,22,52,.05),0 8px 24px rgba(23,22,52,.07); }
  [data-theme="dark"]{ --bg:#0b0a1a; --ink:#eae9f7; --accent:#a5b4fc; --accent-d:#c7d2fe;
    --card:#15142a; --line:#282544; --muted:#948fc0;
    --add:#4ade80; --addbg:#0f2a1a; --del:#f87171; --delbg:#2c1416; --field:#0b0a1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:960px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  textarea{width:100%;min-height:180px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);resize:vertical;line-height:1.6;white-space:pre;overflow-wrap:normal}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(67,56,202,.15)}
  .summary{display:flex;gap:16px;font-size:14px;margin-bottom:12px}
  .summary .a{color:var(--add);font-weight:700} .summary .d{color:var(--del);font-weight:700} .summary .s{color:var(--muted)}
  .diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .diff .ln{display:flex;white-space:pre-wrap;word-break:break-word;padding:2px 10px}
  .diff .ln .sign{width:14px;flex:none;color:var(--muted)}
  .diff .add{background:var(--addbg)} .diff .add .sign{color:var(--add)}
  .diff .del{background:var(--delbg)} .diff .del .sign{color:var(--del)}
  .diff .empty{color:var(--muted);padding:14px;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("diffcheck.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Diff</span>Check</h1>
  <p>Compare two texts line by line — see what was added, removed, and unchanged. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="two">
      <div><h2>Original</h2><textarea id="a" spellcheck="false" placeholder="Paste the original text…">the quick brown fox
jumps over
the lazy dog</textarea></div>
      <div><h2>Changed</h2><textarea id="b" spellcheck="false" placeholder="Paste the changed text…">the quick red fox
jumps over
the lazy dog
the end</textarea></div>
    </div>
  </section>

  <section class="card">
    <div class="summary" id="summary"></div>
    <div class="diff" id="diff"></div>
  </section>
</div>

<footer>
  <b>DiffCheck</b> · offline text &amp; code diff · <a href="https://github.com/awictor/diff-check">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Line-level LCS diff. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure line diff (LCS) ---
function diffLines(a,b){
  const A=String(a).split("\n"), B=String(b).split("\n");
  const m=A.length, n=B.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<m&&j<n){
    if(A[i]===B[j]){ out.push({type:"same",line:A[i]}); i++;j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ out.push({type:"del",line:A[i]}); i++; }
    else { out.push({type:"add",line:B[j]}); j++; }
  }
  while(i<m) out.push({type:"del",line:A[i++]});
  while(j<n) out.push({type:"add",line:B[j++]});
  return out;
}
function diffStats(diff){
  let added=0,removed=0,unchanged=0;
  for(const d of diff){ if(d.type==="add")added++; else if(d.type==="del")removed++; else unchanged++; }
  return {added,removed,unchanged};
}

// --- UI ---
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const SIGN={add:"+",del:"-",same:" "};
function render(){
  const a=$("a").value, b=$("b").value;
  try{localStorage.setItem("diffcheck.a",a);localStorage.setItem("diffcheck.b",b);}catch(e){}
  const diff=diffLines(a,b), st=diffStats(diff);
  $("summary").innerHTML=`<span class="a">+${st.added} added</span><span class="d">-${st.removed} removed</span><span class="s">${st.unchanged} unchanged</span>`;
  if(st.added===0&&st.removed===0){ $("diff").innerHTML='<div class="empty">The two texts are identical.</div>'; return; }
  $("diff").innerHTML=diff.map(d=>`<div class="ln ${d.type}"><span class="sign">${SIGN[d.type]}</span><span>${esc(d.line)||"&nbsp;"}</span></div>`).join("");
}
$("a").addEventListener("input",render);
$("b").addEventListener("input",render);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("diffcheck.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const a=localStorage.getItem("diffcheck.a"),b=localStorage.getItem("diffcheck.b");if(a!=null)$("a").value=a;if(b!=null)$("b").value=b;}catch(e){}
render();

if(typeof module!=="undefined") module.exports={diffLines,diffStats};
</script>
</body>
</html>
