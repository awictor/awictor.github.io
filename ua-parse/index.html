<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAParse — User Agent String Parser</title>
<meta name="description" content="Parse any user-agent string into browser, version, OS, rendering engine, device type, and bot detection. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('ua-parse-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#4f46e5;
    --bg:#f5f5f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e3e3e8; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#111119; --card:#1a1a24; --fg:#f0f0f5; --muted:#9a9aa6; --line:#2b2b38; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:780px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#4338ca);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:780px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;min-height:90px;resize:vertical}
  .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  button.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .field{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
  .field span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .field b{font-size:1.15rem}
  .bot{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:999px;font-weight:700;font-size:.85rem}
  .bot.yes{background:#dc2626;color:#fff}
  .bot.no{background:var(--c);color:#fff}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:780px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🕵️</div>
    <div><h1>UAParse</h1><div class="sub">Break a user-agent string into browser, OS &amp; device</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="ua">User-agent string</label>
    <textarea id="ua" spellcheck="false"></textarea>
    <div class="btns">
      <button class="act" id="mine" type="button">Use my browser</button>
      <button class="ghost" id="ex" type="button">Load example</button>
    </div>
  </div>

  <div class="card">
    <div class="fields" id="fields"></div>
    <span class="bot no" id="bot">Not a bot</span>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/ua-parse">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function parseUA(ua){
    ua = String(ua || '');
    const res = { browser: 'Unknown', version: '', os: 'Unknown', osVersion: '', engine: 'Unknown', deviceType: 'desktop', bot: false };
    if(!ua.trim()) return res;

    if(/bot\b|crawler|spider|slurp|bingpreview|facebookexternalhit|mediapartners|googlebot/i.test(ua)) res.bot = true;

    // Browser (order matters: derivatives before their base)
    let m;
    if(m = ua.match(/Edg(?:e|iOS|A)?\/([\d.]+)/)) { res.browser = 'Edge'; res.version = m[1]; }
    else if(m = ua.match(/OPR\/([\d.]+)/)) { res.browser = 'Opera'; res.version = m[1]; }
    else if(m = ua.match(/Opera[ /]([\d.]+)/)) { res.browser = 'Opera'; res.version = m[1]; }
    else if(m = ua.match(/SamsungBrowser\/([\d.]+)/)) { res.browser = 'Samsung Internet'; res.version = m[1]; }
    else if(m = ua.match(/(?:Chrome|CriOS|Chromium)\/([\d.]+)/)) { res.browser = 'Chrome'; res.version = m[1]; }
    else if(m = ua.match(/(?:Firefox|FxiOS)\/([\d.]+)/)) { res.browser = 'Firefox'; res.version = m[1]; }
    else if(/MSIE |Trident/.test(ua)) { res.browser = 'Internet Explorer'; m = ua.match(/(?:MSIE |rv:)([\d.]+)/); res.version = m ? m[1] : ''; }
    else if(m = ua.match(/Version\/([\d.]+)[^)]*Safari/)) { res.browser = 'Safari'; res.version = m[1]; }
    else if(/Safari/.test(ua)) { res.browser = 'Safari'; }

    // OS (order matters)
    if(m = ua.match(/Windows NT ([\d.]+)/)) {
      res.os = 'Windows';
      const winMap = { '10.0': '10/11', '6.3': '8.1', '6.2': '8', '6.1': '7', '6.0': 'Vista', '5.1': 'XP' };
      res.osVersion = winMap[m[1]] || m[1];
    }
    else if(/Windows Phone/.test(ua)) { res.os = 'Windows Phone'; }
    else if(m = ua.match(/Android ([\d.]+)/)) { res.os = 'Android'; res.osVersion = m[1]; }
    else if(m = ua.match(/(?:iPhone|iPad|iPod)[^)]*?OS ([\d._]+)/)) { res.os = 'iOS'; res.osVersion = m[1].replace(/_/g, '.'); }
    else if(/CrOS/.test(ua)) { res.os = 'Chrome OS'; }
    else if(m = ua.match(/Mac OS X ([\d._]+)/)) { res.os = 'macOS'; res.osVersion = m[1].replace(/_/g, '.'); }
    else if(/Macintosh/.test(ua)) { res.os = 'macOS'; }
    else if(/Linux/.test(ua)) { res.os = 'Linux'; }

    // Rendering engine
    if(res.browser === 'Firefox') res.engine = 'Gecko';
    else if(res.browser === 'Internet Explorer') res.engine = 'Trident';
    else if(/Edg(?:e|iOS|A)?\//.test(ua) || /(?:Chrome|CriOS|Chromium|OPR|SamsungBrowser)\//.test(ua)) res.engine = 'Blink';
    else if(/AppleWebKit/.test(ua)) res.engine = 'WebKit';
    else if(/Gecko/.test(ua)) res.engine = 'Gecko';

    // Device type (check tablet signals before the generic mobile flag)
    if(/iPad|Tablet/.test(ua) || (/Android/.test(ua) && !/Mobile/.test(ua))) res.deviceType = 'tablet';
    else if(/Mobi|iPhone|iPod|Windows Phone/.test(ua)) res.deviceType = 'mobile';
    else res.deviceType = 'desktop';

    return res;
  }

  // ---- UI ----
  const EXAMPLE = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';

  if(typeof document !== 'undefined' && document.getElementById('fields')){
    const $ = id => document.getElementById(id);
    const icon = { mobile: '📱', tablet: '📲', desktop: '🖥️' };

    function render(){
      const r = parseUA($('ua').value);
      $('fields').innerHTML =
        `<div class="field"><span>Browser</span><b>${r.browser}${r.version ? ' ' + r.version : ''}</b></div>` +
        `<div class="field"><span>Operating system</span><b>${r.os}${r.osVersion ? ' ' + r.osVersion : ''}</b></div>` +
        `<div class="field"><span>Engine</span><b>${r.engine}</b></div>` +
        `<div class="field"><span>Device</span><b>${icon[r.deviceType] || ''} ${r.deviceType}</b></div>`;
      const bot = $('bot');
      bot.textContent = r.bot ? '🤖 Likely a bot / crawler' : 'Not a bot';
      bot.className = 'bot ' + (r.bot ? 'yes' : 'no');
    }

    $('ua').addEventListener('input', render);
    $('mine').addEventListener('click', () => { $('ua').value = navigator.userAgent; render(); });
    $('ex').addEventListener('click', () => { $('ua').value = EXAMPLE; render(); });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('ua-parse-theme', cur); }catch(e){}
    });

    $('ua').value = (navigator && navigator.userAgent) || EXAMPLE;
    render();
  }

  if(typeof module !== 'undefined') module.exports = { parseUA };
</script>
</body>
</html>
