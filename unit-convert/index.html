<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UnitConvert — Length, Mass, Volume &amp; Temperature Converter</title>
<meta name="description" content="Convert length, mass, volume, and temperature between common metric and imperial units. 100% offline, no signup." />
<meta name="theme-color" content="#a21caf" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="UnitConvert — Unit Converter" />
<meta property="og:description" content="Length, mass, volume, and temperature between metric and imperial units. Offline." />
<meta property="og:url" content="https://awictor.github.io/unit-convert/" />
<link rel="canonical" href="https://awictor.github.io/unit-convert/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a21caf'/%3E%3Cpath d='M16 24 H48 V40 H16 Z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M24 24 V32 M32 24 V34 M40 24 V32' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#faf1fb; --ink:#25092a; --accent:#a21caf; --accent-d:#86198f;
    --card:#fff; --line:#eed6f2; --muted:#71547a; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(37,9,42,.05),0 8px 24px rgba(37,9,42,.07); }
  [data-theme="dark"]{ --bg:#150818; --ink:#f4e9f6; --accent:#e879f9; --accent-d:#f0abfc;
    --card:#1e1022; --line:#331f38; --muted:#a888ad; --bad:#f0685c; --field:#150818;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:9px 6px;font-size:13px;font-weight:600;cursor:pointer;min-width:70px}
  .tab.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
  .conv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .col input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:18px;text-align:right;background:var(--field);color:var(--ink)}
  .col select{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(162,28,175,.15)}
  .swap{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px 12px;font-size:18px;cursor:pointer}
  .swap:hover{border-color:var(--accent);color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("unit.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Unit</span>Convert</h1>
  <p>Length, mass, volume, and temperature. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div class="conv">
      <div class="col"><input id="fromVal" type="number" value="1"><select id="fromUnit"></select></div>
      <button class="swap" id="swap" title="Swap">⇄</button>
      <div class="col"><input id="toVal" type="number" readonly><select id="toUnit"></select></div>
    </div>
  </section>
</div>

<footer>
  <b>UnitConvert</b> · offline unit converter · <a href="https://github.com/awictor/unit-convert">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.2.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure conversion ---
const LENGTH={ m:1, km:1000, cm:0.01, mm:0.001, mi:1609.344, yd:0.9144, ft:0.3048, in:0.0254 };
const MASS={ g:1, kg:1000, mg:0.001, t:1e6, lb:453.59237, oz:28.349523125, st:6350.29318 };
const VOLUME={ L:1, mL:0.001, gal:3.785411784, qt:0.946352946, pt:0.473176473, cup:0.2365882365, floz:0.0295735295625 };
const AREA={ "m²":1, "km²":1e6, "cm²":1e-4, ha:10000, "mi²":2589988.110336, acre:4046.8564224, "ft²":0.09290304, "yd²":0.83612736, "in²":0.00064516 };
const SPEED={ "m/s":1, "km/h":0.27777777777777778, mph:0.44704, "ft/s":0.3048, kn:0.5144444444444445 };
const DATA={ B:1, KB:1000, MB:1e6, GB:1e9, TB:1e12, KiB:1024, MiB:1048576, GiB:1073741824, TiB:1099511627776, bit:0.125 };
function convertFactor(value,from,to,table){ if(table[from]==null||table[to]==null) return null; return value*table[from]/table[to]; }
function toC(v,u){ u=String(u).toUpperCase(); return u==="F"?(v-32)*5/9 : u==="K"? v-273.15 : v; }
function fromC(c,u){ u=String(u).toUpperCase(); return u==="F"?c*9/5+32 : u==="K"? c+273.15 : c; }
function convertTemp(v,from,to){ return fromC(toC(v,from),to); }
const CATS={
  Length:{table:LENGTH, units:Object.keys(LENGTH)},
  Mass:{table:MASS, units:Object.keys(MASS)},
  Volume:{table:VOLUME, units:Object.keys(VOLUME)},
  Area:{table:AREA, units:Object.keys(AREA)},
  Speed:{table:SPEED, units:Object.keys(SPEED)},
  Data:{table:DATA, units:Object.keys(DATA)},
  Temperature:{temp:true, units:["C","F","K"]}
};
function convert(value,from,to,cat){ const c=CATS[cat]; if(!c) return null; return c.temp? convertTemp(value,from,to) : convertFactor(value,from,to,c.table); }

// --- UI ---
let CAT="Length";
function fillUnits(){
  const u=CATS[CAT].units;
  $("fromUnit").innerHTML=u.map(x=>`<option>${x}</option>`).join("");
  $("toUnit").innerHTML=u.map(x=>`<option>${x}</option>`).join("");
  $("fromUnit").value=u[0]; $("toUnit").value=u[1]||u[0];
}
function render(){
  const v=parseFloat($("fromVal").value); const val=isNaN(v)?0:v;
  const out=convert(val,$("fromUnit").value,$("toUnit").value,CAT);
  $("toVal").value = out==null?"" : Math.round(out*1e6)/1e6;
  try{localStorage.setItem("unit.cat",CAT);localStorage.setItem("unit.from",$("fromUnit").value);localStorage.setItem("unit.to",$("toUnit").value);localStorage.setItem("unit.val",$("fromVal").value);}catch(e){}
}
$("tabs").innerHTML=Object.keys(CATS).map(c=>`<button class="tab${c===CAT?" on":""}" data-c="${c}">${c}</button>`).join("");
$("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{CAT=b.dataset.c;$("tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));fillUnits();render();});
$("swap").onclick=()=>{const f=$("fromUnit").value;$("fromUnit").value=$("toUnit").value;$("toUnit").value=f;render();};
["fromVal","fromUnit","toUnit"].forEach(id=>$(id).addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("unit.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
fillUnits();
try{const c=localStorage.getItem("unit.cat");if(c&&CATS[c]){CAT=c;$("tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.c===c));fillUnits();}
  const f=localStorage.getItem("unit.from");if(f)$("fromUnit").value=f;const to=localStorage.getItem("unit.to");if(to)$("toUnit").value=to;const v=localStorage.getItem("unit.val");if(v!=null)$("fromVal").value=v;}catch(e){}
render();

if(typeof module!=="undefined") module.exports={LENGTH,MASS,VOLUME,AREA,SPEED,DATA,convertFactor,convertTemp,convert};
</script>
</body>
</html>
