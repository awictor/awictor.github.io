<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typography — Smart Quotes & Dashes Converter</title>
<meta name="description" content="Convert straight quotes to curly quotes, double hyphens to em dashes, and ... to an ellipsis — or straighten them back. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('typography-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#be185d;
    --bg:#f8f5f6; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e8e2e5; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#161114; --card:#20181c; --fg:#f2eaed; --muted:#a5969c; --line:#342830; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#9d174d);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1rem;min-height:130px;resize:vertical}
  .opts{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 2px}
  .opts label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--fg);margin:0;cursor:pointer}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .modes button{padding:8px 16px;border:0;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit}
  .modes button.on{background:var(--c);color:#fff;font-weight:700}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">“ ”</div>
    <div><h1>Typography</h1><div class="sub">Smart quotes, em dashes &amp; ellipses</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="modes" id="modes">
      <button type="button" data-m="smart">Smarten →</button>
      <button type="button" data-m="straight">← Straighten</button>
    </div>
    <div class="opts" id="opts">
      <label><input type="checkbox" id="optQuotes" checked> Curly quotes</label>
      <label><input type="checkbox" id="optDashes" checked> Em dashes</label>
      <label><input type="checkbox" id="optEllipses" checked> Ellipses</label>
    </div>
    <label for="input" style="margin-top:14px">Input</label>
    <textarea id="input" spellcheck="false">She said, "It's a --- long --- wait..." and left.</textarea>
    <label for="output" style="margin-top:14px">Output</label>
    <textarea id="output" readonly></textarea>
    <div class="btns"><button class="act" id="copy" type="button">Copy output</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/smart-quotes">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function curlyQuotes(text){
    return String(text)
      .replace(/(^|[\s([{<–—])"/g, '$1“')  // opening double after space/bracket
      .replace(/"/g, '”')                              // remaining double = closing
      .replace(/(^|[\s([{<–—])'/g, '$1‘')   // opening single
      .replace(/'/g, '’');                             // remaining single = closing / apostrophe
  }

  function emDashes(text){
    return String(text).replace(/-{2,}/g, '—');
  }

  function ellipses(text){
    return String(text).replace(/\.{3,}/g, '…');
  }

  function typographer(text, opts = {}){
    const o = Object.assign({ quotes: true, dashes: true, ellipses: true }, opts);
    let s = String(text);
    if(o.ellipses) s = ellipses(s);
    if(o.dashes) s = emDashes(s);
    if(o.quotes) s = curlyQuotes(s);
    return s;
  }

  function straighten(text){
    return String(text)
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/—/g, '--')
      .replace(/–/g, '-')
      .replace(/…/g, '...');
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('output')){
    const $ = id => document.getElementById(id);
    let mode = 'smart';

    function render(){
      const text = $('input').value;
      if(mode === 'smart'){
        $('output').value = typographer(text, {
          quotes: $('optQuotes').checked,
          dashes: $('optDashes').checked,
          ellipses: $('optEllipses').checked
        });
      }else{
        $('output').value = straighten(text);
      }
    }

    $('modes').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      mode = b.dataset.m;
      [...$('modes').children].forEach(x => x.classList.toggle('on', x === b));
      $('opts').style.opacity = mode === 'smart' ? '1' : '.4';
      render();
    });
    $('modes').querySelector('[data-m="smart"]').classList.add('on');

    ['input', 'optQuotes', 'optDashes', 'optEllipses'].forEach(id => $(id).addEventListener('input', render));
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('output').value); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy output', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('typography-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { curlyQuotes, emDashes, ellipses, typographer, straighten };
</script>
</body>
</html>
