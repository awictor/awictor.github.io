<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonetic — NATO phonetic alphabet speller</title>
<meta name="description" content="Free offline NATO phonetic alphabet speller. Convert any text into Alfa Bravo Charlie for spelling names, codes and passwords over the phone — and decode it back. Includes digit words. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/nato-phonetic/">
<style>
  :root{
    --c:#1d4ed8; --bg:#f8f8f9; --fg:#18181b; --muted:#52525b;
    --card:#ffffff; --border:#e4e4e7; --code:#efeff1;
  }
  [data-theme="dark"]{
    --bg:#09090b; --fg:#e7e7ea; --muted:#8b8b93; --card:#151518;
    --border:#27272a; --code:#1c1c20;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#3b82f6);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:720px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--bg);
    color:var(--muted);cursor:pointer;font-size:.9rem;font-weight:600}
  .tab.on{background:var(--c);color:#fff;border-color:var(--c)}
  label{display:block;font-weight:600;font-size:.82rem;margin:0 0 6px}
  textarea{width:100%;min-height:90px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;
    background:var(--bg);color:var(--fg);font-size:.98rem;line-height:1.55;resize:vertical;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .outwrap{margin-top:16px}
  .outwrap .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .copy{background:none;border:1px solid var(--border);color:var(--fg);border-radius:8px;
    padding:5px 10px;cursor:pointer;font-size:.8rem}
  .out{padding:14px 16px;border:1px solid var(--border);border-radius:11px;background:var(--code);
    font-family:ui-monospace,monospace;font-size:1rem;line-height:1.7;min-height:44px;word-break:break-word;white-space:pre-wrap}
  .out .w{color:var(--c);font-weight:600}
  .chart{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
  .chart .item{font-size:.82rem;padding:6px 10px;border:1px solid var(--border);border-radius:8px;
    font-family:ui-monospace,monospace}
  .chart .item b{color:var(--c)}
  .hint{color:var(--muted);font-size:.82rem;margin:16px 0 0}
  footer{max-width:720px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('nato.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">A·B</div>
  <div>
    <h1>Phonetic</h1>
    <p class="sub">NATO phonetic alphabet speller</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="tabs">
      <button class="tab on" id="tab-enc">Text → Phonetic</button>
      <button class="tab" id="tab-dec">Phonetic → Text</button>
    </div>
    <label for="in" id="inlabel">Text to spell out</label>
    <textarea id="in" spellcheck="false" autocapitalize="off">Wictor 42</textarea>
    <div class="outwrap">
      <div class="row"><label style="margin:0">Result</label><button class="copy" id="copy">Copy</button></div>
      <div class="out" id="out"></div>
    </div>
    <p class="hint" id="hint">Uses the official ICAO/NATO spellings — note <b>Alfa</b> and <b>Juliett</b> (not "Alpha"/"Juliet").
      Digits map to their number words. Decoding accepts common variants like "Alpha".</p>
  </div>

  <div class="panel">
    <label>Reference chart</label>
    <div class="chart" id="chart"></div>
  </div>
</main>
<footer>
  Phonetic is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/nato-phonetic">Source</a>
</footer>

<script>
// ---- pure functions ----
var NATO = {
  A:'Alfa', B:'Bravo', C:'Charlie', D:'Delta', E:'Echo', F:'Foxtrot', G:'Golf',
  H:'Hotel', I:'India', J:'Juliett', K:'Kilo', L:'Lima', M:'Mike', N:'November',
  O:'Oscar', P:'Papa', Q:'Quebec', R:'Romeo', S:'Sierra', T:'Tango', U:'Uniform',
  V:'Victor', W:'Whiskey', X:'X-ray', Y:'Yankee', Z:'Zulu'
};
var DIGITS = {
  '0':'Zero', '1':'One', '2':'Two', '3':'Three', '4':'Four',
  '5':'Five', '6':'Six', '7':'Seven', '8':'Eight', '9':'Nine'
};
// reverse lookup incl. common aliases
var REV = (function(){
  var r = {};
  for(var k in NATO) r[NATO[k].toLowerCase()] = k;
  for(var d in DIGITS) r[DIGITS[d].toLowerCase()] = d;
  r['alpha'] = 'A'; r['juliet'] = 'J'; r['xray'] = 'X'; r['niner'] = '9';
  r['tree'] = '3'; r['fife'] = '5'; r['fower'] = '4';
  return r;
})();

function charToWord(ch){
  var c = String(ch);
  var up = c.toUpperCase();
  if(NATO.hasOwnProperty(up)) return NATO[up];
  if(DIGITS.hasOwnProperty(c)) return DIGITS[c];
  return null;
}
function toNato(text, opts){
  opts = opts || {};
  var sep = opts.wordSep === undefined ? ' ' : opts.wordSep;
  var space = opts.space === undefined ? '|' : opts.space;
  var keepUnknown = opts.keepUnknown !== false;
  var s = String(text), out = [];
  for(var i = 0; i < s.length; i++){
    var ch = s[i];
    if(ch === ' '){ if(space !== '') out.push(space); continue; }
    if(ch === '\n'){ continue; }
    var w = charToWord(ch);
    if(w) out.push(w);
    else if(keepUnknown) out.push(ch);
  }
  return out.join(sep);
}
function fromNato(str, opts){
  opts = opts || {};
  var space = opts.space === undefined ? '|' : opts.space;
  var toks = String(str).trim().split(/\s+/);
  var out = [];
  for(var i = 0; i < toks.length; i++){
    var t = toks[i];
    if(t === '') continue;
    if(t === space){ out.push(' '); continue; }
    var lc = t.toLowerCase();
    if(REV.hasOwnProperty(lc)) out.push(REV[lc]);
    else out.push(t); // passthrough unknown
  }
  return out.join('');
}

if(typeof module !== 'undefined') module.exports = { NATO, DIGITS, REV, charToWord, toNato, fromNato };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  var chartEl = document.getElementById('chart');
  var inLabel = document.getElementById('inlabel');
  var tabEnc = document.getElementById('tab-enc');
  var tabDec = document.getElementById('tab-dec');
  var mode = 'enc';

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(){
    if(mode === 'enc'){
      var words = toNato(inEl.value);
      outEl.innerHTML = words.split(' ').map(function(w){
        return w === '|' ? '<span style="opacity:.4">/</span>' : '<span class="w">' + esc(w) + '</span>';
      }).join(' ');
    } else {
      outEl.textContent = fromNato(inEl.value);
    }
    try{ localStorage.setItem('nato.in', inEl.value); localStorage.setItem('nato.mode', mode); }catch(e){}
  }
  function setMode(m){
    mode = m;
    tabEnc.classList.toggle('on', m === 'enc');
    tabDec.classList.toggle('on', m === 'dec');
    inLabel.textContent = m === 'enc' ? 'Text to spell out' : 'Phonetic words to decode';
    render();
  }
  tabEnc.addEventListener('click', function(){ setMode('enc'); });
  tabDec.addEventListener('click', function(){ setMode('dec'); });
  inEl.addEventListener('input', render);
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.textContent);
  });

  // build reference chart
  var chartHtml = '';
  for(var k in NATO) chartHtml += '<div class="item"><b>' + k + '</b> ' + NATO[k] + '</div>';
  for(var d in DIGITS) chartHtml += '<div class="item"><b>' + d + '</b> ' + DIGITS[d] + '</div>';
  chartEl.innerHTML = chartHtml;

  try{ var s = localStorage.getItem('nato.in'); if(s !== null) inEl.value = s;
       var mm = localStorage.getItem('nato.mode'); if(mm) mode = mm; }catch(e){}
  setMode(mode);

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('nato.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('nato.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
