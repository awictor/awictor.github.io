<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROICalc — Return on Investment Calculator</title>
<meta name="description" content="Calculate total ROI, net profit, and annualized return from an initial investment and final value over a holding period. 100% offline, no signup." />
<meta name="theme-color" content="#0891b2" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="ROICalc — Return on Investment Calculator" />
<meta property="og:description" content="Total ROI %, net profit, and annualized return. Offline." />
<meta property="og:url" content="https://awictor.github.io/roi-calc/" />
<link rel="canonical" href="https://awictor.github.io/roi-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230891b2'/%3E%3Cpath d='M16 44 L28 30 L36 36 L48 20' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M40 20 H48 V28' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eff8fb; --ink:#08222a; --accent:#0891b2; --accent-d:#0e7490;
    --card:#fff; --line:#d3e8ee; --muted:#4f6c73; --good:#16a34a; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(8,34,42,.05),0 8px 24px rgba(8,34,42,.07); }
  [data-theme="dark"]{ --bg:#05161b; --ink:#e6f2f6; --accent:#22d3ee; --accent-d:#67e8f9;
    --card:#0e1f25; --line:#1e363e; --muted:#8aa6ad; --good:#34c884; --bad:#f0685c; --field:#05161b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  .ig{position:relative}
  .ig .pre{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  input[type=number]{width:150px;padding:11px 12px 11px 24px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(8,145,178,.15)}
  .result{text-align:center}
  .big{font-size:46px;font-weight:800;line-height:1}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
  .stat .v{font-size:19px;font-weight:700} .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("roi.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">ROI</span>Calc</h1>
  <p>Return on investment — total, profit, and annualized. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Initial investment</label><div class="ig"><span class="pre">$</span><input id="cost" type="number" step="100" value="1000"></div></div>
    <div class="row"><label>Final value</label><div class="ig"><span class="pre">$</span><input id="gain" type="number" step="100" value="1500"></div></div>
    <div class="row"><label>Holding period (years)</label><div class="ig"><span class="pre">#</span><input id="years" type="number" step="0.5" value="3"></div></div>
  </section>

  <section class="card result">
    <div style="color:var(--muted);font-size:14px">Total ROI</div>
    <div class="big" id="roi">—</div>
    <div class="grid">
      <div class="stat"><div class="v" id="profit">—</div><div class="k">Net profit</div></div>
      <div class="stat"><div class="v" id="annual">—</div><div class="k">Annualized</div></div>
    </div>
  </section>
</div>

<footer>
  <b>ROICalc</b> · offline return on investment calculator · <a href="https://github.com/awictor/roi-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Annualized = (final/initial)^(1/years) − 1. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const money=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});
const pct=n=>(n>=0?"+":"")+(Math.round(n*100)/100)+"%";

// --- Pure ROI math ---
function roi(gain,cost){ return cost===0 ? null : (gain-cost)/cost*100; }
function netProfit(gain,cost){ return gain-cost; }
function annualizedROI(gain,cost,years){ return (cost<=0||years<=0||gain<=0) ? null : (Math.pow(gain/cost,1/years)-1)*100; }

// --- UI ---
function render(){
  const cost=num("cost"), gain=num("gain"), years=num("years");
  try{["cost","gain","years"].forEach(k=>localStorage.setItem("roi."+k,$(k).value));}catch(e){}
  const r=roi(gain,cost), np=netProfit(gain,cost), a=annualizedROI(gain,cost,years);
  if(r==null){ $("roi").textContent="—"; $("roi").className="big"; $("profit").textContent="—"; $("annual").textContent="—"; return; }
  $("roi").textContent=pct(r); $("roi").className="big "+(r>=0?"pos":"neg");
  $("profit").textContent=money(np);
  $("annual").textContent = a==null ? "—" : pct(a)+"/yr";
}
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("roi.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["cost","gain","years"].forEach(k=>{const v=localStorage.getItem("roi."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={roi,netProfit,annualizedROI};
</script>
</body>
</html>
