<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leetspeak — l33t Sp34k Translator</title>
<meta name="description" content="Translate text to leetspeak at basic or full intensity, and decode leet back to letters (best effort). 100% offline, nothing leaves your browser.">
<script>
  (function(){ try{
    var t = localStorage.getItem('leet-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#16a34a;
    --bg:#f2f8f4; --card:#ffffff; --fg:#122017; --muted:#566b5d; --line:#dcebe0; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#08130c; --card:#0f1d13; --fg:#e6f4ec; --muted:#84a390; --line:#1a2c20; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:680px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#166534);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:800;font-family:ui-monospace,monospace}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:680px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;min-height:100px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.05rem;resize:vertical}
  .modes{display:flex;gap:6px;margin:14px 0}
  .modes button{flex:1;padding:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer;font:inherit}
  .modes button.active{background:var(--c);color:#fff;border-color:var(--c)}
  .out{min-height:80px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:1.15rem}
  .copy{margin-top:10px;background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}
  .lvl{color:var(--muted);font-size:.85rem;margin-top:8px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:680px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">13</div>
    <div><h1>Leetspeak</h1><div class="sub">l33t sp34k translator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="text">Text</label>
    <textarea id="text" spellcheck="false">leet hacker elite</textarea>
    <div class="modes" id="lvlBtns">
      <button data-lvl="basic" class="active" type="button">Basic</button>
      <button data-lvl="full" type="button">Full</button>
      <button data-lvl="decode" type="button">Decode</button>
    </div>
    <div class="lvl" id="lvlNote"></div>
  </div>
  <div class="card">
    <label>Result</label>
    <div class="out" id="out"></div>
    <button class="copy" id="copyBtn" type="button">Copy</button>
  </div>
</main>
<footer>
  Leetspeak swaps letters for look-alike numbers and symbols (a→4, e→3, l→1…). "Basic" changes vowels &amp; a few consonants; "Full" is heavier. Decoding is best-effort since some leet symbols are ambiguous. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/leetspeak">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  const MAPS = {
    basic: { a: '4', e: '3', i: '1', o: '0', t: '7', s: '5' },
    full:  { a: '4', e: '3', i: '1', o: '0', t: '7', s: '5', l: '1', g: '9', b: '8', z: '2', c: '(' }
  };
  // Unambiguous reverse (best-effort): pick one letter per symbol.
  const DELEET = { '4': 'a', '3': 'e', '1': 'i', '0': 'o', '7': 't', '5': 's', '9': 'g', '8': 'b', '2': 'z', '(': 'c' };

  function leetify(text, level = 'basic'){
    const map = MAPS[level];
    if(!map) throw new Error('unknown level: ' + level);
    return String(text).split('').map(ch => {
      const key = ch.toLowerCase();
      return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : ch;
    }).join('');
  }

  function deleet(text){
    return String(text).split('').map(ch => DELEET[ch] || ch).join('');
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    let level = 'basic';
    const NOTES = { basic: 'Basic: a4 e3 i1 o0 t7 s5', full: 'Full: adds l1 g9 b8 z2 c(', decode: 'Best-effort decode back to letters' };

    function render(){
      try{
        const result = level === 'decode' ? deleet($('text').value) : leetify($('text').value, level);
        $('out').textContent = result;
        $('lvlNote').textContent = NOTES[level];
      }catch(e){ $('out').textContent = e.message; }
    }
    $('lvlBtns').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      level = b.dataset.lvl;
      $('lvlBtns').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      render();
    }));
    $('text').addEventListener('input', render);
    $('copyBtn').addEventListener('click', () => {
      navigator.clipboard?.writeText($('out').textContent);
      $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy', 1200);
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('leet-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { MAPS, DELEET, leetify, deleet };
</script>
</body>
</html>
