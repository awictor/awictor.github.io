<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BMICalc — BMI Calculator (Metric &amp; Imperial)</title>
<meta name="description" content="Calculate your Body Mass Index in metric or imperial units, with your WHO category and healthy weight range. 100% offline, no signup." />
<meta name="theme-color" content="#047857" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="BMICalc — BMI Calculator" />
<meta property="og:description" content="BMI in metric or imperial, with WHO category and healthy weight range. Offline." />
<meta property="og:url" content="https://awictor.github.io/bmi-calc/" />
<link rel="canonical" href="https://awictor.github.io/bmi-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23047857'/%3E%3Cpath d='M18 40 A14 14 0 0 1 46 40' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cline x1='32' y1='40' x2='42' y2='30' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eef8f3; --ink:#0a2019; --accent:#047857; --accent-d:#065f46;
    --card:#fff; --line:#d0e9de; --muted:#4d6b60; --field:#fff;
    --under:#0ea5e9; --normal:#16a34a; --over:#f59e0b; --obese:#e5484d;
    --shadow:0 1px 2px rgba(10,32,25,.05),0 8px 24px rgba(10,32,25,.07); }
  [data-theme="dark"]{ --bg:#05140e; --ink:#e6f2ec; --accent:#34d399; --accent-d:#6ee7b7;
    --card:#0e1f18; --line:#1d352c; --muted:#88a89a; --field:#05140e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
  .segbtn{flex:1;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:9px;font-size:14px;font-weight:600;cursor:pointer}
  .segbtn.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:12px 0;gap:12px}
  .row label{font-size:14px}
  .ig{display:flex;gap:8px}
  input[type=number]{width:110px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(4,120,87,.15)}
  .result{text-align:center}
  .big{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1;margin:2px 0}
  .badge{display:inline-block;font-size:15px;font-weight:700;border-radius:20px;padding:4px 16px;margin-top:8px;color:#fff}
  .bar{height:12px;border-radius:6px;margin:18px 0 6px;background:linear-gradient(to right,var(--under) 0%,var(--under) 20%,var(--normal) 20%,var(--normal) 55%,var(--over) 55%,var(--over) 75%,var(--obese) 75%,var(--obese) 100%)}
  .barwrap{position:relative}
  .marker{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
  .note{margin-top:14px;font-size:14px;color:var(--muted)}
  .note b{color:var(--ink)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("bmi.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">BMI</span>Calc</h1>
  <p>Your Body Mass Index, category, and healthy weight range. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="seg" id="unitSeg">
      <button class="segbtn on" data-u="metric">Metric (kg, cm)</button>
      <button class="segbtn" data-u="imperial">Imperial (lb, ft/in)</button>
    </div>
    <div id="metric">
      <div class="row"><label>Height</label><div class="ig"><input id="cm" type="number" value="175"> <span style="align-self:center;color:var(--muted)">cm</span></div></div>
      <div class="row"><label>Weight</label><div class="ig"><input id="kg" type="number" value="70"> <span style="align-self:center;color:var(--muted)">kg</span></div></div>
    </div>
    <div id="imperial" hidden>
      <div class="row"><label>Height</label><div class="ig"><input id="ft" type="number" value="5" style="width:60px"> <span style="align-self:center;color:var(--muted)">ft</span> <input id="inch" type="number" value="9" style="width:60px"> <span style="align-self:center;color:var(--muted)">in</span></div></div>
      <div class="row"><label>Weight</label><div class="ig"><input id="lb" type="number" value="154"> <span style="align-self:center;color:var(--muted)">lb</span></div></div>
    </div>
  </section>

  <section class="card result">
    <div class="big" id="bmiVal">—</div>
    <div class="badge" id="cat">—</div>
    <div class="barwrap"><div class="bar"></div><div class="marker" id="marker" style="left:0%"></div></div>
    <div class="note" id="note"></div>
  </section>
</div>

<footer>
  <b>BMICalc</b> · offline BMI calculator · <a href="https://github.com/awictor/bmi-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  WHO categories · BMI is a rough screen, not a diagnosis. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};

// --- Pure BMI math ---
function bmi(kg,m){ return m>0 ? kg/(m*m) : 0; }
function bmiImperial(lb,inch){ return inch>0 ? 703*lb/(inch*inch) : 0; }
function bmiCategory(b){ return b<18.5?"Underweight":b<25?"Normal":b<30?"Overweight":"Obese"; }
function healthyRange(m){ return {min:18.5*m*m, max:24.9*m*m}; } // kg for a given height (m)

// --- UI ---
let UNIT="metric";
const COLORS={Underweight:"var(--under)",Normal:"var(--normal)",Overweight:"var(--over)",Obese:"var(--obese)"};
function markerPct(b){ return Math.max(0,Math.min(100, (b/40)*100 )); } // 0–40 BMI scale
function render(){
  let b, m;
  if(UNIT==="metric"){ m=num("cm")/100; b=bmi(num("kg"),m); }
  else { const inch=num("ft")*12+num("inch"); m=inch*0.0254; b=bmiImperial(num("lb"),inch); }
  try{["cm","kg","ft","inch","lb"].forEach(k=>localStorage.setItem("bmi."+k,$(k).value));localStorage.setItem("bmi.unit",UNIT);}catch(e){}
  if(!b||!isFinite(b)){ $("bmiVal").textContent="—"; $("cat").textContent="—"; $("cat").style.background="var(--muted)"; $("note").textContent=""; return; }
  const cat=bmiCategory(b);
  $("bmiVal").textContent=b.toFixed(1);
  $("cat").textContent=cat; $("cat").style.background=COLORS[cat];
  $("marker").style.left=markerPct(b)+"%";
  const hr=healthyRange(m);
  if(UNIT==="metric") $("note").innerHTML=`Healthy weight for your height: <b>${hr.min.toFixed(1)}–${hr.max.toFixed(1)} kg</b>.`;
  else $("note").innerHTML=`Healthy weight for your height: <b>${(hr.min/0.45359237).toFixed(0)}–${(hr.max/0.45359237).toFixed(0)} lb</b>.`;
}
$("unitSeg").querySelectorAll(".segbtn").forEach(btn=>btn.onclick=()=>{UNIT=btn.dataset.u;$("unitSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x===btn));$("metric").hidden=UNIT!=="metric";$("imperial").hidden=UNIT!=="imperial";render();});
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("bmi.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["cm","kg","ft","inch","lb"].forEach(k=>{const v=localStorage.getItem("bmi."+k);if(v!=null)$(k).value=v;});const u=localStorage.getItem("bmi.unit");if(u&&u!=="metric"){$("unitSeg").querySelector('[data-u="'+u+'"]').click();}}catch(e){}
render();

if(typeof module!=="undefined") module.exports={bmi,bmiImperial,bmiCategory,healthyRange};
</script>
</body>
</html>
