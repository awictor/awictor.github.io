<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkExtract — URL & Markdown Link Extractor</title>
<meta name="description" content="Extract every URL and markdown link from a blob of text, deduplicated, and copy the list. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('link-extract-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#0369a1;
    --bg:#f4f6f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e5e9; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0e1319; --card:#171d25; --fg:#eef2f6; --muted:#96a0ac; --line:#242c37; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:800px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#075985);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:800px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem;min-height:120px;resize:vertical}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
  .modes button{padding:8px 14px;border:0;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit}
  .modes button.on{background:var(--c);color:#fff;font-weight:700}
  .count{color:var(--muted);font-size:.82rem;margin:2px 0 8px}
  .link{padding:9px 0;border-bottom:1px solid var(--line)}
  .link .t{font-weight:600}
  .link a{color:var(--c);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;word-break:break-all;text-decoration:none}
  .none{color:var(--muted);text-align:center;padding:10px}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  button.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:800px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🔗</div>
    <div><h1>LinkExtract</h1><div class="sub">Pull every URL &amp; markdown link out of text</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="input">Paste text or markdown</label>
    <textarea id="input" spellcheck="false">Check [our docs](https://example.com/docs) and the repo at https://github.com/awictor/toolkit.
Also see https://example.com/docs (duplicate) and http://plain.org/page?a=1.</textarea>
    <div class="modes" id="modes">
      <button type="button" data-m="all">All</button>
      <button type="button" data-m="md">Markdown only</button>
      <button type="button" data-m="bare">Bare URLs only</button>
    </div>
  </div>
  <div class="card">
    <div class="count" id="count"></div>
    <div id="list"></div>
    <div class="btns">
      <button class="act" id="copyUrls" type="button">Copy URLs</button>
      <button class="ghost" id="copyMd" type="button">Copy as Markdown</button>
    </div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/link-extract">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function extractMarkdownLinks(text){
    const re = /\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g;
    const out = []; let m;
    while((m = re.exec(String(text)))) out.push({ text: m[1], url: m[2] });
    return out;
  }

  function extractUrls(text){
    const re = /https?:\/\/[^\s)<>"'\]]+/g;
    return (String(text).match(re) || []).map(u => u.replace(/[.,;:!?]+$/, ''));
  }

  function extractAll(text){
    const md = extractMarkdownLinks(text);
    const seen = new Set(md.map(l => l.url));
    const out = [...md];
    for(const u of extractUrls(text)){
      if(!seen.has(u)){ seen.add(u); out.push({ text: u, url: u }); }
    }
    return out;
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('list')){
    const $ = id => document.getElementById(id);
    let mode = 'all';

    function current(){
      const text = $('input').value;
      if(mode === 'md') return extractMarkdownLinks(text);
      if(mode === 'bare'){
        const seen = new Set(); const out = [];
        for(const u of extractUrls(text)) if(!seen.has(u)){ seen.add(u); out.push({ text: u, url: u }); }
        return out;
      }
      return extractAll(text);
    }

    function render(){
      const links = current();
      $('count').textContent = `${links.length} link${links.length === 1 ? '' : 's'}`;
      $('list').innerHTML = links.length
        ? links.map(l => `<div class="link"><div class="t">${l.text ? l.text.replace(/</g, '&lt;') : '(no text)'}</div><a href="${l.url}" target="_blank" rel="noopener">${l.url.replace(/</g, '&lt;')}</a></div>`).join('')
        : '<div class="none">No links found.</div>';
    }

    $('modes').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      mode = b.dataset.m;
      [...$('modes').children].forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('modes').querySelector('[data-m="all"]').classList.add('on');
    $('input').addEventListener('input', render);
    $('copyUrls').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText(current().map(l => l.url).join('\n')); $('copyUrls').textContent = 'Copied!'; setTimeout(() => $('copyUrls').textContent = 'Copy URLs', 1200); }catch(e){}
    });
    $('copyMd').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText(current().map(l => `[${l.text}](${l.url})`).join('\n')); $('copyMd').textContent = 'Copied!'; setTimeout(() => $('copyMd').textContent = 'Copy as Markdown', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('link-extract-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { extractMarkdownLinks, extractUrls, extractAll };
</script>
</body>
</html>
