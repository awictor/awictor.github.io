<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPV — Net Present Value & IRR Calculator</title>
<meta name="description" content="Enter a discount rate and a series of cash flows to compute net present value (NPV) and the internal rate of return (IRR). Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('npv-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#0e7490;
    --bg:#f4f7f8; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e6e8; --shadow:0 1px 3px rgba(0,0,0,.08); --up:#16a34a; --down:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0e1416; --card:#171f22; --fg:#eef3f5; --muted:#93a1a6; --line:#253034; --shadow:0 1px 3px rgba(0,0,0,.5); --up:#4ade80; --down:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#155e75);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .flow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
  .flow .yr{color:var(--muted);font-size:.85rem;font-weight:600}
  .flow button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:8px 11px;cursor:pointer;font:inherit}
  .add{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600;margin-top:6px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  @media(max-width:480px){.res{grid-template-columns:1fr}}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .stat span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat b{font-size:1.6rem;font-variant-numeric:tabular-nums}
  .verdict{text-align:center;margin-top:12px;font-size:.9rem}
  .rate-row{display:flex;gap:12px;align-items:end}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">💵</div>
    <div><h1>NPV</h1><div class="sub">Net present value &amp; internal rate of return</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="rate">Discount rate (% per period)</label>
    <input type="number" id="rate" value="10" step="any">
  </div>
  <div class="card">
    <label>Cash flows (year 0 = initial outlay, usually negative)</label>
    <div id="flows"></div>
    <button class="add" id="add" type="button">+ Add year</button>
  </div>
  <div class="card">
    <div class="res">
      <div class="stat"><span>NPV at rate</span><b id="npvOut">—</b></div>
      <div class="stat"><span>IRR</span><b id="irrOut">—</b></div>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>
</main>
<footer>
  Estimates only — not financial advice. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/npv-calc">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function npv(rate, cashflows){
    if(!Array.isArray(cashflows) || cashflows.length === 0) throw new Error('cashflows required');
    if(rate <= -1) throw new Error('rate must be greater than -1');
    let sum = 0;
    for(let t = 0; t < cashflows.length; t++) sum += Number(cashflows[t]) / Math.pow(1 + rate, t);
    return sum;
  }

  // internal rate of return via bisection; returns null when there is no sign change in range
  function irr(cashflows){
    let a = -0.9999, b = 10;
    let fa = npv(a, cashflows), fb = npv(b, cashflows);
    if(fa === 0) return a;
    if(fb === 0) return b;
    if(fa * fb > 0) return null;
    for(let i = 0; i < 300; i++){
      const m = (a + b) / 2, fm = npv(m, cashflows);
      if(Math.abs(fm) < 1e-9 || (b - a) / 2 < 1e-12) return m;
      if(fa * fm < 0){ b = m; fb = fm; } else { a = m; fa = fm; }
    }
    return (a + b) / 2;
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('flows')){
    const $ = id => document.getElementById(id);
    const money = n => n.toLocaleString(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });

    function addFlow(val = ''){
      const idx = $('flows').children.length;
      const row = document.createElement('div');
      row.className = 'flow';
      row.innerHTML = `<div class="yr">Year ${idx}</div><input type="number" step="any" class="cf" value="${val}"><button type="button" class="rm">✕</button>`;
      row.querySelector('.rm').addEventListener('click', () => { row.remove(); relabel(); render(); });
      row.querySelector('.cf').addEventListener('input', render);
      $('flows').appendChild(row);
    }

    function relabel(){
      [...$('flows').children].forEach((r, i) => { r.querySelector('.yr').textContent = 'Year ' + i; });
    }

    function currentFlows(){
      return [...$('flows').querySelectorAll('.cf')].map(i => i.value === '' ? 0 : Number(i.value));
    }

    function render(){
      const rate = Number($('rate').value) / 100;
      const cf = currentFlows();
      let npvVal, irrVal;
      try{ npvVal = npv(rate, cf); }catch(e){ $('npvOut').textContent = '—'; }
      if(npvVal != null && isFinite(npvVal)){ $('npvOut').textContent = money(npvVal); $('npvOut').style.color = npvVal >= 0 ? 'var(--up)' : 'var(--down)'; }
      try{ irrVal = irr(cf); }catch(e){ irrVal = null; }
      $('irrOut').textContent = (irrVal == null || !isFinite(irrVal)) ? '—' : (irrVal * 100).toFixed(2) + '%';
      if(npvVal != null && isFinite(npvVal)){
        $('verdict').textContent = npvVal >= 0
          ? 'Positive NPV — the project clears your discount rate.'
          : 'Negative NPV — the project falls short of your discount rate.';
      } else $('verdict').textContent = '';
    }

    $('add').addEventListener('click', () => { addFlow(); relabel(); render(); });
    $('rate').addEventListener('input', render);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('npv-theme', cur); }catch(e){}
    });

    [-1000, 300, 400, 500, 600].forEach(addFlow);
    render();
  }

  if(typeof module !== 'undefined') module.exports = { npv, irr };
</script>
</body>
</html>
