<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastRead — Fixation (Bionic-style) Reading Converter</title>
<meta name="description" content="Convert text to fixation reading: bold the leading part of every word to guide your eye and read faster. Adjustable ratio, copy-ready HTML. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('fast-read-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#9333ea;
    --bg:#f7f5f9; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e8e2ec; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#140f18; --card:#1d1722; --fg:#f1ecf4; --muted:#a294a8; --line:#312839; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#6b21a8);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1rem;min-height:120px;resize:vertical}
  .row{display:flex;align-items:center;gap:14px;margin-top:14px}
  .row input[type=range]{flex:1;accent-color:var(--c)}
  .row b{font-variant-numeric:tabular-nums;min-width:3ch}
  .reader{font-size:1.25rem;line-height:1.9;padding:8px 2px}
  .reader b{color:var(--fg);font-weight:800}
  .reader{color:var(--muted)}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">👓</div>
    <div><h1>FastRead</h1><div class="sub">Fixation reading — bold the start of each word</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="input">Your text</label>
    <textarea id="input" spellcheck="false">Reading gets faster when your eyes fixate on the first part of each word. Try adjusting the fixation strength below and see what feels best.</textarea>
    <div class="row">
      <label style="margin:0">Fixation</label>
      <input type="range" id="ratio" min="20" max="80" value="50">
      <b id="ratioV">50%</b>
    </div>
  </div>

  <div class="card">
    <div class="reader" id="reader"></div>
    <div class="meta" id="meta"></div>
    <div class="btns"><button class="act" id="copy" type="button">Copy HTML</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/fast-read">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function escapeHtml(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function boldWord(word, ratio){
    const n = Math.max(1, Math.ceil(word.length * ratio));
    return '<b>' + word.slice(0, n) + '</b>' + word.slice(n);
  }

  // bold the leading `ratio` fraction of every alphanumeric word; gaps are HTML-escaped
  function bionic(text, ratio = 0.5){
    if(!(ratio > 0 && ratio <= 1)) throw new Error('ratio must be between 0 and 1');
    const s = String(text);
    const re = /[A-Za-z0-9]+/g;
    let out = '', last = 0, m;
    while((m = re.exec(s))){
      out += escapeHtml(s.slice(last, m.index));
      out += boldWord(m[0], ratio);
      last = m.index + m[0].length;
    }
    out += escapeHtml(s.slice(last));
    return out;
  }

  function wordCount(text){
    const m = String(text).match(/[A-Za-z0-9]+/g);
    return m ? m.length : 0;
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('reader')){
    const $ = id => document.getElementById(id);

    function render(){
      const ratio = +$('ratio').value / 100;
      $('ratioV').textContent = $('ratio').value + '%';
      const text = $('input').value;
      $('reader').innerHTML = bionic(text, ratio).replace(/\n/g, '<br>');
      const words = wordCount(text);
      $('meta').textContent = `${words} word${words === 1 ? '' : 's'} · ~${Math.max(1, Math.round(words / 200))} min at 200 wpm`;
    }

    $('input').addEventListener('input', render);
    $('ratio').addEventListener('input', render);
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText(bionic($('input').value, +$('ratio').value / 100)); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy HTML', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('fast-read-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { escapeHtml, boldWord, bionic, wordCount };
</script>
</body>
</html>
