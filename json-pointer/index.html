<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JsonPointer — RFC 6901 JSON Pointer Resolver</title>
<meta name="description" content="Resolve an RFC 6901 JSON Pointer (like /foo/0/bar) against a JSON document, with correct ~0/~1 escaping, and list every pointer in the document. 100% offline.">
<script>
  (function(){ try{
    var t = localStorage.getItem('jptr-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#2563eb;
    --bg:#f3f5fb; --card:#ffffff; --fg:#161a24; --muted:#5c6170; --line:#e3e6f0; --shadow:0 1px 3px rgba(0,0,0,.08);
    --ok:#16a34a; --no:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0c0e16; --card:#161a24; --fg:#eef0f7; --muted:#929aad; --line:#252a37; --shadow:0 1px 3px rgba(0,0,0,.5);
    --ok:#4ade80; --no:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:800}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:760px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem;resize:vertical}
  input.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:1.05rem;margin-top:4px}
  .result{margin-top:12px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);word-break:break-all;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem}
  .result.err{color:var(--no)}
  .result.ok{border-left:3px solid var(--ok)}
  h2{font-size:.82rem;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .ptrs{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
  .ptr{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:.85rem}
  .ptr:hover{border-color:var(--c)}
  .ptr .p{color:var(--c);font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .ptr .v{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:760px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo mono">/→</div>
    <div><h1>JsonPointer</h1><div class="sub">RFC 6901 resolver</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="json">JSON document</label>
    <textarea id="json" spellcheck="false">{
  "foo": ["bar", "baz"],
  "a/b": 1,
  "m~n": 8,
  "nested": { "list": [10, { "x": true }] }
}</textarea>
  </div>
  <div class="card">
    <label for="ptr">JSON Pointer (empty = whole document)</label>
    <input class="mono" id="ptr" value="/nested/list/1/x" spellcheck="false">
    <div class="result" id="result"></div>
  </div>
  <div class="card">
    <h2>All pointers</h2>
    <div class="ptrs" id="ptrs"></div>
  </div>
</main>
<footer>
  Implements <strong>RFC 6901</strong>: tokens are separated by <span class="mono">/</span>; <span class="mono">~1</span> means <span class="mono">/</span> and <span class="mono">~0</span> means <span class="mono">~</span>. Click a pointer to resolve it. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/json-pointer">Source</a>.
</footer>

<script>
  // ---------- pure logic (RFC 6901) ----------
  const unescapeToken = t => String(t).replace(/~1/g, '/').replace(/~0/g, '~');
  const escapeToken   = t => String(t).replace(/~/g, '~0').replace(/\//g, '~1');

  function parsePointer(pointer){
    const s = String(pointer);
    if(s === '') return [];
    if(s[0] !== '/') throw new Error('a non-empty pointer must start with "/"');
    return s.split('/').slice(1).map(unescapeToken);
  }

  function resolve(doc, pointer){
    const tokens = parsePointer(pointer);
    let cur = doc;
    for(const tok of tokens){
      if(Array.isArray(cur)){
        if(tok === '-') throw new Error('"-" refers to the (nonexistent) element after the last');
        if(!/^(0|[1-9][0-9]*)$/.test(tok)) throw new Error('invalid array index: "' + tok + '"');
        const i = Number(tok);
        if(i >= cur.length) throw new Error('array index out of range: ' + i);
        cur = cur[i];
      }else if(cur !== null && typeof cur === 'object'){
        if(!Object.prototype.hasOwnProperty.call(cur, tok)) throw new Error('no such key: "' + tok + '"');
        cur = cur[tok];
      }else{
        throw new Error('cannot descend into a ' + (cur === null ? 'null' : typeof cur));
      }
    }
    return cur;
  }

  // Every pointer in the document (root first).
  function listPointers(doc){
    const out = [];
    (function walk(node, ptr){
      out.push(ptr);
      if(Array.isArray(node)) node.forEach((v, i) => walk(v, ptr + '/' + i));
      else if(node !== null && typeof node === 'object')
        for(const k of Object.keys(node)) walk(node[k], ptr + '/' + escapeToken(k));
    })(doc, '');
    return out;
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('result')){
    const $ = id => document.getElementById(id);
    const preview = v => {
      const s = JSON.stringify(v);
      return s === undefined ? 'undefined' : (s.length > 60 ? s.slice(0, 57) + '…' : s);
    };

    function parsedDoc(){ return JSON.parse($('json').value); }

    function renderResult(){
      let doc;
      try{ doc = parsedDoc(); }
      catch(e){ $('result').className = 'result err'; $('result').textContent = 'Invalid JSON: ' + e.message; $('ptrs').innerHTML = ''; return; }
      try{
        const val = resolve(doc, $('ptr').value);
        $('result').className = 'result ok';
        $('result').textContent = JSON.stringify(val, null, 2);
      }catch(e){ $('result').className = 'result err'; $('result').textContent = e.message; }
    }

    function renderList(){
      let doc;
      try{ doc = parsedDoc(); }catch(e){ $('ptrs').innerHTML = ''; return; }
      $('ptrs').innerHTML = listPointers(doc).map(p => {
        const val = resolve(doc, p);
        const label = p === '' ? '(root)' : p;
        return `<div class="ptr" data-p="${p.replace(/"/g, '&quot;')}"><span class="p">${label}</span><span class="v">${preview(val)}</span></div>`;
      }).join('');
      $('ptrs').querySelectorAll('.ptr').forEach(el =>
        el.addEventListener('click', () => { $('ptr').value = el.dataset.p; renderResult(); }));
    }

    function render(){ renderResult(); renderList(); }
    $('json').addEventListener('input', render);
    $('ptr').addEventListener('input', renderResult);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('jptr-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { escapeToken, unescapeToken, parsePointer, resolve, listPointers };
</script>
</body>
</html>
