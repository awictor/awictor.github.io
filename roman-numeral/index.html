<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RomanNumeral — Roman Numeral Converter</title>
<meta name="description" content="Convert numbers to Roman numerals and back (1–3999), with canonical-form validation. 100% offline, no signup." />
<meta name="theme-color" content="#7c2d12" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="RomanNumeral — Roman Numeral Converter" />
<meta property="og:description" content="Numbers to Roman numerals and back, 1–3999, validated. Offline." />
<meta property="og:url" content="https://awictor.github.io/roman-numeral/" />
<link rel="canonical" href="https://awictor.github.io/roman-numeral/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c2d12'/%3E%3Ctext x='32' y='42' font-size='22' text-anchor='middle' fill='%23fff' font-family='Georgia,serif' font-weight='bold'%3EIV%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#faf4f0; --ink:#26130b; --accent:#7c2d12; --accent-d:#601f0c;
    --card:#fff; --line:#ecd9cd; --muted:#775548; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(38,19,11,.05),0 8px 24px rgba(38,19,11,.07); }
  [data-theme="dark"]{ --bg:#150a06; --ink:#f4e8e1; --accent:#fb923c; --accent-d:#fdba74;
    --card:#1f120b; --line:#341f16; --muted:#a98a7b; --bad:#f0685c; --field:#150a06;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:11px;font-size:22px;text-align:center;background:var(--field);color:var(--ink);font-family:Georgia,"Times New Roman",serif;letter-spacing:.05em}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,45,18,.15)}
  input.bad{border-color:var(--bad)}
  .out{margin-top:10px;font-size:15px;color:var(--muted);text-align:center;min-height:20px}
  .out b{color:var(--accent);font-size:24px;font-family:Georgia,serif}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("roman.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Roman</span>Numeral</h1>
  <p>Numbers to Roman numerals and back (1–3999). Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Number → Roman</h2>
    <input id="num" type="number" min="1" max="3999" value="2024">
    <div class="out" id="romanOut"></div>
  </section>
  <section class="card">
    <h2>Roman → Number</h2>
    <input id="roman" type="text" spellcheck="false" value="MMXXIV" autocomplete="off">
    <div class="out" id="numOut"></div>
  </section>
</div>

<footer>
  <b>RomanNumeral</b> · offline Roman numeral converter · <a href="https://github.com/awictor/roman-numeral">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Standard form, 1–3999. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const TABLE=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
const VALS={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};

// --- Pure conversion ---
function toRoman(n){
  if(!Number.isInteger(n)||n<1||n>3999) return null;
  let out="", v=n;
  for(const [val,sym] of TABLE){ while(v>=val){ out+=sym; v-=val; } }
  return out;
}
function fromRoman(str){
  const s=String(str).trim().toUpperCase();
  if(!/^[MDCLXVI]+$/.test(s)) return null;
  let total=0;
  for(let i=0;i<s.length;i++){ const cur=VALS[s[i]], nx=VALS[s[i+1]]; if(nx>cur){ total+=nx-cur; i++; } else total+=cur; }
  if(total<1||total>3999||toRoman(total)!==s) return null; // reject non-canonical (IIII, IL, …)
  return total;
}

// --- UI ---
function renderNum(){
  const raw=$("num").value.trim(); try{localStorage.setItem("roman.num",raw);}catch(e){}
  if(raw===""){$("romanOut").textContent="";$("num").classList.remove("bad");return;}
  const r=toRoman(parseInt(raw,10));
  if(r==null){$("num").classList.add("bad");$("romanOut").textContent="Enter a whole number 1–3999.";}
  else {$("num").classList.remove("bad");$("romanOut").innerHTML="= <b>"+r+"</b>";}
}
function renderRoman(){
  const raw=$("roman").value.trim(); try{localStorage.setItem("roman.roman",raw);}catch(e){}
  if(raw===""){$("numOut").textContent="";$("roman").classList.remove("bad");return;}
  const n=fromRoman(raw);
  if(n==null){$("roman").classList.add("bad");$("numOut").textContent="Not a valid Roman numeral.";}
  else {$("roman").classList.remove("bad");$("numOut").innerHTML="= <b>"+n.toLocaleString()+"</b>";}
}
$("num").addEventListener("input",renderNum);
$("roman").addEventListener("input",()=>{$("roman").value=$("roman").value.toUpperCase();renderRoman();});
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("roman.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const a=localStorage.getItem("roman.num");if(a!=null)$("num").value=a;const b=localStorage.getItem("roman.roman");if(b!=null)$("roman").value=b;}catch(e){}
renderNum(); renderRoman();

if(typeof module!=="undefined") module.exports={toRoman,fromRoman};
</script>
</body>
</html>
