<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPv6 — Address Expander & Compressor</title>
<meta name="description" content="Expand an IPv6 address to its full 8-group form, compress it to the shortest form, and validate it. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('ipv6-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#1e40af;
    --bg:#f5f6f9; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e4ea; --shadow:0 1px 3px rgba(0,0,0,.08); --ok:#16a34a; --bad:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0f1017; --card:#181a22; --fg:#eff0f5; --muted:#98a0ac; --line:#282b36; --shadow:0 1px 3px rgba(0,0,0,.5); --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#1e3a8a);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:760px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-family:"SF Mono",Menlo,Consolas,monospace;font-size:1rem}
  .status{margin-top:10px;font-weight:700}
  .status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
  .r{margin-top:14px}
  .r label{margin-bottom:4px}
  .r .out{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:1.05rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;word-break:break-all;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .r .out button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.78rem;flex-shrink:0}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .presets button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:.8rem;font-family:"SF Mono",Menlo,Consolas,monospace}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:760px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🌐</div>
    <div><h1>IPv6</h1><div class="sub">Expand, compress &amp; validate IPv6 addresses</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="addr">IPv6 address</label>
    <input id="addr" value="2001:db8::1" spellcheck="false" autocapitalize="off">
    <div class="status" id="status"></div>
    <div class="presets" id="presets"></div>
  </div>
  <div class="card">
    <div class="r"><label>Expanded (full)</label><div class="out"><span id="expanded">—</span><button type="button" data-c="expanded">copy</button></div></div>
    <div class="r"><label>Compressed (shortest)</label><div class="out"><span id="compressed">—</span><button type="button" data-c="compressed">copy</button></div></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/ipv6-tool">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  const pad = g => g.padStart(4, '0');

  function expand(addr){
    const s = String(addr).trim();
    if(s.indexOf('::') !== s.lastIndexOf('::')) throw new Error('invalid IPv6 address');
    const dbl = s.includes('::');
    const parts = s.split('::');
    const head = parts[0], tail = dbl ? (parts[1] || '') : '';
    const hg = head === '' ? [] : head.split(':');
    const tg = tail === '' ? [] : tail.split(':');
    for(const g of [...hg, ...tg]) if(!/^[0-9a-fA-F]{1,4}$/.test(g)) throw new Error('invalid IPv6 address');
    if(dbl){
      const missing = 8 - hg.length - tg.length;
      if(missing < 1) throw new Error('invalid IPv6 address');
      return [...hg.map(pad), ...Array(missing).fill('0000'), ...tg.map(pad)].join(':');
    }
    if(hg.length !== 8) throw new Error('invalid IPv6 address');
    return hg.map(pad).join(':');
  }

  function compress(addr){
    const groups = expand(addr).split(':').map(g => g.replace(/^0+/, '') || '0');
    let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0;
    for(let i = 0; i < 8; i++){
      if(groups[i] === '0'){
        if(curStart < 0) curStart = i;
        curLen++;
        if(curLen > bestLen){ bestLen = curLen; bestStart = curStart; }
      } else { curStart = -1; curLen = 0; }
    }
    if(bestLen < 2) return groups.join(':');
    const before = groups.slice(0, bestStart).join(':');
    const after = groups.slice(bestStart + bestLen).join(':');
    return before + '::' + after;
  }

  function isValid(addr){
    try{ expand(addr); return true; }catch(e){ return false; }
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('expanded')){
    const $ = id => document.getElementById(id);
    const PRESETS = ['2001:db8::1', '::1', 'fe80::1', '::', '2001:0db8:0000:0000:0000:ff00:0042:8329'];

    function render(){
      const addr = $('addr').value;
      if(isValid(addr)){
        $('status').textContent = '✓ Valid IPv6 address';
        $('status').className = 'status ok';
        $('expanded').textContent = expand(addr);
        $('compressed').textContent = compress(addr);
      }else{
        $('status').textContent = addr.trim() ? '✗ Not a valid IPv6 address' : '';
        $('status').className = 'status bad';
        $('expanded').textContent = '—';
        $('compressed').textContent = '—';
      }
    }

    $('presets').innerHTML = PRESETS.map(p => `<button type="button">${p}</button>`).join('');
    $('presets').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; $('addr').value = b.textContent; render(); });
    $('addr').addEventListener('input', render);
    document.querySelector('main').addEventListener('click', async e => {
      const b = e.target.closest('button[data-c]'); if(!b) return;
      try{ await navigator.clipboard.writeText($(b.dataset.c).textContent); b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1000); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('ipv6-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { expand, compress, isValid };
</script>
</body>
</html>
