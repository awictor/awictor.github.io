<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinner — CSS Loading Spinner Generator</title>
<meta name="description" content="Generate a pure-CSS loading spinner: size, thickness, colors and speed with a live animated preview and copy-ready code. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('spinner-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#0ea5e9;
    --bg:#f4f7f9; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e6ea; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#0e1418; --card:#171f25; --fg:#eef3f6; --muted:#93a1aa; --line:#253038; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:880px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#0369a1);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:880px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
  label:first-child{margin-top:0}
  input[type=range]{width:100%;accent-color:var(--c)}
  input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .row b{font-variant-numeric:tabular-nums}
  .stage{display:flex;align-items:center;justify-content:center;min-height:220px}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.8rem;margin:14px 0 0;white-space:pre}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;margin-top:12px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:880px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⏳</div>
    <div><h1>Spinner</h1><div class="sub">Pure-CSS loading spinner generator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label class="row"><span>Size</span><b id="sizeV">40px</b></label>
    <input type="range" id="size" min="12" max="120" value="40">
    <label class="row"><span>Thickness</span><b id="thickV">4px</b></label>
    <input type="range" id="thick" min="1" max="16" value="4">
    <label class="row"><span>Speed</span><b id="speedV">0.8s</b></label>
    <input type="range" id="speed" min="2" max="30" value="8">
    <div class="two">
      <div><label>Spinner color</label><input type="color" id="color" value="#0ea5e9"></div>
      <div><label>Track color</label><input type="color" id="track" value="#e5e7eb"></div>
    </div>
  </div>
  <div class="card">
    <div class="stage"><div id="preview"></div></div>
    <pre id="out"></pre>
    <button class="act" id="copy" type="button">Copy CSS</button>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/spinner">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function isHex(c){ return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c); }

  function spinnerCss(o = {}){
    const size = o.size == null ? 40 : o.size;
    const thickness = o.thickness == null ? 4 : o.thickness;
    const color = o.color || '#0ea5e9';
    const track = o.track || '#e5e7eb';
    const speed = o.speed == null ? 0.8 : o.speed;
    if(!isHex(color)) throw new Error('invalid hex color: ' + color);
    if(!isHex(track)) throw new Error('invalid hex color: ' + track);
    if(!(size > 0) || !(thickness > 0) || !(speed > 0)) throw new Error('size, thickness and speed must be positive');
    return [
      '.spinner {',
      `  width: ${size}px;`,
      `  height: ${size}px;`,
      `  border: ${thickness}px solid ${track};`,
      `  border-top-color: ${color};`,
      '  border-radius: 50%;',
      `  animation: spin ${speed}s linear infinite;`,
      '}',
      '',
      '@keyframes spin {',
      '  to { transform: rotate(360deg); }',
      '}'
    ].join('\n');
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('preview')){
    const $ = id => document.getElementById(id);
    // inject the keyframes once so the preview animates
    const kf = document.createElement('style');
    kf.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(kf);

    function render(){
      const size = +$('size').value, thickness = +$('thick').value, speed = +$('speed').value / 10;
      $('sizeV').textContent = size + 'px';
      $('thickV').textContent = thickness + 'px';
      $('speedV').textContent = speed.toFixed(1) + 's';
      let css;
      try{ css = spinnerCss({ size, thickness, color: $('color').value, track: $('track').value, speed }); }catch(e){ return; }
      $('out').textContent = css;
      const p = $('preview');
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.border = `${thickness}px solid ${$('track').value}`;
      p.style.borderTopColor = $('color').value;
      p.style.borderRadius = '50%';
      p.style.animation = `spin ${speed}s linear infinite`;
    }

    ['size', 'thick', 'speed', 'color', 'track'].forEach(id => $(id).addEventListener('input', render));
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy CSS', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('spinner-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { isHex, spinnerCss };
</script>
</body>
</html>
