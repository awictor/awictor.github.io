<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mullion — Gothic Rose-Window Generator</title>
<style>
  :root{
    --bg:#0c0a10; --panel:#16131c; --edge:#2a2434; --ink:#e9e2f0;
    --muted:#9d92ad; --accent:#d8a94a; --accent2:#7b5cd6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% 0%,#1a1522 0%,#0a0810 70%);color:var(--ink);
    font-family:"Palatino Linotype",Palatino,"Book Antiqua",Optima,Georgia,serif;-webkit-font-smoothing:antialiased}
  #app{display:flex;min-height:100vh;gap:0;align-items:stretch}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;min-width:0}
  #brand{position:absolute;top:18px;left:26px;pointer-events:none}
  #brand h1{margin:0;font-size:26px;letter-spacing:.32em;font-weight:400;
    background:linear-gradient(90deg,var(--accent),#f0e0b0,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  #brand p{margin:2px 0 0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  canvas#win{width:min(76vh,640px);height:min(76vh,640px);border-radius:50%;
    box-shadow:0 0 3px #000,0 24px 90px rgba(0,0,0,.7),0 0 120px rgba(120,90,220,.14);background:#050308}
  #panel{width:312px;flex:none;background:var(--panel);border-left:1px solid var(--edge);
    padding:20px 18px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  .grp{display:flex;flex-direction:column;gap:9px}
  .grp>h2{margin:0 0 2px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
  .row label{flex:none;width:78px;color:var(--muted);letter-spacing:.02em}
  .row input[type=range]{flex:1;accent-color:var(--accent2);height:3px}
  .row .val{flex:none;width:30px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px}
  select,input[type=text]{background:#0e0b14;border:1px solid var(--edge);color:var(--ink);border-radius:7px;
    padding:6px 8px;font:inherit;font-size:12.5px;width:100%}
  select:focus,input:focus{outline:none;border-color:var(--accent2)}
  .seedrow{display:flex;gap:8px}
  .seedrow input{flex:1}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{background:#1d1826;border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:8px 6px;
    font:inherit;font-size:12px;letter-spacing:.03em;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent2);background:#241d33;color:#fff}
  button.pri{background:linear-gradient(180deg,#8f6be6,#6a48c4);border-color:#7b5cd6;color:#fff}
  button.pri:hover{filter:brightness(1.12)}
  .tod{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tod button{padding:7px 2px;font-size:11px}
  .tod button.on{background:var(--accent);border-color:var(--accent);color:#241a06;font-weight:600}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .preset{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:#120f19;
    border:1px solid var(--edge);border-radius:9px;padding:8px 6px;transition:.15s;font:inherit;width:100%}
  .preset:hover{border-color:var(--accent);transform:translateY(-1px)}
  .preset:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent);transform:translateY(-1px)}
  .preset canvas{width:74px;height:74px;border-radius:50%;background:#050308}
  .preset span{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-align:center;line-height:1.2}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#241d33;
    border:1px solid var(--accent2);color:#fff;padding:9px 18px;border-radius:20px;font-size:12.5px;letter-spacing:.03em;
    opacity:0;pointer-events:none;transition:.25s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{font-size:10.5px;color:var(--muted);line-height:1.5;letter-spacing:.02em}
  @media(max-width:820px){
    #app{flex-direction:column}
    #stage{padding:64px 16px 20px}
    #brand{position:static;text-align:center;margin-bottom:14px}
    canvas#win{width:min(92vw,560px);height:min(92vw,560px)}
    #panel{width:100%;border-left:none;border-top:1px solid var(--edge)}
  }
  @media(max-width:400px){
    .btns,.presets{grid-template-columns:1fr}
    .tod{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="brand"><h1>MULLION</h1><p>Gothic rose-window generator</p></div>
    <canvas id="win" width="760" height="760"></canvas>
  </div>
  <div id="panel">
    <div class="grp">
      <h2>Structure</h2>
      <div class="row"><label>Symmetry</label>
        <select id="order">
          <option value="6">6-fold</option><option value="8">8-fold</option>
          <option value="12" selected>12-fold</option><option value="16">16-fold</option><option value="24">24-fold</option>
        </select></div>
      <div class="row"><label>Rings</label><input type="range" id="rings" min="1" max="5" step="1" value="3"><span class="val" id="rings_v">3</span></div>
      <div class="row"><label>Cusp depth</label><input type="range" id="cusp" min="0" max="1" step="0.01" value="0.5"><span class="val" id="cusp_v">50</span></div>
      <div class="row"><label>Bar weight</label><input type="range" id="bar" min="1" max="12" step="0.5" value="5"><span class="val" id="bar_v">5</span></div>
    </div>
    <div class="grp">
      <h2>Glazing</h2>
      <div class="row"><label>Palette</label><select id="palette"></select></div>
      <div class="row"><label>Lead came</label><input type="range" id="came" min="0.5" max="6" step="0.25" value="2"><span class="val" id="came_v">2</span></div>
      <div class="row"><label>Saturation</label><input type="range" id="sat" min="0.4" max="1.6" step="0.02" value="1"><span class="val" id="sat_v">100</span></div>
    </div>
    <div class="grp">
      <h2>Time of day</h2>
      <div class="tod" id="tod"></div>
    </div>
    <div class="grp">
      <h2>Motion</h2>
      <div class="btns"><button id="anim" style="grid-column:1/3">Pause sunlight</button></div>
    </div>
    <div class="grp">
      <h2>Seed</h2>
      <div class="seedrow"><input type="text" id="seed" spellcheck="false"><button id="rand" title="New seed">&#8635;</button></div>
    </div>
    <div class="grp">
      <h2>Export</h2>
      <div class="btns">
        <button id="png">PNG</button>
        <button id="svg">SVG</button>
        <button class="pri" id="link" style="grid-column:1/3">Copy shareable link</button>
      </div>
    </div>
    <div class="grp">
      <h2>Archetypes</h2>
      <div class="presets" id="presets"></div>
    </div>
    <div class="foot">Radial architectural grammar &middot; oculus foil + cusped-light rings + stone tracery. Every window is deterministic from its seed and lives in the URL.</div>
  </div>
</div>
<div id="toast"></div>
<script>
"use strict";
// ---------- seeded PRNG ----------
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- color helpers ----------
function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function cl(v){return v<0?0:v>255?255:Math.round(v);}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rs(c){return'rgb('+cl(c[0])+','+cl(c[1])+','+cl(c[2])+')';}
function sat(c,m){const g=(c[0]+c[1]+c[2])/3;return[g+(c[0]-g)*m,g+(c[1]-g)*m,g+(c[2]-g)*m];}

// ---------- palettes ----------
const PALETTES={
  cobalt:['#173a8f','#2456c9','#3f7ada','#8fb8f0','#dfae3a'],
  ruby:['#7a1024','#b3172f','#d8455c','#e88fa0','#e8c25a'],
  emerald:['#0c4a34','#127a4e','#2ba674','#7fd3a8','#e0c24a'],
  amber:['#7a3a06','#c46a12','#e59a24','#f2c860','#8a4bc0'],
  amethyst:['#3d1f6b','#6a34b3','#9257d8','#c197ee','#e0b84a'],
  jewelmix:['#173a8f','#b3172f','#127a4e','#c46a12','#6a34b3'],
  grisaille:['#c9cdc2','#aeb4a8','#8f978a','#d8d2bf','#7d8570']
};
const PAL_NAMES=Object.keys(PALETTES);

// ---------- time-of-day moods ----------
const MODES={
  dawn:{bg:['#241826','#0e0812'],stone:'#b08a7a',mold:'#e0c0a8',came:'#3a2418',ground:['#3a2c3a','#1c141f'],
        diaper:'rgba(230,200,170,0.09)',tint:[255,190,150],tmix:0.14,satMul:0.94,bloom:0.5,bloomC:[255,210,160]},
  noon:{bg:['#2a2836','#0d0c14'],stone:'#cfc7bd',mold:'#f2ecdf',came:'#141014',ground:['#3f3d4a','#191824'],
        diaper:'rgba(255,255,255,0.10)',tint:[255,255,255],tmix:0.0,satMul:1.12,bloom:0.62,bloomC:[255,252,235]},
  dusk:{bg:['#26182a','#0c0710'],stone:'#8f7a90',mold:'#c8a8c0',came:'#241422',ground:['#332438','#160f1c'],
        diaper:'rgba(210,170,220,0.09)',tint:[210,120,160],tmix:0.18,satMul:1.0,bloom:0.55,bloomC:[255,170,190]},
  candle:{bg:['#170f10','#070405'],stone:'#6e4a30',mold:'#a06e40',came:'#0a0604',ground:['#241611','#0c0705'],
        diaper:'rgba(240,180,90,0.08)',tint:[255,150,60],tmix:0.24,satMul:1.18,bloom:0.9,bloomC:[255,170,70]}
};
const TOD_NAMES=[['dawn','Dawn'],['noon','Noon'],['dusk','Dusk'],['candle','Candlelit']];

// ---------- state ----------
const DEF={order:12,rings:3,cusp:0.5,bar:5,came:2,sat:1,palette:'jewelmix',tod:'noon',seed:'chartres'};
const ORDERS=[6,8,12,16,24];
const LIMITS={rings:[1,5],cusp:[0,1],bar:[1,12],came:[0.5,6],sat:[0.4,1.6]};
let S={...DEF};

// ---------- geometry / scene builder (shared by canvas + SVG) ----------
const W=760,CX=380,CY=380,R=300,FRAME=46;

function rad(cx,cy,r,stops){return{cx,cy,r,stops};}
function glassGrad(base,cx,cy,r,s,m){
  let c=sat(base,s.sat*m.satMul);
  c=mix(c,m.tint,m.tmix);
  const hi=mix(c,[255,255,255],0.62), lo=mix(c,[10,6,14],0.5);
  return rad(cx-r*0.28,cy-r*0.3,r*1.35,[[0,rs(hi)],[0.4,rs(mix(c,[255,255,255],0.15))],[0.75,rs(c)],[1,rs(lo)]]);
}
function pick(rng,pal){return hx(pal[Math.floor(rng()*pal.length)]);}

function foil(items,x,y,r,n,s,m,rng,pal){
  const lf=0.32+s.cusp*0.24;                 // lobe fraction (cusp depth)
  const rc=r*(1-lf), lobeR=r*lf;
  items.push({t:'c',cx:x,cy:y,r,stroke:m.stone,sw:s.bar*0.7});          // containing tracery ring
  for(let i=0;i<n;i++){
    const a=i/n*6.2831853-Math.PI/2;
    const px=x+Math.cos(a)*rc, py=y+Math.sin(a)*rc;
    const c=pick(rng,pal);
    items.push({t:'c',cx:px,cy:py,r:lobeR,fill:glassGrad(c,px,py,lobeR,s,m),stroke:m.came,sw:s.came});
  }
  const cc=pick(rng,pal);
  items.push({t:'c',cx:x,cy:y,r:r*0.34,fill:glassGrad(cc,x,y,r*0.34,s,m),stroke:m.came,sw:s.came});
}

function buildScene(s){
  const m=MODES[s.tod], pal=PALETTES[s.palette], rng=mulberry32(hashStr(s.seed+'|'+s.order+'|'+s.rings));
  const items=[];
  items.push({t:'r',x:0,y:0,w:W,h:W,fill:rad(CX,CY*0.4,W,[[0,rs(hx(m.bg[0]))],[1,rs(hx(m.bg[1]))]])});
  items.push({t:'c',cx:CX,cy:CY,r:R+FRAME,fill:rad(CX-40,CY-60,R+FRAME+40,[[0,m.mold],[0.5,m.stone],[1,rs(mix(hx(m.stone),[0,0,0],0.5))]])});
  items.push({t:'c',cx:CX,cy:CY,r:R+FRAME*0.55,stroke:m.mold,sw:3});
  items.push({t:'c',cx:CX,cy:CY,r:R,fill:rad(CX,CY,R,[[0,rs(hx(m.ground[0]))],[1,rs(hx(m.ground[1]))]])});
  // grisaille diaper ground
  for(let ci=1;ci<=6;ci++)items.push({t:'c',cx:CX,cy:CY,r:R*ci/6.5,stroke:m.diaper,sw:1});
  const spokes=Math.max(s.order,24);
  for(let k=0;k<spokes;k++){const a=k/spokes*6.2831853;
    items.push({t:'l',x1:CX,y1:CY,x2:CX+Math.cos(a)*R,y2:CY+Math.sin(a)*R,stroke:m.diaper,sw:1});}
  // tracery + rings of lights
  const oc=R*0.2, bw=(R-oc)/s.rings;
  for(let b=0;b<s.rings;b++){
    const ri=oc+b*bw, ro=ri+bw, mid=(ri+ro)/2;
    const n=[3,4,5,6][Math.floor(rng()*4)];
    const count=s.order;
    const ang=6.2831853*mid/count;
    const lr=Math.min(bw*0.5,ang*0.5)*0.94;
    items.push({t:'c',cx:CX,cy:CY,r:ro,stroke:m.stone,sw:s.bar});           // concentric bar
    const off=(b%2)?Math.PI/count:0;
    for(let k=0;k<count;k++){
      const a=k/count*6.2831853+off;
      foil(items,CX+Math.cos(a)*mid,CY+Math.sin(a)*mid,lr,n,s,m,rng,pal);
    }
  }
  // radial mullions between spokes of the symmetry order
  for(let k=0;k<s.order;k++){const a=k/s.order*6.2831853+Math.PI/s.order;
    items.push({t:'l',x1:CX+Math.cos(a)*oc,y1:CY+Math.sin(a)*oc,x2:CX+Math.cos(a)*R,y2:CY+Math.sin(a)*R,stroke:m.stone,sw:s.bar*0.85,cap:1});}
  // oculus
  foil(items,CX,CY,oc*0.94,[6,8,12][Math.floor(rng()*3)],s,m,rng,pal);
  items.push({t:'c',cx:CX,cy:CY,r:oc,stroke:m.stone,sw:s.bar*1.2});
  // backlit bloom
  items.push({t:'bloom',cx:CX,cy:CY,r:R,color:m.bloomC,a:m.bloom});
  return {items,cx:CX,cy:CY,r:R,m};
}

// ---------- canvas renderer ----------
const cv=document.getElementById('win'), ctx=cv.getContext('2d');
function fillFor(g,f){
  if(typeof f==='string')return f;
  const gr=g.createRadialGradient(f.cx,f.cy,Math.max(0,f.r*0.02),f.cx,f.cy,f.r);
  f.stops.forEach(s=>gr.addColorStop(s[0],s[1]));return gr;
}
function drawCanvas(g,scene,time,scale){
  g.setTransform(scale,0,0,scale,0,0);
  g.clearRect(0,0,W,W);
  for(const it of scene.items){
    if(it.t==='r'){g.fillStyle=fillFor(g,it.fill);g.fillRect(it.x,it.y,it.w,it.h);}
    else if(it.t==='c'){
      g.beginPath();g.arc(it.cx,it.cy,it.r,0,6.2831853);
      if(it.fill){g.fillStyle=fillFor(g,it.fill);g.fill();}
      if(it.stroke){g.strokeStyle=it.stroke;g.lineWidth=it.sw;g.stroke();}
    } else if(it.t==='l'){g.strokeStyle=it.stroke;g.lineWidth=it.sw;g.lineCap=it.cap?'round':'butt';
      g.beginPath();g.moveTo(it.x1,it.y1);g.lineTo(it.x2,it.y2);g.stroke();}
    else if(it.t==='bloom'){
      g.save();g.globalCompositeOperation='lighter';
      const gr=g.createRadialGradient(it.cx,it.cy,0,it.cx,it.cy,it.r);
      gr.addColorStop(0,'rgba('+it.color.join(',')+','+(0.28*it.a)+')');
      gr.addColorStop(0.5,'rgba('+it.color.join(',')+','+(0.07*it.a)+')');
      gr.addColorStop(1,'rgba('+it.color.join(',')+',0)');
      g.fillStyle=gr;g.beginPath();g.arc(it.cx,it.cy,it.r,0,6.2831853);g.fill();
      // animated sunlight sweep
      if(time!==undefined){
        const t=time/5200, ox=it.cx+Math.cos(t)*it.r*0.55, oy=it.cy+Math.sin(t*0.9)*it.r*0.55;
        g.beginPath();g.arc(it.cx,it.cy,it.r,0,6.2831853);g.clip();
        const sg=g.createRadialGradient(ox,oy,0,ox,oy,it.r*0.85);
        sg.addColorStop(0,'rgba('+it.color.join(',')+','+(0.34*it.a)+')');
        sg.addColorStop(1,'rgba('+it.color.join(',')+',0)');
        g.fillStyle=sg;g.fillRect(0,0,W,W);
      }
      g.restore();
    }
  }
  g.setTransform(1,0,0,1,0,0);
}

// ---------- SVG export (same items) ----------
function toSVG(scene){
  let defs='',body='',id=0;
  const F=f=>{if(f===undefined)return'none';if(typeof f==='string')return f;
    const g='g'+(id++);defs+='<radialGradient id="'+g+'" gradientUnits="userSpaceOnUse" cx="'+f.cx.toFixed(2)+'" cy="'+f.cy.toFixed(2)+'" r="'+f.r.toFixed(2)+'">'+
      f.stops.map(s=>'<stop offset="'+s[0]+'" stop-color="'+s[1]+'"/>').join('')+'</radialGradient>';return'url(#'+g+')';};
  for(const it of scene.items){
    if(it.t==='r')body+='<rect x="0" y="0" width="'+W+'" height="'+W+'" fill="'+F(it.fill)+'"/>';
    else if(it.t==='c')body+='<circle cx="'+it.cx.toFixed(2)+'" cy="'+it.cy.toFixed(2)+'" r="'+it.r.toFixed(2)+'" fill="'+F(it.fill)+
      '"'+(it.stroke?' stroke="'+it.stroke+'" stroke-width="'+it.sw+'"':'')+'/>';
    else if(it.t==='l')body+='<line x1="'+it.x1.toFixed(2)+'" y1="'+it.y1.toFixed(2)+'" x2="'+it.x2.toFixed(2)+'" y2="'+it.y2.toFixed(2)+
      '" stroke="'+it.stroke+'" stroke-width="'+it.sw+'"'+(it.cap?' stroke-linecap="round"':'')+'/>';
    else if(it.t==='bloom'){const c=it.color.join(',');
      defs+='<radialGradient id="bloom" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgb('+c+')" stop-opacity="'+(0.28*it.a)+'"/>'+
        '<stop offset="0.5" stop-color="rgb('+c+')" stop-opacity="'+(0.07*it.a)+'"/><stop offset="1" stop-color="rgb('+c+')" stop-opacity="0"/></radialGradient>';
      body+='<circle cx="'+it.cx+'" cy="'+it.cy+'" r="'+it.r+'" fill="url(#bloom)" style="mix-blend-mode:screen"/>';}
  }
  defs+='<clipPath id="frame"><circle cx="'+(W/2)+'" cy="'+(W/2)+'" r="'+(W/2)+'"/></clipPath>';
  return'<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+W+'" viewBox="0 0 '+W+' '+W+'"><defs>'+defs+'</defs><g clip-path="url(#frame)">'+body+'</g></svg>';
}

// ---------- state <-> URL hash ----------
function encode(){const p=new URLSearchParams();for(const k in DEF)p.set(k,S[k]);return p.toString();}
function apply(){for(const k in DEF)S[k]=(typeof DEF[k]==='number')?+S[k]:S[k];}
function fromHash(){
  const h=location.hash.slice(1);if(!h)return;const p=new URLSearchParams(h);
  for(const k in DEF)if(p.has(k)){
    if(typeof DEF[k]==='number'){
      let v=+p.get(k);
      if(!Number.isFinite(v))v=DEF[k];
      else if(k==='order')v=ORDERS.includes(v)?v:DEF.order;
      else if(LIMITS[k])v=Math.min(LIMITS[k][1],Math.max(LIMITS[k][0],v));
      S[k]=v;
    } else S[k]=p.get(k);
  }
}
function writeHash(){history.replaceState(null,'','#'+encode());}

// ---------- render pipeline ----------
let scene=null;
let animating=!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function rebuild(){scene=buildScene(S);}
function loop(t){if(scene)drawCanvas(ctx,scene,animating?t:undefined,1);requestAnimationFrame(loop);}

// ---------- UI wiring ----------
function $(id){return document.getElementById(id);}
function syncUI(){
  $('order').value=S.order;$('rings').value=S.rings;$('rings_v').textContent=S.rings;
  $('cusp').value=S.cusp;$('cusp_v').textContent=Math.round(S.cusp*100);
  $('bar').value=S.bar;$('bar_v').textContent=S.bar;
  $('came').value=S.came;$('came_v').textContent=S.came;
  $('sat').value=S.sat;$('sat_v').textContent=Math.round(S.sat*100);
  $('palette').value=S.palette;$('seed').value=S.seed;
  document.querySelectorAll('#tod button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.tod));
}
function refresh(){rebuild();writeHash();}
function bindSlider(id,key,fmt){$(id).addEventListener('input',e=>{S[key]=+e.target.value;
  $(id+'_v').textContent=fmt?fmt(S[key]):S[key];refresh();});}

// palette options
PAL_NAMES.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n[0].toUpperCase()+n.slice(1);$('palette').appendChild(o);});
// tod buttons
TOD_NAMES.forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.k=k;
  b.onclick=()=>{S.tod=k;syncUI();refresh();};$('tod').appendChild(b);});

bindSlider('rings','rings');
bindSlider('cusp','cusp',v=>Math.round(v*100));
bindSlider('bar','bar');
bindSlider('came','came');
bindSlider('sat','sat',v=>Math.round(v*100));
$('order').addEventListener('change',e=>{S.order=+e.target.value;refresh();});
$('palette').addEventListener('change',e=>{S.palette=e.target.value;refresh();});
$('seed').addEventListener('input',e=>{S.seed=e.target.value;refresh();});
$('seed').addEventListener('blur',e=>{if(!e.target.value){S.seed='seed';e.target.value='seed';refresh();}});
$('rand').addEventListener('click',()=>{S.seed=Math.random().toString(36).slice(2,9);syncUI();refresh();});
$('anim').addEventListener('click',()=>{animating=!animating;$('anim').textContent=animating?'Pause sunlight':'Play sunlight';});

// ---------- toast ----------
let toT;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('show'),1600);}

// ---------- export ----------
function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('png').addEventListener('click',()=>{
  const ex=document.createElement('canvas');ex.width=ex.height=1520;
  const g=ex.getContext('2d');
  g.save();g.beginPath();g.arc(W,W,W,0,6.2831853);g.clip();   // crop to the circular frame (matches on-screen)
  drawCanvas(g,scene,undefined,2);
  g.restore();
  ex.toBlob(b=>{download('mullion-'+S.seed+'.png',b);toast('PNG exported');});
});
$('svg').addEventListener('click',()=>{download('mullion-'+S.seed+'.svg',new Blob([toSVG(scene)],{type:'image/svg+xml'}));toast('SVG exported');});
$('link').addEventListener('click',()=>{
  const url=location.href.split('#')[0]+'#'+encode();
  const done=()=>toast('Link copied to clipboard');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,()=>{prompt('Copy link:',url);});
  else{prompt('Copy link:',url);}
});

// ---------- presets (archetypes w/ thumbnails) ----------
const PRESETS=[
  {name:'Chartres 12-fold',st:{order:12,rings:3,cusp:0.55,bar:6,came:2.25,sat:1.05,palette:'cobalt',tod:'noon',seed:'chartres'}},
  {name:'Notre-Dame 24-fold',st:{order:24,rings:4,cusp:0.42,bar:4,came:1.5,sat:1.0,palette:'jewelmix',tod:'dusk',seed:'notredame'}},
  {name:'Sainte-Chapelle',st:{order:16,rings:4,cusp:0.62,bar:3.5,came:1.75,sat:1.25,palette:'ruby',tod:'dawn',seed:'saintechapelle'}},
  {name:'Grisaille Cloister',st:{order:8,rings:2,cusp:0.5,bar:7,came:3,sat:0.85,palette:'grisaille',tod:'candle',seed:'cloister'}}
];
PRESETS.forEach(p=>{
  const d=document.createElement('button');d.type='button';d.className='preset';
  d.setAttribute('aria-label','Load archetype: '+p.name);
  const c=document.createElement('canvas');c.width=c.height=380;
  d.appendChild(c);const sp=document.createElement('span');sp.textContent=p.name;d.appendChild(sp);
  drawCanvas(c.getContext('2d'),buildScene({...DEF,...p.st}),undefined,0.5);
  d.onclick=()=>{S={...DEF,...p.st};syncUI();refresh();toast(p.name);};
  $('presets').appendChild(d);
});

// ---------- boot ----------
fromHash();apply();syncUI();rebuild();
$('anim').textContent=animating?'Pause sunlight':'Play sunlight';
requestAnimationFrame(loop);
window.addEventListener('hashchange',()=>{fromHash();apply();syncUI();rebuild();});
</script>
</body>
</html>
