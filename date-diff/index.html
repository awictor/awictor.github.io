<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DateDiff — Days Between Dates &amp; Date Calculator</title>
<meta name="description" content="Count the days between two dates, get the years/months/days breakdown, and add or subtract days from a date. 100% offline, no signup." />
<meta name="theme-color" content="#2563eb" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="DateDiff — Date Duration Calculator" />
<meta property="og:description" content="Days between two dates, years/months/days breakdown, and add/subtract days. Offline." />
<meta property="og:url" content="https://awictor.github.io/date-diff/" />
<link rel="canonical" href="https://awictor.github.io/date-diff/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='14' y='18' width='36' height='32' rx='4' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cline x1='14' y1='28' x2='50' y2='28' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eff4fd; --ink:#0d1830; --accent:#2563eb; --accent-d:#1d4ed8;
    --card:#fff; --line:#d9e2f5; --muted:#556080; --field:#fff;
    --shadow:0 1px 2px rgba(13,24,48,.05),0 8px 24px rgba(13,24,48,.07); }
  [data-theme="dark"]{ --bg:#080d1a; --ink:#e8eefb; --accent:#60a5fa; --accent-d:#93c5fd;
    --card:#111a2e; --line:#233150; --muted:#8b9ac0; --field:#080d1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:600px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  input[type=date],input[type=number]{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--field);color:var(--ink)}
  input[type=number]{width:100px;text-align:right}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .big{font-size:44px;font-weight:800;color:var(--accent);text-align:center;line-height:1;margin:4px 0}
  .sub{text-align:center;color:var(--muted);font-size:14px}
  .sub b{color:var(--ink)}
  .out{text-align:center;font-size:18px;margin-top:8px}
  .out b{color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("datediff.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Date</span>Diff</h1>
  <p>Days between two dates, and add or subtract days. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Days between</h2>
    <div class="row"><label>From</label><input type="date" id="from" value="2024-01-01"></div>
    <div class="row"><label>To</label><input type="date" id="to" value="2024-12-31"></div>
    <div class="big" id="days">—</div>
    <div class="sub" id="breakdown"></div>
  </section>

  <section class="card">
    <h2>Add / subtract days</h2>
    <div class="row"><label>Start date</label><input type="date" id="base" value="2024-01-01"></div>
    <div class="row"><label>Days to add (use − to subtract)</label><input type="number" id="offset" value="90"></div>
    <div class="out" id="addResult"></div>
  </section>
</div>

<footer>
  <b>DateDiff</b> · offline date duration calculator · <a href="https://github.com/awictor/date-diff">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Dates handled in UTC for exact day counts. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const two=n=>String(n).padStart(2,"0");

// --- Pure date math (UTC) ---
function toUTC(str){ const d=new Date(String(str)+"T00:00:00Z"); return isNaN(d.getTime())?null:d; }
function isoDate(d){ return d.getUTCFullYear()+"-"+two(d.getUTCMonth()+1)+"-"+two(d.getUTCDate()); }
function daysBetween(a,b){ const da=toUTC(a),db=toUTC(b); if(!da||!db) return null; return Math.round((db-da)/86400000); }
function addDays(str,n){ const d=toUTC(str); if(!d) return null; d.setUTCDate(d.getUTCDate()+Math.round(n)); return isoDate(d); }
function dayOfWeek(str){ const d=toUTC(str); return d?DOW[d.getUTCDay()]:null; }
function diffParts(aStr,bStr){
  let a=toUTC(aStr), b=toUTC(bStr); if(!a||!b) return null;
  if(b<a){ const t=a; a=b; b=t; }
  let y=b.getUTCFullYear()-a.getUTCFullYear();
  let m=b.getUTCMonth()-a.getUTCMonth();
  let d=b.getUTCDate()-a.getUTCDate();
  let bm=b.getUTCMonth();
  while(d<0){ m--; d+=new Date(Date.UTC(b.getUTCFullYear(),bm,0)).getUTCDate(); bm--; }
  if(m<0){ y--; m+=12; }
  return {years:y,months:m,days:d};
}

// --- UI ---
function render(){
  try{["from","to","base","offset"].forEach(k=>localStorage.setItem("datediff."+k,$(k).value));}catch(e){}
  const n=daysBetween($("from").value,$("to").value);
  if(n==null){ $("days").textContent="—"; $("breakdown").textContent=""; }
  else {
    const abs=Math.abs(n);
    $("days").textContent=abs.toLocaleString()+(abs===1?" day":" days");
    const p=diffParts($("from").value,$("to").value);
    const parts=[]; if(p.years)parts.push(p.years+"y"); if(p.months)parts.push(p.months+"mo"); if(p.days)parts.push(p.days+"d");
    $("breakdown").innerHTML=`= <b>${parts.join(" ")||"0d"}</b> · ${(abs/7).toFixed(1)} weeks`+(n<0?" · (To is before From)":"");
  }
  const res=addDays($("base").value,parseInt($("offset").value)||0);
  $("addResult").innerHTML= res? `= <b>${res}</b> (${dayOfWeek(res)})` : "—";
}
document.querySelectorAll("input").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("datediff.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["from","to","base","offset"].forEach(k=>{const v=localStorage.getItem("datediff."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={daysBetween,addDays,dayOfWeek,diffParts,isoDate};
</script>
</body>
</html>
