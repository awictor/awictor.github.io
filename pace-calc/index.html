<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PaceCalc — Running Pace Calculator</title>
<meta name="description" content="Enter a distance and time to get your pace per km and per mile, plus your speed. Race presets for 5K, 10K, half, and marathon. 100% offline, no signup." />
<meta name="theme-color" content="#0e7490" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="PaceCalc — Running Pace Calculator" />
<meta property="og:description" content="Distance + time → pace per km/mile and speed, with race presets. Offline." />
<meta property="og:url" content="https://awictor.github.io/pace-calc/" />
<link rel="canonical" href="https://awictor.github.io/pace-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e7490'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M32 22 V32 L40 38' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eef7fa; --ink:#0b1f26; --accent:#0e7490; --accent-d:#155e75;
    --card:#fff; --line:#d2e7ee; --muted:#4f6b73; --field:#fff;
    --shadow:0 1px 2px rgba(11,31,38,.05),0 8px 24px rgba(11,31,38,.07); }
  [data-theme="dark"]{ --bg:#06161b; --ink:#e6f2f6; --accent:#22d3ee; --accent-d:#67e8f9;
    --card:#0f2027; --line:#1e3640; --muted:#8aa5ad; --field:#06161b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  input[type=number]{width:80px;padding:11px 10px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,116,144,.15)}
  .time{display:flex;gap:6px;align-items:center}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .stat{background:var(--bg);border-radius:10px;padding:14px;text-align:center}
  .stat .v{font-size:24px;font-weight:700;color:var(--accent)} .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("pace.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Pace</span>Calc</h1>
  <p>Distance + time → your pace and speed. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="chips" id="chips"></div>
    <div class="row"><label>Distance</label><div class="time"><input id="dist" type="number" step="0.01" value="10"><select id="unit"><option value="km">km</option><option value="mi">mi</option></select></div></div>
    <div class="row"><label>Time</label><div class="time"><input id="h" type="number" min="0" value="0"><span class="muted">h</span><input id="m" type="number" min="0" value="50"><span class="muted">m</span><input id="s" type="number" min="0" value="0"><span class="muted">s</span></div></div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><div class="v" id="paceKm">—</div><div class="k">per km</div></div>
      <div class="stat"><div class="v" id="paceMi">—</div><div class="k">per mile</div></div>
      <div class="stat"><div class="v" id="kmh">—</div><div class="k">km/h</div></div>
      <div class="stat"><div class="v" id="mph">—</div><div class="k">mph</div></div>
    </div>
  </section>
</div>

<footer>
  <b>PaceCalc</b> · offline running pace calculator · <a href="https://github.com/awictor/pace-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};
const MI=1.609344;

// --- Pure pace math ---
function toSeconds(h,m,s){ return (+h||0)*3600+(+m||0)*60+(+s||0); }
function pacePerKm(distanceKm,secs){ return distanceKm>0 ? secs/distanceKm : 0; }
function speedKmh(distanceKm,secs){ return secs>0 ? distanceKm/(secs/3600) : 0; }
function fmtClock(secs){
  if(!isFinite(secs)||secs<=0) return "—";
  secs=Math.round(secs);
  const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
  const pad=n=>String(n).padStart(2,"0");
  return h>0 ? h+":"+pad(m)+":"+pad(s) : m+":"+pad(s);
}

// --- UI ---
const PRESETS=[["5K",5,"km"],["10K",10,"km"],["Half",21.0975,"km"],["Marathon",42.195,"km"],["1 mi",1,"mi"]];
function render(){
  const unit=$("unit").value, dist=num("dist");
  const distKm = unit==="mi" ? dist*MI : dist;
  const secs=toSeconds(num("h"),num("m"),num("s"));
  try{["dist","unit","h","m","s"].forEach(k=>localStorage.setItem("pace."+k,$(k).value));}catch(e){}
  const pk=pacePerKm(distKm,secs), spd=speedKmh(distKm,secs);
  $("paceKm").textContent=secs>0&&distKm>0?fmtClock(pk):"—";
  $("paceMi").textContent=secs>0&&distKm>0?fmtClock(pk*MI):"—";
  $("kmh").textContent=spd>0?(Math.round(spd*100)/100):"—";
  $("mph").textContent=spd>0?(Math.round(spd/MI*100)/100):"—";
}
$("chips").innerHTML=PRESETS.map(([l,d,u])=>`<button class="chip" data-d="${d}" data-u="${u}">${l}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("dist").value=c.dataset.d;$("unit").value=c.dataset.u;render();});
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("pace.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["dist","unit","h","m","s"].forEach(k=>{const v=localStorage.getItem("pace."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={toSeconds,pacePerKm,speedKmh,fmtClock};
</script>
</body>
</html>
