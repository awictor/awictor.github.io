<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isolario — a book of islands</title>
<style>
  :root{ --parch:#e9dcc0; --ink:#3a2c1a; --panel:#efe6d2; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:#241c12 radial-gradient(circle at 50% 30%, #372a19, #1a140c) fixed;
    color:var(--ink); font-family:Georgia,"Times New Roman",serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    padding:18px; gap:14px;
  }
  header{ text-align:center; color:#e6d6b2; }
  header h1{ margin:0; font-size:26px; letter-spacing:5px; font-variant:small-caps; }
  header p{ margin:4px 0 0; font-size:13px; font-style:italic; color:#c3ac80; }
  #bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    background:linear-gradient(#f3ead6,#e4d7bc); border:1px solid #b39a6d;
    border-radius:6px; padding:10px 16px; box-shadow:0 4px 18px rgba(0,0,0,.4);
  }
  #bar label{ font-size:12px; font-variant:small-caps; letter-spacing:1px; display:flex; align-items:center; gap:6px; }
  button,select{
    font-family:inherit; font-size:13px; color:var(--ink);
    background:linear-gradient(#f7f0dd,#e0d0ad); border:1px solid #9d8355;
    border-radius:4px; padding:6px 12px; cursor:pointer;
  }
  button:hover,select:hover{ background:linear-gradient(#fff8e7,#e9dabb); }
  button:active{ transform:translateY(1px); }
  input[type=range]{ width:150px; accent-color:#7a5a2c; }
  #stage{ position:relative; }
  canvas{
    display:block; width:min(86vh,92vw,760px); height:auto; border-radius:3px;
    box-shadow:0 10px 40px rgba(0,0,0,.55); background:var(--parch);
  }
  button:focus-visible,select:focus-visible,input[type=range]:focus-visible{
    outline:2px solid #9d8355; outline-offset:2px;
  }
  #tip{
    position:absolute; pointer-events:none; z-index:5; display:none;
    background:rgba(30,22,12,.92); color:#f0e4c6; border:1px solid #c9ad78;
    font-size:11px; padding:6px 9px; border-radius:4px; white-space:nowrap;
    transform:translate(-50%,-140%); letter-spacing:.4px;
  }
  #tip b{ color:#f7d98a; font-variant:small-caps; letter-spacing:1px; }
  footer{ color:#8f7a54; font-size:11px; font-style:italic; }
  kbd{ background:#e4d7bc; border:1px solid #b39a6d; border-radius:3px; padding:0 4px; font-family:inherit; }
</style>
</head>
<body>
<header>
  <h1>Isolario</h1>
  <p>a book of islands — seed a world, drawn as a page from a Renaissance sea chart</p>
</header>
<div id="bar">
  <button id="reseed" title="New world (R)">⚓ Reseed</button>
  <label>Sea level <input id="sea" type="range" min="0.18" max="0.62" step="0.005" value="0.38"><span id="sealbl" style="font-size:11px;font-style:italic;color:#7a5a2c;min-width:56px"></span></label>
  <label>Palette
    <select id="pal">
      <option value="0">Sepia Vellum</option>
      <option value="1">Nautical Indigo</option>
      <option value="2">Verdant Survey</option>
    </select>
  </label>
  <button id="png" title="Export PNG (P)">🖼 Export PNG</button>
  <span id="seedlbl" style="font-size:11px;font-style:italic;color:#7a5a2c"></span>
</div>
<div id="stage">
  <canvas id="c" width="1000" height="1000"></canvas>
  <div id="tip"></div>
</div>
<footer>Drag the sea to flood or drain the world · hover the chart to inspect · <kbd>R</kbd> reseed · <kbd>P</kbd> export · seed lives in the URL</footer>

<script>
"use strict";
/* ---------- seeded PRNG ---------- */
function xmur3(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19);} return function(){ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; }; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function rngFrom(seed){ const s=xmur3(seed); return mulberry32(s()); }

/* ---------- value-noise fBm (shared by elevation + moisture) ---------- */
function makeNoise(rand){
  const N=256, perm=new Uint8Array(N*2), val=new Float32Array(N);
  for(let i=0;i<N;i++){ perm[i]=i; val[i]=rand(); }
  for(let i=N-1;i>0;i--){ const j=(rand()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  for(let i=0;i<N;i++) perm[i+N]=perm[i];
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  function n2(x,y){
    const xi=Math.floor(x)&255, yi=Math.floor(y)&255, xf=x-Math.floor(x), yf=y-Math.floor(y);
    const u=fade(xf), v=fade(yf);
    const aa=val[perm[perm[xi]+yi]], ba=val[perm[perm[xi+1]+yi]];
    const ab=val[perm[perm[xi]+yi+1]], bb=val[perm[perm[xi+1]+yi+1]];
    const x1=aa+u*(ba-aa), x2=ab+u*(bb-ab);
    return x1+v*(x2-x1);
  }
  return function(x,y,oct){
    let a=0,amp=0.5,fr=1,tot=0;
    for(let o=0;o<oct;o++){ a+=n2(x*fr,y*fr)*amp; tot+=amp; amp*=0.5; fr*=2; }
    return a/tot;
  };
}

/* ---------- palettes ---------- */
const PAL=[
 {name:"Sepia Vellum", bg:"#e9dcc0", ink:"#4a3720", river:"#38506a",
  water:["#bcbf9c","#d3cfa6"], land:["#e2cf9d","#c8c78a","#a6ac6f","#c0a877","#a68f68","#efe7d0"]},
 {name:"Nautical Indigo", bg:"#e7e2d1", ink:"#26324a", river:"#2c3a5c",
  water:["#8f9bb3","#b6bfce"], land:["#dccfae","#bcc09e","#93a07f","#a9a596","#8d887f","#eef0ee"]},
 {name:"Verdant Survey", bg:"#eae4cd", ink:"#33402a", river:"#3a5a52",
  water:["#a7bfad","#c8d5bd"], land:["#dccfa1","#bcca86","#8faa66","#b3a06e","#95835b","#eef0e0"]}
];
function hx(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

/* ---------- fantasy name grammar ---------- */
function placeName(rand){
  const pre=["Vhar","Mor","Thal","Cael","Bran","Zeph","Ish","Dun","Nor","Kel","Oss","Ry","Aer","Gorm","Sel","Tir","Vor","Hel"];
  const mid=["","holm","mere","gard","fell","wyn","dor","reth","vane","mar","loch","stad"," by","aan"];
  const suf=["ia","os","heim","point","cay","strand","reach","spire","fast","haven","isle","mouth"];
  const kind=["Isle of","Isla","Terra","Ilha de","Insula","The Isle","Nesos"];
  const P=pre[(rand()*pre.length)|0], M=mid[(rand()*mid.length)|0], S=suf[(rand()*suf.length)|0];
  let nm=P+M+S; nm=nm.charAt(0).toUpperCase()+nm.slice(1);
  return kind[(rand()*kind.length)|0]+" "+nm;
}

/* ---------- globals ---------- */
const GN=200;                       // heightfield grid resolution
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const CW=cv.width, MARGIN=72, MX=MARGIN, MY=MARGIN, MW=CW-2*MARGIN, MH=CW-2*MARGIN;
let SEED="isolario", SEA=0.38, PALI=0;
let H=null, MO=null, DOWN=null, ACC=null, MIN=null, NAME=""; // per-seed fields

function idx(x,y){ return y*GN+x; }

/* ---------- generate heightfield + moisture + flow (per seed) ---------- */
function generate(){
  const r=rngFrom(SEED), eN=makeNoise(r), mN=makeNoise(r);
  NAME=placeName(rngFrom(SEED+"~name"));
  const ef=2.4+r()*1.2, mf=3.0+r()*1.5, warp=r()*40;
  H=new Float32Array(GN*GN); MO=new Float32Array(GN*GN);
  for(let y=0;y<GN;y++)for(let x=0;x<GN;x++){
    const nx=x/GN, ny=y/GN;
    let e=eN(nx*ef+warp,ny*ef, 6);
    const dx=nx-0.5, dy=ny-0.5, d=Math.sqrt(dx*dx+dy*dy)*2;      // 0 centre .. ~1.4
    const island=Math.max(0,1-Math.pow(Math.min(1,d/0.98),2.6));
    let h=e*0.5+island*0.62-0.14;
    H[idx(x,y)]=h<0?0:h>1?1:h;
    MO[idx(x,y)]=mN(nx*mf+11,ny*mf+7, 4);
  }
  // one box-smoothing pass (reduces local minima → cleaner rivers)
  const S=new Float32Array(H);
  for(let y=1;y<GN-1;y++)for(let x=1;x<GN-1;x++){
    let s=0; for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++) s+=H[idx(x+i,y+j)];
    S[idx(x,y)]=s/9;
  }
  H=S;
  // steepest-descent downhill neighbour + minima
  DOWN=new Int32Array(GN*GN).fill(-1); MIN=new Uint8Array(GN*GN);
  for(let y=1;y<GN-1;y++)for(let x=1;x<GN-1;x++){
    const c=idx(x,y), hc=H[c]; let best=hc, bi=-1;
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){ if(!i&&!j)continue;
      const n=idx(x+i,y+j); if(H[n]<best){ best=H[n]; bi=n; } }
    DOWN[c]=bi; if(bi<0) MIN[c]=1;
  }
  // flow accumulation: process cells high→low
  ACC=new Float32Array(GN*GN).fill(1);
  const order=Array.from({length:GN*GN},(_,i)=>i).sort((a,b)=>H[b]-H[a]);
  for(const c of order){ const d=DOWN[c]; if(d>=0) ACC[d]+=ACC[c]; }
}

/* ---------- biome classifier ---------- */
function biome(h,m){
  if(h<SEA-0.05) return 0;            // deep ocean
  if(h<SEA)       return 1;           // shallows
  if(h<SEA+0.015) return 2;           // beach
  const le=(h-SEA)/(1-SEA);
  if(le<0.16) return 3;               // grassland
  if(le<0.40) return m>0.48?4:3;      // forest / grass
  if(le<0.62) return 5;               // highland
  if(le<0.80) return 6;               // mountain rock
  return 7;                           // snow
}

/* ---------- geometry helpers ---------- */
function gx2px(gx){ return MX+gx/GN*MW; }
function gy2px(gy){ return MY+gy/GN*MH; }

/* ---------- full render (per sea level / palette) ---------- */
function render(){
  const P=PAL[PALI], ink=P.ink, bgc=hx(P.bg);
  ctx.clearRect(0,0,CW,CW);
  ctx.fillStyle=P.bg; ctx.fillRect(0,0,CW,CW);

  // biome + hillshade baked into a GN×GN image, then upscaled
  const off=document.createElement("canvas"); off.width=GN; off.height=GN;
  const octx=off.getContext("2d"), img=octx.createImageData(GN,GN), D=img.data;
  const wr=[hx(P.water[0]),hx(P.water[1])], lr=P.land.map(hx);
  for(let y=0;y<GN;y++)for(let x=0;x<GN;x++){
    const c=idx(x,y), h=H[c], b=biome(h,MO[c]); let col;
    if(b<2){ col=wr[b]; }
    else{
      col=lr[b-2].slice();
      // NW hill-shade from elevation gradient
      const hl=H[idx(Math.max(0,x-1),y)], ht=H[idx(x,Math.max(0,y-1))];
      const sh=1+((hl-h)+(ht-h))*3.4;                 // >1 lit (faces NW), <1 shade
      const s=sh<0.72?0.72:sh>1.22?1.22:sh;
      col=[col[0]*s,col[1]*s,col[2]*s];
    }
    const o=c*4; D[o]=col[0]; D[o+1]=col[1]; D[o+2]=col[2]; D[o+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,MX,MY,MW,MH);

  // procedural parchment grain over everything (subtle)
  const gr=rngFrom(SEED+"grain");
  ctx.save(); ctx.beginPath(); ctx.rect(MX,MY,MW,MH); ctx.clip();
  ctx.globalAlpha=.05;
  for(let i=0;i<1400;i++){ const gxp=MX+gr()*MW, gyp=MY+gr()*MH;
    ctx.fillStyle=gr()>.5?"#000":"#fff"; ctx.fillRect(gxp,gyp,1.4,1.4); }
  ctx.globalAlpha=1; ctx.restore();

  // decorative rng (stable per seed, independent of sea)
  const dr=rngFrom(SEED+"deco");

  ctx.save(); ctx.beginPath(); ctx.rect(MX,MY,MW,MH); ctx.clip();
  drawRhumb(dr, ink);                 // portolan rhumb-line network under the chart art? draw in ocean
  drawGraticule(ink);
  ctx.restore();

  drawRivers(P);
  drawLakes(P);
  drawCoast(ink);

  ctx.save(); ctx.beginPath(); ctx.rect(MX,MY,MW,MH); ctx.clip();
  drawMarginalia(dr, ink);
  ctx.restore();

  drawRoses(ink);
  drawBorder(ink, bgc);
  drawCartouche(P);
}

/* ---------- rhumb-line network (loxodromes from wind roses) ---------- */
let ROSES=[];
function computeRoses(){
  const cx=MX+MW/2, cy=MY+MH/2, rr=MW*0.36;
  ROSES=[ {x:cx+rr*Math.cos(-0.6),y:cy+rr*Math.sin(-0.6),main:false},
          {x:cx+rr*Math.cos(2.4), y:cy+rr*Math.sin(2.4), main:false},
          {x:cx+rr*Math.cos(1.4), y:cy+rr*Math.sin(1.4), main:true } ];
}
function drawRhumb(dr, ink){
  ctx.strokeStyle=ink; ctx.lineWidth=0.5; ctx.globalAlpha=0.16;
  const L=MW*1.5;
  for(const R of ROSES){
    for(let k=0;k<16;k++){ const a=k*Math.PI/8;
      ctx.beginPath(); ctx.moveTo(R.x-Math.cos(a)*L,R.y-Math.sin(a)*L);
      ctx.lineTo(R.x+Math.cos(a)*L,R.y+Math.sin(a)*L); ctx.stroke(); }
  }
  ctx.globalAlpha=1;
}

/* ---------- graticule ---------- */
function drawGraticule(ink){
  ctx.strokeStyle=ink; ctx.globalAlpha=0.12; ctx.lineWidth=0.6;
  for(let i=1;i<8;i++){ const t=MX+i/8*MW;
    ctx.beginPath(); ctx.moveTo(t,MY); ctx.lineTo(t,MY+MH); ctx.stroke();
    const u=MY+i/8*MH; ctx.beginPath(); ctx.moveTo(MX,u); ctx.lineTo(MX+MW,u); ctx.stroke(); }
  ctx.globalAlpha=1;
}

/* ---------- rivers (flow-accumulation, widen downstream) ---------- */
function drawRivers(P){
  ctx.strokeStyle=P.river; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.globalAlpha=0.85;
  const thr=55;
  for(let y=1;y<GN-1;y++)for(let x=1;x<GN-1;x++){
    const c=idx(x,y); if(H[c]<SEA) continue;
    if(ACC[c]<thr) continue; const d=DOWN[c]; if(d<0) continue;
    const w=Math.min(4,Math.max(0.5,Math.sqrt(ACC[c])/7));
    ctx.lineWidth=w; ctx.beginPath();
    ctx.moveTo(gx2px(x+0.5),gy2px(y+0.5));
    ctx.lineTo(gx2px((d%GN)+0.5),gy2px(((d/GN)|0)+0.5)); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ---------- inked lakes at unresolved minima ---------- */
function drawLakes(P){
  const lr=rngFrom(SEED+"lake");
  for(let y=2;y<GN-2;y++)for(let x=2;x<GN-2;x++){
    const c=idx(x,y); if(!MIN[c]||H[c]<SEA+0.02||ACC[c]<40) continue;
    const px=gx2px(x+0.5), py=gy2px(y+0.5), rad=Math.min(9,3+Math.sqrt(ACC[c])/9);
    ctx.fillStyle=P.water[1]; ctx.strokeStyle=P.river; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.ellipse(px,py,rad,rad*0.72,lr()*3,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=P.river; ctx.globalAlpha=0.5;
    for(let i=0;i<6;i++) ctx.fillRect(px-rad+lr()*rad*2,py-rad*0.7+lr()*rad*1.4,0.9,0.9);
    ctx.globalAlpha=1;
  }
}

/* ---------- stippled / hatched coastline ---------- */
function drawCoast(ink){
  const cr=rngFrom(SEED+"coast"); ctx.fillStyle=ink;
  for(let y=1;y<GN-1;y++)for(let x=1;x<GN-1;x++){
    const c=idx(x,y); if(H[c]<SEA) continue;
    const land=H[idx(x-1,y)]>=SEA&&H[idx(x+1,y)]>=SEA&&H[idx(x,y-1)]>=SEA&&H[idx(x,y+1)]>=SEA;
    if(land) continue;                             // interior land, skip
    const px=gx2px(x+0.5), py=gy2px(y+0.5);
    const n=1+(cr()*2|0);
    for(let i=0;i<n;i++) ctx.fillRect(px+(cr()-0.5)*4,py+(cr()-0.5)*4,0.9,0.9);
  }
}

/* ---------- ocean marginalia (Poisson-ish scatter of engraved glyphs) ---------- */
function drawMarginalia(dr, ink){
  const pts=[]; let dragon=false;
  ctx.strokeStyle=ink; ctx.fillStyle=ink;
  for(let a=0;a<220 && pts.length<11;a++){
    const px=MX+dr()*MW, py=MY+dr()*MH;
    const gx=((px-MX)/MW*GN)|0, gy=((py-MY)/MH*GN)|0;
    if(H[idx(Math.min(GN-1,gx),Math.min(GN-1,gy))]>=SEA-0.02) continue;   // must be open water
    let ok=true; for(const p of pts) if(Math.hypot(p[0]-px,p[1]-py)<78){ ok=false; break; }
    if(!ok) continue; pts.push([px,py]);
    const t=dr();
    ctx.save(); ctx.translate(px,py); ctx.globalAlpha=0.7; ctx.lineWidth=1;
    if(t<0.34) drawWaves();
    else if(t<0.58) drawSounding(dr,ink);
    else if(t<0.80) drawShip();
    else { drawMonster(); if(!dragon){ dragon=true; ctx.globalAlpha=0.5; ctx.font="italic 11px Georgia";
             ctx.textAlign="center"; ctx.fillText("HIC SVNT DRACONES",0,28); } }
    ctx.restore();
  }
}
function drawWaves(){ for(let j=0;j<3;j++){ ctx.beginPath();
  for(let i=0;i<=16;i++){ const x=-14+i*1.8, y=j*5+Math.sin(i*0.9)*2; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); } }
function drawSounding(dr,ink){ ctx.beginPath(); ctx.arc(0,0,1.4,0,7); ctx.fill();
  ctx.globalAlpha=0.6; ctx.font="9px Georgia"; ctx.textAlign="left"; ctx.fillText(((dr()*40)|0)+1,4,3); }
function drawShip(){ ctx.beginPath(); ctx.moveTo(-11,3); ctx.quadraticCurveTo(0,11,11,3); ctx.lineTo(-11,3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4,3); ctx.lineTo(-4,-11); ctx.moveTo(5,3); ctx.lineTo(5,-9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4,-10); ctx.quadraticCurveTo(2,-7,-4,-3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-8); ctx.quadraticCurveTo(10,-5,5,-2); ctx.stroke(); }
function drawMonster(){ ctx.beginPath(); ctx.moveTo(-14,0);
  for(let i=0;i<=24;i++){ const x=-14+i*1.2, y=Math.sin(i*0.7)*4; ctx.lineTo(x,y);} ctx.stroke();
  ctx.beginPath(); ctx.arc(14,-1,3.5,0,7); ctx.stroke();                         // head
  ctx.beginPath(); ctx.arc(15,-1,0.8,0,7); ctx.fill();                            // eye
  ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(-19,-4); ctx.lineTo(-19,4); ctx.stroke(); }

/* ---------- wind roses (main = full compass rose) ---------- */
function drawRoses(ink){
  for(const R of ROSES) drawRose(R.x,R.y,R.main?42:16,R.main,ink);
}
function drawRose(cx,cy,rad,main,ink){
  ctx.save(); ctx.translate(cx,cy);
  ctx.strokeStyle=ink; ctx.lineWidth=main?1.1:0.7;
  ctx.beginPath(); ctx.arc(0,0,rad,0,7); ctx.stroke();
  if(main){ ctx.beginPath(); ctx.arc(0,0,rad*0.72,0,7); ctx.stroke(); }
  for(let k=0;k<8;k++){ const a=k*Math.PI/4, long=(k%2===0);
    const r=long?rad:rad*0.6, r2=long?rad*0.18:rad*0.12;
    const ax=Math.cos(a-Math.PI/2), ay=Math.sin(a-Math.PI/2);
    const bx=Math.cos(a-Math.PI/2+Math.PI/8), by=Math.sin(a-Math.PI/2+Math.PI/8);
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(bx*r2,by*r2); ctx.lineTo(ax*r,ay*r);
    ctx.lineTo(-bx*r2,-by*r2); ctx.closePath();
    ctx.fillStyle=(k===0)?ink:(long?"rgba(60,44,26,.55)":"rgba(60,44,26,.2)"); ctx.fill(); ctx.stroke();
  }
  if(main){ ctx.fillStyle=ink; ctx.font="bold 12px Georgia"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("N",0,-rad-9); }
  ctx.restore();
}

/* ---------- ornamental double-rule border + corners ---------- */
function drawBorder(ink,bgc){
  ctx.strokeStyle=ink; ctx.fillStyle=`rgb(${bgc[0]},${bgc[1]},${bgc[2]})`;
  // mask outside map with parchment so glyphs/rhumbs don't bleed into frame
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,CW,CW); ctx.rect(MX,MY,MW,MH); ctx.fill("evenodd"); ctx.restore();
  ctx.lineWidth=2.2; ctx.strokeRect(MX,MY,MW,MH);
  ctx.lineWidth=0.9; const g=7; ctx.strokeRect(MX-g,MY-g,MW+2*g,MH+2*g);
  // tick ruling between the rules
  ctx.lineWidth=0.7;
  for(let i=0;i<=40;i++){ const t=i/40;
    const xx=MX+t*MW, yy=MY+t*MH;
    ctx.beginPath(); ctx.moveTo(xx,MY);   ctx.lineTo(xx,MY-g); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xx,MY+MH);ctx.lineTo(xx,MY+MH+g); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MX,yy);   ctx.lineTo(MX-g,yy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MX+MW,yy);ctx.lineTo(MX+MW+g,yy); ctx.stroke();
  }
  // corner ornaments
  for(const [ox,oy,sx,sy] of [[MX,MY,1,1],[MX+MW,MY,-1,1],[MX,MY+MH,1,-1],[MX+MW,MY+MH,-1,-1]]){
    ctx.beginPath(); ctx.moveTo(ox+sx*14,oy); ctx.quadraticCurveTo(ox+sx*14,oy+sy*14,ox,oy+sy*14); ctx.stroke();
    ctx.beginPath(); ctx.arc(ox+sx*14,oy+sy*14,2.2,0,7); ctx.fillStyle=ink; ctx.fill();
  }
}

/* ---------- titled cartouche with procedural legend ---------- */
const LEG=[["Ocean",0],["Beach",2],["Grassland",3],["Forest",4],["Highland",5],["Peak",7]];
function drawCartouche(P){
  const w=214, h=150, x=MX+10, y=MY+MH-h-10;
  ctx.save();
  // scrolled parchment panel
  ctx.fillStyle="rgba(243,234,214,.94)"; ctx.strokeStyle=P.ink; ctx.lineWidth=1.4;
  roundRect(x,y,w,h,9); ctx.fill(); ctx.stroke();
  ctx.lineWidth=0.7; roundRect(x+5,y+5,w-10,h-10,7); ctx.stroke();
  // title
  ctx.fillStyle=P.ink; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.font="italic 17px Georgia"; wrapText(NAME,x+w/2,y+30,w-24,19);
  ctx.beginPath(); ctx.moveTo(x+24,y+50); ctx.lineTo(x+w-24,y+50); ctx.stroke();
  // legend
  const lr=P.land.map(hx), wr=P.water.map(hx);
  ctx.textAlign="left"; ctx.font="12px Georgia";
  LEG.forEach((L,i)=>{
    const col= L[1]<2? wr[L[1]] : lr[L[1]-2];
    const ly=y+66+ (i%3)*24, lx=x+16+ (i<3?0:100);
    ctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.fillRect(lx,ly-9,13,13); ctx.strokeStyle=P.ink; ctx.lineWidth=0.7; ctx.strokeRect(lx,ly-9,13,13);
    ctx.fillStyle=P.ink; ctx.fillText(L[0],lx+18,ly+1);
  });
  ctx.font="italic 10px Georgia"; ctx.textAlign="center"; ctx.globalAlpha=.7;
  ctx.fillText("scala · leguae · anno mmxxvi",x+w/2,y+h-12);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapText(t,cx,cy,maxw,lh){ const words=t.split(" "); let line="",yy=cy;
  for(const wd of words){ const test=line?line+" "+wd:wd;
    if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,cx,yy); line=wd; yy+=lh; } else line=test; }
  ctx.fillText(line,cx,yy); }

/* ---------- aged ink-bleed reveal ---------- */
let rafReveal=0, baseCv=null;
function reveal(){
  if(rafReveal){ cancelAnimationFrame(rafReveal); rafReveal=0; } // cancel any in-flight reveal
  render();                                                       // draw the full chart once…
  if(!baseCv){ baseCv=document.createElement("canvas"); baseCv.width=CW; baseCv.height=CW; }
  const bctx=baseCv.getContext("2d"); bctx.clearRect(0,0,CW,CW); bctx.drawImage(cv,0,0); // …snapshot it
  const start=performance.now(), dur=680, P=PAL[PALI];
  const blots=Array.from({length:14},()=>[MX+Math.random()*MW,MY+Math.random()*MH,20+Math.random()*70]);
  function frame(now){
    const t=Math.min(1,(now-start)/dur), e=1-Math.pow(1-t,3);
    ctx.clearRect(0,0,CW,CW); ctx.drawImage(baseCv,0,0);          // blit base, only redraw the fade
    ctx.save(); ctx.globalAlpha=1-e; ctx.fillStyle=P.bg; ctx.fillRect(MX,MY,MW,MH);
    ctx.globalAlpha=(1-e)*0.5; ctx.fillStyle="#5a4326";
    for(const b of blots){ ctx.beginPath(); ctx.arc(b[0],b[1],b[2]*(0.4+e*1.3),0,7); ctx.fill(); }
    ctx.restore();
    rafReveal = t<1 ? requestAnimationFrame(frame) : 0;
  }
  rafReveal=requestAnimationFrame(frame);
}

/* ---------- hover-to-inspect ---------- */
const BNAMES=["Deep ocean","Shallows","Beach","Grassland","Forest","Highland","Mountain","Snowcap"];
const tip=document.getElementById("tip"), stage=document.getElementById("stage");
cv.addEventListener("mousemove",ev=>{
  const rect=cv.getBoundingClientRect(), sc=cv.width/rect.width;
  const px=(ev.clientX-rect.left)*sc, py=(ev.clientY-rect.top)*sc;
  if(px<MX||px>MX+MW||py<MY||py>MY+MH){ tip.style.display="none"; return; }
  const gx=Math.min(GN-1,((px-MX)/MW*GN)|0), gy=Math.min(GN-1,((py-MY)/MH*GN)|0);
  const c=idx(gx,gy), h=H[c], b=biome(h,MO[c]);
  tip.innerHTML=`<b>${NAME}</b><br>${BNAMES[b]} · elev ${(h*100|0)}${MIN[c]&&h>=SEA?" · basin":""}`;
  tip.style.left=(ev.clientX-rect.left)+"px"; tip.style.top=(ev.clientY-rect.top)+"px";
  // flip below the cursor when near the top so the readout isn't clipped off-stage
  tip.style.transform=(ev.clientY-rect.top<44)?"translate(-50%,40%)":"translate(-50%,-140%)";
  tip.style.display="block";
});
cv.addEventListener("mouseleave",()=>tip.style.display="none");

/* ---------- controls ---------- */
const seedlbl=document.getElementById("seedlbl"), sealbl=document.getElementById("sealbl");
function updateSeaLabel(){
  let wet=0; for(let i=0;i<H.length;i++) if(H[i]<SEA) wet++;
  const pct=Math.round(wet/H.length*100);
  const word=SEA<0.30?"shallow":SEA<0.48?"balanced":"drowned";
  sealbl.textContent=pct+"% sea · "+word;
}
function newWorld(seed,animate){
  SEED=seed; location.hash=encodeURIComponent(seed);
  seedlbl.textContent="seed: "+seed;
  generate(); computeRoses(); updateSeaLabel();
  animate?reveal():render();
}
document.getElementById("reseed").onclick=()=>newWorld(Math.random().toString(36).slice(2,9),true);
const sea=document.getElementById("sea"); let rafSea=0;
sea.oninput=()=>{ SEA=parseFloat(sea.value); updateSeaLabel(); if(!rafSea) rafSea=requestAnimationFrame(()=>{ rafSea=0; render(); }); };
document.getElementById("pal").onchange=e=>{ PALI=+e.target.value; render(); };
document.getElementById("png").onclick=exportPNG;
function exportPNG(){ const a=document.createElement("a");
  a.download="isolario-"+SEED+".png"; a.href=cv.toDataURL("image/png"); a.click(); }
addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="r"||e.key==="R") document.getElementById("reseed").click();
  if(e.key==="p"||e.key==="P") exportPNG(); });

/* ---------- boot ---------- */
computeRoses();
const start=location.hash?decodeURIComponent(location.hash.slice(1)):Math.random().toString(36).slice(2,9);
newWorld(start,true);
</script>
