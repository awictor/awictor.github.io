<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PasswordPolicy — Check a Password Against Rules</title>
<meta name="description" content="Check a password against a configurable policy — length, uppercase, lowercase, digit, symbol, no spaces — with per-rule pass/fail. 100% offline, nothing leaves your browser.">
<script>
  (function(){ try{
    var t = localStorage.getItem('pwpolicy-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#5b21b6;
    --bg:#f6f4fb; --card:#ffffff; --fg:#1a1526; --muted:#615a72; --line:#e8e2f0; --shadow:0 1px 3px rgba(0,0,0,.08);
    --ok:#16a34a; --no:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0f0b16; --card:#191320; --fg:#efeaf7; --muted:#998fac; --line:#261e33; --shadow:0 1px 3px rgba(0,0,0,.5);
    --ok:#4ade80; --no:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:640px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#4c1d95);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:640px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.15rem}
  input.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .policy{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
  .policy label{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--fg);margin:0}
  .lens{display:flex;gap:12px;margin-top:12px}
  .lens > div{flex:1}
  .lens input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .verdict{text-align:center;font-size:1.2rem;font-weight:800;margin-bottom:10px}
  .verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
  .rules{display:flex;flex-direction:column;gap:6px}
  .rule{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .rule .m{font-weight:800}
  .rule.ok{border-left:3px solid var(--ok)} .rule.ok .m{color:var(--ok)}
  .rule.no{border-left:3px solid var(--no)} .rule.no .m{color:var(--no)}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:640px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🔐</div>
    <div><h1>PasswordPolicy</h1><div class="sub">Does it meet the rules?</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="pw">Password</label>
    <input type="text" id="pw" class="mono" value="Ab1!secret" spellcheck="false" autocomplete="off">
    <div class="policy">
      <label><input type="checkbox" id="upper" checked> uppercase</label>
      <label><input type="checkbox" id="lower" checked> lowercase</label>
      <label><input type="checkbox" id="digit" checked> digit</label>
      <label><input type="checkbox" id="symbol" checked> symbol</label>
      <label><input type="checkbox" id="noSpaces" checked> no spaces</label>
    </div>
    <div class="lens">
      <div><label for="min">Min length</label><input type="number" id="min" value="8" min="0" step="1"></div>
      <div><label for="max">Max length (0 = none)</label><input type="number" id="max" value="0" min="0" step="1"></div>
    </div>
  </div>
  <div class="card">
    <div class="verdict" id="verdict"></div>
    <div class="rules" id="rules"></div>
  </div>
</main>
<footer>
  Checks a password against explicit rules (like a signup form's requirements) and shows which pass. For strength, see <a href="https://awictor.github.io/strength-check/">StrengthCheck</a>. Everything stays in your browser. 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/password-policy">Source</a>.
</footer>

<script>
  // ---------- pure logic ----------
  // Check a password against a policy. Returns { rules:[{label,ok}], passed }.
  function check(password, policy = {}){
    const p = String(password);
    const rules = [];
    const add = (label, ok) => rules.push({ label, ok: !!ok });

    if(policy.minLength != null) add(`At least ${policy.minLength} characters`, p.length >= policy.minLength);
    if(policy.maxLength) add(`At most ${policy.maxLength} characters`, p.length <= policy.maxLength);
    if(policy.upper) add('Has an uppercase letter', /[A-Z]/.test(p));
    if(policy.lower) add('Has a lowercase letter', /[a-z]/.test(p));
    if(policy.digit) add('Has a digit', /[0-9]/.test(p));
    if(policy.symbol) add('Has a symbol', /[^A-Za-z0-9]/.test(p));
    if(policy.noSpaces) add('No spaces', !/\s/.test(p));

    return { rules, passed: rules.every(r => r.ok) };
  }

  // ---------- UI ----------
  if(typeof document !== 'undefined' && document.getElementById('rules')){
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

    function render(){
      const policy = {
        minLength: +$('min').value,
        maxLength: +$('max').value || 0,
        upper: $('upper').checked, lower: $('lower').checked,
        digit: $('digit').checked, symbol: $('symbol').checked,
        noSpaces: $('noSpaces').checked
      };
      const res = check($('pw').value, policy);
      $('verdict').className = 'verdict ' + (res.passed ? 'ok' : 'no');
      $('verdict').textContent = res.rules.length === 0 ? 'No rules selected'
        : res.passed ? '✓ Meets all requirements' : '✗ Does not meet all requirements';
      $('rules').innerHTML = res.rules.map(r =>
        `<div class="rule ${r.ok ? 'ok' : 'no'}"><span class="m">${r.ok ? '✓' : '✗'}</span><span>${esc(r.label)}</span></div>`).join('');
    }
    [...document.querySelectorAll('input')].forEach(el => el.addEventListener('input', render));
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('pwpolicy-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { check };
</script>
</body>
</html>
