<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BaseConvert — Binary / Octal / Decimal / Hex Converter</title>
<meta name="description" content="Convert numbers between binary, octal, decimal, hexadecimal, and any base 2–36 — big-integer precise. 100% offline, no signup." />
<meta name="theme-color" content="#c2410c" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="BaseConvert — Number Base Converter" />
<meta property="og:description" content="Binary, octal, decimal, hex, and any base 2–36, big-integer precise. Offline." />
<meta property="og:url" content="https://awictor.github.io/base-convert/" />
<link rel="canonical" href="https://awictor.github.io/base-convert/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Ctext x='32' y='42' font-size='22' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3E01%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fbf4ef; --ink:#261509; --accent:#c2410c; --accent-d:#9a3412;
    --card:#fff; --line:#efdccd; --muted:#78604e; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(38,21,9,.05),0 8px 24px rgba(38,21,9,.07); }
  [data-theme="dark"]{ --bg:#170c05; --ink:#f4e9e0; --accent:#fb923c; --accent-d:#fdba74;
    --card:#20130a; --line:#342117; --muted:#a98d78; --bad:#f0685c; --field:#170c05;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:640px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .field{margin:12px 0}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  .field label .copy{cursor:pointer;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600}
  input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:17px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);word-break:break-all}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,65,12,.15)}
  input.bad{border-color:var(--bad)}
  .customrow{display:flex;gap:8px;align-items:flex-end}
  .customrow .field{flex:1;margin-bottom:0}
  .customrow input[type=number]{width:90px;padding:12px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:15px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
  #msg{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
</style>
<script>(function(){try{var t=localStorage.getItem("baseconv.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Base</span>Convert</h1>
  <p>Convert numbers between binary, octal, decimal, hex, and any base 2–36. Big-integer precise, 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="field"><label>Decimal (base 10) <span class="copy" data-f="dec">copy</span></label><input type="text" id="dec" inputmode="numeric" value="255" spellcheck="false"></div>
    <div class="field"><label>Binary (base 2) <span class="copy" data-f="bin">copy</span></label><input type="text" id="bin" spellcheck="false"></div>
    <div class="field"><label>Octal (base 8) <span class="copy" data-f="oct">copy</span></label><input type="text" id="oct" spellcheck="false"></div>
    <div class="field"><label>Hexadecimal (base 16) <span class="copy" data-f="hex">copy</span></label><input type="text" id="hex" spellcheck="false"></div>
    <div class="customrow">
      <div class="field"><label>Custom base <span class="copy" data-f="cust">copy</span></label><input type="text" id="cust" spellcheck="false"></div>
      <input type="number" id="custBase" min="2" max="36" value="36" title="base 2–36">
    </div>
    <div id="msg"></div>
  </section>
</div>

<footer>
  <b>BaseConvert</b> · offline number base converter · <a href="https://github.com/awictor/base-convert">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Big-integer precise · bases 2–36. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const DIGITS="0123456789abcdefghijklmnopqrstuvwxyz";

// --- Pure base conversion (BigInt) ---
function parseInBase(str,base){
  base=Number(base); if(!Number.isInteger(base)||base<2||base>36) return null;
  let s=String(str).trim().toLowerCase(); if(s==="") return null;
  let neg=false; if(s[0]==="-"){ neg=true; s=s.slice(1); } if(s==="") return null;
  const B=BigInt(base); let acc=0n;
  for(const ch of s){ const d=DIGITS.indexOf(ch); if(d<0||d>=base) return null; acc=acc*B+BigInt(d); }
  return neg?-acc:acc;
}
function toBase(value,base){
  base=Number(base); if(!Number.isInteger(base)||base<2||base>36) return null;
  let v=typeof value==="bigint"?value:BigInt(value);
  if(v===0n) return "0";
  const neg=v<0n; if(neg) v=-v;
  const B=BigInt(base); let out="";
  while(v>0n){ out=DIGITS[Number(v%B)]+out; v/=B; }
  return neg?"-"+out:out;
}
function convert(str,fromBase,toBaseNum){ const v=parseInBase(str,fromBase); return v==null?null:toBase(v,toBaseNum); }

// --- UI ---
const FIELDS={dec:10,bin:2,oct:8,hex:16};
function refresh(sourceId,value){
  try{localStorage.setItem("baseconv.dec",value.toString());}catch(e){}
  for(const [id,base] of Object.entries(FIELDS)){ if(id!==sourceId) $(id).value=toBase(value,base); $(id).classList.remove("bad"); }
  const cb=Math.max(2,Math.min(36,parseInt($("custBase").value)||36));
  if(sourceId!=="cust") $("cust").value=toBase(value,cb);
}
function fromField(id,base){
  const v=parseInBase($(id).value,base);
  if(v==null){ $(id).classList.add("bad"); return; }
  refresh(id,v);
}
for(const [id,base] of Object.entries(FIELDS)) $(id).addEventListener("input",()=>fromField(id,base));
$("cust").addEventListener("input",()=>{const cb=Math.max(2,Math.min(36,parseInt($("custBase").value)||36));fromField("cust",cb);});
$("custBase").addEventListener("input",()=>{const v=parseInBase($("dec").value,10);if(v!=null){const cb=Math.max(2,Math.min(36,parseInt($("custBase").value)||36));$("cust").value=toBase(v,cb);}});
document.querySelectorAll(".copy").forEach(c=>c.onclick=()=>{const v=$(c.dataset.f).value;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1200);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();});
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("baseconv.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const d=localStorage.getItem("baseconv.dec");if(d!=null)$("dec").value=d;}catch(e){}
(function(){const v=parseInBase($("dec").value,10);refresh("dec",v==null?0n:v);})();

if(typeof module!=="undefined") module.exports={parseInBase,toBase,convert};
</script>
</body>
</html>
