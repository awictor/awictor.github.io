<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waver — magnetic pendulum basins</title>
<style>
  :root{ --bg:#0b0d12; --panel:#151922e0; --ink:#e7ecf3; --dim:#8a93a6; --accent:#ff6100; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #cv{ display:block; position:fixed; inset:0; cursor:crosshair; touch-action:none; }
  .clean #panel,.clean #hud,.clean #prog{ opacity:0; pointer-events:none; }
  #restore{ position:fixed; top:14px; left:14px; padding:6px 11px; border-radius:999px;
    background:var(--panel); -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
    border:1px solid #ffffff1a; color:var(--dim); font-size:11px; z-index:7; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .3s; }
  .clean #restore{ opacity:.55; pointer-events:auto; }
  .clean #restore:hover{ opacity:1; color:var(--ink); }
  #panel{ position:fixed; top:14px; left:14px; width:236px; padding:14px 16px 16px;
    background:var(--panel); -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); border:1px solid #ffffff14;
    border-radius:14px; box-shadow:0 10px 40px #0009; transition:opacity .3s; z-index:5; }
  #panel h1{ margin:0 0 2px; font-size:17px; letter-spacing:.4px; color:var(--accent); font-weight:700; }
  #panel .tag{ color:var(--dim); font-size:11px; margin-bottom:12px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:9px 0; }
  .row label{ color:var(--dim); flex:0 0 62px; }
  .row input[type=range]{ flex:1; accent-color:var(--accent); height:3px; }
  .row .val{ flex:0 0 40px; text-align:right; font-variant-numeric:tabular-nums; color:#c7cede; }
  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:12px; }
  button,select{ font:inherit; color:var(--ink); background:#222835; border:1px solid #ffffff1a;
    border-radius:8px; padding:7px 8px; cursor:pointer; transition:.15s; }
  button:hover,select:hover{ background:#2c3444; border-color:#ffffff33; }
  button.primary{ background:var(--accent); color:#111; border-color:transparent; font-weight:600; grid-column:1/3; }
  button.primary:hover{ filter:brightness(1.08); }
  .mag-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .mag-row .dots{ display:flex; gap:5px; flex:1; }
  .dot{ width:16px; height:16px; border-radius:50%; box-shadow:0 0 0 1px #ffffff33 inset;
    display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700;
    color:#000a; text-shadow:0 0 2px #fff6; }
  .hint{ color:var(--dim); font-size:10.5px; margin-top:12px; line-height:1.5; }
  .hint b{ color:#c7cede; font-weight:600; }
  #hud{ position:fixed; bottom:14px; left:14px; padding:9px 13px; background:var(--panel);
    -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); border:1px solid #ffffff14; border-radius:11px; z-index:5;
    display:flex; gap:16px; align-items:center; transition:opacity .3s; font-variant-numeric:tabular-nums; }
  #hud .k{ color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  #hud .v{ font-size:15px; }
  #hud .swatch{ width:13px; height:13px; border-radius:50%; display:inline-block; vertical-align:-1px;
    box-shadow:0 0 0 1px #fff3 inset; margin-right:4px; }
  #prog{ position:fixed; bottom:0; left:0; height:3px; width:0; background:var(--accent);
    box-shadow:0 0 10px var(--accent); transition:width .12s linear, opacity .4s; z-index:6; }
  button:focus-visible,select:focus-visible,input:focus-visible,#restore:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    #panel,#hud,#restore{ transition:none; }
    #prog{ transition:opacity .4s; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="prog"></div>
<button id="restore" title="show controls (H)">press H to show controls</button>
<div id="panel">
  <h1>Waver</h1>
  <div class="tag">magnetic pendulum · basins of attraction</div>
  <div class="row"><label>friction</label><input id="s_fric" type="range" min="0.02" max="0.4" step="0.005"><span class="val" id="v_fric"></span></div>
  <div class="row"><label>spring</label><input id="s_spr" type="range" min="0.02" max="0.4" step="0.005"><span class="val" id="v_spr"></span></div>
  <div class="row"><label>pull</label><input id="s_str" type="range" min="0.2" max="3.5" step="0.05"><span class="val" id="v_str"></span></div>
  <div class="row"><label>height</label><input id="s_hgt" type="range" min="0.08" max="0.6" step="0.01"><span class="val" id="v_hgt"></span></div>
  <div class="mag-row">
    <button id="b_less" title="remove magnet">–</button>
    <div class="dots" id="dots"></div>
    <button id="b_more" title="add magnet">+</button>
  </div>
  <div class="row" style="margin-top:12px"><label>palette</label>
    <select id="pal"><option value="turbo">turbo</option><option value="viridis">viridis</option><option value="pastel">pastel</option></select></div>
  <div class="btns">
    <button class="primary" id="b_reveal">Reveal basins</button>
    <button id="b_png">Save PNG</button>
    <button id="b_clean">Clean view</button>
  </div>
  <div class="hint"><b>Click</b> the plane to drop the bob. <b>Drag</b> a magnet to reshape the fractal. Keys: <b>R</b> reveal · <b>H</b> clean · <b>P</b> png.</div>
</div>
<div id="hud">
  <div><div class="k">energy</div><div class="v" id="h_e">—</div></div>
  <div><div class="k">converging to</div><div class="v" id="h_b">drop the bob</div></div>
  <div><div class="k">status</div><div class="v" id="h_s">idle</div></div>
</div>
<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);
const PALETTES={
  turbo:['#4669f2','#1bd0d5','#a4fc3c','#fdb200','#fb4b0a','#c31d8f'],
  viridis:['#440154','#3b528b','#21918c','#5ec962','#addc30','#fde725'],
  pastel:['#ff9aa2','#ffd59e','#c8f7a1','#a2e8dd','#a2c8ff','#d3b4ff']
};
let W,H,scale,DPR;
const VIEW=1.75, DT=0.1, CAPTURE=0.04;
// physics params + world state
let P={fric:0.12, spr:0.12, str:1.3, hgt:0.22, pal:'turbo', n:3};
let magnets=[];   // {x,y}
let cols=[];      // [r,g,b] per magnet from palette
let mode='idle';  // idle | live | render

// ---- coordinate transforms ----
let lastW=0,lastH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.floor(window.innerWidth), H=Math.floor(window.innerHeight);
  lastW=window.innerWidth; lastH=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(W,H)/(2*VIEW);
  clearScene(); drawScene();
}
const sx=wx=>W/2+wx*scale, sy=wy=>H/2+wy*scale;
const toWx=px=>(px-W/2)/scale, toWy=py=>(py-H/2)/scale;

// ---- palette helpers ----
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function recolor(){ const pal=PALETTES[P.pal]; cols=magnets.map((_,i)=>hex2rgb(pal[i%pal.length])); renderDots(); }
function renderDots(){
  const d=$('dots'); d.innerHTML='';
  magnets.forEach((m,i)=>{ const s=document.createElement('div'); s.className='dot';
    s.style.background=`rgb(${cols[i].join(',')})`; s.textContent=i+1; d.appendChild(s); });
}

// ---- core simulation: returns [magnetIndex, stepsToSettle] ----
function simulate(x,y,cap){
  let vx=0,vy=0, stable=0;
  const fr=P.fric, k=P.spr, st=P.str, h2=P.hgt*P.hgt;
  for(let s=1;s<=cap;s++){
    let ax=-k*x-fr*vx, ay=-k*y-fr*vy;
    for(let i=0;i<magnets.length;i++){
      const dx=magnets[i].x-x, dy=magnets[i].y-y;
      const d=Math.pow(dx*dx+dy*dy+h2,1.5);
      ax+=st*dx/d; ay+=st*dy/d;
    }
    vx+=ax*DT; vy+=ay*DT; x+=vx*DT; y+=vy*DT;
    // early exit when parked near a magnet
    if(vx*vx+vy*vy<4e-4){
      let ni=nearest(x,y);
      const dx=magnets[ni].x-x, dy=magnets[ni].y-y;
      if(dx*dx+dy*dy<0.09){ if(++stable>15) return [ni,s]; } else stable=0;
    } else stable=0;
    const cap_i=insideCapture(x,y); if(cap_i>=0) return [cap_i,s];
  }
  return [nearest(x,y),cap];
}
function nearest(x,y){ let bi=0,bd=1e9; for(let i=0;i<magnets.length;i++){
  const dx=magnets[i].x-x,dy=magnets[i].y-y,d=dx*dx+dy*dy; if(d<bd){bd=d;bi=i;} } return bi; }
function insideCapture(x,y){ for(let i=0;i<magnets.length;i++){
  const dx=magnets[i].x-x,dy=magnets[i].y-y; if(dx*dx+dy*dy<CAPTURE*CAPTURE) return i; } return -1; }

// ---- basin color w/ iteration shading ----
const CAP_FULL=1400, LOGMAX=Math.log(CAP_FULL);
function shade(idx,steps,out,o){
  const t=Math.min(1,Math.log(steps+1)/LOGMAX);      // 0 fast .. 1 slow
  const f=0.42+0.58*(1-t);                            // faster => brighter
  const c=cols[idx];
  out[o]=c[0]*f; out[o+1]=c[1]*f; out[o+2]=c[2]*f; out[o+3]=255;
}

// ---- progressive basin renderer (coarse fill -> adaptive edge refine) ----
let R=null, stepRAF=0;
function queueStep(){ if(stepRAF) cancelAnimationFrame(stepRAF); stepRAF=requestAnimationFrame(step); }
function startRender(preview){
  mode='render'; setStatus(preview?'morphing…':'rendering basins…');
  const CB=preview?9:5, cap=preview?520:CAP_FULL;
  const gw=Math.ceil(W/CB), gh=Math.ceil(H/CB);
  R={CB,cap,gw,gh,preview, gidx:new Int16Array(gw*gh),
     img:ctx.getImageData(0,0,W*DPR,H*DPR), phase:0, gy:0, py:0};
  queueStep();
}
function put(){ ctx.putImageData(R.img,0,0); }
function fillBlock(px,py,idx,steps){                   // fill CB×CB block (in DPR pixels)
  const d=R.img.data, CB=R.CB, x0=Math.floor(px*DPR), y0=Math.floor(py*DPR),
        x1=Math.min(cv.width,Math.floor((px+CB)*DPR)), y1=Math.min(cv.height,Math.floor((py+CB)*DPR)),
        tmp=[0,0,0,0]; shade(idx,steps,tmp,0);
  for(let y=y0;y<y1;y++){ let o=(y*cv.width+x0)*4;
    for(let x=x0;x<x1;x++){ d[o]=tmp[0]; d[o+1]=tmp[1]; d[o+2]=tmp[2]; d[o+3]=255; o+=4; } }
}
function pixel(px,py,idx,steps){                        // one CSS pixel = DPR×DPR device px
  const d=R.img.data, x0=Math.floor(px*DPR), y0=Math.floor(py*DPR),
        x1=Math.min(cv.width,Math.ceil((px+1)*DPR)), y1=Math.min(cv.height,Math.ceil((py+1)*DPR)),
        tmp=[0,0,0,0]; shade(idx,steps,tmp,0);
  for(let y=y0;y<y1;y++){ let o=(y*cv.width+x0)*4;
    for(let x=x0;x<x1;x++){ d[o]=tmp[0]; d[o+1]=tmp[1]; d[o+2]=tmp[2]; d[o+3]=255; o+=4; } }
}
function step(){
  stepRAF=0;
  if(mode!=='render'||!R) return;
  // canvas was resized out from under an in-flight render — abort, resize handler restarts
  if(R.img.width!==cv.width||R.img.height!==cv.height){ R=null; return; }
  const t0=performance.now();
  if(R.phase===0){ // coarse pass — fill every block
    while(R.gy<R.gh){
      for(let gx=0;gx<R.gw;gx++){
        const px=gx*R.CB, py=R.gy*R.CB;
        const [idx,st]=simulate(toWx(px+R.CB/2),toWy(py+R.CB/2),R.cap);
        R.gidx[R.gy*R.gw+gx]=idx; fillBlock(px,py,idx,st);
      }
      R.gy++;
      if(performance.now()-t0>15){ progress(0.55*R.gy/R.gh); put(); return queueStep(); }
    }
    if(R.preview){ put(); drawScene(); progress(1); mode='idle'; setStatus('preview'); return; }
    R.phase=1; R.py=0;
  }
  // refine pass — recompute only pixels bordering a basin boundary
  const {CB,gw,gh,gidx}=R;
  while(R.py<H){
    for(let px=0;px<W;px++){
      const gx=Math.min(gw-1,(px/CB)|0), gy=Math.min(gh-1,(R.py/CB)|0), c=gidx[gy*gw+gx];
      let edge=false;
      for(let dy=-1;dy<=1&&!edge;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=gx+dx, ny=gy+dy; if(nx<0||ny<0||nx>=gw||ny>=gh)continue;
        if(gidx[ny*gw+nx]!==c){ edge=true; break; }
      }
      if(edge){ const [idx,st]=simulate(toWx(px+0.5),toWy(R.py+0.5),R.cap); pixel(px,R.py,idx,st); }
    }
    R.py++;
    if(performance.now()-t0>15){ progress(0.55+0.45*R.py/H); put(); return queueStep(); }
  }
  put(); drawScene(); progress(1); mode='idle'; setStatus('basins revealed'); R=null;
}
function progress(f){ const p=$('prog'); if(f>=1){ p.style.width='100%'; setTimeout(()=>{p.style.opacity=0;p.style.width='0';},350); }
  else { p.style.opacity=1; p.style.width=(f*100).toFixed(1)+'%'; } }

// ---- scene overlay (background + magnets) ----
const BG=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0b0d12';
const BGRGB=hex2rgb(BG.length>=7?BG:'#0b0d12');
const FADE=`rgba(${BGRGB.join(',')},0.09)`;   // trail-fade tint, stays in sync with --bg
function clearScene(){ ctx.fillStyle=BG; ctx.fillRect(0,0,W,H); }
function drawMagnets(){
  magnets.forEach((m,i)=>{ const x=sx(m.x),y=sy(m.y),c=cols[i];
    const g=ctx.createRadialGradient(x,y,1,x,y,26);
    g.addColorStop(0,`rgba(${c.join(',')},.55)`); g.addColorStop(1,`rgba(${c.join(',')},0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,26,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fillStyle=`rgb(${c.join(',')})`; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.font='bold 11px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.strokeText(i+1,x,y+15);
    ctx.fillStyle='#fff'; ctx.fillText(i+1,x,y+15);
  });
}
function drawScene(){ drawMagnets(); }

// ---- live bob simulation with fading trail ----
let live=null;
function startLive(x0,y0){
  mode='live'; clearScene(); drawScene();
  live={x:x0,y:y0,vx:0,vy:0,px:x0,py:y0,steps:0,done:false};
  setStatus('bob dropped'); requestAnimationFrame(liveTick);
}
function liveTick(){
  if(mode!=='live'||!live) return;
  // fade previous frame
  ctx.fillStyle=FADE; ctx.fillRect(0,0,W,H);
  const fr=P.fric,k=P.spr,st=P.str,h2=P.hgt*P.hgt;
  let {x,y,vx,vy}=live;
  for(let sub=0;sub<3&&!live.done;sub++){
    let ax=-k*x-fr*vx, ay=-k*y-fr*vy;
    for(let i=0;i<magnets.length;i++){ const dx=magnets[i].x-x,dy=magnets[i].y-y,d=Math.pow(dx*dx+dy*dy+h2,1.5);
      ax+=st*dx/d; ay+=st*dy/d; }
    vx+=ax*DT; vy+=ay*DT;
    const nx=x+vx*DT, ny=y+vy*DT;
    ctx.beginPath(); ctx.moveTo(sx(x),sy(y)); ctx.lineTo(sx(nx),sy(ny));
    const ni=nearest(nx,ny), c=cols[ni];
    ctx.strokeStyle=`rgb(${c.join(',')})`; ctx.lineWidth=2; ctx.stroke();
    x=nx;y=ny; live.steps++;
    if(vx*vx+vy*vy<3e-4 && insideCapture(x,y)>=0) live.done=true;
    if(live.steps>4000) live.done=true;
  }
  live.x=x;live.y=y;live.vx=vx;live.vy=vy;
  // bob
  ctx.beginPath(); ctx.arc(sx(x),sy(y),4,0,7); ctx.fillStyle='#fff'; ctx.fill();
  drawMagnets();
  // hud
  const ni=nearest(x,y), e=0.5*(vx*vx+vy*vy)+0.5*k*(x*x+y*y);
  $('h_e').textContent=e.toFixed(3);
  $('h_b').innerHTML=`<span class="swatch" style="background:rgb(${cols[ni].join(',')})"></span>#${ni+1}`;
  if(live.done){ setStatus('settled · '+live.steps+' steps'); mode='idle'; return; }
  requestAnimationFrame(liveTick);
}

// ---- magnet interaction ----
let drag=null, previewRAF=0;
const COARSE=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
const HITR=COARSE?24:15, HITR2=HITR*HITR;   // bigger grab target on touch (>=44px diameter)
function hitMagnet(px,py){ for(let i=0;i<magnets.length;i++){ const dx=sx(magnets[i].x)-px,dy=sy(magnets[i].y)-py;
  if(dx*dx+dy*dy<HITR2) return i; } return -1; }
function schedulePreview(){    // coalesce live morph to at most one render kick per frame
  if(previewRAF) return;
  previewRAF=requestAnimationFrame(()=>{ previewRAF=0; clearScene(); drawScene(); startRender(true); });
}
cv.addEventListener('pointerdown',e=>{
  const px=e.clientX,py=e.clientY, mi=hitMagnet(px,py);
  if(mi>=0){ drag=mi; cv.setPointerCapture(e.pointerId); mode='idle'; live=null; R=null;
    cv.style.cursor='grabbing'; setStatus('dragging magnet #'+(mi+1)); }
  else { startLive(toWx(px),toWy(py)); }
});
cv.addEventListener('pointermove',e=>{
  if(drag!==null){ magnets[drag].x=toWx(e.clientX); magnets[drag].y=toWy(e.clientY); schedulePreview(); return; }
  cv.style.cursor = hitMagnet(e.clientX,e.clientY)>=0 ? 'grab' : 'crosshair';   // affordance
});
cv.addEventListener('pointerup',e=>{
  if(drag!==null){ drag=null; if(previewRAF){cancelAnimationFrame(previewRAF);previewRAF=0;}
    cv.style.cursor=hitMagnet(e.clientX,e.clientY)>=0?'grab':'crosshair';
    saveHash(); startRender(false); }  // crisp re-render on release
});

// ---- controls ----
function bindSlider(id,vid,key,fmt){ const s=$(id),v=$(vid);
  const upd=()=>{ P[key]=parseFloat(s.value); v.textContent=fmt(P[key]); };
  s.addEventListener('input',()=>{ upd(); mode='idle'; live=null; clearScene(); drawScene(); startRender(true); });
  s.addEventListener('change',()=>{ saveHash(); startRender(false); });
  s.value=P[key]; upd();
}
function syncSliders(){ $('s_fric').value=P.fric; $('s_spr').value=P.spr; $('s_str').value=P.str; $('s_hgt').value=P.hgt;
  $('v_fric').textContent=P.fric.toFixed(2); $('v_spr').textContent=P.spr.toFixed(2);
  $('v_str').textContent=P.str.toFixed(2); $('v_hgt').textContent=P.hgt.toFixed(2); $('pal').value=P.pal; }
function setStatus(t){ $('h_s').textContent=t; }

$('b_reveal').onclick=()=>startRender(false);
$('b_png').onclick=savePNG;
$('b_clean').onclick=()=>document.body.classList.toggle('clean');
$('restore').onclick=()=>document.body.classList.remove('clean');
$('b_more').onclick=()=>{ if(magnets.length>=6)return; addMagnet(); recolor(); saveHash(); startRender(false); };
$('b_less').onclick=()=>{ if(magnets.length<=2)return; magnets.pop(); recolor(); saveHash(); startRender(false); };
$('pal').onchange=()=>{ P.pal=$('pal').value; recolor(); saveHash(); startRender(false); };
function addMagnet(){ const a=Math.random()*7, r=0.9+Math.random()*0.2; magnets.push({x:Math.cos(a)*r,y:Math.sin(a)*r}); }

document.addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='r'){startRender(false);} else if(k==='h'){document.body.classList.toggle('clean');}
  else if(k==='p'){savePNG();} });
function savePNG(){ const a=document.createElement('a'); a.download='waver-basins.png'; a.href=cv.toDataURL('image/png'); a.click(); }

// ---- URL hash state ----
function saveHash(){ const o={m:magnets.map(m=>[+m.x.toFixed(3),+m.y.toFixed(3)]),
    p:P.pal,f:+P.fric.toFixed(3),k:+P.spr.toFixed(3),s:+P.str.toFixed(2),h:+P.hgt.toFixed(2)};
  history.replaceState(null,'','#'+encodeURIComponent(JSON.stringify(o))); }
function loadHash(){ try{
    const o=JSON.parse(decodeURIComponent(location.hash.slice(1)));
    if(o.m&&o.m.length>=2){ magnets=o.m.map(a=>({x:a[0],y:a[1]})); }
    if(o.p&&PALETTES[o.p])P.pal=o.p;
    if(o.f)P.fric=o.f; if(o.k)P.spr=o.k; if(o.s)P.str=o.s; if(o.h)P.hgt=o.h;
    return true;
  }catch(_){ return false; } }
function defaults(){ magnets=[]; const n=P.n; for(let i=0;i<n;i++){ const a=-Math.PI/2+i*2*Math.PI/n;
  magnets.push({x:Math.cos(a),y:Math.sin(a)}); } }

// ---- init ----
if(!loadHash()) defaults();
bindSlider('s_fric','v_fric','fric',v=>v.toFixed(2));
bindSlider('s_spr','v_spr','spr',v=>v.toFixed(2));
bindSlider('s_str','v_str','str',v=>v.toFixed(2));
bindSlider('s_hgt','v_hgt','hgt',v=>v.toFixed(2));
syncSliders(); recolor();
let resizeT=0;
window.addEventListener('resize',()=>{   // debounce; always recover with a fresh full render
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    if(window.innerWidth===lastW && window.innerHeight===lastH) return;  // no real change
    live=null; mode='idle'; R=null;   // abort any in-flight render/live loop before reallocating
    resize(); startRender(false);
  },150);
});
resize();
saveHash();
startRender(false);   // reveal basins on first paint — the wow shot
</script>
</body>
</html>
