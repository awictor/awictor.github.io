<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easing — CSS cubic-bezier generator &amp; visualizer</title>
<meta name="description" content="Free offline CSS easing generator. Design cubic-bezier timing functions with a live curve, animated preview, and presets, then copy the CSS. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/easing/">
<style>
  :root{
    --c:#86198f; --bg:#fdf7fd; --fg:#22132a; --muted:#725a76;
    --card:#ffffff; --border:#efddef; --code:#f8ecf8; --grid:#e7d9e7;
  }
  [data-theme="dark"]{
    --bg:#170f19; --fg:#f1e5f2; --muted:#b394b6; --card:#221527;
    --border:#38243c; --code:#2c1a30; --grid:#3a2a3c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#d946ef);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  .curve{display:block;margin:0 auto;background:var(--code);border-radius:12px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .presets button{background:var(--code);border:1px solid var(--border);color:var(--fg);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.8rem}
  .presets button:hover{border-color:var(--c);color:var(--c)}
  .inputs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
  .inputs .fld label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:3px}
  .inputs input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;
    background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;font-size:.9rem}
  .inputs input:focus{outline:2px solid var(--c);border-color:var(--c)}
  .demo{display:flex;align-items:center;gap:12px;margin-top:18px}
  .track{flex:1;height:34px;background:var(--code);border-radius:99px;position:relative;overflow:hidden}
  .ball{position:absolute;top:5px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--c)}
  .play{background:var(--c);color:#fff;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
  .out-head{display:flex;align-items:center;margin-top:16px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  pre{background:var(--code);border-radius:12px;padding:14px 16px;margin:8px 0 0;overflow-x:auto;
    font-family:ui-monospace,monospace;font-size:.92rem}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('ease.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">⌒</div>
  <div>
    <h1>Easing</h1>
    <p class="sub">CSS cubic-bezier generator &amp; visualizer</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <svg class="curve" id="curve" width="280" height="280" viewBox="0 0 280 280"></svg>
    <div class="presets" id="presets">
      <button data-p="0,0,1,1">linear</button>
      <button data-p="0.25,0.1,0.25,1">ease</button>
      <button data-p="0.42,0,1,1">ease-in</button>
      <button data-p="0,0,0.58,1">ease-out</button>
      <button data-p="0.42,0,0.58,1">ease-in-out</button>
      <button data-p="0.68,-0.55,0.27,1.55">back</button>
    </div>
    <div class="inputs">
      <div class="fld"><label>P1 x</label><input id="p1x" value="0.25"></div>
      <div class="fld"><label>P1 y</label><input id="p1y" value="0.1"></div>
      <div class="fld"><label>P2 x</label><input id="p2x" value="0.25"></div>
      <div class="fld"><label>P2 y</label><input id="p2y" value="1"></div>
    </div>
    <div class="demo">
      <button class="play" id="play">▶ Preview</button>
      <div class="track"><div class="ball" id="ball"></div></div>
    </div>
    <div class="out-head">
      <label style="margin:0;font-weight:600;font-size:.85rem">CSS</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <pre id="css"></pre>
  </div>
</main>
<footer>
  Easing is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/easing">Source</a>
</footer>

<script>
// ---- pure functions ----
function bezier(p1x, p1y, p2x, p2y){
  var cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  var cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  function sx(t){ return ((ax * t + bx) * t + cx) * t; }
  function sy(t){ return ((ay * t + by) * t + cy) * t; }
  function dx(t){ return (3 * ax * t + 2 * bx) * t + cx; }
  function solveX(x){
    if(x <= 0) return 0;
    if(x >= 1) return 1;
    var t = x, i, xe, d;
    for(i = 0; i < 8; i++){
      xe = sx(t) - x;
      if(Math.abs(xe) < 1e-6) return t;
      d = dx(t);
      if(Math.abs(d) < 1e-6) break;
      t -= xe / d;
    }
    var lo = 0, hi = 1; t = x;
    while(lo < hi){
      xe = sx(t);
      if(Math.abs(xe - x) < 1e-6) return t;
      if(x > xe) lo = t; else hi = t;
      t = (lo + hi) / 2;
      if(hi - lo < 1e-7) break;
    }
    return t;
  }
  return function(x){ return sy(solveX(x)); };
}
function sample(fn, n){
  n = n || 20;
  var pts = [];
  for(var i = 0; i <= n; i++){ var x = i / n; pts.push({ x: x, y: fn(x) }); }
  return pts;
}
function trim(n){ return (Math.round(n * 1000) / 1000).toString(); }
function cssTimingFunction(p1x, p1y, p2x, p2y){
  return 'cubic-bezier(' + trim(p1x) + ', ' + trim(p1y) + ', ' + trim(p2x) + ', ' + trim(p2y) + ')';
}

if(typeof module !== 'undefined') module.exports = { bezier, sample, trim, cssTimingFunction };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var E = { p1x: document.getElementById('p1x'), p1y: document.getElementById('p1y'),
            p2x: document.getElementById('p2x'), p2y: document.getElementById('p2y') };
  var curve = document.getElementById('curve');
  var cssEl = document.getElementById('css');
  var ball = document.getElementById('ball');
  var PAD = 30, SZ = 220; // drawing area inside 280 viewBox

  function vals(){ return ['p1x','p1y','p2x','p2y'].map(function(k){ return Number(E[k].value) || 0; }); }
  function toSvg(x, y){ return [PAD + x * SZ, PAD + (1 - y) * SZ]; }
  function drawCurve(){
    var v = vals();
    var fn = bezier(v[0], v[1], v[2], v[3]);
    var pts = sample(fn, 40);
    var d = pts.map(function(p, i){ var c = toSvg(p.x, p.y); return (i ? 'L' : 'M') + c[0].toFixed(1) + ' ' + c[1].toFixed(1); }).join(' ');
    var h1 = toSvg(v[0], v[1]), h2 = toSvg(v[2], v[3]), o = toSvg(0, 0), e = toSvg(1, 1);
    curve.innerHTML =
      '<line x1="'+o[0]+'" y1="'+o[1]+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--grid)" stroke-dasharray="4 4"/>' +
      '<line x1="'+o[0]+'" y1="'+o[1]+'" x2="'+h1[0]+'" y2="'+h1[1]+'" stroke="var(--c)" stroke-opacity=".4"/>' +
      '<line x1="'+e[0]+'" y1="'+e[1]+'" x2="'+h2[0]+'" y2="'+h2[1]+'" stroke="var(--c)" stroke-opacity=".4"/>' +
      '<path d="'+d+'" fill="none" stroke="var(--c)" stroke-width="2.5"/>' +
      '<circle cx="'+h1[0]+'" cy="'+h1[1]+'" r="5" fill="var(--c)"/>' +
      '<circle cx="'+h2[0]+'" cy="'+h2[1]+'" r="5" fill="var(--c)"/>';
    cssEl.textContent = 'transition-timing-function: ' + cssTimingFunction(v[0], v[1], v[2], v[3]) + ';';
    try{ localStorage.setItem('ease.v', JSON.stringify(v)); }catch(e){}
  }
  Object.keys(E).forEach(function(k){ E[k].addEventListener('input', drawCurve); });
  document.getElementById('presets').addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('button') : null;
    if(!b) return;
    var p = b.getAttribute('data-p').split(',');
    ['p1x','p1y','p2x','p2y'].forEach(function(k, i){ E[k].value = p[i]; });
    drawCurve();
  });
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(cssEl.textContent);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  document.getElementById('play').addEventListener('click', function(){
    var v = vals();
    ball.style.transition = 'none'; ball.style.left = '4px';
    void ball.offsetWidth;
    ball.style.transition = 'left 1s ' + cssTimingFunction(v[0], v[1], v[2], v[3]);
    ball.style.left = 'calc(100% - 28px)';
  });
  try{ var sv = JSON.parse(localStorage.getItem('ease.v'));
    if(sv && sv.length === 4){ ['p1x','p1y','p2x','p2y'].forEach(function(k,i){ E[k].value = sv[i]; }); } }catch(e){}
  drawCurve();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('ease.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('ease.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
