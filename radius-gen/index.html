<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadiusGen — CSS border-radius generator</title>
<meta name="description" content="Free offline CSS border-radius generator. Round each corner independently in px or %, with a live preview and presets, then copy the CSS. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/radius-gen/">
<style>
  :root{
    --c:#2e1065; --bg:#faf8fd; --fg:#1b1030; --muted:#655880;
    --card:#ffffff; --border:#e8e0f2; --code:#f1eafa; --stage:#f1f0f6;
  }
  [data-theme="dark"]{
    --bg:#120b1e; --fg:#ebe5f5; --muted:#9a90b6; --card:#1b142c;
    --border:#2e2646; --code:#241d3a; --stage:#0c0a15;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{max-width:760px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#7c3aed);display:grid;place-items:center;color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);
    border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:18px}
  .stage{background:var(--stage);border-radius:14px;height:200px;display:grid;place-items:center;margin-bottom:20px}
  .box{width:150px;height:150px;background:linear-gradient(135deg,var(--c),#a855f7)}
  .row{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .unit{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .unit button{background:var(--bg);border:none;color:var(--fg);padding:7px 14px;cursor:pointer;font-size:.85rem;border-right:1px solid var(--border)}
  .unit button:last-child{border-right:none}
  .unit button.on{background:var(--c);color:#fff}
  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .presets button{background:var(--code);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.8rem}
  .presets button:hover{border-color:var(--c);color:var(--c)}
  .corners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sl label{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:3px}
  .sl label b{color:var(--fg);font-family:ui-monospace,monospace}
  .sl input[type=range]{width:100%;accent-color:var(--c)}
  .out-head{display:flex;align-items:center;margin-top:16px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  pre{background:var(--code);border-radius:12px;padding:14px 16px;margin:8px 0 0;overflow-x:auto;
    font-family:ui-monospace,monospace;font-size:.9rem;white-space:pre-wrap;word-break:break-all}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('rad.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">⬭</div>
  <div>
    <h1>RadiusGen</h1>
    <p class="sub">CSS border-radius generator</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <div class="stage"><div class="box" id="box"></div></div>
    <div class="row">
      <div class="unit" id="unit"><button data-u="px" class="on">px</button><button data-u="%">%</button></div>
      <div class="presets" id="presets">
        <button data-p="0">Sharp</button>
        <button data-p="12">Rounded</button>
        <button data-p="9999">Pill</button>
        <button data-p="circle">Circle</button>
      </div>
    </div>
    <div class="corners" id="corners"></div>
    <div class="out-head">
      <label style="margin:0;font-weight:600;font-size:.85rem">CSS</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <pre id="css"></pre>
  </div>
</main>
<footer>
  RadiusGen is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/radius-gen">Source</a>
</footer>

<script>
// ---- pure functions ----
function buildRadius(corners, unit){
  unit = unit || 'px';
  var v = ['tl', 'tr', 'br', 'bl'].map(function(k){ var n = Number(corners[k]); return isFinite(n) ? n : 0; });
  if(v[0] === v[1] && v[1] === v[2] && v[2] === v[3]) return v[0] + unit;
  return v.map(function(n){ return n + unit; }).join(' ');
}
function withProperty(css){ return 'border-radius: ' + css + ';'; }

if(typeof module !== 'undefined') module.exports = { buildRadius, withProperty };

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var CORNERS = [['tl','Top-left'],['tr','Top-right'],['br','Bottom-right'],['bl','Bottom-left']];
  var state = { tl: 20, tr: 20, br: 20, bl: 20 };
  var unit = 'px';
  var cornersEl = document.getElementById('corners');
  var boxEl = document.getElementById('box');
  var cssEl = document.getElementById('css');

  function max(){ return unit === '%' ? 50 : 150; }
  function renderCorners(){
    cornersEl.innerHTML = CORNERS.map(function(c){
      return '<div class="sl"><label>' + c[1] + ' <b><span data-v="' + c[0] + '">' + state[c[0]] + '</span>' + unit + '</b></label>' +
        '<input type="range" data-k="' + c[0] + '" min="0" max="' + max() + '" value="' + Math.min(state[c[0]], max()) + '"></div>';
    }).join('');
  }
  function render(){
    var css = buildRadius(state, unit);
    boxEl.style.borderRadius = css;
    cssEl.textContent = withProperty(css);
    try{ localStorage.setItem('rad.state', JSON.stringify(state)); localStorage.setItem('rad.unit', unit); }catch(e){}
  }
  cornersEl.addEventListener('input', function(e){
    var t = e.target, k = t.getAttribute('data-k');
    if(!k) return;
    state[k] = Number(t.value);
    var span = cornersEl.querySelector('[data-v="' + k + '"]'); if(span) span.textContent = t.value;
    render();
  });
  document.getElementById('unit').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    unit = b.getAttribute('data-u');
    [].forEach.call(this.querySelectorAll('button'), function(x){ x.className = (x === b) ? 'on' : ''; });
    CORNERS.forEach(function(c){ state[c[0]] = Math.min(state[c[0]], max()); });
    renderCorners(); render();
  });
  document.getElementById('presets').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    var p = b.getAttribute('data-p');
    if(p === 'circle'){ unit = '%'; [].forEach.call(document.getElementById('unit').querySelectorAll('button'), function(x){ x.className = x.getAttribute('data-u') === '%' ? 'on' : ''; });
      state = { tl: 50, tr: 50, br: 50, bl: 50 }; }
    else { var n = Math.min(Number(p), max()); state = { tl: n, tr: n, br: n, bl: n }; }
    renderCorners(); render();
  });
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(cssEl.textContent);
    this.textContent = 'Copied'; var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var ss = JSON.parse(localStorage.getItem('rad.state')); if(ss) state = ss;
    var su = localStorage.getItem('rad.unit');
    if(su){ unit = su; [].forEach.call(document.getElementById('unit').querySelectorAll('button'), function(x){ x.className = x.getAttribute('data-u') === su ? 'on' : ''; }); }
  }catch(e){}
  renderCorners();
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('rad.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('rad.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
