<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HTMLEntities — HTML Entity Encoder / Decoder</title>
<meta name="description" content="Escape text to HTML entities and decode named, numeric, and hex entities back. 100% offline — nothing is sent anywhere. No signup." />
<meta name="theme-color" content="#831843" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="HTMLEntities — HTML Entity Encoder / Decoder" />
<meta property="og:description" content="Escape and unescape HTML entities (named, numeric, hex). Offline." />
<meta property="og:url" content="https://awictor.github.io/html-entities/" />
<link rel="canonical" href="https://awictor.github.io/html-entities/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23831843'/%3E%3Ctext x='32' y='42' font-size='24' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3E%26%23%3B%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fbf1f5; --ink:#2a0f1c; --accent:#831843; --accent-d:#6b1338;
    --card:#fff; --line:#f0d9e2; --muted:#7c5262; --field:#fff;
    --shadow:0 1px 2px rgba(42,15,28,.05),0 8px 24px rgba(42,15,28,.07); }
  [data-theme="dark"]{ --bg:#160810; --ink:#f5e8ee; --accent:#f472b6; --accent-d:#f9a8d4;
    --card:#20111a; --line:#341f29; --muted:#a9869a; --field:#160810;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:600px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
  .card h2 .copy{cursor:pointer;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600}
  textarea{width:100%;min-height:120px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink);resize:vertical;line-height:1.6}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(131,24,67,.15)}
  #msg{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("htmlent.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">HTML</span>Entities</h1>
  <p>Escape text to HTML entities and decode them back. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Text <span class="copy" data-t="text">copy</span></h2>
    <textarea id="text" spellcheck="false" placeholder="Plain text…"><a href="x">Tom &amp; Jerry</a></textarea>
  </section>
  <section class="card">
    <h2>HTML-encoded <span class="copy" data-t="enc">copy</span></h2>
    <textarea id="enc" spellcheck="false" placeholder="…or paste encoded HTML"></textarea>
  </section>
  <div id="msg"></div>
</div>

<footer>
  <b>HTMLEntities</b> · offline HTML entity encoder/decoder · <a href="https://github.com/awictor/html-entities">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Decodes named, numeric (&amp;#65;), and hex (&amp;#x41;) entities. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const NAMED={amp:"&",lt:"<",gt:">",quot:'"',apos:"'",nbsp:" ",copy:"©",reg:"®",trade:"™",hellip:"…",mdash:"—",ndash:"–"};

// --- Pure encode/decode ---
function encodeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function decodeHtml(s){
  return String(s).replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);/g,(m,e)=>{
    if(e[0]==="#"){
      const code = (e[1]==="x"||e[1]==="X") ? parseInt(e.slice(2),16) : parseInt(e.slice(1),10);
      if(isNaN(code)||code<0||code>0x10FFFF) return m;
      try{ return String.fromCodePoint(code); }catch(_){ return m; }
    }
    const v=NAMED[e]!=null?NAMED[e]:NAMED[e.toLowerCase()];
    return v!=null?v:m;
  });
}

// --- UI ---
let lock=false;
function fromText(){ if(lock)return; lock=true; $("enc").value=encodeHtml($("text").value); lock=false; persist(); }
function fromEnc(){ if(lock)return; lock=true; $("text").value=decodeHtml($("enc").value); lock=false; persist(); }
function persist(){ try{localStorage.setItem("htmlent.text",$("text").value);}catch(e){} }
$("text").addEventListener("input",fromText);
$("enc").addEventListener("input",fromEnc);
document.querySelectorAll(".copy").forEach(c=>c.onclick=()=>{const v=$(c.dataset.t).value;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1200);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();});
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("htmlent.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const tx=localStorage.getItem("htmlent.text");if(tx!=null)$("text").value=tx;}catch(e){}
fromText();

if(typeof module!=="undefined") module.exports={encodeHtml,decodeHtml};
</script>
</body>
</html>
