<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deburr — Remove Accents & Fold to ASCII</title>
<meta name="description" content="Strip accents and diacritics from text and fold special letters to plain ASCII (café → cafe, Straße → Strasse). Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('deburr-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#db2777;
    --bg:#f8f5f7; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#ece2e7; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#160f13; --card:#20171c; --fg:#f2eaef; --muted:#a5969f; --line:#33282f; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#9d174d);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1rem;min-height:110px;resize:vertical}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
  .modes button{padding:8px 14px;border:0;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit}
  .modes button.on{background:var(--c);color:#fff;font-weight:700}
  .btns{display:flex;gap:10px;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">é→e</div>
    <div><h1>Deburr</h1><div class="sub">Strip accents &amp; fold text to plain ASCII</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="input">Input</label>
    <textarea id="input" spellcheck="false">Crème brûlée at a café in Zürich — naïve résumé, Straße, Œuvre, Øystein.</textarea>
    <div class="modes" id="modes">
      <button type="button" data-m="ascii">Full ASCII fold</button>
      <button type="button" data-m="diacritics">Diacritics only</button>
    </div>
    <label for="output" style="margin-top:6px">Output</label>
    <textarea id="output" readonly></textarea>
    <div class="btns"><button class="act" id="copy" type="button">Copy output</button></div>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/deburr">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  // letters NFD can't decompose on its own
  const SPECIALS = {
    'ß': 'ss', 'æ': 'ae', 'Æ': 'AE', 'œ': 'oe', 'Œ': 'OE',
    'ø': 'o', 'Ø': 'O', 'ł': 'l', 'Ł': 'L', 'đ': 'd', 'Đ': 'D',
    'þ': 'th', 'Þ': 'Th', 'ð': 'd', 'Ð': 'D', 'ı': 'i'
  };

  function removeDiacritics(text){
    return String(text).normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function toAscii(text){
    let s = String(text);
    for(const [k, v] of Object.entries(SPECIALS)) s = s.split(k).join(v);
    return removeDiacritics(s);
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('output')){
    const $ = id => document.getElementById(id);
    let mode = 'ascii';

    function render(){
      $('output').value = mode === 'ascii' ? toAscii($('input').value) : removeDiacritics($('input').value);
    }

    $('modes').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      mode = b.dataset.m;
      [...$('modes').children].forEach(x => x.classList.toggle('on', x === b));
      render();
    });
    $('modes').querySelector('[data-m="ascii"]').classList.add('on');
    $('input').addEventListener('input', render);
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('output').value); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy output', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('deburr-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { SPECIALS, removeDiacritics, toAscii };
</script>
</body>
</html>
