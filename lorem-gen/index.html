<!DOCTYPE html>
<html lang="en">

<style>
  :root{ --bg:#fbf2f4; --ink:#2a1017; --accent:#9f1239; --accent-d:#881337;
    --card:#fff; --line:#f0dbe1; --muted:#7c5560; --field:#fff;
    --shadow:0 1px 2px rgba(42,16,23,.05),0 8px 24px rgba(42,16,23,.07); }
  [data-theme="dark"]{ --bg:#160910; --ink:#f5e9ec; --accent:#fb7185; --accent-d:#fda4af;
    --card:#20111a; --line:#341f28; --muted:#a9868f; --field:#160910;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:4px}
  .segbtn{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .segbtn.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
  input[type=number]{width:70px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font-size:15px;text-align:right}
  label.chk{display:flex;align-items:center;gap:7px;font-size:14px}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #out{width:100%;min-height:220px;margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;font-size:15px;background:var(--bg);color:var(--ink);resize:vertical;line-height:1.65;font-family:inherit}
  #msg{font-size:12px;color:var(--muted);margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("lorem.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Lorem</span>Gen</h1>
  <p>Generate Lorem Ipsum placeholder text — words, sentences, or paragraphs. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="controls">
      <div class="seg" id="unitSeg">
        <button class="segbtn on" data-u="paragraphs">Paragraphs</button>
        <button class="segbtn" data-u="sentences">Sentences</button>
        <button class="segbtn" data-u="words">Words</button>
      </div>
      <input type="number" id="count" min="1" max="200" value="3">
      <label class="chk"><input type="checkbox" id="classic" checked> Start with “Lorem ipsum…”</label>
      <button class="btn primary" id="genBtn">Generate</button>
      <button class="btn" id="copyBtn">Copy</button>
    </div>
    <textarea id="out" spellcheck="false" readonly></textarea>
    <div id="msg"></div>
  </section>
</div>

<footer>
  <b>LoremGen</b> · offline Lorem Ipsum generator · <a href="https://github.com/awictor/lorem-gen">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const BANK="lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum".split(" ");
const CLASSIC="lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor".split(" ");
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);

// --- Pure generator (rng injectable for determinism) ---
function words(count,classic,rng){
  rng=rng||Math.random; const out=[];
  for(let i=0;i<count;i++){ out.push((classic&&i<CLASSIC.length)?CLASSIC[i]:BANK[Math.floor(rng()*BANK.length)]); }
  return out;
}
function sentence(classic,rng){
  rng=rng||Math.random;
  const n=6+Math.floor(rng()*9); // 6–14 words
  const w=words(n,classic,rng); w[0]=cap(w[0]);
  return w.join(" ")+".";
}
function paragraph(classic,rng){
  rng=rng||Math.random;
  const n=3+Math.floor(rng()*4); // 3–6 sentences
  const s=[]; for(let i=0;i<n;i++) s.push(sentence(classic&&i===0,rng));
  return s.join(" ");
}
function generate(opts,rng){
  opts=opts||{}; rng=rng||Math.random;
  const count=Math.max(1,opts.count||1), classic=!!opts.classic;
  if(opts.units==="words"){ const w=words(count,classic,rng); w[0]=cap(w[0]); return w.join(" ")+"."; }
  if(opts.units==="sentences"){ const s=[]; for(let i=0;i<count;i++) s.push(sentence(classic&&i===0,rng)); return s.join(" "); }
  const p=[]; for(let i=0;i<count;i++) p.push(paragraph(classic&&i===0,rng));
  return p.join("\n\n");
}

// --- UI ---
let UNIT="paragraphs";
function run(){
  const count=Math.max(1,Math.min(200,parseInt($("count").value)||3));
  const text=generate({units:UNIT,count,classic:$("classic").checked});
  $("out").value=text;
  try{localStorage.setItem("lorem.unit",UNIT);localStorage.setItem("lorem.count",count);localStorage.setItem("lorem.classic",$("classic").checked?"1":"0");}catch(e){}
}
$("unitSeg").querySelectorAll(".segbtn").forEach(b=>b.onclick=()=>{UNIT=b.dataset.u;$("unitSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x===b));run();});
$("genBtn").onclick=run;
$("copyBtn").onclick=()=>{const v=$("out").value;if(!v)return;const done=()=>{$("msg").textContent="✓ Copied";setTimeout(()=>$("msg").textContent="",1300);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,done);else done();};
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("lorem.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{const u=localStorage.getItem("lorem.unit");if(u){UNIT=u;$("unitSeg").querySelectorAll(".segbtn").forEach(x=>x.classList.toggle("on",x.dataset.u===u));}const c=localStorage.getItem("lorem.count");if(c)$("count").value=c;const cl=localStorage.getItem("lorem.classic");if(cl!=null)$("classic").checked=cl==="1";}catch(e){}
run();

if(typeof module!=="undefined") module.exports={words,sentence,paragraph,generate,BANK,CLASSIC};
</script>
</body>
</html>
