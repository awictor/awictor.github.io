<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malleus — modal percussion</title>
<style>
  :root{
    --bg:#161311; --panel:#1e1a17; --panel2:#241f1b; --line:#332b25;
    --ink:#eadfd4; --dim:#a2938a; --hot:#e08a3c; --hot2:#f2b56b; --cool:#6fb0c9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 70% -10%,#2a231d,#161311 60%);
    color:var(--ink); font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  #app{max-width:1080px; margin:0 auto; padding:14px 16px; height:100%; display:flex; flex-direction:column; gap:10px}
  header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  h1{margin:0; font-size:22px; letter-spacing:.5px; font-weight:700}
  h1 b{color:var(--hot)}
  .tag{color:var(--dim); font-size:12.5px; flex:1; min-width:200px}
  .mats{display:flex; gap:6px; flex-wrap:wrap}
  .mat{background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:20px;
       padding:5px 12px; cursor:pointer; font-size:12.5px; transition:.12s}
  .mat:hover{color:var(--ink); border-color:var(--hot)}
  .mat.on{background:linear-gradient(180deg,var(--hot),#c1701f); color:#1a1410; border-color:var(--hot2); font-weight:600}
  #forge{background:var(--panel2); color:var(--hot2); border:1px dashed var(--hot); border-radius:20px; padding:5px 12px; cursor:pointer; font-size:12.5px}
  #forge:hover{background:#2c241d}
  .stage{display:grid; grid-template-columns:1.15fr 1fr; gap:10px; flex:1; min-height:0}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; min-height:0}
  .card h2{margin:0 0 6px; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim); font-weight:600}
  canvas{width:100%; flex:1; min-height:0; border-radius:8px; display:block; touch-action:none}
  #pad{cursor:crosshair; background:#120f0d}
  #spec{background:#120f0d}
  .controls{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 16px}
  .ctl{display:flex; flex-direction:column; gap:3px}
  .ctl label{font-size:11px; color:var(--dim); display:flex; justify-content:space-between}
  .ctl label b{color:var(--hot2); font-weight:600}
  input[type=range]{-webkit-appearance:none; appearance:none; height:5px; border-radius:5px;
    background:linear-gradient(90deg,var(--hot) var(--p,40%),#3a322b var(--p,40%)); outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--hot2); border:2px solid #1a1410; cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--hot2);border:2px solid #1a1410;cursor:pointer}
  input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:#3a322b}
  input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--hot)}
  select{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 5px; font-size:12px}
  .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .btn{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:12.5px}
  .btn:hover{border-color:var(--hot)}
  .btn.on{background:var(--hot); color:#1a1410; border-color:var(--hot2); font-weight:600}
  .btn.rec.on{background:#d0453a; border-color:#f07a6f}
  .btn[disabled]{opacity:.4; cursor:not-allowed; pointer-events:none}
  footer{display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--dim); font-size:11.5px}
  #hint{color:var(--hot2)}
  a{color:var(--cool)}
  @media (max-width:720px){
    html,body{height:auto}
    body{overflow:auto}
    #app{height:auto; min-height:100%; padding:12px}
    .stage{grid-template-columns:1fr}
    #pad{min-height:52vw}
    #spec{min-height:34vw}
    .controls{grid-template-columns:repeat(2,1fr)}
    .ctl.morphctl{grid-column:1 / -1}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><b>Malleus</b></h1>
    <div class="tag">Strike physically-modeled resonators — drag the pad: <b style="color:var(--hot2)">X = pitch</b>, <b style="color:var(--hot2)">Y = where you strike</b>. Watch the modes ring and die in the spectrum.</div>
  </header>

  <div class="mats" id="mats"></div>

  <div class="stage">
    <div class="card">
      <h2>Strike Pad — edge (top) → center (bottom)</h2>
      <canvas id="pad" role="application" aria-label="Strike pad. Drag to play: horizontal sets pitch, vertical sets where you strike the resonator."></canvas>
    </div>
    <div class="card">
      <h2>Live Modal Spectrum (log frequency)</h2>
      <canvas id="spec" role="img" aria-label="Live log-frequency spectrum of the ringing partials."></canvas>
    </div>
  </div>

  <div class="card" style="flex:0 0 auto">
    <div class="controls">
      <div class="ctl"><label for="hard">Mallet hardness <b id="vHard"></b></label><input id="hard" type="range" min="0" max="1" step="0.01"></div>
      <div class="ctl"><label for="inh">Inharmonicity <b id="vInh"></b></label><input id="inh" type="range" min="0" max="1" step="0.01"></div>
      <div class="ctl"><label for="damp">Damping <b id="vDamp"></b></label><input id="damp" type="range" min="0" max="1" step="0.01"></div>
      <div class="ctl"><label for="dec">Sustain / ring <b id="vDec"></b></label><input id="dec" type="range" min="0.3" max="2" step="0.01"></div>
      <div class="ctl"><label for="wet">Reverb (space) <b id="vWet"></b></label><input id="wet" type="range" min="0" max="1" step="0.01"></div>
      <div class="ctl morphctl">
        <label for="morph">Morph → <b id="vMorph"></b></label>
        <div class="row"><input id="morph" type="range" min="0" max="1" step="0.01" style="flex:1"><select id="matB" aria-label="Morph target material"></select></div>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn rec" id="rec" aria-label="Record">● Record</button>
      <button class="btn" id="play" aria-label="Loop playback">▶ Loop</button>
      <button class="btn" id="clr" aria-label="Clear recording">Clear</button>
      <span id="seqinfo" style="color:var(--dim);font-size:12px" role="status" aria-live="polite"></span>
      <span style="flex:1"></span>
      <button class="btn" id="share" aria-label="Copy shareable link">🔗 Copy shareable link</button>
    </div>
  </div>

  <footer>
    <span id="hint">Click or drag the pad to play. Keyboard: A S D F G H J K L (pitch).</span>
    <span id="copied"></span>
  </footer>
</div>

<script>
"use strict";
/* ---------- Material modal data: [ratio, amplitude, decay(seconds)] ---------- */
const PRESETS = {
  "Bronze Bell":[[0.5,0.6,7],[1,1,6],[1.19,0.55,3.5],[1.5,0.5,3],[2,0.7,4],[2.55,0.35,1.8],[2.66,0.3,1.6],[3,0.4,1.5],[3.76,0.2,1],[4.07,0.18,0.9]],
  "Rosewood Marimba":[[1,1,0.7],[2.756,0.35,0.28],[5.404,0.12,0.14],[8.933,0.05,0.08]],
  "Wine Glass":[[1,1,5],[2.32,0.22,3],[4.25,0.1,2],[6.63,0.05,1.2]],
  "Tuned Drumhead":[[1,1,1.2],[1.593,0.6,0.9],[2.136,0.4,0.7],[2.296,0.35,0.6],[2.653,0.25,0.5],[2.918,0.18,0.4],[3.156,0.12,0.3],[3.5,0.08,0.25]],
  "Tubular Chime":[[1,0.5,4],[2.76,1,5],[5.4,0.6,3],[8.93,0.4,2],[13.34,0.2,1.2],[18.6,0.1,0.8]],
  "Steel Tongue":[[1,1,3],[2.4,0.4,1.6],[3.9,0.25,1],[5.1,0.15,0.7],[6.8,0.08,0.5]]
};
const asParts = a => a.map(p=>({r:p[0],a:p[1],d:p[2]}));
const MATS = Object.keys(PRESETS);
const SCALE=[0,3,5,7,10], OCT=3, BASE=45; // minor pentatonic, 3 octaves
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const CAP=10; // voice polyphony cap

const P={mat:"Bronze Bell",matB:"Wine Glass",morph:0,hard:0.62,inh:0.15,damp:0.2,dec:1,wet:0.38,forge:null};
const seq={events:[],playing:false,recording:false,recStart:0,base:0,dur:0,idx:0,last:0};

/* ---------- Audio ---------- */
let AC,master,bus,analyser,freqData,conv,wetG,dryG,delay;
const voices=[];

function makeIR(dur,decay){
  const sr=AC.sampleRate, len=Math.floor(sr*dur), b=AC.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);
    for(let i=0;i<len;i++){const t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(0.5+0.5*Math.pow(1-t,1.5));}}
  return b;
}
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
  bus=AC.createGain(); bus.gain.value=0.9;
  analyser=AC.createAnalyser(); analyser.fftSize=4096; analyser.smoothingTimeConstant=0.55;
  freqData=new Float32Array(analyser.frequencyBinCount);
  bus.connect(analyser);
  dryG=AC.createGain(); dryG.gain.value=1; bus.connect(dryG); dryG.connect(master);
  conv=AC.createConvolver(); conv.buffer=makeIR(2.8,3); wetG=AC.createGain();
  bus.connect(conv); conv.connect(wetG); wetG.connect(master);
  delay=AC.createDelay(1); delay.delayTime.value=0.19;
  const fb=AC.createGain(); fb.gain.value=0.34;
  bus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wetG); // feedback 'bloom' into wet
  wetG.gain.value=P.wet;
}
function resume(){ initAudio(); if(AC.state==="suspended") AC.resume(); }

function currentPartials(){
  if(P.forge) return P.forge;
  const A=asParts(PRESETS[P.mat]), B=asParts(PRESETS[P.matB]), m=P.morph, n=Math.max(A.length,B.length), out=[];
  for(let i=0;i<n;i++){
    const a=A[i]||{r:B[i].r,a:0,d:B[i].d}, b=B[i]||{r:A[i].r,a:0,d:A[i].d};
    out.push({r:a.r+(b.r-a.r)*m, a:a.a+(b.a-a.a)*m, d:a.d+(b.d-a.d)*m});
  }
  return out;
}
function midiFromX(x){
  const idx=Math.min(SCALE.length*OCT-1,Math.floor(x*SCALE.length*OCT));
  return BASE+Math.floor(idx/SCALE.length)*12+SCALE[idx%SCALE.length];
}
const freqFromMidi=m=>440*Math.pow(2,(m-69)/12);

function strike(x,yNorm,hard){
  resume();
  if(!Number.isFinite(x)||!Number.isFinite(yNorm)||!Number.isFinite(hard))return;
  const midi=midiFromX(x), f0=freqFromMidi(midi);
  if(!Number.isFinite(f0)||f0<=0)return;
  const pos=0.02+Math.max(0,Math.min(1,yNorm))*0.46;   // edge(0.02) → center(0.5)
  const parts=currentPartials(), now=AC.currentTime;
  const dampMul=1-0.82*P.damp;

  // steal oldest voice if at cap
  while(voices.length>=CAP){
    const v=voices.shift();
    try{ v.g.gain.cancelScheduledValues(now); v.g.gain.setValueAtTime(v.g.gain.value,now);
         v.g.gain.linearRampToValueAtTime(0,now+0.04); v.oscs.forEach(o=>o.stop(now+0.06)); }catch(e){}
  }

  const vsum=AC.createGain(); vsum.gain.setValueAtTime(1,now); vsum.connect(bus);
  const oscs=[]; let end=now;
  parts.forEach((p,i)=>{
    let w=Math.abs(Math.sin((i+1)*Math.PI*pos));      // mallet re-weights each mode by its shape
    w*=Math.exp(-i*(1-hard)*0.95);                     // hardness shapes excitation spectrum
    w*=p.a*0.22;
    if(w<0.0006) return;
    const f=f0*p.r*(1+P.inh*0.06*i);                   // global inharmonic stretch
    if(!Number.isFinite(f)||f>=AC.sampleRate*0.48||f<20) return;
    const o=AC.createOscillator(); o.type="sine"; o.frequency.value=f;
    const g=AC.createGain();
    const atk=0.0012+(1-hard)*0.02;                    // soft = slower attack
    const dec=Math.max(0.05,p.d*P.dec*dampMul);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.linearRampToValueAtTime(w,now+atk);
    g.gain.exponentialRampToValueAtTime(0.0006,now+atk+dec);
    o.connect(g); g.connect(vsum); o.start(now); o.stop(now+atk+dec+0.05);
    oscs.push(o); end=Math.max(end,now+atk+dec+0.05);
  });

  // sympathetic coupling: nudge ringing voices whose fundamental is near-harmonic
  voices.forEach(v=>{
    const r=f0/v.f0, nr=Math.round(r), diff=Math.abs(r-nr);
    if(nr>=1&&diff<0.05){
      const amt=0.16*(1-diff/0.05), t=now;
      try{ v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(1,t);
           v.g.gain.linearRampToValueAtTime(1+amt,t+0.02); v.g.gain.linearRampToValueAtTime(1,t+0.3);}catch(e){}
    }
  });

  voices.push({g:vsum,f0,end,oscs});
  ui.lastMidi=midi; ui.flash={x,y:yNorm,t:performance.now()};
  if(seq.recording) seq.events.push({t:+(AC.currentTime-seq.recStart).toFixed(3),x:+x.toFixed(3),y:+yNorm.toFixed(3),h:+hard.toFixed(2)});
}

/* ---------- Forge: generate a stable new inharmonic partial set ---------- */
function forge(){
  const n=5+Math.floor(Math.random()*5), out=[{r:1,a:1,d:2+Math.random()*4}]; let r=1;
  for(let i=1;i<n;i++){
    r+=0.7+Math.random()*2.6+i*0.15;                   // increasing, inharmonic
    out.push({r:+r.toFixed(3), a:+(0.9*Math.pow(0.72,i)+Math.random()*0.1).toFixed(3), d:+(out[0].d*Math.pow(0.7,i)+0.1).toFixed(3)});
  }
  P.forge=out; syncMats(); writeHash();
}

/* ---------- Canvas rendering ---------- */
const pad=document.getElementById("pad"), pctx=pad.getContext("2d");
const spec=document.getElementById("spec"), sctx=spec.getContext("2d");
const ui={lastMidi:null,flash:null,px:0.5,py:0.3,down:false};
function fit(cv){const d=window.devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;cv.getContext("2d").setTransform(d,0,0,d,0,0);return r;}
function resize(){fit(pad);fit(spec);} window.addEventListener("resize",resize);

function drawPad(){
  const w=pad.clientWidth,h=pad.clientHeight; pctx.clearRect(0,0,w,h);
  pctx.fillStyle="#120f0d"; pctx.fillRect(0,0,w,h);
  const cols=SCALE.length*OCT;
  for(let i=0;i<=cols;i++){const gx=i/cols*w; pctx.strokeStyle=i%SCALE.length===0?"#3a2f26":"#241d18"; pctx.beginPath();pctx.moveTo(gx,0);pctx.lineTo(gx,h);pctx.stroke();}
  pctx.fillStyle="#5c4d41"; pctx.font="10px system-ui"; pctx.textAlign="left";
  pctx.fillText("EDGE — all modes ring (bright)",6,14);
  pctx.fillText("CENTER — nodes damp modes (dark)",6,h-8);
  // playing cursor + node visualization based on strike position
  const pos=0.02+ui.py*0.46;
  pctx.strokeStyle="rgba(224,138,60,.28)";
  for(let n=1;n<=5;n++){ // antinode markers for current strike shape
    const amp=Math.abs(Math.sin(n*Math.PI*pos));
    pctx.globalAlpha=0.15+0.5*amp; pctx.beginPath();
    const yy=ui.py*h; pctx.arc(ui.px*w,yy,4+n*2.5,0,7); pctx.stroke();
  }
  pctx.globalAlpha=1;
  // flash on strike
  if(ui.flash){const age=(performance.now()-ui.flash.t)/420;
    if(age<1){pctx.fillStyle=`rgba(242,181,107,${0.6*(1-age)})`;pctx.beginPath();pctx.arc(ui.flash.x*w,ui.flash.y*h,6+age*40,0,7);pctx.fill();}}
  // crosshair
  pctx.strokeStyle="#e08a3c";pctx.lineWidth=1.5;
  pctx.beginPath();pctx.moveTo(ui.px*w,0);pctx.lineTo(ui.px*w,h);pctx.moveTo(0,ui.py*h);pctx.lineTo(w,ui.py*h);pctx.stroke();pctx.lineWidth=1;
  pctx.fillStyle="#f2b56b";pctx.font="12px system-ui";pctx.textAlign="right";
  const m=midiFromX(ui.px); pctx.fillText(NAMES[m%12]+(Math.floor(m/12)-1),w-6,h-8);
}
function drawSpec(){
  if(!analyser) return;
  analyser.getFloatFrequencyData(freqData);
  const w=spec.clientWidth,h=spec.clientHeight,ny=AC.sampleRate/2,minF=40,bins=freqData.length;
  sctx.clearRect(0,0,w,h); sctx.fillStyle="#120f0d"; sctx.fillRect(0,0,w,h);
  // octave gridlines
  sctx.fillStyle="#5c4d41";sctx.font="9px system-ui";sctx.textAlign="center";
  for(let f=50;f<ny;f*=2){const gx=Math.log(f/minF)/Math.log(ny/minF)*w; sctx.strokeStyle="#241d18";sctx.beginPath();sctx.moveTo(gx,0);sctx.lineTo(gx,h);sctx.stroke(); sctx.fillText(f<1000?f:(f/1000)+"k",gx,h-3);}
  const grd=sctx.createLinearGradient(0,h,0,0); grd.addColorStop(0,"#8a4d1e"); grd.addColorStop(1,"#f2b56b");
  sctx.fillStyle=grd; sctx.beginPath(); sctx.moveTo(0,h);
  const steps=Math.min(w,600);
  for(let i=0;i<=steps;i++){
    const x=i/steps, f=minF*Math.pow(ny/minF,x), bin=Math.min(bins-1,Math.round(f/ny*bins));
    const db=freqData[bin], v=Math.max(0,(db+100)/100); // -100..0 dB -> 0..1
    sctx.lineTo(x*w,h-v*h*0.96);
  }
  sctx.lineTo(w,h); sctx.closePath(); sctx.fill();
  sctx.strokeStyle="#f2b56b";sctx.globalAlpha=0.7;sctx.beginPath();
  for(let i=0;i<=steps;i++){const x=i/steps,f=minF*Math.pow(ny/minF,x),bin=Math.min(bins-1,Math.round(f/ny*bins));const v=Math.max(0,(freqData[bin]+100)/100);(i?sctx.lineTo:sctx.moveTo).call(sctx,x*w,h-v*h*0.96);}
  sctx.stroke();sctx.globalAlpha=1;
}
function loop(){
  try{
    const now=AC?AC.currentTime:0;
    while(voices.length&&voices[0].end<now-0.1) voices.shift(); // reap
    if(seq.playing&&seq.dur>0){
      const phase=(now-seq.base)%seq.dur;
      if(phase<seq.last) seq.idx=0;                       // wrapped → restart
      while(seq.idx<seq.events.length&&seq.events[seq.idx].t<=phase){const e=seq.events[seq.idx++]; strike(e.x,e.y,e.h);}
      seq.last=phase;
    }
    drawPad(); drawSpec();
  }catch(e){/* never let one bad frame/event kill the render loop */}
  requestAnimationFrame(loop);
}

/* ---------- Pad + keyboard input ---------- */
let lastHit=0;
function padPos(ev){const r=pad.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height))};}
pad.addEventListener("pointerdown",ev=>{ui.down=true;pad.setPointerCapture(ev.pointerId);const p=padPos(ev);ui.px=p.x;ui.py=p.y;strike(p.x,p.y,P.hard);lastHit=performance.now();});
pad.addEventListener("pointermove",ev=>{const p=padPos(ev);ui.px=p.x;ui.py=p.y;if(ui.down&&performance.now()-lastHit>85){strike(p.x,p.y,P.hard);lastHit=performance.now();}});
pad.addEventListener("pointerup",()=>ui.down=false);
const KEYS="asdfghjkl";
window.addEventListener("keydown",ev=>{if(ev.repeat)return;const i=KEYS.indexOf(ev.key.toLowerCase());if(i<0)return;const x=i/(KEYS.length-1)*0.999;ui.px=x;strike(x,ui.py,P.hard);});

/* ---------- Controls wiring ---------- */
function bindSlider(id,key,fmt){
  const el=document.getElementById(id),lab=document.getElementById(fmt.v);
  const set=()=>{el.style.setProperty("--p",((el.value-el.min)/(el.max-el.min)*100)+"%");lab.textContent=fmt.f(P[key]);};
  el.addEventListener("input",()=>{P[key]=parseFloat(el.value);if(key==="wet"&&wetG)wetG.gain.value=P.wet;set();writeHash();});
  el.__set=()=>{el.value=P[key];set();};
  return el;
}
const S={
  hard:bindSlider("hard","hard",{v:"vHard",f:v=>Math.round(v*100)+"%"}),
  inh:bindSlider("inh","inh",{v:"vInh",f:v=>Math.round(v*100)+"%"}),
  damp:bindSlider("damp","damp",{v:"vDamp",f:v=>Math.round(v*100)+"%"}),
  dec:bindSlider("dec","dec",{v:"vDec",f:v=>v.toFixed(2)+"×"}),
  wet:bindSlider("wet","wet",{v:"vWet",f:v=>Math.round(v*100)+"%"}),
  morph:bindSlider("morph","morph",{v:"vMorph",f:v=>Math.round(v*100)+"%"})
};
// material buttons
const matsEl=document.getElementById("mats"),matBEl=document.getElementById("matB");
MATS.forEach(m=>{
  const b=document.createElement("div");b.className="mat";b.textContent=m;b.dataset.m=m;
  b.onclick=()=>{P.mat=m;P.forge=null;syncMats();writeHash();};matsEl.appendChild(b);
  const o=document.createElement("option");o.value=m;o.textContent=m;matBEl.appendChild(o);
});
const forgeBtn=document.createElement("div");forgeBtn.id="forge";forgeBtn.textContent="⚒ Forge material";forgeBtn.onclick=forge;matsEl.appendChild(forgeBtn);
matBEl.onchange=()=>{P.matB=matBEl.value;writeHash();};
function syncMats(){
  [...matsEl.querySelectorAll(".mat")].forEach(b=>b.classList.toggle("on",!P.forge&&b.dataset.m===P.mat));
  forgeBtn.style.borderStyle=P.forge?"solid":"dashed"; forgeBtn.textContent=P.forge?"⚒ Forged ✓":"⚒ Forge material";
  matBEl.value=P.matB;
}
function syncAll(){Object.values(S).forEach(el=>el.__set());syncMats();if(wetG)wetG.gain.value=P.wet;}

// sequencer buttons
const recBtn=document.getElementById("rec"),playBtn=document.getElementById("play"),clrBtn=document.getElementById("clr"),seqinfo=document.getElementById("seqinfo");
function updSeq(){
  const has=seq.events.length>0;
  seqinfo.textContent=has?seq.events.length+" hits"+(seq.dur?" · "+seq.dur.toFixed(1)+"s loop":""):(seq.recording?"":"Record a few hits, then loop.");
  playBtn.disabled=!has; clrBtn.disabled=!has;
}
recBtn.onclick=()=>{
  resume();
  if(!seq.recording){seq.recording=true;seq.events=[];seq.recStart=AC.currentTime;recBtn.classList.add("on");recBtn.textContent="● Stop";playBtn.classList.remove("on");seq.playing=false;seqinfo.textContent="Recording…";}
  else{seq.recording=false;recBtn.classList.remove("on");recBtn.textContent="● Record";
    seq.dur=seq.events.length?Math.max(1,seq.events[seq.events.length-1].t+0.4):0;updSeq();writeHash();
    if(seq.events.length)startPlay();}
};
function startPlay(){resume();if(!seq.events.length)return;if(!seq.dur)seq.dur=Math.max(1,seq.events[seq.events.length-1].t+0.4);seq.playing=true;seq.base=AC.currentTime;seq.idx=0;seq.last=-1;playBtn.classList.add("on");}
playBtn.onclick=()=>{if(seq.playing){seq.playing=false;playBtn.classList.remove("on");}else startPlay();};
clrBtn.onclick=()=>{seq.events=[];seq.dur=0;seq.playing=false;seq.recording=false;recBtn.classList.remove("on");recBtn.textContent="● Record";playBtn.classList.remove("on");updSeq();writeHash();};

/* ---------- URL hash serialize / restore ---------- */
function writeHash(){
  const o={m:P.mat,b:P.matB,mo:+P.morph.toFixed(3),h:+P.hard.toFixed(2),i:+P.inh.toFixed(2),d:+P.damp.toFixed(2),de:+P.dec.toFixed(2),w:+P.wet.toFixed(2)};
  if(P.forge)o.f=P.forge.map(p=>[p.r,p.a,p.d]);
  if(seq.events.length)o.s=[seq.events.map(e=>[e.t,e.x,e.y,e.h]),+seq.dur.toFixed(2)];
  history.replaceState(null,"","#"+encodeURIComponent(JSON.stringify(o)));
}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function readHash(){
  if(location.hash.length<=1)return;
  try{
    const o=JSON.parse(decodeURIComponent(location.hash.slice(1)));
    if(o.m&&PRESETS[o.m])P.mat=o.m; if(o.b&&PRESETS[o.b])P.matB=o.b;
    // [key, min, max] — clamp each restored param into its slider range, ignore non-finite
    [["mo","morph",0,1],["h","hard",0,1],["i","inh",0,1],["d","damp",0,1],["de","dec",0.3,2],["w","wet",0,1]]
      .forEach(([k,key,lo,hi])=>{if(Number.isFinite(o[k]))P[key]=clamp(o[k],lo,hi);});
    if(Array.isArray(o.f)){
      const parts=o.f.filter(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1])&&Number.isFinite(p[2]))
                      .map(p=>({r:p[0],a:p[1],d:p[2]}));
      if(parts.length)P.forge=parts;
    }
    if(o.s&&Array.isArray(o.s[0])){
      seq.events=o.s[0].filter(e=>Array.isArray(e)&&e.every(Number.isFinite))
                       .map(e=>({t:e[0],x:clamp(e[1],0,1),y:clamp(e[2],0,1),h:clamp(e[3],0,1)}));
      seq.dur=Number.isFinite(o.s[1])?o.s[1]:0;
    }
  }catch(e){}
}
document.getElementById("share").onclick=async()=>{
  writeHash();const url=location.href,copied=document.getElementById("copied");
  const fallback=()=>{
    // select the URL in a temp field so the user can copy it manually
    const ta=document.createElement("textarea");
    ta.value=url; ta.style.cssText="position:fixed;left:-9999px;top:0"; document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok=false; try{ok=document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);
    copied.textContent=ok?"✓ copied":"Press Ctrl+C to copy the link";
    copied.title=url;
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(url);copied.textContent="✓ copied";copied.title="";}
    else fallback();
  }catch(e){fallback();}
  setTimeout(()=>{copied.textContent="";copied.title="";},2800);
};

/* ---------- Boot ---------- */
readHash(); resize(); syncAll(); updSeq();
let started=false;
function startEngine(){ if(started)return; started=true; resume(); loop(); }
// draw the UI immediately (before first gesture / AudioContext), then the engine takes over
(function idle(){ if(started)return; drawPad(); requestAnimationFrame(idle); })();
["pointerdown","keydown","touchstart"].forEach(e=>window.addEventListener(e,startEngine,{once:false}));
</script>
