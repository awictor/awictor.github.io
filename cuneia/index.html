<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuneia — a living writing system</title>
<style>
  :root{
    --vellum:#e9dcc0; --vellum2:#ddcaa2; --ink:#2a2013; --ink-soft:#5a4a30;
    --edge:#c8b489; --accent:#8a5a2b; --panel:#f3ead4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    color:var(--ink);
    background:radial-gradient(120% 120% at 30% 0%,#3a3222,#241d12 70%);
    display:flex;justify-content:center;align-items:flex-start;
    padding:22px;gap:22px;min-height:100%;
  }
  .wrap{display:flex;gap:22px;max-width:1240px;width:100%;flex-wrap:wrap;justify-content:center}
  .page{
    background:
      radial-gradient(140% 100% at 80% 110%,rgba(120,90,40,.20),transparent 60%),
      radial-gradient(120% 90% at 10% -10%,rgba(255,250,230,.35),transparent 55%),
      linear-gradient(155deg,var(--vellum),var(--vellum2));
    border-radius:6px;padding:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 60px rgba(120,90,40,.18);
    position:relative;
  }
  .page::after{content:"";position:absolute;inset:14px;border:1px solid var(--edge);
    border-radius:3px;pointer-events:none;mix-blend-mode:multiply;opacity:.6}
  canvas{display:block;border-radius:3px;max-width:100%;height:auto}
  .side{width:296px;min-width:280px;color:var(--vellum);display:flex;flex-direction:column;gap:16px}
  h1{font-size:30px;margin:0;letter-spacing:.04em;color:#f0e4c6;
     text-shadow:0 2px 0 rgba(0,0,0,.4)}
  h1 small{display:block;font-size:12.5px;letter-spacing:.02em;color:#c9b98f;
     font-style:italic;margin-top:5px;font-weight:400}
  textarea{
    width:100%;height:78px;resize:vertical;border-radius:8px;border:1px solid #6b5a38;
    background:#2c2416;color:#f2e7ca;padding:10px 12px;font-family:inherit;font-size:15px;
    line-height:1.4;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
  .card{background:rgba(20,16,9,.5);border:1px solid #5a4a2e;border-radius:10px;padding:13px 14px}
  .card h2{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#d7c393;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{cursor:pointer;border:1px solid #6b5a38;background:#332a19;color:#e9dcbb;
    padding:5px 11px;border-radius:20px;font-size:12.5px;transition:.15s;font-family:inherit}
  .chip:hover{background:#4a3c22;transform:translateY(-1px)}
  .chip:focus-visible,button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip.on{background:var(--accent);border-color:#b98a4e;color:#fff5e2}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px;color:#d8c8a2}
  .row label{width:78px;flex:none}
  .row input[type=range]{flex:1;accent-color:var(--accent)}
  .row span{width:30px;text-align:right;color:#b8a679;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:9px;flex-wrap:wrap}
  button.act{cursor:pointer;flex:1;min-width:88px;border:1px solid #7a6337;border-radius:8px;
    background:linear-gradient(180deg,#4a3a20,#33280f);color:#f3e6c4;padding:10px;font-size:13px;
    font-family:inherit;letter-spacing:.03em;transition:.15s}
  button.act:hover{background:linear-gradient(180deg,#5a4626,#3d3013);transform:translateY(-1px)}
  button.act.hot{background:linear-gradient(180deg,var(--accent),#6d451f);border-color:#c08a4a}
  .seedline{font-size:12px;color:#b09a6b;margin-top:8px;font-style:italic}
  .rosetta{margin-top:2px}
  .foot{font-size:11px;color:#8f7c52;text-align:center;margin-top:2px;line-height:1.5}
  @media(max-width:760px){.side{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="page"><canvas id="page" width="820" height="560"></canvas></div>
    <div class="page rosetta" style="margin-top:20px"><canvas id="rosetta" width="820" height="300"></canvas></div>
  </div>
  <div class="side">
    <h1>Cuneia<small>Type anything &amp; watch it become a whole writing system.</small></h1>
    <textarea id="text" spellcheck="false" placeholder="Type here…"></textarea>
    <div class="card">
      <h2>Named scripts</h2>
      <div class="chips" id="presets"></div>
      <div class="seedline" id="seedline">seed —</div>
    </div>
    <div class="card">
      <h2>Tune this language</h2>
      <div class="row"><label>Curviness</label><input type="range" id="curvy" min="0" max="1" step="0.01"><span id="curvyV"></span></div>
      <div class="row"><label>Cursive</label><input type="range" id="connect" min="0" max="1" step="0.01"><span id="connectV"></span></div>
      <div class="row"><label>Drift</label><input type="range" id="jitter" min="0" max="1" step="0.01"><span id="jitterV"></span></div>
      <div class="row"><label>Ink weight</label><input type="range" id="weight" min="0" max="1" step="0.01"><span id="weightV"></span></div>
      <div class="row"><label>Proportion</label><input type="range" id="aspect" min="0.6" max="1.5" step="0.01"><span id="aspectV"></span></div>
    </div>
    <div class="btns">
      <button class="act hot" id="shuffle">Shuffle civilization</button>
      <button class="act" id="png">Save PNG</button>
      <button class="act" id="share">Copy link</button>
    </div>
    <div class="foot">Same text + seed always render identically.<br>The panel below is this script's full alphabet.</div>
  </div>
</div>
<script>
"use strict";
// ---------- deterministic primitives ----------
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),16777619);}return h>>>0;}
function mulberry32(a){a=a>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// anchor grid (unit box, y: 0=top .. 1=bottom)
const COLS=[0.18,0.5,0.82], ROWS=[0.08,0.36,0.64,0.92];
const GRID=[];for(const y of ROWS)for(const x of COLS)GRID.push([x,y]);

// build a glyph's stroke topology from char + seed (deterministic, style-independent)
const glyphCache={};
function glyphTopology(ch,seed){
  const key=ch+"|"+seed;
  if(glyphCache[key])return glyphCache[key];
  const h=hashStr(ch+"~"+seed), r=mulberry32(h);
  const n=2+(h%3); // 2..4 strokes
  const strokes=[]; let cur=GRID[(h>>>3)%GRID.length];
  for(let k=0;k<n;k++){
    const a=(k>0&&r()<0.55)?cur:GRID[(r()*GRID.length)|0];
    let b=GRID[(r()*GRID.length)|0]; let g=0;
    while((b[0]===a[0]&&b[1]===a[1])&&g++<4)b=GRID[(r()*GRID.length)|0];
    const arc=r()<0.55, bow=(r()*2-1);
    strokes.push({a,b,arc,bow,dot:r()<0.10});
    cur=b;
  }
  if(r()<0.32){ // occasional crossbar
    const y=ROWS[1+((r()*2)|0)];
    strokes.push({a:[0.14,y],b:[0.86,y],arc:false,bow:0,dot:false});
  }
  const wv=0.82+0.34*r(); // slight per-glyph width variance
  const out={strokes,wv};
  glyphCache[key]=out;return out;
}

// ---------- geometry: place a glyph at (penX, baseY) -> render units w/ absolute points ----------
const EMH=34, EMW=27, TOP=0.9; // TOP = fraction of body above baseline
function quad(a,c,b,t){const u=1-t;return[u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]];}
function placeGlyph(ch,penX,baseY,st){
  const g=glyphTopology(ch,st.seed);
  const w=EMW*st.aspect*g.wv;
  const bodyTop=baseY-EMH*TOP;
  const abs=(p)=>[penX+p[0]*w, bodyTop+p[1]*EMH];
  const units=[];
  for(const s of g.strokes){
    const A=abs(s.a), B=abs(s.b);
    if(s.dot){ units.push({kind:"dot",pts:[B]}); continue; }
    if(s.arc){
      const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2, dx=B[0]-A[0],dy=B[1]-A[1];
      const len=Math.hypot(dx,dy)||1, px=-dy/len, py=dx/len;
      const mag=s.bow*st.curvy*len*0.55;
      const C=[mx+px*mag,my+py*mag];
      const pts=[];for(let i=0;i<=10;i++)pts.push(quad(A,C,B,i/10));
      units.push({kind:"path",pts});
    } else units.push({kind:"path",pts:[A,B]});
  }
  return {units,width:w};
}

// ---------- layout the manuscript page ----------
function wobble(i,st){const r=mulberry32(st.seed*131+i*977);return (r()-0.5)*st.jitter*20 + Math.sin(i*0.7+st.seed)*st.jitter*7;}
function layout(text,st,W, x0,y0){
  const pad=x0, top=y0, lineH=EMH*1.95;
  const spaceW=EMW*0.5*st.aspect+7;
  let penX=pad, baseY=top+EMH, ci=0, gi=0, maxY=baseY;
  const units=[]; // each carries .ci (source char index) for reveal-diff
  const paras=text.split("\n");
  for(let pi=0;pi<paras.length;pi++){
    const words=paras[pi].split(" ");
    for(let wi=0;wi<words.length;wi++){
      const word=words[wi];
      // measure word for wrapping
      let ww=0; for(const c of word) ww+=EMW*st.aspect*glyphTopology(c,st.seed).wv;
      if(word.length && penX>pad && penX+ww>W-pad){penX=pad;baseY+=lineH;}
      let prevRight=null;
      for(const c of word){
        const by=baseY+wobble(gi,st);
        if(prevRight&&st.connect>0.42){
          units.push({kind:"path",pts:[prevRight,[penX,by]],ci});
        }
        const pl=placeGlyph(c,penX,by,st);
        for(const u of pl.units){u.ci=ci;units.push(u);}
        prevRight=[penX+pl.width,by];
        penX+=pl.width; gi++; ci++;
        if(by>maxY)maxY=by;
      }
      penX+=spaceW; ci++; prevRight=null;
    }
    penX=pad; baseY+=lineH; ci++;
  }
  return {units,maxY};
}

// ---------- drawing ----------
function inkStyle(ctx,st){
  ctx.strokeStyle="rgba(38,28,15,0.92)";
  ctx.fillStyle="rgba(38,28,15,0.92)";
  ctx.lineWidth=1.3+st.weight*3.6;
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.shadowColor="rgba(60,40,15,0.35)";ctx.shadowBlur=2.2;
}
function drawUnit(ctx,u,frac){
  if(frac<=0)return;
  if(u.kind==="dot"){ if(frac>0.35){const p=u.pts[0];const r=(ctx.lineWidth*0.75);ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill();} return;}
  const pts=u.pts, n=pts.length;
  if(frac>=1){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();return;}
  const fp=frac*(n-1), whole=Math.floor(fp), t=fp-whole;
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<=whole;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  if(whole<n-1){const a=pts[whole],b=pts[whole+1];ctx.lineTo(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t);}
  ctx.stroke();
}
function paintVellum(ctx,w,h){
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,"#efe3c8");g.addColorStop(1,"#dbc79f");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.save();ctx.globalAlpha=0.06;ctx.fillStyle="#5a3d18";
  for(let i=0;i<140;i++){const r=mulberry32(i*2654435761>>>0);ctx.fillRect(r()*w,r()*h,1.4,1.4);}
  ctx.restore();
  // faint rule lines
  ctx.strokeStyle="rgba(120,90,45,0.13)";ctx.lineWidth=1;
  for(let y=64+EMH+8;y<h-10;y+=EMH*1.95){ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-30,y);ctx.stroke();}
}

// ---------- app state ----------
const PRESETS=[
  {name:"Tidewater",   seed:71,  curvy:0.85,connect:0.78,jitter:0.34,weight:0.32,aspect:0.98},
  {name:"Basalt",      seed:22,  curvy:0.10,connect:0.15,jitter:0.10,weight:0.78,aspect:0.86},
  {name:"Vellum Court",seed:108, curvy:0.55,connect:0.60,jitter:0.22,weight:0.44,aspect:1.06},
  {name:"Emberscript", seed:349, curvy:0.92,connect:0.50,jitter:0.40,weight:0.38,aspect:0.90},
  {name:"Runemark",    seed:5,   curvy:0.05,connect:0.05,jitter:0.06,weight:0.60,aspect:0.78},
  {name:"Meridian",    seed:256, curvy:0.48,connect:0.35,jitter:0.18,weight:0.50,aspect:1.18},
];
const DEF_TEXT="Type anything and it becomes\na whole writing system.";
const el=(id)=>document.getElementById(id);
const pageC=el("page"), rosC=el("rosetta");
const pctx=pageC.getContext("2d"), rctx=rosC.getContext("2d");
const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
[[pageC,pctx],[rosC,rctx]].forEach(([c,x])=>{const w=c.width,h=c.height;c.width=w*dpr;c.height=h*dpr;c.style.width=w+"px";c.style.height="auto";x.setTransform(dpr,0,0,dpr,0,0);});
const PW=pageC.width/dpr, PH=pageC.height/dpr, RW=rosC.width/dpr, RH=rosC.height/dpr;

const REDUCE=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
let st={seed:108,curvy:0.55,connect:0.6,jitter:0.22,weight:0.44,aspect:1.06};
let text=DEF_TEXT, laid={units:[],maxY:0}, drawn=0, lastText="", lastKey="", raf=0;

function styleKey(){return [st.seed,st.curvy,st.connect,st.jitter,st.weight,st.aspect].join(",");}
function commonChars(a,b){let i=0;const m=Math.min(a.length,b.length);while(i<m&&a[i]===b[i])i++;return i;}

function rebuild(){
  laid=layout(text,st,PW,44,64);
  const key=styleKey();
  let startIdx=0;
  if(key===lastKey){ // typing/editing same script -> keep prefix, animate the new tail
    const p=commonChars(lastText,text);
    startIdx=laid.units.findIndex(u=>u.ci>=p);
    if(startIdx<0)startIdx=laid.units.length;
  }
  drawn=startIdx; lastText=text; lastKey=key;
  drawRosetta();
  if(REDUCE){ // honor prefers-reduced-motion: paint the finished page, no sweep
    if(raf){cancelAnimationFrame(raf);raf=0;}
    drawn=laid.units.length; render(); return;
  }
  if(!raf)tick(performance.now());
}
let prevT=0;
function tick(now){
  const dt=Math.min(0.05,(now-prevT)/1000)||0; prevT=now;
  const speed=52; // units per second
  drawn=Math.min(laid.units.length,drawn+dt*speed);
  render();
  if(drawn<laid.units.length){raf=requestAnimationFrame(tick);}else{raf=0;}
}
function render(){
  paintVellum(pctx,PW,PH);
  inkStyle(pctx,st);
  // fit long text: if the laid-out content would overflow the page, uniformly
  // scale the drawn glyphs down so everything stays visible instead of vanishing.
  const contentBottom=laid.maxY+EMH*0.4, margin=16, s=Math.min(1,(PH-margin)/contentBottom);
  pctx.save();
  if(s<1)pctx.scale(s,s);
  const full=Math.floor(drawn);
  for(let i=0;i<laid.units.length;i++){
    if(i<full)drawUnit(pctx,laid.units[i],1);
    else if(i===full)drawUnit(pctx,laid.units[i],drawn-full);
    else break;
  }
  pctx.restore();
  if(!text.trim()){pctx.save();pctx.shadowBlur=0;pctx.fillStyle="rgba(90,70,40,0.5)";
    pctx.font="italic 18px Georgia";pctx.fillText("the page waits for your hand…",46,110);pctx.restore();}
}

// Rosetta: full alphabet of the current seed, proving it's a real system
const ROS_CHARS="abcdefghijklmnopqrstuvwxyz0123456789.,!?".split("");
function drawRosetta(){
  paintVellum(rctx,RW,RH);
  rctx.save();rctx.shadowBlur=0;rctx.fillStyle="rgba(90,68,35,0.85)";
  rctx.font="600 12px Georgia";rctx.fillText("R O S E T T A  —  the "+scriptName()+" alphabet",20,22);rctx.restore();
  const cols=10, cw=(RW-40)/cols;
  inkStyle(rctx,st);
  ROS_CHARS.forEach((c,i)=>{
    const cx=20+(i%cols)*cw, row=(i/cols)|0, cy=52+row*58;
    const pl=placeGlyph(c,cx+cw/2-EMW*st.aspect*0.5,cy+EMH*0.7,st);
    for(const u of pl.units)drawUnit(rctx,u,1);
    rctx.save();rctx.shadowBlur=0;rctx.fillStyle="rgba(90,68,35,0.75)";
    rctx.font="11px Georgia";rctx.textAlign="center";
    rctx.fillText(c,cx+cw/2,cy+EMH*0.7+16);rctx.restore();
  });
}
function scriptName(){const p=PRESETS.find(p=>p.seed===st.seed&&Math.abs(p.curvy-st.curvy)<0.001);return p?p.name:("Seed "+st.seed);}

// ---------- controls ----------
function syncSliders(){["curvy","connect","jitter","weight","aspect"].forEach(k=>{el(k).value=st[k];el(k+"V").textContent=(+st[k]).toFixed(2);});
  el("seedline").textContent="seed "+st.seed+" · "+scriptName();
  document.querySelectorAll(".chip").forEach(c=>{const on=+c.dataset.seed===st.seed;c.classList.toggle("on",on);c.setAttribute("aria-pressed",on?"true":"false");});}
function deriveStyle(seed){const r=mulberry32(seed);return{seed,curvy:+r().toFixed(2),connect:+r().toFixed(2),jitter:+(r()*0.5).toFixed(2),weight:+(0.25+r()*0.55).toFixed(2),aspect:+(0.78+r()*0.6).toFixed(2)};}

function apply(){syncSliders();rebuild();pushHash();}
function pushHash(){
  const o={t:text,s:st.seed,st:[st.curvy,st.connect,st.jitter,st.weight,st.aspect]};
  const enc=btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  history.replaceState(null,"","#"+enc);
}
function loadHash(){
  try{const h=location.hash.slice(1);if(!h)return false;
    const o=JSON.parse(decodeURIComponent(escape(atob(h))));
    // structural validation: bail to a preset if the decoded shape is malformed
    if(!o||!Array.isArray(o.st)||o.st.length<5||!Number.isFinite(o.s)
       ||!o.st.slice(0,5).every(Number.isFinite))return false;
    const cl=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
    text=(typeof o.t==="string")?o.t:DEF_TEXT; el("text").value=text;
    st={seed:o.s|0,curvy:cl(o.st[0],0,1),connect:cl(o.st[1],0,1),
        jitter:cl(o.st[2],0,1),weight:cl(o.st[3],0,1),aspect:cl(o.st[4],0.6,1.5)};
    return true;
  }catch(e){return false;}
}

// preset chips
const chipBox=el("presets");
PRESETS.forEach(p=>{const b=document.createElement("button");b.className="chip";b.textContent=p.name;b.dataset.seed=p.seed;
  b.onclick=()=>{st={seed:p.seed,curvy:p.curvy,connect:p.connect,jitter:p.jitter,weight:p.weight,aspect:p.aspect};apply();};chipBox.appendChild(b);});

// slider wiring
["curvy","connect","jitter","weight","aspect"].forEach(k=>{el(k).addEventListener("input",e=>{st[k]=+e.target.value;el(k+"V").textContent=(+st[k]).toFixed(2);rebuild();pushHash();});});

el("text").addEventListener("input",e=>{text=e.target.value;rebuild();pushHash();});
el("shuffle").addEventListener("click",()=>{st=deriveStyle((Math.random()*1e9)>>>0);apply();});
el("png").addEventListener("click",()=>{
  // composite the manuscript page + a seed caption + the Rosetta alphabet into
  // one self-identifying PNG (both canvases share the same pixel width).
  const gap=16*dpr, capH=30*dpr, W=pageC.width, H=pageC.height+gap+capH+rosC.height;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d");
  cx.fillStyle="#241d12";cx.fillRect(0,0,W,H);
  cx.drawImage(pageC,0,0);
  cx.drawImage(rosC,0,pageC.height+gap+capH);
  cx.fillStyle="#cbbb8d";cx.font="italic "+(15*dpr)+"px Georgia";cx.textAlign="left";
  cx.fillText("Cuneia · "+scriptName()+" · seed "+st.seed,10*dpr,pageC.height+gap+21*dpr);
  const a=document.createElement("a");a.download="cuneia-"+st.seed+".png";a.href=cv.toDataURL("image/png");a.click();
});
el("share").addEventListener("click",async()=>{pushHash();const b=el("share");const url=location.href;
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(url);ok=true;}}catch(e){}
  if(!ok){ // insecure-context (e.g. file://) fallback: select into a temp field
    try{const ta=document.createElement("textarea");ta.value=url;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.focus();ta.select();ok=document.execCommand("copy");document.body.removeChild(ta);}catch(e){}
  }
  if(!ok)window.prompt("Copy this link:",url); // last resort: surface it for manual copy
  b.textContent=ok?"Copied!":"Link ready ↑";
  setTimeout(()=>b.textContent="Copy link",1600);});

// ---------- boot ----------
if(loadHash()){el("text").value=text;}else{const p=PRESETS[2];st={seed:p.seed,curvy:p.curvy,connect:p.connect,jitter:p.jitter,weight:p.weight,aspect:p.aspect};el("text").value=text;}
syncSliders();rebuild();
</script>
</body>
</html>
