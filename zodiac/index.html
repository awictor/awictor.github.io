<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zodiac — Star Sign & Chinese Zodiac Finder</title>
<meta name="description" content="Enter a birthdate to get the Western zodiac (star sign) and the Chinese zodiac animal and element. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('zodiac-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#7c3aed;
    --bg:#f6f5f9; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e7e2ee; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#120f18; --card:#1b1622; --fg:#f0ecf5; --muted:#a094ab; --line:#2d2838; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:680px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#5b21b6);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:680px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:1.05rem}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
  @media(max-width:480px){.two{grid-template-columns:1fr}}
  .z{text-align:center;padding:8px}
  .z .sym{font-size:2.6rem}
  .z .name{font-size:1.5rem;font-weight:800;color:var(--c)}
  .z .meta{color:var(--muted);font-size:.85rem}
  .z .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:680px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">♒</div>
    <div><h1>Zodiac</h1><div class="sub">Star sign &amp; Chinese zodiac from a birthdate</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <label for="date">Birthdate</label>
    <input type="date" id="date">
  </div>
  <div class="card">
    <div class="two">
      <div class="z"><div class="lab">Western</div><div class="sym" id="wSym">—</div><div class="name" id="wName">—</div><div class="meta" id="wRange"></div></div>
      <div class="z"><div class="lab">Chinese</div><div class="sym" id="cSym">—</div><div class="name" id="cName">—</div><div class="meta" id="cMeta"></div></div>
    </div>
  </div>
</main>
<footer>
  Chinese zodiac uses the Gregorian year (approximate near the late-Jan/Feb new year). 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/zodiac">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  const BEGIN = [null, 'Aquarius', 'Pisces', 'Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn'];
  const CUTDAY = [null, 20, 19, 21, 20, 21, 21, 23, 23, 23, 23, 22, 22];

  function westernZodiac(month, day){
    if(!(Number.isInteger(month) && month >= 1 && month <= 12)) throw new Error('month must be 1-12');
    if(!(Number.isInteger(day) && day >= 1 && day <= 31)) throw new Error('day must be 1-31');
    if(day >= CUTDAY[month]) return BEGIN[month];
    return month === 1 ? 'Capricorn' : BEGIN[month - 1];
  }

  function chineseZodiac(year){
    if(!Number.isInteger(year)) throw new Error('year must be an integer');
    const animals = ['Rat', 'Ox', 'Tiger', 'Rabbit', 'Dragon', 'Snake', 'Horse', 'Goat', 'Monkey', 'Rooster', 'Dog', 'Pig'];
    const elements = ['Wood', 'Fire', 'Earth', 'Metal', 'Water'];
    const a = ((year - 2020) % 12 + 12) % 12;
    const e = Math.floor(((((year - 1984) % 10) + 10) % 10) / 2);
    return { animal: animals[a], element: elements[e] };
  }

  // ---- UI ----
  const WSYM = { Aries: '♈', Taurus: '♉', Gemini: '♊', Cancer: '♋', Leo: '♌', Virgo: '♍', Libra: '♎', Scorpio: '♏', Sagittarius: '♐', Capricorn: '♑', Aquarius: '♒', Pisces: '♓' };
  const WRANGE = { Aries: 'Mar 21 – Apr 19', Taurus: 'Apr 20 – May 20', Gemini: 'May 21 – Jun 20', Cancer: 'Jun 21 – Jul 22', Leo: 'Jul 23 – Aug 22', Virgo: 'Aug 23 – Sep 22', Libra: 'Sep 23 – Oct 22', Scorpio: 'Oct 23 – Nov 21', Sagittarius: 'Nov 22 – Dec 21', Capricorn: 'Dec 22 – Jan 19', Aquarius: 'Jan 20 – Feb 18', Pisces: 'Feb 19 – Mar 20' };
  const CSYM = { Rat: '🐀', Ox: '🐂', Tiger: '🐅', Rabbit: '🐇', Dragon: '🐉', Snake: '🐍', Horse: '🐎', Goat: '🐐', Monkey: '🐒', Rooster: '🐓', Dog: '🐕', Pig: '🐖' };

  if(typeof document !== 'undefined' && document.getElementById('date')){
    const $ = id => document.getElementById(id);
    function render(){
      const v = $('date').value;
      if(!v){ return; }
      const [y, m, d] = v.split('-').map(Number);
      try{
        const w = westernZodiac(m, d);
        $('wSym').textContent = WSYM[w]; $('wName').textContent = w; $('wRange').textContent = WRANGE[w];
        const c = chineseZodiac(y);
        $('cSym').textContent = CSYM[c.animal]; $('cName').textContent = c.element + ' ' + c.animal; $('cMeta').textContent = 'year ' + y;
      }catch(e){}
    }
    $('date').addEventListener('input', render);
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('zodiac-theme', cur); }catch(e){}
    });
    $('date').value = '1990-07-04';
    render();
  }

  if(typeof module !== 'undefined') module.exports = { westernZodiac, chineseZodiac };
</script>
</body>
</html>
