<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UUIDGen — UUID v4 Generator &amp; Validator</title>
<meta name="description" content="Generate cryptographically-random UUID v4s, in bulk, and validate or inspect any UUID's version and variant. 100% offline, no signup." />
<meta name="theme-color" content="#0369a1" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="UUIDGen — UUID v4 Generator & Validator" />
<meta property="og:description" content="Generate and validate UUIDs — cryptographically random, bulk, version/variant detection. Offline." />
<meta property="og:url" content="https://awictor.github.io/uuid-gen/" />
<link rel="canonical" href="https://awictor.github.io/uuid-gen/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230369a1'/%3E%3Ctext x='32' y='40' font-size='18' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'%3EID%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#eff6fb; --ink:#0c1c26; --accent:#0369a1; --accent-d:#075985;
    --card:#fff; --line:#d3e3ee; --muted:#54707f; --good:#16a34a; --bad:#e5484d; --field:#fff;
    --shadow:0 1px 2px rgba(12,28,38,.05),0 8px 24px rgba(12,28,38,.07); }
  [data-theme="dark"]{ --bg:#08131b; --ink:#e6f0f6; --accent:#38bdf8; --accent-d:#7dd3fc;
    --card:#111e27; --line:#213541; --muted:#8ba3b0; --good:#34c884; --bad:#f0685c; --field:#08131b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .big{font-size:clamp(16px,4.4vw,24px);font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);text-align:center;padding:14px;background:var(--bg);border-radius:11px;word-break:break-all;cursor:pointer}
  .row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  input[type=number]{width:70px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-size:14px;text-align:right}
  input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(3,105,161,.15)}
  textarea{width:100%;min-height:120px;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);color:var(--ink);resize:vertical}
  #msg{font-size:12px;color:var(--muted);align-self:center}
  .valid{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:14px}
  .valid b{font-family:ui-monospace,monospace}
  .pill{font-size:12px;font-weight:700;border-radius:20px;padding:3px 11px}
  .pill.ok{background:rgba(22,163,74,.12);color:var(--good)} .pill.no{background:rgba(229,72,77,.12);color:var(--bad)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("uuidgen.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">UUID</span>Gen</h1>
  <p>Generate cryptographically-random UUID v4s and validate any UUID. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <h2>Generate</h2>
    <div class="big" id="one" title="Click to copy"></div>
    <div class="row">
      <button class="btn primary" id="newBtn">New UUID</button>
      <span style="color:var(--muted);font-size:14px">Bulk:</span>
      <input type="number" id="count" min="1" max="1000" value="10">
      <button class="btn" id="bulkBtn">Generate</button>
      <button class="btn" id="copyBulk">Copy all</button>
      <span id="msg"></span>
    </div>
    <textarea id="bulk" spellcheck="false" readonly placeholder="Bulk UUIDs appear here…"></textarea>
  </section>

  <section class="card">
    <h2>Validate / inspect</h2>
    <input type="text" id="check" spellcheck="false" placeholder="Paste a UUID to validate">
    <div class="valid" id="checkOut"></div>
  </section>
</div>

<footer>
  <b>UUIDGen</b> · offline UUID generator &amp; validator · <a href="https://github.com/awictor/uuid-gen">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  v4 UUIDs use crypto.getRandomValues. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);

// --- Pure UUID logic ---
function generateV4(){
  const b=new Uint8Array(16);
  if(globalThis.crypto&&globalThis.crypto.getRandomValues) globalThis.crypto.getRandomValues(b);
  else for(let i=0;i<16;i++) b[i]=Math.floor(Math.random()*256);
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function isValidUuid(s){ return UUID_RE.test(String(s).trim()); }
function uuidVersion(s){ if(!isValidUuid(s)) return null; const v=parseInt(String(s).trim()[14],16); return v; }
function uuidVariant(s){
  if(!isValidUuid(s)) return null;
  const n=parseInt(String(s).trim()[19],16);
  if((n&0x8)===0) return "NCS (legacy)";
  if((n&0xc)===0x8) return "RFC 4122";
  if((n&0xe)===0xc) return "Microsoft";
  return "reserved";
}
function isNil(s){ return String(s).trim()==="00000000-0000-0000-0000-000000000000"; }

// --- UI ---
function showOne(){ $("one").textContent=generateV4(); }
function copy(v,label){ if(!v)return; const done=()=>{$("msg").textContent="✓ Copied"+(label?" "+label:"");setTimeout(()=>$("msg").textContent="",1300);}; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done,done); else done(); }
function bulk(){ const n=Math.max(1,Math.min(1000,parseInt($("count").value)||10)); const list=[]; for(let i=0;i<n;i++) list.push(generateV4()); $("bulk").value=list.join("\n"); }
function checkOne(){
  const s=$("check").value.trim();
  if(!s){ $("checkOut").innerHTML=""; return; }
  const ok=isValidUuid(s);
  let html=`<span class="pill ${ok?"ok":"no"}">${ok?"Valid UUID":"Not a valid UUID"}</span>`;
  if(ok){
    html+=`<span>Version: <b>${isNil(s)?"nil":uuidVersion(s)}</b></span>`;
    html+=`<span>Variant: <b>${uuidVariant(s)}</b></span>`;
  }
  $("checkOut").innerHTML=html;
}
$("newBtn").onclick=showOne;
$("one").onclick=()=>copy($("one").textContent);
$("bulkBtn").onclick=bulk;
$("copyBulk").onclick=()=>copy($("bulk").value,"all");
$("check").addEventListener("input",checkOne);
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("uuidgen.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
showOne(); bulk();

if(typeof module!=="undefined") module.exports={generateV4,isValidUuid,uuidVersion,uuidVariant,isNil};
</script>
</body>
</html>
