<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChangeMaker — Cash Change & Denomination Breakdown</title>
<meta name="description" content="Break an amount into the fewest bills and coins, or compute change due from a price and cash paid. USD denominations. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('change-maker-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#22c55e;
    --bg:#f4f7f4; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#e2e6e2; --shadow:0 1px 3px rgba(0,0,0,.08); --bad:#dc2626;
  }
  [data-theme="dark"]{
    --bg:#0f130f; --card:#181d18; --fg:#eef4ee; --muted:#93a293; --line:#26302a; --shadow:0 1px 3px rgba(0,0,0,.5); --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:720px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#15803d);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:720px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .modes button{padding:8px 16px;border:0;background:var(--bg);color:var(--fg);cursor:pointer;font:inherit}
  .modes button.on{background:var(--c);color:#fff;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .change{text-align:center;margin:6px 0 12px}
  .change .big{font-size:2.2rem;font-weight:800;color:var(--c)}
  .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .r b{font-variant-numeric:tabular-nums}
  .total{display:flex;justify-content:space-between;padding-top:10px;font-weight:700}
  .err{color:var(--bad);text-align:center}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:720px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">💵</div>
    <div><h1>ChangeMaker</h1><div class="sub">Fewest bills &amp; coins for any amount</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="modes" id="modes">
      <button type="button" data-m="amount">Break down amount</button>
      <button type="button" data-m="change">Change due</button>
    </div>
    <div id="amountFields">
      <label for="amount">Amount ($)</label>
      <input type="number" id="amount" value="2.87" step="0.01" min="0">
    </div>
    <div id="changeFields" style="display:none">
      <div class="grid">
        <div><label for="price">Price ($)</label><input type="number" id="price" value="13.45" step="0.01" min="0"></div>
        <div><label for="paid">Cash paid ($)</label><input type="number" id="paid" value="20" step="0.01" min="0"></div>
      </div>
      <div class="change"><div class="big" id="changeDueOut"></div><div class="sub">change due</div></div>
    </div>
  </div>
  <div class="card">
    <div id="rows"></div>
    <div class="total"><span>Total pieces</span><b id="pieces">—</b></div>
  </div>
</main>
<footer>
  USD denominations, greedy (fewest pieces). 100% offline. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/change-maker">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  const USD = [
    { v: 10000, label: '$100' }, { v: 5000, label: '$50' }, { v: 2000, label: '$20' },
    { v: 1000, label: '$10' }, { v: 500, label: '$5' }, { v: 100, label: '$1' },
    { v: 25, label: '25¢' }, { v: 10, label: '10¢' }, { v: 5, label: '5¢' }, { v: 1, label: '1¢' }
  ];

  function toCents(dollars){ return Math.round(Number(dollars) * 100); }

  function makeChange(cents, denoms = USD){
    if(!Number.isInteger(cents) || cents < 0) throw new Error('amount must be a non-negative integer number of cents');
    let rem = cents;
    const out = [];
    for(const d of denoms){
      const count = Math.floor(rem / d.v);
      if(count > 0){ out.push({ label: d.label, value: d.v, count }); rem -= count * d.v; }
    }
    return out;
  }

  function totalCount(breakdown){ return breakdown.reduce((s, b) => s + b.count, 0); }

  function changeDue(priceCents, paidCents){
    if(paidCents < priceCents) throw new Error('cash paid is less than the price');
    return paidCents - priceCents;
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('rows')){
    const $ = id => document.getElementById(id);
    let mode = 'amount';
    const money = c => '$' + (c / 100).toFixed(2);

    function render(){
      let cents;
      try{
        if(mode === 'amount'){ cents = toCents($('amount').value); }
        else {
          cents = changeDue(toCents($('price').value), toCents($('paid').value));
          $('changeDueOut').textContent = money(cents);
        }
        const b = makeChange(cents);
        $('rows').innerHTML = b.length
          ? b.map(x => `<div class="r"><span>${x.label} × ${x.count}</span><b>${money(x.value * x.count)}</b></div>`).join('')
          : '<div class="r"><span>No change needed</span><b>$0.00</b></div>';
        $('pieces').textContent = totalCount(b);
      }catch(e){
        if(mode === 'change') $('changeDueOut').textContent = '—';
        $('rows').innerHTML = `<div class="err">${e.message}</div>`;
        $('pieces').textContent = '—';
      }
    }

    $('modes').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      mode = b.dataset.m;
      [...$('modes').children].forEach(x => x.classList.toggle('on', x === b));
      $('amountFields').style.display = mode === 'amount' ? '' : 'none';
      $('changeFields').style.display = mode === 'change' ? '' : 'none';
      render();
    });
    $('modes').querySelector('[data-m="amount"]').classList.add('on');
    ['amount', 'price', 'paid'].forEach(id => $(id).addEventListener('input', render));
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('change-maker-theme', cur); }catch(e){}
    });
    render();
  }

  if(typeof module !== 'undefined') module.exports = { USD, toCents, makeChange, totalCount, changeDue };
</script>
</body>
</html>
