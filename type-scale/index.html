<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TypeScale — Modular Typographic Scale Generator</title>
<meta name="description" content="Generate a harmonious modular type scale from a base size and ratio, with px and rem values and a live preview. 100% offline, no signup." />
<meta name="theme-color" content="#db2777" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="TypeScale — Modular Type Scale Generator" />
<meta property="og:description" content="Harmonious font-size scale from a base and ratio, with px/rem and preview. Offline." />
<meta property="og:url" content="https://awictor.github.io/type-scale/" />
<link rel="canonical" href="https://awictor.github.io/type-scale/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23db2777'/%3E%3Ctext x='18' y='44' font-size='34' fill='%23fff' font-family='Georgia,serif' font-weight='bold'%3EA%3C/text%3E%3Ctext x='40' y='44' font-size='18' fill='%23fff' font-family='Georgia,serif' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E" />
<style>
  :root{ --bg:#fdf2f8; --ink:#2a1120; --accent:#db2777; --accent-d:#be185d;
    --card:#fff; --line:#f3dbe8; --muted:#7c5568; --field:#fff;
    --shadow:0 1px 2px rgba(42,17,32,.05),0 8px 24px rgba(42,17,32,.07); }
  [data-theme="dark"]{ --bg:#170912; --ink:#f6e9f0; --accent:#f472b6; --accent-d:#f9a8d4;
    --card:#20111a; --line:#341f2b; --muted:#a9869a; --field:#170912;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .controls label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input[type=number]{width:80px;padding:9px;border:1px solid var(--line);border-radius:9px;text-align:right;background:var(--field);color:var(--ink);font-size:15px}
  select{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(219,39,119,.15)}
  .step{display:flex;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .step .size{width:130px;flex:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted)}
  .step .sample{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("typescale.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Type</span>Scale</h1>
  <p>A harmonious modular font-size scale from a base and ratio. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="controls">
      <label>Base (px)<input id="base" type="number" step="1" value="16"></label>
      <label>Ratio<select id="ratio">
        <option value="1.067">1.067 — Minor second</option>
        <option value="1.125">1.125 — Major second</option>
        <option value="1.2" selected>1.2 — Minor third</option>
        <option value="1.25">1.25 — Major third</option>
        <option value="1.333">1.333 — Perfect fourth</option>
        <option value="1.414">1.414 — Augmented fourth</option>
        <option value="1.5">1.5 — Perfect fifth</option>
        <option value="1.618">1.618 — Golden ratio</option>
      </select></label>
      <label>Steps up<input id="up" type="number" min="0" max="10" value="5"></label>
      <label>Steps down<input id="down" type="number" min="0" max="5" value="2"></label>
    </div>
  </section>
  <section class="card"><div id="scale"></div></section>
</div>

<footer>
  <b>TypeScale</b> · offline modular type scale · <a href="https://github.com/awictor/type-scale">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  size = base × ratio<sup>step</sup>. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};

// --- Pure scale math ---
function modularScale(base,ratio,from,to){
  const out=[];
  for(let s=from;s<=to;s++) out.push({step:s, size:Math.round(base*Math.pow(ratio,s)*100)/100});
  return out;
}

// --- UI ---
function render(){
  const base=num("base"), ratio=parseFloat($("ratio").value)||1.2;
  const up=Math.max(0,Math.min(10,num("up"))), down=Math.max(0,Math.min(5,num("down")));
  try{["base","ratio","up","down"].forEach(k=>localStorage.setItem("typescale."+k,$(k).value));}catch(e){}
  const rows=modularScale(base,ratio,-down,up).reverse();
  $("scale").innerHTML=rows.map(r=>{
    const rem=Math.round(r.size/16*1000)/1000;
    return `<div class="step"><span class="size">${r.size}px · ${rem}rem</span><span class="sample" style="font-size:${Math.min(r.size,80)}px">Ag</span></div>`;
  }).join("");
}
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("typescale.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["base","ratio","up","down"].forEach(k=>{const v=localStorage.getItem("typescale."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={modularScale};
</script>
</body>
</html>
