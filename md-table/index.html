<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MdTable — CSV to Markdown table generator</title>
<meta name="description" content="Free offline Markdown table generator. Paste CSV or TSV (or tab-separated cells from a spreadsheet) and get a clean, aligned GitHub-flavored Markdown table. Works offline, no signup.">
<link rel="canonical" href="https://awictor.github.io/md-table/">
<style>
  :root{
    --c:#075985; --bg:#f6f9fb; --fg:#12212b; --muted:#5c7280;
    --card:#ffffff; --border:#dde8ee; --code:#eaf2f7;
  }
  [data-theme="dark"]{
    --bg:#0e161c; --fg:#e6eef3; --muted:#8ba3b0; --card:#16222b;
    --border:#26363f; --code:#1a2831;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;
    display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--c),#0ea5e9);
    display:grid;place-items:center;color:#fff;font-size:19px;font-weight:700}
  h1{font-size:1.35rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .theme{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--fg);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
  main{max-width:820px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:22px;margin-top:18px}
  label{display:block;font-weight:600;font-size:.85rem;margin:0 0 6px}
  textarea{width:100%;min-height:150px;padding:13px 15px;border:1px solid var(--border);
    border-radius:12px;background:var(--bg);color:var(--fg);font-size:.92rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;line-height:1.5}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:16px 0}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg button{background:var(--bg);border:none;color:var(--fg);padding:8px 14px;
    cursor:pointer;font-size:.86rem;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c);color:#fff}
  .chk{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;cursor:pointer}
  .out-head{display:flex;align-items:center;margin-top:6px}
  .copy{margin-left:auto;background:none;border:1px solid var(--border);
    color:var(--muted);border-radius:8px;padding:5px 13px;cursor:pointer;font-size:.8rem}
  .copy:hover{color:var(--c);border-color:var(--c)}
  pre{background:var(--code);border-radius:12px;padding:15px 16px;margin:8px 0 0;
    overflow-x:auto;font-family:ui-monospace,monospace;font-size:.9rem;line-height:1.55;
    white-space:pre;min-height:1.4em}
  .hint{color:var(--muted);font-size:.82rem;margin:14px 0 0}
  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.84rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<script>
  (function(){var t=localStorage.getItem('mdtable.theme');
   if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))
     document.documentElement.setAttribute('data-theme','dark');})();
</script>
<header>
  <div class="logo">▤</div>
  <div>
    <h1>MdTable</h1>
    <p class="sub">CSV / TSV to Markdown table</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="panel">
    <label for="in">Paste CSV, TSV, or cells copied from a spreadsheet</label>
    <textarea id="in" spellcheck="false" placeholder="Name, Role, Team
Alex, SPS, Strategic Partner Solutions
Sam, Eng, Platform">Name, Role, Team
Alex, SPS, Strategic Partner Solutions
Sam, Eng, Platform</textarea>
    <div class="controls">
      <div>
        <div class="seg" id="align">
          <button data-a="left" class="on">Left</button>
          <button data-a="center">Center</button>
          <button data-a="right">Right</button>
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="header" checked> First row is a header</label>
    </div>
    <div class="out-head">
      <label style="margin:0">Markdown</label>
      <button class="copy" id="copy">Copy</button>
    </div>
    <pre id="out"></pre>
    <p class="hint">Delimiter is auto-detected (tab wins over comma). Quoted fields with commas
      are handled, and <code>|</code> characters are escaped. Everything runs locally.</p>
  </div>
</main>
<footer>
  MdTable is part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a> —
  free, offline, no signup. · <a href="https://github.com/awictor/md-table">Source</a>
</footer>

<script>
// ---- pure functions ----
function parseDelimited(text, delimiter){
  var s = String(text).replace(/\r\n?/g, '\n');
  if(s === '' ) return [];
  if(!delimiter){
    var firstLine = s.split('\n')[0];
    delimiter = firstLine.indexOf('\t') !== -1 ? '\t' : ',';
  }
  var rows = [], row = [], field = '', inQuotes = false;
  for(var i = 0; i < s.length; i++){
    var ch = s[i];
    if(inQuotes){
      if(ch === '"'){
        if(s[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === delimiter){ row.push(field); field = ''; }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += ch;
    }
  }
  row.push(field); rows.push(row);
  if(rows.length > 1){
    var last = rows[rows.length - 1];
    if(last.length === 1 && last[0] === '') rows.pop();
  }
  return rows;
}

function toMarkdownTable(rows, opts){
  opts = opts || {};
  if(!rows || rows.length === 0) return '';
  var cols = rows.reduce(function(m, r){ return Math.max(m, r.length); }, 0);
  var norm = rows.map(function(r){
    var c = r.slice();
    while(c.length < cols) c.push('');
    return c.map(function(x){ return String(x).trim().replace(/\|/g, '\\|'); });
  });
  var align = opts.align || 'left';
  function alignOf(i){ return Array.isArray(align) ? (align[i] || 'left') : align; }
  var widths = [];
  for(var i = 0; i < cols; i++){
    var w = 3;
    norm.forEach(function(r){ if(r[i].length > w) w = r[i].length; });
    widths[i] = w;
  }
  function pad(str, i){
    var a = alignOf(i), gap = widths[i] - str.length;
    if(a === 'right') return repeat(' ', gap) + str;
    if(a === 'center'){ var l = Math.floor(gap / 2); return repeat(' ', l) + str + repeat(' ', gap - l); }
    return str + repeat(' ', gap);
  }
  function sep(i){
    var a = alignOf(i), w = widths[i];
    if(a === 'center') return ':' + repeat('-', w - 2) + ':';
    if(a === 'right')  return repeat('-', w - 1) + ':';
    return repeat('-', w);
  }
  function repeat(ch, n){ return n > 0 ? new Array(n + 1).join(ch) : ''; }

  var hasHeader = opts.header !== false;
  var lines = [];
  var headerRow = hasHeader ? norm[0] : norm[0].map(function(_, i){ return repeat(' ', widths[i]); });
  lines.push('| ' + headerRow.map(function(c, i){ return pad(c, i); }).join(' | ') + ' |');
  lines.push('| ' + widths.map(function(_, i){ return sep(i); }).join(' | ') + ' |');
  var start = hasHeader ? 1 : 0;
  for(var r = start; r < norm.length; r++){
    lines.push('| ' + norm[r].map(function(c, i){ return pad(c, i); }).join(' | ') + ' |');
  }
  return lines.join('\n');
}

function csvToMarkdown(text, opts){
  return toMarkdownTable(parseDelimited(text), opts);
}

if(typeof module !== 'undefined') module.exports = {
  parseDelimited, toMarkdownTable, csvToMarkdown
};

// ---- UI ----
if(typeof document !== 'undefined' && document.getElementById){
  var inEl = document.getElementById('in');
  var outEl = document.getElementById('out');
  var alignEl = document.getElementById('align');
  var headerEl = document.getElementById('header');
  var state = { align: 'left' };

  function render(){
    outEl.textContent = csvToMarkdown(inEl.value,
      { align: state.align, header: headerEl.checked });
    try{
      localStorage.setItem('mdtable.in', inEl.value);
      localStorage.setItem('mdtable.align', state.align);
      localStorage.setItem('mdtable.header', headerEl.checked ? '1' : '0');
    }catch(e){}
  }
  alignEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    state.align = b.getAttribute('data-a');
    [].forEach.call(alignEl.querySelectorAll('button'), function(x){
      x.className = (x === b) ? 'on' : '';
    });
    render();
  });
  headerEl.addEventListener('change', render);
  inEl.addEventListener('input', render);
  document.getElementById('copy').addEventListener('click', function(){
    if(navigator.clipboard) navigator.clipboard.writeText(outEl.textContent);
    this.textContent = 'Copied';
    var b = this; setTimeout(function(){ b.textContent = 'Copy'; }, 1000);
  });
  try{
    var si = localStorage.getItem('mdtable.in'); if(si !== null) inEl.value = si;
    var sa = localStorage.getItem('mdtable.align');
    if(sa){ state.align = sa;
      [].forEach.call(alignEl.querySelectorAll('button'), function(x){
        x.className = (x.getAttribute('data-a') === sa) ? 'on' : ''; }); }
    var sh = localStorage.getItem('mdtable.header'); if(sh !== null) headerEl.checked = sh === '1';
  }catch(e){}
  render();

  var themeBtn = document.getElementById('theme');
  function syncIcon(){
    themeBtn.textContent =
      document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  themeBtn.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(dark){ document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('mdtable.theme','light'); }
    else { document.documentElement.setAttribute('data-theme','dark');
      localStorage.setItem('mdtable.theme','dark'); }
    syncIcon();
  });
}
</script>
</body>
</html>
