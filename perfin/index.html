<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfin — The Imaginary Postage Press</title>
<style>
  :root{
    --paper:#f0e7d2; --album:#3a2c22; --album2:#26201a; --ink:#2b2320;
    --gold:#c9a86a; --hinge:#e9e2cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, #4a382b 0%, var(--album) 55%, var(--album2) 100%);
    color:var(--paper); font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
  }
  #bar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:10px 14px;background:rgba(15,12,9,.55);border-bottom:1px solid rgba(201,168,106,.35);
    position:sticky;top:0;z-index:20;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  #bar .brand{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-size:20px;letter-spacing:.14em;
    color:var(--gold);text-transform:uppercase;font-weight:700;margin-right:6px}
  #bar .brand small{display:block;font-size:9px;letter-spacing:.28em;color:#a99a7f}
  button,input{font-family:inherit;font-size:12px}
  button{
    background:linear-gradient(#5a4636,#3d2e22);color:var(--paper);border:1px solid var(--gold);
    padding:6px 11px;border-radius:4px;cursor:pointer;letter-spacing:.04em;transition:.15s;
  }
  button:hover{background:linear-gradient(#6d5641,#4a3829);color:#fff}
  button:active{transform:translateY(1px)}
  button:focus-visible,#seedIn:focus-visible,.g:focus-visible,.close:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #seedIn{background:#efe6d0;color:#2b2320;border:1px solid var(--gold);padding:6px 8px;border-radius:4px;width:130px}
  .spacer{flex:1}
  #gallery{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:rgba(15,12,9,.35);
    border-bottom:1px solid rgba(201,168,106,.2)}
  #gallery .g{flex:0 0 auto;text-align:center;cursor:pointer;opacity:.85;transition:.15s}
  #gallery .g:hover{opacity:1;transform:translateY(-2px)}
  #gallery .g.active{opacity:1}
  #gallery .g svg{display:block;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  #gallery .g span{font-size:9px;letter-spacing:.05em;color:#c9bda2;display:block;margin-top:2px}
  #page{max-width:1040px;margin:22px auto 60px;padding:0 16px}
  .album-page{
    background:
      linear-gradient(#fbf7ec,#efe4cd);
    border-radius:6px;padding:26px 28px 34px;position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(120,90,55,.25);
    color:#2b2320;
  }
  .album-page:before{content:"";position:absolute;inset:10px;border:1.5px double #b79a63;border-radius:4px;pointer-events:none}
  .scott{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid #7a5c33;padding:0 6px 8px;margin-bottom:16px;gap:10px;flex-wrap:wrap}
  .scott h1{margin:0;font-size:23px;letter-spacing:.02em;font-variant:small-caps;color:#3a2a17}
  .scott .meta{font-size:11px;color:#6b5636;text-align:right;line-height:1.5}
  .scott .cat{font-weight:700;color:#8a3a1e;letter-spacing:.06em}
  #sheet{display:grid;gap:20px 18px;justify-content:center;
    grid-template-columns:repeat(auto-fit,minmax(0,140px))}
  .cell{position:relative;display:flex;justify-content:center}
  .cell .hinge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:34px;height:15px;background:linear-gradient(#f4eede,#ddd2b6);
    border:1px solid #c3b48c;border-bottom:none;border-radius:2px 2px 0 0;opacity:.9;
    box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .cell svg{display:block;cursor:pointer;filter:drop-shadow(0 3px 5px rgba(60,40,20,.35));transition:.15s}
  .cell svg:hover{transform:scale(1.04) rotate(-.4deg)}
  .rarity{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
    background:#8a1e1e;color:#ffe9c9;font-family:Georgia;font-size:8.5px;letter-spacing:.08em;
    padding:2px 7px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.4);
    text-transform:uppercase;font-weight:700;z-index:3}
  .colophon{margin-top:20px;border-top:1px solid #b79a63;padding-top:8px;
    font-size:10.5px;color:#6b5636;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  /* zoom overlay */
  #overlay{position:fixed;inset:0;background:rgba(10,8,6,.86);display:none;
    align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:14px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #overlay.on{display:flex}
  #overlay svg{width:min(80vw,440px);height:auto;filter:drop-shadow(0 12px 30px rgba(0,0,0,.7))}
  #overlay .info{color:var(--paper);text-align:center;max-width:440px;font-size:13px;line-height:1.6}
  #overlay .info b{color:var(--gold);letter-spacing:.05em}
  #overlay .close{position:absolute;top:16px;right:20px}
  .hint{font-size:10px;color:#9a8b70;letter-spacing:.03em}
  /* "hold to light" watermark inspection: backlit paper + boosted contrast */
  .album-page.wm{background:linear-gradient(#fffef6,#fbf6e4);
    box-shadow:0 0 70px rgba(255,243,196,.55) inset,0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(120,90,55,.25)}
  .album-page.wm .cell svg{filter:drop-shadow(0 3px 5px rgba(60,40,20,.25)) contrast(1.16) brightness(1.07) saturate(.9)}
  @media(max-width:560px){#bar .brand small{display:none}#seedIn{width:92px}}
</style>
</head>
<body>
<div id="bar">
  <div class="brand">Perfin<small>The Imaginary Postage Press</small></div>
  <input id="seedIn" placeholder="seed" aria-label="seed">
  <button id="go">Mint</button>
  <button id="newSeed">New Seed</button>
  <button id="prev" title="←">‹ Prev</button>
  <button id="next" title="→">Next ›</button>
  <span class="spacer"></span>
  <button id="postmarks">Postmarks: On</button>
  <button id="watermark">Hold to Light: Off</button>
  <button id="copy">Copy Link</button>
  <button id="svg">Download SVG</button>
  <button id="png">Download PNG</button>
</div>
<div id="gallery"></div>
<div id="page">
  <div class="album-page" id="album">
    <div class="scott">
      <h1 id="issueTitle"></h1>
      <div class="meta" id="issueMeta"></div>
    </div>
    <div id="sheet"></div>
    <div class="colophon" id="colophon"></div>
  </div>
</div>
<div id="overlay">
  <button class="close" id="closeZoom">✕ Close</button>
  <div id="zoomHost"></div>
  <div class="info" id="zoomInfo"></div>
  <div class="hint">Use ← → to browse this issue's stamps · Esc or click background to close</div>
</div>

<script>
"use strict";
/* ---------- deterministic PRNG (mulberry32 over a hashed seed) ---------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return (h>>>0);}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function makeRng(seed){const r=mulberry32(hashStr(seed));return{f:r,i:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)],chance:p=>r()<p};}

/* ---------- word / name generation ---------- */
const SYL1=["Val","Mor","Kar","Bel","Tor","Ser","Lun","Ost","Fen","Cal","Dra","Wen","Zan","Hel","Ish","Mar","Aur","Nov","Gra","Vor","Sil","Tal","Bre","Quen"];
const SYL2=["den","doria","gard","mark","stan","land","vik","holm","port","grad","ovia","alia","esse","onia","burg","ford","reach","mere","haven","fell","strand"];
const PREFIX=["Republic of","Kingdom of","Free State of","Dominion of","Grand Duchy of","Isles of","Protectorate of","Confederation of","Empire of","Commonwealth of"];
const CURR=[["centime","franc","₣"],["pfennig","krone","kr"],["para","dinar","д"],["cent","dollar","$"],["stotinka","lev","лв"],["öre","riksdal","ᴿ"],["fils","real","ℛ"],["groat","sovereign","§"]];
const THEMES=[
  {name:"Maritime Heritage",motifs:["ship","seabird","lighthouse","starcompass"]},
  {name:"Coastal Beacons",motifs:["lighthouse","seabird","ship","mountain"]},
  {name:"Age of Rail",motifs:["locomotive","mountain","wheat","starcompass"]},
  {name:"Royal Portraits",motifs:["monarch","starcompass","wheat","seabird"]},
  {name:"Highland Views",motifs:["mountain","wheat","lighthouse","seabird"]},
  {name:"Harvest & Land",motifs:["wheat","mountain","locomotive","monarch"]},
  {name:"Explorers' Charts",motifs:["starcompass","ship","seabird","lighthouse"]}
];
function titleCase(s){return s.replace(/\b\w/g,c=>c.toUpperCase());}
function makeCountry(R){let base=R.pick(SYL1)+R.pick(SYL2);if(R.chance(.35))base+=R.pick(["ia","a","e","or"]);return {short:titleCase(base),full:R.pick(PREFIX)+" "+titleCase(base)};}

/* ---------- palette (coherent duotone / tritone, contrast-guarded) ---------- */
function hsl(h,s,l){return `hsl(${((h%360)+360)%360} ${s}% ${l}%)`;}
function makePalette(R){
  const baseH=R.i(0,359);
  const paperH=R.i(28,46), paper=hsl(paperH,R.i(28,42),R.i(84,90));
  const inkL=R.i(20,34);
  const ink=hsl(baseH,R.i(45,70),inkL);
  const accent=hsl((baseH+R.pick([150,180,210,-40]))%360,R.i(45,72),R.i(34,46));
  const tri=R.chance(.55);
  const third=tri?hsl((baseH+R.pick([60,-90,120]))%360,R.i(30,55),R.i(40,52)):ink;
  const frameTint=hsl(baseH,R.i(30,50),R.i(30,42));
  return {paper,ink,accent,third,frameTint,tri};
}

/* ---------- parametric motif silhouettes (viewBox 0 0 100 100) ---------- */
const MOTIF={
  ship:c=>`<path d="M12 66 h76 l-10 16 h-56 z" fill="${c}"/><rect x="47" y="20" width="3" height="46" fill="${c}"/><path d="M50 22 L50 58 L80 58 Z" fill="${c}"/><path d="M50 24 L50 56 L24 56 Z" fill="${c}"/><path d="M8 62 q42 -10 84 0" stroke="${c}" stroke-width="2" fill="none"/>`,
  seabird:c=>`<path d="M12 58 Q34 30 50 52 Q66 30 88 58 Q66 46 50 62 Q34 46 12 58 Z" fill="${c}"/><circle cx="50" cy="58" r="3.4" fill="${c}"/>`,
  lighthouse:c=>`<path d="M40 82 L44 34 h12 l4 48 z" fill="${c}"/><rect x="42" y="22" width="16" height="12" fill="${c}"/><path d="M50 12 L44 22 h12 z" fill="${c}"/><path d="M40 82 h20" stroke="${c}" stroke-width="3"/><path d="M44 46 h12 M43 58 h14 M42 70 h16" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`,
  locomotive:c=>`<rect x="16" y="42" width="52" height="26" rx="3" fill="${c}"/><rect x="60" y="30" width="20" height="38" rx="2" fill="${c}"/><rect x="34" y="26" width="9" height="18" fill="${c}"/><circle cx="28" cy="74" r="8" fill="${c}"/><circle cx="52" cy="74" r="8" fill="${c}"/><circle cx="72" cy="74" r="6" fill="${c}"/><path d="M14 68 h70" stroke="${c}" stroke-width="3"/>`,
  monarch:c=>`<path d="M60 22 q-26 0 -26 28 q0 22 12 30 l-2 12 h16 v-10 q22 -8 22 -34 q0 -26 -22 -26 z" fill="${c}"/><path d="M40 24 l4 -10 6 8 6 -10 6 10 6 -8 4 10 z" fill="${c}"/><circle cx="52" cy="46" r="2.4" fill="${c===paperC()?c:'rgba(255,255,255,.4)'}"/>`,
  mountain:c=>`<path d="M8 76 L34 34 L48 56 L62 26 L92 76 Z" fill="${c}"/><path d="M28 42 l6 -8 5 8 -4 3 -3 -3 z" fill="rgba(255,255,255,.55)"/><path d="M56 34 l6 -8 6 10 -5 2 -4 -3 z" fill="rgba(255,255,255,.55)"/>`,
  wheat:c=>`<rect x="48" y="40" width="4" height="42" fill="${c}"/>${[0,1,2,3,4,5].map(i=>`<ellipse cx="${50+(i%2?7:-7)}" cy="${40+i*6}" rx="6" ry="3.6" fill="${c}" transform="rotate(${i%2?35:-35} ${50+(i%2?7:-7)} ${40+i*6})"/>`).join("")}<ellipse cx="50" cy="34" rx="4" ry="6" fill="${c}"/>`,
  starcompass:c=>`<path d="M50 12 L57 43 L88 50 L57 57 L50 88 L43 57 L12 50 L43 43 Z" fill="${c}"/><path d="M50 24 L54 46 L50 50 L46 46 Z" fill="rgba(255,255,255,.4)"/><circle cx="50" cy="50" r="4" fill="${c}"/>`
};
let _paperC="#efe4cd";function paperC(){return _paperC;}
let _cpid=0; // monotonic counter -> globally unique clipPath ids across gallery/sheet/zoom

/* ---------- perforated die-cut edge ---------- */
function perforation(w,h,r,step,col,imperf){
  if(imperf)return `<rect x="1.5" y="1.5" width="${w-3}" height="${h-3}" fill="none" stroke="${col}" stroke-width="1" stroke-dasharray="1 3"/>`;
  let o="";
  const nx=Math.round(w/step),ny=Math.round(h/step),sx=w/nx,sy=h/ny;
  for(let i=0;i<=nx;i++){o+=`<circle cx="${i*sx}" cy="0" r="${r}" fill="${col}"/><circle cx="${i*sx}" cy="${h}" r="${r}" fill="${col}"/>`;}
  for(let j=0;j<=ny;j++){o+=`<circle cx="0" cy="${j*sy}" r="${r}" fill="${col}"/><circle cx="${w}" cy="${j*sy}" r="${r}" fill="${col}"/>`;}
  return o;
}

/* ---------- ornamental engraved frame (layered) ---------- */
function frame(x,y,w,h,pal){
  const inset=(d)=>`x="${x+d}" y="${y+d}" width="${w-2*d}" height="${h-2*d}"`;
  let o=`<rect ${inset(0)} rx="3" fill="none" stroke="${pal.frameTint}" stroke-width="2.4"/>`;
  o+=`<rect ${inset(4)} rx="2" fill="none" stroke="${pal.accent}" stroke-width="1"/>`;
  o+=`<rect ${inset(7)} rx="1" fill="none" stroke="${pal.frameTint}" stroke-width=".8" stroke-dasharray="1.5 1.5"/>`;
  // corner filigree
  const cx=[[x+4,y+4,1,1],[x+w-4,y+4,-1,1],[x+4,y+h-4,1,-1],[x+w-4,y+h-4,-1,-1]];
  o+=cx.map(([px,py,sx,sy])=>`<path d="M${px} ${py+sy*11} q0 ${-sy*11} ${sx*11} ${-sy*11} M${px+sx*3} ${py+sy*4} q${sx*2} ${-sy*2} ${sx*4} ${-sy*2}" stroke="${pal.accent}" stroke-width=".9" fill="none"/><circle cx="${px+sx*4}" cy="${py+sy*4}" r="1.3" fill="${pal.frameTint}"/>`).join("");
  return o;
}

/* ---------- postmark cancellation ---------- */
function postmark(pal,R){
  const cx=R.i(58,86),cy=R.i(20,44),rot=R.i(-25,25);
  const ink="rgba(30,25,20,.62)";
  let bars="";for(let i=-3;i<=3;i++)bars+=`<path d="M${cx-26} ${cy+i*3.4} q13 -3 26 0 q13 3 26 0" stroke="${ink}" stroke-width="1.5" fill="none"/>`;
  return `<g transform="rotate(${rot} ${cx} ${cy})" opacity=".8">${bars}<circle cx="${cx}" cy="${cy}" r="15" fill="none" stroke="${ink}" stroke-width="1.6"/><circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="${ink}" stroke-width="1"/><text x="${cx}" y="${cy-4}" font-size="4.2" fill="${ink}" text-anchor="middle" font-family="Georgia">${R.pick(["POSTE","MAIL","POST","CORREO"])}</text><text x="${cx}" y="${cy+7}" font-size="4.6" fill="${ink}" text-anchor="middle" font-family="Georgia">${R.i(1,28)}·${R.i(1,12)}</text></g>`;
}

/* ---------- single stamp builder ---------- */
const RARE=[
  {k:"invert",badge:"Inverted Vignette",p:.05},
  {k:"imperf",badge:"Imperforate",p:.06},
  {k:"missing",badge:"Missing Color",p:.06},
  {k:"watermark",badge:"Watermark Var.",p:.05}
];
function buildStamp(opt){
  const {pal,motif,country,denom,year,curr,R,cancel,W,H}=opt;
  _paperC=pal.paper;
  const rk=opt.rare&&opt.rare.k; // access the RARE object's key, not the object itself
  const cp="cp"+(_cpid++); // unique clipPath id per render
  const vign=rk==="missing"?pal.paper:(rk==="invert"?pal.accent:(pal.tri?pal.third:pal.ink));
  // motif transform (invert flips vignette)
  const mt=rk==="invert"?`transform="rotate(180 50 52)"`:"";
  const vg=`<g transform="translate(${(W-56)/2},${H*0.30})"><g transform="scale(.56)"><g ${mt}>${MOTIF[motif](vign)}</g></g></g>`;
  const wm=rk==="watermark"?`<text x="${W/2}" y="${H/2+4}" font-size="30" fill="rgba(120,90,55,.13)" text-anchor="middle" font-family="Georgia" transform="rotate(-24 ${W/2} ${H/2})">${country.short.slice(0,2).toUpperCase()}</text>`:"";
  return `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">
    <defs><clipPath id="${cp}"><rect x="0" y="0" width="${W}" height="${H}" rx="2"/></clipPath></defs>
    ${rk==="imperf"?"":perforation(W,H,2.7,10,"#efe4cd",false)}
    <rect x="4" y="4" width="${W-8}" height="${H-8}" rx="2" fill="${pal.paper}"/>
    <g clip-path="url(#${cp})">${wm}</g>
    ${frame(7,7,W-14,H-14,pal)}
    <text x="${W/2}" y="20" font-size="8.5" fill="${pal.ink}" text-anchor="middle" font-family="Georgia" font-weight="bold" letter-spacing=".4">${country.short.toUpperCase()}</text>
    ${vg}
    <text x="14" y="${H-14}" font-size="13" fill="${pal.accent}" font-family="Georgia" font-weight="bold">${denom}</text>
    <text x="${W-14}" y="${H-14}" font-size="8" fill="${pal.ink}" text-anchor="end" font-family="Georgia">${curr}</text>
    <text x="${W/2}" y="${H-6.5}" font-size="6" fill="${pal.frameTint}" text-anchor="middle" font-family="Georgia" letter-spacing=".3">POSTAGE · ${year}</text>
    ${cancel?postmark(pal,R):""}
    ${rk==="imperf"?perforation(W,H,0,10,"",true):""}
  </svg>`;
}

/* ---------- whole-sheet issue generator ---------- */
const W=130,H=160;
let CURRENT=null;
function generateIssue(seed){
  const R=makeRng(seed);
  const pal=makePalette(R);
  const country=makeCountry(R);
  const theme=R.pick(THEMES);
  const curr=R.pick(CURR); // [minor, major, symbol]
  const year=R.i(1858,1949);
  const cols=R.i(3,4), rows=R.i(2,3);
  const total=cols*rows;
  const useMinor=R.chance(.5);
  for(let i=0;i<total;i++)R.pick([1,2,3,5,8,10,15,20,25,50]); // advance PRNG to keep seed output stable
  const catPrefix=country.short.slice(0,3).toUpperCase();
  const catNo=R.i(101,899);
  const stamps=[];
  const postmarksOn=STATE.postmarks;
  for(let i=0;i<total;i++){
    const motif=R.pick(theme.motifs);
    const denom=useMinor?R.pick([1,2,3,4,5,8,10]):R.pick([10,15,20,25,50]);
    let rare=null;
    for(const rr of RARE){if(R.chance(rr.p)){rare=rr;break;}}
    const cancel=postmarksOn&&R.chance(.32)&&(!rare||rare.k!=="watermark");
    stamps.push({id:i,motif,denom:denom+curr[2],curr:curr[0],year,rare,cancel,pal,country,R,W,H});
  }
  const anyRare=stamps.some(s=>s.rare);
  return {seed,pal,country,theme,curr,year,cols,rows,total,catPrefix,catNo,stamps,anyRare};
}

/* ---------- render ---------- */
function svgFor(s){return buildStamp(s);}
function renderIssue(iss){
  CURRENT=iss;
  document.getElementById("issueTitle").textContent=iss.country.full;
  document.getElementById("issueMeta").innerHTML=
    `<span class="cat">${iss.catPrefix} #${iss.catNo}–${iss.catNo+iss.total-1}</span><br>“${iss.theme.name}” Issue · ${iss.year}<br>Perf. 11½ · engraved · seed <b>${iss.seed}</b>`;
  const sheet=document.getElementById("sheet");
  sheet.style.gridTemplateColumns=`repeat(${iss.cols},minmax(0,140px))`;
  sheet.innerHTML="";
  iss.stamps.forEach((s,idx)=>{
    const cell=document.createElement("div");cell.className="cell";
    cell.innerHTML=`<div class="hinge"></div>${svgFor(s)}${s.rare?`<div class="rarity">★ ${s.rare.badge}</div>`:""}`;
    cell.querySelector("svg").addEventListener("click",()=>zoom(iss,idx));
    sheet.appendChild(cell);
  });
  const rareCount=iss.stamps.filter(s=>s.rare).length;
  document.getElementById("colophon").innerHTML=
    `<span>Engraved &amp; printed by the Perfin Press · ${iss.total} varieties · ${iss.curr[1]} currency (${iss.curr[2]})</span>`+
    `<span>${rareCount?`★ ${rareCount} collector error${rareCount>1?"s":""} on this sheet`:"No known varieties — a clean issue"}</span>`;
  const seedIn=document.getElementById("seedIn");if(seedIn.value!==iss.seed)seedIn.value=iss.seed;
  markGallery(iss.seed);
}
let ZOOM=null;      // {iss,idx} currently magnified
let _lastFocus=null; // element to restore focus to on close
function renderZoom(){
  const {iss,idx}=ZOOM;const s=iss.stamps[idx];
  document.getElementById("zoomHost").innerHTML=svgFor(s);
  document.getElementById("zoomInfo").innerHTML=
    `<b>${iss.country.short.toUpperCase()}</b> · ${s.denom} · ${iss.year}<br>`+
    `${iss.theme.name} issue · motif: ${s.motif} · stamp ${idx+1} of ${iss.stamps.length}`+
    `${s.rare?`<br>★ <b>${s.rare.badge}</b> — a rare collector variety`:""}`;
}
function zoom(iss,idx){
  ZOOM={iss,idx};
  _lastFocus=document.activeElement;
  renderZoom();
  document.getElementById("overlay").classList.add("on");
  document.getElementById("closeZoom").focus();
}
function stepZoom(dir){ // browse the CURRENT issue's stamps inside the overlay
  if(!ZOOM)return;
  const n=ZOOM.iss.stamps.length;
  ZOOM.idx=(ZOOM.idx+dir+n)%n;
  renderZoom();
}
function closeZoom(){
  document.getElementById("overlay").classList.remove("on");
  ZOOM=null;
  if(_lastFocus&&_lastFocus.focus)_lastFocus.focus();
}

/* ---------- state + hash sync ---------- */
const STATE={postmarks:true,watermark:false};
function randSeed(){return Math.random().toString(36).slice(2,8);}
function readHash(){const h=decodeURIComponent(location.hash.replace(/^#/,""));return h||null;}
function setSeed(seed,push){
  const s=(seed||"").trim()||randSeed();
  if(push!==false)location.hash=encodeURIComponent(s);
  renderIssue(generateIssue(s));
}
function currentSeed(){return CURRENT?CURRENT.seed:readHash()||randSeed();}

/* ---------- curated gallery ---------- */
const CURATED=["ambergris","meridian","zephyr-9","northreach","tsarina","halcyon","driftwood","cartograph"];
function buildGallery(){
  const g=document.getElementById("gallery");g.innerHTML="";
  CURATED.forEach(seed=>{
    const iss=generateIssue(seed);
    const s=Object.assign({},iss.stamps[0]);
    const el=document.createElement("div");el.className="g";el.dataset.seed=seed;
    el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label",`Load ${iss.country.short} issue`);
    // scaled-down single stamp thumbnail
    const thumb=svgFor(s).replace(/width="\d+" height="\d+"/,'width="52" height="64"');
    el.innerHTML=thumb+`<span>${iss.country.short}</span>`;
    el.addEventListener("click",()=>setSeed(seed));
    el.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();setSeed(seed);}});
    g.appendChild(el);
  });
}
function markGallery(seed){document.querySelectorAll("#gallery .g").forEach(e=>e.classList.toggle("active",e.dataset.seed===seed));}

/* ---------- seed stepping (numeric-ish neighbor by hash) ---------- */
function stepSeed(dir){
  const s=currentSeed();
  // curated seeds walk the catalog in order (wrapping), so stepping is reversible
  const ci=CURATED.indexOf(s);
  if(ci!==-1){setSeed(CURATED[(ci+dir+CURATED.length)%CURATED.length]);return;}
  // otherwise step a trailing numeric suffix (min 1), anchoring bare names at -1
  const m=s.match(/^(.*?)(\d+)$/);
  if(m){setSeed(m[1]+Math.max(1,parseInt(m[2],10)+dir));return;}
  setSeed(s+(dir>0?"-2":"-1"));
}

/* ---------- export ---------- */
function wholeSheetSVG(){
  const iss=CURRENT;const cols=iss.cols,rows=iss.rows;
  const pad=24,gx=18,gy=26,cw=W,ch=H;
  const sw=pad*2+cols*cw+(cols-1)*gx;
  const sh=pad*2+40+rows*ch+(rows-1)*gy;
  let inner="";
  iss.stamps.forEach((s,i)=>{
    const c=i%cols,r=Math.floor(i/cols);
    const x=pad+c*(cw+gx),y=pad+40+r*(ch+gy);
    const one=svgFor(s).replace(/^[\s\S]*?<defs>/,'<defs>').replace(/<\/svg>\s*$/,'');
    inner+=`<g transform="translate(${x},${y})"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" overflow="visible">${one}</svg></g>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sw} ${sh}" width="${sw}" height="${sh}">`+
    `<rect width="${sw}" height="${sh}" fill="#efe4cd"/>`+
    `<rect x="6" y="6" width="${sw-12}" height="${sh-12}" fill="none" stroke="#b79a63" stroke-width="1.5"/>`+
    `<text x="${sw/2}" y="26" font-size="16" fill="#3a2a17" text-anchor="middle" font-family="Georgia" font-weight="bold">${iss.country.full} — ${iss.theme.name} (${iss.year})</text>`+
    inner+`</svg>`;
}
function download(name,data,type){const b=new Blob([data],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function exportSVG(){download(`perfin-${currentSeed()}.svg`,wholeSheetSVG(),"image/svg+xml");}
function exportPNG(){
  const svg=wholeSheetSVG();const img=new Image();
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
  img.onload=()=>{
    const scale=2;const cv=document.createElement("canvas");
    cv.width=img.width*scale;cv.height=img.height*scale;
    const ctx=cv.getContext("2d");ctx.scale(scale,scale);ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    cv.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`perfin-${currentSeed()}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);},"image/png");
  };
  img.onerror=()=>alert("PNG export unavailable in this browser; use Download SVG.");
  img.src=url;
}

/* ---------- controls ---------- */
document.getElementById("go").onclick=()=>setSeed(document.getElementById("seedIn").value);
document.getElementById("seedIn").addEventListener("keydown",e=>{if(e.key==="Enter")setSeed(e.target.value);});
document.getElementById("newSeed").onclick=()=>setSeed(randSeed());
document.getElementById("prev").onclick=()=>stepSeed(-1);
document.getElementById("next").onclick=()=>stepSeed(1);
document.getElementById("postmarks").onclick=e=>{STATE.postmarks=!STATE.postmarks;e.target.textContent="Postmarks: "+(STATE.postmarks?"On":"Off");setSeed(currentSeed(),false);};
document.getElementById("watermark").onclick=e=>{STATE.watermark=!STATE.watermark;document.getElementById("album").classList.toggle("wm",STATE.watermark);e.target.textContent="Hold to Light: "+(STATE.watermark?"On":"Off");};
document.getElementById("copy").onclick=async e=>{try{await navigator.clipboard.writeText(location.href);e.target.textContent="Copied!";setTimeout(()=>e.target.textContent="Copy Link",1200);}catch(_){prompt("Copy this link:",location.href);}};
document.getElementById("svg").onclick=exportSVG;
document.getElementById("png").onclick=exportPNG;
document.getElementById("closeZoom").onclick=closeZoom;
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeZoom();});
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const overlayOpen=document.getElementById("overlay").classList.contains("on");
  if(e.key==="ArrowRight")overlayOpen?stepZoom(1):stepSeed(1);
  else if(e.key==="ArrowLeft")overlayOpen?stepZoom(-1):stepSeed(-1);
  else if(e.key==="Escape"&&overlayOpen)closeZoom();
});
window.addEventListener("hashchange",()=>{const s=readHash();if(s&&(!CURRENT||CURRENT.seed!==s))renderIssue(generateIssue(s));});

/* ---------- boot ---------- */
buildGallery();
setSeed(readHash()||CURATED[0]);
</script>
</body>
