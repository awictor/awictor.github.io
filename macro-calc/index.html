<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MacroCalc — Macronutrient Calculator</title>
<meta name="description" content="Split your daily calories into protein, carb, and fat grams by ratio, with diet presets. 100% offline, no signup." />
<meta name="theme-color" content="#65a30d" />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="MacroCalc — Macronutrient Calculator" />
<meta property="og:description" content="Daily calories → protein/carb/fat grams, with diet presets. Offline." />
<meta property="og:url" content="https://awictor.github.io/macro-calc/" />
<link rel="canonical" href="https://awictor.github.io/macro-calc/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2365a30d'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23fff' stroke-width='8' stroke-dasharray='30 70'/%3E%3C/svg%3E" />
<style>
  :root{ --bg:#f6faef; --ink:#1a2410; --accent:#65a30d; --accent-d:#4d7c0f;
    --card:#fff; --line:#e3edd2; --muted:#5f6f4b; --field:#fff;
    --p:#2563eb; --c:#f59e0b; --f:#e5484d;
    --shadow:0 1px 2px rgba(26,36,16,.05),0 8px 24px rgba(26,36,16,.07); }
  [data-theme="dark"]{ --bg:#0e1407; --ink:#eef4e4; --accent:#a3e635; --accent-d:#bef264;
    --card:#161f0c; --line:#2a3618; --muted:#93a577; --field:#0e1407;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{padding:28px 20px 8px;text-align:center;position:relative}
  header h1{margin:0;font-size:26px;letter-spacing:-.02em} header h1 .m{color:var(--accent)}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  #themeBtn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
  .wrap{max-width:520px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:11px 0;gap:12px}
  .row label{font-size:14px}
  input[type=number]{width:100px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right;background:var(--field);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(101,163,13,.15)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .split input{width:70px}
  .warn{color:var(--f);font-size:13px;font-weight:600;min-height:18px}
  .macro{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
  .macro:last-child{border-bottom:0}
  .macro .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
  .macro b{font-size:20px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  footer a{color:var(--accent-d);text-decoration:none}
</style>
<script>(function(){try{var t=localStorage.getItem("macro.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header>
  <button id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <h1><span class="m">Macro</span>Calc</h1>
  <p>Split your daily calories into protein, carbs, and fat. Runs 100% in your browser.</p>
</header>

<div class="wrap">
  <section class="card">
    <div class="row"><label>Daily calories</label><input id="cal" type="number" step="50" value="2000"></div>
    <div class="chips" id="chips"></div>
    <div class="row split"><label>Protein %</label><input id="p" type="number" value="30"></div>
    <div class="row split"><label>Carbs %</label><input id="c" type="number" value="40"></div>
    <div class="row split"><label>Fat %</label><input id="f" type="number" value="30"></div>
    <div class="warn" id="warn"></div>
  </section>

  <section class="card">
    <div class="macro"><span><span class="dot" style="background:var(--p)"></span>Protein</span><span><b id="pg">—</b> g <span style="color:var(--muted);font-size:13px" id="pk"></span></span></div>
    <div class="macro"><span><span class="dot" style="background:var(--c)"></span>Carbs</span><span><b id="cg">—</b> g <span style="color:var(--muted);font-size:13px" id="ck"></span></span></div>
    <div class="macro"><span><span class="dot" style="background:var(--f)"></span>Fat</span><span><b id="fg">—</b> g <span style="color:var(--muted);font-size:13px" id="fk"></span></span></div>
  </section>
</div>

<footer>
  <b>MacroCalc</b> · offline macronutrient calculator · <a href="https://github.com/awictor/macro-calc">source</a> · <a href="https://awictor.github.io/toolkit/">part of Toolkit</a><br>
  Protein/carbs 4 kcal/g · fat 9 kcal/g. Pair with <a href="https://awictor.github.io/tdee-calc/">TDEECalc</a>. © <span id="yr">2026</span> Alex Wictor · MIT · v0.1.0
</footer>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?0:v;};

// --- Pure macro math ---
function macroGrams(calories, split){
  return {
    protein: calories*(split.p||0)/100/4,
    carbs:   calories*(split.c||0)/100/4,
    fat:     calories*(split.f||0)/100/9
  };
}

// --- UI ---
const PRESETS=[["Balanced",30,40,30],["Low-carb",40,20,40],["High-protein",40,35,25],["Keto",25,5,70]];
function render(){
  const cal=num("cal"), p=num("p"), c=num("c"), f=num("f");
  try{["cal","p","c","f"].forEach(k=>localStorage.setItem("macro."+k,$(k).value));}catch(e){}
  const g=macroGrams(cal,{p,c,f});
  $("pg").textContent=Math.round(g.protein); $("pk").textContent="("+Math.round(cal*p/100)+" kcal)";
  $("cg").textContent=Math.round(g.carbs);   $("ck").textContent="("+Math.round(cal*c/100)+" kcal)";
  $("fg").textContent=Math.round(g.fat);     $("fk").textContent="("+Math.round(cal*f/100)+" kcal)";
  const sum=p+c+f;
  $("warn").textContent = sum===100 ? "" : `⚠ Percentages add up to ${sum}% (should be 100%).`;
}
$("chips").innerHTML=PRESETS.map(([l,p,c,f])=>`<button class="chip" data-p="${p}" data-c="${c}" data-f="${f}">${l}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{$("p").value=ch.dataset.p;$("c").value=ch.dataset.c;$("f").value=ch.dataset.f;render();});
document.querySelectorAll("input[type=number]").forEach(el=>el.addEventListener("input",render));
$("themeBtn").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("macro.theme",t);}catch(e){}$("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
$("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
try{$("yr").textContent=new Date().getFullYear();}catch(e){}
try{["cal","p","c","f"].forEach(k=>{const v=localStorage.getItem("macro."+k);if(v!=null)$(k).value=v;});}catch(e){}
render();

if(typeof module!=="undefined") module.exports={macroGrams};
</script>
</body>
</html>
