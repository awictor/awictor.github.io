<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextGradient — Gradient Text CSS Generator</title>
<meta name="description" content="Generate gradient text: a linear-gradient clipped to text with multiple color stops, angle control, live preview and cross-browser CSS. Fully offline, no signup.">
<script>
  (function(){ try{
    var t = localStorage.getItem('text-gradient-theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){} })();
</script>
<style>
  :root{
    --c:#ec4899;
    --bg:#f8f5f7; --card:#ffffff; --fg:#1a1a1a; --muted:#666; --line:#ecdfe6; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#160f14; --card:#20171d; --fg:#f2eaef; --muted:#a5969f; --line:#33283000; --line:#332830; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--c),#a21caf);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600}
  input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  input[type=range]{width:100%;accent-color:var(--c)}
  .preview{text-align:center;padding:24px 10px;font-size:2.6rem;font-weight:800;word-break:break-word}
  .stops{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .stop{display:flex;align-items:center;gap:4px}
  .stop input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .stop button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:6px 9px;cursor:pointer}
  .add{background:var(--c);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.82rem;margin:14px 0 0;white-space:pre}
  button.act{background:var(--c);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600;margin-top:12px}
  .theme{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
  footer{max-width:820px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🌈</div>
    <div><h1>TextGradient</h1><div class="sub">Gradient text CSS generator</div></div>
  </div>
  <button class="theme" id="themeBtn" type="button">◐ Theme</button>
</header>
<main>
  <div class="card">
    <div class="preview" id="preview">Gradient Text</div>
  </div>
  <div class="card">
    <label for="text">Preview text</label>
    <input type="text" id="text" value="Gradient Text">
    <label style="margin-top:14px">Color stops</label>
    <div class="stops" id="stops"></div>
    <button class="add" id="add" type="button">+ Add color</button>
    <label class="row" style="margin-top:16px"><span>Angle</span><b id="angleV">90°</b></label>
    <input type="range" id="angle" min="0" max="360" value="90">
    <pre id="out"></pre>
    <button class="act" id="copy" type="button">Copy CSS</button>
  </div>
</main>
<footer>
  100% offline. Nothing leaves your browser. Part of the <a href="https://awictor.github.io/toolkit/">Toolkit</a>. <a href="https://github.com/awictor/text-gradient">Source</a>.
</footer>

<script>
  // ---- pure logic ----
  function isHex(c){ return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c); }

  function textGradientCss(o = {}){
    const colors = o.colors || ['#ff6100', '#c026d3'];
    const angle = o.angle == null ? 90 : o.angle;
    if(!Array.isArray(colors) || colors.length < 2) throw new Error('need at least two colors');
    for(const c of colors) if(!isHex(c)) throw new Error('invalid hex color: ' + c);
    const g = `linear-gradient(${angle}deg, ${colors.join(', ')})`;
    return [
      `background: ${g};`,
      '-webkit-background-clip: text;',
      'background-clip: text;',
      '-webkit-text-fill-color: transparent;',
      'color: transparent;'
    ].join('\n');
  }

  // ---- UI ----
  if(typeof document !== 'undefined' && document.getElementById('out')){
    const $ = id => document.getElementById(id);
    let colors = ['#ff6100', '#c026d3'];

    function buildStops(){
      $('stops').innerHTML = '';
      colors.forEach((c, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'stop';
        wrap.innerHTML = `<input type="color" value="${c}" data-i="${i}">` + (colors.length > 2 ? `<button type="button" data-rm="${i}">✕</button>` : '');
        wrap.querySelector('input').addEventListener('input', e => { colors[i] = e.target.value; render(); });
        const rm = wrap.querySelector('button');
        if(rm) rm.addEventListener('click', () => { colors.splice(i, 1); buildStops(); render(); });
        $('stops').appendChild(wrap);
      });
    }

    function render(){
      const angle = +$('angle').value;
      $('angleV').textContent = angle + '°';
      let css;
      try{ css = textGradientCss({ colors, angle }); }catch(e){ return; }
      $('out').textContent = css;
      const p = $('preview');
      p.textContent = $('text').value || 'Gradient Text';
      p.style.background = `linear-gradient(${angle}deg, ${colors.join(', ')})`;
      p.style.webkitBackgroundClip = 'text';
      p.style.backgroundClip = 'text';
      p.style.webkitTextFillColor = 'transparent';
      p.style.color = 'transparent';
    }

    $('add').addEventListener('click', () => { if(colors.length < 6){ colors.push('#0ea5e9'); buildStops(); render(); } });
    $('text').addEventListener('input', render);
    $('angle').addEventListener('input', render);
    $('copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy CSS', 1200); }catch(e){}
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try{ localStorage.setItem('text-gradient-theme', cur); }catch(e){}
    });

    buildStops();
    render();
  }

  if(typeof module !== 'undefined') module.exports = { isHex, textGradientCss };
</script>
</body>
</html>
