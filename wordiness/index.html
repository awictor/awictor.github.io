<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordiness Reducer — cut wordy phrases</title>
<meta name="description" content="Find wordy and redundant phrases in your writing and replace them with concise alternatives. One-click tighten. Offline, no tracking — omit needless words.">
<style>
  :root{
    --c:#b91c1c;
    --bg:#fbf5f4; --card:#ffffff; --fg:#211514; --muted:#786461;
    --line:#efe1df; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.05);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#180f0e; --card:#221614; --fg:#f6eae8; --muted:#b59f9c;
    --line:#3a2724; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{max-width:860px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;
    font-size:22px;color:#fff;flex:0 0 auto}
  h1{font-size:1.4rem;margin:0}
  header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
  .theme{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem}
  main{max-width:860px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--fg);min-height:150px;resize:vertical}
  textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button.act{background:var(--c);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
  .status{margin-top:14px;font-weight:700}
  .status.clean{color:#16a34a} .status.dirty{color:var(--c)}
  .hl{background:rgba(185,28,28,.16);border-radius:3px;padding:0 2px}
  .preview{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);white-space:pre-wrap;line-height:1.7}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
  td.wordy{text-decoration:line-through;color:var(--muted)}
  td.better{color:#16a34a;font-weight:600}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  h2{font-size:1rem;margin:0}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:26px}
  .foot a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="logo">✂️</div>
  <div>
    <h1>Wordiness Reducer</h1>
    <p>Omit needless words</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="card">
    <label for="in">Your text</label>
    <textarea id="in" spellcheck="false">Due to the fact that the report was late, in order to meet the deadline we utilized a large number of resources at this point in time.</textarea>
    <div class="status" id="status"></div>
    <div class="actions">
      <button class="act" id="tighten">Tighten &amp; copy</button>
      <button class="act ghost" id="clear">Clear</button>
    </div>
    <div class="preview" id="preview" style="display:none"></div>
  </div>

  <div class="card" id="report" style="display:none">
    <h2>Suggestions</h2>
    <table>
      <thead><tr><th>Wordy</th><th>Concise</th><th style="text-align:right">Count</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="foot">100% offline · nothing leaves your browser · part of the
    <a href="https://awictor.github.io/toolkit/">Toolkit</a></p>
</main>

<script>
  var PHRASES = [
    ['in spite of the fact that','although'],['despite the fact that','although'],
    ['due to the fact that','because'],['in the event that','if'],
    ['at this point in time','now'],['at the present time','now'],
    ['in the near future','soon'],['a large number of','many'],
    ['a majority of','most'],['the majority of','most'],['has the ability to','can'],
    ['for the purpose of','to'],['in order to','to'],['with regard to','about'],
    ['with reference to','about'],['make a decision','decide'],
    ['take into consideration','consider'],['come to a conclusion','conclude'],
    ['give consideration to','consider'],['in a timely manner','promptly'],
    ['on a regular basis','regularly'],['in the majority of cases','usually'],
    ['a number of','several'],['prior to','before'],['subsequent to','after'],
    ['in addition to','besides'],['first and foremost','first'],
    ['each and every','each'],['end result','result'],['past history','history'],
    ['close proximity','near'],['advance planning','planning'],
    ['absolutely essential','essential'],['utilize','use'],['utilization','use']
  ];
  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function matchCase(sample, replacement){
    if(sample && sample[0] === sample[0].toUpperCase() && sample[0] !== sample[0].toLowerCase()){
      return replacement.charAt(0).toUpperCase() + replacement.slice(1);
    }
    return replacement;
  }
  // longest phrases first so overlaps resolve correctly
  var SORTED = PHRASES.slice().sort(function(a, b){ return b[0].length - a[0].length; });

  function findWordy(text){
    var out = [];
    SORTED.forEach(function(pair){
      var re = new RegExp('\\b' + escapeRe(pair[0]).replace(/ /g, '\\s+') + '\\b', 'gi');
      var m;
      while((m = re.exec(text)) !== null){
        out.push({ phrase: pair[0], suggestion: pair[1], index: m.index, matched: m[0] });
        if(m.index === re.lastIndex) re.lastIndex++;
      }
    });
    return out.sort(function(a, b){ return a.index - b.index; });
  }
  function tighten(text){
    var s = String(text);
    SORTED.forEach(function(pair){
      var re = new RegExp('\\b' + escapeRe(pair[0]).replace(/ /g, '\\s+') + '\\b', 'gi');
      s = s.replace(re, function(m){ return matchCase(m, pair[1]); });
    });
    return s;
  }
  function summarize(text){
    var found = findWordy(text), counts = {};
    found.forEach(function(f){ counts[f.phrase] = counts[f.phrase] || { phrase: f.phrase, suggestion: f.suggestion, count: 0 }; counts[f.phrase].count++; });
    return { total: found.length, items: Object.keys(counts).map(function(k){ return counts[k]; }) };
  }

  if(typeof module !== 'undefined') module.exports = { findWordy:findWordy, tighten:tighten, summarize:summarize, PHRASES:PHRASES };

  // ---- UI ----
  if(typeof document !== 'undefined'){
    var inp=document.getElementById('in'), status=document.getElementById('status'), preview=document.getElementById('preview');
    var report=document.getElementById('report'), rows=document.getElementById('rows');
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function render(){
      var text=inp.value, found=findWordy(text), s=summarize(text);
      if(!text){ status.textContent=''; status.className='status'; preview.style.display='none'; report.style.display='none'; return; }
      if(s.total===0){ status.textContent='✓ Concise — no wordy phrases found.'; status.className='status clean'; preview.style.display='none'; report.style.display='none'; return; }
      status.textContent='✂ ' + s.total + ' wordy phrase' + (s.total>1?'s':'') + ' found.';
      status.className='status dirty';
      // highlight (non-overlapping, left to right)
      var html='', last=0;
      found.forEach(function(f){
        if(f.index < last) return;
        html += esc(text.slice(last, f.index)) + '<span class="hl" title="→ ' + esc(f.suggestion) + '">' + esc(f.matched) + '</span>';
        last = f.index + f.matched.length;
      });
      html += esc(text.slice(last));
      preview.innerHTML = html; preview.style.display='block';
      rows.innerHTML = s.items.map(function(it){
        return '<tr><td class="wordy">' + esc(it.phrase) + '</td><td class="better">' + esc(it.suggestion) + '</td><td class="n">' + it.count + '</td></tr>';
      }).join('');
      report.style.display='block';
    }
    inp.addEventListener('input', render);
    document.getElementById('tighten').addEventListener('click', function(){ inp.value=tighten(inp.value); render(); if(navigator.clipboard) navigator.clipboard.writeText(inp.value); });
    document.getElementById('clear').addEventListener('click', function(){ inp.value=''; render(); });

    var root=document.documentElement, btn=document.getElementById('theme');
    function setTheme(t){ root.setAttribute('data-theme',t); btn.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('wordy-theme',t);}catch(e){} }
    var saved; try{ saved=localStorage.getItem('wordy-theme'); }catch(e){}
    setTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    btn.addEventListener('click', function(){ setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });

    render();
  }
</script>
</body>
</html>
