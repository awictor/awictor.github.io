<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Steps — interpolate a palette between two colors</title>
<meta name="description" content="Generate a palette of evenly-spaced colors between two hex colors. Pick the number of steps, copy the list. Great for scales and data-viz. Offline, no tracking.">
<style>
  :root{
    --c:#d946ef;
    --bg:#faf5fb; --card:#ffffff; --fg:#1d1322; --muted:#6f6178;
    --line:#efe0f1; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.05);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#160e18; --card:#201524; --fg:#f3eaf5; --muted:#ac9bb3;
    --line:#352640; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{max-width:820px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;
    font-size:22px;color:#fff;flex:0 0 auto}
  h1{font-size:1.4rem;margin:0}
  header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
  .theme{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem}
  main{max-width:820px;margin:0 auto;padding:12px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
  .ctl{flex:0 0 auto}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px}
  .colorline{display:flex;gap:8px;align-items:center}
  input[type=color]{width:44px;height:42px;padding:0;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer}
  input[type=text]{width:110px;font:inherit;font-family:ui-monospace,monospace;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}
  input[type=range]{width:180px;accent-color:var(--c);vertical-align:middle}
  .swatches{display:flex;flex-wrap:wrap;gap:0;margin-top:18px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .sw{flex:1 1 0;min-width:54px;height:90px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative}
  .sw span{font-family:ui-monospace,monospace;font-size:.72rem;padding:3px 4px;border-radius:5px 5px 0 0;background:rgba(255,255,255,.85);color:#111}
  .out{margin-top:14px}
  textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:70px;resize:vertical}
  .copy{margin-top:8px;background:var(--c);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
  .note{color:var(--muted);font-size:.86rem}
  h2{font-size:1rem;margin:0 0 8px}
  .foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:26px}
  .foot a{color:var(--c)}
</style>
</head>
<body>
<header>
  <div class="logo">🖍️</div>
  <div>
    <h1>Color Steps</h1>
    <p>Interpolate a palette between two colors</p>
  </div>
  <button class="theme" id="theme" title="Toggle theme">🌙</button>
</header>
<main>
  <div class="card">
    <div class="controls">
      <div class="ctl"><label>From</label><div class="colorline"><input type="color" id="p1" value="#f97316"><input type="text" id="h1" value="#f97316" spellcheck="false"></div></div>
      <div class="ctl"><label>To</label><div class="colorline"><input type="color" id="p2" value="#4f46e5"><input type="text" id="h2" value="#4f46e5" spellcheck="false"></div></div>
      <div class="ctl"><label>Steps: <span id="nEcho">7</span></label><input type="range" id="n" min="2" max="20" value="7"></div>
    </div>
    <div class="swatches" id="swatches"></div>
    <div class="out">
      <textarea id="list" readonly></textarea>
      <button class="copy" id="copy">Copy list</button>
    </div>
    <p class="note" style="margin-top:8px">Tap a swatch to copy its hex. Interpolation is linear in sRGB (simple and predictable); for perceptually even scales, tweak endpoints or use more steps.</p>
  </div>

  <p class="foot">100% offline · nothing leaves your browser · part of the
    <a href="https://awictor.github.io/toolkit/">Toolkit</a></p>
</main>

<script>
  function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
  function hexToRgb(hex){
    var h = String(hex).trim().replace(/^#/, '');
    if(/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(function(c){ return c + c; }).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) throw new Error('hex must be #RGB or #RRGGBB');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function rgbToHex(r, g, b){
    return '#' + [r,g,b].map(function(x){ return clamp(Math.round(x),0,255).toString(16).padStart(2,'0'); }).join('');
  }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function colorSteps(hex1, hex2, n){
    n = Math.round(Number(n));
    if(!(n >= 2)) throw new Error('steps must be at least 2');
    var a = hexToRgb(hex1), b = hexToRgb(hex2), out = [];
    for(var i = 0; i < n; i++){
      var t = i / (n - 1);
      out.push(rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)));
    }
    return out;
  }

  if(typeof module !== 'undefined') module.exports = { hexToRgb:hexToRgb, rgbToHex:rgbToHex, lerp:lerp, colorSteps:colorSteps };

  // ---- UI ----
  if(typeof document !== 'undefined'){
    var p1=document.getElementById('p1'), h1=document.getElementById('h1'), p2=document.getElementById('p2'), h2=document.getElementById('h2');
    var n=document.getElementById('n'), swatches=document.getElementById('swatches'), list=document.getElementById('list');
    function render(){
      document.getElementById('nEcho').textContent = n.value;
      try{
        var cols = colorSteps(h1.value, h2.value, n.value);
        swatches.innerHTML = cols.map(function(c){
          return '<div class="sw" data-c="' + c + '" style="background:' + c + '"><span>' + c + '</span></div>';
        }).join('');
        list.value = cols.join(', ');
        swatches.querySelectorAll('.sw').forEach(function(el){
          el.addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText(el.getAttribute('data-c')); });
        });
      }catch(e){ swatches.innerHTML=''; list.value=''; }
    }
    function sync(pick, txt){ try{ var rgb=hexToRgb(txt.value); pick.value=rgbToHex(rgb[0],rgb[1],rgb[2]); }catch(e){} render(); }
    h1.addEventListener('input', function(){ sync(p1,h1); });
    h2.addEventListener('input', function(){ sync(p2,h2); });
    p1.addEventListener('input', function(){ h1.value=p1.value; render(); });
    p2.addEventListener('input', function(){ h2.value=p2.value; render(); });
    n.addEventListener('input', render);
    document.getElementById('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText(list.value); });

    var root=document.documentElement, btn=document.getElementById('theme');
    function setTheme(t){ root.setAttribute('data-theme',t); btn.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('colorsteps-theme',t);}catch(e){} }
    var saved; try{ saved=localStorage.getItem('colorsteps-theme'); }catch(e){}
    setTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'));
    btn.addEventListener('click', function(){ setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });

    render();
  }
</script>
</body>
</html>
